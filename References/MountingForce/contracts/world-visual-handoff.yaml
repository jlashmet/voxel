      dominant_named_area_confidence: inferred_from_level_names

hard_generator_rules:
  - id: visual_assets_are_not_topology
    statement: >-
      Tileset/image/music co-usage must never create, remove, or invalidate a hard physical or
      story edge. Topology remains governed by the traversal/story contracts.
  - id: preserve_or_intentionally_remap_special_sets
    statement: >-
      Forest Maze, Fairy Village Treehouse, and Mountains have verified unique embedded visual
      sets. A replacement generator may substitute new assets, but should do so deliberately
      rather than accidentally flattening these authored visual outliers into the generic set.
  - id: compact_palette_is_a_generation_opportunity
    statement: >-
      The authored world relies heavily on four shared external tilesets. A procedural rebuild
      can therefore expose a small palette/material abstraction and map many generated level
      archetypes onto it, while still supporting custom palettes for exceptional spaces.
  - id: asset_resolution_is_regression_checked
    statement: >-
      The current source has zero missing packaged maps, tilesets, images, or background-music
      references. Future source changes should keep tools/validate-world-visual-assets.py green.

recommended_procgen_abstraction:
  palette_interface:
    required_capabilities:
      - assign one or more reusable visual/material palettes to a generated level
      - allow multiple palette layers in one level
      - allow a level-specific custom palette override
      - keep visual palette selection independent from hard traversal graph generation
      - allow music/aesthetic tags to influence scoring without becoming topology constraints
  migration_strategy:
    - first reproduce authored palette signatures from docs/world-visual-assets.yaml
    - then replace original PNG/TSX assets with new materials/textures behind the same palette abstraction if desired
    - preserve special visual outliers explicitly while allowing incidental geometry to change
