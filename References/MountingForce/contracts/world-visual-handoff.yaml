    Music reuse is useful aesthetic/region guidance but does not prove physical adjacency,
    political region membership, biome boundaries, or travel distance.
  notable_usage_groups:
    - track: PleasantCreekLoop.mp3
      authored_level_count: 17
      dominant_named_area: Kentridge and related interiors
      dominant_named_area_confidence: inferred_from_level_names
    - track: hightown.mp3
      authored_level_count: 9
      dominant_named_area: Hightown and related interiors
      dominant_named_area_confidence: inferred_from_level_names
    - track: CastleTheme.mp3
      authored_level_count: 6
      dominant_named_area: Rossdam and related interiors
      dominant_named_area_confidence: inferred_from_level_names
    - track: EnchantedFestivalLoop.mp3
      authored_level_count: 7
      dominant_named_area: Moordell and related interiors
      dominant_named_area_confidence: inferred_from_level_names
    - track: orc-music.mp3
      authored_level_count: 5
      dominant_named_area: Orc Village and related interiors
      dominant_named_area_confidence: inferred_from_level_names
    - track: Caketown_1.mp3
      authored_level_count: 8
