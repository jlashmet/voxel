schema_version: 1
status: usable_verified_visual_asset_inventory
purpose: >-
  Generator-facing interpretation of the original Mounting Force visual asset usage. This
  separates verified authored asset references from optional palette/biome interpretation so
  a procedural generator can reuse, substitute, or remap the original visual language without
  turning tileset co-usage into false geography constraints.

source: docs/world-visual-assets.yaml
validator: tools/validate-world-visual-assets.py

verified_summary:
  packaged_level_count: 99
  indexed_level_count: 99
  distinct_tileset_reference_count: 7
  distinct_image_asset_count: 7
  distinct_background_music_reference_count: 11
  exact_tileset_signature_group_count: 17
  missing_tmx_count: 0
  missing_or_unparseable_tileset_reference_count: 0
  missing_image_reference_count: 0
  missing_music_reference_count: 0

