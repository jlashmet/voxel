name: Agent one-shot owned discovery patch

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch solid discovery ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          text = path.read_text()
          start_marker = '        internal int DiscoverSurfaceBricks(IReadOnlyList<int3> worldBricks)\n        {'
          end_marker = '\n\n        /// <summary>\n        /// Invalidates chunks touched by an authoritative voxel change.'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        internal int DiscoverSurfaceBricks(IReadOnlyList<int3> worldBricks)
        {
            if (worldBricks == null) return 0;
            int admitted = 0;

            for (int i = 0; i < worldBricks.Count; i++)
            {
                int3 brick = worldBricks[i];
                int3 chunk = new(FloorDiv(brick.x, BricksPerAxis),
                                 FloorDiv(brick.y, BricksPerAxis),
                                 FloorDiv(brick.z, BricksPerAxis));
                if (!OwnsShard(chunk) || _known.Contains(chunk)) continue;
                if (!TrackKnown(chunk)) continue;

                // Discovery establishes authoritative source state for the chunk that owns the
                // surface brick. It is not mutation invalidation: admitting halo-only neighbours
                // here can create chunks whose owned core is entirely non-resident (for example
                // step-4 y=-1 beneath the showcase's deliberate y>=0 surface residency), causing
                // exact snapshot admission to retry a required core pin forever. Border changes
                // still expand to face/edge/corner neighbours in InvalidateSurfaceBricks below.
                _desiredVersions[chunk] = ++_versionCounter;
                admitted++;
            }
            return admitted;
        }'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Amend staging commit into production patch
        shell: bash
        run: |
          rm .github/workflows/agent-one-shot-owned-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --amend -m "fix(rendering): keep surface discovery to owned chunks"
          git push --force-with-lease origin HEAD:feature/voxel-showcase-rendering-repair-v2
