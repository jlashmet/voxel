name: Net ownership static final
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-ownership-static-final.yml]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          NET=Assets/VoxelEngine/Net/Runtime
          RES="$NET/Server/RegionResidency.cs"
          test -f "$RES"
          grep -q 'using VoxelEngine.Streaming.Api;' "$RES"
          grep -q 'IRegionStreaming streaming' "$RES"
          grep -q 'streaming.Evict(coord)' "$RES"
          grep -q 'streaming.QueueLoad(new RegionLoadRequest' "$RES"
          ! grep -RInE 'RegionTable|BrickPool|BrickRef|VoxelAccess' "$NET" --include='*.cs'
          ! grep -RIn 'using VoxelEngine.Core.Storage;' "$NET" --include='*.cs'

          grep -RIl 'IRegionSnapshotSource' "$NET" --include='*.cs' | grep -q .
          grep -RIl 'IRegionSnapshotMutationStore' "$NET" --include='*.cs' | grep -q .
          grep -RIl 'RegionSemanticSnapshot' "$NET" --include='*.cs' | grep -q .
          ! grep -RInE 'SemanticRegionSnapshotCodec|SemanticRegionHasher|RegionSnapshotStore' "$NET" --include='*.cs'

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Assets/VoxelEngine/Net/Runtime/VoxelEngine.Net.Runtime.asmdef')
          refs=set(json.loads(p.read_text())['references'])
          forbidden={r for r in refs if r.endswith('.Runtime') and r != 'VoxelEngine.Net.Runtime'}
          if forbidden:
              raise SystemExit(f'foreign Runtime refs: {sorted(forbidden)}')
          required={'VoxelEngine.Net.Api','VoxelEngine.Storage.Api','VoxelEngine.Streaming.Api','VoxelEngine.Edits.Api'}
          missing=required-refs
          if missing:
              raise SystemExit(f'missing API refs: {sorted(missing)}')
          print('Net residency/snapshot ownership gate passed')
          PY
