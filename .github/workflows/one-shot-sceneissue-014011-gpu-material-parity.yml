name: One-shot SceneIssue 014011 GPU coarse material parity

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-gpu-material-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          fetch-depth: 0
      - name: Port coarse exposed-material correction to GPU density field
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          density_path = Path('Assets/VoxelEngine/Rendering/Resources/VoxelBrickDensity.hlsl')
          compute_path = Path('Assets/VoxelEngine/Rendering/Resources/VoxelBrickMesher.compute')
          test_path = Path('Assets/Tests/EditMode/GpuLod2CutoverPolicyTests.cs')

          density = density_path.read_text()
          compute = compute_path.read_text()
          tests = test_path.read_text()

          marker = '''float SampleField(int3 p, out uint dominantMaterial, out uint dominantSurface,\n                  out uint dominantBoundary)\n{\n'''
          helper = '''// Coarse lattice samples can sit below the actually exposed voxel. Match the CPU density job's\n// crossing-ray correction so LOD2 does not turn buried material depth into coarse colour bands.\nvoid ConsiderCrossingRay(int3 p, int3 direction, int sourceStep,\n                         uint centreMaterial, uint centreSurface,\n                         inout int bestDistance, inout uint dominantMaterial,\n                         inout uint dominantSurface)\n{\n    uint farSurface, farBoundary;\n    uint farMaterial = ReadMaterial(p + direction * sourceStep, farSurface, farBoundary);\n    if (IsSolidSample(farMaterial)) return;\n\n    uint lastMaterial = centreMaterial;\n    uint lastSurface = centreSurface;\n    for (int distance = 1; distance < sourceStep; distance++)\n    {\n        uint surface, boundary;\n        uint material = ReadMaterial(p + direction * distance, surface, boundary);\n        if (!IsSolidSample(material))\n        {\n            int exposedDistance = distance - 1;\n            if (exposedDistance < bestDistance)\n            {\n                bestDistance = exposedDistance;\n                dominantMaterial = lastMaterial;\n                dominantSurface = lastSurface;\n            }\n            return;\n        }\n\n        lastMaterial = material;\n        lastSurface = ResolveSurface(material, surface);\n    }\n\n    int finalDistance = sourceStep - 1;\n    if (finalDistance < bestDistance)\n    {\n        bestDistance = finalDistance;\n        dominantMaterial = lastMaterial;\n        dominantSurface = lastSurface;\n    }\n}\n\nvoid PreferNearestCrossingSurfaceMaterial(int3 p, int sourceStep,\n                                          uint centreMaterial, uint centreSurface,\n                                          inout uint dominantMaterial,\n                                          inout uint dominantSurface)\n{\n    int bestDistance = sourceStep;\n    ConsiderCrossingRay(p, int3( 1, 0, 0), sourceStep, centreMaterial, centreSurface, bestDistance, dominantMaterial, dominantSurface);\n    ConsiderCrossingRay(p, int3(-1, 0, 0), sourceStep, centreMaterial, centreSurface, bestDistance, dominantMaterial, dominantSurface);\n    ConsiderCrossingRay(p, int3(0,  1, 0), sourceStep, centreMaterial, centreSurface, bestDistance, dominantMaterial, dominantSurface);\n    ConsiderCrossingRay(p, int3(0, -1, 0), sourceStep, centreMaterial, centreSurface, bestDistance, dominantMaterial, dominantSurface);\n    ConsiderCrossingRay(p, int3(0, 0,  1), sourceStep, centreMaterial, centreSurface, bestDistance, dominantMaterial, dominantSurface);\n    ConsiderCrossingRay(p, int3(0, 0, -1), sourceStep, centreMaterial, centreSurface, bestDistance, dominantMaterial, dominantSurface);\n}\n\nfloat SampleField(int3 p, int sourceStep, out uint dominantMaterial, out uint dominantSurface,\n                  out uint dominantBoundary)\n{\n'''
          if density.count(marker) != 1:
              raise SystemExit(f'expected one SampleField signature, found {density.count(marker)}')
          density = density.replace(marker, helper, 1)

          old_return = '''    mass += AddTap(p + int3( 0, 0,-2), far, centreSolid, centreStyle, dominantMaterial, dominantSurface);\n\n    return mass - 0.5 + (centreSolid ? CoatingDisplacement(centreSurface) : 0.0);\n'''
          new_return = '''    mass += AddTap(p + int3( 0, 0,-2), far, centreSolid, centreStyle, dominantMaterial, dominantSurface);\n\n    if (centreSolid && sourceStep > 1)\n        PreferNearestCrossingSurfaceMaterial(\n            p, sourceStep, centre, centreSurface, dominantMaterial, dominantSurface);\n\n    return mass - 0.5 + (centreSolid ? CoatingDisplacement(centreSurface) : 0.0);\n'''
          if density.count(old_return) != 1:
              raise SystemExit(f'expected one SampleField return target, found {density.count(old_return)}')
          density = density.replace(old_return, new_return, 1)

          old_call = '''    _DensityWrite[index] = SampleField(p, material, surface, boundary);\n'''
          new_call = '''    _DensityWrite[index] = SampleField(p, _SourceStep, material, surface, boundary);\n'''
          if compute.count(old_call) != 1:
              raise SystemExit(f'expected one GPU SampleField call, found {compute.count(old_call)}')
          compute = compute.replace(old_call, new_call, 1)

          old_using = '''using NUnit.Framework;\n'''
          new_using = '''using System.IO;\nusing NUnit.Framework;\n'''
          if tests.count(old_using) != 1:
              raise SystemExit('expected NUnit using once')
          tests = tests.replace(old_using, new_using, 1)

          insertion = '''\n        [Test]\n        public void SceneIssue20260823014011920GpuLod2CarriesInnerTransitionFaceMask()\n'''
          test_block = '''\n        [Test]\n        public void SceneIssue20260823014011920GpuLod2PortsCoarseExposedMaterialCorrection()\n        {\n            string densityShader = File.ReadAllText(\n                "Assets/VoxelEngine/Rendering/Resources/VoxelBrickDensity.hlsl");\n            string mesher = File.ReadAllText(\n                "Assets/VoxelEngine/Rendering/Resources/VoxelBrickMesher.compute");\n\n            StringAssert.Contains("if (centreSolid && sourceStep > 1)", densityShader);\n            StringAssert.Contains("PreferNearestCrossingSurfaceMaterial(", densityShader);\n            StringAssert.Contains("for (int distance = 1; distance < sourceStep; distance++)", densityShader);\n            StringAssert.Contains("p + direction * sourceStep", densityShader);\n            StringAssert.Contains("SampleField(p, _SourceStep, material, surface, boundary)", mesher);\n        }\n\n        [Test]\n        public void SceneIssue20260823014011920GpuLod2CarriesInnerTransitionFaceMask()\n'''
          if tests.count(insertion) != 1:
              raise SystemExit(f'expected one test insertion target, found {tests.count(insertion)}')
          tests = tests.replace(insertion, test_block, 1)

          density_path.write_text(density)
          compute_path.write_text(compute)
          test_path.write_text(tests)
          PY

          git diff --check
          git diff --stat -- \
            Assets/VoxelEngine/Rendering/Resources/VoxelBrickDensity.hlsl \
            Assets/VoxelEngine/Rendering/Resources/VoxelBrickMesher.compute \
            Assets/Tests/EditMode/GpuLod2CutoverPolicyTests.cs
          git diff -- \
            Assets/VoxelEngine/Rendering/Resources/VoxelBrickDensity.hlsl \
            Assets/VoxelEngine/Rendering/Resources/VoxelBrickMesher.compute \
            Assets/Tests/EditMode/GpuLod2CutoverPolicyTests.cs
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/VoxelEngine/Rendering/Resources/VoxelBrickDensity.hlsl \
            Assets/VoxelEngine/Rendering/Resources/VoxelBrickMesher.compute \
            Assets/Tests/EditMode/GpuLod2CutoverPolicyTests.cs
          git commit -m 'SceneIssue 014011: match GPU LOD2 exposed materials'
          git push origin HEAD:fixes
