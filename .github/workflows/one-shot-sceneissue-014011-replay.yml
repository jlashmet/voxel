name: One-shot SceneIssue 014011 exact replay

# Replay revision 4: exact CPU LOD2 capture, long enough to persist a converged frame.
on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-replay.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: sceneissue-014011-cpu-lod2-diagnostic
  cancel-in-progress: true

jobs:
  replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 0

      - name: Publish pending status
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/sceneissue-014011-cpu-replay',
              description: 'Exact CPU LOD2 replay is running',
              target_url: process.env.RUN_URL,
            });

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Create exact SceneIssue camera fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/Resources
          python3 - <<'PY'
          import json
          from pathlib import Path
          issue = json.loads(Path('SceneIssues/closed/20260823-014011-920-VoxelShowcase/issue.json').read_text())
          camera = issue['captures'][0]['camera']
          fixture = {
              'hierarchyPath': camera['hierarchyPath'],
              'position': camera['position'],
              'rotation': camera['rotation'],
              'fieldOfView': camera['fieldOfView'],
          }
          Path('Assets/Resources/SceneIssueCameraPose.json').write_text(json.dumps(fixture, indent=2) + '\n')
          print(json.dumps(fixture, indent=2))
          PY

      - name: Replay exact captured view with GPU cutover disabled
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue014011/RealPlayer"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/showcase-player-capture.sh')
          text = path.read_text()
          old = '-screen-width 1600 -screen-height 900 -screen-fullscreen 0'
          new = '-screen-width 1293 -screen-height 718 -screen-fullscreen 0'
          if text.count(old) != 1:
              raise SystemExit(f'expected one capture-size target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          VOXEL_DISABLE_GPU_CUTOVER=1 bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --run-seconds 45

      - name: Persist CPU LOD2 diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue014011/RealPlayer"
          ISSUE="SceneIssues/closed/20260823-014011-920-VoxelShowcase"
          final="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$final"

          git reset --hard HEAD

          cp "$final" "$ISSUE/diagnostic-cpu-lod2.png"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/SceneIssue014011/Preview"
          sips -s format jpeg -s formatOptions 70 -Z 800 "$final" \
            --out "$GITHUB_WORKSPACE/Artifacts/SceneIssue014011/Preview/diagnostic-cpu-lod2-preview.jpg" >/dev/null
          {
            echo "source_commit=$GITHUB_SHA"
            echo "camera_fixture=Showcase Camera @ (101.44347381591797,113.22681427001953,-51.74753952026367), fov=70"
            echo "capture_resolution=1293x718"
            echo "selected_screenshot=$(basename "$final")"
            echo "diagnostic=VOXEL_DISABLE_GPU_CUTOVER=1; exact saved view; compare CPU LOD2 against GPU LOD2 attempts"
            echo
            echo "=== camera replay ==="
            grep 'SCENEISSUE camera' "$ROOT/player-run.log" || true
            echo
            echo "=== fps tail ==="
            tail -20 "$ROOT/fps.txt" 2>/dev/null || true
            echo
            echo "=== surface tail ==="
            grep 'SURFACE t=' "$ROOT/player-run.log" | tail -20 || true
            echo
            echo "=== rings tail ==="
            grep 'RINGS ' "$ROOT/player-run.log" | tail -20 || true
          } > "$ISSUE/diagnostic-cpu-lod2.txt"
          cat "$ISSUE/diagnostic-cpu-lod2.txt"
          echo 'CPU_PREVIEW_BEGIN'
          base64 < "$GITHUB_WORKSPACE/Artifacts/SceneIssue014011/Preview/diagnostic-cpu-lod2-preview.jpg" | fold -w 120
          echo 'CPU_PREVIEW_END'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ISSUE/diagnostic-cpu-lod2.png" "$ISSUE/diagnostic-cpu-lod2.txt"
          git commit -m 'SceneIssue 014011: record CPU LOD2 diagnostic replay'
          git pull --rebase origin fixes
          git push origin HEAD:fixes

      - name: Upload CPU replay preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sceneissue-014011-cpu-replay-${{ github.run_id }}
          path: |
            Artifacts/SceneIssue014011/Preview/**
            Artifacts/SceneIssue014011/RealPlayer/Screenshots/**
            Artifacts/SceneIssue014011/RealPlayer/player-run.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/sceneissue-014011-cpu-replay',
              description: success ? 'Exact CPU LOD2 replay passed' : 'Exact CPU LOD2 replay failed',
              target_url: process.env.RUN_URL,
            });
