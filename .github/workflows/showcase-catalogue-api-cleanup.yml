name: Showcase catalogue API cleanup
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-catalogue-api-cleanup.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove stale Structures Runtime import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Assets/Scenes/Showcase/ShowcaseCatalogue.cs')
          text = path.read_text()
          token = 'using VoxelEngine.Structures.Runtime;\n'
          if text.count(token) != 1:
              raise SystemExit('ShowcaseCatalogue Structures.Runtime import did not match exactly once')
          text = text.replace(token, '', 1)
          if '.Runtime' in text:
              raise SystemExit('ShowcaseCatalogue still contains Runtime dependency')
          api = Path('Assets/VoxelEngine/Structures/Api/FeatureCatalogue.cs').read_text()
          if 'FeatureCatalogue' not in api:
              raise SystemExit('FeatureCatalogue is not owned by Structures.Api as expected')
          path.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseCatalogue.cs
          git commit -m 'refactor(showcase): make catalogue construction API-only'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage