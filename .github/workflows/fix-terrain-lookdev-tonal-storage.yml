name: Fix TerrainLookdev tonal storage registration
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/fix-terrain-lookdev-tonal-storage.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Route tonal material registration through Composition storage
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scenes/Showcase/TerrainLookdev.TonalMap.cs')
          s=p.read_text()
          count=s.count('_palette.Register(')
          if count != 4:
              raise SystemExit(f'Expected 4 tonal _palette registrations, found {count}')
          s=s.replace('_palette.Register(', '_storage.RegisterMaterial(')
          if '_palette' in s:
              raise SystemExit('TonalMap still references removed _palette field')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/TerrainLookdev.TonalMap.cs
          git diff --cached --check
          git commit -m 'fix(showcase): route tonal materials through Composition storage'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
