name: Cutover 13 Core zero-match
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-core-zero-match.yml
permissions:
  contents: read
jobs:
  zero-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8f2cae28353da9e916390142e2754ad67d27191
          fetch-depth: 1
      - name: Verify no VoxelEngine.Core literal remains in source/package docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          matches=[]
          for root_name in ('Assets','Packages'):
              root=Path(root_name)
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in ('.cs','.asmdef','.md','.json','.yml','.yaml'):
                      continue
                  text=p.read_text(errors='ignore')
                  if 'VoxelEngine.Core' in text:
                      matches.append(p)
          print('CORE_MATCH_FILES=',len(matches))
          for p in matches: print(p)
          if matches:
              raise SystemExit('Residual VoxelEngine.Core literals remain')
          print('VoxelEngine.Core zero-match accepted')
          PY
