name: Edits final move inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo ===CoreEditsNamespace===
          grep -RIn 'VoxelEngine.Core.Edits' Assets Packages --include='*.cs' --include='*.asmdef' | sort || true
          echo ===DeterministicPath===
          grep -RInE 'Core[/", ]+Edits|Core/Edits/DeterministicAlterationApplier|DeterministicAlterationApplier\.cs' Assets Packages docs --include='*.cs' --include='*.md' | sort || true
          echo ===CoreEditsDir===
          find Assets/VoxelEngine/Core/Edits -maxdepth 1 -type f -print | sort || true
