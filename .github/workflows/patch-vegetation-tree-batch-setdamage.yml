name: Patch Vegetation TreeBatch SetDamage caller

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/CI/PlayMode/TreeBatchRenderingTests.cs')
          text = p.read_text()
          old = 'TreeWorldRuntime.SetDamage(0, 0.70f, false);'
          new = 'TreeWorldRuntime.SetDamage(0, 0.70f, false, float3.zero, float3.zero, -1);'
          if text.count(old) == 1:
              p.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('TreeBatch SetDamage call drifted unexpectedly')
          PY
          git rm .github/workflows/patch-vegetation-tree-batch-setdamage.yml
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/CI/PlayMode/TreeBatchRenderingTests.cs
          git commit -m 'fix: update tree batch damage call for Vegetation Runtime'
          git push origin HEAD:${{ github.ref_name }}
