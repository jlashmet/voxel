name: Publish Showcase Storage API read cut
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-storage-read-api.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Route Showcase world voxel reads through Storage.Api
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs')
          text = path.read_text()

          replacements = [
              ('VoxelAccess.IsSolid(ref _table, in _pool, ', 'IsSolidApi('),
              ('byte material = VoxelAccess.GetVoxel(ref _table, in _pool, current);',
               'byte material = ReadMaterialApi(current);'),
              ('VoxelCell cell = VoxelAccess.GetCell(ref _table, in _pool, current);',
               'if (!TryReadCellApi(current, out VoxelCell cell)) continue;'),
              ('byte below = VoxelAccess.GetVoxel(ref _table, in _pool,\n                                                             upper + new int3(0, -1, 0));',
               'byte below = ReadMaterialApi(upper + new int3(0, -1, 0));'),
              ('if (VoxelAccess.SetVoxel(ref _table, ref _pool, voxels[i], material)) MarkDirty(voxels[i]);',
               'if (SetMaterialApi(voxels[i], material)) MarkDirty(voxels[i]);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source pattern: {old!r}')
              text = text.replace(old, new)

          forbidden = [
              'VoxelAccess.IsSolid(',
              'VoxelAccess.GetVoxel(',
              'VoxelAccess.GetCell(',
              'VoxelAccess.SetVoxel(',
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'remaining direct voxel access after API read cut: {token}')

          path.write_text(text)
          PY

          rm .github/workflows/cutover13-showcase-storage-read-api.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs .github/workflows/cutover13-showcase-storage-read-api.yml
          git commit -m 'refactor(showcase): route voxel reads through Storage API'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
