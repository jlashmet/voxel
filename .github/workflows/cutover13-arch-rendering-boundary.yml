name: Cutover 13 arch rendering boundary

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-arch-rendering-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
      - name: Route ArchLookdev rendering through Composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          def d(s): return b64decode(s).decode()
          def replace_once(text, old64, new64, label):
              old, new = d(old64), d(new64)
              if old not in text: raise SystemExit(label + ' anchor changed')
              return text.replace(old, new, 1)

          comp = Path('Assets/VoxelEngine/Composition/RenderingComposition.cs')
          text = comp.read_text()
          text = replace_once(text,
              'ICAgICAgICBwdWJsaWMgc3RhdGljIFZlY3RvcjQgR2V0TWF0ZXJpYWxBbGJlZG8oYnl0ZSBtYXRlcmlhbCkgPT4KICAgICAgICAgICAgVm94ZWxQcmVzZW50YXRpb25DYXRhbG9ndWUuTWF0ZXJpYWxBbGJlZG9bbWF0ZXJpYWxdOwo=',
              '', 'RenderingComposition')
          comp.write_text(text)

          arch = Path('Assets/Scenes/Showcase/ArchLookdev.cs')
          text = arch.read_text().replace('using VoxelEngine.Rendering.Runtime;\n', '').replace('using VoxelEngine.Rendering.Runtime.SurfaceExtraction;\n', '')
          replacements = [
            ('', ''),
            ('', 'ICAgICAgICAgICAgUmVuZGVyaW5nQ29tcG9zaXRpb24uQ2xlYXJXb3JsZCgpOwogICAgICAgICAgICBSZW5kZXJpbmdDb21wb3NpdGlvbi5TZXRNYXRlcmlhbEFsYmVkbyhTdG9uZU1hdGVyaWFsLCBfb3JpZ2luYWxTdG9uZUFsYmVkbyk7CiAgICAgICAgICAgIFJlbmRlcmluZ0NvbXBvc2l0aW9uLlNldENvYXRpbmdUaW50KENvYXRpbmdzLk1vc3MsIF9vcmlnaW5hbE1vc3NUaW50KTsK'),
            ('', ''),
            ('ICAgICAgICAgICAgX3N0b3JhZ2UgPSBuZXh0U3RvcmFnZTsKICAgICAgICAgICAgX3Byb2ZpbGVCbG9ja3MgPSBuZXh0UHJvZmlsZXM7CiAgICAgICAgICAgIFZveGVsUmVuZGVyQnJpZGdlLkNoYW5nZXMgPSBfc3RvcmFnZS5DaGFuZ2VzOwogICAgICAgICAgICBWb3hlbFJlbmRlckJyaWRnZS5Tb3VyY2UgPSBXb3JsZFZpZXc7CiAgICAgICAgICAgIG9sZFN0b3JhZ2U/LkRpc3Bvc2UoKTsK', ''),
            ('', ''),
            ('', '')]
          for old64, new64 in replacements:
              text = replace_once(text, old64, new64, 'ArchLookdev')
          forbidden = ('VoxelRenderBridge', 'VoxelPresentationCatalogue', 'VoxelWorldView', 'VoxelEngine.Rendering.Runtime')
          leftovers = [token for token in forbidden if token in text]
          if leftovers: raise SystemExit('ArchLookdev rendering Runtime tokens remain: ' + ', '.join(leftovers))
          arch.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/VoxelEngine/Composition/RenderingComposition.cs Assets/Scenes/Showcase/ArchLookdev.cs
          git rm .github/workflows/cutover13-arch-rendering-boundary.yml
          git commit -m "refactor(showcase): route arch rendering through composition"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
