name: Correct accepted architecture checklist

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/sync-accepted-architecture-checklist-v2.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Correct accepted task bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "stale checklist correction; current=$(git rev-parse HEAD) event=$GITHUB_SHA"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          plan = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = plan.read_text()

          text = text.replace(
              'static job `95072945213`',
              'static job `95073061962`')

          old = '| 13 — Composition/Core deletion | **In progress — current** | all concrete Showcase runtime ownership is under `Composition`; `VoxelEngine.Showcase` is Runtime-free; the permanent dependency guard and final dependency report are in place; exact-head static acceptance proves Api/Runtime direction, Composition-only concrete wiring, WorldGen isolation, and zero production `VoxelEngine.Core` references | exact EditMode 387/374/13 acceptance for the final Composition move and final validation closeout |'
          new = '| 13 — Composition/Core deletion | **In progress — current** | all concrete Showcase runtime ownership is under `Composition`; `VoxelEngine.Showcase` is Runtime-free; the permanent dependency guard and final dependency report are in place; exact-head static acceptance proves Api/Runtime direction, Composition-only concrete wiring, WorldGen isolation, and zero production `VoxelEngine.Core` references | classify/remove stale non-production legacy Core literals, then exact EditMode acceptance for the final Composition move and final validation closeout |'
          if old not in text:
              raise SystemExit('Cutover 13 status row not found')
          text = text.replace(old, new, 1)

          old = '- [x] zero production source/asmdef matches for `VoxelEngine.Core`; exact-head static acceptance scans Assets/Packages production code while docs/tests intentionally retain the deleted name as history/guard vocabulary'
          new = '- [x] zero production source/asmdef matches for `VoxelEngine.Core`; exact-head static acceptance scans Assets/Packages production code\n- [ ] classify/remove stale repository-wide `VoxelEngine.Core` literals outside production; inventory run `31909802220` found 181 matches, primarily historical migration docs, retired one-shot workflows, guard/test vocabulary, and archived logs. Intentional guard/history references must be explicitly retained rather than pretending the repository is at literal zero-match.'
          if old not in text:
              raise SystemExit('Core zero-match checklist line not found')
          text = text.replace(old, new, 1)

          marker = '- Latest accepted stable static gate: source `c09dc595211d492f8bb934292367dfd5b4215b4e`, run `31909666042`, static job `95073061962` — exact-head checkout passed the final production dependency graph: no Api -> Runtime edge, no foreign Runtime -> Runtime edge, Composition is the sole production Runtime-wiring exception, Showcase has no Runtime assembly refs, production has no deleted Core reference, Streaming/Net/Rendering directions are final, and semantic WorldGen remains isolated. The exact EditMode job is still pending and is not implied by this static acceptance.'
          inventory = '- Repository-wide legacy-token inventory: run `31909802220` at `0b64b52370ab483f2b34110d2c08826c924d49a1` found 181 `VoxelEngine.Core` literals outside generated Unity caches. Production code remains clean; the residual set is dominated by historical docs, retired migration/acceptance workflows, guard/test vocabulary, specs, tooling, and archived logs and is tracked separately from the production architecture gate.'
          if marker not in text:
              raise SystemExit('Stable static acceptance marker not found')
          text = text.replace(marker, marker + '\n' + inventory, 1)
          plan.write_text(text)

          report = Path('docs/ARCHITECTURE_DEPENDENCY_REPORT.md')
          r = report.read_text().replace('static job `95072945213`', 'static job `95073061962`')
          report.write_text(r)
          PY

          git rm -f .github/workflows/sync-accepted-architecture-checklist-v2.yml
          if [ -f .github/workflows/final-core-literal-inventory.yml ]; then
            git rm .github/workflows/final-core-literal-inventory.yml
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md docs/ARCHITECTURE_DEPENDENCY_REPORT.md
          git commit -m 'docs(architecture): correct finalization checklist evidence'
          git push origin HEAD:refactor/system-boundaries-finalization-stable
