name: Structures Runtime namespace publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Normalize Runtime namespaces and consumers
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path

          runtime_root = Path('Assets/VoxelEngine/Structures/Runtime')
          declaration_replacements = {
              'namespace VoxelEngine.Core.Features.Emitters\n': 'namespace VoxelEngine.Structures.Runtime.Emitters\n',
              'namespace VoxelEngine.Core.Features\n': 'namespace VoxelEngine.Structures.Runtime\n',
              'namespace VoxelEngine.Structures\n': 'namespace VoxelEngine.Structures.Runtime\n',
          }
          for path in runtime_root.rglob('*.cs'):
              text = path.read_text()
              original = text
              for old, new in declaration_replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)

          using_replacements = {
              'using VoxelEngine.Core.Features.Emitters;\n': 'using VoxelEngine.Structures.Runtime.Emitters;\n',
              'using VoxelEngine.Core.Features;\n': 'using VoxelEngine.Structures.Runtime;\n',
              'using VoxelEngine.Structures;\n': 'using VoxelEngine.Structures.Runtime;\n',
          }
          for path in Path('Assets').rglob('*.cs'):
              text = path.read_text()
              original = text
              for old, new in using_replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  lines = text.splitlines(True)
                  seen = set()
                  out = []
                  for line in lines:
                      if line.startswith('using '):
                          if line in seen:
                              continue
                          seen.add(line)
                      out.append(line)
                  path.write_text(''.join(out))
          PY

          git rm .github/workflows/structures-namespace-inventory.yml
          git diff --check
          if grep -RInE '^namespace VoxelEngine\.Core\.Features([.{]|$)' Assets/VoxelEngine/Structures/Runtime --include='*.cs'; then
            echo 'Legacy Core.Features Runtime namespace remains' >&2
            exit 1
          fi
          if grep -RInE '^namespace VoxelEngine\.Structures[[:space:]]*$' Assets/VoxelEngine/Structures/Runtime --include='*.cs'; then
            echo 'Broad Structures Runtime namespace remains' >&2
            exit 1
          fi
          if grep -RInF 'using VoxelEngine.Core.Features' Assets --include='*.cs'; then
            echo 'Legacy Core.Features using remains' >&2
            exit 1
          fi
          if grep -RInF 'using VoxelEngine.Structures;' Assets --include='*.cs'; then
            echo 'Broad Structures using remains' >&2
            exit 1
          fi
          if grep -RInF 'VoxelEngine.Structures.Runtime' Packages/com.mountingforce.worldgen --include='*.cs' --include='*.asmdef'; then
            echo 'WorldGen acquired forbidden Structures.Runtime dependency' >&2
            exit 1
          fi

          echo '=== changed files ==='
          git status --short
          git diff --stat
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git diff --name-only -- '*.cs' | while IFS= read -r path; do
            if [[ -n "$path" ]]; then
              git add -- "$path"
            fi
          done
          git commit -m 'Normalize Structures Runtime namespaces'
          git push origin HEAD:${{ github.ref_name }}
