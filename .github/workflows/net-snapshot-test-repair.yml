name: Net snapshot test repair
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs')
          s=p.read_text()
          old1='''                Assert.True(aTable.TryGetRegion(int3.zero, out Region aRegion));\n                Assert.True(bTable.TryGetRegion(int3.zero, out Region bRegion));\n                Assert.AreNotEqual(RegionHasher.HashRegion(in aRegion, in aPool),\n                                   RegionHasher.HashRegion(in bRegion, in bPool));\n'''
          new1='''                var aSnapshots = new RegionReadSource(in aTable, in aPool);\n                var bSnapshots = new RegionReadSource(in bTable, in bPool);\n                Assert.AreEqual(RegionSnapshotCaptureResult.Ok,\n                    aSnapshots.CaptureSemanticSnapshot(int3.zero, RegionSemanticSnapshotLimits.DefaultMaxSnapshotBytes, out RegionSemanticSnapshot aSnapshot));\n                Assert.AreEqual(RegionSnapshotCaptureResult.Ok,\n                    bSnapshots.CaptureSemanticSnapshot(int3.zero, RegionSemanticSnapshotLimits.DefaultMaxSnapshotBytes, out RegionSemanticSnapshot bSnapshot));\n                Assert.AreNotEqual(aSnapshot.SemanticHash, bSnapshot.SemanticHash);\n'''
          old2='''                Assert.True(aTable.TryGetRegion(int3.zero, out Region aRegion));\n                Assert.True(bTable.TryGetRegion(int3.zero, out Region bRegion));\n                Assert.AreNotEqual(aRegion.BrickRefs[0].PoolIndex,\n                                   bRegion.BrickRefs[0].PoolIndex);\n                Assert.AreEqual(RegionHasher.HashRegion(in aRegion, in aPool),\n                                RegionHasher.HashRegion(in bRegion, in bPool));\n'''
          new2='''                Assert.True(aTable.TryGetRegion(int3.zero, out Region aRegion));\n                Assert.True(bTable.TryGetRegion(int3.zero, out Region bRegion));\n                Assert.AreNotEqual(aRegion.BrickRefs[0].PoolIndex,\n                                   bRegion.BrickRefs[0].PoolIndex);\n                var aSnapshots = new RegionReadSource(in aTable, in aPool);\n                var bSnapshots = new RegionReadSource(in bTable, in bPool);\n                Assert.AreEqual(RegionSnapshotCaptureResult.Ok,\n                    aSnapshots.CaptureSemanticSnapshot(int3.zero, RegionSemanticSnapshotLimits.DefaultMaxSnapshotBytes, out RegionSemanticSnapshot aSnapshot));\n                Assert.AreEqual(RegionSnapshotCaptureResult.Ok,\n                    bSnapshots.CaptureSemanticSnapshot(int3.zero, RegionSemanticSnapshotLimits.DefaultMaxSnapshotBytes, out RegionSemanticSnapshot bSnapshot));\n                Assert.AreEqual(aSnapshot.SemanticHash, bSnapshot.SemanticHash);\n'''
          if s.count(old1)!=1: raise SystemExit(f'first hash assertion block count={s.count(old1)}')
          if s.count(old2)!=1: raise SystemExit(f'second hash assertion block count={s.count(old2)}')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s)
          PY
          ! grep -q 'RegionHasher.HashRegion' Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git diff --check
          git rm .github/workflows/net-snapshot-test-repair.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git add -u .github/workflows
          git commit -m 'test: validate region hashes through Storage snapshot API'
          git push origin HEAD:${{ github.ref_name }}
