name: Sunlit Cleric multiview review

on:
  push:
    branches: [feature/character-weapon-asset-pipeline]
    paths:
      - '.github/workflows/sunlit-cleric-multiview-review.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sunlit-cleric-multiview-review
  cancel-in-progress: true

jobs:
  publish-latest-review:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      REVIEW_DIR: docs/lookdev/characters/sunlit-cleric/multiview

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download latest successful multiview artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          import shutil
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          branch = 'feature/character-weapon-asset-pipeline'
          review_dir = Path(os.environ['REVIEW_DIR'])
          review_dir.mkdir(parents=True, exist_ok=True)

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url: str):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          workflow = 'sunlit-cleric-multiview-build.yml'
          params = urlencode({
              'branch': branch,
              'status': 'success',
              'per_page': 5,
          })
          runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{params}'

          run = None
          for attempt in range(30):
              runs = get_json(runs_url).get('workflow_runs', [])
              if runs:
                  run = runs[0]
                  break
              if attempt == 29:
                  raise RuntimeError('no successful multiview workflow run found')
              time.sleep(10)

          run_id = int(run['id'])
          artifacts = get_json(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
          ).get('artifacts', [])
          artifact = next(
              (item for item in artifacts if item.get('name') == 'sunlit-cleric-multiview-prototype'),
              None,
          )
          if artifact is None:
              raise RuntimeError(f'multiview artifact not found on run {run_id}')

          archive_request = Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip',
              headers=headers,
          )
          with urlopen(archive_request, timeout=120) as response:
              archive = response.read()

          wanted = {
              'cleric_mv_bind_preview.png',
              'cleric_mv_idle.png',
              'cleric_mv_cast.png',
              'manifest.json',
          }
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              members = zipped.namelist()
              for target in wanted:
                  matches = [name for name in members if Path(name).name == target]
                  if len(matches) != 1:
                      raise RuntimeError(
                          f'expected one {target} in artifact; found {matches}'
                      )
                  with zipped.open(matches[0]) as source, (review_dir / target).open('wb') as dest:
                      shutil.copyfileobj(source, dest)

          metadata = {
              'workflow_run_id': run_id,
              'workflow_head_sha': run['head_sha'],
              'artifact_id': int(artifact['id']),
              'artifact_name': artifact['name'],
          }
          (review_dir / 'review-source.json').write_text(
              json.dumps(metadata, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(metadata, indent=2))
          PY

      - name: Publish review renders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR"
          if git diff --cached --quiet; then
            echo 'Latest multiview review is already published.'
            exit 0
          fi
          git commit -m 'docs(characters): publish multiview cleric review [mv-review]'
          git push origin HEAD:feature/character-weapon-asset-pipeline
