name: COW-safe production mutation paths one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-cow-mutation-paths-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_cow_mutation_paths_patch.py
      - name: Static guards
        run: |
          grep -q 'pool.EnsureWritable(poolIndex)' Assets/VoxelEngine/Storage/Runtime/VoxelAccess.cs
          test "$(grep -c '_pool.EnsureWritable(' Assets/VoxelEngine/Storage/Runtime/RegionMutationStore.cs)" -ge 2
          test "$(grep -c '_pool.EnsureWritable(brick.PoolIndex)' Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs)" -ge 2
          grep -q 'VoxelAccessPublishesCowCloneBeforeEditingPinnedBrick' Assets/Tests/EditMode/StorageAllocationTests.cs
      - name: Commit COW mutation paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Storage/Runtime/VoxelAccess.cs \
                  Assets/VoxelEngine/Storage/Runtime/RegionMutationStore.cs \
                  Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs \
                  Assets/Tests/EditMode/StorageAllocationTests.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Make production mixed-brick mutations copy-on-write safe'
          git push origin HEAD:refactor/async-geometry-pipeline
