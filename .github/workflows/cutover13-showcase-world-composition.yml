name: Publish Showcase world Composition ownership cut

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-world-composition.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Move concrete Showcase world wiring behind Composition
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage

          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          source = root / 'Assets/Scenes/Showcase'
          owned = source / 'CompositionOwned'
          owned.mkdir(exist_ok=True)

          # These files form one implementation unit: the world owns concrete storage/edit/
          # structure runtime state; the helpers are used by that world and are not scene wiring.
          files = [
              'ShowcaseWorld.cs',
              'ShowcaseWorld.cs.meta',
              'ShowcaseWorld.StorageBridge.cs',
              'ShowcaseWorld.StorageBridge.cs.meta',
              'FarFieldStructureStore.cs',
              'FarFieldStructureStore.cs.meta',
              'ShowcaseCatalogue.cs',
              'ShowcaseCatalogue.cs.meta',
              'ShowcaseHeightJob.cs',
              'ShowcaseHeightJob.cs.meta',
          ]
          for name in files:
              src = source / name
              dst = owned / name
              if src.exists():
                  shutil.move(str(src), str(dst))
              elif not dst.exists():
                  raise SystemExit(f'missing expected Showcase world file: {name}')

          world = owned / 'ShowcaseWorld.cs'
          text = world.read_text()
          # Avoid a reverse Composition -> Showcase assembly dependency for a presentation-only
          # constant. Keep the value local to the authoritative chunking code.
          text = text.replace('GpuDebrisSystem.RenderInstancesPerChunk', '16')
          text = text.replace(
              'Nothing here is engine code; it is a caller of the engine, in its own assembly. Edits\n'
              '    /// go through <see cref="VoxelAccess"/> and shapes come from <see cref="BuildBrushes"/>.\n'
              '    /// Terrain generation writes brick references directly, which is the only way to fill a\n'
              '    /// region at a sane cost: a solid brick below the surface becomes a uniform reference and\n'
              '    /// allocates nothing, and only the bricks the surface actually passes through take a pool\n'
              '    /// slot. That asymmetry is the whole memory argument, and the HUD makes it visible.',
              'This application world constructor is compiled into the Composition assembly so concrete\n'
              '    /// Runtime storage/edit/structure wiring stays behind the scene boundary. Public collaborators\n'
              '    /// still consume Storage/Structures/Edits API contracts; the direct physical operations here are\n'
              '    /// implementation details of the composition root and remain available to the hot generation path.'
          )
          world.write_text(text)

          asmref = owned / 'VoxelEngine.Composition.asmref'
          asmref.write_text('{\n  "reference": "GUID:90d835900f7f443f9ae31b8c3626fd1a"\n}\n')
          meta = owned / 'VoxelEngine.Composition.asmref.meta'
          if not meta.exists():
              meta.write_text(
                  'fileFormatVersion: 2\n'
                  'guid: f0dbe91f203d4b7aaee938a8b1413e27\n'
                  'AssemblyDefinitionReferenceImporter:\n'
                  '  externalObjects: {}\n'
                  '  userData: \n'
                  '  assetBundleName: \n'
                  '  assetBundleVariant: \n'
              )

          asmdef_path = source / 'VoxelEngine.Showcase.asmdef'
          asmdef = json.loads(asmdef_path.read_text())
          forbidden = {
              'VoxelEngine.Edits.Runtime',
              'VoxelEngine.Storage.Runtime',
              'VoxelEngine.Structures.Runtime',
              'VoxelEngine.Terrain.Runtime',
              'VoxelEngine.Rendering.Runtime',
              'VoxelEngine.Net.Runtime',
              'VoxelEngine.Streaming.Runtime',
          }
          asmdef['references'] = [r for r in asmdef['references'] if r not in forbidden]
          asmdef_path.write_text(json.dumps(asmdef, indent=2) + '\n')
          PY

          rm .github/workflows/cutover13-showcase-world-composition.yml

          test -f Assets/Scenes/Showcase/CompositionOwned/ShowcaseWorld.cs
          test -f Assets/Scenes/Showcase/CompositionOwned/VoxelEngine.Composition.asmref
          test ! -f Assets/Scenes/Showcase/ShowcaseWorld.cs
          if grep -Eq '"VoxelEngine\.[^"]+\.Runtime"' Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef; then
            echo 'Showcase asmdef still contains a concrete Runtime reference' >&2
            exit 1
          fi
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A Assets/Scenes/Showcase .github/workflows/cutover13-showcase-world-composition.yml
          git commit -m 'refactor(showcase): move world runtime ownership to Composition'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
