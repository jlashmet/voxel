name: Net physical Runtime move
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

          test -f Assets/VoxelEngine/Net/Runtime/VoxelEngine.Net.Runtime.asmdef
          for d in Client Interest Protocol Server Transport; do
            test -d "Assets/VoxelEngine/Net/$d"
            test -f "Assets/VoxelEngine/Net/$d.meta"
            test ! -e "Assets/VoxelEngine/Net/Runtime/$d"
            git mv "Assets/VoxelEngine/Net/$d" "Assets/VoxelEngine/Net/Runtime/$d"
            git mv "Assets/VoxelEngine/Net/$d.meta" "Assets/VoxelEngine/Net/Runtime/$d.meta"
          done

          rm -f docs/.net-runtime-tree-gate
          git rm --ignore-unmatch .github/workflows/net-runtime-physical-move.yml

          for d in Client Interest Protocol Server Transport; do
            test ! -e "Assets/VoxelEngine/Net/$d"
            test -d "Assets/VoxelEngine/Net/Runtime/$d"
          done
          test -d Assets/VoxelEngine/Net/Api
          test -d Assets/VoxelEngine/Net/Runtime

          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add -A Assets/VoxelEngine/Net docs/.net-runtime-tree-gate 2>/dev/null || true
          git add -u .github/workflows
          git commit -m 'Move Net implementation under Runtime'
          git push origin HEAD:${{ github.ref_name }}
