name: Showcase far-field Storage API cutover
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-farfield-storage-api.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Patch remaining ShowcaseWorld far-field call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          text = p.read_text()
          old = '                FarField.CaptureRegion(_castleRegions[i], ref _table, in _pool, Seed);'
          new = '                FarField.CaptureRegion(_castleRegions[i], ReadStorage, Seed);'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one remaining physical far-field call')
          text = text.replace(old, new, 1)
          if any('FarField.CaptureRegion' in line and ('_table' in line or '_pool' in line)
                 for line in text.splitlines()):
              raise SystemExit('a physical far-field capture call still remains')
          p.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git commit -m 'refactor(showcase): finish far-field Storage API call migration'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
# one-shot publisher; delete after source commit lands
