name: Apply exact core halo coverage repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-exact-core-halo-coverage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Fast-forward to current branch
        run: |
          set -euo pipefail
          git fetch origin feature/voxel-showcase-rendering-repair-v2
          git reset --hard origin/feature/voxel-showcase-rendering-repair-v2
      - name: Apply core versus halo coverage repair
        run: python .github/scripts/apply-exact-core-halo-coverage.py
      - name: Validate exact source diff
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'RecordRegion(requiredRegion, pinnedRegion)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'coreMinWorldBlock = cacheOrigin + BrickCachePadding' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
      - name: Commit production repair
        run: |
          set -euo pipefail
          if git diff --quiet -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs; then
            echo 'already applied; nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          git commit -m 'fix(rendering): require exact core metadata only'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
