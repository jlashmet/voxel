name: Repair Showcase profile API leak

on:
  push:
    branches: [refactor/system-boundaries-finalization-clean]
    paths: [.github/workflows/fix-showcase-profile-boundary.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-clean
          fetch-depth: 0
      - name: Replace concrete profile return type with Storage.Api capability
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-clean
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/VoxelEngine/Composition/ShowcaseWorld.cs')
          text = path.read_text()
          old = '        public ProfileBlockStore ProfileBlocks => _profileBlocks;'
          new = '        public IProfileBlockReadSource ProfileBlocks => _profileBlocks;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one concrete ProfileBlocks signature, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          grep -q --fixed-strings 'public IProfileBlockReadSource ProfileBlocks => _profileBlocks;' Assets/VoxelEngine/Composition/ShowcaseWorld.cs
          if grep -q --fixed-strings 'public ProfileBlockStore ProfileBlocks' Assets/VoxelEngine/Composition/ShowcaseWorld.cs; then
            echo 'Concrete Structures.Runtime profile type still leaks through ShowcaseWorld' >&2
            exit 1
          fi

          git rm .github/workflows/fix-showcase-profile-boundary.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Composition/ShowcaseWorld.cs
          git commit -m 'fix(architecture): hide profile store behind Storage API'
          git pull --rebase origin refactor/system-boundaries-finalization-clean
          git push origin HEAD:refactor/system-boundaries-finalization-clean
