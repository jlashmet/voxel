name: Restore architecture implementation plan

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/restore-architecture-implementation-plan.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Restore full implementation plan
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          git show e83a51ccdb914a84b10b897f9a32862fff945688:docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md > docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          rm .github/workflows/restore-architecture-implementation-plan.yml
          test "$(wc -l < docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md)" -gt 1500
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/workflows/restore-architecture-implementation-plan.yml
          git commit -m 'docs(refactor): restore full architecture implementation plan'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
