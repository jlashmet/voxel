name: Net final queue drain
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-final-queue-drain.yml]
permissions:
  actions: write
  contents: read
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale restructuring runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: refactor/system-boundaries-foundation-storage
          KEEP_ACCEPTANCE: '31891743909'
          KEEP_SELF: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            page=1
            while :; do
              json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs?branch=$BRANCH&status=$status&per_page=100&page=$page")"
              count="$(jq '.workflow_runs | length' <<<"$json")"
              [[ "$count" -gt 0 ]] || break
              jq -r '.workflow_runs[].id' <<<"$json" | while read -r id; do
                if [[ "$id" == "$KEEP_ACCEPTANCE" || "$id" == "$KEEP_SELF" ]]; then
                  echo "preserving $id"
                  continue
                fi
                echo "cancelling $status run $id"
                curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
              done
              [[ "$count" -lt 100 ]] && break
              page=$((page + 1))
            done
          done
