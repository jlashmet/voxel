name: Apply step4 fallback diagnostics once

on:
  push:
    branches: [feature/voxel-showcase-rendering-repair-v2]
    paths:
      - .github/workflows/step4-fallback-diagnostics-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply exact diagnostic patch
        run: python .github/scripts/apply-step4-fallback-diagnostics.py
      - name: Verify patch
        run: git diff --check
      - name: Commit clean diagnostic change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'diag(rendering): expose step4 fallback activation'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
