name: Refactor one-shot debris dependency inversion

on:
  push:
    branches:
      - refactor/system-boundaries-finalization-clean
    paths:
      - .github/workflows/refactor-one-shot-debris-inversion.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-clean
          fetch-depth: 0

      - name: Invert Showcase debris presentation dependency
        shell: python
        run: |
          from pathlib import Path

          world_path = Path('Assets/VoxelEngine/Composition/ShowcaseWorld.cs')
          world = world_path.read_text()
          old = 'GpuDebrisSystem.RenderInstancesPerChunk'
          count = world.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 GPU debris constant references, found {count}')
          world = world.replace(old, 'DetachedVoxelSamplesPerChunk')
          marker = '        public const int MaxQueuedDetachedChunks = 256;\n        private const int MaxVisualChunksPerCollapse = 192;'
          replacement = '        public const int MaxQueuedDetachedChunks = 256;\n        public const int DetachedVoxelSamplesPerChunk = 16;\n        private const int MaxVisualChunksPerCollapse = 192;'
          if world.count(marker) != 1:
              raise SystemExit('ShowcaseWorld debris-limit insertion marker changed')
          world_path.write_text(world.replace(marker, replacement))

          gpu_path = Path('Assets/Scenes/Showcase/GpuDebrisSystem.cs')
          gpu = gpu_path.read_text()
          old_decl = '        public const int RenderInstancesPerChunk = 16;'
          new_decl = '        public const int RenderInstancesPerChunk = ShowcaseWorld.DetachedVoxelSamplesPerChunk;'
          if gpu.count(old_decl) != 1:
              raise SystemExit('GpuDebrisSystem render-limit declaration changed')
          gpu_path.write_text(gpu.replace(old_decl, new_decl))

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/refactor-one-shot-debris-inversion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(composition): invert Showcase debris dependency'
          git push origin HEAD:refactor/system-boundaries-finalization-clean
