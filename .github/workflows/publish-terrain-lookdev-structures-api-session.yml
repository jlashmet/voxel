name: Publish TerrainLookdev Structures Api session

on:
  push:
    paths:
      - .github/workflows/publish-terrain-lookdev-structures-api-session.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Migrate TerrainLookdev VoxelBrush callers to Structures Api
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Assets/Scenes/Showcase')
          files = sorted(root.glob('TerrainLookdev*.cs'))
          changed = []
          for p in files:
              s = p.read_text()
              if 'VoxelBrush' not in s:
                  continue
              old = s
              if p.name != 'TerrainLookdev.cs':
                  s = s.replace('using VoxelEngine.Structures.Runtime;\n', '')
                  if 'using VoxelEngine.Structures.Api;\n' not in s:
                      anchor = 'using VoxelEngine.Storage.Api;\n'
                      if anchor not in s:
                          raise SystemExit(f'Missing API using anchor in {p}')
                      s = s.replace(anchor, anchor + 'using VoxelEngine.Structures.Api;\n', 1)
              s = s.replace('ref VoxelBrush writer', 'IStructureAuthoringSession writer')
              s = s.replace('ref writer', 'writer')
              s = s.replace(
                  '            var writer = new VoxelBrush(\n'
                  '                _storage.Reads, _storage.Mutations, _storage.MaterialAuthoring, 9_000_000);',
                  '            var writer = VoxelEngineBootstrap.CreateStructureAuthoring(_storage, 9_000_000);')
              s = s.replace(
                  '        private VoxelBrush CreateWriter(int budget) =>\n'
                  '            new VoxelBrush(_storage.Reads, _storage.Mutations, _storage.MaterialAuthoring, budget);',
                  '        private IStructureAuthoringSession CreateWriter(int budget) =>\n'
                  '            VoxelEngineBootstrap.CreateStructureAuthoring(_storage, budget);')
              if 'VoxelBrush' in s:
                  raise SystemExit(f'VoxelBrush token remains in {p}')
              if s != old:
                  p.write_text(s)
                  changed.append(str(p))

          if len(changed) < 5:
              raise SystemExit(f'Expected broad TerrainLookdev migration, changed only {len(changed)} files: {changed}')
          print('\n'.join(changed))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/TerrainLookdev*.cs
          git diff --cached --check
          git commit -m 'refactor(showcase): consume Structures Api authoring session'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
