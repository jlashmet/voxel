name: Record accepted Edits API extraction

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()

          old_row = '| 5 — Edits | **In progress — current** | deterministic alteration application is behind Storage.Api; Net/test mutation callers migrated; mutation transition parity accepted | final Edits.Api/Runtime file + namespace move and obsolete wrapper cleanup |'
          new_row = '| 5 — Edits | **In progress — current** | `Edits.Api`/`Edits.Runtime` assemblies created; canonical `AlterationEvent`/`AlterationEventKind` and brush wire codec moved to Edits.Api with source GUIDs preserved and logical block geometry sourced from Storage.Api; deterministic alteration application is behind Storage.Api; Net/test consumers now reference Edits.Api; mutation transition parity accepted | move expansion/apply implementation to Runtime; remove `VoxelEngine.Core.Edits`; delete server wrapper; finish Net protocol cleanup |'

          old_gate = '- Latest accepted code gate: `2d35d46a3e74935e224e70ee2038c5b0629322b5` — 382 tests, 369 passed, exactly the same 13 known baseline failures. This gate completes the Structures cutover: Runtime declarations and implementation consumers now use `VoxelEngine.Structures.Runtime` / `.Emitters`; the last two fully-qualified legacy emitter references were repaired; no live `VoxelEngine.Core.Features` or broad `VoxelEngine.Structures` namespace remains; WorldGen still has no Structures.Runtime dependency. The preceding accepted gate `6209dfd3ffe2210073395ee610c9a5907cf2d767` removed the empty broad Structures assembly at the same 382/369/13 baseline.'
          new_gate = '- Latest accepted code gate: `2a1ffecf03532cdd1b6cf4bd51947db23ffa8db8` — 382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts the first Edits ownership slice: explicit Edits.Api/Runtime assemblies exist; `AlterationEvent`, `AlterationEventKind`, and the canonical brush shape codec live in Edits.Api; the two moved source files preserve their Unity GUIDs; canonical block geometry now comes from Storage.Api `VoxelReadGrid`; existing Core/Net/Showcase/test consumers explicitly reference Edits.Api. The preceding accepted gate `2d35d46a3e74935e224e70ee2038c5b0629322b5` completed Structures at the same 382/369/13 baseline.'

          old_check = '''### 5. Edits\n\n- [ ] create Edits.Api/Runtime\n- [ ] split canonical alteration domain values into Api\n- [ ] move expansion/apply implementation to Runtime'''
          new_check = '''### 5. Edits\n\n- [x] create Edits.Api/Runtime\n- [x] split canonical alteration domain values into Api\n- [ ] move expansion/apply implementation to Runtime'''

          for old, new, label in ((old_row,new_row,'status row'),(old_gate,new_gate,'latest gate'),(old_check,new_check,'execution checklist')):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git rm .github/workflows/record-edits-api-plan.yml
          git diff --check
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted Edits API extraction'
          git push origin HEAD:${{ github.ref_name }}
