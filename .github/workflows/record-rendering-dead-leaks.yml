name: Record accepted Rendering dead-leak cleanup
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/record-rendering-dead-leaks.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()

          old_row = '| 12 — Rendering | **In progress — current** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; vegetation presentation consumes Vegetation.Api only; parity accepted | final Rendering.Api/Runtime move |'
          new_row = '| 12 — Rendering | **In progress — current** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; vegetation presentation consumes Vegetation.Api only; dead physical `ProbeCache`/`VoxelGpuBuffers` paths removed; parity accepted | final Rendering.Api/Runtime move |'
          if text.count(old_row) != 1:
              raise SystemExit('Rendering status row did not match expected live plan')
          text = text.replace(old_row, new_row, 1)

          old_gate = '- Latest accepted code gate: `871fd663ac9c57d8e001ce2ff11f5ac30df242f0` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated acceptance run `31892491967` tested this source-equivalent final Net tree with the standard Unity harness and produced a complete `results.xml`; the 13 failed test names match accepted gate `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4` exactly, so Cutover 11 is accepted.'
          new_gate = '- Latest accepted code gate: `de24d20ce48e9665f4ab7ab78343e7354601eab0` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated Rendering cleanup run `31892956307` produced a complete `results.xml`; its failed-name set matches the accepted 384-test baseline exactly. This gate accepts removal of the unused/physical-storage-leaking `ProbeCache` and `VoxelGpuBuffers` implementations before the Rendering Api/Runtime split.'
          if text.count(old_gate) != 1:
              raise SystemExit('latest accepted gate line did not match expected plan')
          text = text.replace(old_gate, new_gate, 1)

          marker = '- [x] Rendering retained-profile readers consume Storage.Api `IProfileBlockReadSource`; no direct `ProfileBlockStore` dependency remains.\n'
          addition = marker + '- [x] Unused/representation-leaking `ProbeCache` and `VoxelGpuBuffers` implementations removed; Rendering no longer carries those `RegionTable`/`BrickPool`/`BrickRef` paths.\n- [x] Rendering dead-leak cleanup accepted at `de24d20ce48e9665f4ab7ab78343e7354601eab0`: 384 total / 371 passed / exact 13 known baseline failures.\n'
          if text.count(marker) != 1:
              raise SystemExit('Rendering implementation progress marker did not match expected plan')
          text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY
          git rm .github/workflows/record-rendering-dead-leaks.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: record accepted Rendering dead-leak cleanup'
          git push origin HEAD:${{ github.ref_name }}
