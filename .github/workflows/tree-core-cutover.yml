name: Semantic Tree Core Cutover

on:
  push:
    branches: [tree-rendering]
    paths:
      - .github/workflows/tree-core-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor semantic tree ownership
        run: python3 .github/scripts/tree_core_cutover.py
      - name: Verify source-only cutover
        run: echo "Legacy proxy symbols are rejected by the refactor script."
      - name: Remove one-shot tooling
        run: |
          rm -f .github/scripts/tree_core_cutover.py
          rm -f .github/workflows/tree-core-cutover.yml
      - name: Commit cutover
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete semantic tree Core cutover"
          git push origin HEAD:tree-rendering
