name: Fix VoxelShowcase Storage API remainder
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/fix-voxel-showcase-storage-api.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Publish VoxelShowcase surface-query migration
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Scenes/Showcase/VoxelShowcase.cs')
          s = p.read_text()
          if 'using VoxelEngine.Storage.Api;' not in s:
              marker = 'using VoxelEngine.Rendering.Runtime;\n'
              if marker not in s:
                  raise SystemExit('Rendering import marker missing')
              s = s.replace(marker, marker + 'using VoxelEngine.Storage.Api;\n', 1)
          old = '                if (!VoxelAccess.IsSolid(ref _world.Table, in _world.Pool, voxel)) continue;'
          new = '                if (!_world.SurfaceQuery.TryRead(voxel, out VoxelCell cell) ||\n                    cell.BaseMaterialId == VoxelGrid.MaterialEmpty) continue;'
          if old in s:
              s = s.replace(old, new, 1)
          elif '_world.SurfaceQuery.TryRead(voxel, out VoxelCell cell)' not in s:
              raise SystemExit('VoxelAccess call changed unexpectedly')
          if 'VoxelAccess.' in s:
              raise SystemExit('VoxelShowcase still contains VoxelAccess usage')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/VoxelShowcase.cs
          git commit -m 'refactor(showcase): finish Storage API surface reads'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
