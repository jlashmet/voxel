name: Net cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-cutover-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== NET ASMDEF REFERENCES ==='
          grep -RIn 'VoxelEngine.Net' Assets Packages --include='*.asmdef' || true
          echo '=== NET NAMESPACE IMPORTS OUTSIDE NET ==='
          grep -RInE 'using VoxelEngine\.Net|VoxelEngine\.Net\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Net/' || true
          echo '=== SERVER REGION RESIDENCY CALLERS ==='
          grep -RInE 'ServerRegionResidency\.|ServerRegionState|State\.(Hot|Warm|Cold)' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Net/Server/RegionResidency.cs:' || true
          echo '=== REGION STORE CALLERS ==='
          grep -RInE '\bRegionStore\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Net/Server/Storage/RegionStore.cs:' || true
          echo '=== REGION HASHER CALLERS ==='
          grep -RInE '\bRegionHasher\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Net/Server/RegionHasher.cs:' || true
          echo '=== CORE STORAGE IMPORTS IN NET ==='
          grep -RInE 'using VoxelEngine\.Core\.(Storage|Occupancy)|\b(RegionTable|BrickPool|BrickRef|VoxelAccess|SemanticRegionHasher|SemanticRegionSnapshotCodec)\b' Assets/VoxelEngine/Net --include='*.cs' || true
          echo '=== STREAMING API IMPORTS/USES IN NET ==='
          grep -RInE 'VoxelEngine\.Streaming|IRegionStreaming|RegionLoadRequest' Assets/VoxelEngine/Net --include='*.cs' || true
          echo '=== STRUCTURAL API IMPORTS/USES IN NET ==='
          grep -RIn 'VoxelEngine.StructuralIntegrity' Assets/VoxelEngine/Net --include='*.cs' || true
          echo '=== NET PUBLIC TYPE CONSUMERS OUTSIDE NET ==='
          grep -RInE '\b(ClientNetworkRuntime|ServerSession|NetworkRole|ClientTickLoop|ServerTickLoop|RegionSubscriptionIndex|SimulationInterest|InterestFilter)\b' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Net/' || true
