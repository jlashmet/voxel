name: Showcase catalogue API acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab2d1ca4323cc9fd6bdbee814007b716de76c5cd
          fetch-depth: 1
      - name: Verify Showcase catalogue is API-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          catalogue = Path('Assets/Scenes/Showcase/ShowcaseCatalogue.cs').read_text()
          if '.Runtime' in catalogue:
              raise SystemExit('ShowcaseCatalogue retains Runtime dependency')
          required = ['using VoxelEngine.Structures.Api;', 'FeatureCatalogue', 'KentridgeCombinedVoxelCatalogue.Build']
          missing = [token for token in required if token not in catalogue]
          if missing:
              raise SystemExit('ShowcaseCatalogue missing API construction pieces: ' + ', '.join(missing))
          api = Path('Assets/VoxelEngine/Structures/Api/FeatureCatalogue.cs').read_text()
          if 'FeatureCatalogue' not in api:
              raise SystemExit('Structures.Api no longer owns FeatureCatalogue')
          print('Showcase catalogue API-only boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab2d1ca4323cc9fd6bdbee814007b716de76c5cd
          clean: false
          fetch-depth: 1
      - name: Reset pinned catalogue candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard ab2d1ca4323cc9fd6bdbee814007b716de76c5cd
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ShowcaseCatalogueApi"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-catalogue-api-ab2d1ca4
          path: Artifacts/ShowcaseCatalogueApi/
          if-no-files-found: warn
          retention-days: 14