name: Chain Combat CI

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/chain-combat
    paths:
      - "Assets/CombatPrototype/**"
      - "Assets/Tests/PlayMode/ChainCombatPrototypeTests.cs"
      - "Assets/Tests/PlayMode/ChainCombatMechanicsV2Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatImpactV3Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatSetupV4Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatActivationV5Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatReservationV6Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatReadinessV7Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatEnemyAIV8Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatExecutionPlanV9Tests.cs"
      - "Assets/Tests/PlayMode/ChainCombatPlanApprovalV9Tests.cs"
      - "Assets/Tests/PlayMode/VoxelEngine.Tests.PlayMode.asmdef"
      - ".github/workflows/chain-combat-ci.yml"

concurrency:
  group: chain-combat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain-combat:
    name: Exercise chain combat prototype through V9
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run chain combat PlayMode suites
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ChainCombatCI"
          mkdir -p "$ROOT"

          run_suite() {
            local suite="$1"
            local filter="$2"
            local dir="$ROOT/$suite"
            mkdir -p "$dir"

            echo "========== $suite =========="
            "${{ steps.unity.outputs.path }}" \
              -batchmode \
              -projectPath "$GITHUB_WORKSPACE" \
              -runTests \
              -testPlatform PlayMode \
              -testFilter "$filter" \
              -testResults "$dir/results.xml" \
              -logFile "$dir/unity.log"
            local status=$?

            if [[ -f "$dir/unity.log" ]]; then
              cat "$dir/unity.log"
            fi
            if [[ $status -ne 0 ]]; then
              return $status
            fi
            test -s "$dir/results.xml"
          }

          failed=0
          run_suite "prototype" "VoxelEngine.Tests.PlayMode.ChainCombatPrototypeTests" || failed=1
          run_suite "v2-branching" "VoxelEngine.Tests.PlayMode.ChainCombatMechanicsV2Tests" || failed=1
          run_suite "v3-impact" "VoxelEngine.Tests.PlayMode.ChainCombatImpactV3Tests" || failed=1
          run_suite "v4-setup" "VoxelEngine.Tests.PlayMode.ChainCombatSetupV4Tests" || failed=1
          run_suite "v5-activation" "VoxelEngine.Tests.PlayMode.ChainCombatActivationV5Tests" || failed=1
          run_suite "v6-reservation" "VoxelEngine.Tests.PlayMode.ChainCombatReservationV6Tests" || failed=1
          run_suite "v7-readiness" "VoxelEngine.Tests.PlayMode.ChainCombatReadinessV7Tests" || failed=1
          run_suite "v8-enemy-ai" "VoxelEngine.Tests.PlayMode.ChainCombatEnemyAIV8Tests" || failed=1
          run_suite "v9-execution-plan" "VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests" || failed=1
          run_suite "v9-plan-approval" "VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests" || failed=1

          exit $failed

      - name: Upload chain combat CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-combat-ci-${{ github.sha }}
          path: Artifacts/ChainCombatCI/
          if-no-files-found: warn
          retention-days: 14
