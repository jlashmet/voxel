name: Storage Runtime physical cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/storage-runtime-cutover.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Move Core Storage and Occupancy into Storage.Runtime
        shell: bash
        run: |
          set -euo pipefail
          test -d Assets/VoxelEngine/Core/Storage
          test -d Assets/VoxelEngine/Core/Occupancy
          test ! -e Assets/VoxelEngine/Storage/Runtime

          # Preserve Unity GUIDs for the implementation folder and every moved source asset.
          git mv Assets/VoxelEngine/Core/Storage Assets/VoxelEngine/Storage/Runtime
          git mv Assets/VoxelEngine/Core/Storage.meta Assets/VoxelEngine/Storage/Runtime.meta
          git mv Assets/VoxelEngine/Core/Occupancy Assets/VoxelEngine/Storage/Runtime/Occupancy
          git mv Assets/VoxelEngine/Core/Occupancy.meta Assets/VoxelEngine/Storage/Runtime/Occupancy.meta
          git mv Assets/VoxelEngine/Core/VoxelEngine.Core.asmdef Assets/VoxelEngine/Storage/Runtime/VoxelEngine.Storage.Runtime.asmdef
          git mv Assets/VoxelEngine/Core/VoxelEngine.Core.asmdef.meta Assets/VoxelEngine/Storage/Runtime/VoxelEngine.Storage.Runtime.asmdef.meta

          python3 - <<'PY'
          from pathlib import Path
          import json

          runtime_root = Path('Assets/VoxelEngine/Storage/Runtime')

          # Normalize implementation namespaces. API-facing logical values remain in Storage.Api.
          for path in runtime_root.rglob('*.cs'):
              text = path.read_text()
              text = text.replace('namespace VoxelEngine.Core.Storage', 'namespace VoxelEngine.Storage.Runtime')
              text = text.replace('namespace VoxelEngine.Core.Occupancy', 'namespace VoxelEngine.Storage.Runtime.Occupancy')
              text = text.replace('using VoxelEngine.Core.Storage;', 'using VoxelEngine.Storage.Runtime;')
              text = text.replace('using VoxelEngine.Core.Occupancy;', 'using VoxelEngine.Storage.Runtime.Occupancy;')
              text = text.replace('VoxelEngine.Core.Storage.', 'VoxelEngine.Storage.Runtime.')
              text = text.replace('VoxelEngine.Core.Occupancy.', 'VoxelEngine.Storage.Runtime.Occupancy.')
              path.write_text(text)

          # Migrate concrete implementation consumers. These are currently tests, Showcase/bootstrap,
          # CI/editor tooling and Tools; engine subsystem runtimes already consume Storage.Api only.
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  if runtime_root in path.parents:
                      continue
                  text = path.read_text()
                  updated = text.replace('using VoxelEngine.Core.Storage;', 'using VoxelEngine.Storage.Runtime;')
                  updated = updated.replace('using VoxelEngine.Core.Occupancy;', 'using VoxelEngine.Storage.Runtime.Occupancy;')
                  updated = updated.replace('= VoxelEngine.Core.Storage.', '= VoxelEngine.Storage.Runtime.')
                  updated = updated.replace('VoxelEngine.Core.Storage.', 'VoxelEngine.Storage.Runtime.')
                  updated = updated.replace('VoxelEngine.Core.Occupancy.', 'VoxelEngine.Storage.Runtime.Occupancy.')
                  if updated != text:
                      path.write_text(updated)

          runtime_asm = Path('Assets/VoxelEngine/Storage/Runtime/VoxelEngine.Storage.Runtime.asmdef')
          data = json.loads(runtime_asm.read_text())
          data['name'] = 'VoxelEngine.Storage.Runtime'
          data['rootNamespace'] = 'VoxelEngine.Storage.Runtime'
          data['references'] = [
              'VoxelEngine.Foundation',
              'VoxelEngine.Storage.Api',
              'Unity.Burst',
              'Unity.Collections',
              'Unity.Mathematics',
          ]
          data['autoReferenced'] = False
          data['allowUnsafeCode'] = True
          runtime_asm.write_text(json.dumps(data, indent=2) + '\n')

          # Every former broad-Core consumer that still needs concrete storage now resolves the
          # same implementation through Storage.Runtime. The later Composition slice removes the
          # remaining app/tool wiring references; engine runtimes already have none.
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.asmdef'):
                  if path == runtime_asm:
                      continue
                  obj = json.loads(path.read_text())
                  refs = obj.get('references', [])
                  if 'VoxelEngine.Core' in refs:
                      refs = ['VoxelEngine.Storage.Runtime' if r == 'VoxelEngine.Core' else r for r in refs]
                      # avoid duplicates if a test/tool already had the new ref
                      obj['references'] = list(dict.fromkeys(refs))
                      path.write_text(json.dumps(obj, indent=2) + '\n')

          assembly_info = Path('Assets/VoxelEngine/Storage/Api/AssemblyInfo.cs')
          text = assembly_info.read_text()
          text = text.replace('// Storage.Api owns the contract; the current Core assembly is the temporary implementation\n// owner during Cutover 2. This friend is deleted when Storage.Runtime replaces Core.\n',
                              '// Storage.Api owns the contract; Storage.Runtime is its physical implementation owner.\n')
          text = text.replace('[assembly: InternalsVisibleTo("VoxelEngine.Core")]\n', '')
          assembly_info.write_text(text)

          constitution = Path('Assets/Tests/EditMode/ConstitutionGuardTests.cs')
          text = constitution.read_text()
          text = text.replace('            // Legacy root remains protected until the final Core deletion cutover.\n            "Core",\n            // Target architecture roots. Non-existent roots are ignored during migration.\n',
                              '            // Deterministic architecture roots. Non-existent roots are ignored during migration.\n')
          constitution.write_text(text)

          # The physical owner has moved. Keep boundary tests aimed at the new forbidden runtime
          # namespace rather than a deleted compatibility namespace.
          replacements = {
              'Assets/Tests/EditMode/TerrainStorageBoundaryTests.cs': [
                  ('"VoxelEngine.Core.Storage",', '"VoxelEngine.Storage.Runtime",'),
              ],
              'Assets/Tests/EditMode/EditsStorageBoundaryTests.cs': [
                  ('"VoxelEngine.Core.Storage",', '"VoxelEngine.Storage.Runtime",'),
                  ('"VoxelEngine.Core.Occupancy",', '"VoxelEngine.Storage.Runtime.Occupancy",'),
              ],
              'Assets/Tests/EditMode/StreamingStorageBoundaryTests.cs': [
                  ('"VoxelEngine.Core.Storage",', '"VoxelEngine.Storage.Runtime",'),
                  ('\\"VoxelEngine.Core\\"', '\\"VoxelEngine.Storage.Runtime\\"'),
                  ('VoxelEngine.Streaming.Runtime.asmdef -> VoxelEngine.Core', 'VoxelEngine.Streaming.Runtime.asmdef -> VoxelEngine.Storage.Runtime'),
              ],
              'Assets/Tests/EditMode/StructuresStorageBoundaryTests.cs': [
                  ('"VoxelEngine.Core.Storage",', '"VoxelEngine.Storage.Runtime",'),
                  ('StringAssert.DoesNotContain("VoxelEngine.Core", asmdef);', 'StringAssert.DoesNotContain("VoxelEngine.Storage.Runtime", asmdef);'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)

          # Core should now contain only retired Unity folder metadata. Delete the shell rather
          # than keeping a forwarding facade/assembly.
          core = Path('Assets/VoxelEngine/Core')
          remaining_code = [p for p in core.rglob('*') if p.is_file() and p.suffix in {'.cs', '.asmdef'}]
          if remaining_code:
              raise SystemExit('Core still contains code after Storage/Terrain extraction:\n' + '\n'.join(map(str, remaining_code)))

          # Validate engine Runtime direction before publishing. Tests/Showcase/Tools are dealt
          # with by Composition, but subsystem Runtime assemblies must already be Api-only.
          violations = []
          for path in Path('Assets/VoxelEngine').rglob('*.asmdef'):
              obj = json.loads(path.read_text())
              name = obj.get('name', '')
              if not name.endswith('.Runtime') or name == 'VoxelEngine.Storage.Runtime':
                  continue
              refs = obj.get('references', [])
              if 'VoxelEngine.Storage.Runtime' in refs:
                  violations.append(f'{name} -> VoxelEngine.Storage.Runtime')
          if violations:
              raise SystemExit('foreign engine Runtime refs to Storage.Runtime:\n' + '\n'.join(violations))

          # Ensure the new Runtime source itself has no old namespace/import.
          stale_runtime = []
          for path in runtime_root.rglob('*.cs'):
              text = path.read_text()
              if 'VoxelEngine.Core.Storage' in text or 'VoxelEngine.Core.Occupancy' in text:
                  stale_runtime.append(str(path))
          if stale_runtime:
              raise SystemExit('old Core storage namespace remains inside Storage.Runtime:\n' + '\n'.join(stale_runtime))
          PY

          git rm -r Assets/VoxelEngine/Core
          if test -f Assets/VoxelEngine/Core.meta; then git rm Assets/VoxelEngine/Core.meta; fi
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets Packages
          git commit -m 'refactor(storage): move physical owner into Storage Runtime and delete Core'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
