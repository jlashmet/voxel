name: Record Tools shell removal
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/record-tools-shell-removal.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Record accepted dead Tools cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()
          old_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional `VoxelEngine.Composition` Storage lifetime/bootstrap created; far-field Showcase reads are Storage.Api-only; 386/373/13 acceptance preserves the exact 13 known failures | migrate remaining Showcase/Tools concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          new_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field Showcase is Storage.Api-only; empty Runtime-coupled Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          if text.count(old_row) != 1:
              raise SystemExit('Cutover 13 status row did not match')
          text = text.replace(old_row, new_row, 1)

          old_gate = '- Latest accepted code gate: `6dac3e29d171bf6a8fe7a5538717e4beabdbdaef` — 386 tests, 373 passed, exactly the same 13 known baseline failures. Composition Storage slice run `31895983180` adds two passing bootstrap/lifetime tests, accepts the functional `VoxelEngine.Composition` Storage owner, and accepts the far-field Showcase read migration to Storage.Api.'
          new_gate = '- Latest accepted code gate: `a4f80c5d96397e6de64720c3b3608b6e81fb27a5` — 386 tests, 373 passed, exactly the same 13 known baseline failures. Tools shell removal run `31896191600` accepts deletion of the source-empty `VoxelEngine.Tools` / `VoxelEngine.Tools.Features` assemblies after proving no foreign asmdef references remained.'
          if text.count(old_gate) != 1:
              raise SystemExit('latest accepted gate line did not match')
          text = text.replace(old_gate, new_gate, 1)

          marker = '- [x] `FarFieldStructureStore` and both Showcase far-field capture call sites now consume `IRegionReadSource` / `RegionReadView` rather than `RegionTable`/`BrickPool`; accepted by gate `31895983180`.\n'
          addition = marker + '- [x] Empty `VoxelEngine.Tools` / `VoxelEngine.Tools.Features` assembly shells deleted at `a4f80c5d96397e6de64720c3b3608b6e81fb27a5`; hosted pre-delete inventory found no source and no foreign references, and gate `31896191600` preserved the 386/373/13 baseline.\n'
          if text.count(marker) != 1:
              raise SystemExit('Composition progress marker did not match')
          text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: record accepted Tools shell removal'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
