name: Apply step4 ready-empty guard diagnostics

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-step4-ready-empty-guard-diag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0

      - name: Apply predicate diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          diag_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Step4FalseEmptyDiagnostics.cs')
          diag = diag_path.read_text()
          diag = replace_once(diag,
              '        private static long s_ReadyEmptyPublications;\n',
              '        private static long s_ReadyEmptyPublications;\n'
              '        private static long s_ReadyEmptySnapshotTaken;\n'
              '        private static long s_ReadyEmptyOwnedSolid;\n'
              '        private static long s_ReadyEmptyWithProfiles;\n'
              '        private static long s_ReadyEmptyUsedFallback;\n',
              'ready-empty counter fields')
          diag = replace_once(diag,
              '            public readonly long ReadyEmptyPublications;\n',
              '            public readonly long ReadyEmptyPublications;\n'
              '            public readonly long ReadyEmptySnapshotTaken;\n'
              '            public readonly long ReadyEmptyOwnedSolid;\n'
              '            public readonly long ReadyEmptyWithProfiles;\n'
              '            public readonly long ReadyEmptyUsedFallback;\n',
              'snapshot fields')
          diag = replace_once(diag,
              '                long fallbackPublishedNonEmpty,\n                long readyEmptyPublications)\n',
              '                long fallbackPublishedNonEmpty,\n'
              '                long readyEmptyPublications,\n'
              '                long readyEmptySnapshotTaken,\n'
              '                long readyEmptyOwnedSolid,\n'
              '                long readyEmptyWithProfiles,\n'
              '                long readyEmptyUsedFallback)\n',
              'snapshot ctor parameters')
          diag = replace_once(diag,
              '                FallbackPublishedNonEmpty = fallbackPublishedNonEmpty;\n                ReadyEmptyPublications = readyEmptyPublications;\n',
              '                FallbackPublishedNonEmpty = fallbackPublishedNonEmpty;\n'
              '                ReadyEmptyPublications = readyEmptyPublications;\n'
              '                ReadyEmptySnapshotTaken = readyEmptySnapshotTaken;\n'
              '                ReadyEmptyOwnedSolid = readyEmptyOwnedSolid;\n'
              '                ReadyEmptyWithProfiles = readyEmptyWithProfiles;\n'
              '                ReadyEmptyUsedFallback = readyEmptyUsedFallback;\n',
              'snapshot ctor assignments')
          diag = replace_once(diag,
              '              + $"readyEmpty:{ReadyEmptyPublications}";\n',
              '              + $"readyEmpty:{ReadyEmptyPublications}/"\n'
              '              + $"readyEmptyState:snapshot:{ReadyEmptySnapshotTaken}/"\n'
              '              + $"owned:{ReadyEmptyOwnedSolid}/profiles:{ReadyEmptyWithProfiles}/"\n'
              '              + $"fallbackUsed:{ReadyEmptyUsedFallback}";\n',
              'snapshot tostring')
          diag = replace_once(diag,
              '            Interlocked.Read(ref s_FallbackPublishedNonEmpty),\n            Interlocked.Read(ref s_ReadyEmptyPublications));\n',
              '            Interlocked.Read(ref s_FallbackPublishedNonEmpty),\n'
              '            Interlocked.Read(ref s_ReadyEmptyPublications),\n'
              '            Interlocked.Read(ref s_ReadyEmptySnapshotTaken),\n'
              '            Interlocked.Read(ref s_ReadyEmptyOwnedSolid),\n'
              '            Interlocked.Read(ref s_ReadyEmptyWithProfiles),\n'
              '            Interlocked.Read(ref s_ReadyEmptyUsedFallback));\n',
              'current snapshot')
          diag = replace_once(diag,
              '            Interlocked.Exchange(ref s_FallbackPublishedNonEmpty, 0);\n            Interlocked.Exchange(ref s_ReadyEmptyPublications, 0);\n',
              '            Interlocked.Exchange(ref s_FallbackPublishedNonEmpty, 0);\n'
              '            Interlocked.Exchange(ref s_ReadyEmptyPublications, 0);\n'
              '            Interlocked.Exchange(ref s_ReadyEmptySnapshotTaken, 0);\n'
              '            Interlocked.Exchange(ref s_ReadyEmptyOwnedSolid, 0);\n'
              '            Interlocked.Exchange(ref s_ReadyEmptyWithProfiles, 0);\n'
              '            Interlocked.Exchange(ref s_ReadyEmptyUsedFallback, 0);\n',
              'reset state counters')
          diag = replace_once(diag,
              '        internal static void RecordReadyEmptyPublication()\n        {\n            Interlocked.Increment(ref s_ReadyEmptyPublications);\n            UnityEngine.Debug.Log($"[Step4FalseEmptyLifecycle] {Current}");\n        }\n',
              '        internal static void RecordReadyEmptyPublication(\n'
              '            bool snapshotTaken, bool hasOwnedSolid, bool hasProfiles, bool usedFallback)\n'
              '        {\n'
              '            Interlocked.Increment(ref s_ReadyEmptyPublications);\n'
              '            if (snapshotTaken) Interlocked.Increment(ref s_ReadyEmptySnapshotTaken);\n'
              '            if (hasOwnedSolid) Interlocked.Increment(ref s_ReadyEmptyOwnedSolid);\n'
              '            if (hasProfiles) Interlocked.Increment(ref s_ReadyEmptyWithProfiles);\n'
              '            if (usedFallback) Interlocked.Increment(ref s_ReadyEmptyUsedFallback);\n'
              '            UnityEngine.Debug.Log($"[Step4FalseEmptyLifecycle] {Current}");\n'
              '        }\n',
              'ready-empty recorder')
          diag_path.write_text(diag)

          cache_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          cache = cache_path.read_text()
          cache = replace_once(cache,
              '                    Step4FalseEmptyDiagnostics.RecordReadyEmptyPublication();\n',
              '                    Step4FalseEmptyDiagnostics.RecordReadyEmptyPublication(\n'
              '                        _build.SnapshotTaken, _build.HasOwnedSolid,\n'
              '                        _buildProfileBlocks.Length != 0,\n'
              '                        _build.UsedFeaturePreservingFallback);\n',
              'ready-empty callsite')
          cache_path.write_text(cache)

          plan_path = Path('.claude/plans/voxel-showcase-rendering-repair-v2.md')
          plan = plan_path.read_text()
          open_task = '- [ ] Determine which fallback-admission predicate is false for those eight current-empty frustum chunks (`exact-owned` classification versus profile-backed exclusion), add a focused regression for that predicate, and fix only the first proven false predicate before changing coarse geometry again.\n'
          replacement = (
              '- [x] Add per-publication step-4 ready-empty guard-state diagnostics at `FinishBuild`: record whether the exact snapshot was taken, whether the build owns solid content, whether profile-backed geometry is present, and whether feature-preserving fallback was used. This makes the empty-decision predicate observable even when the build began before the focused test reset; no renderer behavior, budget, LOD distance or threshold changes.\n'
              '- [ ] Determine the first false ready-empty predicate from the focused lifecycle gate, add a focused regression for that predicate, and fix only that measured branch before changing coarse geometry again.\n'
          )
          plan = replace_once(plan, open_task, replacement, 'plan predicate task')
          plan_path.write_text(plan)
          PY
          git diff --check
          grep -q 'readyEmptyState:snapshot' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Step4FalseEmptyDiagnostics.cs
          grep -q '_build.SnapshotTaken, _build.HasOwnedSolid' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'Add per-publication step-4 ready-empty guard-state diagnostics' .claude/plans/voxel-showcase-rendering-repair-v2.md

      - name: Commit diagnostics and retire transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Step4FalseEmptyDiagnostics.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm -f .github/workflows/apply-step4-ready-empty-guard-diag.yml
          git commit -m 'diag(rendering): expose step4 ready-empty guard state'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
