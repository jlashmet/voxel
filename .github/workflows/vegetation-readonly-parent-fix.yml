name: Vegetation readonly parent fix publisher
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs'),
              Path('Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs'),
          ]
          old = 'int[] parents = skeleton.BranchParents;'
          new = 'IReadOnlyList<int> parents = skeleton.BranchParents;'
          for path in paths:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old parent assignment, found {count}')
              path.write_text(source.replace(old, new))
          PY
          git rm .github/workflows/vegetation-readonly-parent-fix.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs
          git add -u .github/workflows/vegetation-readonly-parent-fix.yml
          git commit -m 'fix: respect readonly vegetation topology API'
          git push origin HEAD:${{ github.ref_name }}
