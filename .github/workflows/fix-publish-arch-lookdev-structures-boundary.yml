name: Repair ArchLookdev boundary publisher
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/fix-publish-arch-lookdev-structures-boundary.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Repair publisher shell guard
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/publish-arch-lookdev-structures-boundary.yml')
          s = p.read_text()
          old = "          ! grep -q 'using VoxelEngine.Structures.Runtime;' Assets/Scenes/Showcase/ArchLookdev.cs\n"
          new = "          if grep -q 'using VoxelEngine.Structures.Runtime;' Assets/Scenes/Showcase/ArchLookdev.cs; then\n            echo 'ArchLookdev still imports Structures.Runtime' >&2\n            exit 1\n          fi\n"
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one broken grep guard')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-arch-lookdev-structures-boundary.yml
          git commit -m 'ci(refactor): fix ArchLookdev publisher guard'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
