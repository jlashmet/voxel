name: Record Edits progress
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if line.startswith('| 5 — Edits |'):
                  lines[i]='| 5 — Edits | **In progress — current** | Edits.Api/Runtime created; canonical edit/wire vocabulary is in Api; Storage-independent helpers and `ExplosionExpansion` are in Runtime; explosion reads and authoritative mutation route through Storage.Api; parity accepted | move `DensityCap` and `DeterministicAlterationApplier` to Runtime; remove `VoxelEngine.Core.Edits`; delete server wrapper; finish Net protocol cleanup |'
              if line.startswith('- Latest accepted code gate:'):
                  lines[i]='- Latest accepted code gate: `3887960c64c2f253bdda97a4a4174faf281aab35` — 382 tests, 369 passed, exactly the same 13 known baseline failures. Accepted Edits Runtime expansion slice: `AllocationBudget`, `DeterministicRandom`, `BrushExpansion`, `BuildBrushes`, `RawBatchExpansion`, and `ExplosionExpansion` are under `Edits/Runtime`; moved Unity GUIDs are preserved; fake physical-Storage helper parameters and unused `BuildBrushes.TryApply` are gone; `ExplosionExpansion` reads through Storage.Api.'
          marker='- [ ] Edits.Api/Runtime physical move and namespace cutover complete.'
          idx=lines.index(marker)
          progress=[
              '- [x] Storage-independent Edits helpers (`AllocationBudget`, `DeterministicRandom`, `BrushExpansion`, `BuildBrushes`, `RawBatchExpansion`) are physically under `Edits/Runtime`; fake physical-Storage parameters and unused `BuildBrushes.TryApply` were removed.',
              '- [x] `ExplosionExpansion` is physically under `Edits/Runtime` and reads through Storage.Api `IRegionReadSource`/`RegionReadView` rather than physical Storage representation.',
              '- [x] Edits Runtime expansion/helper slice accepted by CI at `3887960c64c2f253bdda97a4a4174faf281aab35`: 382 total / 369 passed / exact same 13 known baseline failures.'
          ]
          if progress[0] not in lines:
              lines[idx:idx]=progress
          p.write_text('\n'.join(lines)+'\n')
          PY
          git rm .github/workflows/mark-edits-progress.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted Edits Runtime expansion progress'
          git push origin HEAD:${{ github.ref_name }}
