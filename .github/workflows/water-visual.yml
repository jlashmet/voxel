name: Water Visual

on:
  workflow_dispatch:
  push:
    branches:
      - water
    paths:
      - 'Assets/VoxelEngine/CI/Editor/WaterStudyCapture.cs'
      - 'Assets/VoxelEngine/CI/Editor/WaterStudyCapture.cs.meta'
      - 'Assets/VoxelEngine/CI/Editor/StylizedWaterLookdev.shader'
      - 'Assets/VoxelEngine/CI/Editor/StylizedWaterLookdev.shader.meta'
      - '.github/workflows/water-visual.yml'

# Keep water captures serialized and wait for any prior Unity process to fully exit.
concurrency:
  group: water-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-water:
    name: Render isolated Sunlit water study
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15

    steps:
      - name: Checkout without deleting Unity import cache
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Reset tracked files but preserve Library cache
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            echo 'Another Unity editor is active; waiting 5 seconds...'
            sleep 5
          done

      - name: Render water study through guarded Unity launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/Water"
          chmod +x tools/unity-run.sh
          tools/unity-run.sh \
            -batchmode \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.WaterStudyCapture.Run \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Water/unity.log" \
            -quit
          test -s "$GITHUB_WORKSPACE/Artifacts/Water/water-study.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/Water/water-study.txt"

      - name: Show water metadata and Unity tail
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/Water/water-study.txt" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/Water/water-study.txt"
          fi
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/Water/unity.log" ]]; then
            tail -n 120 "$GITHUB_WORKSPACE/Artifacts/Water/unity.log"
          fi

      - name: Upload water artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-study-${{ github.sha }}
          path: Artifacts/Water/
          if-no-files-found: warn
          retention-days: 14
