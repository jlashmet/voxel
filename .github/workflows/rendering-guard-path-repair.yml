name: Rendering split guard repair
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-guard-path-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          arch = Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs')
          text = arch.read_text()
          old = 'if (!reference.EndsWith(".Runtime", StringComparison.Ordinal))\n                        continue;'
          new = 'if (!reference.StartsWith("VoxelEngine.", StringComparison.Ordinal)\n                        || !reference.EndsWith(".Runtime", StringComparison.Ordinal))\n                        continue;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Runtime-reference guard, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_root = 'string renderingRoot = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Rendering");'
          new_root = 'string renderingRoot = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Rendering", "Runtime");'
          if text.count(old_root) != 1:
              raise SystemExit('expected one Rendering read root')
          arch.write_text(text.replace(old_root, new_root, 1))

          surface = Path('Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs')
          text = surface.read_text()
          old_shader = 'Assets/VoxelEngine/Rendering/Shaders/SmoothSurface.shader'
          new_shader = 'Assets/VoxelEngine/Rendering/Runtime/Shaders/SmoothSurface.shader'
          if text.count(old_shader) != 1:
              raise SystemExit(f'expected one shader path, found {text.count(old_shader)}')
          surface.write_text(text.replace(old_shader, new_shader, 1))
          PY
          git rm .github/workflows/rendering-guard-path-repair.yml
          grep -n 'Rendering", "Runtime' Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs
          grep -n 'VoxelEngine.Rendering.Runtime' Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs >/dev/null || true
          grep -n 'Rendering/Runtime/Shaders/SmoothSurface.shader' Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git add -u .github/workflows
          git commit -m 'test: follow Rendering Runtime assembly split'
          git push origin HEAD:${{ github.ref_name }}
