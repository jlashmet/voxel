name: Terrain Cutover 3 acceptance
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a46df0f39299535f6d036fd0641964eefd3a516
          fetch-depth: 1
      - name: Verify Terrain Runtime final boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          runtime = Path('Assets/VoxelEngine/Terrain/Runtime/VoxelEngine.Terrain.Runtime.asmdef')
          generator = Path('Assets/VoxelEngine/Terrain/Runtime/TerrainGenerator.cs')
          old = Path('Assets/VoxelEngine/Core/Terrain')
          if old.exists():
              raise SystemExit('legacy Core/Terrain folder remains')
          if not runtime.is_file() or not generator.is_file():
              raise SystemExit('Terrain Runtime move incomplete')

          data = json.loads(runtime.read_text())
          refs = {r for r in data.get('references', []) if r.startswith('VoxelEngine.')}
          allowed = {'VoxelEngine.Terrain.Api', 'VoxelEngine.Storage.Api', 'VoxelEngine.Foundation'}
          if refs != allowed:
              raise SystemExit('Terrain.Runtime engine refs differ from allowed set: ' + ', '.join(sorted(refs)))

          text = generator.read_text()
          if 'namespace VoxelEngine.Terrain.Runtime' not in text:
              raise SystemExit('TerrainGenerator is not in Terrain.Runtime namespace')
          code_only = re.sub(r'//.*?$|/\*.*?\*/', '', text, flags=re.M | re.S)
          forbidden = ['RegionTable', 'BrickPool', 'BrickRef', 'VoxelEngine.Core.Storage']
          for token in forbidden:
              if token in code_only:
                  raise SystemExit('TerrainGenerator contains forbidden physical storage token: ' + token)

          stale = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  if 'VoxelEngine.Core.Terrain' in path.read_text():
                      stale.append(str(path))
          if stale:
              raise SystemExit('legacy Core.Terrain source references remain:\n' + '\n'.join(stale))

          worldgen = Path('Packages/com.mountingforce.worldgen/Runtime/Voxel/MountingForce.WorldGen.Voxel.asmdef')
          worldgen_refs = json.loads(worldgen.read_text()).get('references', [])
          if 'VoxelEngine.Terrain.Runtime' in worldgen_refs:
              raise SystemExit('WorldGen.Voxel references Terrain.Runtime')
          if 'VoxelEngine.Terrain.Api' not in worldgen_refs:
              raise SystemExit('WorldGen.Voxel lost Terrain.Api')

          structures_runtime = Path('Assets/VoxelEngine/Structures/Runtime/VoxelEngine.Structures.Runtime.asmdef')
          if structures_runtime.exists() and 'VoxelEngine.Terrain.Runtime' in json.loads(structures_runtime.read_text()).get('references', []):
              raise SystemExit('Structures.Runtime references Terrain.Runtime')

          print('Terrain Cutover 3 static boundary accepted')
          PY

  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a46df0f39299535f6d036fd0641964eefd3a516
          clean: false
          fetch-depth: 1
      - name: Reset pinned Terrain candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 4a46df0f39299535f6d036fd0641964eefd3a516
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/TerrainCutover3"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-cutover3-4a46df0f
          path: Artifacts/TerrainCutover3/
          if-no-files-found: warn
          retention-days: 14
