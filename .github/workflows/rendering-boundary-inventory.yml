name: Rendering boundary inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-boundary-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          clean: false
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo '=== Rendering files/namespaces ==='
          find Assets/VoxelEngine/Rendering -type f \( -name '*.cs' -o -name '*.asmdef' \) -print | sort
          grep -RIn '^namespace ' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
          echo '=== Rendering imports of forbidden/legacy engine namespaces ==='
          grep -RInE 'using VoxelEngine\.(Core|Storage\.Runtime|Vegetation\.Runtime|Terrain|Structures|Edits|Net)' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
          echo '=== External source references to rendering namespaces/types ==='
          grep -RIn 'VoxelEngine.Rendering' Assets Packages --include='*.cs' --include='*.asmdef' | grep -v '^Assets/VoxelEngine/Rendering/' | sort || true
          echo '=== asmdefs referencing broad Rendering ==='
          grep -RIl 'VoxelEngine.Rendering' Assets Packages --include='*.asmdef' | grep -v '^Assets/VoxelEngine/Rendering/' | sort || true
          echo '=== broad Rendering public declarations ==='
          grep -RInE '^\s*public (sealed |static |readonly |partial )*(class|struct|interface|enum)' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
