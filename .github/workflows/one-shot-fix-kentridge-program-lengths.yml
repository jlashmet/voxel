name: One-shot Fix Kentridge Program Lengths

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-fix-kentridge-program-lengths.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Replace legacy program lengths
        run: python .github/scripts/one_shot_fix_kentridge_program_lengths.py
      - name: Verify exact source scope
        run: |
          git diff --stat
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeFrontagePathCatalogue.cs Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeTerraceSupportCatalogue.cs Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeUrbanSidewalkCatalogue.cs "
      - name: Commit and self-clean
        run: |
          rm .github/scripts/one_shot_fix_kentridge_program_lengths.py
          rm .github/workflows/one-shot-fix-kentridge-program-lengths.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: derive kentridge program lengths from shape ops"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
