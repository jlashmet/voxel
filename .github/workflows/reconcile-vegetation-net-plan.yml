name: Finish Net checklist reconciliation
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/reconcile-vegetation-net-plan.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          for old,new in [
            ('- [ ] structural graph is gone from Net;', '- [x] structural graph is gone from Net;'),
            ('- [ ] no duplicate deterministic edit applier wrapper;', '- [x] no duplicate deterministic edit applier wrapper;'),
          ]:
            n=s.count(old)
            if n != 1:
              raise SystemExit(f'expected exactly one match, got {n}: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          git rm .github/workflows/reconcile-vegetation-net-plan.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark resolved Net ownership gates'
          git pull --rebase origin refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
