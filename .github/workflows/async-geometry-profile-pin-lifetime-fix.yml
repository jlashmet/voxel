name: Profile COW pin lifetime one-shot fix

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-profile-pin-lifetime-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded profile pin lifetime fix
        run: python3 .github/scripts/async_geometry_profile_pin_lifetime_fix.py
      - name: Static guards
        run: |
          grep -q 'NativeArray<byte> mixedVoxels = PinnedMixedVoxelsOrFallback();' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'ProfileBackingKeepsCowPinsUntilProfileEmissionFinishes' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs').read_text()
          read = s[s.index('private void ReadSnapshotCell'):s.index('private float3 DensityNormal')]
          assert '_densityMixedVoxels[brick.MixedOffset' not in read
          assert 'PinnedMixedVoxelsOrFallback()' in read
          profile = s[s.index('if (_build.Phase == 3)'):s.index('if (_build.Phase == 4)')]
          assert 'StepReleasePinnedSnapshotBlocks(deadline)' in profile
          PY
      - name: Commit profile pin lifetime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Keep COW snapshot pins through profile emission'
          git fetch origin refactor/async-geometry-pipeline
          git rebase origin/refactor/async-geometry-pipeline
          git push origin HEAD:refactor/async-geometry-pipeline
