name: Sync accepted Net checklist summary
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/sync-net-acceptance-plan.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard origin/refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          replacements = {
            '**Current focus:** Cutover 11 Net — Api/Runtime decomposition and ownership cleanup':
              '**Current focus:** Cutover 12 Rendering — final Api/Runtime physical move',
            '| 11 — Net | **In progress — current** | Net.Api/Runtime physical decomposition, Runtime namespace normalization, broad assembly deletion and domain-only Runtime references are accepted by the final static architecture gate; earlier cutovers removed the structural graph and duplicate edit-applier wrapper | baseline revalidation still required for residency/snapshot/protocol behavior before Cutover 11 can close |':
              '| 11 — Net | **Complete** | Net.Api/Runtime physical decomposition, Runtime namespace normalization, broad assembly deletion and domain-only Runtime references are accepted; residency delegates to Streaming.Api; semantic hash/snapshot/repair uses Storage.Api logical capabilities; structural graph and duplicate edit-applier wrapper are gone; final static and behavioral gates accepted | none |',
            '- Latest accepted code gate: `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Net ownership/decomposition work after this gate is code-landed but remains unaccepted until a full compile/test run returns to this baseline; the Net-specific artifacts inspected during revalidation stopped at compilation and did not produce `results.xml`.':
              '- Latest accepted code gate: `ed126903cd18dcd62324fab41942d41fdaa37532` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Net static ownership checks passed, and the isolated Unity acceptance run produced a complete `results.xml` with the exact accepted failure-name set; cancellation occurred only after the complete result artifact had been written.'
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old[:80]!r}, got {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git rm .github/workflows/sync-net-acceptance-plan.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: mark Net cutover complete'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
