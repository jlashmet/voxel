name: Cancel stale Net queue
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/cancel-stale-net-queue.yml]
permissions:
  actions: write
  contents: read
# Retriggered after the Net Runtime move preparation so only the pinned ownership gate remains.
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN: '31890520511'
        shell: bash
        run: |
          set -euo pipefail
          while :; do
            json="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/actions/runs?branch=refactor/system-boundaries-foundation-storage&status=queued&per_page=100&page=1")"
            ids="$(jq -r --arg keep "$KEEP_RUN" '.workflow_runs[] | select((.id|tostring) != $keep) | .id' <<<"$json")"
            if [ -z "$ids" ]; then
              echo "only preserved gate remains queued"
              break
            fi
            while read -r id; do
              [ -z "$id" ] && continue
              echo "cancelling stale queued run $id"
              curl -fsSL -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
            done <<<"$ids"
            sleep 1
          done
