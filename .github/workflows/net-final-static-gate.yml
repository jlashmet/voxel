name: Net final static architecture gate
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-final-static-gate.yml]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          test -d Assets/VoxelEngine/Net/Api
          test -d Assets/VoxelEngine/Net/Runtime
          test ! -e Assets/VoxelEngine/Net/VoxelEngine.Net.asmdef
          test ! -e Assets/VoxelEngine/Net/VoxelEngine.Net.asmdef.meta
          for d in Client Interest Protocol Server Transport; do
            test -d "Assets/VoxelEngine/Net/Runtime/$d"
            test ! -e "Assets/VoxelEngine/Net/$d"
          done
          ! grep -RInE 'namespace VoxelEngine\.Net\.(Client|Interest|Protocol|Server|Transport)([ ;.{]|$)' Assets/VoxelEngine/Net/Runtime --include='*.cs'
          ! grep -RInE 'using VoxelEngine\.Net\.(Client|Interest|Protocol|Server|Transport);' Assets Packages --include='*.cs'
          ! grep -RIn '"VoxelEngine.Net"' Assets Packages --include='*.asmdef'
          ! grep -RIn 'VoxelEngine.Net.Runtime' Packages --include='*.cs' --include='*.asmdef'
          ! grep -RInE '\.(DrainReady|ApplyReadyAuthoritativeEvents)\(\s*ref ' Assets/Tests Assets/Scenes --include='*.cs'
          ! grep -RInE '\.ProcessAuthoritativeTick\(\s*[^,]+,\s*ref ' Assets/Tests Assets/Scenes --include='*.cs'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Assets/VoxelEngine/Net/Runtime/VoxelEngine.Net.Runtime.asmdef')
          refs=set(json.loads(p.read_text())['references'])
          allowed={
            'VoxelEngine.Net.Api','VoxelEngine.Foundation','VoxelEngine.Edits.Api',
            'VoxelEngine.Streaming.Api','VoxelEngine.Storage.Api','VoxelEngine.StructuralIntegrity.Api',
            'Unity.Collections','Unity.Mathematics','Unity.Networking.Transport'
          }
          extra=refs-allowed
          missing={'VoxelEngine.Net.Api','VoxelEngine.Edits.Api','VoxelEngine.Streaming.Api','VoxelEngine.Storage.Api'}-refs
          if extra: raise SystemExit(f'forbidden Net.Runtime references: {sorted(extra)}')
          if missing: raise SystemExit(f'missing Net.Runtime domain references: {sorted(missing)}')
          print('Net final static architecture gate passed')
          PY
