name: Solid build workspace ownership one-shot patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-workspace-ownership-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_workspace_ownership_patch.py
      - name: Static guards
        run: |
          grep -q 'private readonly TransvoxelBuildWorkspace _workspace' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          ! grep -q 'new NativeArray<TransvoxelDensityBrick>' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'class TransvoxelBuildWorkspace' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs
          grep -q 'SolidResidencyAndHeavyBuildScratchHaveSeparateOwners' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit renderer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs.meta \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Separate solid residency from heavy build workspace memory'
          git push origin HEAD:refactor/async-geometry-pipeline
