name: Publish TerrainLookdev storage consolidation
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/publish-terrain-lookdev-storage-consolidation.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Consolidate physical storage adapter construction
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('Assets/Scenes/Showcase')
          main = root / 'TerrainLookdev.cs'
          s = main.read_text()
          marker = '        private VoxelWorldView WorldView()\n'
          helper = '''        private VoxelBrush CreateWriter(int budget)\n        {\n            var reads = new RegionReadSource(in _table, in _pool);\n            var mutations = new RegionMutationStore(in _table, in _pool);\n            return new VoxelBrush(reads, mutations, _palette, budget);\n        }\n\n        private void PublishAllResidentRegions()\n        {\n            using (NativeArray<int3> regions = _table.GetResidentCoords(Allocator.Temp))\n                for (int i = 0; i < regions.Length; i++) _changes.PublishRegion(regions[i]);\n        }\n\n'''
          if 'private VoxelBrush CreateWriter(int budget)' not in s:
              if marker not in s: raise SystemExit('TerrainLookdev WorldView marker missing')
              s = s.replace(marker, helper + marker, 1)
              main.write_text(s)

          writer_re = re.compile(
              r'(?P<i>\s*)var reads = new RegionReadSource\(in _table, in _pool\);\n'
              r'(?P=i)var mutations = new RegionMutationStore\(in _table, in _pool\);\n'
              r'(?P=i)var writer = new VoxelBrush\(reads, mutations, _palette, (?P<budget>[^;]+)\);')
          publish_re = re.compile(
              r'(?P<i>\s*)using \(NativeArray<int3> regions = _table\.GetResidentCoords\(Allocator\.Temp\)\)\n'
              r'(?P=i)    for \(int i = 0; i < regions\.Length; i\+\+\) _changes\.PublishRegion\(regions\[i\]\);')

          changed=[]
          writer_count=publish_count=0
          for p in sorted(root.glob('TerrainLookdev.*.cs')):
              text=p.read_text()
              def writer_sub(m):
                  nonlocal_placeholder = None
                  return f"{m.group('i')}var writer = CreateWriter({m.group('budget')});"
              text, wc = writer_re.subn(writer_sub, text)
              text, pc = publish_re.subn(lambda m: f"{m.group('i')}PublishAllResidentRegions();", text)
              writer_count += wc; publish_count += pc
              physical = ['RegionReadSource(', 'RegionMutationStore(', 'VoxelAccess.', 'RegionTable', 'BrickPool', 'OccupancyMask']
              if not any(t in text for t in physical):
                  text = text.replace('using VoxelEngine.Storage.Runtime;\n', '')
              if 'NativeArray<' not in text:
                  text = text.replace('using Unity.Collections;\n', '')
              if text != p.read_text():
                  p.write_text(text); changed.append(str(p))
          print('writer replacements', writer_count)
          print('publish replacements', publish_count)
          print('changed files', *changed, sep='\n')
          if writer_count < 4 or publish_count < 4:
              raise SystemExit('Expected repeated TerrainLookdev adapter patterns were not found')
          for p in sorted(root.glob('TerrainLookdev.*.cs')):
              text=p.read_text()
              if 'using VoxelEngine.Storage.Runtime;' in text:
                  print('still Storage.Runtime:', p)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/TerrainLookdev.cs Assets/Scenes/Showcase/TerrainLookdev.*.cs
          git diff --cached --check
          git commit -m 'refactor(showcase): consolidate lookdev storage adapters'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
