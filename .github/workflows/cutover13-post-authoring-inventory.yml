name: Cutover 13 post authoring inventory

on:
  push:
    paths:
      - .github/workflows/cutover13-post-authoring-inventory.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
      - name: Report remaining Showcase Runtime edges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('Assets/Scenes/Showcase')
          pat=re.compile(r'using\s+(VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*)\s*;')
          files=[]; namespaces=set()
          for p in sorted(root.rglob('*.cs')):
              hits=sorted(set(pat.findall(p.read_text(errors='ignore'))))
              if hits:
                  files.append((p,hits)); namespaces.update(hits)
          asm=json.loads((root/'VoxelEngine.Showcase.asmdef').read_text())
          refs=sorted(r for r in asm.get('references',[]) if isinstance(r,str) and '.Runtime' in r)
          print('FILES_WITH_RUNTIME=',len(files))
          for p,h in files: print(p,'=>',', '.join(h))
          print('RUNTIME_NAMESPACES=',len(namespaces))
          print('RUNTIME_ASMDEF_REFS=',len(refs))
          for r in refs: print('ASM',r)
          print('TABLE_POOL_TEST_REFS=')
          for p in sorted(Path('Assets/Tests').rglob('*.cs')):
              t=p.read_text(errors='ignore')
              if 'world.Table' in t or 'world.Pool' in t:
                  print(p)
          PY
