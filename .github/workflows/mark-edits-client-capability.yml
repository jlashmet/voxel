name: Record Edits client capability
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text=p.read_text()
          marker='- [ ] Edits.Api/Runtime physical move and namespace cutover complete.'
          progress='- [x] Client authoritative queue, event application/batch dispatch, and server validation consume the Edits.Api `IAlterationApplier` capability; no Net source imports or names `VoxelEngine.Core.Edits`/`DeterministicAlterationApplier`.\n- [x] Client/validation alteration-capability slice accepted by CI at `62af284179b38c01adc07e3d40f8627bac8174a6`: 382 total / 369 passed / exact same 13 known baseline failures.\n'
          if progress.splitlines()[0] not in text:
              text=text.replace(marker,progress+marker)
          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('| 5 — Edits |'):
                  lines[i]='| 5 — Edits | **In progress — current** | Edits.Api owns canonical vocabulary and `IAlterationApplier`; expansion helpers are in Runtime; Net protocol/client/server/validation consume Api only; dead `DensityCap` and redundant server wrapper are gone; Storage boundaries/parity accepted | move `DeterministicAlterationApplier` to Runtime; remove final `VoxelEngine.Core.Edits`; finish namespace cutover |'
              if line.startswith('- Latest accepted code gate:'):
                  lines[i]='- Latest accepted code gate: `62af284179b38c01adc07e3d40f8627bac8174a6` — 382 tests, 369 passed, exactly the same 13 known baseline failures. Accepted Edits client capability slice: all Net edit validation/residency/application flows consume Edits.Api `IAlterationApplier`; Net contains no `VoxelEngine.Core.Edits` import or deterministic implementation reference; Net still has no Edits.Runtime dependency.'
          p.write_text('\n'.join(lines)+'\n')
          PY
          git rm .github/workflows/mark-edits-client-capability.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted Edits client capability'
          git push origin HEAD:${{ github.ref_name }}
