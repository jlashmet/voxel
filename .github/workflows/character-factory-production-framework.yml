name: Character Factory production framework

on:
  push:
    branches:
      - agent/character-asset-generation-framework
    paths:
      - 'tools/character-factory/**'
      - 'docs/character-factory-generation-framework-plan.md'
      - '.github/workflows/character-factory-production-framework.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-factory-production-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile Character Factory Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/character-factory

      - name: Lint migrated production shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/character-factory/production/madeline/build.sh
          bash -n tools/character-factory/production/madeline/bootstrap_hunyuan_quality_macos.sh
          bash -n tools/character-factory/production/sunlit-cleric/build_macos.sh
          bash -n tools/character-factory/production/sunlit-cleric/build_robe_macos.sh
          bash -n tools/character-factory/production/sunlit-cleric/build_staff_macos.sh
          bash -n tools/character-factory/ci/bootstrap_hunyuan_quality_macos.sh

      - name: Run production framework tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools/character-factory/tests/test_pipeline_routing.py \
            tools/character-factory/tests/test_generator_backends.py \
            tools/character-factory/tests/test_production_routing.py \
            tools/character-factory/tests/test_reference_contract.py \
            tools/character-factory/tests/test_backend_profiles.py \
            tools/character-factory/tests/test_appearance_profiles.py \
            tools/character-factory/tests/test_projection_components.py \
            tools/character-factory/tests/test_rigid_contract.py \
            tools/character-factory/tests/test_catalogue.py \
            -v

      - name: List pinned backend profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/character-factory/character_factory.py profiles | tee /tmp/profiles.txt
          grep -q '^hunyuan-quality-macos' /tmp/profiles.txt
          grep -q '^hunyuan-smoke-macos' /tmp/profiles.txt
          grep -q '^triposr-smoke-macos' /tmp/profiles.txt

      - name: Build production asset catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/character-factory/character_factory.py catalogue \
            tools/character-factory/examples \
            --output /tmp/character-factory-catalogue.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/character-factory-catalogue.json').read_text())
          assert payload['assetCount'] == 4, payload
          assert payload['typeCounts'] == {
              'character': 1,
              'clothing': 1,
              'weapon': 1,
              'accessory': 1,
          }, payload['typeCounts']
          PY

      - name: Dry-run every production asset type and appearance strategy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/character-factory/character_factory.py produce \
            tools/character-factory/examples/cleric_character.json --dry-run
          python3 tools/character-factory/character_factory.py produce \
            tools/character-factory/examples/cleric_robe.json --dry-run
          python3 tools/character-factory/character_factory.py produce \
            tools/character-factory/examples/cleric_staff.json --dry-run
          python3 tools/character-factory/character_factory.py produce \
            tools/character-factory/examples/cleric_sun_charm.json --dry-run

      - name: Dry-run recursive and filtered production discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/character-factory/character_factory.py produce-batch \
            tools/character-factory/examples --dry-run
          python3 tools/character-factory/character_factory.py produce-batch \
            tools/character-factory/examples --dry-run \
            --type weapon --id cleric_staff_01

      - name: Dry-run changed-only production selection
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/character-factory-catalogue.json

          # Identical catalogue: no-op is success, not an error.
          python3 tools/character-factory/character_factory.py produce-batch \
            tools/character-factory/examples --dry-run \
            --changed-from "$BASE" | tee /tmp/no-change.txt
          grep -q 'produce-batch: no changed assets selected' /tmp/no-change.txt

          # Simulate a prior catalogue with a stale staff spec fingerprint.
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/character-factory-catalogue.json').read_text())
          for asset in payload['assets']:
              if asset['key'] == 'weapon:cleric_staff_01':
                  asset['specSha256'] = 'stale-spec'
          Path('/tmp/stale-spec-catalogue.json').write_text(json.dumps(payload))
          PY
          python3 tools/character-factory/character_factory.py produce-batch \
            tools/character-factory/examples --dry-run \
            --changed-from /tmp/stale-spec-catalogue.json \
            --change-kind spec --type weapon --id cleric_staff_01 \
            | tee /tmp/spec-change.txt
          grep -q 'catalogue-change: weapon:cleric_staff_01 kinds=spec' /tmp/spec-change.txt
          grep -q 'produce weapon/cleric_staff_01' /tmp/spec-change.txt

          # Simulate an appearance-reference-only delta for the robe.
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/character-factory-catalogue.json').read_text())
          for asset in payload['assets']:
              if asset['key'] == 'clothing:cleric_robe_01':
                  asset['referenceHashes']['appearance'] = {'front': 'stale-appearance'}
          Path('/tmp/stale-appearance-catalogue.json').write_text(json.dumps(payload))
          PY
          python3 tools/character-factory/character_factory.py produce-batch \
            tools/character-factory/examples --dry-run \
            --changed-from /tmp/stale-appearance-catalogue.json \
            --change-kind appearance --type clothing --id cleric_robe_01 \
            | tee /tmp/appearance-change.txt
          grep -q 'catalogue-change: clothing:cleric_robe_01 kinds=appearance' /tmp/appearance-change.txt
          grep -q 'produce clothing/cleric_robe_01' /tmp/appearance-change.txt
