name: Patch async geometry admission architecture guard

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-admission-guard-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Update clipmap admission source guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs')
          text = p.read_text()
          old = '''            StringAssert.Contains("public void SetClipmapWindow", cache);\n            StringAssert.Contains("if (!WithinClipmapWindow(chunk)) return;", cache);\n            StringAssert.Contains("WithinClipmapWindow(_build.Coordinate)", cache);'''
          new = '''            StringAssert.Contains("public void SetClipmapWindow", cache);\n            StringAssert.Contains("private bool TrackKnown", cache);\n            StringAssert.Contains("if (!WithinClipmapWindow(chunk)) return false;", cache);\n            StringAssert.Contains("!TrackKnown(chunk)) continue;", cache);\n            StringAssert.Contains("WithinClipmapWindow(_build.Coordinate)", cache);'''
          if text.count(old) != 1:
              raise SystemExit('clipmap admission architecture guard block mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit guard and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-admission-guard-fix.yml
          git add Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m "test(rendering): guard owned dirty admission contract"
          git push origin HEAD:refactor/async-geometry-pipeline
