name: ShowcaseWorld physical call inventory
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-world-physical-call-inventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 983ce759bb4ac9ea67c04f05ae949519f7a3da24
          fetch-depth: 1
      - name: Print remaining physical call sites
        shell: bash
        run: |
          set -euo pipefail
          f=Assets/Scenes/Showcase/ShowcaseWorld.cs
          echo '=== VoxelDimensions ==='
          grep -n 'VoxelDimensions\.' "$f" || true
          echo '=== VoxelAccess ==='
          grep -n 'VoxelAccess\.' "$f" || true
          echo '=== direct table/pool ==='
          grep -n -E '_table\.(TryGetRegion|GetResidentCoords|IsResident|Remove)|_pool\.(Get|Try|Release)|MipBuilder|OccupancyMask' "$f" || true
          echo '=== mutation/read store ==='
          grep -n -E '_mutationStore\.|_readSource\.|_snapshotMutationStore\.|_residencyStore\.' "$f" || true
