name: Cutover 13 Showcase Terrain residue

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-terrain-residue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove dead Showcase Terrain.Runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          world_path = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          world = world_path.read_text()
          old_using = 'using VoxelEngine.Terrain.Runtime;\n'
          if world.count(old_using) != 1:
              raise SystemExit(f'expected one Terrain.Runtime using, found {world.count(old_using)}')
          if 'ShowcaseHeightJob' not in world:
              raise SystemExit('ShowcaseWorld no longer schedules ShowcaseHeightJob')
          world_path.write_text(world.replace(old_using, '', 1))

          job_path = Path('Assets/Scenes/Showcase/ShowcaseHeightJob.cs')
          job = job_path.read_text()
          if 'namespace VoxelEngine.Showcase' not in job or 'TerrainSampler.HeightAt' not in job:
              raise SystemExit('ShowcaseHeightJob is not the expected Showcase-owned Terrain.Api job')
          if 'VoxelEngine.Terrain.Runtime' in job:
              raise SystemExit('ShowcaseHeightJob still depends on Terrain.Runtime')

          asmdef_path = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          asmdef = json.loads(asmdef_path.read_text())
          refs = asmdef.get('references', [])
          if refs.count('VoxelEngine.Terrain.Runtime') != 1:
              raise SystemExit(f'expected one Terrain.Runtime asmdef ref, found {refs.count("VoxelEngine.Terrain.Runtime")}')
          asmdef['references'] = [ref for ref in refs if ref != 'VoxelEngine.Terrain.Runtime']
          asmdef_path.write_text(json.dumps(asmdef, indent=2) + '\n')
          PY

          rm .github/workflows/cutover13-showcase-terrain-residue.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef .github/workflows/cutover13-showcase-terrain-residue.yml
          git commit -m 'refactor(showcase): remove Terrain runtime dependency'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
