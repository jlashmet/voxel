name: Incremental clipmap edge recycling one-shot patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-clipmap-edge-recycling-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_clipmap_edge_recycling_patch.py
      - name: Static guards
        run: |
          grep -q 'ClipmapEdgeCandidatesPerPrepare' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'StepClipmapEdgeRetirement();' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'ClipmapMovementRetiresOnlyOutgoingEdgesIncrementally' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          s = p.read_text()
          block = s[s.index('private void StepClipmapEdgeRetirement'):s.index('private bool WithinClipmapWindow')]
          assert 'foreach (int3 chunk in _known)' not in block
          assert 'foreach (var pair in _entries)' not in block
          PY
      - name: Commit clipmap edge recycling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Recycle only outgoing clipmap edges incrementally'
          git push origin HEAD:refactor/async-geometry-pipeline
