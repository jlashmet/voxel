name: Net snapshot acceptance
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  unity-editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c29aa7d16be0229866808617704e66157f55757a
          clean: false
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard c29aa7d16be0229866808617704e66157f55757a
          git clean -ffdx -e Library/
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          V="$(awk '/m_EditorVersion:/ {print $2}' ProjectSettings/ProjectVersion.txt)"
          P="/Applications/Unity/Hub/Editor/${V}/Unity.app/Contents/MacOS/Unity"
          test -x "$P"
          echo "path=$P" >> "$GITHUB_OUTPUT"
      - shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            (( SECONDS < deadline )) || exit 1
            sleep 5
          done
      - shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetSnapshotAcceptance"
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || true
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-snapshot-c29aa7d1
          path: Artifacts/NetSnapshotAcceptance/
          if-no-files-found: warn
          retention-days: 14
