name: Showcase multiplayer Storage Api acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a5b486ca0fb238bf59b7b4b8f65e636d57746e7
          fetch-depth: 1
      - name: Verify multiplayer Storage Api boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs').read_text()
          api = Path('Assets/VoxelEngine/Storage/Api/VoxelReadGrid.cs').read_text()
          grid = Path('Assets/VoxelEngine/Storage/Api/VoxelGrid.cs').read_text()
          forbidden = ['using VoxelEngine.Storage.Runtime;', 'VoxelDimensions.']
          for token in forbidden:
              if token in source:
                  raise SystemExit('ShowcaseMultiplayerSession retains Storage.Runtime detail: ' + token)
          required = [
              'using VoxelEngine.Storage.Api;',
              'VoxelReadGrid.BlocksPerRegion',
              'VoxelReadGrid.BlockEdge',
              'VoxelReadGrid.BlockEdgeLog2',
              'VoxelReadGrid.BlocksPerRegionEdge',
              'VoxelGrid.MaterialEmpty',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit('Missing Storage.Api replacements: ' + ', '.join(missing))
          for token in ['BlockEdgeLog2 = 3', 'BlocksPerRegionEdge', 'BlocksPerRegion']:
              if token not in api:
                  raise SystemExit('VoxelReadGrid logical geometry changed: ' + token)
          if 'MaterialEmpty = 0' not in grid:
              raise SystemExit('VoxelGrid empty-material contract changed')
          print('Showcase multiplayer Storage.Api boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a5b486ca0fb238bf59b7b4b8f65e636d57746e7
          clean: false
          fetch-depth: 1
      - name: Reset pinned multiplayer candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 4a5b486ca0fb238bf59b7b4b8f65e636d57746e7
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ShowcaseMultiplayerStorageApi"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-multiplayer-storage-api-4a5b486c
          path: Artifacts/ShowcaseMultiplayerStorageApi/
          if-no-files-found: warn
          retention-days: 14
