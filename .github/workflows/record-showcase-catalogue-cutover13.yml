name: Record Showcase catalogue Cutover 13 acceptance
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/record-showcase-catalogue-cutover13.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Record accepted Showcase catalogue slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          old_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, and GpuDebris storage seams are Storage.Api-only; empty Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          new_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, and GpuDebris storage seams are API-only; ShowcaseCatalogue consumes Structures.Api only; empty Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          if old_row in s:
              s = s.replace(old_row, new_row, 1)
          elif 'ShowcaseCatalogue consumes Structures.Api only' not in s:
              raise SystemExit('Cutover 13 status row changed unexpectedly')
          old_gate = '- Latest accepted code gate: `ec5aa7c2950528afb90faab0437cc263cd355759` — 386 tests, 373 passed, exactly the same 13 known baseline failures. GpuDebris Storage API run `31897300218` accepts removal of its stale Storage.Runtime dependency; the failed-test-name set exactly matches the prior accepted baseline.'
          new_gate = '- Latest accepted code gate: `ab2d1ca4323cc9fd6bdbee814007b716de76c5cd` — 386 tests, 373 passed, exactly the same 13 known baseline failures. Showcase catalogue API run `31897445992` accepts removal of the stale Structures.Runtime dependency; `ShowcaseCatalogue` now consumes `Structures.Api` only.'
          if old_gate in s:
              s = s.replace(old_gate, new_gate, 1)
          elif 'Latest accepted code gate: `ab2d1ca4323cc9fd6bdbee814007b716de76c5cd`' not in s:
              raise SystemExit('Latest accepted gate line changed unexpectedly')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(architecture): record Showcase catalogue acceptance'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
