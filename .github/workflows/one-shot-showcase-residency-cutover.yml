name: One-shot Showcase Residency Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-showcase-residency-cutover.yml'
      - 'Tools/Refactor/apply_showcase_residency_store_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic residency cutover
        run: python Tools/Refactor/apply_showcase_residency_store_cutover.py

      - name: Verify Showcase diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'private readonly RegionResidencyStore _residencyStore;' Assets/Scenes/Showcase/ShowcaseWorld.cs
          grep -q 'ResidencyManager.EvictWithoutWriteBack(rc, _residencyStore);' Assets/Scenes/Showcase/ShowcaseWorld.cs
          ! grep -q 'EvictWithoutWriteBack(rc, ref _table, ref _pool)' Assets/Scenes/Showcase/ShowcaseWorld.cs

      - name: Commit cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-showcase-residency-cutover.yml
          git rm Tools/Refactor/apply_showcase_residency_store_cutover.py
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over showcase residency store'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
