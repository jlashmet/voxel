name: Water arena pressure correctness fix

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-water-pressure-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded fix
        run: python3 .github/scripts/async_geometry_water_pressure_fix.py
      - name: Static guards
        run: |
          ! sed -n '/TryEvictOneForArenaPressure/,/public void Dispose()/p' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs | grep -q 'RemoveWaterChunk(victim)'
          sed -n '/TryEvictOneForArenaPressure/,/public void Dispose()/p' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs | grep -q 'MarkDirty(victim)'
      - name: Commit renderer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Preserve water chunks under arena pressure'
          git push origin HEAD:refactor/async-geometry-pipeline
