name: Publish TerrainLookdev stale Structures imports

on:
  push:
    paths:
      - .github/workflows/publish-terrain-lookdev-stale-structures-imports.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove stale Structures.Runtime imports
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('Assets/Scenes/Showcase/TerrainLookdev.ForegroundContrast.cs'),
              Path('Assets/Scenes/Showcase/TerrainLookdev.TonalMap.cs'),
              Path('Assets/Scenes/Showcase/TerrainLookdev.VegetatedCap.cs'),
          ]
          for p in targets:
              s=p.read_text()
              token='using VoxelEngine.Structures.Runtime;\n'
              if token not in s:
                  raise SystemExit(f'Expected stale import missing in {p}')
              s=s.replace(token,'',1)
              if 'VoxelBrush' in s or 'ProfileBlockStore' in s:
                  raise SystemExit(f'Concrete Structures type still present in {p}')
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/TerrainLookdev.ForegroundContrast.cs Assets/Scenes/Showcase/TerrainLookdev.TonalMap.cs Assets/Scenes/Showcase/TerrainLookdev.VegetatedCap.cs
          git diff --cached --check
          git commit -m 'refactor(showcase): remove stale lookdev Structures Runtime imports'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
