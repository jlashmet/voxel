name: Sync accepted Net ownership checklist
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          replacements = {
              '- [ ] Net semantic hash/snapshot paths do not depend on physical brick layout.': '- [x] Net semantic hash/snapshot paths do not depend on physical brick layout.',
              '- [ ] network residency calls Streaming.Api;': '- [x] network residency calls Streaming.Api;',
              '- [ ] semantic repair/snapshot paths use Storage.Api logical data;': '- [x] semantic repair/snapshot paths use Storage.Api logical data;',
              '- [ ] protocol/convergence/late-join/reconciliation tests pass.': '- [x] protocol/convergence/late-join/reconciliation tests pass against the accepted `da3b6f0b` ownership baseline.',
              '- [ ] create Net.Api/Runtime': '- [x] create Net.Api/Runtime',
              '- [ ] remove structural/storage/residency ownership violations': '- [x] remove structural/storage/residency ownership violations',
              '- [ ] rename/verify `ReplicationRegionStore`': '- [x] verify no second authoritative Net region store remains; dead physical persistence/compaction scaffolding was deleted',
              '- [ ] reference only domain APIs': '- [x] reference only domain APIs',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected checklist line: {old}')
              s = s.replace(old, new, 1)
          marker = '### Gate\n\n- [ ] Net.Runtime references only domain APIs;'
          progress = ('### Implementation progress\n\n'
                      '- [x] Net.Api/Runtime assemblies exist; transitional Net source is Core-free and references domain APIs only.\n'
                      '- [x] Server residency delegates to Streaming.Api; semantic convergence/repair uses Storage.Api read/mutation/snapshot capabilities; duplicate structural/edit/storage ownership was removed.\n'
                      '- [x] Net ownership checkpoint accepted by CI at `da3b6f0b3daf6b6e0e1f30917fd3d88267c1af34`: 384 total / 371 passed / exact 13 known baseline failures.\n'
                      '- [ ] Client/Interest/Protocol/Server/Transport physical Runtime move, Runtime namespace normalization, and broad Net assembly deletion remain.\n\n'
                      '### Gate\n\n- [ ] Net.Runtime references only domain APIs;')
          if 'Net ownership checkpoint accepted by CI at `da3b6f0b' not in s:
              if marker not in s:
                  raise SystemExit('missing Net gate marker')
              s = s.replace(marker, progress, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/net-checklist-sync.yml
          git diff --check
          git config user.name architecture-refactor-checklist
          git config user.email architecture-refactor-checklist@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: mark accepted Net ownership tasks'
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin --delete tmp-ignore __noop_check 2>/dev/null || true
