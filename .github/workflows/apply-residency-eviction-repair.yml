name: Apply bounded residency eviction repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-residency-eviction-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply measured streaming-memory repair
        run: python3 .github/scripts/apply-residency-eviction-repair.py
      - name: Validate patch
        run: |
          git diff --check
          git diff -- \
            Assets/VoxelEngine/Storage/Api/IRegionResidencyStore.cs \
            Assets/VoxelEngine/Storage/Runtime/RegionTable.cs \
            Assets/VoxelEngine/Storage/Runtime/RegionResidencyStore.cs \
            Assets/VoxelEngine/Streaming/Runtime/ResidencyManager.cs \
            Assets/Tests/PlayMode/TraversalStreamingTests.cs \
            Assets/Tests/PlayMode/ResidencyEvictionRegressionTests.cs
      - name: Commit clean repair and retire transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/VoxelEngine/Storage/Api/IRegionResidencyStore.cs \
            Assets/VoxelEngine/Storage/Runtime/RegionTable.cs \
            Assets/VoxelEngine/Storage/Runtime/RegionResidencyStore.cs \
            Assets/VoxelEngine/Streaming/Runtime/ResidencyManager.cs \
            Assets/Tests/PlayMode/TraversalStreamingTests.cs \
            Assets/Tests/PlayMode/ResidencyEvictionRegressionTests.cs
          git rm .github/scripts/apply-residency-eviction-repair.py .github/workflows/apply-residency-eviction-repair.yml
          git commit -m 'fix(streaming): evict historical resident regions'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
