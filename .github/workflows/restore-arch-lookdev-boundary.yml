name: Restore ArchLookdev architecture boundary

on:
  push:
    branches: [refactor/system-boundaries-finalization-clean]
    paths: [.github/workflows/restore-arch-lookdev-boundary.yml]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-clean
          fetch-depth: 0
      - name: Restore accepted Composition authoring seam
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-clean
          accepted=6bc0b7c2ed38c951838c9a33d749aafac764dcf6
          git fetch origin "$accepted"

          git show "$accepted:Assets/VoxelEngine/Composition/Showcase/ArchLookdev.cs" > Assets/Scenes/Showcase/ArchLookdev.cs
          git show "$accepted:Assets/VoxelEngine/Composition/StructuresComposition.cs" > Assets/VoxelEngine/Composition/StructuresComposition.cs
          git show "$accepted:Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs" > Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs
          git show "$accepted:Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs.meta" > Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs.meta

          rm .github/workflows/restore-arch-lookdev-boundary.yml
          git diff --check
          if grep -n --fixed-strings 'VoxelEngine.Structures.Runtime' Assets/Scenes/Showcase/ArchLookdev.cs; then
            echo 'ArchLookdev still imports Structures.Runtime' >&2
            exit 1
          fi
          grep -q 'StructuresComposition.AuthorArchBay' Assets/Scenes/Showcase/ArchLookdev.cs
          grep -q 'ArchBayAuthoringPipeline.Author' Assets/VoxelEngine/Composition/StructuresComposition.cs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(architecture): restore ArchLookdev composition boundary'
          git push origin HEAD:refactor/system-boundaries-finalization-clean
