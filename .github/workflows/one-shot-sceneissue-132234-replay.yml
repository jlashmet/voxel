name: One-shot SceneIssue 132234 exact replay

on:
  push:
    branches:
      - fixes/agent-8
    paths:
      - .github/workflows/one-shot-sceneissue-132234-replay.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: sceneissue-132234-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes/agent-8
          clean: true
          fetch-depth: 1

      - name: Publish pending status
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/sceneissue-132234-replay',
              description: 'Exact VoxelShowcase replay is running',
              target_url: process.env.RUN_URL,
            });

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity before bake
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Bake fresh Voxel Showcase startup world
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue132234"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"

      - name: Wait for Unity after bake
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay exact saved SceneIssue view
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue132234/RealPlayer"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/showcase-player-capture.sh')
          text = path.read_text()
          old = '-screen-width 1600 -screen-height 900 -screen-fullscreen 0'
          new = '-screen-width 1928 -screen-height 836 -screen-fullscreen 0'
          if text.count(old) != 1:
              raise SystemExit(f'expected one capture-size target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue SceneIssues/open/20260826-132234-356-VoxelShowcase/issue.json \
            --run-seconds 75

      - name: Prepare replay evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue132234/RealPlayer"
          PREVIEW="$GITHUB_WORKSPACE/Artifacts/SceneIssue132234/Preview"
          ISSUE="SceneIssues/open/20260826-132234-356-VoxelShowcase"
          mkdir -p "$PREVIEW"
          cp "$ISSUE/screenshot-001.png" "$PREVIEW/original.png"

          if [[ -d "$ROOT/Screenshots" ]]; then
            final="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
            if [[ -n "$final" ]]; then
              cp "$final" "$PREVIEW/replay-final.png"
              sips -s format jpeg -s formatOptions 70 -Z 900 "$final" \
                --out "$PREVIEW/replay-final-preview.jpg" >/dev/null
              echo 'SCENEISSUE_132234_PREVIEW_BEGIN'
              base64 < "$PREVIEW/replay-final-preview.jpg" | fold -w 120
              echo 'SCENEISSUE_132234_PREVIEW_END'
            fi
          fi

          {
            echo "source_commit=$GITHUB_SHA"
            echo "production_fix=cba68a478ede735e6bdf6aa85b8a1803bccfd133"
            echo "issue=$ISSUE/issue.json"
            echo "scene=Assets/Scenes/VoxelShowcase.unity"
            echo "startup_bake=fresh"
            echo "capture_resolution=1928x836"
            echo "replay_duration_seconds=75"
            echo
            echo "=== camera replay ==="
            grep 'SCENEISSUE camera' "$ROOT/player-run.log" || true
            echo
            echo "=== fps tail ==="
            tail -20 "$ROOT/fps.txt" 2>/dev/null || true
            echo
            echo "=== surface tail ==="
            grep 'SURFACE t=' "$ROOT/player-run.log" | tail -20 || true
            echo
            echo "=== rings tail ==="
            grep 'RINGS ' "$ROOT/player-run.log" | tail -20 || true
          } > "$PREVIEW/replay.txt"
          cat "$PREVIEW/replay.txt"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sceneissue-132234-replay-${{ github.run_id }}
          path: |
            Artifacts/SceneIssue132234/Preview/**
            Artifacts/SceneIssue132234/RealPlayer/Screenshots/**
            Artifacts/SceneIssue132234/RealPlayer/player-run.log
            Artifacts/SceneIssue132234/RealPlayer/fps.txt
            Artifacts/SceneIssue132234/showcase-bake.log
          if-no-files-found: error
          retention-days: 2

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/sceneissue-132234-replay',
              description: success ? 'Exact VoxelShowcase replay passed' : 'Exact VoxelShowcase replay failed',
              target_url: process.env.RUN_URL,
            });