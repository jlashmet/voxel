name: Net final ownership static gate
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/zz-net-ownership-final-static.yml]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f71179af6d46791fdcb9a2fc3407513caf9b274
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          residency=Assets/VoxelEngine/Net/Runtime/Server/RegionResidency.cs
          repair=Assets/VoxelEngine/Net/Runtime/Client/ClientRegionRepairAssembler.cs
          grep -q 'using VoxelEngine.Streaming.Api;' "$residency"
          grep -q 'IRegionStreaming streaming' "$residency"
          grep -q 'streaming.QueueLoad' "$residency"
          grep -q 'streaming.Evict' "$residency"
          ! grep -qE 'RegionTable|BrickPool|VoxelAccess|RegionLoader' "$residency"
          grep -q 'using VoxelEngine.Storage.Api;' "$repair"
          grep -q 'IRegionSnapshotMutationStore snapshots' "$repair"
          grep -q 'TryApplySemanticSnapshot' "$repair"
          ! grep -qE 'RegionTable|BrickPool|VoxelAccess|SemanticRegionSnapshotCodec' "$repair"
          test ! -e Assets/VoxelEngine/Net/Runtime/Server/Storage/RegionStore.cs
          ! grep -RInE 'RegionTable|BrickPool|VoxelAccess|SemanticRegionSnapshotCodec' Assets/VoxelEngine/Net/Runtime --include='*.cs'
          echo 'Net residency and semantic repair ownership gate passed'
