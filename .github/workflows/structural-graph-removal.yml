name: Remove dead Net structural graph
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          if grep -RInE '\bStructuralGraph\b' Assets Packages --include='*.cs' | grep -v 'Assets/VoxelEngine/Net/Server/StructuralGraph.cs'; then
            echo 'StructuralGraph unexpectedly has callers' >&2
            exit 1
          fi
          git rm Assets/VoxelEngine/Net/Server/StructuralGraph.cs Assets/VoxelEngine/Net/Server/StructuralGraph.cs.meta
          git rm .github/workflows/structural-integrity-inventory.yml .github/workflows/structural-graph-removal.yml
          git diff --check
          test -z "$(grep -RInE '\bStructuralGraph\b' Assets Packages --include='*.cs' || true)"
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add -u Assets/VoxelEngine/Net/Server
          git commit -m 'Remove unused Net structural graph placeholder'
          git push origin HEAD:${{ github.ref_name }}
