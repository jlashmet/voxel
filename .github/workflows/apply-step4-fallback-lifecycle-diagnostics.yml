name: Apply step4 fallback lifecycle diagnostics

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-step4-fallback-lifecycle-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0

      - name: Apply lifecycle diagnostics
        run: python3 .github/scripts/apply-step4-fallback-lifecycle-diagnostics.py

      - name: Verify patch
        run: |
          git diff --check
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                     Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                     Assets/Tests/PlayMode/LodRenderingTests.cs

      - name: Commit diagnostics and remove transport
        run: |
          set -euo pipefail
          rm .github/scripts/apply-step4-fallback-lifecycle-diagnostics.py
          rm .github/workflows/apply-step4-fallback-lifecycle-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(rendering): trace step4 fallback lifecycle"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
