name: Fix Showcase profile-block API leak

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/fix-showcase-profileblocks-api-leak.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Expose retained profile blocks through Storage.Api only
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-stable
          python3 - <<'PY'
          from pathlib import Path

          world = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs')
          text = world.read_text()
          old = '        public ProfileBlockStore ProfileBlocks => _profileBlocks;'
          new = '        public IProfileBlockReadSource ProfileBlocks => _profileBlocks;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one concrete ProfileBlocks surface, found {text.count(old)}')
          text = text.replace(old, new, 1)
          world.write_text(text)

          guard = Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs')
          g = guard.read_text()
          anchor = '''        [Test]\n        public void RenderingReadPathUsesStorageApiForPhysicalReads()\n'''
          test = '''        [Test]\n        public void CompositionShowcaseWorldExposesProfileBlocksThroughStorageApi()\n        {\n            string path = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Composition", "Showcase", "ShowcaseWorld.cs");\n            Assert.IsTrue(File.Exists(path), "Missing Composition-owned ShowcaseWorld: " + path);\n\n            string source = File.ReadAllText(path);\n            StringAssert.Contains("public IProfileBlockReadSource ProfileBlocks => _profileBlocks;", source,\n                "ShowcaseWorld must expose retained profile blocks through the Storage.Api read contract.");\n            StringAssert.DoesNotContain("public ProfileBlockStore ProfileBlocks", source,\n                "A public Composition surface may not force scene assemblies to reference Structures.Runtime.");\n        }\n\n'''
          if test.strip() not in g:
              if g.count(anchor) != 1:
                  raise SystemExit(f'expected one guard insertion anchor, found {g.count(anchor)}')
              g = g.replace(anchor, test + anchor, 1)
              guard.write_text(g)
          PY

          git diff --check
          git rm .github/workflows/fix-showcase-profileblocks-api-leak.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs
          git commit -m 'fix(composition): hide profile store behind read API'
          git push origin HEAD:refactor/system-boundaries-finalization-stable
