name: SceneIssue 221508 current-head exact replay

on:
  push:
    branches: [fixes/agent-1]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-replay-attempt3.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: sceneissue-221508-current-head-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes/agent-1
          clean: true
          fetch-depth: 0

      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/sceneissue-221508-current-head',
              description: 'Exact saved-camera replay is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Create exact SceneIssue camera fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/Resources
          python3 - <<'PY'
          import json
          from pathlib import Path
          issue = json.loads(Path('SceneIssues/open/20260824-221508-896-VoxelShowcase/issue.json').read_text())
          camera = issue['captures'][0]['camera']
          fixture = {
              'hierarchyPath': camera['hierarchyPath'],
              'position': camera['position'],
              'rotation': camera['rotation'],
              'fieldOfView': camera['fieldOfView'],
          }
          Path('Assets/Resources/SceneIssueCameraPose.json').write_text(json.dumps(fixture, indent=2) + '\n')
          print(json.dumps(fixture, indent=2))
          PY

      - name: Bake Voxel Showcase startup world
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508CurrentHead"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"

      - name: Wait for Unity between invocations
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay exact captured view with GPU enabled
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508CurrentHead/RealPlayer"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/showcase-player-capture.sh')
          text = path.read_text()
          old = '-screen-width 1600 -screen-height 900 -screen-fullscreen 0'
          new = '-screen-width 1364 -screen-height 836 -screen-fullscreen 0'
          if text.count(old) != 1:
              raise SystemExit(f'expected one capture-size target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --run-seconds 40

      - name: Persist current-head evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508CurrentHead/RealPlayer"
          ISSUE="SceneIssues/open/20260824-221508-896-VoxelShowcase"
          final="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$final"
          cp "$final" "$ISSUE/verification-current-head.png"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "source_branch=fixes/agent-1"
            echo "camera_fixture=SceneIssues/open/20260824-221508-896-VoxelShowcase/issue.json captures[0].camera"
            echo "capture_resolution=1364x836"
            echo "selected_screenshot=$(basename "$final")"
            echo "purpose=current-head baseline before production attempt 2"
            echo
            echo "=== camera replay ==="
            grep 'SCENEISSUE camera' "$ROOT/player-run.log" || true
            echo
            echo "=== fps tail ==="
            tail -20 "$ROOT/fps.txt" 2>/dev/null || true
            echo
            echo "=== surface tail ==="
            grep 'SURFACE t=' "$ROOT/player-run.log" | tail -20 || true
            echo
            echo "=== rings tail ==="
            grep 'RINGS ' "$ROOT/player-run.log" | tail -20 || true
          } > "$ISSUE/verification-current-head.txt"
          cat "$ISSUE/verification-current-head.txt"

          PREVIEW="$RUNNER_TEMP/scene221508-preview.jpg"
          sips -s format jpeg -s formatOptions 60 -Z 700 "$final" --out "$PREVIEW" >/dev/null
          echo 'SCENE221508_PREVIEW_BEGIN'
          base64 < "$PREVIEW" | fold -w 120
          echo 'SCENE221508_PREVIEW_END'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ISSUE/verification-current-head.png" "$ISSUE/verification-current-head.txt"
          git commit -m 'SceneIssue 221508: record current-head exact replay'
          EVIDENCE_SHA="$(git rev-parse HEAD)"
          git restore --worktree -- .
          git clean -fd -- Assets/Resources/SceneIssueCameraPose.json || true
          git pull --rebase origin fixes/agent-1
          git push origin HEAD:fixes/agent-1
          echo "sha=$EVIDENCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        env:
          EVIDENCE_SHA: ${{ steps.evidence.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'ci/sceneissue-221508-current-head',
              description: `Current-head evidence ${process.env.EVIDENCE_SHA.substring(0, 12)} captured`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failure status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'ci/sceneissue-221508-current-head',
              description: 'Current-head exact replay failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
