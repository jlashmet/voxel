name: Restructuring structures inventory

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/restructuring-structures-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Materialize Structures dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          report=docs/STRUCTURES_RUNTIME_INVENTORY.tmp
          {
            echo '=== Remaining Core/Features files ==='
            find Assets/VoxelEngine/Core/Features -type f \( -name '*.cs' -o -name '*.asmdef' \) -print | sort
            echo '=== References to implementation types ==='
            rg -n --glob '*.cs' '\b(FeatureGeneration|ShapeProgram|PrimitiveRasteriser|ProfileBlockStore|ArchFeature|BondedBlockVeneer)\b' Assets Packages || true
            echo '=== Remaining Core.Features imports ==='
            rg -n --glob '*.cs' 'using VoxelEngine\.Core\.Features' Assets Packages || true
            echo '=== Remaining Structures broad imports ==='
            rg -n --glob '*.cs' 'using VoxelEngine\.Structures;' Assets Packages || true
            echo '=== Target implementation imports ==='
            for f in $(find Assets/VoxelEngine/Core/Features -name '*.cs' -print | sort); do
              echo "--- $f"
              grep '^using ' "$f" || true
            done
          } > "$report"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "chore: materialize structures runtime inventory"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
