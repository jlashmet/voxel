name: Pinned zero-copy geometry snapshots one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-pinned-snapshot-lease-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_pinned_snapshot_lease_patch.py
      - name: Static guards
        run: |
          grep -q 'TryPinWorldBlock' Assets/VoxelEngine/Storage/Api/IRegionReadSource.cs
          grep -q 'source.TryPinWorldBlock' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          ! grep -q 'ResizeUninitialized(nextLength)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'PinnedReleasesPerDeadlineCheck' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'NativeDisableContainerSafetyRestriction' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/TransvoxelDensityJob.cs
          grep -q 'ExactGeometrySnapshotsBorrowPinnedCowPayloads' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit zero-copy snapshot boundary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Storage/Api/IRegionReadSource.cs \
                  Assets/VoxelEngine/Storage/Api/PinnedVoxelReadBlock.cs \
                  Assets/VoxelEngine/Storage/Api/PinnedVoxelReadBlock.cs.meta \
                  Assets/VoxelEngine/Storage/Runtime/RegionReadSource.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/TransvoxelDensityJob.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/SnapshotFacetedMaskJob.cs \
                  Assets/Tests/EditMode/StorageRenderingReadContractTests.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Read exact mixed geometry from pinned COW Storage payloads'
          git push origin HEAD:refactor/async-geometry-pipeline
