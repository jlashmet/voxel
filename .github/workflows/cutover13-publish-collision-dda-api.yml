name: Cutover 13 publish collision DDA API

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-publish-collision-dda-api.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Move deterministic DDA primitive to Collision.Api
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          runtime = Path('Assets/VoxelEngine/Collision/Runtime')
          api = Path('Assets/VoxelEngine/Collision/Api')
          if not (runtime / 'DdaTraversal.cs').exists():
              raise SystemExit('Runtime DdaTraversal source not found')
          PY

          git mv Assets/VoxelEngine/Collision/Runtime/DdaTraversal.cs Assets/VoxelEngine/Collision/Api/DdaTraversal.cs
          git mv Assets/VoxelEngine/Collision/Runtime/DdaTraversal.cs.meta Assets/VoxelEngine/Collision/Api/DdaTraversal.cs.meta

          python3 - <<'PY'
          from pathlib import Path
          import json

          dda = Path('Assets/VoxelEngine/Collision/Api/DdaTraversal.cs')
          text = dda.read_text()
          old = 'namespace VoxelEngine.Collision.Runtime'
          if old not in text:
              raise SystemExit('DDA Runtime namespace not found')
          dda.write_text(text.replace(old, 'namespace VoxelEngine.Collision.Api', 1))

          ray = Path('Assets/VoxelEngine/Collision/Runtime/VoxelRaycast.cs')
          text = ray.read_text()
          if 'using VoxelEngine.Collision.Api;' not in text:
              insert = text.find('namespace ')
              if insert < 0: raise SystemExit('VoxelRaycast namespace not found')
              text = text[:insert] + 'using VoxelEngine.Collision.Api;\n\n' + text[insert:]
          ray.write_text(text)

          visual = Path('Assets/Tests/PlayMode/VisualCollisionParityTests.cs')
          text = visual.read_text()
          if 'using VoxelEngine.Collision.Runtime;' not in text:
              raise SystemExit('VisualCollisionParity Runtime import not found')
          visual.write_text(text.replace('using VoxelEngine.Collision.Runtime;',
                                         'using VoxelEngine.Collision.Api;', 1))

          showcase = Path('Assets/Scenes/Showcase/VoxelShowcase.cs')
          text = showcase.read_text()
          if 'using VoxelEngine.Collision.Runtime;' not in text:
              raise SystemExit('VoxelShowcase Collision.Runtime import not found')
          showcase.write_text(text.replace('using VoxelEngine.Collision.Runtime;',
                                           'using VoxelEngine.Collision.Api;', 1))

          def update_refs(path, add=(), remove=()):
              p = Path(path)
              data = json.loads(p.read_text())
              refs = data.get('references', [])
              refs = [r for r in refs if r not in set(remove)]
              for r in add:
                  if r not in refs: refs.append(r)
              data['references'] = refs
              p.write_text(json.dumps(data, indent=2) + '\n')

          update_refs('Assets/VoxelEngine/Collision/Api/VoxelEngine.Collision.Api.asmdef',
                      add=('Unity.Mathematics',))
          update_refs('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef',
                      add=('VoxelEngine.Collision.Api',),
                      remove=('VoxelEngine.Collision.Runtime',))
          update_refs('Assets/Tests/PlayMode/VoxelEngine.Tests.PlayMode.asmdef',
                      add=('VoxelEngine.Collision.Api',))
          PY

          test -f Assets/VoxelEngine/Collision/Api/DdaTraversal.cs
          test ! -e Assets/VoxelEngine/Collision/Runtime/DdaTraversal.cs
          grep -q 'namespace VoxelEngine.Collision.Api' Assets/VoxelEngine/Collision/Api/DdaTraversal.cs
          ! grep -RIn --include='*.cs' '^using VoxelEngine.Collision.Runtime;' Assets/Scenes/Showcase
          ! grep -q 'VoxelEngine.Collision.Runtime' Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef
          grep -q 'VoxelEngine.Collision.Api' Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef
          git diff --check

      - name: Commit collision cut
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Collision Assets/Scenes/Showcase Assets/Tests/PlayMode
          git commit -m 'refactor(collision): expose deterministic DDA through Api'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
