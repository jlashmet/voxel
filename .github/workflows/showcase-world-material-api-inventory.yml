name: ShowcaseWorld material API inventory
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-world-material-api-inventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 983ce759bb4ac9ea67c04f05ae949519f7a3da24
          fetch-depth: 1
      - name: Inspect material capability contracts and ShowcaseWorld use
        shell: bash
        run: |
          set -euo pipefail
          echo '=== API material interfaces ==='
          grep -R -n -A100 -B10 --include='*.cs' -E 'interface I.*Material|struct Material.*View|GetDestructionClass|GetHardness|IsDestructible' Assets/VoxelEngine/Storage/Api || true
          echo '=== ShowcaseWorld material calls ==='
          grep -n -E '_palette\.(IsDestructible|GetHardness|GetDestructionClass|Register|PresentationView)|_materialAdjacencyCatalogue|_surfaceCatalogue|_coatingCatalogue' Assets/Scenes/Showcase/ShowcaseWorld.cs || true
          echo '=== API mutation/read interfaces ==='
          grep -R -n -A120 -B5 --include='*.cs' -E 'interface IRegion(Mutation|Read)|interface IVoxelSurfaceQuery|struct VoxelBlockMutation' Assets/VoxelEngine/Storage/Api || true
