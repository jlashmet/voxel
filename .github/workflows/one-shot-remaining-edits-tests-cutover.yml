name: One-shot Remaining Edits Tests Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-remaining-edits-tests-cutover.yml'
      - 'Tools/Refactor/apply_remaining_edits_tests_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Apply final edits test cutover
        run: python Tools/Refactor/apply_remaining_edits_tests_cutover.py
      - name: Verify diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'var storage = new RegionMutationStore' Assets/Tests/EditMode/CanonicalBrushTests.cs
          grep -q 'var storage = new RegionMutationStore' Assets/Tests/EditMode/DeterministicAlterationApplierTests.cs
          grep -q 'var mutationStorage = new RegionMutationStore' Assets/Tests/EditMode/CanonicalBrushValidationTests.cs
      - name: Commit and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-remaining-edits-tests-cutover.yml
          git rm Tools/Refactor/apply_remaining_edits_tests_cutover.py
          git add Assets/Tests/EditMode/CanonicalBrushTests.cs
          git add Assets/Tests/EditMode/DeterministicAlterationApplierTests.cs
          git add Assets/Tests/EditMode/CanonicalBrushValidationTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over remaining edits tests'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
