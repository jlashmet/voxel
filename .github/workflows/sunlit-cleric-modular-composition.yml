name: Sunlit Cleric modular composition

on:
  push:
    branches: [feature/character-weapon-asset-pipeline]
    paths:
      - '.github/workflows/sunlit-cleric-modular-composition.yml'
      - 'tools/character-factory/runtime/blender_export_animated_canonical.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sunlit-cleric-modular-composition
  cancel-in-progress: true

jobs:
  verify-real-robe-composition:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    env:
      OUT: Artifacts/SunlitClericModularComposition
      ROBE_SOURCE: Artifacts/SunlitClericRobeSource
      REVIEW_DIR: docs/lookdev/characters/sunlit-cleric/modular

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/Applications/Blender.app/Contents/MacOS/Blender"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Download latest generated robe artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$ROBE_SOURCE"
          mkdir -p "$OUT" "$ROBE_SOURCE"
          python3 - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url: str):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          params = urlencode({
              'branch': 'feature/character-weapon-asset-pipeline',
              'status': 'success',
              'per_page': 10,
          })
          runs = get_json(
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              f'sunlit-cleric-robe-multiview-build.yml/runs?{params}'
          ).get('workflow_runs', [])
          if not runs:
              raise RuntimeError('no successful generated robe run found')
          run = runs[0]
          artifacts = get_json(
              f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100'
          ).get('artifacts', [])
          artifact = next(
              (item for item in artifacts if item.get('name') == 'sunlit-cleric-modular-robe'),
              None,
          )
          if artifact is None:
              raise RuntimeError(f'robe artifact missing from run {run["id"]}')

          request = Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip',
              headers=headers,
          )
          with urlopen(request, timeout=120) as response:
              archive = response.read()
          root = Path(os.environ['ROBE_SOURCE'])
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              zipped.extractall(root)

          matches = list(root.rglob('sunlit_cleric_robe_01.fbx'))
          if len(matches) != 1:
              raise RuntimeError(f'expected one modular robe FBX, found {matches}')
          Path(os.environ['OUT'], 'composition-source.json').write_text(
              json.dumps({
                  'robe_workflow_run_id': int(run['id']),
                  'robe_artifact_id': int(artifact['id']),
                  'robe_workflow_head_sha': run['head_sha'],
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Build independent animated base body
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL="$GITHUB_WORKSPACE/$OUT/canonical_female.glb"
          INPUT_RENDER="$GITHUB_WORKSPACE/$OUT/canonical_female.input.png"
          BASE_FBX="$GITHUB_WORKSPACE/$OUT/sunlit_cleric_base_01.fbx"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/create_canonical_character_fixture.py -- \
            --canonical "$CANONICAL" \
            --input "$INPUT_RENDER"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/runtime/blender_export_animated_canonical.py -- \
            --input "$CANONICAL" \
            --output "$BASE_FBX"

          test -s "$BASE_FBX"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$BASE_FBX"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_character_animations.py -- \
            --input "$BASE_FBX"

      - name: Rebind generated robe to one shared skeleton and pose both meshes
        shell: bash
        run: |
          set -euo pipefail
          BASE_FBX="$GITHUB_WORKSPACE/$OUT/sunlit_cleric_base_01.fbx"
          ROBE_FBX="$(find "$GITHUB_WORKSPACE/$ROBE_SOURCE" -name 'sunlit_cleric_robe_01.fbx' -type f -print -quit)"
          COMPOSITE="$GITHUB_WORKSPACE/$OUT/sunlit_cleric_modular_composite.png"
          test -s "$ROBE_FBX"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_modular_character_clothing.py -- \
            --character "$BASE_FBX" \
            --clothing "$ROBE_FBX" \
            --output "$COMPOSITE"
          test -s "$COMPOSITE"

      - name: Upload modular composition proof
        uses: actions/upload-artifact@v4
        with:
          name: sunlit-cleric-modular-composition
          path: Artifacts/SunlitClericModularComposition/
          if-no-files-found: error
          retention-days: 14

      - name: Publish modular composition review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          cp "$OUT/sunlit_cleric_modular_composite.png" "$REVIEW_DIR/"
          cp "$OUT/composition-source.json" "$REVIEW_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR"
          if git diff --cached --quiet; then
            echo 'Latest modular composition review is already published.'
            exit 0
          fi
          git commit -m 'docs(characters): publish cleric modular composition proof [modular-review]'
          git push origin HEAD:feature/character-weapon-asset-pipeline
