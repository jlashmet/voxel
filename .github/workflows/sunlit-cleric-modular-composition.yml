name: Sunlit Cleric modular composition

on:
  push:
    branches: [feature/character-weapon-asset-pipeline]
    paths:
      - 'docs/lookdev/characters/madeline/base-body/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sunlit-cleric-modular-composition
  cancel-in-progress: true

jobs:
  verify-real-madeline-robe-composition:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    env:
      OUT: Artifacts/SunlitClericModularComposition
      BASE_SOURCE: Artifacts/MadelineBaseSource
      ROBE_SOURCE: Artifacts/SunlitClericRobeSource
      REVIEW_DIR: docs/lookdev/characters/sunlit-cleric/modular

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Resolve Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/Applications/Blender.app/Contents/MacOS/Blender"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Download latest verified Madeline base and generated robe artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$BASE_SOURCE" "$ROBE_SOURCE"
          mkdir -p "$OUT" "$BASE_SOURCE" "$ROBE_SOURCE"
          python3 - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url: str):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          def latest_successful_artifact(workflow: str, artifact_name: str, destination: Path):
              params = urlencode({
                  'branch': 'feature/character-weapon-asset-pipeline',
                  'status': 'success',
                  'per_page': 20,
              })
              runs = get_json(
                  f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{params}'
              ).get('workflow_runs', [])
              if not runs:
                  raise RuntimeError(f'no successful workflow run found for {workflow}')

              for run in runs:
                  artifacts = get_json(
                      f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100'
                  ).get('artifacts', [])
                  artifact = next(
                      (item for item in artifacts if item.get('name') == artifact_name and not item.get('expired')),
                      None,
                  )
                  if artifact is None:
                      continue

                  request = Request(
                      f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip',
                      headers=headers,
                  )
                  with urlopen(request, timeout=180) as response:
                      archive = response.read()
                  destination.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                      zipped.extractall(destination)
                  return {
                      'workflow': workflow,
                      'workflow_run_id': int(run['id']),
                      'workflow_head_sha': run['head_sha'],
                      'artifact_name': artifact_name,
                      'artifact_id': int(artifact['id']),
                  }

              raise RuntimeError(
                  f'no unexpired {artifact_name!r} artifact found in successful runs of {workflow}'
              )

          base = latest_successful_artifact(
              'madeline-base-body-build.yml',
              'madeline-base-body',
              Path(os.environ['BASE_SOURCE']),
          )
          robe = latest_successful_artifact(
              'sunlit-cleric-robe-multiview-build.yml',
              'sunlit-cleric-modular-robe',
              Path(os.environ['ROBE_SOURCE']),
          )

          base_matches = list(Path(os.environ['BASE_SOURCE']).rglob('madeline_body_01.fbx'))
          if len(base_matches) != 1:
              raise RuntimeError(f'expected one Madeline base FBX, found {base_matches}')
          robe_matches = list(Path(os.environ['ROBE_SOURCE']).rglob('sunlit_cleric_robe_01.fbx'))
          if len(robe_matches) != 1:
              raise RuntimeError(f'expected one modular robe FBX, found {robe_matches}')

          Path(os.environ['OUT'], 'composition-source.json').write_text(
              json.dumps({'madeline': base, 'robe': robe}, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify independent Madeline base before dressing
        shell: bash
        run: |
          set -euo pipefail
          BASE_FBX="$(find "$GITHUB_WORKSPACE/$BASE_SOURCE" -name 'madeline_body_01.fbx' -type f -print -quit)"
          test -s "$BASE_FBX"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$BASE_FBX"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_character_animations.py -- \
            --input "$BASE_FBX"

      - name: Rebind generated robe to Madeline's shared skeleton and pose both meshes
        shell: bash
        run: |
          set -euo pipefail
          BASE_FBX="$(find "$GITHUB_WORKSPACE/$BASE_SOURCE" -name 'madeline_body_01.fbx' -type f -print -quit)"
          ROBE_FBX="$(find "$GITHUB_WORKSPACE/$ROBE_SOURCE" -name 'sunlit_cleric_robe_01.fbx' -type f -print -quit)"
          COMPOSITE="$GITHUB_WORKSPACE/$OUT/sunlit_cleric_modular_composite.png"
          test -s "$BASE_FBX"
          test -s "$ROBE_FBX"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_modular_character_clothing.py -- \
            --character "$BASE_FBX" \
            --clothing "$ROBE_FBX" \
            --output "$COMPOSITE"
          test -s "$COMPOSITE"

      - name: Upload modular composition proof
        uses: actions/upload-artifact@v4
        with:
          name: sunlit-cleric-modular-composition
          path: Artifacts/SunlitClericModularComposition/
          if-no-files-found: error
          retention-days: 14

      - name: Publish modular composition review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          cp "$OUT/sunlit_cleric_modular_composite.png" "$REVIEW_DIR/"
          cp "$OUT/composition-source.json" "$REVIEW_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR"
          if git diff --cached --quiet; then
            echo 'Latest modular composition review is already published.'
            exit 0
          fi
          git commit -m 'docs(characters): publish Madeline Cleric modular proof [modular-review]'
          git push origin HEAD:feature/character-weapon-asset-pipeline
