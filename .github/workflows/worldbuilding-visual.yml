name: Worldbuilding Visuals

on:
  workflow_dispatch:
  push:
    branches:
      - agent/worldbuilding-structures-caves
    paths:
      - 'Assets/Game/Structures/**'
      - 'Assets/VoxelEngine/Structures/**'
      - 'Packages/com.mountingforce.worldgen/**'
      - '.github/workflows/worldbuilding-visual.yml'

permissions:
  contents: read

concurrency:
  group: worldbuilding-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Render generated worldbuilding geometry
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Render visual regression images
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/WorldbuildingVisuals"
          mkdir -p "$ROOT" "$GITHUB_WORKSPACE/TestResults/WorldbuildingVisuals"

          # These are developer/reviewer images, not gameplay rendering state. They run the real
          # structure authorers into a deterministic capture volume and preserve the PNGs as CI
          # artifacts so geometry can be inspected without opening the scene interactively.
          status=0
          UNITY_MAX_RSS_MB=12288 UNITY_MAX_MINUTES=15 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform EditMode \
            -assemblyNames Game.Structures.Tests \
            -testFilter Game.Structures.Tests.WorldbuildingVisualRegressionTests \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log" || status=$?

          if [[ -s "${TMPDIR:-/tmp}/unity-run-status" ]]; then
            cp "${TMPDIR:-/tmp}/unity-run-status" "$ROOT/unity-run-status.txt"
          fi
          if [[ ! -s "$ROOT/unity.log" && -s "$HOME/Library/Logs/Unity/Editor.log" ]]; then
            cp "$HOME/Library/Logs/Unity/Editor.log" "$ROOT/unity-global.log"
          fi

          find "$GITHUB_WORKSPACE/TestResults/WorldbuildingVisuals" -name '*.png' -size +1k -print | sort | tee "$ROOT/images.txt"
          image_count="$(wc -l < "$ROOT/images.txt" | tr -d ' ')"
          if (( image_count < 5 )); then
            echo "Expected at least 5 rendered worldbuilding images, found $image_count" >&2
            status=1
          fi

          exit "$status"

      - name: Upload rendered geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbuilding-visuals-${{ github.sha }}
          path: |
            TestResults/WorldbuildingVisuals/*.png
            Artifacts/WorldbuildingVisuals/**
          if-no-files-found: warn
          retention-days: 14
