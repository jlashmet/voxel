name: Remove stray WorldGen Core import

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Remove stray import and push
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 -c "from pathlib import Path; p=Path('Packages/com.mountingforce.worldgen/Runtime/Core/VegetationLayout.cs'); s=p.read_text(); old='using VoxelEngine.Structures.Api;\\n'; assert s.count(old)==1; p.write_text(s.replace(old,'',1))"
          git rm .github/workflows/remove-worldgen-core-import.yml
          git diff --check
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Packages/com.mountingforce.worldgen/Runtime/Core/VegetationLayout.cs
          git commit -m 'Keep WorldGen Core engine-independent'
          git push origin HEAD:${{ github.ref_name }}
