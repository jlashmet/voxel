name: Generate placeholder Unity metadata

on:
  push:
    branches:
      - feature/temp-placeholder-humanoids

permissions:
  contents: write

jobs:
  generate-meta:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout without deleting Unity import cache
        uses: actions/checkout@v4
        with:
          ref: feature/temp-placeholder-humanoids
          clean: false

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Import project and generate metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts/PlaceholderHumanoids
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -quit \
            -logFile "$GITHUB_WORKSPACE/Artifacts/PlaceholderHumanoids/import.log"

      - name: Verify expected metadata exists
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/ThirdParty/PlaceholderHumanoids/Models/Male_Adult_01.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Models/Female_Adult_01.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Animations/Idle.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Animations/Walk.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Animations/Run.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Animations/CrouchIdle.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Animations/Wave.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Animations/Shrug.fbx.meta
          test -f Assets/ThirdParty/PlaceholderHumanoids/Editor/PlaceholderHumanoidImporter.cs.meta
          test -f Assets/Tests/EditMode/PlaceholderHumanoidAssetTests.cs.meta

      - name: Commit generated metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/generate-placeholder-unity-meta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets/ThirdParty/PlaceholderHumanoids Assets/Tests/EditMode/PlaceholderHumanoidAssetTests.cs.meta .github/workflows/generate-placeholder-unity-meta.yml
          git diff --cached --quiet && exit 0
          git commit -m "assets: commit Unity metadata for placeholder humanoids"
          git push origin HEAD:feature/temp-placeholder-humanoids

      - name: Show Unity import log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/PlaceholderHumanoids/import.log"
          if [[ -f "$LOG" ]]; then
            tail -n 200 "$LOG"
          fi
