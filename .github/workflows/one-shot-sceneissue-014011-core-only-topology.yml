name: One-shot SceneIssue 221508 unobscured exact view

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: scene-221508-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unobscured-replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Publish pending scene status
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/scene-221508',
              description: 'Fresh-bake exact-view verification is running',
              target_url: process.env.RUN_URL,
            });

      - name: Prepare exact replay request without annotations
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=SceneIssues/20260824-221508-896-VoxelShowcase/issue.json
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508NoCircles"
          mkdir -p "$ROOT"
          test -s "$SOURCE"
          python3 - "$SOURCE" "$ROOT/issue-no-circles.json" <<'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          data = json.load(open(src))
          data['circles'] = []
          for capture in data.get('captures', []):
              capture['circles'] = []
          with open(dst, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          python3 - "$SOURCE" "$ROOT/issue-no-circles.json" <<'PY'
          import json, sys
          a, b = map(lambda p: json.load(open(p)), sys.argv[1:])
          assert a['camera'] == b['camera']
          assert a['poseAnchor'] == b['poseAnchor']
          assert len(a['circles']) == 4 and b['circles'] == []
          assert len(a['captures'][0]['circles']) == 4 and b['captures'][0]['circles'] == []
          print('SCENE_221508_UNOBSCURED_REQUEST camera and pose preserved; annotations removed')
          PY
          grep -q 'ReplayRequestCommandLineArgument = "-voxel-scene-issue"' Assets/DeveloperTools/SceneIssueCapture/SceneIssueCapture.cs
          grep -q 'Verified standalone frozen pose' Assets/DeveloperTools/SceneIssueCapture/SceneIssueReplayVerification.cs
          git diff --check

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity before bake
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Bake fresh Voxel Showcase startup world
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508NoCircles"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=8 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"

      - name: Wait for Unity after bake
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay saved VoxelShowcase camera without circle overlay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508NoCircles"
          set +e
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue "$ROOT/issue-no-circles.json" \
            --run-seconds 60
          capture_status=$?
          set -e
          if (( capture_status != 0 )); then
            [[ ! -s "$ROOT/player-build.log" ]] || tail -200 "$ROOT/player-build.log" >&2
            [[ ! -s "$ROOT/player-run.log" ]] || tail -160 "$ROOT/player-run.log" >&2
            exit "$capture_status"
          fi
          grep -q 'Verified standalone frozen pose' "$ROOT/player-run.log" || {
            tail -160 "$ROOT/player-run.log" >&2 || true
            exit 1
          }
          latest="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$latest"
          cp "$latest" "$ROOT/replay-latest.png"
          sips -s format jpeg --setProperty formatOptions 85 -Z 1364 "$latest" --out "$ROOT/replay-latest.jpg" >/dev/null
          echo "SCENE_221508_UNOBSCURED_FRAME $(basename "$latest")"

      - name: Upload unobscured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-221508-unobscured-view
          path: |
            SceneIssues/20260824-221508-896-VoxelShowcase/screenshot-001.png
            Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes
            Artifacts/SceneIssue221508NoCircles/issue-no-circles.json
            Artifacts/SceneIssue221508NoCircles/replay-latest.png
            Artifacts/SceneIssue221508NoCircles/replay-latest.jpg
            Artifacts/SceneIssue221508NoCircles/showcase-bake.log
            Artifacts/SceneIssue221508NoCircles/player-build.log
            Artifacts/SceneIssue221508NoCircles/player-run.log
          if-no-files-found: warn
          retention-days: 3

      - name: Publish final scene status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/scene-221508',
              description: success
                ? 'Fresh-bake exact-view verification passed'
                : 'Fresh-bake exact-view verification failed',
              target_url: process.env.RUN_URL,
            });
