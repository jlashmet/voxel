name: One-shot SceneIssue 220416 standalone saved-view replay

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Verify replay plumbing is present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ReplayRequestCommandLineArgument = "-voxel-scene-issue"' Assets/DeveloperTools/SceneIssueCapture/SceneIssueCapture.cs
          grep -q 'Verified standalone frozen pose' Assets/DeveloperTools/SceneIssueCapture/SceneIssueReplayVerification.cs
          grep -q -- '--scene-issue)' tools/showcase-player-capture.sh
          grep -q -- 'BUILD_ARGS+=(-voxelDevelopment)' tools/showcase-player-capture.sh
          git diff --check

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay saved VoxelShowcase view in a development player
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220416"
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue SceneIssues/20260824-220416-979-VoxelShowcase/issue.json \
            --run-seconds 60

          grep -q 'Verified standalone frozen pose' "$ROOT/player-run.log" || {
            echo "ERROR: standalone scene-issue replay never verified the recorded frozen camera pose." >&2
            tail -160 "$ROOT/player-run.log" >&2 || true
            exit 1
          }

          latest="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$latest"
          sips -s format jpeg --setProperty formatOptions 70 -Z 1200 "$latest" --out "$ROOT/replay-latest.jpg" >/dev/null
          echo "SCENE_220416_REPLAY_FRAME $(basename "$latest")"

      - name: Upload replay frames
        uses: actions/upload-artifact@v4
        with:
          name: scene-220416-replay
          path: |
            Artifacts/SceneIssue220416/Screenshots/*.png
            Artifacts/SceneIssue220416/replay-latest.jpg
            Artifacts/SceneIssue220416/player-run.log
          if-no-files-found: error
          retention-days: 3
