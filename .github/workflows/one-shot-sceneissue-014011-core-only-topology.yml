name: One-shot SceneIssue 014011 core-only CPU topology diagnostic

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 0

      - name: Disable CPU negative shell only in diagnostic workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/TransvoxelTopologyJob.cs')
          s = p.read_text()
          old = '''            PolygoniseCell(new int3(x, y, z));
            if (x == 0) PolygoniseCell(new int3(-1, y, z));
            if (y == 0) PolygoniseCell(new int3(x, -1, z));
            if (z == 0) PolygoniseCell(new int3(x, y, -1));
            if (x == 0 && y == 0) PolygoniseCell(new int3(-1, -1, z));
            if (x == 0 && z == 0) PolygoniseCell(new int3(-1, y, -1));
            if (y == 0 && z == 0) PolygoniseCell(new int3(x, -1, -1));
            if (x == 0 && y == 0 && z == 0) PolygoniseCell(new int3(-1, -1, -1));
'''
          new = '''            PolygoniseCell(new int3(x, y, z));
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one shell block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run mixed topology oracle against core-only CPU
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.EditMode.GpuSurfaceExtractorOracleTests.MixedBricksWithAuthoredBoundariesAndCoatingsMatchTheCpu
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue014011CoreOnlyTopology"
          OUT="$GITHUB_WORKSPACE/SceneIssues/20260823-014011-920-VoxelShowcase/notes-core-only-topology.txt"
          mkdir -p "$ROOT" "$(dirname "$OUT")"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || status=$?
          {
            echo "status=$status"
            echo "diagnostic=CPU negative shell disabled; core cells only"
            if [[ -s "$ROOT/results.xml" ]]; then
              python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          for c in root.findall('.//test-case'):
              print(f"{c.get('result')}: {c.get('fullname') or c.get('name')}")
              f=c.find('failure')
              if f is not None:
                  print((f.findtext('message') or '').strip())
          PY
            fi
          } | tee "$OUT"
          printf '%s\n' "$status" > "$ROOT/status.txt"

      - name: Commit diagnostic result only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/TransvoxelTopologyJob.cs
          OUT=SceneIssues/20260823-014011-920-VoxelShowcase/notes-core-only-topology.txt
          test -s "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'SceneIssue 014011: record core-only topology diagnostic'
            git pull --rebase origin fixes
            git push origin HEAD:fixes
          fi

      - name: Preserve status
        if: always()
        shell: bash
        run: |
          exit "$(cat Artifacts/SceneIssue014011CoreOnlyTopology/status.txt 2>/dev/null || echo 1)"
