name: One-shot SceneIssue 220516 fresh-bake validation

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: read

jobs:
  fresh-bake-replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Verify replay and bake plumbing
        shell: bash
        run: |
          set -euo pipefail
          test -s SceneIssues/20260824-220516-659-VoxelShowcase/screenshot-001.png
          test -s Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes
          grep -q 'ReplayRequestCommandLineArgument = "-voxel-scene-issue"' Assets/DeveloperTools/SceneIssueCapture/SceneIssueCapture.cs
          grep -q 'Verified standalone frozen pose' Assets/DeveloperTools/SceneIssueCapture/SceneIssueReplayVerification.cs
          grep -q 'LoadBake(LoadBakeResource' Assets/Game/Composition/Showcase/ShowcaseWorld.GeneratedContent.cs
          grep -q 'public static void BakeShowcaseWorld' Assets/Scenes/Showcase/Editor/ShowcaseWorldBaker.cs
          grep -q -- '--scene-issue)' tools/showcase-player-capture.sh
          git diff --check

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Rebuild showcase startup bake from current worldgen
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220516FreshBake"
          BAKE="Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"
          mkdir -p "$ROOT"
          shasum -a 256 "$BAKE" | tee "$ROOT/bake-before.sha256"

          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=25 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -quit -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/bake.log" || status=$?

          if (( status != 0 )); then
            echo "ERROR: fresh showcase bake failed with status $status." >&2
            tail -240 "$ROOT/bake.log" >&2 || true
            exit "$status"
          fi
          test -s "$BAKE"
          shasum -a 256 "$BAKE" | tee "$ROOT/bake-after.sha256"
          before="$(awk '{print $1}' "$ROOT/bake-before.sha256")"
          after="$(awk '{print $1}' "$ROOT/bake-after.sha256")"
          echo "SCENE_220516_BAKE_HASH_BEFORE $before"
          echo "SCENE_220516_BAKE_HASH_AFTER $after"
          if [[ "$before" == "$after" ]]; then
            echo "ERROR: fresh bake is byte-identical to committed startup image; stale-bake hypothesis not proven." >&2
            exit 2
          fi
          git diff --check

      - name: Wait for Unity after bake
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay saved VoxelShowcase view from fresh bake
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220516FreshBake"

          set +e
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue SceneIssues/20260824-220516-659-VoxelShowcase/issue.json \
            --run-seconds 60
          capture_status=$?
          set -e

          if (( capture_status != 0 )); then
            echo "ERROR: standalone replay capture failed with status $capture_status." >&2
            [[ ! -s "$ROOT/player-build.log" ]] || { echo '=== PLAYER BUILD LOG TAIL ===' >&2; tail -200 "$ROOT/player-build.log" >&2; }
            [[ ! -s "$ROOT/player-run.log" ]] || { echo '=== PLAYER RUN LOG TAIL ===' >&2; tail -160 "$ROOT/player-run.log" >&2; }
            exit "$capture_status"
          fi

          grep -q 'Verified standalone frozen pose' "$ROOT/player-run.log" || {
            echo "ERROR: standalone replay never verified the saved camera pose." >&2
            tail -160 "$ROOT/player-run.log" >&2 || true
            exit 1
          }

          latest="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$latest"
          sips -s format jpeg --setProperty formatOptions 80 -Z 1364 "$latest" --out "$ROOT/replay-latest.jpg" >/dev/null
          echo "SCENE_220516_FRESH_BAKE_FRAME $(basename "$latest")"

      - name: Upload fresh-bake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-220516-fresh-bake
          path: |
            SceneIssues/20260824-220516-659-VoxelShowcase/screenshot-001.png
            Artifacts/SceneIssue220516FreshBake/bake-before.sha256
            Artifacts/SceneIssue220516FreshBake/bake-after.sha256
            Artifacts/SceneIssue220516FreshBake/bake.log
            Artifacts/SceneIssue220516FreshBake/Screenshots/*.png
            Artifacts/SceneIssue220516FreshBake/replay-latest.jpg
            Artifacts/SceneIssue220516FreshBake/player-build.log
            Artifacts/SceneIssue220516FreshBake/player-run.log
          if-no-files-found: warn
          retention-days: 3
