name: One-shot SceneIssue 220516 stage isolation

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: read

jobs:
  no-plot-surfaces:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Verify replay plumbing
        shell: bash
        run: |
          set -euo pipefail
          test -s SceneIssues/20260824-220516-659-VoxelShowcase/screenshot-001.png
          grep -q 'ReplayRequestCommandLineArgument = "-voxel-scene-issue"' Assets/DeveloperTools/SceneIssueCapture/SceneIssueCapture.cs
          grep -q 'Verified standalone frozen pose' Assets/DeveloperTools/SceneIssueCapture/SceneIssueReplayVerification.cs
          grep -q -- '--scene-issue)' tools/showcase-player-capture.sh
          git diff --check

      - name: Isolate named plot-surface stage in checkout only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeCombinedVoxelCatalogueCanonical.Core.cs')
          text = path.read_text()
          needle = '            Add(stageList, KentridgeVerticalPlacementAdapter.BuildPlotSurfaces(seed, settings, Allocator.Temp));\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one plot-surface stage, found {text.count(needle)}')
          text = text.replace(needle, '            // SceneIssue 220516 diagnostic: named plot-surface stage isolated in CI checkout.\n')
          path.write_text(text)
          PY
          git diff --check
          git diff -- Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeCombinedVoxelCatalogueCanonical.Core.cs

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay saved VoxelShowcase view without plot surfaces
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220516NoPlotSurfaces"

          set +e
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue SceneIssues/20260824-220516-659-VoxelShowcase/issue.json \
            --run-seconds 60
          capture_status=$?
          set -e

          if (( capture_status != 0 )); then
            echo "ERROR: standalone replay capture failed with status $capture_status." >&2
            [[ ! -s "$ROOT/player-build.log" ]] || { echo '=== PLAYER BUILD LOG TAIL ===' >&2; tail -200 "$ROOT/player-build.log" >&2; }
            [[ ! -s "$ROOT/player-run.log" ]] || { echo '=== PLAYER RUN LOG TAIL ===' >&2; tail -160 "$ROOT/player-run.log" >&2; }
            exit "$capture_status"
          fi

          grep -q 'Verified standalone frozen pose' "$ROOT/player-run.log" || {
            echo "ERROR: standalone replay never verified the saved camera pose." >&2
            tail -160 "$ROOT/player-run.log" >&2 || true
            exit 1
          }

          latest="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$latest"
          sips -s format jpeg --setProperty formatOptions 80 -Z 1364 "$latest" --out "$ROOT/replay-latest.jpg" >/dev/null
          echo "SCENE_220516_NO_PLOT_SURFACES_FRAME $(basename "$latest")"

      - name: Upload stage-isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-220516-no-plot-surfaces
          path: |
            SceneIssues/20260824-220516-659-VoxelShowcase/screenshot-001.png
            Artifacts/SceneIssue220516NoPlotSurfaces/Screenshots/*.png
            Artifacts/SceneIssue220516NoPlotSurfaces/replay-latest.jpg
            Artifacts/SceneIssue220516NoPlotSurfaces/player-build.log
            Artifacts/SceneIssue220516NoPlotSurfaces/player-run.log
          if-no-files-found: error
          retention-days: 3
