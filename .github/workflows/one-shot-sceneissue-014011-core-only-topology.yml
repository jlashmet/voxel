name: One-shot SceneIssue 220516 final circulation regression

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: read

jobs:
  circulation-regression:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run circulation coherence regression
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220516FinalRegression"
          mkdir -p "$ROOT"
          status=0
          UNITY_MAX_RSS_MB=12288 UNITY_MAX_MINUTES=8 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform EditMode \
            -testFilter VoxelEngine.Tests.EditMode.KentridgeCirculationCoherenceTests \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log" || status=$?

          if (( status != 0 )); then
            tail -200 "$ROOT/unity.log" >&2 || true
            exit "$status"
          fi
          test -s "$ROOT/results.xml"
          python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//test-case')
          selected = [c for c in cases if 'KentridgeCirculationCoherenceTests' in (c.get('fullname') or c.get('name') or '')]
          if len(selected) != 3:
              raise SystemExit(f'expected exactly 3 circulation tests, found {len(selected)}')
          failed = [c for c in selected if c.get('result') != 'Passed']
          for c in selected:
              print(f"SCENE_220516_REGRESSION {c.get('result')} {c.get('fullname') or c.get('name')}")
          if failed:
              raise SystemExit(f'{len(failed)} circulation tests failed')
          PY
          git diff --check

      - name: Upload final regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-220516-final-regression
          path: |
            Artifacts/SceneIssue220516FinalRegression/results.xml
            Artifacts/SceneIssue220516FinalRegression/unity.log
          if-no-files-found: warn
          retention-days: 3
