name: One-shot SceneIssue 220516 terrace coherence

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml
      - Assets/Tests/EditMode/KentridgeTerraceCoherenceTests.cs
      - Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeDistrictTerraceCatalogue.cs

permissions:
  contents: read

jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run terrace coherence regression
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.EditMode.KentridgeTerraceCoherenceTests
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220516Terrace"
          mkdir -p "$ROOT"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=7 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || status=$?

          if [[ -s "$ROOT/results.xml" ]]; then
            python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//test-case')
          print(f"SCENE_220516_TERRACE_TEST_COUNT {len(cases)}")
          for case in cases:
              print(f"{case.get('result')}: {case.get('fullname') or case.get('name')}")
              failure = case.find('failure')
              if failure is not None:
                  print((failure.findtext('message') or '').strip())
          if len(cases) != 1:
              print(f"ERROR: expected exactly 1 terrace test, got {len(cases)}", file=sys.stderr)
              sys.exit(2)
          PY
            parse_status=$?
            if (( parse_status != 0 )); then status=$parse_status; fi
          else
            echo "ERROR: Unity produced no test results." >&2
            status=3
          fi
          exit "$status"

      - name: Upload terrace diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-220516-terrace-tests
          path: |
            Artifacts/SceneIssue220516Terrace/results.xml
            Artifacts/SceneIssue220516Terrace/unity.log
          if-no-files-found: warn
          retention-days: 3
