name: One-shot SceneIssue 220516 spatial diagnostic

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml
      - Assets/Tests/EditMode/KentridgeScene220516SpatialDiagnosticsTests.cs

permissions:
  contents: read

jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Print combined placements in captured corridor
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.EditMode.KentridgeScene220516SpatialDiagnosticsTests.PrintCombinedPlacementsIntersectingCapturedLowerTownCorridor
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220516Spatial"
          mkdir -p "$ROOT"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=7 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || status=$?

          grep 'SCENE220516_PLACEMENT' "$ROOT/unity.log" || true
          if [[ ! -s "$ROOT/results.xml" ]]; then
            echo "ERROR: Unity produced no test results." >&2
            exit 3
          fi
          exit "$status"

      - name: Upload spatial diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-220516-spatial-diagnostic
          path: |
            Artifacts/SceneIssue220516Spatial/results.xml
            Artifacts/SceneIssue220516Spatial/unity.log
          if-no-files-found: warn
          retention-days: 3
