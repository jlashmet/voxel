name: One-shot SceneIssue 221508 exact-view reproduction

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-core-only-topology.yml

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Verify replay plumbing
        shell: bash
        run: |
          set -euo pipefail
          test -s SceneIssues/20260824-221508-896-VoxelShowcase/screenshot-001.png
          test -s Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes
          grep -q 'ReplayRequestCommandLineArgument = "-voxel-scene-issue"' Assets/DeveloperTools/SceneIssueCapture/SceneIssueCapture.cs
          grep -q 'Verified standalone frozen pose' Assets/DeveloperTools/SceneIssueCapture/SceneIssueReplayVerification.cs
          grep -q -- '--scene-issue)' tools/showcase-player-capture.sh
          git diff --check

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay exact saved VoxelShowcase view
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue221508Exact"
          set +e
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue SceneIssues/20260824-221508-896-VoxelShowcase/issue.json \
            --run-seconds 60
          capture_status=$?
          set -e
          if (( capture_status != 0 )); then
            [[ ! -s "$ROOT/player-build.log" ]] || tail -200 "$ROOT/player-build.log" >&2
            [[ ! -s "$ROOT/player-run.log" ]] || tail -160 "$ROOT/player-run.log" >&2
            exit "$capture_status"
          fi
          grep -q 'Verified standalone frozen pose' "$ROOT/player-run.log" || {
            tail -160 "$ROOT/player-run.log" >&2 || true
            exit 1
          }
          latest="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$latest"
          cp "$latest" "$ROOT/replay-latest.png"
          sips -s format jpeg --setProperty formatOptions 85 -Z 1364 "$latest" --out "$ROOT/replay-latest.jpg" >/dev/null
          echo "SCENE_221508_EXACT_FRAME $(basename "$latest")"

      - name: Upload exact-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-221508-exact-view
          path: |
            SceneIssues/20260824-221508-896-VoxelShowcase/screenshot-001.png
            Artifacts/SceneIssue221508Exact/replay-latest.png
            Artifacts/SceneIssue221508Exact/replay-latest.jpg
            Artifacts/SceneIssue221508Exact/player-build.log
            Artifacts/SceneIssue221508Exact/player-run.log
          if-no-files-found: warn
          retention-days: 3
