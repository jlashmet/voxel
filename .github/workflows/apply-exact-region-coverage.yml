name: Apply exact snapshot coverage repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-exact-region-coverage.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply exact source patch
        run: python3 tools/apply-exact-region-coverage.py
      - name: Validate focused diff
        run: |
          git diff --check
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                     .claude/plans/voxel-showcase-rendering-repair-v2.md
      - name: Commit repair and retire transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm .github/workflows/apply-exact-region-coverage.yml tools/apply-exact-region-coverage.py
          git commit -m 'fix(rendering): reject incomplete exact snapshots'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
