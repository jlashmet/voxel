name: Lookdev Environment Composition acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5886c41856e48714cb81674b57b3ff431d3f8d0
          fetch-depth: 1
      - name: Verify lookdev rendering wiring boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          env = Path('Assets/Scenes/Showcase/TerrainLookdev.Environment.cs').read_text()
          bootstrap = Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          asmdef = json.loads(Path('Assets/VoxelEngine/Composition/VoxelEngine.Composition.asmdef').read_text())
          if 'VoxelEngine.Rendering.Runtime' in env or 'VoxelRenderBridge' in env:
              raise SystemExit('TerrainLookdev.Environment still depends on Rendering.Runtime')
          if 'using VoxelEngine.Composition;' not in env or 'ConfigureRenderingEnvironment' not in env:
              raise SystemExit('TerrainLookdev.Environment is not routed through Composition')
          if 'VoxelRenderBridge.SurfaceDebugTint' not in bootstrap or 'ConfigureRenderingEnvironment' not in bootstrap:
              raise SystemExit('Composition does not own renderer environment wiring')
          if 'VoxelEngine.Rendering.Runtime' not in asmdef.get('references', []):
              raise SystemExit('Composition asmdef does not own the Rendering.Runtime dependency')
          print('Lookdev environment Composition boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5886c41856e48714cb81674b57b3ff431d3f8d0
          clean: false
          fetch-depth: 1
      - name: Reset pinned lookdev candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard a5886c41856e48714cb81674b57b3ff431d3f8d0
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/LookdevEnvironmentComposition"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lookdev-environment-composition-a5886c41
          path: Artifacts/LookdevEnvironmentComposition/
          if-no-files-found: warn
          retention-days: 14
