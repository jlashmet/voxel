name: Placeholder Humanoid Runtime

# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: placeholder-humanoid-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  character-runtime:
    name: Character placeholder runtime
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15

    steps:
      - name: Checkout without deleting Unity import cache
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run focused character tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PlaceholderHumanoidRuntime"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh

          run_test_class() {
            local platform="$1"
            local class_name="$2"
            local artifact_name="$3"
            UNITY_MAX_RSS_MB=8192 \
            UNITY_BIN="${{ steps.unity.outputs.path }}" \
            tools/unity-run.sh \
              -batchmode \
              -nographics \
              -job-worker-count 1 \
              -projectPath "$GITHUB_WORKSPACE" \
              -runTests \
              -testPlatform "$platform" \
              -testFilter "$class_name" \
              -testResults "$ROOT/${artifact_name}.xml" \
              -logFile "$ROOT/${artifact_name}.log"
            test -s "$ROOT/${artifact_name}.xml"
          }

          run_test_class \
            EditMode \
            VoxelEngine.Tests.EditMode.PlaceholderCharacterFactoryFreshImportTests \
            fresh-import
          run_test_class \
            EditMode \
            VoxelEngine.Tests.EditMode.PlaceholderHumanoidPlaybackTests \
            real-assets
          run_test_class \
            PlayMode \
            VoxelEngine.Tests.PlayMode.CharacterVisualResolverPlayModeTests \
            resolver
          run_test_class \
            PlayMode \
            VoxelEngine.Tests.PlayMode.CharacterAnimationPlayerPlayModeTests \
            animation-player

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeholder-humanoid-runtime-${{ github.sha }}
          path: Artifacts/PlaceholderHumanoidRuntime/
          if-no-files-found: warn
          retention-days: 7
