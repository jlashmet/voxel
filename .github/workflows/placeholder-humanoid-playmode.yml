name: Placeholder Humanoid PlayMode

on:
  pull_request:
    paths:
      - 'Assets/VoxelEngine/Characters/**'
      - 'Assets/ThirdParty/PlaceholderHumanoids/**'
      - 'Assets/Tests/PlayMode/CharacterVisualResolverPlayModeTests.cs'
      - 'Assets/Tests/PlayMode/VoxelEngine.Tests.PlayMode.asmdef'
      - '.github/workflows/placeholder-humanoid-playmode.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placeholder-humanoid-playmode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolver-playmode:
    name: Character visual resolver lifecycle
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15

    steps:
      - name: Checkout without deleting Unity import cache
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run resolver PlayMode lifecycle test
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PlaceholderHumanoidPlayMode"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter VoxelEngine.Tests.PlayMode.CharacterVisualResolverPlayModeTests \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          test -s "$ROOT/results.xml"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placeholder-humanoid-playmode-${{ github.sha }}
          path: Artifacts/PlaceholderHumanoidPlayMode/
          if-no-files-found: warn
          retention-days: 7
