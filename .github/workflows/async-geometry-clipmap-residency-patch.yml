name: Clipmap residency admission one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-clipmap-residency-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_clipmap_residency_patch.py
      - name: Static guards
        run: |
          grep -q 'public void SetClipmapWindow' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'if (!WithinClipmapWindow(chunk)) return;' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'UpdateClipmapWindow(cameraPosition, voxelSize)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'ClipmapWindowOwnsRenderResidencyAdmission' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Make clipmap window own solid render residency'
          git push origin HEAD:refactor/async-geometry-pipeline
