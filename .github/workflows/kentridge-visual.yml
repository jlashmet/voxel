name: Kentridge Visual

on:
  workflow_dispatch:
  push:
    branches:
      - feature/kentridge-town-refinement
    paths:
      - 'Packages/com.mountingforce.worldgen/**'
      - 'Assets/Tests/EditMode/KentridgeGenerationTests.cs'
      - 'Assets/Tests/EditMode/VoxelEngine.Tests.EditMode.asmdef'
      - 'Assets/VoxelEngine/CI/Editor/KentridgeCapture.cs'
      - 'Assets/VoxelEngine/CI/Editor/VoxelEngine.CI.Editor.asmdef'
      - 'Assets/VoxelEngine/Core/Features/**'
      - 'Assets/VoxelEngine/Rendering/SurfaceExtraction/**'
      - '.github/workflows/kentridge-visual.yml'

jobs:
  capture-kentridge:
    name: Test and render isolated Kentridge
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run isolated Kentridge tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/Kentridge"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testFilter VoxelEngine.Tests.EditMode.KentridgeGenerationTests \
            -testResults "$GITHUB_WORKSPACE/Artifacts/Kentridge/test-results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Kentridge/tests.log"

          test -s "$GITHUB_WORKSPACE/Artifacts/Kentridge/test-results.xml"

      - name: Render deterministic Kentridge
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.KentridgeCapture.Run \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Kentridge/unity.log" \
            -quit

          for view in \
            overview-ne overview-nw overview-se overview-sw \
            street-north street-south street-east street-west; do
            test -s "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-${view}.png"
          done
          test -s "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-overview.txt"

      - name: Show Kentridge metadata
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-overview.txt" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-overview.txt"
          fi

      - name: Upload Kentridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kentridge-${{ github.sha }}
          path: Artifacts/Kentridge/
          if-no-files-found: warn
          retention-days: 14
