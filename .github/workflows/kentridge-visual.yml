name: Kentridge Visual

on:
  workflow_dispatch:
  push:
    branches:
      - feature/kentridge-town-refinement
    paths:
      - 'Packages/com.mountingforce.worldgen/**'
      - 'Assets/Tests/EditMode/Kentridge*.cs'
      - 'Assets/Tests/EditMode/VoxelEngine.Tests.EditMode.asmdef'
      - 'Assets/VoxelEngine/CI/Editor/Kentridge*.cs'
      - 'Assets/VoxelEngine/CI/Editor/VoxelEngine.CI.Editor.asmdef'
      - 'Assets/VoxelEngine/Core/Features/**'
      - 'Assets/VoxelEngine/Core/Terrain/**'
      - 'Assets/VoxelEngine/Core/Vegetation/**'
      - 'Assets/VoxelEngine/Rendering/SurfaceExtraction/**'
      - 'Assets/VoxelEngine/Rendering/Vegetation/**'
      - '.github/workflows/kentridge-visual.yml'

concurrency:
  group: kentridge-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-kentridge:
    name: Validate and render isolated Kentridge
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Validate and render deterministic Kentridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/Kentridge"

          # The isolated visual capture keeps all sampled terrain and authored town regions resident
          # at once, unlike production streaming. Give only this diagnostic invocation enough mixed
          # brick storage and surface-cache reach for the complete town after the master sync.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs")
          source = path.read_text()

          old_pool = "pool = new BrickPool(65536, Allocator.Persistent);"
          new_pool = "pool = new BrickPool(262144, Allocator.Persistent);"
          if old_pool not in source:
              raise SystemExit("Kentridge capture BrickPool allocation signature changed")
          source = source.replace(old_pool, new_pool, 1)

          old_cache = "smoothCache = new CpuTransvoxelChunkCache();"
          new_cache = (
              old_cache
              + "\n                // Whole-town CI intentionally exceeds the runtime residency radius."
              + "\n                smoothCache.MaxViewDistanceMetres = camera.farClipPlane;"
          )
          if old_cache not in source:
              raise SystemExit("Kentridge capture surface-cache signature changed")
          source = source.replace(old_cache, new_cache, 1)

          path.write_text(source)
          PY

          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.KentridgeRuntimeCapture.Run \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Kentridge/unity.log" \
            -quit

          for view in \
            overview-ne overview-nw overview-se overview-sw \
            street-north street-south street-east street-west; do
            test -s "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-${view}.png"
          done
          test -s "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-overview.txt"

      - name: Show Kentridge metadata
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-overview.txt" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/Kentridge/kentridge-overview.txt"
          fi

      - name: Upload Kentridge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kentridge-${{ github.sha }}
          path: Artifacts/Kentridge/
          if-no-files-found: warn
          retention-days: 14
