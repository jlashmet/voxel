name: Cutover 13 TonalMap 781eb5fd static gate

on:
  push:
    paths:
      - .github/workflows/cutover13-tonalmap-781eb5fd-static.yml

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 781eb5fd1c4230ea643f69dc33517240ad87f626
          fetch-depth: 1
      - name: Verify TonalMap Composition cut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('Assets/Scenes/Showcase')
          tonal=(root/'TerrainLookdev.TonalMap.cs').read_text()
          if 'VoxelEngine.Rendering.Runtime' in tonal or 'VoxelPresentationCatalogue' in tonal or 'VoxelRenderBridge' in tonal:
              raise SystemExit('TonalMap still leaks Rendering.Runtime')
          for token in ['ConfigureRenderingSky(', 'ConfigureTurfMaterialPresentation(', 'ConfigureMaterialPresentation(']:
              if token not in tonal:
                  raise SystemExit('Missing TonalMap Composition call: '+token)
          bootstrap=Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          for token in ['public static void ConfigureRenderingSky(', 'public static void ConfigureTurfMaterialPresentation(', 'public static void ConfigureMaterialPresentation(']:
              if token not in bootstrap:
                  raise SystemExit('Missing Composition implementation: '+token)
          pat=re.compile(r'using\s+(VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*)\s*;')
          files=[]
          for p in sorted(root.rglob('*.cs')):
              hits=sorted(set(pat.findall(p.read_text(errors='ignore'))))
              if hits: files.append((p,hits))
          print('Runtime-coupled Showcase files:',len(files))
          for p,h in files: print(p,'=>',', '.join(h))
          if len(files) != 7:
              raise SystemExit(f'Expected 7 Runtime-coupled Showcase files after TonalMap cut, got {len(files)}')
          storage=[p for p,_ in files if 'using VoxelEngine.Storage.Runtime;' in p.read_text(errors='ignore')]
          if storage != [root/'ShowcaseWorld.cs']:
              raise SystemExit('Unexpected Storage.Runtime owner set: '+str(storage))
          PY
