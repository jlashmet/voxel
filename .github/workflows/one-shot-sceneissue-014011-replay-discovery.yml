name: One-shot SceneIssue 014011 replay discovery

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-replay-discovery.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          fetch-depth: 1
      - name: Locate existing showcase replay and capture hooks
        shell: bash
        run: |
          set -euo pipefail
          out=SceneIssues/20260823-014011-920-VoxelShowcase/notes-replay-discovery.txt
          {
            echo '=== Real capture / visual test classes ==='
            grep -RIl --include='*.cs' -E 'GoldenShowcaseRealCaptureTests|GoldenShowcaseVisualTests|GpuSurfaceScaleCollapseTests' Assets | sort || true
            echo '=== Scene issue / camera replay hooks ==='
            grep -RIn --include='*.cs' -E 'SceneIssue|camera.*override|Camera.*override|showcase.*camera|capture.*camera|Main Camera|baseline-sample' Assets tools | head -n 300 || true
            echo '=== Showcase player argument parsing ==='
            grep -RIn --include='*.cs' -E 'showcase-capture|showcase-baseline-sample|showcase-metrics|Environment.GetCommandLineArgs' Assets | head -n 300 || true
          } > "$out"
          cat "$out"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'SceneIssue 014011: record replay harness discovery'
          git push origin HEAD:fixes
