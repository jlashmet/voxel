name: Cutover 13 run multiplayer composition script

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-run-multiplayer-script.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply validated multiplayer composition cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/cutover13_multiplayer.py

          test -f Assets/VoxelEngine/Composition/NetworkingComposition.cs
          ! grep -Eq 'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime' Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs
          ! grep -q 'Unity.Networking.Transport' Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs

          rm .github/scripts/cutover13_multiplayer.py
          rm .github/workflows/cutover13-multiplayer-composition.yml
          rm .github/workflows/cutover13-run-multiplayer-script.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Composition/NetworkingComposition.cs \
                  Assets/VoxelEngine/Composition/NetworkingComposition.cs.meta \
                  Assets/VoxelEngine/Composition/VoxelEngine.Composition.asmdef \
                  Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs \
                  Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef \
                  .github/scripts/cutover13_multiplayer.py \
                  .github/workflows/cutover13-multiplayer-composition.yml \
                  .github/workflows/cutover13-run-multiplayer-script.yml
          git diff --cached --check
          git commit -m 'refactor: route showcase networking through composition'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
