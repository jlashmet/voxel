name: CharacterMotor API acceptance
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40007bc9e7ae074223bef71619c1e070a38a7d54
          fetch-depth: 1
      - name: Verify CharacterMotor API-only voxel reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          motor = Path('Assets/Scenes/Showcase/CharacterMotor.cs').read_text()
          world = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs').read_text()
          forbidden = [
              'VoxelEngine.Storage.Runtime', 'VoxelEngine.Collision.Runtime',
              'VoxelAccess', 'world.Table', 'world.Pool', 'RegionTable', 'BrickPool'
          ]
          bad = [token for token in forbidden if token in motor]
          if bad:
              raise SystemExit('CharacterMotor retains Runtime/physical dependency: ' + ', '.join(bad))
          required = ['using VoxelEngine.Storage.Api;', 'IVoxelSurfaceQuery', 'surface.TryRead', 'VoxelGrid.MaterialEmpty']
          missing = [token for token in required if token not in motor]
          if missing:
              raise SystemExit('CharacterMotor missing API query pieces: ' + ', '.join(missing))
          if 'public IVoxelSurfaceQuery SurfaceQuery' not in world:
              raise SystemExit('ShowcaseWorld does not expose the API surface query capability')
          print('CharacterMotor API-only read boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40007bc9e7ae074223bef71619c1e070a38a7d54
          clean: false
          fetch-depth: 1
      - name: Reset pinned CharacterMotor candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 40007bc9e7ae074223bef71619c1e070a38a7d54
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/CharacterMotorApi"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-motor-api-40007bc9
          path: Artifacts/CharacterMotorApi/
          if-no-files-found: warn
          retention-days: 14
