name: One-shot Showcase Render Storage Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-showcase-render-storage-cutover.yml'
      - 'Tools/Refactor/apply_showcase_render_storage_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic Showcase cutover
        run: python Tools/Refactor/apply_showcase_render_storage_cutover.py

      - name: Verify Showcase diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'public IRegionReadSource ReadStorage' Assets/Scenes/Showcase/ShowcaseWorld.cs
          grep -q 'Storage = _world.ReadStorage' Assets/Scenes/Showcase/VoxelShowcase.cs
          grep -q 'Storage = _readSource' Assets/Scenes/Showcase/ArchLookdev.cs
          grep -q 'Storage = _readSource' Assets/Scenes/Showcase/TerrainLookdev.cs
          grep -q 'in plan, view.Storage' Assets/Scenes/Showcase/ShowcaseTreePopulation.cs
          ! grep -R -n --include='*.cs' -E 'view\.(Table|Pool)' Assets/Scenes/Showcase

      - name: Commit Showcase cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-showcase-render-storage-cutover.yml
          git rm Tools/Refactor/apply_showcase_render_storage_cutover.py
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git add Assets/Scenes/Showcase/VoxelShowcase.cs
          git add Assets/Scenes/Showcase/ArchLookdev.cs
          git add Assets/Scenes/Showcase/TerrainLookdev.cs
          git add Assets/Scenes/Showcase/ShowcaseTreePopulation.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over showcase render storage views'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
