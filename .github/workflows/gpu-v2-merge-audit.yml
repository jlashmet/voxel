name: gpu-v2 semantic merge audit

on:
  push:
    branches: [gpu-merged]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'Run gpu-v2 semantic merge audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpu-v2
          fetch-depth: 0
      - name: Attempt native merge and report conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          set +e
          git merge --no-commit --no-ff origin/master
          status=$?
          set -e
          echo "merge_status=$status"
          echo "=== CONFLICTS ==="
          git diff --name-only --diff-filter=U | sort
          echo "=== STATUS ==="
          git status --short
          if [[ $status -ne 0 ]]; then exit 1; fi
