name: One-shot Trace Foundation Skirt Builder

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-find-foundation-skirt-builder.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Locate malformed definition and encoding path
        shell: bash
        run: |
          set -u
          root='Packages/com.mountingforce.worldgen/Runtime/Voxel'
          echo '=== skirt/foundation matches ==='
          grep -R -n -i -C 10 -E 'skirt|foundation' "$root" --include='*.cs' || true
          echo '=== encoding-related code in matching files ==='
          files=$(grep -R -l -i -E 'skirt|foundation' "$root" --include='*.cs' || true)
          for f in $files; do
            echo "--- $f ---"
            grep -n -E -C 6 'Program\[|ProgramBuilder|ShapeOp\.|Op\(|WriteProgram|CopyProgram' "$f" || true
          done
      - name: Self-clean diagnostic workflow
        run: |
          rm .github/workflows/one-shot-find-foundation-skirt-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-find-foundation-skirt-builder.yml
          git commit -m "chore: remove foundation skirt diagnostic"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
