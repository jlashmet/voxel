name: Patch async geometry LOD capture framing

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-lod-framing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Frame the castle rather than the whole near clipmap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/PlayMode/LodRenderingTests.cs')
          text = p.read_text()
          old = '''                camera.targetTexture = target;\n                camera.orthographic = true;\n                camera.orthographicSize = 70f;\n                CastleStructureSignature reference = default;'''
          new = '''                camera.targetTexture = target;\n                camera.orthographic = true;\n                // Bailey width is roughly 44-56 m and the sculpted plateau stays below about\n                // 86 m diameter. A 45 m half-height keeps the whole landmark in frame while the\n                // central structure crop measures the castle, instead of exposing nearly the\n                // entire 192 m-wide near clipmap and turning arena capacity into the test target.\n                camera.orthographicSize = 45f;\n                CastleStructureSignature reference = default;'''
          if text.count(old) != 1:
              raise SystemExit('LOD orthographic framing insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''                      + $\"snapshotP95={metrics.SnapshotTiming.P95Ms:F2}ms.\");'''
          new = '''                      + $\"snapshotP95={metrics.SnapshotTiming.P95Ms:F2}ms \"\n                      + $\"arena={metrics.SolidArenaUsedBytes}/{metrics.SolidArenaCommittedBytes}B \"\n                      + $\"leases={metrics.SolidArenaActiveLeases} \"\n                      + $\"arenaFailures={metrics.SolidArenaAllocationFailures} \"\n                      + $\"pressureEvictions={metrics.SolidArenaPressureEvictions} \"\n                      + $\"capacityEvents={metrics.SolidCapacityPressureEvents}.\");'''
          if text.count(old) != 1:
              raise SystemExit('LOD arena diagnostic insertion point mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit framing fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-lod-framing-fix.yml
          git add Assets/Tests/PlayMode/LodRenderingTests.cs
          git commit -m "test(lod): frame castle instead of whole near clipmap"
          git push origin HEAD:refactor/async-geometry-pipeline
