name: Patch async geometry LOD capture depth framing

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-lod-depth-framing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Clip visual convergence to castle depth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/PlayMode/LodRenderingTests.cs')
          text = p.read_text()

          old = '''            bool oldOrthographic = camera.orthographic;\n            float oldOrthographicSize = camera.orthographicSize;\n            double oldSolidBuildBudgetMs = VoxelRenderBridge.SolidBuildBudgetMs;'''
          new = '''            bool oldOrthographic = camera.orthographic;\n            float oldOrthographicSize = camera.orthographicSize;\n            float oldNearClipPlane = camera.nearClipPlane;\n            float oldFarClipPlane = camera.farClipPlane;\n            double oldSolidBuildBudgetMs = VoxelRenderBridge.SolidBuildBudgetMs;'''
          if text.count(old) != 1:
              raise SystemExit('camera state insertion point mismatch')
          text = text.replace(old, new, 1)

          text = text.replace(
              '''                // Its 70 m orthographic half-height exposes roughly the whole near clipmap at\n                // once, far more surface chunks than a gameplay perspective view. Give extraction\n                // enough CPU admission to make the existing 8-second hole-free precondition''',
              '''                // The capture is castle-focused rather than a whole-clipmap residency test. Give\n                // extraction enough CPU admission to make the existing 8-second hole-free precondition''',
              1)

          old = '''                    camera.transform.position = centre + new Vector3(0f, 20f, -band.distance);\n                    camera.transform.LookAt(lookAt);\n\n                    // Geometry is deliberately asynchronous.'''
          new = '''                    camera.transform.position = centre + new Vector3(0f, 20f, -band.distance);\n                    camera.transform.LookAt(lookAt);\n                    // MissingVisible is frustum-scoped, so bound depth to the landmark too. The\n                    // castle/plateau fits within roughly +/-43 m of its centre; +/-50 m leaves a\n                    // halo for towers/cliffs while excluding unrelated clipmap rings hundreds of\n                    // metres in front of or behind the subject. The strict hole-free check stays.\n                    camera.nearClipPlane = Mathf.Max(0.3f, band.distance - 50f);\n                    camera.farClipPlane = band.distance + 50f;\n\n                    // Geometry is deliberately asynchronous.'''
          if text.count(old) != 1:
              raise SystemExit('per-band depth insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''                VoxelRenderBridge.SolidBuildBudgetMs = oldSolidBuildBudgetMs;\n                camera.targetTexture = null;\n                camera.orthographic = oldOrthographic;\n                camera.orthographicSize = oldOrthographicSize;'''
          new = '''                VoxelRenderBridge.SolidBuildBudgetMs = oldSolidBuildBudgetMs;\n                camera.targetTexture = null;\n                camera.orthographic = oldOrthographic;\n                camera.orthographicSize = oldOrthographicSize;\n                camera.nearClipPlane = oldNearClipPlane;\n                camera.farClipPlane = oldFarClipPlane;'''
          if text.count(old) != 1:
              raise SystemExit('camera state restore point mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit depth framing and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-lod-depth-framing-fix.yml
          git add Assets/Tests/PlayMode/LodRenderingTests.cs
          git commit -m "test(lod): scope hole-free convergence to castle depth"
          git push origin HEAD:refactor/async-geometry-pipeline
