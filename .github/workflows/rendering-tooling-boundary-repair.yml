name: Rendering tooling boundary repair
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-tooling-boundary-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # World-view presentation field rename in tooling/test consumers.
          field_files = [
              Path('Assets/Tests/PlayMode/ShowcaseGpuSurfaceTests.cs'),
              Path('Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs'),
          ]
          for p in field_files:
              s = p.read_text()
              before = s
              s = s.replace('.SurfaceCatalogue.CatalogueHash', '.SurfaceCatalogueView.CatalogueHash')
              s = s.replace('.CoatingCatalogue.CatalogueHash', '.CoatingCatalogueView.CatalogueHash')
              s = s.replace('SurfaceCatalogue =', 'SurfaceCatalogueView =')
              s = s.replace('CoatingCatalogue =', 'CoatingCatalogueView =')
              if s == before:
                  raise SystemExit(f'no world-view field repair applied in {p}')
              if '.SurfaceCatalogue.' in s or '.CoatingCatalogue.' in s or 'SurfaceCatalogue =' in s or 'CoatingCatalogue =' in s:
                  raise SystemExit(f'legacy world-view field remains in {p}')
              p.write_text(s)
              print('updated', p)

          # Explicit `in` at the call site blocks the existing implicit mutable-catalogue -> API-view
          # conversion. The parameter itself remains `in`; omit the optional call-site modifier.
          capture_files = [
              Path('Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.Core.cs'),
              Path('Assets/VoxelEngine/CI/Editor/KentridgeCaptureImpl.cs'),
              Path('Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs'),
              Path('Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs'),
          ]
          total = 0
          pat = re.compile(r'(cache\.Prepare\([^;]*?)(in\s+)([A-Za-z_]\w*)(\s*,\s*)(in\s+)([A-Za-z_]\w*)(\s*,\s*)(in\s+)([A-Za-z_]\w*)(\s*,)', re.S)
          def repl(m):
              global total
              total += 1
              return m.group(1)+m.group(3)+m.group(4)+m.group(6)+m.group(7)+m.group(9)+m.group(10)
          for p in capture_files:
              s = p.read_text()
              before = s
              s, n = pat.subn(repl, s)
              if n != 1:
                  raise SystemExit(f'{p}: expected exactly one catalogue Prepare call, found {n}')
              p.write_text(s)
              print('updated', p)
          if total != 4:
              raise SystemExit(f'expected four capture repairs, got {total}')
          PY
          git rm .github/workflows/rendering-tooling-boundary-repair.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/PlayMode/ShowcaseGpuSurfaceTests.cs Assets/VoxelEngine/CI/Editor
          git add -u .github/workflows
          git commit -m 'Migrate Rendering tooling to Storage API views'
          git push origin HEAD:${{ github.ref_name }}
