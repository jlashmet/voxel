name: Vegetation parent-count cleanup
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs')
          s = p.read_text()
          old = '                    if ((uint)current >= (uint)parents.Length) break;'
          new = '                    if ((uint)current >= (uint)parents.Count) break;'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          git rm -f .github/workflows/vegetation-parent-count-cleanup.yml \
                    .github/workflows/vegetation-readonly-list-repair.yml \
                    .github/workflows/vegetation-readonly-parent-fix.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs
          git commit -m 'Fix Vegetation readonly parent count'
          git push origin HEAD:${{ github.ref_name }}
