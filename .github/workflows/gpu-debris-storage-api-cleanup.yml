name: GpuDebris Storage API cleanup
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/gpu-debris-storage-api-cleanup.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove stale Storage Runtime import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/Scenes/Showcase/GpuDebrisSystem.cs')
          text = path.read_text()
          token = 'using VoxelEngine.Storage.Runtime;\n'
          if text.count(token) != 1:
              raise SystemExit('GpuDebris Storage.Runtime import did not match exactly once')
          text = text.replace(token, '', 1)
          if 'VoxelEngine.Storage.Runtime' in text:
              raise SystemExit('GpuDebris still contains Storage.Runtime')

          api = Path('Assets/VoxelEngine/Storage/Api/VoxelCell.cs').read_text()
          if 'public static class Coatings' not in api:
              raise SystemExit('Coatings are not owned by Storage.Api as expected')
          path.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/GpuDebrisSystem.cs
          git commit -m 'refactor(showcase): remove stale GpuDebris Storage Runtime import'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage