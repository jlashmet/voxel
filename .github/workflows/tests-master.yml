name: Tests (master — full suite)

# Every behavior-changing merge to master runs the full suite. Human approval
# PRs only move already-tested evidence from pending to closed and are ignored.
# Pull requests run the assemblies their changes can affect (see tests-pr.yml).
#
# Test assemblies are discovered from the project asmdef graph instead of being
# duplicated in this workflow. That keeps newly added module-local suites, including
# renderer parity tests, inside the master gate automatically.
#
# Normal EditMode and PlayMode suites share one Unity editor process. Unity Test
# Framework 1.x cannot execute both modes in one API call, so the editor-side CI
# orchestrator sequences them without exiting Unity. VoxelEngine.Tests.PlayMode
# remains split into fresh processes because that suite has demonstrated retained
# native scene/rendering memory across repeated loads.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'SceneIssues/pending/**'
      - 'SceneIssues/closed/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Select every test assembly
        id: select
        shell: bash
        run: |
          set -euo pipefail
          EDIT_ARGS="$(tools/select-tests.py --all --format unity-args --platform EditMode)"
          PLAY_ARGS="$(tools/select-tests.py --all --format unity-args --platform PlayMode)"
          EDIT_NAMES="${EDIT_ARGS#-assemblyNames }"
          PLAY_NAMES="${PLAY_ARGS#-assemblyNames }"

          heavy=false
          NORMAL_PLAY_NAMES=""
          if [[ -n "$PLAY_NAMES" ]]; then
            IFS=';' read -ra play_assemblies <<< "$PLAY_NAMES"
            for asm in "${play_assemblies[@]}"; do
              [[ -z "$asm" ]] && continue
              if [[ "$asm" == "VoxelEngine.Tests.PlayMode" ]]; then
                heavy=true
              elif [[ -z "$NORMAL_PLAY_NAMES" ]]; then
                NORMAL_PLAY_NAMES="$asm"
              else
                NORMAL_PLAY_NAMES="$NORMAL_PLAY_NAMES;$asm"
              fi
            done
          fi

          {
            echo "editmode_names=$EDIT_NAMES"
            echo "playmode_names=$NORMAL_PLAY_NAMES"
            echo "heavy_playmode=$heavy"
          } >> "$GITHUB_OUTPUT"

          echo "EditMode assemblies: ${EDIT_NAMES:-<none>}"
          echo "PlayMode assemblies: ${NORMAL_PLAY_NAMES:-<none>}"
          echo "Isolated VoxelEngine.Tests.PlayMode: $heavy"

      - name: EditMode + normal PlayMode in one Unity editor
        if: steps.select.outputs.editmode_names != '' || steps.select.outputs.playmode_names != '' || steps.select.outputs.heavy_playmode == 'true'
        shell: bash
        env:
          VOXEL_CI_EDITMODE_ASSEMBLIES: ${{ steps.select.outputs.editmode_names }}
          VOXEL_CI_PLAYMODE_ASSEMBLIES: ${{ steps.select.outputs.playmode_names }}
          VOXEL_CI_RESULTS_ROOT: ${{ github.workspace }}/Artifacts/MasterTests
          VOXEL_CI_BAKE_SHOWCASE: ${{ steps.select.outputs.heavy_playmode }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/MasterTests"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=20480 UNITY_MAX_MINUTES=40 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelCiPersistentTestRunner.Run \
            -logFile "$ROOT/persistent.log"
          test -s "$ROOT/persistent-summary.txt"
          grep -q '^status=passed$' "$ROOT/persistent-summary.txt"
          if [[ "${{ steps.select.outputs.heavy_playmode }}" == "true" ]]; then
            test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"
          fi

      # This one suite is intentionally still process-isolated. It retains native
      # scene/rendering allocations across repeated scene loads, so each name shard
      # gets a fresh editor and allocator state.
      - name: PlayMode VoxelEngine.Tests.PlayMode isolated shards
        if: steps.select.outputs.heavy_playmode == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/MasterTests"
          ASM="VoxelEngine.Tests.PlayMode"
          FILTERS=(
            '^VoxelEngine\.Tests\.PlayMode\.[A-F]'
            '^VoxelEngine\.Tests\.PlayMode\.[G-M]'
            '^VoxelEngine\.Tests\.PlayMode\.[N-S]'
            '!^VoxelEngine\.Tests\.PlayMode\.[A-S]'
          )
          LABELS=(a-f g-m n-s t-z-rest)
          status=0

          for i in "${!FILTERS[@]}"; do
            label="${LABELS[$i]}"
            echo "::group::PlayMode $ASM ($label)"
            UNITY_MAX_RSS_MB=20480 UNITY_MAX_MINUTES=30 \
            UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
              -batchmode -job-worker-count 1 \
              -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
              -assemblyNames "$ASM" -testFilter "${FILTERS[$i]}" \
              -testResults "$ROOT/$ASM-$label.xml" \
              -logFile "$ROOT/$ASM-$label.log" || status=1
            echo "::endgroup::"
          done

          exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-test-results
          path: Artifacts/MasterTests/**
          if-no-files-found: ignore
