name: Tests (master — full suite)

# Every test, unconditionally, on every merge to master. Pull requests run only
# the assemblies their changes can affect (see tests-pr.yml); this is the run
# that makes selection safe, so it must never be filtered or made conditional.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-tests-master
  cancel-in-progress: false

jobs:
  character-factory:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Character Factory contract
        shell: bash
        run: bash tools/character-factory/ci/run_contract_tests.sh

      - name: Character Factory Blender smoke
        shell: bash
        env:
          CHARACTER_FACTORY_SMOKE_OUT: ${{ github.workspace }}/Artifacts/CharacterFactorySmoke
        run: bash tools/character-factory/ci/run_blender_smoke.sh

      - name: Upload Character Factory smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-character-factory-smoke
          path: Artifacts/CharacterFactorySmoke/**
          if-no-files-found: ignore

  editmode:
    needs: character-factory
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: EditMode (all assemblies)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/MasterTests"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=40 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/editmode.xml" -logFile "$ROOT/editmode.log"
          test -s "$ROOT/editmode.xml"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-editmode-results
          path: Artifacts/MasterTests/**
          if-no-files-found: ignore

  playmode:
    # One process per assembly, and one assembly at a time: the runner has a
    # single Unity editor and unity-run.sh refuses a second. Isolation also
    # keeps one leaking suite from taking the others down with it.
    needs: editmode
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        assembly:
          - VoxelEngine.Tests.Parity
          - VoxelEngine.Tests.Features
          - VoxelEngine.CI.PlayMode
          - MountingForce.CombatPrototype.Tests.PlayMode
          # This assembly is further split into complementary test-name shards
          # inside its step so Unity's retained native scene memory is reset
          # between groups without dropping any coverage.
          - VoxelEngine.Tests.PlayMode
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Bake Voxel Showcase startup world
        if: matrix.assembly == 'VoxelEngine.Tests.PlayMode'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/MasterTests"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=20 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"

      - name: PlayMode ${{ matrix.assembly }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/MasterTests"
          mkdir -p "$ROOT"
          ASM="${{ matrix.assembly }}"

          if [[ "$ASM" == "VoxelEngine.Tests.PlayMode" ]]; then
            FILTERS=(
              '^VoxelEngine\.Tests\.PlayMode\.[A-F]'
              '^VoxelEngine\.Tests\.PlayMode\.[G-M]'
              '^VoxelEngine\.Tests\.PlayMode\.[N-S]'
              '!^VoxelEngine\.Tests\.PlayMode\.[A-S]'
            )
            LABELS=(a-f g-m n-s t-z-rest)
            status=0
            for i in "${!FILTERS[@]}"; do
              label="${LABELS[$i]}"
              UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
              UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
                -batchmode -job-worker-count 1 \
                -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
                -assemblyNames "$ASM" -testFilter "${FILTERS[$i]}" \
                -testResults "$ROOT/$ASM-$label.xml" \
                -logFile "$ROOT/$ASM-$label.log" || status=1
            done
            exit $status
          fi

          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
            -assemblyNames "$ASM" \
            -testResults "$ROOT/$ASM.xml" \
            -logFile "$ROOT/$ASM.log"
          test -s "$ROOT/$ASM.xml"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-playmode-${{ matrix.assembly }}
          path: Artifacts/MasterTests/**
          if-no-files-found: ignore
