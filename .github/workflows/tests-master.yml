name: Tests (master — full suite)

# Every behavior-changing merge to master runs every EditMode test assembly. Human
# approval PRs only move already-tested evidence from pending to closed and are ignored.
# Pull requests run the EditMode assemblies their changes can affect (see tests-pr.yml).
#
# EditMode assemblies are discovered from the project asmdef graph instead of being
# duplicated in this workflow. That keeps newly added module-local EditMode suites,
# including renderer parity tests, inside the master code-level gate automatically.
#
# Automatic PlayMode suites are intentionally disabled. The standalone player-build
# path is the repository-wide high-level validation; ticket-specific PlayMode evidence
# remains available through targeted/manual validation when explicitly required.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'SceneIssues/pending/**'
      - 'SceneIssues/closed/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Select every EditMode test assembly
        id: select
        shell: bash
        run: |
          set -euo pipefail
          EDIT_ARGS="$(tools/select-tests.py --all --format unity-args --platform EditMode)"
          EDIT_NAMES="${EDIT_ARGS#-assemblyNames }"
          echo "editmode_names=$EDIT_NAMES" >> "$GITHUB_OUTPUT"
          echo "EditMode assemblies: ${EDIT_NAMES:-<none>}"
          echo "Automatic PlayMode suites: disabled"

      - name: EditMode tests in one Unity editor
        if: steps.select.outputs.editmode_names != ''
        shell: bash
        env:
          VOXEL_CI_EDITMODE_ASSEMBLIES: ${{ steps.select.outputs.editmode_names }}
          VOXEL_CI_PLAYMODE_ASSEMBLIES: ''
          VOXEL_CI_RESULTS_ROOT: ${{ github.workspace }}/Artifacts/MasterTests
          VOXEL_CI_BAKE_SHOWCASE: 'false'
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/MasterTests"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=20480 UNITY_MAX_MINUTES=40 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelCiPersistentTestRunner.Run \
            -logFile "$ROOT/persistent.log"
          test -s "$ROOT/persistent-summary.txt"
          grep -q '^status=passed$' "$ROOT/persistent-summary.txt"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-test-results
          path: Artifacts/MasterTests/**
          if-no-files-found: ignore
