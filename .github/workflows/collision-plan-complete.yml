name: Mark Collision cutover complete
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md'); s=p.read_text()
          reps={
            '**Current focus:** Cutover 9 Collision — final Api/Runtime ownership cutover':'**Current focus:** Cutover 10 Vegetation — final Api/Runtime ownership cutover',
            '| 9 — Collision | **In progress — current** | raycast/sweep/hull physical-storage dependency removed; pool-slot hit leak removed; parity accepted | final Collision.Api/Runtime file + namespace move |':'| 9 — Collision | **Complete** | `Collision.Api`/`Collision.Runtime` replace the broad assembly; DDA/raycast/sweep/hull implementation lives in Runtime with preserved Unity GUIDs; Runtime consumes Storage.Api only; final caller inventory found no production subsystem consumer, so Api remains intentionally empty instead of inventing DTOs | none |',
            '| 10 — Vegetation | **Partial dependency cleanup** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api | full Vegetation.Api/Runtime cutover |':'| 10 — Vegetation | **In progress — current** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api | full Vegetation.Api/Runtime cutover |',
            '- Latest accepted code gate: `9a3702d4a7e5127a3573a5aaa185c9fced344e63` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Cutover 8 Streaming: `Streaming.Api`/`Streaming.Runtime` replace the broad assembly; all four implementation files moved with Unity GUIDs preserved; `RegionLoadRequest` + `IRegionStreaming` are the real application contract; `RegionStreamingService` hides Storage residency; Runtime has no Net or foreign Runtime reference. The additional passing test is the new no-network instantiation guard.':'- Latest accepted code gate: `2ed342aef7ed05d2d7bc67a8d88460b23e9e693d` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Cutover 9 Collision: all four current collision algorithms are physically under `Collision/Runtime` with preserved Unity GUIDs; broad Collision assembly/namespace is gone; Runtime consumes Storage.Api and no foreign Runtime; final caller inventory found no production subsystem consumer, so `Collision.Api` is deliberately empty rather than inventing unused query/result DTOs.',
            'Create Api query/result values:\n\n```text\nCollision/Api/VoxelRaycastQuery.cs\nCollision/Api/VoxelRaycastHit.cs\nCollision/Api/VoxelSweepQuery.cs\nCollision/Api/VoxelSweepResult.cs\nCollision/Api/HullExportRequest.cs   (only if called outside Collision)\nCollision/Api/HullExportResult.cs    (only if called outside Collision)\n```\n\nCollision.Runtime performs DDA/sweep/hull work against Storage.Api readonly native views. The DDA and storage representation are implementation details.':'Final caller inventory found no production engine subsystem caller of Collision. Showcase and tests exercise the implementation directly, so `VoxelEngine.Collision.Api` exists as the deliberate subsystem contract assembly but is intentionally empty today. Do not invent raycast/sweep/hull DTOs until a real foreign subsystem requires them.\n\nCollision.Runtime performs DDA/sweep/hull work against Storage.Api readonly native views. The DDA and storage representation are implementation details.\n\n### Implementation progress\n\n- [x] `Collision.Api`/`Collision.Runtime` created; `DdaTraversal`, `HullExport`, `SweptAabb`, and `VoxelRaycast` moved to Runtime with original Unity GUIDs and Runtime namespaces.\n- [x] Broad `VoxelEngine.Collision` assembly/namespace removed; Showcase and implementation tests reference Runtime directly; no engine production subsystem references Collision.Runtime.\n- [x] Final caller inventory found no production API consumer, so Collision.Api remains intentionally empty rather than adding speculative request/result types.\n- [x] Collision Api/Runtime cutover accepted by CI at `2ed342aef7ed05d2d7bc67a8d88460b23e9e693d`: 383 total / 370 passed / exact same 13 known baseline failures.\n\nCollision.Runtime performs DDA/sweep/hull work against Storage.Api readonly native views. The DDA and storage representation are implementation details.',
            '- [x] raycast/sweep/hull parity tests pass.':'- [x] raycast/sweep/hull parity tests pass;\n- [x] Collision.Runtime has no foreign Runtime dependency and no production subsystem consumes it.',
            '### 9. Collision\n\n- [ ] create Collision.Api/Runtime\n- [ ] move DDA/raycast/sweep/hull implementation\n- [ ] consume Storage.Api readonly views':'### 9. Collision\n\n- [x] create Collision.Api/Runtime\n- [x] move DDA/raycast/sweep/hull implementation\n- [x] consume Storage.Api readonly views\n- [x] resolve public Collision Api from real consumers — none exist today, so do not invent DTOs',
          }
          for old,new in reps.items():
              if old not in s: raise SystemExit('missing expected plan text:\n'+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/collision-plan-complete.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Mark Collision cutover complete'
          git push origin HEAD:${{ github.ref_name }}
