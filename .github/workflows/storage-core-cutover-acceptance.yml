name: Storage Runtime and Core deletion acceptance
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0027e6a64f137763b994d304eac9621071e1ea3d
          fetch-depth: 1
      - name: Verify Storage owner and Core deletion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          core = Path('Assets/VoxelEngine/Core')
          if core.exists() or Path('Assets/VoxelEngine/Core.meta').exists():
              raise SystemExit('Core folder/meta still exists')

          runtime = Path('Assets/VoxelEngine/Storage/Runtime/VoxelEngine.Storage.Runtime.asmdef')
          if not runtime.is_file():
              raise SystemExit('Storage.Runtime asmdef missing')
          data = json.loads(runtime.read_text())
          if data.get('name') != 'VoxelEngine.Storage.Runtime':
              raise SystemExit('Storage Runtime assembly has wrong name')
          engine_refs = {r for r in data.get('references', []) if r.startswith('VoxelEngine.')}
          expected = {'VoxelEngine.Foundation', 'VoxelEngine.Storage.Api'}
          if engine_refs != expected:
              raise SystemExit('Storage.Runtime engine refs differ from final set: ' + ', '.join(sorted(engine_refs)))

          asm_core = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.asmdef'):
                  obj = json.loads(path.read_text())
                  if obj.get('name') == 'VoxelEngine.Core' or 'VoxelEngine.Core' in obj.get('references', []):
                      asm_core.append(str(path))
          if asm_core:
              raise SystemExit('VoxelEngine.Core assembly/name refs remain:\n' + '\n'.join(asm_core))

          ns_core = []
          import_core = []
          namespace_re = re.compile(r'^\s*namespace\s+VoxelEngine\.Core(?:\.|\b)', re.M)
          using_re = re.compile(r'^\s*using\s+VoxelEngine\.Core(?:\.|\s*;)', re.M)
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  text = path.read_text()
                  if namespace_re.search(text):
                      ns_core.append(str(path))
                  if using_re.search(text):
                      import_core.append(str(path))
          if ns_core:
              raise SystemExit('source namespace begins VoxelEngine.Core:\n' + '\n'.join(ns_core))
          if import_core:
              raise SystemExit('source still imports VoxelEngine.Core:\n' + '\n'.join(import_core))

          foreign_runtime = []
          for path in Path('Assets/VoxelEngine').rglob('*.asmdef'):
              obj = json.loads(path.read_text())
              name = obj.get('name', '')
              if name.endswith('.Runtime') and name != 'VoxelEngine.Storage.Runtime' and 'VoxelEngine.Storage.Runtime' in obj.get('references', []):
                  foreign_runtime.append(name)
          if foreign_runtime:
              raise SystemExit('engine Runtime assemblies reference Storage.Runtime: ' + ', '.join(foreign_runtime))

          residual = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  if 'VoxelEngine.Core' in path.read_text():
                      residual.append(str(path))
          print('Storage/Core static acceptance passed')
          print('Residual literal Core guard/history refs to clean before final zero-text gate:', len(residual))
          for path in residual:
              print('  ', path)
          PY

  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0027e6a64f137763b994d304eac9621071e1ea3d
          clean: false
          fetch-depth: 1
      - name: Reset pinned Storage/Core candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 0027e6a64f137763b994d304eac9621071e1ea3d
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/StorageCoreCutover"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-core-cutover-0027e6a6
          path: Artifacts/StorageCoreCutover/
          if-no-files-found: warn
          retention-days: 14
