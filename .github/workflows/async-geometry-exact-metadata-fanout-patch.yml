name: Async geometry exact metadata fanout patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-exact-metadata-fanout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded metadata fanout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          jobs_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/ExactSnapshotMetadataJobs.cs')

          cache = cache_path.read_text()
          replacements = [
              (
                  '            JobHandle dependency = new ExactBrickMetadataClearJob\n',
                  '            JobHandle clearHandle = new ExactBrickMetadataClearJob\n'
              ),
              (
                  '            }.Schedule(BrickCacheCount, 256);\n\n            int edge = VoxelReadGrid.BlocksPerRegionEdge;\n',
                  '            }.Schedule(BrickCacheCount, 256);\n'
                  '            JobHandle regionDependency = default;\n'
                  '            bool hasRegionDependency = false;\n\n'
                  '            int edge = VoxelReadGrid.BlocksPerRegionEdge;\n'
              ),
              (
                  '                dependency = new ExactBrickMetadataRegionJob\n',
                  '                JobHandle regionHandle = new ExactBrickMetadataRegionJob\n'
              ),
              (
                  '                }.Schedule(volume, 128, dependency);\n',
                  '                }.Schedule(volume, 128, clearHandle);\n'
                  '                regionDependency = hasRegionDependency\n'
                  '                    ? JobHandle.CombineDependencies(regionDependency, regionHandle)\n'
                  '                    : regionHandle;\n'
                  '                hasRegionDependency = true;\n'
              ),
              (
                  '            _exactMetadataJobHandle = new ExactMixedBrickCompactJob\n',
                  '            JobHandle dependency = hasRegionDependency ? regionDependency : clearHandle;\n'
                  '            _exactMetadataJobHandle = new ExactMixedBrickCompactJob\n'
              ),
          ]
          for old, new in replacements:
              if cache.count(old) != 1:
                  raise SystemExit(f'expected one cache anchor, got {cache.count(old)}: {old!r}')
              cache = cache.replace(old, new, 1)
          cache_path.write_text(cache)

          jobs = jobs_path.read_text()
          old = '    /// exact brick cache. Region jobs are chained sequentially; each writes a disjoint intersection\n    /// and therefore never contends with another region. Encoded refs may be authoritatively\n'
          new = '    /// exact brick cache. Region jobs fan out from one shared clear dependency; each writes a\n    /// disjoint intersection, and the owner combines all region handles before compaction.\n    /// Encoded refs may be authoritatively\n'
          if jobs.count(old) != 1:
              raise SystemExit('metadata job comment anchor not found exactly once')
          jobs_path.write_text(jobs.replace(old, new, 1))
          PY
      - name: Static guards
        shell: bash
        run: |
          grep -q 'Schedule(volume, 128, clearHandle)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'CombineDependencies(regionDependency, regionHandle)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          ! grep -q 'Schedule(volume, 128, dependency)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'Region jobs fan out from one shared clear dependency' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/ExactSnapshotMetadataJobs.cs
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/async-geometry-exact-metadata-fanout-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fan out exact metadata region jobs'
          git push origin HEAD:refactor/async-geometry-pipeline
