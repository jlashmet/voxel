name: Patch final CSharp allowlist once

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths:
      - ".github/workflows/patch-final-csharp-allowlist-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Remove retired workflow from permanent CSharp allowlist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 12); do
            git fetch origin refactor/system-boundaries-finalization-stable
            git checkout -B csharp-allowlist-fix origin/refactor/system-boundaries-finalization-stable

            python3 - <<'PY'
          from pathlib import Path
          path = Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs')
          text = path.read_text()
          stale = '                ".github/workflows/final-architecture-static.yml",\n'
          if stale in text:
              text = text.replace(stale, '', 1)
              path.write_text(text)
          elif '".github/workflows/stable-final-architecture-acceptance.yml"' not in text:
              raise SystemExit('permanent legacy-literal allowlist not found')
          PY

            git add Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs
            if git diff --cached --quiet; then
              echo "Permanent CSharp allowlist already correct"
              exit 0
            fi
            git commit -m "test(architecture): remove retired static guard allowlist entry"
            if git push origin HEAD:refactor/system-boundaries-finalization-stable; then
              exit 0
            fi
            sleep 1
          done
          exit 1
