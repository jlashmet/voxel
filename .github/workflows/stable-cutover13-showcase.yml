name: Stable Cutover 13 Showcase ownership

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/stable-cutover13-showcase.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move validated Showcase runtime owners into Composition
        shell: bash
        run: |
          set -euo pipefail
          branch=refactor/system-boundaries-finalization-stable
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

          src=Assets/Scenes/Showcase
          dst=Assets/VoxelEngine/Composition/Showcase
          mkdir -p "$dst"

          for file in ShowcaseWorld.cs ShowcaseWorld.StorageBridge.cs ShowcaseCatalogue.cs ShowcaseHeightJob.cs FarFieldStructureStore.cs ArchLookdev.cs; do
            test -f "$src/$file"
            git mv "$src/$file" "$dst/$file"
            if test -f "$src/$file.meta"; then
              git mv "$src/$file.meta" "$dst/$file.meta"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import json

          world = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs')
          text = world.read_text()
          old = 'GpuDebrisSystem.RenderInstancesPerChunk'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 scene debris-capacity references, found {count}')
          text = text.replace(old, 'RenderSamplesPerDetachedChunk')
          anchor = 'private const int FallingChunkEdge = 8;'
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one FallingChunkEdge anchor')
          text = text.replace(anchor, 'private const int RenderSamplesPerDetachedChunk = 16;\n        ' + anchor, 1)
          text = text.replace(
              'Nothing here is engine code; it is a caller of the engine, in its own assembly.',
              'This application-level world orchestration lives in Composition, the sole assembly allowed to own concrete subsystem runtimes.')
          world.write_text(text)

          bridge = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.StorageBridge.cs')
          b = bridge.read_text()
          b = b.replace(
              'Application-level logical storage bridge for Showcase collaborators. This partial keeps\n    /// networking/presentation adapters on Storage.Api vocabulary while the main ShowcaseWorld\n    /// still owns the transitional concrete storage implementation.',
              'Application-level logical storage bridge for Showcase collaborators. The concrete\n    /// storage implementation is Composition-owned while networking/presentation adapters stay\n    /// on Storage.Api vocabulary.')
          bridge.write_text(b)

          showcase = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          data = json.loads(showcase.read_text())
          data['references'] = [r for r in data['references']
                                if not (r.startswith('VoxelEngine.') and r.endswith('.Runtime'))]
          showcase.write_text(json.dumps(data, indent=2) + '\n')
          PY

          # The stable branch starts from the accepted f503 light-runtime cleanup.
          if grep -RInE --include='*.cs' 'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime' Assets/Scenes/Showcase; then
            echo 'scene-side Showcase still references a concrete Runtime namespace' >&2
            exit 1
          fi
          if grep -RIn 'GpuDebrisSystem' Assets/VoxelEngine/Composition/Showcase; then
            echo 'Composition-owned world still references scene-side GPU presentation' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          asm = json.loads(Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef').read_text())
          bad = [r for r in asm.get('references', []) if r.startswith('VoxelEngine.') and r.endswith('.Runtime')]
          if bad:
              raise SystemExit(f'Showcase asmdef still references Runtime assemblies: {bad}')
          PY

          git rm .github/workflows/stable-cutover13-showcase.yml
          if test -f .github/workflows/cutover13-showcase-composition-finalize.yml; then
            git rm .github/workflows/cutover13-showcase-composition-finalize.yml
          fi
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(showcase): centralize runtime ownership in Composition'

          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:"$branch"
