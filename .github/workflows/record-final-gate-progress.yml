name: Record final gate diagnosis

on:
  push:
    branches: [refactor/system-boundaries-finalization-clean]
    paths: [.github/workflows/record-final-gate-progress.yml]

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-clean
          fetch-depth: 0
      - name: Record failed acceptance and correction without closing final validation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-clean
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = path.read_text()
          anchor = '- Latest accepted final static closure:'
          entry = (
              '- Final Unity closeout attempt `31910555570` at source `d5d2831e6784450a8b0c686c32b27d9f8e6af80c` '
              'correctly remained unaccepted: Unity exposed `ShowcaseWorld.ProfileBlocks` as concrete '
              '`Structures.Runtime.ProfileBlockStore`, producing CS0012 in `VoxelShowcase.cs` before the suite could run. '
              'The boundary was clean-fixed at `1bee021e0bc89f770018c7baee311a18049e3de2` to expose '
              '`IProfileBlockReadSource`; corrected candidate `d47fdab909ff66479b6f1eddc1d9905c7591d550`, run '
              '`31910843194`, has passed the strengthened final static ownership check and still awaits the self-hosted Unity job.\n'
          )
          if entry not in text:
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('Final static closure anchor not found')
              end = text.find('\n', pos)
              text = text[:end + 1] + entry + text[end + 1:]
          if '- [ ] final targeted/full-available validation' not in text:
              raise SystemExit('Final validation must remain unchecked until Unity parity passes')
          path.write_text(text)
          PY

          git diff --check
          git rm .github/workflows/record-final-gate-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs(architecture): record final Unity gate diagnosis'
          git pull --rebase origin refactor/system-boundaries-finalization-clean
          git push origin HEAD:refactor/system-boundaries-finalization-clean
