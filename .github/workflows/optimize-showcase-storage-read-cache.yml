name: Optimize Showcase Storage API read cache

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/optimize-showcase-storage-read-cache.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Cache zero-copy region reads across voxel loops
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 <<'PY'
          from pathlib import Path
          path = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs')
          text = path.read_text()

          fields_marker = '''        private readonly RegionResidencyStore _residencyStore;\n        private FeatureCatalogue _catalogue;'''
          fields = '''        private readonly RegionResidencyStore _residencyStore;\n\n        // Borrow one Storage.Api region view across tight collapse/connectivity scans. Reacquire\n        // only when the scan crosses a region or the logical storage version changes; this keeps\n        // the clean API boundary without reintroducing a sparse-table lookup per voxel.\n        private RegionReadView _cachedReadView;\n        private int3 _cachedReadRegion;\n        private ulong _cachedReadVersion;\n        private bool _hasCachedReadView;\n\n        private FeatureCatalogue _catalogue;'''
          if '_hasCachedReadView' not in text:
              if text.count(fields_marker) != 1:
                  raise SystemExit('read-cache field marker drifted')
              text = text.replace(fields_marker, fields, 1)

          old = '''        private bool TryReadCellApi(int3 voxel, out VoxelCell cell) =>\n            _readSource.TryRead(voxel, out cell);\n\n        private byte ReadMaterialApi(int3 voxel) =>'''
          new = '''        private bool TryReadCellApi(int3 voxel, out VoxelCell cell)\n        {\n            int3 regionCoord = voxel >> VoxelGrid.RegionVoxelEdgeLog2;\n            ulong version = _readSource.Version;\n\n            if (!_hasCachedReadView\n                || !math.all(regionCoord == _cachedReadRegion)\n                || version != _cachedReadVersion)\n            {\n                if (!_readSource.TryAcquireRegion(regionCoord, out _cachedReadView))\n                {\n                    _hasCachedReadView = false;\n                    cell = default;\n                    return false;\n                }\n\n                _cachedReadRegion = regionCoord;\n                _cachedReadVersion = version;\n                _hasCachedReadView = true;\n            }\n\n            int3 localVoxel = voxel - (regionCoord << VoxelGrid.RegionVoxelEdgeLog2);\n            return _cachedReadView.TryReadCell(localVoxel, out cell);\n        }\n\n        private byte ReadMaterialApi(int3 voxel) =>'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'private bool TryReadCellApi(int3 voxel, out VoxelCell cell)\n        {' not in text:
              raise SystemExit('TryReadCellApi marker drifted')

          if '_readSource.TryRead(voxel, out cell)' in text:
              raise SystemExit('per-voxel RegionReadSource.TryRead still present')
          path.write_text(text)
          PY

          git diff --check
          rm .github/workflows/optimize-showcase-storage-read-cache.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs \
                  .github/workflows/optimize-showcase-storage-read-cache.yml
          git commit -m 'perf(showcase): cache Storage API region reads'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
