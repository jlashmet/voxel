name: Record Rendering Cutover 12 acceptance
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/record-rendering-cutover12-acceptance.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()

          replacements = [
              ('**Current focus:** Cutover 12 Rendering — behavioral parity acceptance\n',
               '**Current focus:** Cutover 13 Composition/Core deletion — final ownership and Core dissolution\n'),
              ('| 12 — Rendering | **In progress — current** | render bridge/surface extraction use Storage.Api read views; retained profiles use Storage.Api; vegetation presentation uses Vegetation.Api; dead physical leaks removed; Rendering Api/Runtime physical + namespace + asmdef cutover accepted by static gate | final 384/371/13 behavioral parity gate |',
               '| 12 — Rendering | **Complete** | Rendering Api/Runtime physical + namespace cutover complete; Runtime consumes Storage.Api/Tiering.Api/Vegetation.Api only; retained profiles/catalogues/change feed are read-only API views; dead physical leaks removed; final 384/371/13 behavioral parity accepted | none |'),
              ('| 13 — Composition/Core deletion | **Not started** | — | composition root, final wiring, delete Core |',
               '| 13 — Composition/Core deletion | **In progress — current** | — | composition root, final wiring, delete Core |'),
              ('- [ ] targeted GPU/CPU surface and rendering parity tests pass;',
               '- [x] targeted GPU/CPU surface and rendering parity tests pass; isolated behavioral acceptance run `31894170304` produced 384 total / 371 passed / exact 13 known baseline failures;'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one plan seam, found {text.count(old)}: {old[:100]}')
              text = text.replace(old, new, 1)

          marker = '- [x] Rendering catalogue/change-feed consumers and tooling use Storage.Api read-facing views; Rendering.Runtime no longer references `VoxelEngine.Core`.\n'
          addition = marker + '- [x] Final Rendering behavioral acceptance: source `f5e0b646102a50305424850a0508d190bae3e44d`, isolated run `31894170304`, artifact `rendering-cutover12-f5e0b646` — 384 total / 371 passed / exact 13 known baseline failures.\n'
          if text.count(marker) != 1:
              raise SystemExit('Rendering progress marker did not match current plan')
          text = text.replace(marker, addition, 1)

          old = '- Latest accepted code gate: `de24d20ce48e9665f4ab7ab78343e7354601eab0` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated Rendering cleanup run `31892956307` produced a complete `results.xml`; its failed-name set matches the accepted 384-test baseline exactly. This gate accepts removal of the unused/physical-storage-leaking `ProbeCache` and `VoxelGpuBuffers` implementations before the Rendering Api/Runtime split.\n'
          new = '- Latest accepted code gate: `f5e0b646102a50305424850a0508d190bae3e44d` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated Rendering acceptance run `31894170304` produced a complete `results.xml`; the failed-name set matches the accepted baseline exactly. This closes Cutover 12.\n'
          if text.count(old) != 1:
              raise SystemExit('latest accepted code gate seam did not match current plan')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          git rm .github/workflows/record-rendering-cutover12-acceptance.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark Rendering Cutover 12 complete'
          git push origin HEAD:${{ github.ref_name }}
