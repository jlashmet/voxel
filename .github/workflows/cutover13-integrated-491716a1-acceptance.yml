name: Cutover 13 integrated 491716a1 acceptance

on:
  push:
    paths:
      - .github/workflows/cutover13-integrated-491716a1-acceptance.yml

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 491716a1d0cf0dcd94e1f462b142768f762b6df4
          fetch-depth: 1
      - name: Verify integrated boundary state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('Assets/Scenes/Showcase')
          pat=re.compile(r'using\s+(VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*)\s*;')
          files=[]
          for p in sorted(root.rglob('*.cs')):
              hits=sorted(set(pat.findall(p.read_text(errors='ignore'))))
              if hits: files.append((p,hits))
          print('Runtime-coupled Showcase files:',len(files))
          for p,h in files: print(p,'=>',', '.join(h))
          if len(files) != 7:
              raise SystemExit(f'Expected 7 remaining Runtime-coupled Showcase files, got {len(files)}')
          storage=[p for p,_ in files if 'using VoxelEngine.Storage.Runtime;' in p.read_text(errors='ignore')]
          if storage != [Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')]:
              raise SystemExit(f'Unexpected Storage.Runtime Showcase owners: {storage}')
          for name in ['TerrainLookdev.ForegroundContrast.cs','TerrainLookdev.TonalMap.cs','TerrainLookdev.VegetatedCap.cs']:
              text=(root/name).read_text()
              if 'VoxelEngine.Structures.Runtime' in text:
                  raise SystemExit(f'Stale Structures.Runtime import remains in {name}')
          for p in [Path('Assets/Tests/PlayMode/FallingVoxelPhysicsTests.cs'),
                    Path('Assets/Tests/PlayMode/ShowcaseSpawnTests.cs'),
                    Path('Assets/Tests/PlayMode/CastleAccessTests.cs'),
                    Path('Assets/Tests/PlayMode/CastleScreenshotTests.cs')]:
              t=p.read_text()
              if 'world.Table' in t or 'world.Pool' in t:
                  raise SystemExit(f'Physical ShowcaseWorld test escape hatch remains: {p}')
          if 'public RegionTable Table' in (root/'ShowcaseWorld.cs').read_text() or 'public BrickPool Pool' in (root/'ShowcaseWorld.cs').read_text():
              raise SystemExit('ShowcaseWorld physical storage escape hatch restored')
          if not Path('Assets/VoxelEngine/Structures/Api/IStructureAuthoringSession.cs').exists():
              raise SystemExit('Structures.Api authoring session missing')
          if not Path('Assets/VoxelEngine/Structures/Runtime/StructureAuthoringSession.cs').exists():
              raise SystemExit('Structures.Runtime authoring adapter missing')
          legacy='VoxelEngine.' + 'Core'
          offenders=[]
          for base in [Path('Assets'),Path('Packages'),Path('docs')]:
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.cs','.asmdef','.md','.json'}:
                      try: text=p.read_text(errors='ignore')
                      except OSError: continue
                      if legacy in text: offenders.append(str(p))
          if offenders:
              raise SystemExit('Legacy Core literals remain: '+', '.join(offenders[:20]))
          PY

  editmode:
    runs-on: [self-hosted, macOS, unity]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 491716a1d0cf0dcd94e1f462b142768f762b6df4
          fetch-depth: 1
      - name: Run Unity EditMode suite
        shell: bash
        run: |
          ./tools/unity-run.sh -projectPath "$PWD" -batchmode -nographics -runTests -testPlatform EditMode -testResults "$PWD/results.xml" -quit || true
          test -f "$PWD/results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutover13-integrated-491716a1-results
          path: results.xml
