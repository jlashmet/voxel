name: Fix Rendering split architecture guards
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-split-guard-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs')
          text = p.read_text()
          old = '''                    if (!reference.EndsWith(".Runtime", StringComparison.Ordinal))
                        continue;

                    if (!string.Equals(reference, asmdef.Name, StringComparison.Ordinal))'''
          new = '''                    if (!reference.EndsWith(".Runtime", StringComparison.Ordinal))
                        continue;
                    if (!reference.StartsWith("VoxelEngine.", StringComparison.Ordinal))
                        continue;

                    if (!string.Equals(reference, asmdef.Name, StringComparison.Ordinal))'''
          if text.count(old) != 1:
              raise SystemExit('runtime-reference guard shape changed')
          text = text.replace(old, new, 1)
          old = 'string renderingRoot = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Rendering");'
          new = 'string renderingRoot = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Rendering", "Runtime");'
          if text.count(old) != 1:
              raise SystemExit('Rendering read-path root guard shape changed')
          p.write_text(text.replace(old, new, 1))

          p = Path('Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs')
          text = p.read_text()
          old = '"Assets/VoxelEngine/Rendering/Shaders/SmoothSurface.shader"'
          new = '"Assets/VoxelEngine/Rendering/Runtime/Shaders/SmoothSurface.shader"'
          if text.count(old) != 1:
              raise SystemExit('surface shader guard path changed')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/rendering-split-guard-fix.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git add -u .github/workflows
          git commit -m 'test: follow Rendering Api Runtime split'
          git push origin HEAD:${{ github.ref_name }}
