name: Record accepted StructuralIntegrity connectivity slice
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          old="| 6 — StructuralIntegrity | **In progress — current** | dead Net `StructuralGraph` removed; StructuralIntegrity.Api/Runtime assemblies created; `SupportField` and `CollapseDetection` moved to Runtime with preserved Unity GUIDs and Storage.Api-only reads; parity preserved | move `Connectivity` behind Storage.Api; expose only result/request values required by real consumers; finish network-facing Api wiring if a real consumer exists |"
          new="| 6 — StructuralIntegrity | **In progress — current** | dead Net `StructuralGraph` removed; StructuralIntegrity.Api/Runtime assemblies created; `SupportField`, `CollapseDetection`, and `Connectivity` all live in Runtime with preserved Unity GUIDs and Storage.Api-only reads; `Core/Structure` is gone; parity preserved | finish final real-consumer inventory; expose only structural Api result/request values actually required; confirm any network-facing structural behavior is Api-only |"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- Latest accepted code gate: `dbaa43648cb47008a55f27bbd692157e752cd8be` — 382 tests, 369 passed, exactly the same 13 known baseline failures. Accepted StructuralIntegrity support/collapse slice: StructuralIntegrity.Api/Runtime assemblies exist; `SupportField` and `CollapseDetection` are physically under Runtime with their Unity GUIDs preserved; both read through Storage.Api logical region views; the old Core copies are deleted; StructuralIntegrity.Runtime has no Net dependency."
          new="- Latest accepted code gate: `c07ef2f318a015f7e5dc1952eeeb82d16fd81612` — 382 tests, 369 passed, exactly the same 13 known baseline failures. Accepted StructuralIntegrity algorithm cutover: `SupportField`, `CollapseDetection`, and `Connectivity` are physically under StructuralIntegrity.Runtime with their Unity GUIDs preserved; all read through Storage.Api logical region views; `Core/Structure` no longer exists; StructuralIntegrity.Runtime has no Net dependency."
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [x] create Api/Runtime\n- [ ] move collapse/connectivity/support algorithms\n- [x] move StructuralGraph out of Net\n- [ ] expose structural result domain values"
          new="- [x] create Api/Runtime\n- [x] move collapse/connectivity/support algorithms\n- [x] move StructuralGraph out of Net\n- [ ] expose structural result domain values"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [ ] `Connectivity` still remains under `Core/Structure`; the combined algorithm-move task stays open until it is moved and gated."
          new="- [x] `Connectivity` moved to StructuralIntegrity.Runtime with its original Unity GUID; deterministic 6-neighbor component analysis now consumes Storage.Api `IRegionReadSource`/`RegionReadView`, and the old Core copy is deleted.\n- [x] Connectivity/final algorithm-move slice accepted by CI at `c07ef2f318a015f7e5dc1952eeeb82d16fd81612`: 382 total / 369 passed / exact same 13 known baseline failures; `Core/Structure` is gone."
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [ ] collapse/connectivity/support tests pass;"
          new="- [x] collapse/connectivity/support tests pass;"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/mark-structural-connectivity-accepted.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted StructuralIntegrity connectivity slice'
          git push origin HEAD:${{ github.ref_name }}
