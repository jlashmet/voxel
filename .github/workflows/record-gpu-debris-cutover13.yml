name: Record GpuDebris Cutover 13 acceptance
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/record-gpu-debris-cutover13.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Record accepted GpuDebris slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          old_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, and network presentation storage seams are Storage.Api-only; empty Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          new_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, and GpuDebris storage seams are Storage.Api-only; empty Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          if old_row not in s:
              if 'GpuDebris storage seams are Storage.Api-only' not in s:
                  raise SystemExit('Cutover 13 status row changed unexpectedly')
          else:
              s = s.replace(old_row, new_row, 1)
          old_gate = '- Latest accepted code gate: `b7c23caaee6447c2746c101d66f89b4092682c00` — 386 tests, 373 passed, exactly the same 13 known baseline failures. Showcase network Storage API run `31896650921` accepts removal of Storage.Runtime/physical types from `ShowcaseNetworkWorldBridge` and the API-only `ShowcaseWorld.StorageBridge` partial.'
          new_gate = '- Latest accepted code gate: `ec5aa7c2950528afb90faab0437cc263cd355759` — 386 tests, 373 passed, exactly the same 13 known baseline failures. GpuDebris Storage API run `31897300218` accepts removal of its stale Storage.Runtime dependency; the failed-test-name set exactly matches the prior accepted baseline.'
          if old_gate in s:
              s = s.replace(old_gate, new_gate, 1)
          elif 'Latest accepted code gate: `ec5aa7c2950528afb90faab0437cc263cd355759`' not in s:
              raise SystemExit('Latest accepted gate line changed unexpectedly')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          if git diff --cached --quiet; then
            echo 'Plan already recorded.'
            exit 0
          fi
          git commit -m 'docs(architecture): record GpuDebris API acceptance'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
