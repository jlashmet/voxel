name: World Art Kit Visual

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/world-art-kit-lookdev

jobs:
  capture-world-art:
    name: Render storybook voxel ruin
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Render deterministic world art scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/WorldArtKit"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.WorldArtKitCapture.Run \
            -logFile "$GITHUB_WORKSPACE/Artifacts/WorldArtKit/unity.log" \
            -quit

          test -s "$GITHUB_WORKSPACE/Artifacts/WorldArtKit/world-art-ruin.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/WorldArtKit/world-art-ruin.txt"

      - name: Show lookdev metadata
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/WorldArtKit/world-art-ruin.txt" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/WorldArtKit/world-art-ruin.txt"
          fi

      - name: Upload world-art artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-art-kit-${{ github.sha }}
          path: Artifacts/WorldArtKit/
          if-no-files-found: warn
          retention-days: 14
