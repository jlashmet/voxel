name: One-shot SceneIssue 014011 mixed field parity oracle

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-mixed-field-oracle.yml

permissions:
  contents: write

jobs:
  oracle:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 0

      - name: Add verification-only mixed field readback oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Expose the two sampled semantic buffers that already exist; these methods are oracle-only
          # readbacks, adjacent to the existing density/material verification methods.
          extractor = Path('Assets/VoxelEngine/Rendering/Runtime/GpuVoxel/GpuSurfaceExtractor.cs')
          text = extractor.read_text()
          marker = '''        public void ReadSampleMaterials(uint[] materials)\n        {\n            GeometryReadbacks++;\n            _sampleMaterial.GetData(materials);\n        }\n'''
          addition = marker + '''\n        public void ReadSampleSurfaces(uint[] surfaces)\n        {\n            GeometryReadbacks++;\n            _sampleSurface.GetData(surfaces);\n        }\n\n        public void ReadSampleBoundaries(uint[] boundaries)\n        {\n            GeometryReadbacks++;\n            _sampleBoundary.GetData(boundaries);\n        }\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one sample-material readback marker, found {text.count(marker)}')
          extractor.write_text(text.replace(marker, addition, 1))

          # Add a verification snapshot that runs the real CPU density job over the same mixed-brick
          # neighbourhood representation used by CpuTopologyOracle.
          oracle = Path('Assets/VoxelEngine/Rendering/Runtime/GpuVoxel/CpuDensityOracle.cs')
          text = oracle.read_text()
          class_marker = '''    public static class CpuDensityOracle\n    {\n'''
          snapshot_struct = '''    public readonly struct CpuDensityFieldSnapshot\n    {\n        public readonly float[] Density;\n        public readonly byte[] Materials;\n        public readonly uint[] Surfaces;\n        public readonly byte[] Boundaries;\n\n        public CpuDensityFieldSnapshot(float[] density, byte[] materials, uint[] surfaces, byte[] boundaries)\n        {\n            Density = density;\n            Materials = materials;\n            Surfaces = surfaces;\n            Boundaries = boundaries;\n        }\n    }\n\n'''
          if text.count(class_marker) != 1:
              raise SystemExit('CpuDensityOracle class marker changed')
          text = text.replace(class_marker, snapshot_struct + class_marker, 1)

          method_marker = '''        /// <summary>\n        /// Evaluates the sample at world voxel zero in a synthetic horizontal material stack.\n'''
          method = '''        public static CpuDensityFieldSnapshot SampleMixedNeighbourhood(\n            int3 chunkOriginVoxel, int3 brickCacheOrigin, int brickCacheEdge,\n            int cellsPerAxis, int padding, int sourceStep,\n            byte[] brickKinds, byte[] brickUniformMaterials,\n            byte[] mixedVoxels, ushort[] mixedSurfaceSemantics, byte[] mixedBoundarySamples,\n            in SurfaceCatalogueView surfaces, in CoatingCatalogueView coatings,\n            in MaterialPaletteView palette)\n        {\n            int gridSize = cellsPerAxis + padding * 2 + 1;\n            int samples = gridSize * gridSize * gridSize;\n            int brickCount = brickCacheEdge * brickCacheEdge * brickCacheEdge;\n\n            var bricks = new NativeArray<TransvoxelDensityBrick>(brickCount, Allocator.TempJob);\n            var payloadVoxels = new NativeArray<byte>(\n                mixedVoxels is { Length: > 0 } ? mixedVoxels.Length : 1, Allocator.TempJob);\n            var payloadSemantics = new NativeArray<ushort>(\n                mixedSurfaceSemantics is { Length: > 0 } ? mixedSurfaceSemantics.Length : 1,\n                Allocator.TempJob);\n            var payloadBoundary = new NativeArray<byte>(\n                mixedBoundarySamples is { Length: > 0 } ? mixedBoundarySamples.Length : 1,\n                Allocator.TempJob);\n            var density = new NativeArray<float>(samples, Allocator.TempJob);\n            var materials = new NativeArray<byte>(samples, Allocator.TempJob);\n            var semantics = new NativeArray<uint>(samples, Allocator.TempJob);\n            var boundaries = new NativeArray<byte>(samples, Allocator.TempJob);\n\n            try\n            {\n                if (mixedVoxels is { Length: > 0 }) payloadVoxels.CopyFrom(mixedVoxels);\n                if (mixedSurfaceSemantics is { Length: > 0 })\n                    payloadSemantics.CopyFrom(mixedSurfaceSemantics);\n                if (mixedBoundarySamples is { Length: > 0 })\n                    payloadBoundary.CopyFrom(mixedBoundarySamples);\n\n                for (int i = 0; i < brickCount; i++)\n                {\n                    byte kind = brickKinds[i];\n                    bricks[i] = new TransvoxelDensityBrick\n                    {\n                        Kind = kind,\n                        UniformMaterial = brickUniformMaterials[i],\n                        MixedOffset = 0,\n                    };\n                }\n\n                var job = BuildJob(\n                    bricks, payloadVoxels, payloadSemantics, payloadBoundary,\n                    density, materials, semantics, boundaries,\n                    chunkOriginVoxel, brickCacheOrigin, brickCacheEdge,\n                    gridSize, padding, sourceStep, surfaces, coatings, palette);\n                for (int i = 0; i < samples; i++) job.Execute(i);\n\n                return new CpuDensityFieldSnapshot(\n                    density.ToArray(), materials.ToArray(), semantics.ToArray(), boundaries.ToArray());\n            }\n            finally\n            {\n                bricks.Dispose();\n                payloadVoxels.Dispose();\n                payloadSemantics.Dispose();\n                payloadBoundary.Dispose();\n                density.Dispose();\n                materials.Dispose();\n                semantics.Dispose();\n                boundaries.Dispose();\n            }\n        }\n\n'''
          if text.count(method_marker) != 1:
              raise SystemExit('SampleLayeredColumnAtOrigin marker changed')
          oracle.write_text(text.replace(method_marker, method + method_marker, 1))

          # Add a focused test using the exact same mixed fixture as the topology oracle, but stop at
          # the sampled field so the failing subsystem is unambiguous.
          tests = Path('Assets/Tests/EditMode/GpuSurfaceExtractorOracleTests.cs')
          text = tests.read_text()
          insert_marker = '''        [TestCase(1)]\n        [TestCase(2)]\n        public void MixedBricksWithAuthoredBoundariesAndCoatingsMatchTheCpu(int sourceStep)\n'''
          test_method = '''        [TestCase(1)]\n        [TestCase(2)]\n        public void MixedSampleFieldMatchesTheCpuJob(int sourceStep)\n        {\n            const int perBrick = 512;\n            var voxels = new byte[perBrick];\n            var semantics = new ushort[perBrick];\n            var boundary = new byte[perBrick];\n            for (int z = 0; z < 8; z++)\n            for (int y = 0; y < 8; y++)\n            for (int x = 0; x < 8; x++)\n            {\n                int i = x + 8 * (y + 8 * z);\n                voxels[i] = (byte)(y < 4 ? 1 : 0);\n                semantics[i] = (ushort)(((x + z) & 1) == 0 ? SurfaceStyles.Smooth\n                                                           : SurfaceStyles.Rounded);\n                boundary[i] = y == 3\n                    ? VoxelBoundarySample.FromSignedQ4(6, extrusionAxis: 1).Packed\n                    : (byte)0;\n            }\n\n            using var mirror = new GpuVoxelBrickMirror(slotCapacity: 8);\n            using var tables = GpuTransvoxelTables.CreateDefault();\n            using var extractor = new GpuSurfaceExtractor(_shader, CellsPerAxis, Padding);\n            SurfaceCatalogueView surfaces = SurfaceCatalogueView.CreateBuiltIns();\n            CoatingCatalogueView coatings = default;\n            MaterialPaletteView palette = default;\n            var defaultStyles = new uint[256];\n            for (int i = 0; i < 256; i++)\n                defaultStyles[i] = palette.GetDefaultSurfaceStyle((byte)i);\n            extractor.SetCatalogues(surfaces, coatings, defaultStyles);\n\n            var nativeVoxels = new Unity.Collections.NativeArray<byte>(\n                voxels, Unity.Collections.Allocator.Temp);\n            var nativeSemantics = new Unity.Collections.NativeArray<ushort>(\n                semantics, Unity.Collections.Allocator.Temp);\n            var nativeBoundary = new Unity.Collections.NativeArray<byte>(\n                boundary, Unity.Collections.Allocator.Temp);\n            const int capacity = 65536;\n            var vertices = new ComputeBuffer(capacity, GpuSurfaceExtractor.ReadbackVertex.Stride,\n                                             ComputeBufferType.Structured);\n            var indices = new ComputeBuffer(capacity, sizeof(uint), ComputeBufferType.Structured);\n            try\n            {\n                var delta = VoxelBrickDelta.MixedAt(int3.zero, 1, 0);\n                Assert.AreEqual(GpuBrickPublish.Uploaded,\n                    mirror.Publish(delta, nativeVoxels, nativeSemantics, nativeBoundary, 0, true));\n                Assert.IsTrue(mirror.TryGetSlot(int3.zero, out int slot));\n\n                int edge = extractor.BrickCacheEdge;\n                int3 brickCacheOrigin = new int3(-1, -1, -1);\n                var kinds = new byte[edge * edge * edge];\n                var uniforms = new byte[edge * edge * edge];\n                extractor.ClearBrickCache();\n                uint mixedEntry = GpuSurfaceExtractor.PackBrickCacheEntry(\n                    VoxelBrickContent.Mixed, 0, slot);\n                for (int z = 0; z < edge; z++)\n                for (int y = 0; y < edge; y++)\n                for (int x = 0; x < edge; x++)\n                {\n                    int i = x + edge * (y + edge * z);\n                    extractor.SetBrickCacheEntry(new int3(x, y, z), mixedEntry);\n                    kinds[i] = 2;\n                }\n\n                extractor.Extract(mirror, tables, int3.zero, brickCacheOrigin, sourceStep, 0.1f,\n                                  vertices, indices, capacity, capacity);\n                int sampleCount = extractor.GridSize * extractor.GridSize * extractor.GridSize;\n                var gpuDensity = new float[sampleCount];\n                var gpuMaterials = new uint[sampleCount];\n                var gpuSurfaces = new uint[sampleCount];\n                var gpuBoundaries = new uint[sampleCount];\n                extractor.ReadDensity(gpuDensity);\n                extractor.ReadSampleMaterials(gpuMaterials);\n                extractor.ReadSampleSurfaces(gpuSurfaces);\n                extractor.ReadSampleBoundaries(gpuBoundaries);\n\n                CpuDensityFieldSnapshot cpu = CpuDensityOracle.SampleMixedNeighbourhood(\n                    int3.zero, brickCacheOrigin, edge, CellsPerAxis, Padding, sourceStep,\n                    kinds, uniforms, voxels, semantics, boundary, surfaces, coatings, palette);\n\n                int densityMismatch = 0, materialMismatch = 0, surfaceMismatch = 0, boundaryMismatch = 0;\n                int firstDensity = -1, firstMaterial = -1, firstSurface = -1, firstBoundary = -1;\n                for (int i = 0; i < sampleCount; i++)\n                {\n                    if (Mathf.Abs(cpu.Density[i] - gpuDensity[i]) > 1e-4f)\n                    {\n                        densityMismatch++;\n                        if (firstDensity < 0) firstDensity = i;\n                    }\n                    if (cpu.Materials[i] != (byte)gpuMaterials[i])\n                    {\n                        materialMismatch++;\n                        if (firstMaterial < 0) firstMaterial = i;\n                    }\n                    if (cpu.Surfaces[i] != gpuSurfaces[i])\n                    {\n                        surfaceMismatch++;\n                        if (firstSurface < 0) firstSurface = i;\n                    }\n                    if (cpu.Boundaries[i] != (byte)gpuBoundaries[i])\n                    {\n                        boundaryMismatch++;\n                        if (firstBoundary < 0) firstBoundary = i;\n                    }\n                }\n\n                Assert.AreEqual(0, densityMismatch + materialMismatch + surfaceMismatch + boundaryMismatch,\n                    $"SourceStep {sourceStep}: density {densityMismatch} (first {firstDensity}), "\n                  + $"material {materialMismatch} (first {firstMaterial}), "\n                  + $"surface {surfaceMismatch} (first {firstSurface}), "\n                  + $"boundary {boundaryMismatch} (first {firstBoundary}).");\n            }\n            finally\n            {\n                nativeVoxels.Dispose();\n                nativeSemantics.Dispose();\n                nativeBoundary.Dispose();\n                vertices.Release();\n                indices.Release();\n            }\n        }\n\n'''
          if text.count(insert_marker) != 1:
              raise SystemExit(f'expected one mixed topology marker, found {text.count(insert_marker)}')
          tests.write_text(text.replace(insert_marker, test_method + insert_marker, 1))
          PY

          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/GpuVoxel/GpuSurfaceExtractor.cs \
                  Assets/VoxelEngine/Rendering/Runtime/GpuVoxel/CpuDensityOracle.cs \
                  Assets/Tests/EditMode/GpuSurfaceExtractorOracleTests.cs
          git commit -m 'SceneIssue 014011: add mixed field GPU oracle'
          git push origin HEAD:fixes

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run mixed field oracle with graphics
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.EditMode.GpuSurfaceExtractorOracleTests.MixedSampleFieldMatchesTheCpuJob
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue014011MixedFieldOracle"
          OUT="$GITHUB_WORKSPACE/SceneIssues/20260823-014011-920-VoxelShowcase/notes-mixed-field-oracle.txt"
          mkdir -p "$ROOT" "$(dirname "$OUT")"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || status=$?

          {
            echo "status=$status"
            echo "filter=$TEST_FILTER"
            echo
            if [[ -s "$ROOT/results.xml" ]]; then
              python3 - "$ROOT/results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//test-case')
          print(f'Executed {len(cases)} test case(s).')
          for case in cases:
              name = case.get('fullname') or case.get('name') or '<unknown>'
              result = case.get('result')
              print(f'{result}: {name}')
              if result not in ('Passed', 'Success'):
                  failure = case.find('failure')
                  if failure is not None:
                      print((failure.findtext('message') or '').strip())
                      print((failure.findtext('stack-trace') or '').strip())
          PY
            else
              echo 'No results.xml produced.'
            fi
            echo
            echo '=== UNITY LOG TAIL ==='
            tail -220 "$ROOT/unity.log" 2>/dev/null || true
          } | tee "$OUT"
          printf '%s\n' "$status" > "$ROOT/status.txt"

      - name: Commit oracle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=SceneIssues/20260823-014011-920-VoxelShowcase/notes-mixed-field-oracle.txt
          test -s "$OUT"
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'SceneIssue 014011: record mixed field oracle result'
            git push origin HEAD:fixes
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sceneissue-014011-mixed-field-oracle-${{ github.run_id }}
          path: Artifacts/SceneIssue014011MixedFieldOracle/**
          if-no-files-found: ignore
          retention-days: 1

      - name: Preserve oracle status
        if: always()
        shell: bash
        run: |
          status="$(cat Artifacts/SceneIssue014011MixedFieldOracle/status.txt 2>/dev/null || echo 1)"
          exit "$status"
