name: Sunlit Cleric robe multiview build

on:
  push:
    branches: [feature/character-weapon-asset-pipeline]
    paths:
      - 'tools/character-factory/production/sunlit-cleric/prepare_robe_views.py'
      - '.github/workflows/sunlit-cleric-robe-multiview-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunlit-cleric-robe-multiview-build
  cancel-in-progress: true

jobs:
  build-modular-robe:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
      PYTHONUNBUFFERED: '1'
      REVIEW_DIR: docs/lookdev/characters/sunlit-cleric/robe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/Applications/Blender.app/Contents/MacOS/Blender"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Bootstrap cached Hunyuan multiview backend
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          HUNYUAN_REV="f8db63096c8282cb27354314d896feba5ba6ff8a"
          CACHE_ROOT="${CHARACTER_FACTORY_CACHE_ROOT:-$HOME/Library/Caches/voxel-character-factory}"
          HUNYUAN_PY="$CACHE_ROOT/hunyuan3d-2-$HUNYUAN_REV-venv/bin/python"
          MODEL_ROOT="${HY3DGEN_MODELS:-$CACHE_ROOT/models}"
          export HY3DGEN_MODELS="$MODEL_ROOT"
          export HF_XET_HIGH_PERFORMANCE="${HF_XET_HIGH_PERFORMANCE:-1}"

          chmod +x tools/character-factory/ci/bootstrap_hunyuan_macos.sh
          tools/character-factory/ci/bootstrap_hunyuan_macos.sh
          test -x "$HUNYUAN_PY"

          "$HUNYUAN_PY" - <<'PY'
          from pathlib import Path
          import os
          from huggingface_hub import snapshot_download

          repo_id = 'tencent/Hunyuan3D-2mv'
          root = Path(os.environ['HY3DGEN_MODELS']).expanduser()
          repo_root = root / repo_id
          dit = repo_root / 'hunyuan3d-dit-v2-mv-turbo'
          required = (dit / 'config.yaml', dit / 'model.fp16.safetensors')
          if not all(path.is_file() and path.stat().st_size > 0 for path in required):
              snapshot_download(
                  repo_id=repo_id,
                  allow_patterns=[
                      'hunyuan3d-dit-v2-mv-turbo/**',
                      'hunyuan3d-vae-v2-mv/**',
                      'hunyuan3d-vae-v2/**',
                  ],
                  local_dir=str(repo_root),
              )
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise RuntimeError('multiview model cache incomplete: ' + ', '.join(missing))
          PY

          echo "HUNYUAN_PY=$HUNYUAN_PY" >> "$GITHUB_ENV"
          echo "HY3DGEN_MODELS=$MODEL_ROOT" >> "$GITHUB_ENV"

      - name: Isolate robe and cape from all four clean views
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericRobe"
          ROBE_VIEWS="$OUT/views"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          "$HUNYUAN_PY" tools/character-factory/production/sunlit-cleric/prepare_robe_views.py \
            --views "$GITHUB_WORKSPACE/tools/character-factory/production/sunlit-cleric/views" \
            --output "$ROBE_VIEWS"
          for view in front back left right; do
            test -s "$ROBE_VIEWS/$view.png"
          done

      - name: Create canonical body and garment donor
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericRobe"
          CANONICAL="$OUT/canonical_female_with_garment_donor.glb"
          BODY_RENDER="$OUT/canonical_body.input.png"
          GARMENT_RENDER="$OUT/canonical_garment_donor.input.png"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/create_canonical_character_fixture.py -- \
            --canonical "$CANONICAL" \
            --input "$BODY_RENDER" \
            --garment-input "$GARMENT_RENDER"
          test -s "$CANONICAL"
          echo "CLERIC_ROBE_CANONICAL=$CANONICAL" >> "$GITHUB_ENV"

      - name: Reconstruct separate skinned robe
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericRobe"
          ROBE_VIEWS="$OUT/views"
          SPEC="$RUNNER_TEMP/sunlit-cleric-robe-multiview.json"
          cat > "$SPEC" <<JSON
          {
            "id": "sunlit_cleric_robe_01",
            "assetType": "clothing",
            "views": {
              "front": "$ROBE_VIEWS/front.png",
              "back": "$ROBE_VIEWS/back.png",
              "left": "$ROBE_VIEWS/left.png",
              "right": "$ROBE_VIEWS/right.png"
            },
            "outputDir": "$OUT",
            "generator": {
              "python": "$HUNYUAN_PY",
              "backend": "hunyuan-pytorch",
              "preset": "quality",
              "model": "tencent/Hunyuan3D-2mv",
              "subfolder": "hunyuan3d-dit-v2-mv-turbo",
              "device": "auto",
              "seed": 24680,
              "steps": 5,
              "octreeResolution": 256,
              "numChunks": 16000,
              "removeBackground": false,
              "enableFlashVdm": false
            },
            "rig": {
              "blender": "$BLENDER_BIN",
              "canonicalBody": "$CLERIC_ROBE_CANONICAL",
              "bodyObject": "GarmentDonor",
              "armatureObject": "Armature",
              "maxTransferDistance": 0.60
            },
            "runtimePart": {
              "slot": "Torso",
              "socketBoneName": null,
              "socketLocalPosition": [0, 0, 0],
              "socketLocalEulerAngles": [0, 0, 0],
              "socketLocalScale": [1, 1, 1]
            }
          }
          JSON
          python3 tools/character-factory/character_factory.py build "$SPEC"
          test -s "$OUT/sunlit_cleric_robe_01.fbx"
          test -s "$OUT/manifest.json"

      - name: Project robe source colors and preserve independent skinning
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericRobe"
          ROBE_VIEWS="$OUT/views"
          BASE="$OUT/sunlit_cleric_robe_01.fbx"
          TEXTURED="$OUT/sunlit_cleric_robe_01.textured.fbx"
          ATLAS="$OUT/sunlit_cleric_robe_01.multiview_basecolor.png"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/runtime/blender_texture_rigged_character.py -- \
            --input "$BASE" \
            --output "$TEXTURED" \
            --front "$ROBE_VIEWS/front.png" \
            --back "$ROBE_VIEWS/back.png" \
            --left "$ROBE_VIEWS/left.png" \
            --right "$ROBE_VIEWS/right.png" \
            --atlas "$ATLAS"
          test -s "$TEXTURED"
          test -s "$ATLAS"
          mv "$BASE" "$OUT/sunlit_cleric_robe_01.geometry_only.fbx"
          mv "$TEXTURED" "$BASE"

      - name: Verify and render modular robe
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericRobe"
          FBX="$OUT/sunlit_cleric_robe_01.fbx"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$FBX"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$FBX" \
            --output "$OUT/sunlit_cleric_robe_01.preview.png" \
            --preserve-materials

      - name: Upload modular robe artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunlit-cleric-modular-robe
          path: Artifacts/SunlitClericRobe/
          if-no-files-found: error
          retention-days: 14

      - name: Publish robe review
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericRobe"
          mkdir -p "$REVIEW_DIR"
          cp "$OUT/sunlit_cleric_robe_01.preview.png" "$REVIEW_DIR/"
          cp "$OUT/views/front.png" "$REVIEW_DIR/robe_front_conditioning.png"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR"
          if git diff --cached --quiet; then
            echo 'Latest robe review is already published.'
            exit 0
          fi
          git commit -m 'docs(characters): publish modular cleric robe review [robe-review]'
          git push origin HEAD:feature/character-weapon-asset-pipeline
