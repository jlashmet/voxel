name: Record final Rendering Cutover 12 acceptance
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/record-rendering-final-cutover12.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Close Rendering Cutover 12 in implementation plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()

          replacements = {
              '**Current focus:** Cutover 12 Rendering — behavioral parity acceptance':
                  '**Current focus:** Cutover 13 Composition/Core deletion — inventory and final wiring',
              '| 12 — Rendering | **In progress — current** | render bridge/surface extraction use Storage.Api read views; retained profiles use Storage.Api; vegetation presentation uses Vegetation.Api; dead physical leaks removed; Rendering Api/Runtime physical + namespace + asmdef cutover accepted by static gate | final 384/371/13 behavioral parity gate |':
                  '| 12 — Rendering | **Complete** | Rendering.Api/Runtime physical + namespace + asmdef cutover complete; Runtime consumes Storage.Api/Tiering.Api/Vegetation.Api only; simulation runtimes do not reference Rendering; tooling/tests migrated to read-facing catalogue views; final 384/371/13 behavioral baseline accepted | none |',
              '- Latest accepted code gate: `de24d20ce48e9665f4ab7ab78343e7354601eab0` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated Rendering cleanup run `31892956307` produced a complete `results.xml`; its failed-name set matches the accepted 384-test baseline exactly. This gate accepts removal of the unused/physical-storage-leaking `ProbeCache` and `VoxelGpuBuffers` implementations before the Rendering Api/Runtime split.':
                  '- Latest accepted code gate: `f5e0b646102a50305424850a0508d190bae3e44d` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated Rendering Cutover 12 run `31894170304` produced a complete `results.xml`; its failed-name set matches accepted Rendering baseline run `31892956307` exactly. Cutover 12 is accepted.',
              '- [ ] targeted GPU/CPU surface and rendering parity tests pass;':
                  '- [x] targeted GPU/CPU surface and rendering parity tests pass against the established baseline; final isolated acceptance run `31894170304` on source `f5e0b646102a50305424850a0508d190bae3e44d` produced 384 total / 371 passed / exact 13 known baseline failures;'
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one plan marker: {old}')
              text = text.replace(old, new, 1)

          marker = '- [x] Rendering catalogue/change-feed consumers and tooling use Storage.Api read-facing views; Rendering.Runtime no longer references `VoxelEngine.Core`.\n'
          addition = marker + '- [x] Final Rendering Cutover 12 accepted at `f5e0b646102a50305424850a0508d190bae3e44d`: isolated run `31894170304` returned 384 total / 371 passed / exact same 13 failed-test names as accepted baseline run `31892956307`.\n'
          if text.count(marker) != 1:
              raise SystemExit('Rendering progress marker did not match')
          text = text.replace(marker, addition, 1)

          p.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git rm .github/workflows/record-rendering-final-cutover12.yml
          git commit -m 'docs: close accepted Rendering Cutover 12'
          git push origin HEAD:${{ github.ref_name }}
