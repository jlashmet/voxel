name: Force cancel stale Net validation
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/force-cancel-stale-net.yml]
permissions:
  actions: write
jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/31891579740/force-cancel" >/dev/null
