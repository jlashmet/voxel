name: Region revision transaction coherence one-shot fix

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-region-revision-transaction-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded fix
        run: python3 .github/scripts/async_geometry_region_revision_transaction_fix.py
      - name: Static guards
        run: |
          grep -q 'publishedPhysicalRef' Assets/VoxelEngine/Storage/Runtime/RegionMutationStore.cs
          grep -q '_table.CommitRegion(in writable)' Assets/VoxelEngine/Storage/Runtime/RegionMutationStore.cs
          grep -q 'BorrowedMutationInvalidatesPinnedRegionRevisionAtMaterialization' Assets/Tests/EditMode/StorageRenderingReadContractTests.cs
      - name: Commit coherence fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Storage/Runtime/RegionMutationStore.cs \
                  Assets/Tests/EditMode/StorageRenderingReadContractTests.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Advance region revision when borrowed mutation publishes BrickRef'
          git push origin HEAD:refactor/async-geometry-pipeline
