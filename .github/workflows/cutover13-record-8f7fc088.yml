name: Cutover 13 record 8f7fc088 acceptance

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-record-8f7fc088.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Record accepted Cutover 13 batch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = path.read_text()

          old_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, GpuDebris, VoxelShowcase and ShowcaseMultiplayerSession storage seams are API-only; ShowcaseCatalogue consumes Structures.Api only; mixed-brick capacity and lookdev renderer configuration are Composition-owned; CompactFps consumes Rendering.Api diagnostics; TerrainLookdev physical storage adapter construction is consolidated in its owner; empty Tools shells deleted; 387/374/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          new_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, GpuDebris, VoxelShowcase and ShowcaseMultiplayerSession storage seams are API-only; ShowcaseCatalogue consumes Structures.Api only; mixed-brick capacity and lookdev renderer configuration are Composition-owned; CompactFps consumes Rendering.Api diagnostics; Structures authoring routes through an Api session; VoxelFarTerrain and TerrainLookdev are Runtime-free through subsystem-specific RenderingComposition; TerrainLookdev dead profile-store ceremony removed; empty Tools shells deleted; current Showcase Runtime-coupled source inventory reduced to five files; 387/374/13 baseline preserved | migrate five remaining Showcase concrete Runtime consumers, enable the final production-wide Runtime dependency guard, remove residual Core documentation literals, final dependency report |'
          if old_row not in text:
              raise SystemExit('Cutover 13 status row did not match expected accepted state')
          text = text.replace(old_row, new_row, 1)

          old_gate = '- Latest accepted code gate: `4a5b486ca0fb238bf59b7b4b8f65e636d57746e7` — 387 tests, 374 passed, exactly the same 13 known baseline failures. Showcase multiplayer Storage.Api run `31900276764` accepts replacement of physical `VoxelDimensions` constants with logical `VoxelReadGrid` / `VoxelGrid` API constants; `ShowcaseMultiplayerSession` no longer imports Storage.Runtime.'
          new_gate = '- Latest accepted code gate: `8f7fc088445388059864615d6d5c31a72dcfa722`, run `31904955615` — 387 tests, 374 passed, exactly the same 13 known baseline failures. This accepts the Structures.Api authoring-session migration and stale `ref` repair, VoxelFarTerrain presentation routing through RenderingComposition, TerrainLookdev renderer/world routing through RenderingComposition, deletion of its unused empty `ProfileBlockStore`, and the reduction to five Runtime-coupled Showcase source files.'
          if old_gate not in text:
              raise SystemExit('latest accepted gate line did not match expected state')
          text = text.replace(old_gate, new_gate, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md

      - name: Commit plan evidence
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs(architecture): record 8f7 Cutover 13 acceptance'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
