name: SceneIssue 014011 visual comparison artifact

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-image-artifact.yml

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1
      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/sceneissue-014011-images',
              description: 'Exporting SceneIssue comparison images',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Stage comparison images
        shell: bash
        run: |
          set -euo pipefail
          ISSUE='SceneIssues/20260823-014011-920-VoxelShowcase'
          mkdir -p Artifacts/SceneIssue014011Comparison
          cp "$ISSUE/screenshot-001.png" Artifacts/SceneIssue014011Comparison/original.png
          cp "$ISSUE/verification-lod2-attempt2.png" Artifacts/SceneIssue014011Comparison/attempt2.png
          cp "$ISSUE/verification-lod2-attempt3.png" Artifacts/SceneIssue014011Comparison/attempt3.png
      - name: Upload comparison images
        uses: actions/upload-artifact@v4
        with:
          name: sceneissue-014011-comparison
          path: Artifacts/SceneIssue014011Comparison/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'ci/sceneissue-014011-images',
              description: 'SceneIssue comparison images exported',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
