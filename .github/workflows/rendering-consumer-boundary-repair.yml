name: Rendering consumer boundary repair
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-consumer-boundary-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 - <<'PY'
          from pathlib import Path

          showcase = Path('Assets/Scenes/Showcase/ShowcaseNetworkWorldBridge.cs')
          text = showcase.read_text()
          old = 'using VoxelEngine.Core.Storage;\n'
          new = 'using VoxelEngine.Core.Storage;\nusing VoxelEngine.Storage.Api;\n'
          if text.count(old) != 1 or 'using VoxelEngine.Storage.Api;' in text:
              raise SystemExit('ShowcaseNetworkWorldBridge import seam changed')
          showcase.write_text(text.replace(old, new, 1))

          test = Path('Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs')
          text = test.read_text()
          aliases = '''using CoreSurfaceCompatibility = VoxelEngine.Core.Storage.SurfaceCompatibility;\nusing CoreSurfaceReconstruction = VoxelEngine.Core.Storage.SurfaceReconstruction;\nusing CoreSurfaceDecorationShape = VoxelEngine.Core.Storage.SurfaceDecorationShape;\n'''
          marker = 'using VoxelEngine.Core.Storage;\n'
          if aliases not in text:
              if text.count(marker) != 1:
                  raise SystemExit('VoxelSurfaceArchitectureTests Core.Storage import seam changed')
              text = text.replace(marker, marker + aliases, 1)

          replacements = {
              'Assert.AreEqual(SurfaceCompatibility.Seam, ab.Compatibility);':
                  'Assert.AreEqual(CoreSurfaceCompatibility.Seam, ab.Compatibility);',
              'Assert.AreEqual(SurfaceReconstruction.Sharp, missing.Reconstruction);':
                  'Assert.AreEqual(CoreSurfaceReconstruction.Sharp, missing.Reconstruction);',
              'Assert.AreEqual(SurfaceReconstruction.Planar, masonry.Reconstruction);':
                  'Assert.AreEqual(CoreSurfaceReconstruction.Planar, masonry.Reconstruction);',
              'StableId = 1, Reconstruction = SurfaceReconstruction.Smooth,':
                  'StableId = 1, Reconstruction = CoreSurfaceReconstruction.Smooth,',
              'StableId = 2, Reconstruction = SurfaceReconstruction.Planar,':
                  'StableId = 2, Reconstruction = CoreSurfaceReconstruction.Planar,',
              'Assert.AreEqual(SurfaceDecorationShape.Clump, builtInMoss.DecorationShape);':
                  'Assert.AreEqual(CoreSurfaceDecorationShape.Clump, builtInMoss.DecorationShape);',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'expected test seam not found: {old}')

          old = '''                SurfaceCatalogue surfaces = SurfaceCatalogue.CreateBuiltIns();\n                CoatingCatalogue coatings = CoatingCatalogue.CreateBuiltIns();\n                cache.Prepare(new RegionReadSource(in table, in pool), in palette, in surfaces, in coatings, store,\n                              cameraObject.AddComponent<UnityEngine.Camera>(), 0.1f, 0, 0.0);'''
          new = '''                SurfaceCatalogue surfaces = SurfaceCatalogue.CreateBuiltIns();\n                CoatingCatalogue coatings = CoatingCatalogue.CreateBuiltIns();\n                MaterialPaletteView paletteView = palette;\n                SurfaceCatalogueView surfaceView = surfaces;\n                CoatingCatalogueView coatingView = coatings;\n                cache.Prepare(new RegionReadSource(in table, in pool), in paletteView, in surfaceView, in coatingView, store,\n                              cameraObject.AddComponent<UnityEngine.Camera>(), 0.1f, 0, 0.0);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('profile-block cache Prepare seam changed')

          old = '''                CoatingCatalogue coatings = CoatingCatalogue.CreateBuiltIns();\n                Assert.AreNotEqual(cache.ActiveSurfaceCatalogueHash, custom.CatalogueHash);\n\n                cache.Prepare(new RegionReadSource(in table, in pool), in palette, in custom, in coatings, null,\n                              cameraObject.AddComponent<UnityEngine.Camera>(), 0.1f, 0, 0.0);'''
          new = '''                CoatingCatalogue coatings = CoatingCatalogue.CreateBuiltIns();\n                Assert.AreNotEqual(cache.ActiveSurfaceCatalogueHash, custom.CatalogueHash);\n                MaterialPaletteView paletteView = palette;\n                SurfaceCatalogueView surfaceView = custom;\n                CoatingCatalogueView coatingView = coatings;\n\n                cache.Prepare(new RegionReadSource(in table, in pool), in paletteView, in surfaceView, in coatingView, null,\n                              cameraObject.AddComponent<UnityEngine.Camera>(), 0.1f, 0, 0.0);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('catalogue-input cache Prepare seam changed')

          forbidden = [
              'Assert.AreEqual(SurfaceCompatibility.Seam, ab.Compatibility);',
              'Assert.AreEqual(SurfaceReconstruction.Sharp, missing.Reconstruction);',
              'cache.Prepare(new RegionReadSource(in table, in pool), in palette, in surfaces, in coatings, store,',
              'cache.Prepare(new RegionReadSource(in table, in pool), in palette, in custom, in coatings, null,',
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'stale consumer seam remains: {value}')
          test.write_text(text)
          PY
          git rm .github/workflows/rendering-consumer-boundary-repair.yml
          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseNetworkWorldBridge.cs Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git add -u .github/workflows
          git commit -m 'Migrate Rendering consumers to Storage API views'
          git push origin HEAD:${{ github.ref_name }}
