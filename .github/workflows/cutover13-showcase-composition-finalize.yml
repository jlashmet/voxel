name: Cutover 13 finalize Showcase Composition ownership

on:
  push:
    branches:
      - refactor/system-boundaries-finalization
    paths:
      - .github/workflows/cutover13-showcase-composition-finalize.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization
          fetch-depth: 0

      - name: Move world orchestration into Composition
        shell: bash
        run: |
          set -euo pipefail

          src=Assets/Scenes/Showcase
          dst=Assets/VoxelEngine/Composition/Showcase
          mkdir -p "$dst"

          for file in ShowcaseWorld.cs ShowcaseWorld.StorageBridge.cs ShowcaseCatalogue.cs ShowcaseHeightJob.cs; do
            test -f "$src/$file"
            git mv "$src/$file" "$dst/$file"
            if test -f "$src/$file.meta"; then
              git mv "$src/$file.meta" "$dst/$file.meta"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          import json

          world = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.cs')
          text = world.read_text()
          old = 'public readonly List<FallingVoxel> Samples = new(GpuDebrisSystem.RenderInstancesPerChunk);'
          if old not in text:
              raise SystemExit('expected GpuDebrisSystem sample-capacity reference not found')
          text = text.replace(
              old,
              'public readonly List<FallingVoxel> Samples = new(RenderSamplesPerDetachedChunk);',
              1)
          anchor = 'private const int FallingChunkEdge = 8;'
          if anchor not in text:
              raise SystemExit('expected FallingChunkEdge anchor not found')
          text = text.replace(
              anchor,
              'private const int RenderSamplesPerDetachedChunk = 16;\n        ' + anchor,
              1)
          text = text.replace(
              'Nothing here is engine code; it is a caller of the engine, in its own assembly.',
              'This application-level world orchestration lives in Composition, the sole assembly allowed to own concrete subsystem runtimes.')
          world.write_text(text)

          bridge = Path('Assets/VoxelEngine/Composition/Showcase/ShowcaseWorld.StorageBridge.cs')
          b = bridge.read_text()
          b = b.replace(
              'Application-level logical storage bridge for Showcase collaborators. This partial keeps\n    /// networking/presentation adapters on Storage.Api vocabulary while the main ShowcaseWorld\n    /// still owns the transitional concrete storage implementation.',
              'Application-level logical storage bridge for Showcase collaborators. The concrete\n    /// storage implementation is Composition-owned while networking/presentation adapters stay\n    /// on Storage.Api vocabulary.')
          bridge.write_text(b)

          composition = Path('Assets/VoxelEngine/Composition/VoxelEngine.Composition.asmdef')
          c = json.loads(composition.read_text())
          refs = c['references']
          for ref in ('VoxelEngine.Streaming.Runtime', 'VoxelEngine.Terrain.Runtime'):
              if ref not in refs:
                  refs.append(ref)
          composition.write_text(json.dumps(c, indent=2) + '\n')

          showcase = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          s = json.loads(showcase.read_text())
          s['references'] = [
              ref for ref in s['references']
              if not (ref.startswith('VoxelEngine.') and ref.endswith('.Runtime'))
          ]
          showcase.write_text(json.dumps(s, indent=2) + '\n')
          PY

      - name: Enforce scene-side Runtime-free Showcase boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.cs' 'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime' Assets/Scenes/Showcase; then
            echo 'Showcase C# still references a concrete Runtime namespace' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          asm = json.loads(Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef').read_text())
          bad = [r for r in asm.get('references', []) if r.startswith('VoxelEngine.') and r.endswith('.Runtime')]
          if bad:
              raise SystemExit(f'Showcase asmdef still references Runtime assemblies: {bad}')
          PY
          if grep -RIn 'GpuDebrisSystem' Assets/VoxelEngine/Composition/Showcase; then
            echo 'Composition-owned Showcase world still references scene-side GPU presentation' >&2
            exit 1
          fi
          git diff --check

      - name: Publish cutover
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No Showcase Composition cutover changes to publish' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(showcase): centralize runtime wiring in Composition'
          git push origin HEAD:refactor/system-boundaries-finalization
