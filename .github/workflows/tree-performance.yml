name: Tree Performance Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - tree-gpu-lod

concurrency:
  group: tree-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree-performance:
    name: Benchmark procedural tree scaling
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          test -x "$UNITY_PATH"
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run tree scaling benchmark
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.CI.TreePerformanceBenchmarkTests.TreeScaling_ProducesBenchmarkArtifact" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/tree-benchmark.csv"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/tree-benchmark.txt"

      - name: Show benchmark metadata
        if: always()
        shell: bash
        run: |
          test ! -f "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/tree-benchmark.txt" || cat "$GITHUB_WORKSPACE/Artifacts/TreeBenchmark/tree-benchmark.txt"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-benchmark-${{ github.sha }}
          path: Artifacts/TreeBenchmark/
          if-no-files-found: warn
          retention-days: 14
