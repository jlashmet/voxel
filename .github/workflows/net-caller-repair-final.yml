name: Net caller migration final
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-caller-repair-final.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          counts = {'drain':0, 'apply':0, 'server':0, 'processor':0}

          def save(path, original, text):
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          for path in Path('Assets/Tests/EditMode').glob('*.cs'):
              original = path.read_text()
              text = original

              def drain(m):
                  counts['drain'] += 1
                  target, table, pool = m.group(1), m.group(2), m.group(3)
                  return (f'{target}(new RegionMutationStore(in {table}, in {pool}), '
                          f'new RegionReadSource(in {table}, in {pool}), out ')
              text = re.sub(
                  r'(\b[A-Za-z_][\w.]*\.DrainReady)\(\s*ref ([A-Za-z_]\w*),\s*ref ([A-Za-z_]\w*),\s*out ',
                  drain, text)

              def apply_ready(m):
                  counts['apply'] += 1
                  target, table, pool = m.group(1), m.group(2), m.group(3)
                  return (f'{target}(new RegionMutationStore(in {table}, in {pool}), '
                          f'new RegionReadSource(in {table}, in {pool}), '
                          f'new RegionSnapshotMutationStore(in {table}, in {pool}), out ')
              text = re.sub(
                  r'(\b[A-Za-z_][\w.]*\.ApplyReadyAuthoritativeEvents)\(\s*ref ([A-Za-z_]\w*),\s*ref ([A-Za-z_]\w*),\s*out ',
                  apply_ready, text)

              def server_tick(m):
                  counts['server'] += 1
                  prefix, table, pool, zones = m.group(1), m.group(2), m.group(3), m.group(4)
                  return (f'{prefix}new RegionReadSource(in {table}, in {pool}), '
                          f'new RegionMutationStore(in {table}, in {pool}), '
                          f'new RegionReadSource(in {table}, in {pool}), in {zones},')
              text = re.sub(
                  r'(\b[A-Za-z_][\w.]*\.ProcessAuthoritativeTick\(\s*[^,\n]+,\s*)ref ([A-Za-z_]\w*),\s*ref ([A-Za-z_]\w*),\s*in ([A-Za-z_]\w*),',
                  server_tick, text)

              def processor_tick(m):
                  counts['processor'] += 1
                  prefix, table, pool, zones = m.group(1), m.group(2), m.group(3), m.group(4)
                  return (f'{prefix}new RegionReadSource(in {table}, in {pool}), '
                          f'new RegionMutationStore(in {table}, in {pool}), in {zones},')
              text = re.sub(
                  r'(\b[A-Za-z_][\w.]*\.ProcessTick\(\s*[^,\n]+,\s*)ref ([A-Za-z_]\w*),\s*ref ([A-Za-z_]\w*),\s*in ([A-Za-z_]\w*),',
                  processor_tick, text)
              save(path, original, text)

          world = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          original = world.read_text(); text = original
          if 'private readonly RegionSnapshotMutationStore _snapshotMutationStore;' not in text:
              seam = '        private readonly RegionMutationStore _mutationStore;\n'
              if seam not in text: raise SystemExit('ShowcaseWorld mutation-store field seam missing')
              text = text.replace(seam, seam + '        private readonly RegionSnapshotMutationStore _snapshotMutationStore;\n', 1)
          if '_snapshotMutationStore = new RegionSnapshotMutationStore(in _table, in _pool);' not in text:
              seam = '            _mutationStore = new RegionMutationStore(in _table, in _pool);\n'
              if seam not in text: raise SystemExit('ShowcaseWorld mutation-store constructor seam missing')
              text = text.replace(seam, seam + '            _snapshotMutationStore = new RegionSnapshotMutationStore(in _table, in _pool);\n', 1)
          if 'public IRegionMutationStore MutationStorage' not in text:
              seam = '        public MaterialPalette Palette => _palette;'
              if seam not in text: raise SystemExit('ShowcaseWorld API insertion seam missing')
              props = '''        public IRegionMutationStore MutationStorage
        {
            get
            {
                _mutationStore.Refresh(in _table, in _pool);
                return _mutationStore;
            }
        }
        public IRegionSnapshotSource SnapshotStorage
        {
            get
            {
                _readSource.Refresh(in _table, in _pool);
                return _readSource;
            }
        }
        public IRegionSnapshotMutationStore SnapshotMutationStorage
        {
            get
            {
                _snapshotMutationStore.Refresh(in _table, in _pool);
                return _snapshotMutationStore;
            }
        }
'''
              text = text.replace(seam, props + seam, 1)
          save(world, original, text)

          session = Path('Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs')
          original = session.read_text(); text = original
          text = text.replace('''            _server.ProcessAuthoritativeTick(
                _serverTick,
                ref _world.Table,
                ref _world.Pool,
                in zones,
                this);''', '''            _server.ProcessAuthoritativeTick(
                _serverTick,
                _world.ReadStorage,
                _world.MutationStorage,
                _world.SnapshotStorage,
                in zones,
                this);''')
          text = text.replace('''            _client.ApplyReadyAuthoritativeEvents(
                ref _world.Table,
                ref _world.Pool,
                out int appliedEvents);''', '''            _client.ApplyReadyAuthoritativeEvents(
                _world.MutationStorage,
                _world.SnapshotStorage,
                _world.SnapshotMutationStorage,
                out int appliedEvents);''')
          save(session, original, text)

          forbidden = [
              re.compile(r'\.DrainReady\(\s*ref '),
              re.compile(r'\.ApplyReadyAuthoritativeEvents\(\s*ref '),
              re.compile(r'\.ProcessAuthoritativeTick\(\s*[^,\n]+,\s*ref '),
              re.compile(r'\.ProcessTick\(\s*[^,\n]+,\s*ref '),
          ]
          for root in [Path('Assets/Tests/EditMode'), Path('Assets/Scenes/Showcase')]:
              for path in root.glob('*.cs'):
                  body = path.read_text()
                  for pattern in forbidden:
                      if pattern.search(body):
                          raise SystemExit(f'legacy physical Net call remains in {path}: {pattern.pattern}')
          print('migrated counts:', counts)
          print('changed files:', len(changed))
          for p in changed: print(p)
          PY
          git rm .github/workflows/net-caller-repair-final.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode Assets/Scenes/Showcase
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo 'No caller changes required; only workflow deletion was staged unexpectedly.'
            exit 1
          fi
          git commit -m 'Migrate Net callers to Storage API capabilities'
          git push origin HEAD:${GITHUB_REF_NAME}
