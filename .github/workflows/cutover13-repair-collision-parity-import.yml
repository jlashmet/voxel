name: Cutover 13 repair collision parity import

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-repair-collision-parity-import.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Restore Runtime raycast import beside Api DDA import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Tests/PlayMode/VisualCollisionParityTests.cs')
          text=p.read_text()
          anchor='using VoxelEngine.Collision.Api;\n'
          if anchor not in text:
              raise SystemExit('Collision.Api import missing')
          if 'using VoxelEngine.Collision.Runtime;' not in text:
              text=text.replace(anchor, anchor+'using VoxelEngine.Collision.Runtime;\n',1)
          p.write_text(text)
          PY
          grep -q '^using VoxelEngine.Collision.Api;' Assets/Tests/PlayMode/VisualCollisionParityTests.cs
          grep -q '^using VoxelEngine.Collision.Runtime;' Assets/Tests/PlayMode/VisualCollisionParityTests.cs
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Tests/PlayMode/VisualCollisionParityTests.cs
          git commit -m 'fix(tests): keep runtime raycast import after DDA move'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
