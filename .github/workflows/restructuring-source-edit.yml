name: Restructuring source edit

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/restructuring-source-edit.yml

permissions:
  contents: write

jobs:
  patch-showcase-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Replace legacy terrain import
        shell: python
        run: |
          from pathlib import Path

          path = Path("Assets/Scenes/Showcase/ShowcaseWorld.cs")
          text = path.read_text()
          old = "using VoxelEngine.Core.Terrain;"
          new = "using TerrainSampler = VoxelEngine.Terrain.Api.TerrainQuery;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy terrain import, found {count}")
          path.write_text(text.replace(old, new, 1))

      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git diff --cached --check
          git commit -m "refactor: migrate showcase world to terrain api"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
