name: Apply run 184 plan evidence

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-run184-plan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record run 184 evidence
        shell: python
        run: |
          from pathlib import Path
          p = Path('.claude/plans/voxel-showcase-rendering-repair-v2.md')
          s = p.read_text()
          replacements = {
              '- [ ] Validate the constant-time visible selector in EditMode and remeasure production selection timing/coarse coverage.': '- [x] Validate the constant-time visible selector in EditMode and remeasure production selection timing/coarse coverage. PR run 32022085431 (`f0e0b689`) passes the affected EditMode gate and drops selection p95 from 0.52 ms to 0.02 ms with the unchanged 0.50 ms build budget; at 10.00 s production is still only 141/5,672 resident with 4,264 dirty, 16 running, 104 visible and 1,543 missing visible chunks, so the selector hotspot is fixed but coverage is not.',
              '- [ ] Fix the remaining coarse-coverage defect: current-head production still has 48 visible coarse holes and step 4 ends `known=110/resident=7/dirty=0/missing=0/visible=0`; step 4 uses the exact COW snapshot path (`LevelForStride(4) == -1`), so any remaining step-4 disappearance is downstream of exact snapshot admission rather than lossy mip sampling.': '- [ ] Fix the remaining coarse-coverage defect: exact-head PR run 32022085431 still has 50 visible coarse silhouette holes and step 4 again ends `known=110/resident=7/dirty=0/missing=0/jobs=0/visible=0` after 20 s; step 4 uses the exact COW snapshot path (`LevelForStride(4) == -1`), so the disappearance is downstream of exact snapshot admission rather than lossy mip sampling.\n- [ ] Add a focused step-4 false-empty regression proving an exact owned solid that falls between four-voxel lattice samples cannot be published as an authoritative empty chunk.\n- [ ] Repair the proven step-4 false-empty path with feature-preserving subcell geometry without changing LOD distances, global frame budgets, or fidelity thresholds.',
              '- [ ] Confirm the new per-fixture PlayMode shard layout no longer hits the Unity RSS watchdog on the current head. PR run 32014802229 proves crash/session isolation works and later shards continue, but the already-single-method `MemoryStaysWithinTierBudgetOverTwoHours` and `ContinuousTraversalOverKilometresShowsNoGaps` shards still hit 14,372 MB and 14,370 MB respectively against the unchanged 14,336 MB ceiling in PR run 32019741845; further YAML splitting cannot solve those two tests.': '- [ ] Confirm the new per-fixture PlayMode shard layout no longer hits the Unity RSS watchdog on the current head. Crash/session isolation works and later shards continue, but the already-single-method `MemoryStaysWithinTierBudgetOverTwoHours` and `ContinuousTraversalOverKilometresShowsNoGaps` shards still hit approximately 14,376 MB and 14,339 MB respectively against the unchanged 14,336 MB ceiling in PR run 32022085431; further YAML splitting cannot solve those two tests.',
              '- [ ] Validate the corrected no-stutter and LOD-fidelity harnesses on the clean current head.': '- [x] Validate the corrected no-stutter and LOD-fidelity harnesses on the clean current head. PR run 32022085431 proves both fixtures now exercise real production rendering: no-stutter reaches a live renderer and fails on convergence (`dirty=4264`, `running=16`, `missingVisible=818`, `visible=131`), while fidelity gets past bootstrap `RenderRequest` setup and fails because LOD 1/view 0 never stabilizes (centre-step mask 0). The harness blockers are resolved; the renderer acceptance failures remain open.',
              '- [ ] Run/confirm `ShowcaseNoStutterTests.BakedStartup_NeverBuildsCastleDuringPlayAndNeverStallsRendering` (current run fails before frame percentiles because it never observes a converged production solid-build window).': '- [ ] Run/confirm `ShowcaseNoStutterTests.BakedStartup_NeverBuildsCastleDuringPlayAndNeverStallsRendering` (PR run 32022085431 now exercises real rendering but still fails convergence with `dirty=4264`, `running=16`, `missingVisible=818`, `visible=131`; frame-percentile acceptance is therefore not yet creditable).',
              '- [x] Record the visible-priority measurement from PR run 32019741845: at 10.00 s the renderer has 126/5,672 resident, 4,257 dirty, 15 running jobs, 107 visible and 1,567 missing visible chunks; prepare p95 2.67 ms, worker/select p95 0.52/0.52 ms, queue p95 4,300.35 ms and build p95 911.84 ms. This proves priority queue ordering is not enough because selection itself saturates the 0.50 ms build budget.': '- [x] Record the visible-priority measurement from PR run 32019741845: at 10.00 s the renderer has 126/5,672 resident, 4,257 dirty, 15 running jobs, 107 visible and 1,567 missing visible chunks; prepare p95 2.67 ms, worker/select p95 0.52/0.52 ms, queue p95 4,300.35 ms and build p95 911.84 ms. This proves priority queue ordering is not enough because selection itself saturates the 0.50 ms build budget.\n- [x] Record the constant-time-selector measurement from PR run 32022085431: at 10.00 s the renderer has 141/5,672 resident, 4,264 dirty, 16 running jobs, 104 visible and 1,543 missing visible chunks; prepare p95 2.58 ms, worker/select p95 0.51/0.02 ms, queue p95 4,073.81 ms and build p95 1,036.84 ms. Selection no longer consumes the frame budget, but worker/build throughput and false-empty coarse publication still prevent convergence.',
              '- `6678ca3e` — EditMode validation contracts aligned with passive discovery and the pre-admission visibility / single-flush frame order.': '- `6678ca3e` — EditMode validation contracts aligned with passive discovery and the pre-admission visibility / single-flush frame order.\n- `2bca9841` — visible-demand selection made constant-time in the normal case; no-stutter and LOD-fidelity batchmode render targets repaired without changing acceptance thresholds.',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected plan text: {old}')
              s = s.replace(old, new, 1)
          old_tail = '''PR #88 run 32019741845 (`63e52315`) validates all 651 affected EditMode tests and the baked startup step, but production PlayMode remains red. Visible-priority ordering did not materially improve convergence: coarse lookdev reports 48 holes and the 10-second showcase still has 1,567 missing visible chunks. The decisive new timing is build-selection p95 0.52 ms against the unchanged 0.50 ms renderer-wide build budget, so the next production repair removes nearest-ranking work from the already-visible priority path. The same run reproduced the two validation-only blockers exactly (no explicit batchmode camera submission in `ShowcaseNoStutterTests`, and a null bootstrap `RenderRequest` destination in `LodVisualFidelityTests`), so those harnesses are repaired without changing their thresholds.'''
          new_tail = '''PR #88 run 32022085431 (`f0e0b689`) validates the constant-time selector and both repaired validation harnesses on the clean exact head, but production PlayMode remains red. Selection p95 falls from 0.52 ms to 0.02 ms without changing the 0.50 ms budget, while the 10-second showcase still has 1,543 missing visible chunks and coarse lookdev reports 50 holes. Step 4 again converges to `known=110/resident=7/dirty=0/missing=0/jobs=0/visible=0`, confirming the remaining coarse disappearance is not queue backlog. Static tracing shows exact classification preserves owned solids, while step-4 faceted/continuous generation samples the four-voxel lattice and zero-geometry completion is recorded as authoritative empty; the next gate is a focused regression for that false-empty path before any production geometry fallback is enabled. The no-stutter and fidelity fixtures now reach production rendering and fail on convergence/coverage rather than their former batchmode setup blockers.'''
          if old_tail not in s:
              raise SystemExit('missing expected current-head summary')
          p.write_text(s.replace(old_tail, new_tail, 1))
      - name: Commit plan and retire transport
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm .github/workflows/apply-run184-plan.yml
          git commit -m 'docs: record run 184 renderer evidence'
          git push
