name: Image Transport Test

on:
  push:
    branches: ['chatgpt-image-test-20260907']
    paths:
      - 'test-assets/texture-2k.transport.b64'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Decode transport seed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          src = Path('test-assets/texture-2k.transport.b64')
          raw = base64.b64decode(src.read_text(encoding='utf-8').strip(), validate=True)
          expected = '3ed3385177d2ecd8532969b283fe9add9a5b4757de79e1fbc2c3d43027942af2'
          got = hashlib.sha256(raw).hexdigest()
          if got != expected:
              raise SystemExit(f'transport SHA mismatch: {got}')
          Path('/tmp/chatgpt-texture-seed.jpg').write_bytes(raw)
          print(f'decoded {len(raw)} bytes, sha256={got}')
          PY

      - name: Build 2048 texture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-assets
          sips -z 2048 2048 /tmp/chatgpt-texture-seed.jpg --out test-assets/chatgpt-stone-texture-2k.jpg >/dev/null
          width="$(sips -g pixelWidth test-assets/chatgpt-stone-texture-2k.jpg | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight test-assets/chatgpt-stone-texture-2k.jpg | awk '/pixelHeight/ {print $2}')"
          test "$width" = 2048
          test "$height" = 2048
          shasum -a 256 test-assets/chatgpt-stone-texture-2k.jpg

      - name: Commit reconstructed binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-assets/chatgpt-stone-texture-2k.jpg
          if git diff --cached --quiet; then
            echo 'Binary already matches; nothing to commit.'
            exit 0
          fi
          git commit -m 'Reconstruct 2K texture'
          git push origin HEAD:chatgpt-image-test-20260907
