name: Final architecture legacy cleanup

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths:
      - ".github/workflows/final-architecture-legacy-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0

      - name: Retire stale migration automation and classify retained literals
        shell: bash
        run: |
          set -euo pipefail

          stale_workflows=(
            .github/workflows/cutover13-core-zero-match.yml
            .github/workflows/cutover13-final-gap-inventory.yml
            .github/workflows/cutover13-integrated-983-acceptance.yml
            .github/workflows/cutover13-integrated-a6b-acceptance.yml
            .github/workflows/cutover13-worldgen-static.yml
            .github/workflows/record-composition-storage-slice.yml
            .github/workflows/record-rendering-cutover12-acceptance.yml
            .github/workflows/record-rendering-final-cutover12.yml
            .github/workflows/rendering-plan-complete.yml
            .github/workflows/rendering-static-cutover12.yml
            .github/workflows/showcase-network-storage-api-acceptance.yml
            .github/workflows/storage-core-cutover-acceptance.yml
            .github/workflows/storage-runtime-cutover.yml
            .github/workflows/terrain-cutover3-acceptance.yml
            .github/workflows/terrain-runtime-cutover.yml
            .github/workflows/zz-net-static-c7d-gate.yml
          )
          for file in "${stale_workflows[@]}"; do
            git rm -f --ignore-unmatch "$file"
          done

          cat > docs/ARCHITECTURE_LEGACY_LITERAL_CLASSIFICATION.md <<'EOF'
          # Legacy `VoxelEngine.Core` Literal Classification

          This file closes the repository-wide literal inventory without erasing useful history.

          Inventory run `31909802220` at `0b64b52370ab483f2b34110d2c08826c924d49a1` found 181 textual `VoxelEngine.Core` matches outside generated Unity caches. The architectural requirement is stricter and more useful than a blind repository-wide text deletion: **production source and assembly metadata must contain zero references to the deleted Core assembly/namespace, while tests and historical evidence may name the forbidden token in order to document or reject it.**

          ## Accepted retained categories

          - `docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md` and `docs/ARCHITECTURE_MIGRATION_PLAN.md`: migration history, acceptance evidence, and explicit forbidden-name policy.
          - `specs/**`: historical specifications describing the pre-refactor architecture.
          - `Artifacts/**`: archived compile/performance evidence from pre-cutover heads; not source or assembly metadata.
          - permanent architecture guards/tests and the final acceptance workflows: the literal is deliberately used as a forbidden token so regressions fail.

          ## Removed stale categories

          - one-shot Core/Storage/Terrain/Rendering/Cutover-13 migration mutators;
          - one-shot acceptance/inventory workflows superseded by the permanent final static gate and stable final acceptance workflow;
          - old checklist publisher workflows superseded by the live implementation plan.

          The current production tree contains no `Legacy*` or `*Compatibility*` source path and no production `VoxelEngine.Core` reference. The final static acceptance workflow permanently rejects both deleted-Core references and newly introduced legacy/compatibility adapter source files. Historical prose and guards are intentionally retained; they are not compatibility surfaces.
          EOF
          sed -i 's/^          //' docs/ARCHITECTURE_LEGACY_LITERAL_CLASSIFICATION.md

          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = path.read_text()

          replacements = {
              'classify/remove stale non-production legacy Core literals, then exact EditMode acceptance for the final Composition move and final validation closeout':
                  'exact EditMode acceptance for the final Composition move and final validation closeout',
              '[ ] no compatibility/legacy adapter was introduced to preserve the old architecture':
                  '[x] no compatibility/legacy adapter was introduced to preserve the old architecture; the final static gate rejects `Legacy*` / `*Compatibility*` production source paths and the current production tree has none',
              '- [ ] classify/remove stale repository-wide `VoxelEngine.Core` literals outside production; inventory run `31909802220` found 181 matches, primarily historical migration docs, retired one-shot workflows, guard/test vocabulary, and archived logs. Intentional guard/history references must be explicitly retained rather than pretending the repository is at literal zero-match.':
                  '- [x] classify/remove stale repository-wide `VoxelEngine.Core` literals outside production; `docs/ARCHITECTURE_LEGACY_LITERAL_CLASSIFICATION.md` records the inventory disposition, obsolete migration/acceptance/publisher workflows are retired, and intentional history/spec/artifact/guard vocabulary is explicitly retained.',
              '- Repository-wide legacy-token inventory: run `31909802220` at `0b64b52370ab483f2b34110d2c08826c924d49a1` found 181 `VoxelEngine.Core` literals outside generated Unity caches. Production code remains clean; the residual set is dominated by historical docs, retired migration/acceptance workflows, guard/test vocabulary, specs, tooling, and archived logs and is tracked separately from the production architecture gate.':
                  '- Repository-wide legacy-token inventory: run `31909802220` at `0b64b52370ab483f2b34110d2c08826c924d49a1` found 181 `VoxelEngine.Core` literals outside generated Unity caches. `docs/ARCHITECTURE_LEGACY_LITERAL_CLASSIFICATION.md` now classifies the residual set: obsolete migration/acceptance/publisher automation is retired; intentional history/spec/artifact/guard vocabulary is retained; production source/asmdefs remain Core-free.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected plan text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git rm -f .github/workflows/final-architecture-legacy-cleanup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(architecture): retire legacy migration scaffolding"
          git push origin HEAD:refactor/system-boundaries-finalization-stable
