name: Shared geometry arena pressure patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-arena-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_arena_patch.py
      - name: Commit renderer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceGeometryArena.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          git commit -m 'Handle shared geometry arena pressure without allocations'
          git push origin HEAD:refactor/async-geometry-pipeline
