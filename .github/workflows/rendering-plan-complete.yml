name: Record accepted Rendering cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-plan-complete.yml]
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Mark Cutover 12 complete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          replacements={
          '**Current focus:** Cutover 12 Rendering — behavioral parity acceptance': '**Current focus:** Cutover 13 Composition/Core deletion — composition root and final Core removal',
          '| 12 — Rendering | **In progress — current** | render bridge/surface extraction use Storage.Api read views; retained profiles use Storage.Api; vegetation presentation uses Vegetation.Api; dead physical leaks removed; Rendering Api/Runtime physical + namespace + asmdef cutover accepted by static gate | final 384/371/13 behavioral parity gate |': '| 12 — Rendering | **Complete** | Rendering.Api/Runtime physical and namespace cutover complete; Runtime consumes Storage.Api/Tiering.Api/Vegetation.Api only; catalogue/change-feed and retained-profile reads use API views; tree presentation remains Vegetation.Api-only; dead physical leaks and broad Rendering assembly are gone; final 384/371/13 behavioral baseline accepted | none |',
          '- Latest accepted code gate: `de24d20ce48e9665f4ab7ab78343e7354601eab0` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Isolated Rendering cleanup run `31892956307` produced a complete `results.xml`; its failed-name set matches the accepted 384-test baseline exactly. This gate accepts removal of the unused/physical-storage-leaking `ProbeCache` and `VoxelGpuBuffers` implementations before the Rendering Api/Runtime split.': '- Latest accepted code gate: source `f5e0b646102a50305424850a0508d190bae3e44d`, isolated Rendering run `31894170304` — 384 tests, 371 passed, exactly the same 13 known baseline failures. This gate accepts the complete Rendering cutover: Api/Runtime physical split, Runtime namespace normalization, Storage.Api catalogue/change/read views, Vegetation.Api-only presentation dependency, restored tree mesh implementation, and all Showcase/test/capture consumer migrations.',
          '- Latest accepted Rendering static gate: source `f5e0b646102a50305424850a0508d190bae3e44d`, run `31894268246` — physical Api/Runtime layout, Runtime namespaces, dependency direction, reverse simulation dependency, and explicit/manual lookdev status all passed. Behavioral parity is still pending and is not implied by this static gate.': '- Latest accepted Rendering static gate: source `f5e0b646102a50305424850a0508d190bae3e44d`, run `31894268246` — physical Api/Runtime layout, Runtime namespaces, dependency direction, reverse simulation dependency, and explicit/manual lookdev status all passed. Behavioral parity for the same source was accepted by isolated run `31894170304` at 384/371 with the identical 13 known failures.',
          '- [ ] targeted GPU/CPU surface and rendering parity tests pass;': '- [x] targeted GPU/CPU surface and rendering parity tests pass against the accepted 384/371/13 baseline at source `f5e0b646102a50305424850a0508d190bae3e44d` (isolated run `31894170304`);',
          '### 12. Rendering\n\n- [ ] create Rendering.Api/Runtime\n- [ ] move all extraction/render/tree presentation implementation to Runtime\n- [ ] consume Storage/Tiering/Vegetation Api only\n- [ ] keep Rendering.Api minimal': '### 12. Rendering\n\n- [x] create Rendering.Api/Runtime\n- [x] move all extraction/render/tree presentation implementation to Runtime\n- [x] consume Storage/Tiering/Vegetation Api only\n- [x] keep Rendering.Api minimal',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('missing expected plan text: '+old[:120])
              s=s.replace(old,new,1)
          marker='- [x] Rendering catalogue/change-feed consumers and tooling use Storage.Api read-facing views; Rendering.Runtime no longer references `VoxelEngine.Core`.\n'
          addition=marker+'- [x] Final Rendering behavioral acceptance passed at source `f5e0b646102a50305424850a0508d190bae3e44d`: isolated run `31894170304` produced 384 total / 371 passed / exact 13 known baseline failures.\n'
          if marker not in s:
              raise SystemExit('missing Rendering implementation marker')
          if 'Final Rendering behavioral acceptance passed at source `f5e0b646' not in s:
              s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
          git rm .github/workflows/rendering-plan-complete.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark Rendering cutover complete'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
