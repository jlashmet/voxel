name: Async Burst water mesh one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-water-burst-mesh-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_water_burst_mesh_patch.py
      - name: Static guards
        run: |
          grep -q 'new WaterBrickMeshBatchJob' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          ! grep -q 'private void EmitBrick' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          ! grep -q 'private void MergeMask' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          grep -q '\[BurstCompile\]' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/WaterBrickMeshBatchJob.cs
          grep -q 'WaterGreedyMeshEmissionRunsInBurst' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit water Burst extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/WaterBrickMeshBatchJob.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/WaterBrickMeshBatchJob.cs.meta \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Move water greedy mesh emission into Burst worker'
          git push origin HEAD:refactor/async-geometry-pipeline
