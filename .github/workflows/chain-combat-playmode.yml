name: Chain Combat PlayMode

on:
  workflow_dispatch:
  push:
    branches:
      - prototype/chain-combat
    paths:
      - "Assets/CombatPrototype/**"
      - "Assets/Tests/PlayMode/ChainCombatPrototypeTests.cs"
      - "Assets/Tests/PlayMode/ChainCombatPrototypeTests.cs.meta"
      - "Assets/Tests/PlayMode/VoxelEngine.Tests.PlayMode.asmdef"
      - ".github/workflows/chain-combat-playmode.yml"

jobs:
  chain-combat-playmode:
    name: Exercise chain combat prototype
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run chain combat PlayMode tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/ChainCombat"

          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter VoxelEngine.Tests.PlayMode.ChainCombatPrototypeTests \
            -testResults "$GITHUB_WORKSPACE/Artifacts/ChainCombat/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/ChainCombat/unity.log"
          status=$?

          if [[ -f "$GITHUB_WORKSPACE/Artifacts/ChainCombat/unity.log" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/ChainCombat/unity.log"
          fi

          if [[ $status -ne 0 ]]; then
            exit $status
          fi

          test -s "$GITHUB_WORKSPACE/Artifacts/ChainCombat/results.xml"

      - name: Upload chain combat test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-combat-playmode-${{ github.sha }}
          path: Artifacts/ChainCombat/
          if-no-files-found: warn
          retention-days: 14
