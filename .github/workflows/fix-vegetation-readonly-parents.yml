name: Fix Vegetation readonly parent lists
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths:
      - .github/workflows/fix-vegetation-readonly-parents.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes = {
            Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs'): [
              ('int[] parents = skeleton.BranchParents;', 'IReadOnlyList<int> parents = skeleton.BranchParents;'),
              ('parents.Length != skeleton.Branches.Count', 'parents.Count != skeleton.Branches.Count'),
              ('(uint)parents.Length', '(uint)parents.Count'),
            ],
            Path('Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs'): [
              ('int[] parents = skeleton.BranchParents;', 'IReadOnlyList<int> parents = skeleton.BranchParents;'),
              ('i < parents.Length', 'i < parents.Count'),
            ],
          }
          for path, replacements in changes.items():
              source = path.read_text()
              for old, new in replacements:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  source = source.replace(old, new, 1)
              path.write_text(source)
          PY
          git rm .github/workflows/fix-vegetation-readonly-parents.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs
          git commit -m 'fix: consume immutable Vegetation parent lists'
          git push origin HEAD:${{ github.ref_name }}
