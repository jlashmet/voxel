name: One-shot Architecture Progress Update

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-update-architecture-progress.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Update implementation progress
        run: python .github/scripts/one_shot_update_architecture_progress_v2.py

      - name: Verify intended documentation-only diff
        run: |
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          test -n "$(git status --short docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md)"

      - name: Commit progress and remove one-shot tooling
        run: |
          rm .github/scripts/one_shot_update_architecture_progress.py
          rm .github/scripts/one_shot_update_architecture_progress_v2.py
          rm .github/workflows/one-shot-update-architecture-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/scripts/one_shot_update_architecture_progress.py .github/scripts/one_shot_update_architecture_progress_v2.py .github/workflows/one-shot-update-architecture-progress.yml
          git commit -m "docs: track architecture refactor progress"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
