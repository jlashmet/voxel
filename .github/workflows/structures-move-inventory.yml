name: Structures move inventory

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: read

jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - name: Inventory top-level Structures consumers
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo '=== Mat consumers ==='
          grep -RIlE '\bMat\.' Assets Packages --include='*.cs' | sort || true
          echo '=== VoxelBrush consumers ==='
          grep -RIlE '\bVoxelBrush\b' Assets Packages --include='*.cs' | sort || true
          echo '=== MasonryWeathering consumers ==='
          grep -RIlE '\bMasonryWeathering\b' Assets Packages --include='*.cs' | sort || true
          echo '=== CastleBuilder consumers ==='
          grep -RIlE '\bCastleBuilder\b' Assets Packages --include='*.cs' | sort || true
          echo '=== asmdefs referencing Structures or Structures.Runtime ==='
          grep -RIlE 'VoxelEngine\.Structures(\.Runtime)?' Assets Packages --include='*.asmdef' | sort || true
