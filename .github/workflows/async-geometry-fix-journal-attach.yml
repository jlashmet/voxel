name: Fix journal attachment churn

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-fix-journal-attach.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Stop initial journal attachment invalidation sweep
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scheduler = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs')
          s = scheduler.read_text()
          old = '            _recoveringChangeOverflow = journal != null;'
          new = '            _recoveringChangeOverflow = false;'
          if s.count(old) != 1:
              raise SystemExit(f'scheduler recovery anchor count={s.count(old)}')
          scheduler.write_text(s.replace(old, new, 1))

          tests = Path('Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs')
          t = tests.read_text()
          old_name = 'public void ChangeJournalAttachmentBaselinesCurrentVersionAndResyncsCurrentState()'
          new_name = 'public void ChangeJournalAttachmentBaselinesCurrentVersionWithoutInvalidatingCurrentState()'
          if t.count(old_name) != 1:
              raise SystemExit(f'test name anchor count={t.count(old_name)}')
          t = t.replace(old_name, new_name, 1)
          old_assert = 'StringAssert.Contains("_recoveringChangeOverflow = journal != null;", attach);'
          new_assert = 'StringAssert.Contains("_recoveringChangeOverflow = false;", attach);'
          if t.count(old_assert) != 1:
              raise SystemExit(f'test assertion anchor count={t.count(old_assert)}')
          tests.write_text(t.replace(old_assert, new_assert, 1))
          PY
      - name: Static guards
        run: |
          grep -q '_recoveringChangeOverflow = false;' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          ! grep -q '_recoveringChangeOverflow = journal != null;' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'ChangeJournalAttachmentBaselinesCurrentVersionWithoutInvalidatingCurrentState' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit fix
        run: |
          rm .github/workflows/async-geometry-fix-journal-attach.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Avoid journal attachment invalidation sweep'
          git push origin HEAD:refactor/async-geometry-pipeline
