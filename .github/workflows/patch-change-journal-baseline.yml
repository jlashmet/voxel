name: Patch change journal baseline

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/patch-change-journal-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0

      - name: Baseline change feed at current state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scheduler_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs')
          scheduler = scheduler_path.read_text()
          old = '''        private void ResetChangeFeedState(IVoxelChangeSource journal)\n        {\n            _journal = journal;\n            _changeCursor = 0;\n            _changeScratch.Clear();\n            _changeRecordIndex = 0;\n            _changeFeedHasMore = false;\n            _recoveringChangeOverflow = false;\n            _changeRecoveryCursor = 0;\n            _changeExpansionActive = false;\n            _changeExpansionCursor = 0;\n        }\n'''
          new = '''        private void ResetChangeFeedState(IVoxelChangeSource journal)\n        {\n            _journal = journal;\n            // A newly attached journal describes changes relative to the current Storage state.\n            // Replaying retained history from version zero would repeatedly invalidate geometry\n            // that has never been rendered. Baseline at the latest committed version and use\n            // the existing bounded resident-region recovery to reconcile current state once.\n            _changeCursor = journal?.CurrentVersion ?? 0;\n            _changeScratch.Clear();\n            _changeRecordIndex = 0;\n            _changeFeedHasMore = false;\n            _recoveringChangeOverflow = journal != null;\n            _changeRecoveryCursor = 0;\n            _changeExpansionActive = false;\n            _changeExpansionCursor = 0;\n        }\n'''
          if scheduler.count(old) != 1:
              raise SystemExit(f'Expected one ResetChangeFeedState block, found {scheduler.count(old)}')
          scheduler_path.write_text(scheduler.replace(old, new))

          test_path = Path('Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs')
          tests = test_path.read_text()
          anchor = '''        [Test]\n        public void ChangeJournalAndOverflowRecoveryAreFrameBounded()\n'''
          addition = '''        [Test]\n        public void ChangeJournalAttachmentBaselinesCurrentVersionAndResyncsCurrentState()\n        {\n            string scheduler = ReadRenderingSource(\n                Path.Combine("SurfaceExtraction", "VoxelSurfaceScheduler.cs"));\n            int reset = scheduler.IndexOf("private void ResetChangeFeedState",\n                                          StringComparison.Ordinal);\n            int recovery = scheduler.IndexOf("private void StepChangeOverflowRecovery", reset,\n                                             StringComparison.Ordinal);\n            Assert.GreaterOrEqual(reset, 0);\n            Assert.Greater(recovery, reset);\n            string attach = scheduler.Substring(reset, recovery - reset);\n            StringAssert.Contains("_changeCursor = journal?.CurrentVersion ?? 0;", attach);\n            StringAssert.Contains("_recoveringChangeOverflow = journal != null;", attach);\n            StringAssert.DoesNotContain("_changeCursor = 0;", attach,\n                "A newly attached journal must not replay retained pre-render history.");\n        }\n\n\n'''
          if tests.count(anchor) != 1:
              raise SystemExit(f'Expected one change-journal test anchor, found {tests.count(anchor)}')
          test_path.write_text(tests.replace(anchor, addition + anchor))
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-change-journal-baseline.yml
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m "Fix change journal startup replay"
          git push origin HEAD:refactor/async-geometry-pipeline
