# Final isolated behavioral acceptance for the settled Net source tree.
name: Net acceptance isolated v2
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-acceptance-isolated-v2.yml]
permissions:
  contents: read
jobs:
  unity-editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed126903cd18dcd62324fab41942d41fdaa37532
          clean: false
          fetch-depth: 1
      - name: Fully clean checkout and Unity cache
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard ed126903cd18dcd62324fab41942d41fdaa37532
          git clean -ffdx
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run clean EditMode acceptance suite
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          "${{ steps.unity.outputs.path }}" \
            -batchmode -nographics -quit \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingCI-clean-${{ github.sha }}
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
