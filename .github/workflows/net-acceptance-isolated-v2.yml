# Final isolated behavioral acceptance for the settled Net source tree.
name: Net acceptance isolated v2
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unity-editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed126903cd18dcd62324fab41942d41fdaa37532
          clean: false
          fetch-depth: 1
      - name: Reset pinned source while preserving Unity cache
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard ed126903cd18dcd62324fab41942d41fdaa37532
          git clean -ffdx -e Library/
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done
      - name: Run pinned EditMode acceptance suite
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml"
          exit $status
      - name: Show Unity log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/NetworkingCI/unity.log"
          if [[ -f "$LOG" ]]; then tail -n 250 "$LOG"; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingCI-clean-${{ github.sha }}
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
# Triggered after all stale queue-cancellation helpers were removed.
