name: Validation Net final isolated
on:
  push:
    branches: [validation/net-final-repaired-2fe08b60]
    paths: [.github/workflows/validation-net-final.yml]
permissions:
  contents: read
jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2fe08b603509ecf081ba1602759d69bbdbccfd40
          clean: false
          fetch-depth: 1
      - name: Reset pinned source tree
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 2fe08b603509ecf081ba1602759d69bbdbccfd40
          git clean -ffdx -e Library/
      - id: unity
        name: Locate Unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode tests
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ValidationNetFinal"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || true
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-net-final
          path: Artifacts/ValidationNetFinal/
          if-no-files-found: warn
          retention-days: 14
