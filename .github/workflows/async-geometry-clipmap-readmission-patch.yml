name: Bounded clipmap surface readmission one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-clipmap-readmission-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded clipmap patch
        run: python3 .github/scripts/async_geometry_clipmap_readmission_patch.py
      - name: Static guards
        run: |
          grep -q 'ClipmapAdmissionRegionsPerFrame = 64' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'EnqueueClipmapRegionDifference' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'StepClipmapAdmissionDiscovery(storage)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'AddImmediateCameraDiscoveryRegions' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'ClipmapMotionReadmitsAlreadyResidentSurfaceIntoFinerLod' Assets/Tests/EditMode/SurfaceBrickDiscoveryTests.cs
      - name: Commit clipmap readmission
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/Tests/EditMode/SurfaceBrickDiscoveryTests.cs
          git commit -m 'Rediscover newly exposed clipmap regions incrementally'
          # Other async-geometry agents may land orthogonal work while this guarded patch runs.
          # Rebase only; an overlapping conflict must fail rather than overwrite newer work.
          git fetch origin refactor/async-geometry-pipeline
          git rebase origin/refactor/async-geometry-pipeline
          git push origin HEAD:refactor/async-geometry-pipeline
