name: Record accepted Net cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-plan-complete.yml]
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: true
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          reps={
          '**Current focus:** Cutover 11 Net — Api/Runtime decomposition and ownership cleanup':'**Current focus:** Cutover 12 Rendering — Api/Runtime physical move',
          '| 11 — Net | **In progress — current** | Net.Api/Runtime physical decomposition, Runtime namespace normalization, broad assembly deletion and domain-only Runtime references are accepted by the final static architecture gate; earlier cutovers removed the structural graph and duplicate edit-applier wrapper | baseline revalidation still required for residency/snapshot/protocol behavior before Cutover 11 can close |':'| 11 — Net | **Complete** | Net.Api/Runtime physical decomposition, Runtime namespace normalization, broad assembly deletion, domain-only Runtime references, Streaming.Api residency, Storage.Api convergence/repair, and final 384/371/13 behavioral parity are accepted | none |',
          '| 12 — Rendering | **In progress** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; vegetation presentation consumes Vegetation.Api only; parity accepted | final Rendering.Api/Runtime move |':'| 12 — Rendering | **In progress — current** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; vegetation presentation consumes Vegetation.Api only; parity accepted | final Rendering.Api/Runtime move |',
          '- Latest accepted code gate: `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Net ownership/decomposition work after this gate is code-landed but remains unaccepted until a full compile/test run returns to this baseline; the Net-specific artifacts inspected during revalidation stopped at compilation and did not produce `results.xml`.':'- Latest accepted code gate: `d6b481a1f77c81eaf13181a690ac0e04b0b5866f` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Net behavioral revalidation produced `results.xml` and matched the accepted failure-name set exactly; Cutover 11 is complete.',
          '- [x] Final Net static architecture gate passed at `8dafd264dfd3e228e833da23c258d9e21768ad98`; full 384/371/13 parity revalidation remains intentionally unchecked.':'- [x] Final Net static architecture gate passed at `8dafd264dfd3e228e833da23c258d9e21768ad98`; final 384/371/13 behavioral parity revalidation accepted at `d6b481a1f77c81eaf13181a690ac0e04b0b5866f`.',
          '- [ ] protocol/convergence/late-join/reconciliation tests pass against the accepted baseline.':'- [x] protocol/convergence/late-join/reconciliation tests pass against the accepted 384/371/13 baseline; final acceptance artifact from `d6b481a1f77c81eaf13181a690ac0e04b0b5866f` matches the exact 13 known failure names.'
          }
          for old,new in reps.items():
              n=s.count(old)
              if n!=1: raise SystemExit(f'expected exactly one match, found {n}: {old[:80]}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git rm .github/workflows/net-plan-complete.yml
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git commit -m 'docs: mark Net cutover complete'
          git push origin HEAD:${{ github.ref_name }}
