name: Net Storage API caller migration
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-storage-api-caller-migration.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard origin/refactor/system-boundaries-foundation-storage
          git clean -ffdx
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs'),
              Path('Assets/Tests/EditMode/AuthoritativeSessionLoopbackTests.cs'),
              Path('Assets/Tests/EditMode/CanonicalBrushTests.cs'),
              Path('Assets/Tests/EditMode/CanonicalBrushValidationTests.cs'),
              Path('Assets/Tests/EditMode/ClientAuthoritativeEventQueueTests.cs'),
              Path('Assets/Tests/EditMode/DeterministicNetworkParityTests.cs'),
              Path('Assets/Tests/EditMode/RegionConvergenceTests.cs'),
              Path('Assets/Tests/EditMode/RegionResyncFallbackTests.cs'),
              Path('Assets/Tests/EditMode/RegionStateCatchupTests.cs'),
              Path('Assets/Tests/EditMode/RegionStateLoopbackTests.cs'),
              Path('Assets/Tests/EditMode/ServerCommandProcessorTests.cs'),
              Path('Assets/Tests/EditMode/TwoPlayerAuthoritativeLoopbackTests.cs'),
          ]

          def matching_paren(text, open_i):
              depth = 0
              quote = None
              esc = False
              for i in range(open_i, len(text)):
                  c = text[i]
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in ('\"', "'"):
                      quote = c
                  elif c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('unmatched call parenthesis')

          def split_args(src):
              out, start, depth = [], 0, 0
              quote = None
              esc = False
              for i, c in enumerate(src):
                  if quote:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == quote:
                          quote = None
                      continue
                  if c in ('\"', "'"):
                      quote = c
                  elif c in '([{':
                      depth += 1
                  elif c in ')]}':
                      depth -= 1
                  elif c == ',' and depth == 0:
                      out.append(src[start:i].strip())
                      start = i + 1
              tail = src[start:].strip()
              if tail or out:
                  out.append(tail)
              return out

          def rewrite_calls(text, method, transform):
              needle = '.' + method + '('
              pos = 0
              count = 0
              while True:
                  idx = text.find(needle, pos)
                  if idx < 0:
                      break
                  open_i = idx + len(needle) - 1
                  close_i = matching_paren(text, open_i)
                  args = split_args(text[open_i + 1:close_i])
                  new_args = transform(args)
                  if new_args is None:
                      pos = close_i + 1
                      continue
                  replacement = ',\n                    '.join(new_args)
                  text = text[:open_i + 1] + '\n                    ' + replacement + ')' + text[close_i + 1:]
                  pos = open_i + len(replacement) + 2
                  count += 1
              return text, count

          def strip_prefix(arg, prefix):
              s = arg.strip()
              return s[len(prefix):].strip() if s.startswith(prefix) else None

          totals = {k: 0 for k in ['ProcessAuthoritativeTick','ApplyReadyAuthoritativeEvents','DrainReady','ProcessTick','Validate']}
          changed_files = []

          for path in targets:
              if not path.exists():
                  raise SystemExit(f'missing target: {path}')
              original = path.read_text()
              text = original

              def server_tick(args):
                  if len(args) not in (5, 6): return None
                  table = strip_prefix(args[1], 'ref ')
                  pool = strip_prefix(args[2], 'ref ')
                  if table is None or pool is None: return None
                  out = [
                      args[0],
                      f'new RegionReadSource(in {table}, in {pool})',
                      f'new RegionMutationStore(in {table}, in {pool})',
                      f'new RegionReadSource(in {table}, in {pool})',
                      args[3], args[4]
                  ]
                  if len(args) == 6: out.append(args[5])
                  return out

              def apply_ready(args):
                  if len(args) != 3: return None
                  table = strip_prefix(args[0], 'ref ')
                  pool = strip_prefix(args[1], 'ref ')
                  if table is None or pool is None: return None
                  return [
                      f'new RegionMutationStore(in {table}, in {pool})',
                      f'new RegionReadSource(in {table}, in {pool})',
                      f'new RegionSnapshotMutationStore(in {table}, in {pool})',
                      args[2]
                  ]

              def drain_ready(args):
                  if len(args) < 3: return None
                  table = strip_prefix(args[0], 'ref ')
                  pool = strip_prefix(args[1], 'ref ')
                  if table is None or pool is None: return None
                  return [
                      f'new RegionMutationStore(in {table}, in {pool})',
                      f'new RegionReadSource(in {table}, in {pool})',
                      *args[2:]
                  ]

              def process_tick(args):
                  if len(args) != 8: return None
                  table = strip_prefix(args[1], 'ref ')
                  pool = strip_prefix(args[2], 'ref ')
                  if table is None or pool is None: return None
                  return [
                      args[0],
                      f'new RegionReadSource(in {table}, in {pool})',
                      f'new RegionMutationStore(in {table}, in {pool})',
                      *args[3:]
                  ]

              def validate(args):
                  if len(args) != 8: return None
                  table = strip_prefix(args[5], 'ref ')
                  pool = strip_prefix(args[6], 'in ')
                  if table is None or pool is None: return None
                  return [
                      args[0], args[1], args[2],
                      f'new RegionReadSource(in {table}, in {pool})',
                      args[3], args[4], args[7]
                  ]

              for method, fn in [
                  ('ProcessAuthoritativeTick', server_tick),
                  ('ApplyReadyAuthoritativeEvents', apply_ready),
                  ('DrainReady', drain_ready),
                  ('ProcessTick', process_tick),
                  ('Validate', validate),
              ]:
                  text, n = rewrite_calls(text, method, fn)
                  totals[method] += n

              if text != original:
                  if 'RegionReadSource' in text and 'using VoxelEngine.Core.Storage;' not in text:
                      insert = text.find('\n') + 1
                      text = text[:insert] + 'using VoxelEngine.Core.Storage;\n' + text[insert:]
                  path.write_text(text)
                  changed_files.append(str(path))

          expected_min = {
              'ProcessAuthoritativeTick': 10,
              'ApplyReadyAuthoritativeEvents': 10,
              'DrainReady': 5,
              'ProcessTick': 1,
              'Validate': 1,
          }
          for method, minimum in expected_min.items():
              if totals[method] < minimum:
                  raise SystemExit(f'{method}: migrated only {totals[method]}, expected at least {minimum}')

          for path in targets:
              text = path.read_text()
              for method in ('ProcessAuthoritativeTick','ApplyReadyAuthoritativeEvents','DrainReady','ProcessTick'):
                  needle = '.' + method + '('
                  pos = 0
                  while True:
                      idx = text.find(needle, pos)
                      if idx < 0: break
                      open_i = idx + len(needle) - 1
                      close_i = matching_paren(text, open_i)
                      args = split_args(text[open_i + 1:close_i])
                      if any(a.strip().startswith('ref ') for a in args[:3]):
                          raise SystemExit(f'legacy {method} storage call remains in {path}: {args}')
                      pos = close_i + 1

          print('migrated calls:', totals)
          print('changed files:', len(changed_files))
          print('\n'.join(changed_files))
          PY
          git rm .github/workflows/net-storage-api-caller-migration.yml
          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets
          git commit -m 'refactor(net): migrate callers to Storage API boundaries'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
