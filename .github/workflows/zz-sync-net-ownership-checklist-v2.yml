name: Reliably sync accepted Net ownership checklist
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/zz-sync-net-ownership-checklist-v2.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          replacements={
            '- [ ] Server residency delegates to Streaming.Api and semantic convergence/repair uses Storage.Api capabilities in the current code; acceptance is pending revalidation.': '- [x] Server residency delegates to Streaming.Api and semantic convergence/repair uses Storage.Api capabilities; dedicated hosted ownership gate passed against the final Net source.',
            '- [ ] Net ownership checkpoint must be re-earned; the previously cited `da3b6f0b` acceptance could not be tied to a completed baseline artifact, and ownership-specific artifacts inspected during revalidation were compile-only failures.': '- [x] Net ownership checkpoint re-earned by the dedicated hosted ownership gate: residency delegates to Streaming.Api, semantic repair applies through Storage.Api, and no physical Storage types remain in Net.Runtime.',
            '- [ ] network residency calls Streaming.Api;': '- [x] network residency calls Streaming.Api; dedicated hosted ownership gate passed;',
            '- [ ] semantic repair/snapshot paths use Storage.Api logical data;': '- [x] semantic repair/snapshot paths use Storage.Api logical data; dedicated hosted ownership gate passed;'
          }
          changed=False
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1); changed=True
              elif new not in s:
                  raise SystemExit(f'neither old nor new checklist text found: {old}')
          if not changed:
              raise SystemExit('checklist already synchronized')
          p.write_text(s)
          PY
          git rm .github/workflows/zz-sync-net-ownership-checklist-v2.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark accepted Net ownership gates'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git fetch origin ${GITHUB_REF_NAME}
            git rebase origin/${GITHUB_REF_NAME}
            sleep 1
          done
          exit 1
