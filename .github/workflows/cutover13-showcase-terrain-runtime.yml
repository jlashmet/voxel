name: Publish Showcase terrain boundary cut
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-terrain-runtime.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove Showcase Terrain.Runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          import json
          from pathlib import Path

          world_path = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          world = world_path.read_text()
          needle = 'using VoxelEngine.Terrain.Runtime;\n'
          if world.count(needle) != 1:
              raise SystemExit(f'Expected exactly one Terrain.Runtime import, found {world.count(needle)}')
          world = world.replace(needle, '', 1)
          world_path.write_text(world)

          asmdef_path = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          asmdef = json.loads(asmdef_path.read_text())
          refs = asmdef['references']
          if refs.count('VoxelEngine.Terrain.Runtime') != 1:
              raise SystemExit('Expected exactly one Terrain.Runtime asmdef reference')
          refs.remove('VoxelEngine.Terrain.Runtime')
          asmdef_path.write_text(json.dumps(asmdef, indent=2) + '\n')
          PY

          if grep -q 'VoxelEngine.Terrain.Runtime' Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef; then
            echo 'Showcase still references Terrain.Runtime' >&2
            exit 1
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef
          git commit -m 'refactor(showcase): remove Terrain runtime dependency'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
