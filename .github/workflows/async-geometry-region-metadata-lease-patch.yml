name: Versioned region metadata lease one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-region-metadata-lease-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_region_metadata_lease_patch.py
      - name: Static guards
        run: |
          grep -q '_contentRevisions' Assets/VoxelEngine/Storage/Runtime/RegionTable.cs
          grep -q 'TryPinRegionBlockRefs' Assets/VoxelEngine/Storage/Api/IRegionReadSource.cs
          grep -q 'ReleaseRetiredSlot' Assets/VoxelEngine/Storage/Runtime/RegionTable.cs
          grep -q 'RegionMetadataLeasesAreVersionedAndEvictionSafe' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit region metadata lease
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Storage/Api/IRegionReadSource.cs \
                  Assets/VoxelEngine/Storage/Api/PinnedRegionBlockRefs.cs \
                  Assets/VoxelEngine/Storage/Api/PinnedRegionBlockRefs.cs.meta \
                  Assets/VoxelEngine/Storage/Runtime/RegionReadSource.cs \
                  Assets/VoxelEngine/Storage/Runtime/RegionTable.cs \
                  Assets/Tests/EditMode/StorageRenderingReadContractTests.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Add versioned region metadata read leases'
          git push origin HEAD:refactor/async-geometry-pipeline
