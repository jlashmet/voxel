name: Net Runtime namespace cut
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-runtime-namespace-cut.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'VoxelEngine.Net.Client': 'VoxelEngine.Net.Runtime.Client',
              'VoxelEngine.Net.Interest': 'VoxelEngine.Net.Runtime.Interest',
              'VoxelEngine.Net.Protocol': 'VoxelEngine.Net.Runtime.Protocol',
              'VoxelEngine.Net.Server': 'VoxelEngine.Net.Runtime.Server',
              'VoxelEngine.Net.Transport': 'VoxelEngine.Net.Runtime.Transport',
          }
          changed = []
          for root in (Path('Assets'), Path('Packages')):
              for p in root.rglob('*.cs'):
                  s = p.read_text()
                  n = s
                  for old, new in replacements.items():
                      n = n.replace(old, new)
                  if n != s:
                      p.write_text(n)
                      changed.append(str(p))
          if not changed:
              raise SystemExit('no Net namespace references changed')
          print('\n'.join(changed))
          for root in (Path('Assets'), Path('Packages')):
              for p in root.rglob('*.cs'):
                  s = p.read_text()
                  for old in replacements:
                      if old in s:
                          raise SystemExit(f'stale namespace {old} remains in {p}')
          PY
          git rm .github/workflows/net-runtime-namespace-cut.yml
          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets Packages
          git add -u .github/workflows
          git commit -m 'Normalize Net Runtime namespaces'
          git push origin HEAD:${GITHUB_REF_NAME}
