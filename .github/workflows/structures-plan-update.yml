name: Structures plan update

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Record accepted CastleBuilder seam
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()

          old_status = '''| 4 — Structures | **In progress — current** | Storage authoring boundary + `Structures.Api` extraction accepted; canonical authoring/encoding contracts live in `VoxelEngine.Structures.Api`; `Structures.Runtime` assembly created with the allowed dependency set; feature VM/generation/rasterizer/Arch/Bonded/emitters physically moved under `Structures/Runtime` with GUIDs preserved; feature-runtime Storage validation dependencies route through Storage.Api; retained-profile writes route through `Structures.Api.IProfileBlockWriter`; retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; mutable `ProfileBlockStore` is physically under `Structures/Runtime`; stale `VoxelEngine.Core.Features` imports are removed from the WorldGen Voxel adapter; canonical ramp direction bits and first directional Kentridge consumers use Structures.Api; retained-profile logical value/read contract extracted to Storage.Api; Kentridge compatibility seam deleted | cut CastleBuilder orchestration off physical Storage; move CastleBuilder/VoxelBrush/MasonryWeathering/StructureMaterials together under Runtime; finish Runtime namespaces; remove broad Structures assembly |'''
          new_status = '''| 4 — Structures | **In progress — current** | Storage authoring boundary + `Structures.Api` extraction accepted; canonical authoring/encoding contracts live in `VoxelEngine.Structures.Api`; `Structures.Runtime` assembly created with the allowed dependency set; feature VM/generation/rasterizer/Arch/Bonded/emitters physically moved under `Structures/Runtime` with GUIDs preserved; feature-runtime Storage validation dependencies route through Storage.Api; retained-profile writes route through `Structures.Api.IProfileBlockWriter`; retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; mutable `ProfileBlockStore` is physically under `Structures/Runtime`; stale `VoxelEngine.Core.Features` imports are removed from the WorldGen Voxel adapter; CastleBuilder orchestration consumes Storage.Api read/mutation/material-authoring capabilities and no longer accepts physical Storage handles; canonical ramp direction bits and first directional Kentridge consumers use Structures.Api; retained-profile logical value/read contract extracted to Storage.Api; Kentridge compatibility seam deleted | move CastleBuilder/VoxelBrush/MasonryWeathering/StructureMaterials together under Runtime; finish Runtime namespaces; remove broad Structures assembly |'''

          old_gate = '''- Latest accepted code gate: `00f1ddfc89af4fa52aa03c79c4b922bf5a9dd70d` — 382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts two Structures Runtime prerequisites: mutable `ProfileBlockStore` moved from `Core/Features` to `Structures/Runtime` with its Unity GUID preserved, and 28 stale `using VoxelEngine.Core.Features;` imports were removed from the MountingForce WorldGen Voxel adapter after that move exposed them. No compatibility namespace or Runtime dependency was introduced. The preceding accepted gate `dd7d5013c1409d4efe0dbfed3672cb9b5ab13ecd` accepted the `VoxelBrush` Storage-boundary cutover at the same 382/369/13 baseline.'''
          new_gate = '''- Latest accepted code gate: `87f5f5d1033edf31acde14d60b58bea830f203d1` — 382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts the CastleBuilder orchestration boundary cut: `Build`/`BeginBuild` now take Storage.Api `IRegionReadSource`, `IRegionMutationStore`, and `IMaterialAuthoringCatalogue`, `StepBuild` no longer accepts unused `RegionTable`/`BrickPool` handles, and Showcase owns construction of the concrete Storage adapters. CastleBuilder no longer imports `VoxelEngine.Core.Storage`. The preceding accepted gate `00f1ddfc89af4fa52aa03c79c4b922bf5a9dd70d` accepted the `ProfileBlockStore` Runtime move and 28-file WorldGen Core.Features import cleanup at the same 382/369/13 baseline.'''

          old_check = '''- [x] move retained-profile store into Runtime and remove stale WorldGen Core.Features imports\n- [ ] move existing CastleBuilder/etc. under Runtime'''
          new_check = '''- [x] move retained-profile store into Runtime and remove stale WorldGen Core.Features imports\n- [x] cut CastleBuilder orchestration over to Storage.Api capabilities\n- [ ] move existing CastleBuilder/etc. under Runtime'''

          for old, new, label in [
              (old_status, new_status, 'Structures status row'),
              (old_gate, new_gate, 'latest accepted gate'),
              (old_check, new_check, 'Structures checklist'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} exact-match count was {count}, expected 1')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          git rm .github/workflows/structures-plan-update.yml
          git diff --check
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/workflows/structures-plan-update.yml
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted CastleBuilder Storage API seam'
          git push origin HEAD:${{ github.ref_name }}
