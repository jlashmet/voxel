name: Terrain Runtime cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/terrain-runtime-cutover.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Move TerrainGenerator to Terrain.Runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/VoxelEngine/Core/Terrain/TerrainGenerator.cs
          test ! -e Assets/VoxelEngine/Terrain/Runtime
          mkdir -p Assets/VoxelEngine/Terrain/Runtime
          git mv Assets/VoxelEngine/Core/Terrain/TerrainGenerator.cs Assets/VoxelEngine/Terrain/Runtime/TerrainGenerator.cs
          git mv Assets/VoxelEngine/Core/Terrain/TerrainGenerator.cs.meta Assets/VoxelEngine/Terrain/Runtime/TerrainGenerator.cs.meta
          git mv Assets/VoxelEngine/Core/Terrain.meta Assets/VoxelEngine/Terrain/Runtime.meta

          python3 - <<'PY'
          from pathlib import Path
          import json, uuid

          generator = Path('Assets/VoxelEngine/Terrain/Runtime/TerrainGenerator.cs')
          text = generator.read_text()
          old_ns = 'namespace VoxelEngine.Core.Terrain'
          if text.count(old_ns) != 1:
              raise SystemExit('TerrainGenerator old namespace did not match exactly once')
          generator.write_text(text.replace(old_ns, 'namespace VoxelEngine.Terrain.Runtime', 1))

          # Update all source consumers, including fully qualified test calls.
          changed = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  text = path.read_text()
                  updated = text.replace('VoxelEngine.Core.Terrain', 'VoxelEngine.Terrain.Runtime')
                  if updated != text:
                      path.write_text(updated)
                      changed.append(path)

          boundary = Path('Assets/Tests/EditMode/TerrainStorageBoundaryTests.cs')
          text = boundary.read_text()
          old_path = 'root, "Assets", "VoxelEngine", "Core", "Terrain", "TerrainGenerator.cs"'
          new_path = 'root, "Assets", "VoxelEngine", "Terrain", "Runtime", "TerrainGenerator.cs"'
          if text.count(old_path) != 1:
              raise SystemExit('Terrain boundary test source path did not match')
          boundary.write_text(text.replace(old_path, new_path, 1))

          asmdef = {
              'name': 'VoxelEngine.Terrain.Runtime',
              'rootNamespace': 'VoxelEngine.Terrain.Runtime',
              'references': [
                  'VoxelEngine.Terrain.Api',
                  'VoxelEngine.Storage.Api',
                  'VoxelEngine.Foundation',
                  'Unity.Mathematics',
              ],
              'includePlatforms': [],
              'excludePlatforms': [],
              'allowUnsafeCode': False,
              'overrideReferences': False,
              'precompiledReferences': [],
              'autoReferenced': False,
              'defineConstraints': [],
              'versionDefines': [],
              'noEngineReferences': False,
          }
          asm_path = Path('Assets/VoxelEngine/Terrain/Runtime/VoxelEngine.Terrain.Runtime.asmdef')
          asm_path.write_text(json.dumps(asmdef, indent=2) + '\n')
          Path(str(asm_path) + '.meta').write_text(f'fileFormatVersion: 2\nguid: {uuid.uuid4().hex}\n')

          consumers = [
              Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef'),
              Path('Assets/Tests/EditMode/VoxelEngine.Tests.EditMode.asmdef'),
              Path('Assets/Tests/Parity/VoxelEngine.Tests.Parity.asmdef'),
              Path('Assets/VoxelEngine/CI/Editor/VoxelEngine.CI.Editor.asmdef'),
          ]
          for path in consumers:
              obj = json.loads(path.read_text())
              refs = obj.get('references', [])
              if 'VoxelEngine.Terrain.Runtime' not in refs:
                  refs.append('VoxelEngine.Terrain.Runtime')
              obj['references'] = refs
              path.write_text(json.dumps(obj, indent=2) + '\n')

          stale = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  if 'VoxelEngine.Core.Terrain' in path.read_text():
                      stale.append(str(path))
          if stale:
              raise SystemExit('old Core.Terrain source refs remain:\n' + '\n'.join(stale))

          runtime_refs = set(json.loads(asm_path.read_text()).get('references', []))
          engine_refs = {r for r in runtime_refs if r.startswith('VoxelEngine.')}
          allowed = {'VoxelEngine.Terrain.Api', 'VoxelEngine.Storage.Api', 'VoxelEngine.Foundation'}
          if engine_refs != allowed:
              raise SystemExit('Terrain.Runtime engine refs differ from allowed set: ' + ', '.join(sorted(engine_refs)))
          PY

          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets Packages
          git commit -m 'refactor(terrain): move generator into Terrain Runtime'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
