name: Remove Legacy Tree Voxels Once

on:
  push:
    branches:
      - tree-rendering
    paths:
      - .github/workflows/remove-legacy-tree-voxels-once.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10

    steps:
      - name: Checkout tree-rendering
        uses: actions/checkout@v4
        with:
          ref: tree-rendering
          fetch-depth: 0
          clean: true

      - name: Remove legacy voxel tree authoring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_method_body(text: str, signature: str, replacement_body: str) -> str:
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f"signature not found: {signature}")
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f"opening brace not found: {signature}")
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  c = text[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit(f"closing brace not found: {signature}")
              return text[:brace + 1] + replacement_body + text[end:]

          castle = Path('Assets/VoxelEngine/Structures/CastleBuilder.cs')
          text = castle.read_text()
          body = '\n            // Trees are semantic vegetation now. CastleBuilder no longer authors voxel\n            // trunks/crowns; ShowcaseTreePopulation publishes deterministic TreeInstances.\n        '
          text = replace_method_body(text, 'private static void Tree(', body)
          text = replace_method_body(text, 'private static void Pine(', body)
          castle.write_text(text)

          ci = Path('Assets/VoxelEngine/CI/PlayMode/ShowcaseTreeVisualTests.cs')
          ci_text = ci.read_text()
          ci_text = ci_text.replace('LegacyTreeProxyCleanup.Completed', 'ShowcaseTreePopulation.Completed')
          ci_text = ci_text.replace('Legacy tree proxy cleanup', 'Semantic Showcase tree population')
          ci_text = ci_text.replace('legacy tree proxy cleanup', 'semantic Showcase tree population')
          ci.write_text(ci_text)
          PY

          git diff --check
          git diff -- Assets/VoxelEngine/Structures/CastleBuilder.cs Assets/VoxelEngine/CI/PlayMode/ShowcaseTreeVisualTests.cs

      - name: Commit rewrite to tree-rendering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tree-rendering-ci"
          git config user.email "tree-rendering-ci@users.noreply.github.com"
          git add Assets/VoxelEngine/Structures/CastleBuilder.cs Assets/VoxelEngine/CI/PlayMode/ShowcaseTreeVisualTests.cs
          if git diff --cached --quiet; then
            echo "No rewrite required."
            exit 0
          fi
          git commit -m "Remove legacy voxel tree authoring"
          git push origin HEAD:tree-rendering
