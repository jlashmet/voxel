name: Cutover 13 Showcase Runtime reinventory
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-runtime-reinventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 1
      - name: Report remaining Runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('Assets/Scenes/Showcase')
          runtime = re.compile(r'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*')
          files = []
          namespaces = set()
          for path in sorted(root.rglob('*.cs')):
              found = sorted(set(runtime.findall(path.read_text())))
              if found:
                  files.append(path)
                  print(path)
                  for value in found:
                      namespaces.add(value)
                      print('  ', value)
          asm = json.loads((root / 'VoxelEngine.Showcase.asmdef').read_text())
          refs = sorted(r for r in asm.get('references', []) if r.startswith('VoxelEngine.') and r.endswith('.Runtime'))
          print('FILES_WITH_RUNTIME=', len(files))
          print('RUNTIME_NAMESPACE_COUNT=', len(namespaces))
          print('RUNTIME_ASMDEF_REFS=', len(refs))
          for ref in refs:
              print('ASM ', ref)
          PY
