name: Publish ShowcaseWorld API surface cleanup
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/publish-showcase-world-api-surface-cleanup.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove physical Storage types from ShowcaseWorld public surface
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          s=p.read_text()
          s=s.replace('public const int RegionVoxelEdge = 1 << VoxelDimensions.RegionVoxelEdgeLog2;',
                      'public const int RegionVoxelEdge = VoxelGrid.RegionVoxelEdge;',1)
          old='''        public ref RegionTable Table => ref _table;\n        public ref BrickPool Pool => ref _pool;\n'''
          if old not in s: raise SystemExit('ShowcaseWorld Table/Pool escape hatch anchor missing')
          s=s.replace(old,'',1)
          old='''        public MaterialPalette Palette => _palette;\n        public SurfaceCatalogue SurfaceRules => _surfaceCatalogue;\n        public CoatingCatalogue CoatingRules => _coatingCatalogue;\n        public MaterialAdjacencyCatalogue MaterialAdjacencyRules =>\n            _materialAdjacencyCatalogue;\n\n        public VoxelChangeJournal Changes => _changes;\n'''
          new='''        public MaterialPaletteView Palette => _palette;\n        public SurfaceCatalogueView SurfaceRules => _surfaceCatalogue;\n        public CoatingCatalogueView CoatingRules => _coatingCatalogue;\n        public IVoxelChangeSource Changes => _changes;\n'''
          if old not in s: raise SystemExit('ShowcaseWorld public catalogue surface anchor missing')
          s=s.replace(old,new,1)
          forbidden=['public ref RegionTable Table','public ref BrickPool Pool',
                     'public MaterialPalette Palette','public SurfaceCatalogue SurfaceRules',
                     'public CoatingCatalogue CoatingRules','public MaterialAdjacencyCatalogue',
                     'public VoxelChangeJournal Changes']
          bad=[t for t in forbidden if t in s]
          if bad: raise SystemExit('Physical public leakage remains: '+', '.join(bad))
          for token in ['public MaterialPaletteView Palette','public SurfaceCatalogueView SurfaceRules',
                        'public CoatingCatalogueView CoatingRules','public IVoxelChangeSource Changes']:
              if token not in s: raise SystemExit('Missing API-facing public surface: '+token)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git diff --cached --check
          git commit -m 'refactor(showcase): hide physical storage from world API'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
