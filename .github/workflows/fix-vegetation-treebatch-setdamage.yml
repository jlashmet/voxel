name: Fix final Vegetation TreeBatch caller
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/fix-vegetation-treebatch-setdamage.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/CI/PlayMode/TreeBatchRenderingTests.cs')
          s = p.read_text()
          old = 'TreeWorldRuntime.SetDamage(0, 0.70f, false);'
          new = 'TreeWorldRuntime.SetDamage(0, 0.70f, false, float3.zero, float3.zero, -1);'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale SetDamage call, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git diff -- Assets/VoxelEngine/CI/PlayMode/TreeBatchRenderingTests.cs
          git rm .github/workflows/fix-vegetation-treebatch-setdamage.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/CI/PlayMode/TreeBatchRenderingTests.cs
          git commit -m 'fix: pass Vegetation damage context in batch test'
          git push origin HEAD:${{ github.ref_name }}
