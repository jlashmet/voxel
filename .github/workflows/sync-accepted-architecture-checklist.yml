name: Sync accepted architecture checklist

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/sync-accepted-architecture-checklist.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Record already-accepted architecture tasks
        shell: bash
        run: |
          set -euo pipefail
          # This publisher is intentionally one-shot. If anything moved the branch after the
          # workflow-creation push, do nothing rather than replaying stale edits onto a newer head.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "stale checklist sync; current=$(git rev-parse HEAD) event=$GITHUB_SHA"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          plan = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = plan.read_text()

          replacements = {
              '**Implementation branch:** `refactor/system-boundaries-foundation-storage`':
              '**Implementation branch:** `refactor/system-boundaries-finalization-stable`',

              '| 2 — Storage | **In progress** | `Storage.Api` contracts/read views/generation/mutation/snapshot/hash boundaries complete; physical representation and occupancy now live under `Storage.Runtime`; Core storage ownership and Core assembly are deleted; full 384/371/13 baseline accepted | remove remaining direct Storage.Runtime consumers outside Composition/tests/tooling and finish final architecture gate |':
              '| 2 — Storage | **Complete** | `Storage.Api` contracts/read views/generation/mutation/snapshot/hash boundaries complete; physical representation and occupancy live under `Storage.Runtime`; Core storage ownership and Core assembly are deleted; exact-head final static acceptance confirms every production consumer outside Composition is Api-only | none |',

              '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, GpuDebris, VoxelShowcase and ShowcaseMultiplayerSession storage seams are API-only; ShowcaseCatalogue consumes Structures.Api only; mixed-brick capacity and lookdev renderer configuration are Composition-owned; CompactFps consumes Rendering.Api diagnostics; Structures authoring routes through an Api session; VoxelFarTerrain and TerrainLookdev are Runtime-free through subsystem-specific RenderingComposition; TerrainLookdev dead profile-store ceremony removed; empty Tools shells deleted; `ShowcaseTreePopulation` routes world/structure/vegetation access through Composition; `ArchLookdev` routes presentation catalogue, build-budget, sky, and surface-status access through `RenderingComposition`; current Showcase Runtime-coupled source inventory reduced to two files; 387/374/13 baseline preserved | migrate two remaining Showcase concrete Runtime consumers, enable the final production-wide Runtime dependency guard, remove residual Core documentation literals, final dependency report |':
              '| 13 — Composition/Core deletion | **In progress — current** | all concrete Showcase runtime ownership is under `Composition`; `VoxelEngine.Showcase` is Runtime-free; the permanent dependency guard and final dependency report are in place; exact-head static acceptance proves Api/Runtime direction, Composition-only concrete wiring, WorldGen isolation, and zero production `VoxelEngine.Core` references | exact EditMode 387/374/13 acceptance for the final Composition move and final validation closeout |',

              '- Latest accepted code gate: `8780cffe66a0e3e4ba75b524957d00b481ace971`, run `31907252082` — 387 tests, 374 passed, exactly the same 13 known baseline failures with zero C# compiler errors. This accepts `ArchLookdev` routing rendering presentation/build configuration and surface-status access through `RenderingComposition` and reduces the remaining Runtime-coupled Showcase source inventory to two files.':
              '- Latest accepted code gate: `8780cffe66a0e3e4ba75b524957d00b481ace971`, run `31907252082` — 387 tests, 374 passed, exactly the same 13 known baseline failures with zero C# compiler errors. This accepts `ArchLookdev` routing rendering presentation/build configuration and surface-status access through `RenderingComposition` and reduces the remaining Runtime-coupled Showcase source inventory to two files.\n- Latest accepted stable static gate: source `c09dc595211d492f8bb934292367dfd5b4215b4e`, run `31909666042`, static job `95072945213` — exact-head checkout passed the final production dependency graph: no Api -> Runtime edge, no foreign Runtime -> Runtime edge, Composition is the sole production Runtime-wiring exception, Showcase has no Runtime assembly refs, production has no deleted Core reference, Streaming/Net/Rendering directions are final, and semantic WorldGen remains isolated. The exact EditMode job is still pending and is not implied by this static acceptance.',

              '- [ ] all production asmdefs satisfy dependency guard;':
              '- [x] all production asmdefs satisfy dependency guard; exact-head stable static acceptance at `c09dc595211d492f8bb934292367dfd5b4215b4e`, run `31909666042`, static job `95072945213`;',

              '- [ ] Composition is the only runtime-wiring exception.':
              '- [x] Composition is the only runtime-wiring exception; exact-head stable static acceptance at `c09dc595211d492f8bb934292367dfd5b4215b4e`, run `31909666042`, static job `95072945213`.',

              '[ ] every exposed subsystem has one Api directory/assembly\n[ ] no Api references Runtime\n[ ] no Runtime references another subsystem Runtime\n[ ] Composition is the only production Runtime-wiring exception\n[ ] Streaming has no Net reference\n[ ] Net references Streaming.Api, not Streaming.Runtime\n[ ] Rendering references Storage.Api, Tiering.Api, Vegetation.Api only':
              '[x] every exposed subsystem has one Api directory/assembly\n[x] no Api references Runtime\n[x] no Runtime references another subsystem Runtime\n[x] Composition is the only production Runtime-wiring exception\n[x] Streaming has no Net reference\n[x] Net references Streaming.Api, not Streaming.Runtime\n[x] Rendering references Storage.Api, Tiering.Api, Vegetation.Api only',

              '### 0. Guardrails\n\n- [ ] add `VoxelEngineAssemblyBoundaryTests`\n- [ ] convert Constitution determinism scan from Core path to explicit deterministic assembly/path policy\n- [ ] strengthen Kentridge boundary tests':
              '### 0. Guardrails\n\n- [x] add permanent asmdef boundary coverage (`ArchitectureBoundaryGuardTests`)\n- [x] convert Constitution determinism scan from Core path to explicit deterministic assembly/path policy\n- [x] strengthen Kentridge/WorldGen boundary coverage',

              '### 1. Foundation\n\n- [ ] create Foundation assembly\n- [ ] move `IntMath`\n- [ ] update references':
              '### 1. Foundation\n\n- [x] create Foundation assembly\n- [x] move `IntMath`\n- [x] update Foundation references',

              '- [ ] update all existing consumers to Storage.Api\n- [x] move Kentridge vegetation top-surface reads to Storage.Api\n- [ ] remove every foreign Storage.Runtime reference':
              '- [x] update all production consumers to Storage.Api except deliberate Composition ownership\n- [x] move Kentridge vegetation top-surface reads to Storage.Api\n- [x] remove every foreign production Storage.Runtime reference; Composition is the sole deliberate concrete owner/wiring exception',

              '- [ ] centralize concrete runtime wiring/disposal\n- [ ] remove scattered scene Runtime coupling where practical':
              '- [x] centralize concrete runtime wiring/disposal under Composition; the Composition-owned Showcase world/lifetimes own and dispose concrete subsystem state\n- [x] remove scattered scene Runtime coupling; exact-head static acceptance confirms `VoxelEngine.Showcase` has no Runtime assembly references',

              '- [ ] remove all architecture-test temporary exceptions\n- [ ] repository-wide zero-match check for `VoxelEngine.Core`':
              '- [x] remove architecture-test temporary exceptions; the permanent guard has only explicit non-production test/CI/Editor policy plus the single Composition production exception\n- [x] zero production source/asmdef matches for `VoxelEngine.Core`; exact-head static acceptance scans Assets/Packages production code while docs/tests intentionally retain the deleted name as history/guard vocabulary',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected plan text not found:\n' + old)
              text = text.replace(old, new, 1)

          plan.write_text(text)

          report = Path('docs/ARCHITECTURE_DEPENDENCY_REPORT.md')
          r = report.read_text()
          r = r.replace('**Verified code SHA:** `6f872e30763b57abd3af5d9282de0af50e3a93c5`  ',
                        '**Verified code SHA:** `c09dc595211d492f8bb934292367dfd5b4215b4e`  ', 1)
          r = r.replace('**Static acceptance:** `Stable final architecture acceptance` run `31909538430`, `static-boundary` job — passed  ',
                        '**Static acceptance:** `Stable final architecture acceptance` run `31909666042`, static job `95072945213` — passed  ', 1)
          report.write_text(r)
          PY

          git diff --check
          git rm .github/workflows/sync-accepted-architecture-checklist.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md docs/ARCHITECTURE_DEPENDENCY_REPORT.md
          git commit -m 'docs(architecture): mark accepted finalization tasks'
          git push origin HEAD:refactor/system-boundaries-finalization-stable
