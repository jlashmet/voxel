name: Cutover 13 Runtime reinventory 3
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-runtime-reinventory-3.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a5b486ca0fb238bf59b7b4b8f65e636d57746e7
          fetch-depth: 1
      - name: Report remaining Showcase Runtime coupling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('Assets/Scenes/Showcase')
          runtime = re.compile(r'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*')
          files=[]; storage=[]; namespaces=set()
          for path in sorted(root.rglob('*.cs')):
              text=path.read_text()
              found=sorted(set(runtime.findall(text)))
              if found:
                  files.append(path)
                  print(path)
                  for value in found:
                      namespaces.add(value)
                      print('  ', value)
              if 'VoxelEngine.Storage.Runtime' in text:
                  storage.append(path)
          asm=json.loads((root/'VoxelEngine.Showcase.asmdef').read_text())
          refs=sorted(r for r in asm.get('references',[]) if r.startswith('VoxelEngine.') and r.endswith('.Runtime'))
          print('FILES_WITH_RUNTIME=', len(files))
          print('FILES_WITH_STORAGE_RUNTIME=', len(storage))
          for p in storage: print('STORAGE ', p)
          print('RUNTIME_NAMESPACE_COUNT=', len(namespaces))
          print('RUNTIME_ASMDEF_REFS=', len(refs))
          for ref in refs: print('ASM ', ref)
          PY
