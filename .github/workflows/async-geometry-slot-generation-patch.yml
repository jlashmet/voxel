name: Surface chunk slot generation one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-slot-generation-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_slot_generation_patch.py
      - name: Static guards
        run: |
          test -f Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceChunkSlot.cs
          grep -q 'SlotGeneration = buildSlot.Generation' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'private bool BuildOwnsCurrentSlot' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'RetireSlot(chunk)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'SurfaceSlotGenerationGuardsRecycledResidency' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceChunkSlot.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceChunkSlot.cs.meta \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Guard geometry publication with surface slot generations'
          git push origin HEAD:refactor/async-geometry-pipeline
