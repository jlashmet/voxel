name: Drain stale Net queue
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-queue-drain.yml]
permissions:
  actions: write
  contents: read
jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN: '31891320069'
        shell: bash
        run: |
          set -euo pipefail
          page=1
          while :; do
            json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs?branch=refactor/system-boundaries-foundation-storage&status=queued&per_page=100&page=$page")"
            count="$(jq '.workflow_runs | length' <<<"$json")"
            [[ "$count" -gt 0 ]] || break
            jq -r '.workflow_runs[].id' <<<"$json" | while read -r id; do
              if [[ "$id" == "$KEEP_RUN" ]]; then
                echo "preserving caller publisher $id"
                continue
              fi
              echo "cancelling stale queued run $id"
              curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
            done
            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done
