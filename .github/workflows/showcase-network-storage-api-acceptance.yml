name: Showcase network Storage API acceptance
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7c23caaee6447c2746c101d66f89b4092682c00
          fetch-depth: 1
      - name: Verify network presentation bridge is Storage.Api-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path('Assets/Scenes/Showcase/ShowcaseNetworkWorldBridge.cs').read_text()
          partial = Path('Assets/Scenes/Showcase/ShowcaseWorld.StorageBridge.cs').read_text()
          for name, text in [('ShowcaseNetworkWorldBridge', bridge), ('ShowcaseWorld.StorageBridge', partial)]:
              forbidden = ['VoxelEngine.Storage.Runtime', 'RegionTable', 'BrickPool', 'BrickRef', 'VoxelAccess', 'VoxelChangeJournal', 'VoxelEngine.Core']
              bad = [token for token in forbidden if token in text]
              if bad:
                  raise SystemExit(f'{name} retains Runtime/physical token: ' + ', '.join(bad))
          required_bridge = ['using VoxelEngine.Storage.Api;', 'world.IsRegionDirty', 'world.PublishRegionChange', 'VoxelChangeKind']
          missing = [token for token in required_bridge if token not in bridge]
          if missing:
              raise SystemExit('network bridge missing logical Storage seam: ' + ', '.join(missing))
          required_partial = ['using VoxelEngine.Storage.Api;', 'IsRegionDirty', 'PublishRegionChange', 'VoxelChangeKind']
          missing = [token for token in required_partial if token not in partial]
          if missing:
              raise SystemExit('ShowcaseWorld storage bridge partial missing API seam: ' + ', '.join(missing))
          print('Showcase network Storage API static boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7c23caaee6447c2746c101d66f89b4092682c00
          clean: false
          fetch-depth: 1
      - name: Reset pinned network bridge candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard b7c23caaee6447c2746c101d66f89b4092682c00
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ShowcaseNetworkStorageApi"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-network-storage-api-b7c23caa
          path: Artifacts/ShowcaseNetworkStorageApi/
          if-no-files-found: warn
          retention-days: 14
