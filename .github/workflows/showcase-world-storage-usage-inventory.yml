name: ShowcaseWorld storage usage inventory
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-world-storage-usage-inventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6b84917019b98e306a3dc8b24b85bbd67a8a2a9
          fetch-depth: 1
      - name: Inventory physical storage symbols
        shell: bash
        run: |
          set -euo pipefail
          f=Assets/Scenes/Showcase/ShowcaseWorld.cs
          echo '=== physical storage/catalogue usages ==='
          grep -n -E 'RegionTable|BrickPool|RegionReadSource|RegionMutationStore|RegionSnapshotMutationStore|RegionResidencyStore|VoxelChangeJournal|MaterialPalette|SurfaceCatalogue|CoatingCatalogue|MaterialAdjacencyCatalogue|VoxelAccess|VoxelDimensions|OccupancyMask|MipBuilder' "$f" || true
          echo '=== public Table/Pool consumers in Showcase ==='
          grep -R -n --include='*.cs' -E '\.(Table|Pool)\b|ref [A-Za-z0-9_]+\.Table|in [A-Za-z0-9_]+\.Pool' Assets/Scenes/Showcase | grep -v 'ShowcaseWorld.cs' || true
          echo '=== Palette/SurfaceRules/CoatingRules/Adjacency consumers ==='
          grep -R -n --include='*.cs' -E '\.(Palette|SurfaceRules|CoatingRules|MaterialAdjacencyRules)\b' Assets/Scenes/Showcase | grep -v 'ShowcaseWorld.cs' || true
          echo '=== Changes consumers ==='
          grep -R -n --include='*.cs' '\.Changes\b' Assets/Scenes/Showcase | grep -v 'ShowcaseWorld.cs' || true
          echo '=== direct fields around generation lifecycle ==='
          grep -n -E '_table|_pool|_readSource|_mutationStore|_snapshotMutationStore|_residencyStore|_palette|_surfaceCatalogue|_coatingCatalogue|_materialAdjacencyCatalogue|_changes' "$f" || true
