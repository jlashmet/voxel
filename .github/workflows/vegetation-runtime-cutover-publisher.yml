name: Vegetation Runtime cutover publisher
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

          mkdir -p Assets/VoxelEngine/Vegetation/Runtime
          git mv Assets/VoxelEngine/Vegetation/ProceduralTreeDamageService.cs Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs
          git mv Assets/VoxelEngine/Vegetation/ProceduralTreeDamageService.cs.meta Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs.meta
          git mv Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeSkeletonBuilder.cs
          git mv Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs.meta Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeSkeletonBuilder.cs.meta
          git mv Assets/VoxelEngine/Vegetation/TreeWorldState.cs Assets/VoxelEngine/Vegetation/Runtime/TreeWorldState.cs
          git mv Assets/VoxelEngine/Vegetation/TreeWorldState.cs.meta Assets/VoxelEngine/Vegetation/Runtime/TreeWorldState.cs.meta

          python3 - <<'PY'
          from pathlib import Path
          import json, re, uuid

          root = Path('.')

          def write_meta(path, folder=False):
              guid = uuid.uuid4().hex
              if folder:
                  Path(path).write_text(
                      f"fileFormatVersion: 2\nguid: {guid}\nfolderAsset: yes\nDefaultImporter:\n  externalObjects: {{}}\n  userData: \n  assetBundleName: \n  assetBundleVariant: \n")
              else:
                  Path(path).write_text(f"fileFormatVersion: 2\nguid: {guid}\n")

          # Runtime folder + assembly.
          runtime_meta = Path('Assets/VoxelEngine/Vegetation/Runtime.meta')
          if not runtime_meta.exists():
              write_meta(runtime_meta, True)
          runtime_asm = Path('Assets/VoxelEngine/Vegetation/Runtime/VoxelEngine.Vegetation.Runtime.asmdef')
          runtime_asm.write_text(json.dumps({
              'name':'VoxelEngine.Vegetation.Runtime',
              'rootNamespace':'VoxelEngine.Vegetation.Runtime',
              'references':['VoxelEngine.Vegetation.Api','Unity.Mathematics'],
              'includePlatforms':[], 'excludePlatforms':[], 'allowUnsafeCode':False,
              'overrideReferences':False, 'precompiledReferences':[],
              'autoReferenced':False, 'defineConstraints':[], 'versionDefines':[],
              'noEngineReferences':False
          }, indent=2) + '\n')
          write_meta(str(runtime_asm) + '.meta')

          # TreeWorldState keeps mutation/state in Runtime, while an Api read adapter is registered.
          p = Path('Assets/VoxelEngine/Vegetation/Runtime/TreeWorldState.cs')
          s = p.read_text()
          s = s.replace('namespace VoxelEngine.Core.Vegetation', 'namespace VoxelEngine.Vegetation.Runtime')
          s, n = re.subn(
              r'    public readonly struct TreeBranchCutEvent\n.*?(?=    /// <summary>\n    /// Authoritative semantic state)',
              '', s, flags=re.S)
          assert n == 1, f'event vocabulary block count={n}'
          s, n = re.subn(
              r'        public struct TreeDamageState\n        \{.*?        \}\n\n        private const float RootQuantizationMetres',
              '        private const float RootQuantizationMetres', s, flags=re.S)
          assert n == 1, f'nested damage state count={n}'
          old = '''                    s_Damage.Add(new TreeDamageState\n                    {\n                        FoliageHealth = 1f,\n                        Severed = false,\n                    });'''
          assert old in s
          s = s.replace(old, '                    s_Damage.Add(new TreeDamageState(1f, false));')
          old = '''            s_Damage[index] = new TreeDamageState\n            {\n                FoliageHealth = nextFoliageHealth,\n                Severed = nextSevered,\n            };'''
          assert old in s
          s = s.replace(old, '            s_Damage[index] = new TreeDamageState(nextFoliageHealth, nextSevered);')
          adapter = '''\n    internal sealed class TreeWorldReadSource : ITreeWorldReadSource\n    {\n        internal static readonly TreeWorldReadSource Instance = new();\n\n        public IReadOnlyList<TreeInstance> Instances => TreeWorldState.Instances;\n        public IReadOnlyList<TreeDamageState> Damage => TreeWorldState.Damage;\n        public int Version => TreeWorldState.Version;\n        public int DamageVersion => TreeWorldState.DamageVersion;\n\n        public event Action SnapshotChanged\n        {\n            add => TreeWorldState.SnapshotChanged += value;\n            remove => TreeWorldState.SnapshotChanged -= value;\n        }\n        public event Action<TreeBranchCutEvent> BranchCut\n        {\n            add => TreeWorldState.BranchCut += value;\n            remove => TreeWorldState.BranchCut -= value;\n        }\n        public event Action<TreeDamageChangedEvent> DamageChanged\n        {\n            add => TreeWorldState.DamageChanged += value;\n            remove => TreeWorldState.DamageChanged -= value;\n        }\n        public event Action<TreeSeveredEvent> TreeSevered\n        {\n            add => TreeWorldState.TreeSevered += value;\n            remove => TreeWorldState.TreeSevered -= value;\n        }\n\n        public IReadOnlyCollection<int> RemovedBranches(int treeIndex) =>\n            TreeWorldState.RemovedBranches(treeIndex);\n\n        public TreeSkeletonSnapshot SkeletonFor(int treeIndex) =>\n            ProceduralTreeDamageService.SkeletonFor(treeIndex);\n\n        public TreeSkeletonSnapshot SkeletonFor(in TreeInstance instance) =>\n            ProceduralTreeSkeletonBuilder.Generate(in instance);\n\n        [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.SubsystemRegistration)]\n        private static void RegisterForPlaySession() =>\n            TreeWorldReadRegistry.Register(Instance);\n    }\n'''
          idx = s.rfind('\n}')
          assert idx > 0
          s = s[:idx] + adapter + s[idx:]
          p.write_text(s)

          # Skeleton builder owns mutable construction state; Api exposes the immutable snapshot.
          p = Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeSkeletonBuilder.cs')
          s = p.read_text().replace('namespace VoxelEngine.Core.Vegetation', 'namespace VoxelEngine.Vegetation.Runtime')
          start = s.index('    public struct TreeBranchSegment')
          end = s.index('    public static class ProceduralTreeSkeletonBuilder')
          build_state = '''    internal sealed class TreeSkeletonBuildState\n    {\n        public readonly List<TreeBranchSegment> Branches = new(256);\n        public readonly List<TreeLeafAnchor> Leaves = new(768);\n        public TreeSpeciesProfile Profile;\n        public float Height;\n        public int[] BranchParents;\n        public int[] LeafParents;\n    }\n\n'''
          s = s[:start] + build_state + s[end:]
          s = s.replace('public static ProceduralTreeSkeleton Generate(in TreeInstance instance)',
                        'public static TreeSkeletonSnapshot Generate(in TreeInstance instance)')
          s = s.replace('var skeleton = new ProceduralTreeSkeleton { Profile = profile };',
                        'var skeleton = new TreeSkeletonBuildState { Profile = profile };')
          old = '''            ResolveTopology(skeleton);\n            return skeleton;'''
          assert old in s
          s = s.replace(old, '''            ResolveTopology(skeleton);\n            return new TreeSkeletonSnapshot(\n                skeleton.Branches.ToArray(), skeleton.Leaves.ToArray(), skeleton.Profile,\n                skeleton.Height, skeleton.BranchParents, skeleton.LeafParents);''')
          start = s.index('        public static void ResolveRemovedBranches')
          end = s.index('        private static void GrowBranch')
          s = s[:start] + s[end:]
          s = s.replace('ProceduralTreeSkeleton skeleton', 'TreeSkeletonBuildState skeleton')
          # Contains was used only by the removed public topology helper.
          s = re.sub(r'\n        private static bool Contains\(IReadOnlyCollection<int> values, int value\)\n        \{.*?\n        \}\n', '\n', s, flags=re.S)
          p.write_text(s)

          # Damage service consumes immutable snapshots and Api topology helpers.
          p = Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs')
          s = p.read_text().replace('namespace VoxelEngine.Core.Vegetation', 'namespace VoxelEngine.Vegetation.Runtime')
          s = re.sub(r'\bProceduralTreeSkeleton\b', 'TreeSkeletonSnapshot', s)
          s = s.replace('TreeWorldState.TreeDamageState', 'TreeDamageState')
          s = s.replace('ProceduralTreeSkeletonBuilder.IsBranchRemoved', 'TreeSkeletonTopology.IsBranchRemoved')
          s = s.replace('skeleton.BranchParents.Length', 'skeleton.BranchParents.Count')
          s = s.replace('skeleton.LeafParents.Length', 'skeleton.LeafParents.Count')
          p.write_text(s)

          # Rendering consumes Api only.
          rendering_dir = Path('Assets/VoxelEngine/Rendering/Vegetation')
          for p in rendering_dir.glob('*.cs'):
              s = p.read_text()
              s = s.replace('using VoxelEngine.Core.Vegetation;\n', '')
              s = s.replace('TreeWorldState.TreeDamageState', 'TreeDamageState')
              s = re.sub(r'\bProceduralTreeSkeleton\b', 'TreeSkeletonSnapshot', s)
              s = s.replace('ProceduralTreeSkeletonBuilder.ResolveRemovedBranches', 'TreeSkeletonTopology.ResolveRemovedBranches')
              s = s.replace('ProceduralTreeSkeletonBuilder.IsBranchRemoved', 'TreeSkeletonTopology.IsBranchRemoved')
              s = s.replace('ProceduralTreeSkeletonBuilder.Generate', 'TreeWorldReadRegistry.Current.SkeletonFor')
              s = s.replace('ProceduralTreeDamageService.SkeletonFor', 'TreeWorldReadRegistry.Current.SkeletonFor')
              s = s.replace('TreeWorldState.', 'TreeWorldReadRegistry.Current.')
              p.write_text(s)

          # Showcase and CI are composition/tooling consumers of Runtime; migrate namespace/types.
          consumer_roots = [Path('Assets/Scenes/Showcase'), Path('Assets/VoxelEngine/CI')]
          for base in consumer_roots:
              for p in base.rglob('*.cs'):
                  s = p.read_text()
                  if 'VoxelEngine.Core.Vegetation' in s:
                      s = s.replace('using VoxelEngine.Core.Vegetation;', 'using VoxelEngine.Vegetation.Runtime;')
                  s = s.replace('TreeWorldState.TreeDamageState', 'TreeDamageState')
                  s = re.sub(r'\bProceduralTreeSkeleton\b', 'TreeSkeletonSnapshot', s)
                  s = s.replace('ProceduralTreeSkeletonBuilder.ResolveRemovedBranches', 'TreeSkeletonTopology.ResolveRemovedBranches')
                  s = s.replace('ProceduralTreeSkeletonBuilder.IsBranchRemoved', 'TreeSkeletonTopology.IsBranchRemoved')
                  p.write_text(s)

          # Assembly references: Rendering Api-only; composition/tooling may consume Runtime.
          asmdef_paths = [
              Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef'),
              Path('Assets/VoxelEngine/CI/Editor/VoxelEngine.CI.Editor.asmdef'),
              Path('Assets/VoxelEngine/CI/PlayMode/VoxelEngine.CI.PlayMode.asmdef'),
          ]
          for p in asmdef_paths:
              data = json.loads(p.read_text())
              refs = [r for r in data.get('references', []) if r != 'VoxelEngine.Vegetation']
              if 'VoxelEngine.Vegetation.Api' not in refs:
                  refs.append('VoxelEngine.Vegetation.Api')
              if 'VoxelEngine.Vegetation.Runtime' not in refs:
                  refs.append('VoxelEngine.Vegetation.Runtime')
              data['references'] = refs
              p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('Assets/VoxelEngine/Rendering/VoxelEngine.Rendering.asmdef')
          data = json.loads(p.read_text())
          data['references'] = [r for r in data.get('references', []) if r != 'VoxelEngine.Vegetation']
          if 'VoxelEngine.Vegetation.Api' not in data['references']:
              data['references'].append('VoxelEngine.Vegetation.Api')
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git rm Assets/VoxelEngine/Vegetation/VoxelEngine.Vegetation.asmdef Assets/VoxelEngine/Vegetation/VoxelEngine.Vegetation.asmdef.meta
          git rm .github/workflows/vegetation-cutover-inventory.yml .github/workflows/vegetation-runtime-cutover-publisher.yml

          # Boundary validations before commit.
          test -z "$(grep -RIl 'VoxelEngine.Core.Vegetation' Assets Packages --include='*.cs' --include='*.asmdef' || true)"
          test -z "$(grep -RIlE 'TreeWorldState|ProceduralTreeDamageService|ProceduralTreeSkeletonBuilder|ProceduralTreeSkeleton' Assets/VoxelEngine/Rendering --include='*.cs' || true)"
          ! grep -q 'VoxelEngine.Vegetation.Runtime' Assets/VoxelEngine/Rendering/VoxelEngine.Rendering.asmdef
          ! grep -q 'VoxelEngine.Vegetation"' Assets/VoxelEngine/Rendering/VoxelEngine.Rendering.asmdef
          grep -q 'VoxelEngine.Vegetation.Api' Assets/VoxelEngine/Rendering/VoxelEngine.Rendering.asmdef
          test ! -e Assets/VoxelEngine/Vegetation/VoxelEngine.Vegetation.asmdef
          test -e Assets/VoxelEngine/Vegetation/Runtime/VoxelEngine.Vegetation.Runtime.asmdef

          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation Assets/VoxelEngine/Rendering Assets/Scenes/Showcase Assets/VoxelEngine/CI
          git add -u .github/workflows
          git commit -m 'Split Vegetation runtime and presentation API'
          git push origin HEAD:${{ github.ref_name }}
