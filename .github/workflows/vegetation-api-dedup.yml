name: Vegetation API ownership cleanup
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 - <<'PY'
          from pathlib import Path

          skeleton = Path('Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs')
          s = skeleton.read_text()
          start = s.index('    public struct TreeBranchSegment')
          end = s.index('    /// <summary>\n    /// Render-independent deterministic tree skeleton.', start)
          s = s[:start] + s[end:]
          skeleton.write_text(s)

          world = Path('Assets/VoxelEngine/Vegetation/TreeWorldState.cs')
          s = world.read_text()
          start = s.index('    public readonly struct TreeBranchCutEvent')
          end = s.index('    /// <summary>\n    /// Authoritative semantic state', start)
          s = s[:start] + s[end:]
          start = s.index('        public struct TreeDamageState')
          end = s.index('        private const float RootQuantizationMetres', start)
          s = s[:start] + s[end:]
          old = '''                    s_Damage.Add(new TreeDamageState\n                    {\n                        FoliageHealth = 1f,\n                        Severed = false,\n                    });'''
          new = '                    s_Damage.Add(new TreeDamageState(1f, false));'
          if old not in s:
              raise SystemExit('missing initial TreeDamageState initializer')
          s = s.replace(old, new, 1)
          old = '''            s_Damage[index] = new TreeDamageState\n            {\n                FoliageHealth = nextFoliageHealth,\n                Severed = nextSevered,\n            };'''
          new = '            s_Damage[index] = new TreeDamageState(nextFoliageHealth, nextSevered);'
          if old not in s:
              raise SystemExit('missing updated TreeDamageState initializer')
          s = s.replace(old, new, 1)
          world.write_text(s)
          PY
          grep -RIn 'public struct TreeBranchSegment\|public struct TreeLeafAnchor\|public readonly struct TreeBranchCutEvent\|public readonly struct TreeDamageChangedEvent\|public readonly struct TreeSeveredEvent\|public struct TreeDamageState' Assets/VoxelEngine/Vegetation --include='*.cs' | grep -v '/Api/' && exit 1 || true
          git rm .github/workflows/vegetation-api-dedup.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs Assets/VoxelEngine/Vegetation/TreeWorldState.cs
          git add -u .github/workflows
          git commit -m 'Use Vegetation Api as presentation contract owner'
          git push origin HEAD:${{ github.ref_name }}
