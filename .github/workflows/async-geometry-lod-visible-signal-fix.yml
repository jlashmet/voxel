name: Patch async geometry LOD visible-signal diagnostics

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-lod-visible-signal-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Require real voxel draws before accepting stable capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/PlayMode/LodRenderingTests.cs')
          text = p.read_text()
          old = '                        bool substantial = candidate.EdgeCount > 40;'
          new = '''                        // Sky/terrain presentation can have stable edges even when the current\n                        // voxel LOD has published nothing. A capture is only eligible once the\n                        // production surface pass reports at least one ready voxel draw.\n                        bool substantial = candidate.EdgeCount > 40\n                                        && metrics.VisibleSolidChunks > 0;'''
          if text.count(old) != 1:
              raise SystemExit('stable capture substantial predicate mismatch')
          text = text.replace(old, new, 1)

          old = '''                    Assert.Greater(metrics.VisibleSolidChunks, 0,\n                        $\"LOD step {band.step} produced no visible voxel geometry.\");'''
          new = '''                    Assert.Greater(metrics.VisibleSolidChunks, 0,\n                        $\"LOD step {band.step} produced no visible voxel geometry; \"\n                      + $\"known={metrics.SolidKnownChunks} resident={metrics.SolidResidentChunks} \"\n                      + $\"dirty={metrics.SolidDirtyChunks} missing={metrics.MissingVisibleSolidChunks} \"\n                      + $\"jobs={metrics.RunningSolidJobs} pendingUpload={metrics.SolidPendingUploadBytes} \"\n                      + $\"completed={metrics.CompletedSolidBuilds} uploaded={metrics.UploadedGeometryBytes} \"\n                      + $\"arena={metrics.SolidArenaUsedBytes}/{metrics.SolidArenaCommittedBytes}B \"\n                      + $\"leases={metrics.SolidArenaActiveLeases} \"\n                      + $\"arenaFailures={metrics.SolidArenaAllocationFailures} \"\n                      + $\"pressureEvictions={metrics.SolidArenaPressureEvictions}.\");'''
          if text.count(old) != 1:
              raise SystemExit('visible assert mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit diagnostics and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-lod-visible-signal-fix.yml
          git add Assets/Tests/PlayMode/LodRenderingTests.cs
          git commit -m "test(lod): require real voxel draws for stable capture"
          git push origin HEAD:refactor/async-geometry-pipeline
