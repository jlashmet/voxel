name: Sync proven architecture checklist tasks

on:
  push:
    branches: [refactor/system-boundaries-finalization-clean]
    paths: [.github/workflows/refactor-sync-proven-checklist.yml]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-clean
          fetch-depth: 0
      - name: Mark already accepted tasks complete
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-clean
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = path.read_text()

          replacements = {
              '- [ ] No source outside `Storage/Runtime` imports their namespaces.': '- [x] No non-Composition production source imports Storage.Runtime representation namespaces; Composition is the deliberate concrete owner/wiring root. Final static closure accepted at source `2c451f2759f4c04649eeab3dba88edc56efd2c46`, run `31910012496`.',
              '- [ ] Architecture guard has no Storage.Runtime foreign-reference exception.': '- [x] Architecture guard has no Storage.Runtime foreign-reference exception; the permanent foreign-Runtime rule is explicit and has no migration allowlist.',
              '- [ ] all production asmdefs satisfy dependency guard;': '- [x] all production asmdefs satisfy dependency guard; final static closure accepted at source `2c451f2759f4c04649eeab3dba88edc56efd2c46`, run `31910012496`;',
              '- [ ] Composition is the only runtime-wiring exception.': '- [x] Composition is the only runtime-wiring exception; final static closure accepted at source `2c451f2759f4c04649eeab3dba88edc56efd2c46`, run `31910012496`.',
              '[ ] every exposed subsystem has one Api directory/assembly': '[x] every exposed subsystem has one Api directory/assembly',
              '[ ] Streaming has no Net reference': '[x] Streaming has no Net reference',
              '[ ] Net references Streaming.Api, not Streaming.Runtime': '[x] Net references Streaming.Api, not Streaming.Runtime',
              '[ ] Rendering references Storage.Api, Tiering.Api, Vegetation.Api only': '[x] Rendering references Storage.Api, Tiering.Api, Vegetation.Api only',
              '- [ ] create Foundation assembly': '- [x] create Foundation assembly',
              '- [ ] move `IntMath`': '- [x] move `IntMath`',
              '- [ ] update references': '- [x] update references',
              '- [ ] remove all architecture-test temporary exceptions': '- [x] remove all architecture-test temporary exceptions',
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('Checklist entry not found: ' + old)

          marker = '- Latest accepted final static closure:'
          detail = '- Final explicit dependency assertions verified on the clean branch: `Streaming.Runtime` has no Net edge; `Net.Runtime` references `Streaming.Api` and not Streaming.Runtime; `Rendering.Runtime` engine dependencies are Storage.Api, Tiering.Api and Vegetation.Api only.\n'
          if detail not in text:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('Static closure marker missing')
              end = text.find('\n', pos)
              text = text[:end+1] + detail + text[end+1:]

          path.write_text(text)
          PY
          git diff --check
          git rm .github/workflows/refactor-sync-proven-checklist.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs(architecture): mark proven final tasks complete'
          git pull --rebase origin refactor/system-boundaries-finalization-clean
          git push origin HEAD:refactor/system-boundaries-finalization-clean
