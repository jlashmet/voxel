name: Fix coarse faceted source step

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/fix-faceted-source-step.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded source-step wiring
        run: python3 .github/scripts/fix_faceted_source_step.py
      - name: Remove temporary patch scaffolding
        run: git rm .github/scripts/fix_faceted_source_step.py .github/workflows/fix-faceted-source-step.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Fix coarse faceted geometry source stride'
          git push origin HEAD:refactor/async-geometry-pipeline
