name: Arena backpressure runtime-gate one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-arena-backpressure-gate-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded arena-pressure patch
        run: python3 .github/scripts/async_geometry_arena_backpressure_gate_patch.py
      - name: Static guards
        run: |
          grep -q 'public int MaxActiveLeases' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceGeometryArena.cs
          grep -q 'SolidArenaActiveLeases' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'SolidArenaMaxActiveLeases' Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderBridge.cs
          grep -q 'ArenaPressureDelaysConvergenceWithoutGrowingBuffersOrOpeningHoles' Assets/Tests/PlayMode/AsyncGeometryStressTests.cs
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceGeometryArena.cs').read_text()
          acquire = s[s.index('public bool TryAcquire'):s.index('public void Release')]
          assert 'new ComputeBuffer' not in acquire
          PY
      - name: Commit arena backpressure gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceGeometryArena.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderBridge.cs \
                  Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  Assets/Tests/PlayMode/AsyncGeometryStressTests.cs
          git commit -m 'Gate solid arena backpressure without buffer growth'
          git fetch origin refactor/async-geometry-pipeline
          git rebase origin/refactor/async-geometry-pipeline
          git push origin HEAD:refactor/async-geometry-pipeline
