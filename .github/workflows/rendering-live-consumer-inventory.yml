name: Rendering live consumer inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-live-consumer-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== PHYSICAL_CLASS_CONSUMERS ==='
          for sym in ProbeCache VoxelGpuBuffers; do
            echo "--- $sym"
            grep -RIn "\b${sym}\b" Assets Packages --include='*.cs' | grep -v "Assets/VoxelEngine/Rendering/.*${sym}\.cs" || true
          done
          echo '=== CATALOGUE_MEMBER_USE ==='
          grep -RInE 'Palette\.|palette\.|Catalogue\.|catalogue\.|Coatings\.|coatings\.' Assets/VoxelEngine/Rendering --include='*.cs' | grep -E 'GetDefaultSurfaceStyle|Get\(|Version|CatalogueHash|IsRegistered|AllowsCoating|GetHardness|GetDestructionClass|Displacement' | sort || true
          echo '=== CHANGE_JOURNAL_USE ==='
          grep -RInE 'VoxelChangeJournal|_journal\.|Changes\.' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
          echo '=== CORE_GRID_SYMBOLS ==='
          grep -RInE 'VoxelDimensions\.(MaterialEmpty|VoxelsPerBrick|BricksPerRegion|RegionEdge|RegionEdgeMask|RegionEdgeLog2|BrickEdgeLog2|BrickEdgeMask)' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
