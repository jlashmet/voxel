name: Edits Runtime helper move publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Move Runtime-safe Edits helpers
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

          for name in AllocationBudget BrushExpansion BuildBrushes DeterministicRandom RawBatchExpansion; do
            git mv "Assets/VoxelEngine/Core/Edits/${name}.cs" "Assets/VoxelEngine/Edits/Runtime/${name}.cs"
            git mv "Assets/VoxelEngine/Core/Edits/${name}.cs.meta" "Assets/VoxelEngine/Edits/Runtime/${name}.cs.meta"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          runtime = Path('Assets/VoxelEngine/Edits/Runtime')

          # AllocationBudget and DeterministicRandom are already Storage-independent.
          for name in ('AllocationBudget.cs', 'DeterministicRandom.cs'):
              p = runtime / name
              text = p.read_text()
              old = 'namespace VoxelEngine.Core.Edits\n'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: namespace count {text.count(old)}')
              text = text.replace(old, 'namespace VoxelEngine.Edits.Runtime\n', 1)
              text = text.replace('using VoxelEngine.Edits.Api;\n', '')
              p.write_text(text)

          # BrushExpansion never read table/pool; make its compatibility expansion purely semantic.
          p = runtime / 'BrushExpansion.cs'
          text = p.read_text()
          text = text.replace('using VoxelEngine.Core.Storage;\n', 'using VoxelEngine.Storage.Api;\n')
          text = text.replace('namespace VoxelEngine.Core.Edits\n', 'namespace VoxelEngine.Edits.Runtime\n', 1)
          old = 'public static NativeList<int3> Expand(in BrickPool pool, in RegionTable table, AlterationEvent evt)'
          if text.count(old) != 1: raise SystemExit('BrushExpansion Expand signature mismatch')
          text = text.replace(old, 'public static NativeList<int3> Expand(AlterationEvent evt)', 1)
          old = '''        public static NativeList<int3> ExpandTyped(\n            in BrickPool pool,\n            in RegionTable table,\n            byte shapeType,'''
          new = '''        public static NativeList<int3> ExpandTyped(\n            byte shapeType,'''
          if text.count(old) != 1: raise SystemExit('BrushExpansion ExpandTyped signature mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('VoxelDimensions.RegionEdge', 'VoxelReadGrid.BlocksPerRegionEdge')
          text = text.replace('Compatibility expansion helper', 'Deterministic expansion helper')
          p.write_text(text)

          # BuildBrushes' legacy TryApply did not mutate its BrickPool and has no callers. Remove it
          # rather than preserving a misleading physical-Storage compatibility signature.
          p = runtime / 'BuildBrushes.cs'
          text = p.read_text()
          text = text.replace('using System.Runtime.CompilerServices;\n', '')
          text = text.replace('using VoxelEngine.Core.Storage;\n', '')
          text = text.replace('using VoxelEngine.Edits.Api;\n', '')
          text = text.replace('namespace VoxelEngine.Core.Edits\n', 'namespace VoxelEngine.Edits.Runtime\n', 1)
          marker = '        // -- TryApply for EventApplication.ApplyWithArbitration --------------------\n'
          if text.count(marker) != 1: raise SystemExit('BuildBrushes TryApply marker mismatch')
          text = text.split(marker, 1)[0].rstrip() + '\n    }\n}\n'
          p.write_text(text)

          # RawBatch expansion never read its table/pool either; retain the wire decoding and
          # replace physical layout constants with the logical Storage.Api block grid.
          p = runtime / 'RawBatchExpansion.cs'
          text = p.read_text()
          text = text.replace('using VoxelEngine.Core.Storage;\n', 'using VoxelEngine.Storage.Api;\n')
          text = text.replace('namespace VoxelEngine.Core.Edits\n', 'namespace VoxelEngine.Edits.Runtime\n', 1)
          text = text.replace(
              'public static NativeList<int3> Expand(NativeSlice<byte> rleData, RegionTable table, BrickPool pool)',
              'public static NativeList<int3> Expand(NativeSlice<byte> rleData)')
          text = text.replace(
              'public static NativeList<int3> ExpandParsed(NativeSlice<byte> rleData, RegionTable table,\n            BrickPool pool, int offsetBase)',
              'public static NativeList<int3> ExpandParsed(NativeSlice<byte> rleData, int offsetBase)')
          text = text.replace('VoxelEngine.Core.Storage.VoxelDimensions.MaterialEmpty', 'VoxelGrid.MaterialEmpty')
          text = text.replace('VoxelEngine.Core.Storage.VoxelDimensions.BricksPerRegion', 'BlocksPerRegion')
          text = text.replace('VoxelEngine.Core.Storage.VoxelDimensions.RegionEdgeMask', 'VoxelReadGrid.BlocksPerRegionEdgeMask')
          text = text.replace('VoxelEngine.Core.Storage.VoxelDimensions.RegionEdgeLog2', 'VoxelReadGrid.BlocksPerRegionEdgeLog2')
          anchor = '        public const ushort MaxRunLength = 65535;\n'
          if text.count(anchor) != 1: raise SystemExit('RawBatch MaxRunLength anchor mismatch')
          text = text.replace(anchor, anchor + '\n        private const int BlocksPerRegion = VoxelReadGrid.BlocksPerRegionEdge * VoxelReadGrid.BlocksPerRegionEdge * VoxelReadGrid.BlocksPerRegionEdge;\n', 1)
          text = text.replace('        /// <param name="table">The region table for resolving coordinates to regions during execution.</param>\n', '')
          text = text.replace('        /// <param name="pool">The brick pool for allocating mixed bricks as needed.</param>\n', '')
          p.write_text(text)

          # Known implementation consumers: retain Core.Edits for ExplosionExpansion while adding
          # Runtime for the helpers moved in this slice.
          consumers = [
              Path('Assets/Scenes/Showcase/ShowcaseWorld.cs'),
              Path('Assets/Tests/EditMode/ExpansionDeterminismTests.cs'),
              Path('Assets/Tests/Parity/LossConvergenceTests.cs'),
              Path('Assets/Tests/Parity/ReplayHarness.cs'),
              Path('Assets/Tests/Parity/TenThousandEventParityTests.cs'),
          ]
          for p in consumers:
              text = p.read_text()
              if 'using VoxelEngine.Edits.Runtime;\n' not in text:
                  anchor = 'using VoxelEngine.Edits.Api;\n'
                  if anchor in text:
                      text = text.replace(anchor, anchor + 'using VoxelEngine.Edits.Runtime;\n', 1)
                  else:
                      lines = text.splitlines(True)
                      insert = 0
                      while insert < len(lines) and lines[insert].startswith('using '): insert += 1
                      lines.insert(insert, 'using VoxelEngine.Edits.Runtime;\n')
                      text = ''.join(lines)
              p.write_text(text)

          p = Path('Assets/Tests/EditMode/ExpansionDeterminismTests.cs')
          text = p.read_text()
          text = text.replace('BrushExpansion.Expand(in poolA, in tableA, evt)', 'BrushExpansion.Expand(evt)')
          text = text.replace('BrushExpansion.Expand(in poolB, in tableB, evt)', 'BrushExpansion.Expand(evt)')
          p.write_text(text)

          # Only Showcase and implementation-focused tests gain the Runtime assembly reference.
          for asmdef_path in (
              Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef'),
              Path('Assets/Tests/EditMode/VoxelEngine.Tests.EditMode.asmdef'),
              Path('Assets/Tests/Parity/VoxelEngine.Tests.Parity.asmdef'),
          ):
              data = json.loads(asmdef_path.read_text())
              refs = data.setdefault('references', [])
              if 'VoxelEngine.Edits.Runtime' not in refs:
                  refs.append('VoxelEngine.Edits.Runtime')
              asmdef_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git rm .github/workflows/edits-runtime-helper-move.yml
          git diff --check
          echo '=== validate moved helper cluster ==='
          for name in AllocationBudget BrushExpansion BuildBrushes DeterministicRandom RawBatchExpansion; do
            test -f "Assets/VoxelEngine/Edits/Runtime/${name}.cs"
            test ! -e "Assets/VoxelEngine/Core/Edits/${name}.cs"
          done
          if grep -RInE 'VoxelEngine\.Core\.Storage|\b(RegionTable|BrickPool|BrickRef|VoxelAccess|VoxelDimensions|Region)\b' \
              Assets/VoxelEngine/Edits/Runtime/{AllocationBudget,BrushExpansion,BuildBrushes,DeterministicRandom,RawBatchExpansion}.cs; then
            echo 'Moved helper cluster still leaks physical Storage' >&2
            exit 1
          fi
          git status --short
          git diff --stat
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets/VoxelEngine/Edits/Runtime Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Tests/EditMode/VoxelEngine.Tests.EditMode.asmdef Assets/Tests/EditMode/ExpansionDeterminismTests.cs Assets/Tests/Parity/VoxelEngine.Tests.Parity.asmdef Assets/Tests/Parity/LossConvergenceTests.cs Assets/Tests/Parity/ReplayHarness.cs Assets/Tests/Parity/TenThousandEventParityTests.cs
          git commit -m 'Move Storage-independent Edits helpers to Runtime'
          git push origin HEAD:${{ github.ref_name }}
