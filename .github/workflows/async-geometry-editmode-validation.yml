name: Async geometry EditMode validation

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-editmode-validation.yml]

permissions:
  contents: read

jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          clean: true
          fetch-depth: 1
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity using runner checkout
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while pgrep -alf '/Unity.app/Contents/MacOS/Unity' \
              | grep -F -- "$GITHUB_WORKSPACE" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' \
                | grep -F -- "$GITHUB_WORKSPACE" || true
              exit 1
            fi
            sleep 3
          done
      - name: Run all EditMode tests
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/Artifacts/AsyncGeometryEditMode"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=12288 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 2 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || { tail -n 200 "$ROOT/unity.log" || true; exit 1; }
          exit $status
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-geometry-editmode
          path: Artifacts/AsyncGeometryEditMode/
          if-no-files-found: warn
          retention-days: 14
