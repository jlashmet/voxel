name: Async geometry EditMode validation

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-editmode-validation.yml
      - Assets/VoxelEngine/Rendering/**
      - Assets/VoxelEngine/Storage/**
      - Assets/Tests/EditMode/**
      - Packages/com.mountingforce.worldgen/**

concurrency:
  group: async-geometry-editmode
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Honor single-Unity safety gate
        shell: bash
        run: |
          set -euo pipefail
          # Surface-summary discovery is admission-only, and a newly attached voxel-change journal
          # now baselines at CurrentVersion before one bounded resident-state recovery. Together
          # these contracts prevent static startup history from continuously staling coarse builds.
          deadline=$((SECONDS + 2400))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 10
          done
      - name: Run async geometry EditMode tests
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/Artifacts/AsyncGeometryEditMode"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=12288 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 2 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "VoxelEngine.Tests.EditMode.ArchitectureBoundaryGuardTests;VoxelEngine.Tests.EditMode.ExactSnapshotMetadataJobTests;VoxelEngine.Tests.EditMode.GeometryFrameBudgetTests;VoxelEngine.Tests.EditMode.GeometryPipelineArchitectureTests;VoxelEngine.Tests.EditMode.StorageRenderingReadContractTests;VoxelEngine.Tests.EditMode.SurfaceBlockHlodSummaryTests;VoxelEngine.Tests.EditMode.SurfaceBrickDiscoveryTests;VoxelEngine.Tests.EditMode.SurfaceGeometryArenaTests;VoxelEngine.Tests.EditMode.SurfaceRingBandTests;VoxelEngine.Tests.EditMode.VoxelSurfaceArchitectureTests.WorldTeardownReleasesRendererBorrowsBeforeStorageBindingIsCleared" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || { tail -n 200 "$ROOT/unity.log" || true; exit 1; }
          python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          total = int(root.attrib.get('total', root.attrib.get('testcasecount', '0')))
          if total <= 0:
              raise SystemExit('Async geometry EditMode filter matched zero tests')
          print(f'Async geometry EditMode tests executed: {total}')
          PY
          exit $status
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-geometry-editmode
          path: Artifacts/AsyncGeometryEditMode/
          if-no-files-found: warn
          retention-days: 14