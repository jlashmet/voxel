name: Edits cutover inventory

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: read

jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - name: Inventory Edits ownership and consumers
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo '=== Core/Edits files ==='
          find Assets/VoxelEngine/Core/Edits -maxdepth 1 -type f | sort || true
          echo
          echo '=== Existing Edits target files ==='
          find Assets/VoxelEngine/Edits -type f | sort 2>/dev/null || true
          echo
          echo '=== Core/Edits namespace declarations ==='
          grep -RInE '^namespace ' Assets/VoxelEngine/Core/Edits --include='*.cs' | sort || true
          echo
          echo '=== AlterationEvent canonical declarations ==='
          grep -nE '^\s*(public|internal).*\b(class|struct|enum|interface)\b|^\s*public enum|^\s*public struct' Assets/VoxelEngine/Core/Edits/AlterationEvent.cs || true
          echo
          echo '=== live Core.Edits imports/references outside Core/Edits ==='
          grep -RInF 'VoxelEngine.Core.Edits' Assets Packages --include='*.cs' --include='*.asmdef' | grep -v 'Assets/VoxelEngine/Core/Edits/' | sort || true
          echo
          echo '=== server deterministic wrapper ==='
          grep -RInE 'ServerDeterministicAlterationApplier|DeterministicAlterationApplier' Assets/VoxelEngine/Net Assets/Tests --include='*.cs' | sort || true
          echo
          echo '=== canonical edit type consumers ==='
          grep -RIlE '\b(AlterationEvent|CanonicalBrushType|AlterationFlags|ExpandedVoxelEdit|EditResult)\b' Assets Packages --include='*.cs' | sort || true
          echo
          echo '=== asmdefs mentioning Core / Edits / Net ==='
          grep -RIlE 'VoxelEngine\.(Core|Edits|Net)' Assets Packages --include='*.asmdef' | sort || true
