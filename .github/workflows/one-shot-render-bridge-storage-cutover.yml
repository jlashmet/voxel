name: One-shot Render Bridge Storage Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-render-bridge-storage-cutover.yml'
      - 'Tools/Refactor/apply_render_bridge_storage_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic bridge cutover
        run: python Tools/Refactor/apply_render_bridge_storage_cutover.py

      - name: Verify bridge diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bridge='Assets/VoxelEngine/Rendering/RenderFeature/VoxelRenderBridge.cs'
          scheduler='Assets/VoxelEngine/Rendering/SurfaceExtraction/VoxelSurfaceScheduler.cs'
          ! grep -qE '\b(RegionTable|BrickPool|BrickRef)\b' "$bridge"
          ! grep -qE '\b(RegionTable|BrickPool|BrickRef)\b' "$scheduler"
          grep -q 'public IRegionReadSource Storage;' "$bridge"
          grep -q 'public void Prepare(IRegionReadSource storage' "$scheduler"
          grep -q '_scheduler.Prepare(world.Storage' Assets/VoxelEngine/Rendering/RenderFeature/VoxelRenderPass.cs

      - name: Commit bridge cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-render-bridge-storage-cutover.yml
          git rm Tools/Refactor/apply_render_bridge_storage_cutover.py
          git add Assets/VoxelEngine/Rendering/RenderFeature/VoxelRenderBridge.cs
          git add Assets/VoxelEngine/Rendering/RenderFeature/VoxelRenderPass.cs
          git add Assets/VoxelEngine/Rendering/SurfaceExtraction/VoxelSurfaceScheduler.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over render bridge storage reads'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
