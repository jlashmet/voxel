name: Net semantic snapshot API cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-semantic-snapshot-cutover.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs')
          text = path.read_text()
          replacements = [
              ('using VoxelEngine.Core.Storage;\n', 'using VoxelEngine.Storage.Api;\n'),
              ('''        public int EmitHashes(\n            uint serverTick,\n            ref RegionTable table,\n            in BrickPool pool,\n            RegionSubscriptionIndex subscriptions,\n            ServerNetworkRuntime network)\n        {\n            if (subscriptions == null) throw new ArgumentNullException(nameof(subscriptions));\n            if (network == null) throw new ArgumentNullException(nameof(network));\n            if (serverTick == 0) return 0;\n\n            PruneCheckpoints(serverTick);\n            NativeArray<int3> regions = table.GetResidentCoords(Allocator.Temp);\n''', '''        public int EmitHashes(\n            uint serverTick,\n            IRegionReadSource readSource,\n            IRegionSnapshotSource snapshotSource,\n            RegionSubscriptionIndex subscriptions,\n            ServerNetworkRuntime network)\n        {\n            if (readSource == null) throw new ArgumentNullException(nameof(readSource));\n            if (snapshotSource == null) throw new ArgumentNullException(nameof(snapshotSource));\n            if (subscriptions == null) throw new ArgumentNullException(nameof(subscriptions));\n            if (network == null) throw new ArgumentNullException(nameof(network));\n            if (serverTick == 0) return 0;\n\n            PruneCheckpoints(serverTick);\n            NativeArray<int3> regions = readSource.GetResidentRegionCoords(Allocator.Temp);\n'''),
              ('''                    if (_subscriberScratch.Count == 0) continue;\n                    if (!table.TryGetRegion(coord, out Region region) || !region.BrickRefs.IsCreated) continue;\n\n                    if (!SemanticRegionSnapshotCodec.TryEncode(\n                            in region,\n                            in pool,\n                            SemanticRegionSnapshotCodec.DefaultMaxSnapshotBytes,\n                            out byte[] snapshot) ||\n                        _retainedSnapshotBytes + snapshot.Length > MaxRetainedSnapshotBytes)\n                    {\n                        HashesSkippedNoSnapshot++;\n                        continue;\n                    }\n\n                    uint semanticHash = SemanticRegionHasher.HashRegion(in region, in pool);\n''', '''                    if (_subscriberScratch.Count == 0) continue;\n\n                    RegionSnapshotCaptureResult capture = snapshotSource.CaptureSemanticSnapshot(\n                        coord,\n                        RegionSemanticSnapshotLimits.DefaultMaxSnapshotBytes,\n                        out RegionSemanticSnapshot semanticSnapshot);\n                    if (capture != RegionSnapshotCaptureResult.Ok ||\n                        _retainedSnapshotBytes + semanticSnapshot.Bytes.Length > MaxRetainedSnapshotBytes)\n                    {\n                        HashesSkippedNoSnapshot++;\n                        continue;\n                    }\n\n                    byte[] snapshot = semanticSnapshot.Bytes;\n                    uint semanticHash = semanticSnapshot.SemanticHash;\n'''),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)

          path = Path('Assets/VoxelEngine/Net/Server/AuthoritativeServerSession.cs')
          text = path.read_text()
          old = '''            _network.FlushReplication();\n            _convergence.EmitHashes(\n                serverTick,\n                ref table,\n                in pool,\n                _network.Replication.Subscriptions,\n                _network);\n\n            var storageReadSource = new RegionReadSource(in table, in pool);\n'''
          new = '''            _network.FlushReplication();\n            var storageReadSource = new RegionReadSource(in table, in pool);\n            _convergence.EmitHashes(\n                serverTick,\n                storageReadSource,\n                storageReadSource,\n                _network.Replication.Subscriptions,\n                _network);\n\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'{path}: expected one convergence call block, got {count}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/net-semantic-snapshot-cutover.yml
          git diff --check
          git diff -- Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs Assets/VoxelEngine/Net/Server/AuthoritativeServerSession.cs
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs Assets/VoxelEngine/Net/Server/AuthoritativeServerSession.cs
          git commit -m 'refactor(net): consume Storage semantic snapshot API'
          git push origin HEAD:${{ github.ref_name }}
