name: StructuralIntegrity support Runtime move
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          mkdir -p Assets/VoxelEngine/StructuralIntegrity/Api Assets/VoxelEngine/StructuralIntegrity/Runtime
          git mv Assets/VoxelEngine/Core/Structure/SupportField.cs Assets/VoxelEngine/StructuralIntegrity/Runtime/SupportField.cs
          git mv Assets/VoxelEngine/Core/Structure/SupportField.cs.meta Assets/VoxelEngine/StructuralIntegrity/Runtime/SupportField.cs.meta
          git mv Assets/VoxelEngine/Core/Structure/CollapseDetection.cs Assets/VoxelEngine/StructuralIntegrity/Runtime/CollapseDetection.cs
          git mv Assets/VoxelEngine/Core/Structure/CollapseDetection.cs.meta Assets/VoxelEngine/StructuralIntegrity/Runtime/CollapseDetection.cs.meta
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, uuid
          def meta(path, folder=False):
              guid=uuid.uuid4().hex
              if folder:
                  Path(path).write_text(f"fileFormatVersion: 2\nguid: {guid}\nfolderAsset: yes\nDefaultImporter:\n  externalObjects: {{}}\n  userData: \n  assetBundleName: \n  assetBundleVariant: \n")
              else:
                  Path(path).write_text(f"fileFormatVersion: 2\nguid: {guid}\n")
          if not Path('Assets/VoxelEngine/StructuralIntegrity.meta').exists():
              meta('Assets/VoxelEngine/StructuralIntegrity.meta', True)
          if not Path('Assets/VoxelEngine/StructuralIntegrity/Api.meta').exists():
              meta('Assets/VoxelEngine/StructuralIntegrity/Api.meta', True)
          if not Path('Assets/VoxelEngine/StructuralIntegrity/Runtime.meta').exists():
              meta('Assets/VoxelEngine/StructuralIntegrity/Runtime.meta', True)
          api_asm={'name':'VoxelEngine.StructuralIntegrity.Api','rootNamespace':'VoxelEngine.StructuralIntegrity.Api','references':[],'includePlatforms':[],'excludePlatforms':[],'allowUnsafeCode':False,'overrideReferences':False,'precompiledReferences':[],'autoReferenced':False,'defineConstraints':[],'versionDefines':[],'noEngineReferences':False}
          runtime_asm={'name':'VoxelEngine.StructuralIntegrity.Runtime','rootNamespace':'VoxelEngine.StructuralIntegrity.Runtime','references':['VoxelEngine.StructuralIntegrity.Api','VoxelEngine.Storage.Api','Unity.Collections','Unity.Mathematics'],'includePlatforms':[],'excludePlatforms':[],'allowUnsafeCode':True,'overrideReferences':False,'precompiledReferences':[],'autoReferenced':False,'defineConstraints':[],'versionDefines':[],'noEngineReferences':False}
          Path('Assets/VoxelEngine/StructuralIntegrity/Api/VoxelEngine.StructuralIntegrity.Api.asmdef').write_text(json.dumps(api_asm,indent=2)+'\n')
          meta('Assets/VoxelEngine/StructuralIntegrity/Api/VoxelEngine.StructuralIntegrity.Api.asmdef.meta')
          Path('Assets/VoxelEngine/StructuralIntegrity/Runtime/VoxelEngine.StructuralIntegrity.Runtime.asmdef').write_text(json.dumps(runtime_asm,indent=2)+'\n')
          meta('Assets/VoxelEngine/StructuralIntegrity/Runtime/VoxelEngine.StructuralIntegrity.Runtime.asmdef.meta')
          Path('Assets/VoxelEngine/StructuralIntegrity/Runtime/SupportField.cs').write_bytes(base64.b64decode(''))
          Path('Assets/VoxelEngine/StructuralIntegrity/Runtime/CollapseDetection.cs').write_bytes(base64.b64decode(''))
          p=Path('Assets/Tests/Parity/CollapseAgreementTests.cs')
          text=p.read_text().replace('using VoxelEngine.Core.Structure;\n','using VoxelEngine.StructuralIntegrity.Runtime;\n')
          replacements={'SupportField.ComputeSupport(in tableA, in poolA, GetRegion(origin.x, origin.y, origin.z).x, GetRegion(origin.x, origin.y, origin.z).y, GetRegion(origin.x, origin.y, origin.z).z, supportA, Allocator.Temp);':'SupportField.ComputeSupport(new RegionReadSource(in tableA, in poolA), GetRegion(origin.x, origin.y, origin.z), supportA, Allocator.Temp);','SupportField.ComputeSupport(in tableB, in poolB, GetRegion(origin.x, origin.y, origin.z).x, GetRegion(origin.x, origin.y, origin.z).y, GetRegion(origin.x, origin.y, origin.z).z, supportB, Allocator.Temp);':'SupportField.ComputeSupport(new RegionReadSource(in tableB, in poolB), GetRegion(origin.x, origin.y, origin.z), supportB, Allocator.Temp);','SupportField.ComputeSupport(in table, in pool, regionCoord.x, regionCoord.y, regionCoord.z, support, Allocator.Temp);':'SupportField.ComputeSupport(new RegionReadSource(in table, in pool), regionCoord, support, Allocator.Temp);','var targets = CollapseDetection.FindUnsupportedBuilds(in region.BrickRefs, in pool, in support);':'var targets = CollapseDetection.FindUnsupportedBuilds(new RegionReadSource(in table, in pool), regionCoord, in support);'}
          for old,new in replacements.items():
              if text.count(old)!=1:
                  raise SystemExit(f"CollapseAgreement replacement count {text.count(old)}: {old[:80]}")
              text=text.replace(old,new,1)
          old="            SupportField.ComputeSupport(\n                in table, in pool, regionCoord.x, regionCoord.y, regionCoord.z, support, Allocator.Temp);\n\n            var targets = CollapseDetection.FindCollapseTargets(\n                in region.BrickRefs, in pool, in support, threshold);"
          new="            var readSource = new RegionReadSource(in table, in pool);\n            SupportField.ComputeSupport(readSource, regionCoord, support, Allocator.Temp);\n\n            var targets = CollapseDetection.FindCollapseTargets(\n                readSource, regionCoord, in support, threshold);"
          if text.count(old)!=1:
              raise SystemExit(f"CollapseTargetsFor replacement count {text.count(old)}")
          p.write_text(text.replace(old,new,1))
          p=Path('Assets/Tests/Parity/VoxelEngine.Tests.Parity.asmdef')
          data=json.loads(p.read_text())
          if 'VoxelEngine.StructuralIntegrity.Runtime' not in data['references']:
              data['references'].append('VoxelEngine.StructuralIntegrity.Runtime')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git rm .github/workflows/structural-support-move-inventory.yml .github/workflows/structural-support-runtime-move.yml
          git diff --check
          test -f Assets/VoxelEngine/StructuralIntegrity/Runtime/SupportField.cs
          test -f Assets/VoxelEngine/StructuralIntegrity/Runtime/CollapseDetection.cs
          test ! -e Assets/VoxelEngine/Core/Structure/SupportField.cs
          test ! -e Assets/VoxelEngine/Core/Structure/CollapseDetection.cs
          if grep -RInE 'VoxelEngine\.Core\.Storage|\b(RegionTable|BrickPool|BrickRef|VoxelDimensions|VoxelAccess)\b' Assets/VoxelEngine/StructuralIntegrity --include='*.cs'; then
            echo 'StructuralIntegrity Runtime leaks physical Storage' >&2
            exit 1
          fi
          if grep -RIn 'VoxelEngine.Net' Assets/VoxelEngine/StructuralIntegrity --include='*.cs' --include='*.asmdef'; then
            echo 'StructuralIntegrity depends on Net' >&2
            exit 1
          fi
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/StructuralIntegrity.meta Assets/VoxelEngine/StructuralIntegrity Assets/Tests/Parity/CollapseAgreementTests.cs Assets/Tests/Parity/VoxelEngine.Tests.Parity.asmdef
          git commit -m 'Move structural support evaluation behind Storage API'
          git push origin HEAD:${{ github.ref_name }}
