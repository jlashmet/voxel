name: GpuDebris Storage API acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec5aa7c2950528afb90faab0437cc263cd355759
          fetch-depth: 1
      - name: Verify GpuDebris Storage API boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          debris = Path('Assets/Scenes/Showcase/GpuDebrisSystem.cs').read_text()
          api = Path('Assets/VoxelEngine/Storage/Api/VoxelCell.cs').read_text()
          if 'VoxelEngine.Storage.Runtime' in debris:
              raise SystemExit('GpuDebris still depends on Storage.Runtime')
          if 'using VoxelEngine.Storage.Api;' not in debris:
              raise SystemExit('GpuDebris lost Storage.Api import')
          if 'Coatings.None' not in debris or 'public static class Coatings' not in api:
              raise SystemExit('GpuDebris coating semantics are not resolving through Storage.Api')
          print('GpuDebris Storage API boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec5aa7c2950528afb90faab0437cc263cd355759
          clean: false
          fetch-depth: 1
      - name: Reset pinned GpuDebris candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard ec5aa7c2950528afb90faab0437cc263cd355759
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/GpuDebrisStorageApi"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-debris-storage-api-ec5aa7c2
          path: Artifacts/GpuDebrisStorageApi/
          if-no-files-found: warn
          retention-days: 14