name: Architecture clear stale queue
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/architecture-cancel-stale-queue.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale queued restructuring runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: refactor/system-boundaries-foundation-storage
          KEEP_ONE: '31891438572'
          KEEP_TWO: '0'
        shell: bash
        run: |
          set -euo pipefail
          for page in $(seq 1 30); do
            json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs?branch=$BRANCH&status=queued&per_page=100&page=$page")"
            count="$(jq '.workflow_runs | length' <<<"$json")"
            [ "$count" -eq 0 ] && break
            jq -r --arg k1 "$KEEP_ONE" --arg k2 "$KEEP_TWO" '.workflow_runs[] | select((.id|tostring) != $k1 and (.id|tostring) != $k2) | .id' <<<"$json" |
            while read -r id; do
              [ -z "$id" ] && continue
              echo "Cancelling queued run $id"
              curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
            done
          done
# Preserve only the pinned final Net acceptance run while clearing stale queue entries.
