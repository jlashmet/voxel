name: Publish ShowcaseWorld material simulation view
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/publish-showcase-world-material-simulation-view.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Route ShowcaseWorld material behavior reads through Storage.Api snapshot
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          s=p.read_text()
          field='        private MaterialPalette _palette;\n'
          if field not in s: raise SystemExit('MaterialPalette field anchor missing')
          if 'private MaterialSimulationView _materialSimulation;' not in s:
              s=s.replace(field, field+'        private MaterialSimulationView _materialSimulation;\n',1)

          anchor='''            _palette.Register(Mat.MasonryLarge, 220, DestructionClass.Crumble,\n                              SurfaceStyles.MasonryJoint, weather);\n'''
          if anchor not in s: raise SystemExit('Final material registration anchor missing')
          if '_materialSimulation = _palette.SimulationView;' not in s:
              s=s.replace(anchor, anchor+'            _materialSimulation = _palette.SimulationView;\n',1)

          counts={
              '_palette.IsDestructible(': s.count('_palette.IsDestructible('),
              '_palette.GetHardness(': s.count('_palette.GetHardness('),
              '_palette.GetDestructionClass(': s.count('_palette.GetDestructionClass('),
          }
          print('replacement counts',counts)
          if counts['_palette.IsDestructible('] < 5 or counts['_palette.GetHardness('] < 1:
              raise SystemExit('Expected material behavior call sites were not found')
          s=s.replace('_palette.IsDestructible(', '_materialSimulation.IsDestructible(')
          s=s.replace('_palette.GetHardness(', '_materialSimulation.GetHardness(')
          s=s.replace('_palette.GetDestructionClass(', '_materialSimulation.GetDestructionClass(')
          if any(token in s for token in counts):
              raise SystemExit('Concrete palette behavior reads remain')
          if s.count('_materialSimulation = _palette.SimulationView;') != 1:
              raise SystemExit('Material simulation snapshot capture missing/duplicated')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git diff --cached --check
          git commit -m 'refactor(showcase): consume material simulation Api view'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
