name: Mark Storage final acceptance gates once

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/mark-storage-final-gates-once.yml]

permissions:
  contents: write

jobs:
  checkoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Revalidate Storage source ownership and update plan
        shell: bash
        run: |
          set -euo pipefail
          branch='refactor/system-boundaries-finalization-stable'
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'fa884ec5eccadcd1fe4bb817e2ea773e19913dce'

          python3 - <<'PY'
          from pathlib import Path
          import re

          violations = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  rel = path.as_posix()
                  low = '/' + rel.lower().strip('/') + '/'
                  production = all(token not in low for token in ('/tests/', '/test/', '/editor/', '/voxelengine/ci/'))
                  if not production:
                      continue
                  source = path.read_text(errors='ignore')
                  source = re.sub(r'/\*.*?\*/', '', source, flags=re.S)
                  source = re.sub(r'//.*', '', source)
                  if 'VoxelEngine.Storage.Runtime' not in source:
                      continue
                  storage_owner = rel.startswith('Assets/VoxelEngine/Storage/Runtime/')
                  composition_owner = rel.startswith('Assets/VoxelEngine/Composition/')
                  if not storage_owner and not composition_owner:
                      violations.append(rel)
          if violations:
              raise SystemExit('Storage.Runtime production source reference outside Storage/Runtime or Composition:\n' + '\n'.join(violations))

          guard = Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs').read_text()
          required = [
              'ApiAssembliesDoNotReferenceRuntimeAssemblies',
              'RuntimeAssembliesDoNotReferenceForeignRuntimeAssemblies',
              'CompositionIsOnlyProductionRuntimeWiringAssembly',
          ]
          missing = [name for name in required if name not in guard]
          if missing:
              raise SystemExit('Permanent architecture guard missing: ' + ', '.join(missing))

          plan = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = plan.read_text()
          old1 = '- [ ] No source outside `Storage/Runtime` imports their namespaces.'
          new1 = '- [x] No production source outside `Storage/Runtime` or the deliberate `Composition` wiring root imports/names `VoxelEngine.Storage.Runtime`; strengthened final static gate accepted at `fa884ec5eccadcd1fe4bb817e2ea773e19913dce`, run `31910537648`, and this checkoff revalidates the current source tree.'
          old2 = '- [ ] Architecture guard has no Storage.Runtime foreign-reference exception.'
          new2 = '- [x] Architecture guard has no migration-era Storage.Runtime foreign-reference exception; permanent guards enforce Api -> Runtime prohibition, foreign Runtime -> Runtime prohibition, and Composition as the sole production concrete-wiring exception; final static gate `31910537648` accepted.'
          for old, new in ((old1, new1), (old2, new2)):
              if text.count(old) != 1:
                  raise SystemExit('Expected exactly one unchecked Storage gate: ' + old)
              text = text.replace(old, new, 1)
          plan.write_text(text)
          PY

          git diff --check
          git rm .github/workflows/mark-storage-final-gates-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs(architecture): mark Storage final gates complete'

          remote_head="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:"$branch"
