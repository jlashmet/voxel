name: Exact metadata diagnostics one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-exact-metadata-diagnostics-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_exact_metadata_diagnostics_patch.py
      - name: Static guards
        shell: bash
        run: |
          grep -q 'ExactMetadataScheduleCount' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'Step4ExactMetadataRevisionRejects' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          grep -q 'StepFourSizedEightRegionMetadataChainCompletes' Assets/Tests/EditMode/ExactSnapshotMetadataJobTests.cs
          grep -q 'revReject:' Assets/Tests/PlayMode/LodRenderingTests.cs
      - name: Commit diagnostics
        shell: bash
        run: |
          rm .github/scripts/async_geometry_exact_metadata_diagnostics_patch.py
          rm .github/workflows/async-geometry-exact-metadata-diagnostics-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Instrument exact metadata convergence'
          git push origin HEAD:refactor/async-geometry-pipeline
