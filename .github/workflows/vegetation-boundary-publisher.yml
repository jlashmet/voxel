name: Vegetation boundary publisher
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths:
      - tools/refactor_vegetation_boundary.py
      - .github/workflows/vegetation-boundary-publisher.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply boundary cutover
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 tools/refactor_vegetation_boundary.py
          git rm tools/refactor_vegetation_boundary.py .github/workflows/vegetation-boundary-publisher.yml
          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets Packages
          git add -u tools .github/workflows
          git commit -m 'Split Vegetation Runtime from rendering reads'
          git push origin HEAD:${{ github.ref_name }}
