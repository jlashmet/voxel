name: Patch async geometry startup diagnostics

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-startup-diagnostics-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Add bounded atomic-world diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('Assets/Tests/PlayMode/LodRenderingTests.cs'),
              Path('Assets/Tests/PlayMode/AsyncGeometryStressTests.cs'),
          ]
          old = '''            Assert.True(VoxelRenderBridge.SurfaceBuildEnabled,\n                $\"Showcase atomic world did not commit within {frames} frames / 20 seconds.\");\n            Assert.True(VoxelRenderBridge.TryGetWorld(out _),\n                \"Showcase lost its render-world binding while waiting for atomic publication.\");'''
          new = '''            var showcase = Object.FindFirstObjectByType<VoxelShowcase>();\n            var world = showcase != null\n                ? (ShowcaseWorld)typeof(VoxelShowcase)\n                    .GetField(\"_world\", BindingFlags.NonPublic | BindingFlags.Instance)\n                    .GetValue(showcase)\n                : null;\n            string startup = world == null\n                ? \"world=null\"\n                : $\"castleRegions={world.ReadyCastleRegions}/{world.RequiredCastleRegions} \"\n                + $\"pendingLoads={world.PendingRegionLoads} generated={world.RegionsGenerated} \"\n                + $\"buildStage={world.CastleBuildStage} lastStage={world.LastCastleStage} \"\n                + $\"lastStageMs={world.LastCastleStageMs:F2} maxStage={world.MaxCastleStage} \"\n                + $\"maxStageMs={world.MaxCastleStageMs:F2} castleVoxels={world.CastleVoxels}\";\n\n            Assert.True(VoxelRenderBridge.SurfaceBuildEnabled,\n                $\"Showcase atomic world did not commit within {frames} frames / 20 seconds; {startup}.\");\n            Assert.True(VoxelRenderBridge.TryGetWorld(out _),\n                $\"Showcase lost its render-world binding while waiting for atomic publication; {startup}.\");'''
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one readiness assertion block, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit diagnostics and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-startup-diagnostics-fix.yml
          git add Assets/Tests/PlayMode/LodRenderingTests.cs Assets/Tests/PlayMode/AsyncGeometryStressTests.cs
          git commit -m "test(async-geometry): report atomic startup progress"
          git push origin HEAD:refactor/async-geometry-pipeline
