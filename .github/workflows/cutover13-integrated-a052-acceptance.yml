name: Cutover 13 integrated a052 acceptance
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-integrated-a052-acceptance.yml
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0528159
          fetch-depth: 1
      - name: Verify integrated Cutover 13 boundary slices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('Assets/Scenes/Showcase')
          bootstrap = Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          voxel_showcase = (root / 'VoxelShowcase.cs').read_text()
          environment = (root / 'TerrainLookdev.Environment.cs').read_text()
          overlay = (root / 'CompactFpsOverlay.cs').read_text()
          main = (root / 'TerrainLookdev.cs').read_text()
          if 'VoxelDimensions.BytesPerMixedBrick' not in bootstrap or 'ClampMixedBrickCapacityToBudget' not in bootstrap:
              raise SystemExit('Composition no longer owns mixed-brick capacity policy')
          for token in ('using VoxelEngine.Storage.Runtime;', 'VoxelDimensions.BytesPerMixedBrick', 'VoxelAccess.'):
              if token in voxel_showcase:
                  raise SystemExit('VoxelShowcase retains Storage.Runtime detail: ' + token)
          if '_world.SurfaceQuery.TryRead' not in voxel_showcase:
              raise SystemExit('VoxelShowcase API surface read missing')
          if 'VoxelEngine.Rendering.Runtime' in environment or 'VoxelRenderBridge' in environment:
              raise SystemExit('TerrainLookdev.Environment still leaks Rendering.Runtime')
          if 'ConfigureRenderingEnvironment' not in environment or 'ConfigureRenderingEnvironment' not in bootstrap:
              raise SystemExit('Environment is not routed through Composition')
          if 'VoxelEngine.Rendering.Runtime' in overlay or 'VoxelRenderBridge' in overlay or 'VoxelSurfaceMetrics' in overlay:
              raise SystemExit('CompactFpsOverlay still leaks renderer internals')
          if 'SurfaceTimingDiagnostics' not in overlay or 'GetSurfaceTimingDiagnostics' not in bootstrap:
              raise SystemExit('CompactFps diagnostics API projection missing')
          partials = sorted(root.glob('TerrainLookdev.*.cs'))
          stale = []
          for p in partials:
              text = p.read_text()
              if 'RegionReadSource(' in text or 'RegionMutationStore(' in text:
                  stale.append(str(p))
          if stale:
              raise SystemExit('TerrainLookdev partials still construct physical storage adapters: ' + ', '.join(stale))
          if 'private VoxelBrush CreateWriter(int budget)' not in main or 'private void PublishAllResidentRegions()' not in main:
              raise SystemExit('TerrainLookdev owner consolidation helpers missing')
          cleaned = [p for p in partials if 'using VoxelEngine.Storage.Runtime;' not in p.read_text()]
          if len(cleaned) < 7:
              raise SystemExit(f'Expected at least 7 API-only lookdev partials, found {len(cleaned)}')
          tests = Path('Assets/Tests/EditMode/CompositionBootstrapTests.cs').read_text()
          if 'StorageCapacityBudgetingKeepsPhysicalLayoutInsideComposition' not in tests:
              raise SystemExit('Composition capacity test missing')
          print('Integrated Cutover 13 static boundary accepted')
          print('API-only TerrainLookdev partials:', len(cleaned))
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0528159
          clean: false
          fetch-depth: 1
      - name: Reset pinned integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard a0528159
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/Cutover13IntegratedA052"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover13-integrated-a0528159
          path: Artifacts/Cutover13IntegratedA052/
          if-no-files-found: warn
          retention-days: 14
