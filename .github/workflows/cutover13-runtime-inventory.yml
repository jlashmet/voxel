name: Cutover 13 runtime inventory

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-runtime-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 1
      - name: Find remaining Showcase Runtime coupling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          showcase = Path('Assets/Scenes/Showcase')
          runtime_namespace = re.compile(r'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime')
          declaration = re.compile(r'\b(?:public|internal|private|protected|static|sealed|readonly|abstract|partial|unsafe|ref|new|\s)*\b(class|struct|interface|enum)\s+([A-Za-z_][A-Za-z0-9_]*)')

          runtime_types = defaultdict(list)
          for path in sorted(Path('Assets/VoxelEngine').glob('*/Runtime/**/*.cs')):
              text = path.read_text()
              for _, name in declaration.findall(text):
                  runtime_types[name].append(str(path))

          coupled = []
          for path in sorted(showcase.rglob('*.cs')):
              text = path.read_text()
              imports = sorted(set(runtime_namespace.findall(text)))
              if not imports:
                  continue
              coupled.append(str(path))
              print(f'RUNTIME_SOURCE {path}: {", ".join(imports)}')
              used = []
              for name, owners in sorted(runtime_types.items()):
                  if re.search(rf'\b{re.escape(name)}\b', text):
                      used.append(name)
                      print(f'  RUNTIME_TYPE {name}: {", ".join(owners)}')
                      hits = []
                      for i, line in enumerate(text.splitlines(), 1):
                          if re.search(rf'\b{re.escape(name)}\b', line):
                              hits.append(f'L{i}: {line.strip()}')
                      for hit in hits[:12]:
                          print('    ' + hit)
              print(f'  RUNTIME_TYPE_COUNT {len(used)}')
          print(f'RUNTIME_SOURCE_COUNT {len(coupled)}')

          asmdef = json.loads((showcase / 'VoxelEngine.Showcase.asmdef').read_text())
          runtime_refs = [r for r in asmdef.get('references', []) if r.endswith('.Runtime')]
          print('RUNTIME_ASMDEF_REFS ' + ', '.join(runtime_refs))
          PY
