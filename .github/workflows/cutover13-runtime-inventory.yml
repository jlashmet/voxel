name: Apply ArchLookdev Structures boundary cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-runtime-inventory.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 1
      - name: Apply clean Composition cutover
        shell: bash
        run: |
          set -euo pipefail
          cat > Assets/VoxelEngine/Composition/StructuresComposition.cs <<'EOF'
          using System;
          using Unity.Collections;
          using Unity.Mathematics;
          using VoxelEngine.Storage.Api;
          using VoxelEngine.Structures.Api;
          using VoxelEngine.Structures.Runtime;

          namespace VoxelEngine.Composition
          {
              /// <summary>
              /// Application-owned parameters for the hero-arch look-development build. The scene owns
              /// all authoring policy; Composition only translates those stable values into the concrete
              /// Structures.Runtime implementation.
              /// </summary>
              public struct ArchLookdevBuildRequest
              {
                  public int ClearSpan;
                  public int PierHeight;
                  public int RingThickness;
                  public int Depth;
                  public int VoussoirCount;
                  public int ShoulderWidth;
                  public int TopMargin;
                  public int FaceRecess;
                  public int PlinthHeight;
                  public int ImpostHeight;
                  public int Damage;
                  public uint DamageSeed;
                  public int DamageScale;
                  public int ProfileJointHalfWidthQ4;
                  public int ProfileBevelQ4;
                  public int ProfileProjectionQ4;
                  public int ProfileDepthQ4;
                  public byte StoneMaterial;
                  public ushort SurfaceStyle;
                  public byte Coating;
                  public int CoatingCoverage;
                  public int BrushBudget;
              }

              /// <summary>Stable result of a Composition-owned arch authoring pass.</summary>
              public readonly struct ArchLookdevBuildResult
              {
                  public readonly IProfileBlockReadSource ProfileBlocks;
                  public readonly int Width;
                  public readonly int Height;

                  public ArchLookdevBuildResult(
                      IProfileBlockReadSource profileBlocks,
                      int width,
                      int height)
                  {
                      ProfileBlocks = profileBlocks;
                      Width = width;
                      Height = height;
                  }
              }

              /// <summary>Application wiring for structure planning and authoring.</summary>
              public static class StructuresComposition
              {
                  /// <summary>
                  /// Draws the deterministic castle plan while keeping the concrete runtime planner private
                  /// to Composition. The returned plan is a Structures.Api value contract.
                  /// </summary>
                  public static CastlePlan PlanCastle(int3 centre, uint seed) =>
                      CastleBuilder.Plan(centre, seed);

                  /// <summary>
                  /// Executes the hero-arch lookdev authoring pass without exposing concrete structure
                  /// feature definitions, profile storage, rasterizers, brushes, or weathering helpers to
                  /// scene code. Per-voxel work still executes directly inside Structures.Runtime.
                  /// </summary>
                  public static ArchLookdevBuildResult BuildArchLookdev(
                      IVoxelStorageRuntime storage,
                      in ArchLookdevBuildRequest request)
                  {
                      if (storage == null) throw new ArgumentNullException(nameof(storage));
                      if (request.BrushBudget <= 0)
                          throw new ArgumentOutOfRangeException(nameof(request.BrushBudget));

                      var profiles = new ProfileBlockStore();
                      var arch = new ArchFeatureDefinition
                      {
                          ClearSpan = request.ClearSpan,
                          PierHeight = request.PierHeight,
                          RingThickness = request.RingThickness,
                          Depth = request.Depth,
                          VoussoirCount = request.VoussoirCount,
                          JointRecessDepth = 1,
                          ProfileJointHalfWidthQ4 = (byte)request.ProfileJointHalfWidthQ4,
                          ProfileBevelQ4 = (byte)request.ProfileBevelQ4,
                          ProfileProjectionQ4 = (byte)request.ProfileProjectionQ4,
                          ProfileDepthQ4 = (byte)request.ProfileDepthQ4,
                          StoneMaterial = request.StoneMaterial,
                          PierStyle = request.SurfaceStyle,
                          RingStyle = request.SurfaceStyle,
                      };
                      var bay = new ArchBayFeatureDefinition
                      {
                          Arch = arch,
                          ShoulderWidth = request.ShoulderWidth,
                          TopMargin = request.TopMargin,
                          FaceRecess = request.FaceRecess,
                          PlinthHeight = request.PlinthHeight,
                          ImpostHeight = request.ImpostHeight,
                          Damage = (ArchRuinDamage)request.Damage,
                          DamageSeed = request.DamageSeed,
                          DamageScale = (byte)request.DamageScale,
                      };

                      int3 origin = new(-bay.Width / 2, 0, 0);
                      using (var primitives = new NativeList<Primitive>(
                                 bay.Metadata.MaxPrimitives,
                                 Allocator.Temp))
                      {
                          if (!bay.Emit(origin, primitives, profiles))
                              throw new InvalidOperationException("Arch parameters did not emit.");

                          RasterResult result = PrimitiveRasteriser.Rasterise(
                              primitives.AsArray(),
                              origin,
                              origin + bay.Metadata.Footprint,
                              storage.Reads,
                              storage.Mutations);
                          if (result.BudgetExceeded)
                              throw new InvalidOperationException("Arch exceeded the feature budget.");
                      }

                      var brush = new VoxelBrush(
                          storage.Reads,
                          storage.Mutations,
                          storage.MaterialAuthoring,
                          request.BrushBudget);
                      MasonryWeathering.CoatExposedSurfaces(
                          ref brush,
                          origin - 2,
                          bay.Metadata.Footprint + 4,
                          request.Coating,
                          request.DamageSeed,
                          (byte)request.CoatingCoverage,
                          dripPasses: 0);

                      storage.PublishAllResidentRegions();
                      return new ArchLookdevBuildResult(profiles, bay.Width, bay.Height);
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/Scenes/Showcase/ArchLookdev.cs')
          text = path.read_text()
          text = text.replace('using VoxelEngine.Structures.Runtime;\n', '')
          text = text.replace(
              '        private ProfileBlockStore _profileBlocks;\n',
              '        private IProfileBlockReadSource _profileBlocks;\n')

          start = text.index('        private void Rebuild()\n')
          end = text.index('        private void DisposeWorld()\n', start)
          replacement = '''        private void Rebuild()
          {
              var watch = Stopwatch.StartNew();
              IVoxelStorageRuntime nextStorage = VoxelEngineBootstrap.CreateStorage(8, 24_000);
              const uint coatings = (1u << Coatings.Moss) | (1u << Coatings.Snow)
                                  | (1u << Coatings.Soot) | (1u << Coatings.Wet);
              nextStorage.RegisterMaterial(StoneMaterial, 210, DestructionClass.Crumble,
                                           SurfaceStyles.MasonryJoint, coatings);
              nextStorage.ConfigureCoatingDecoration(
                  Coatings.Moss,
                  (byte)_mossDensity,
                  (byte)_mossRadiusQ4,
                  (byte)_mossHeightQ4,
                  (byte)_mossDropQ4,
                  (byte)_mossSeparation);

              var request = new ArchLookdevBuildRequest
              {
                  ClearSpan = _clearSpan,
                  PierHeight = _pierHeight,
                  RingThickness = _ringThickness,
                  Depth = _depth,
                  VoussoirCount = _voussoirs,
                  ShoulderWidth = _shoulder,
                  TopMargin = _topMargin,
                  FaceRecess = _faceRecess,
                  PlinthHeight = _plinthHeight,
                  ImpostHeight = _impostHeight,
                  Damage = _damage,
                  DamageSeed = 0xA341u + (uint)_seedOffset,
                  DamageScale = _damageScale,
                  ProfileJointHalfWidthQ4 = _jointQ4,
                  ProfileBevelQ4 = _bevelQ4,
                  ProfileProjectionQ4 = _projectionQ4,
                  ProfileDepthQ4 = _faceDepthQ4,
                  StoneMaterial = StoneMaterial,
                  SurfaceStyle = SurfaceStyles.MasonryJoint,
                  Coating = Coatings.Moss,
                  CoatingCoverage = _mossCoverage,
                  BrushBudget = 2_000_000,
              };
              ArchLookdevBuildResult build = StructuresComposition.BuildArchLookdev(
                  nextStorage, in request);

              IVoxelStorageRuntime oldStorage = _storage;
              _storage = nextStorage;
              _profileBlocks = build.ProfileBlocks;
              var world = new RenderingWorldBinding(
                  _storage.Reads,
                  _storage.MaterialPresentation,
                  _storage.SurfacePresentation,
                  _storage.CoatingPresentation,
                  _profileBlocks);
              RenderingComposition.ConfigureWorld(
                  in world, _storage.Changes, 0, _buildBudgetMs, 0, farFieldEnabled: false);
              oldStorage?.Dispose();

              watch.Stop();
              _lastBuildMs = watch.Elapsed.TotalMilliseconds;
              _pendingRebuild = false;
              _lastBayWidth = build.Width;
              _lastBayHeight = build.Height;
              if (!_cameraInitialized) FrameCamera(build.Width, build.Height);
              _stateDirty = true;
          }

          '''
          text = text[:start] + replacement + text[end:]
          if 'VoxelEngine.Structures.Runtime' in text:
              raise SystemExit('ArchLookdev still references Structures.Runtime')
          path.write_text(text)
          PY

          rm .github/workflows/cutover13-runtime-inventory.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Composition/StructuresComposition.cs Assets/Scenes/Showcase/ArchLookdev.cs .github/workflows/cutover13-runtime-inventory.yml
          git diff --cached --check
          git commit -m "refactor(showcase): hide arch authoring runtime behind Composition"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
