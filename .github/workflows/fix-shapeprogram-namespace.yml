name: Repair ShapeProgram namespace references

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Repair two fully-qualified emitter references
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/Features/ShapeProgramTests.cs')
          text = p.read_text()
          old = 'Core.Features.Emitters.BoxEmitter.Box('
          if text.count(old) != 2:
              raise SystemExit(f'Expected 2 old BoxEmitter references, found {text.count(old)}')
          if 'using VoxelEngine.Structures.Runtime.Emitters;\n' not in text:
              anchor = 'using VoxelEngine.Structures.Runtime;\n'
              if text.count(anchor) != 1:
                  raise SystemExit('Runtime using anchor mismatch')
              text = text.replace(anchor, anchor + 'using VoxelEngine.Structures.Runtime.Emitters;\n', 1)
          text = text.replace(old, 'BoxEmitter.Box(')
          p.write_text(text)
          PY
          git rm .github/workflows/fix-shapeprogram-namespace.yml
          git diff --check
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets/Tests/Features/ShapeProgramTests.cs
          git commit -m 'Repair ShapeProgram emitter namespace references'
          git push origin HEAD:${{ github.ref_name }}
