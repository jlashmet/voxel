name: Edits server applier capability
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          import json, uuid

          api = Path('Assets/VoxelEngine/Edits/Api/IAlterationApplier.cs')
          api.write_text('''using Unity.Collections;\nusing Unity.Mathematics;\nusing VoxelEngine.Storage.Api;\n\nnamespace VoxelEngine.Edits.Api\n{\n    /// <summary>Application capability for canonical alteration events. Caller disposes affectedBlocks when created.</summary>\n    public interface IAlterationApplier\n    {\n        bool TryApply(\n            IRegionMutationStore storage,\n            in AlterationEvent evt,\n            out NativeList<int3> affectedBlocks);\n    }\n}\n''')
          Path(str(api)+'.meta').write_text(f'fileFormatVersion: 2\nguid: {uuid.uuid4().hex}\n')

          p=Path('Assets/VoxelEngine/Edits/Api/VoxelEngine.Edits.Api.asmdef')
          data=json.loads(p.read_text())
          if 'Unity.Collections' not in data['references']:
              data['references'].append('Unity.Collections')
          p.write_text(json.dumps(data, indent=2)+'\n')

          p=Path('Assets/VoxelEngine/Core/Edits/DeterministicAlterationApplier.cs')
          text=p.read_text()
          old='    public static class DeterministicAlterationApplier\n    {\n'
          new='''    public sealed class DeterministicAlterationApplier : IAlterationApplier\n    {\n        bool IAlterationApplier.TryApply(\n            IRegionMutationStore storage,\n            in AlterationEvent evt,\n            out NativeList<int3> affectedBlocks) =>\n            TryApply(storage, in evt, out affectedBlocks);\n\n'''
          if text.count(old)!=1: raise SystemExit('applier class declaration mismatch')
          p.write_text(text.replace(old,new,1))

          p=Path('Assets/VoxelEngine/Net/Server/ServerCommandProcessor.cs')
          text=p.read_text()
          iface='''    public interface IAuthoritativeAlterationApplier\n    {\n        bool TryApplyAlteration(IRegionMutationStore storage, in AlterationEvent evt);\n    }\n\n'''
          if text.count(iface)!=1: raise SystemExit('server interface block mismatch')
          text=text.replace(iface,'',1).replace('IAuthoritativeAlterationApplier','IAlterationApplier')
          if 'using Unity.Collections;\n' not in text:
              text=text.replace('using System.Collections.Generic;\n','using System.Collections.Generic;\nusing Unity.Collections;\n',1)
          old='''                    if (validation == Validation.ValidationResult.Success &&\n                        !applier.TryApplyAlteration(mutationStorage, in evt))\n                        validation = Validation.ValidationResult.InvalidTarget;\n'''
          new='''                    if (validation == Validation.ValidationResult.Success)\n                    {\n                        bool changed = applier.TryApply(\n                            mutationStorage, in evt, out NativeList<Unity.Mathematics.int3> affectedBlocks);\n                        if (affectedBlocks.IsCreated) affectedBlocks.Dispose();\n                        if (!changed) validation = Validation.ValidationResult.InvalidTarget;\n                    }\n'''
          if text.count(old)!=1: raise SystemExit('processor apply block mismatch')
          p.write_text(text.replace(old,new,1))

          p=Path('Assets/VoxelEngine/Net/Server/DestructionHandler.cs')
          text=p.read_text().replace('IAuthoritativeAlterationApplier','IAlterationApplier')
          old='''            if (!applier.TryApplyAlteration(mutationStorage, in evt))\n                return AdjudicationResult.Reject(\n                    authoritativeTick,\n                    player.PlayerId,\n                    S_AlterationRejected.Reason.InvalidTarget);\n'''
          new='''            bool changed = applier.TryApply(\n                mutationStorage, in evt, out NativeList<int3> affectedBlocks);\n            if (affectedBlocks.IsCreated) affectedBlocks.Dispose();\n            if (!changed)\n                return AdjudicationResult.Reject(\n                    authoritativeTick,\n                    player.PlayerId,\n                    S_AlterationRejected.Reason.InvalidTarget);\n'''
          if text.count(old)!=1: raise SystemExit('destruction apply block mismatch')
          p.write_text(text.replace(old,new,1))

          p=Path('Assets/VoxelEngine/Net/Server/AuthoritativeServerSession.cs')
          text=p.read_text()
          if 'using VoxelEngine.Edits.Api;\n' not in text:
              text=text.replace('using Unity.Networking.Transport;\n','using Unity.Networking.Transport;\nusing VoxelEngine.Edits.Api;\n',1)
          text=text.replace('private readonly ServerDeterministicAlterationApplier _defaultAlterationApplier;', 'private readonly IAlterationApplier _defaultAlterationApplier;')
          old='''            uint serverSeed,\n            Validation.DensityCap densityCap,\n            int maxConnections = 64,'''
          new='''            uint serverSeed,\n            Validation.DensityCap densityCap,\n            IAlterationApplier alterationApplier = null,\n            int maxConnections = 64,'''
          if text.count(old)!=1: raise SystemExit('server ctor signature mismatch')
          text=text.replace(old,new,1)
          text=text.replace('_defaultAlterationApplier = new ServerDeterministicAlterationApplier();','_defaultAlterationApplier = alterationApplier;',1)
          text=text.replace('IAuthoritativeAlterationApplier applier)','IAlterationApplier applier)')
          old='''        {\n            ProcessAuthoritativeTick(\n                serverTick,\n                ref table,\n                ref pool,\n                in zones,\n                inputSink,\n                _defaultAlterationApplier);\n        }\n\n        public void ProcessAuthoritativeTick('''
          new='''        {\n            if (_defaultAlterationApplier == null)\n                throw new InvalidOperationException("An Edits alteration applier must be supplied for the default authoritative tick path.");\n            ProcessAuthoritativeTick(\n                serverTick,\n                ref table,\n                ref pool,\n                in zones,\n                inputSink,\n                _defaultAlterationApplier);\n        }\n\n        public void ProcessAuthoritativeTick('''
          if text.count(old)!=1: raise SystemExit('default process overload mismatch')
          p.write_text(text.replace(old,new,1))

          # All session construction sites get a deterministic default so the optional null exists only for explicit test injection paths.
          session_files=[
              'Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs',
              'Assets/Tests/EditMode/AuthoritativeSessionLoopbackTests.cs',
              'Assets/Tests/EditMode/DeterministicNetworkParityTests.cs',
              'Assets/Tests/EditMode/RegionConvergenceTests.cs',
              'Assets/Tests/EditMode/RegionResyncFallbackTests.cs',
              'Assets/Tests/EditMode/RegionStateLoopbackTests.cs',
              'Assets/Tests/EditMode/TwoPlayerAuthoritativeLoopbackTests.cs',
          ]
          for name in session_files:
              p=Path(name); text=p.read_text()
              if 'using VoxelEngine.Core.Edits;\n' not in text:
                  insert='using VoxelEngine.Core.Edits;\n'
                  # insert before first VoxelEngine.Core.Storage import when possible
                  if 'using VoxelEngine.Core.Storage;\n' in text:
                      text=text.replace('using VoxelEngine.Core.Storage;\n',insert+'using VoxelEngine.Core.Storage;\n',1)
                  else:
                      text=insert+text
              lines=text.splitlines()
              found=False
              for i,line in enumerate(lines):
                  if 'densityCap:' in line and 'new Validation.DensityCap' in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      if line.rstrip().endswith('));'):
                          lines[i]=line.rstrip()[:-2]+','
                          lines.insert(i+1, indent+'alterationApplier: new DeterministicAlterationApplier());')
                      else:
                          lines.insert(i+1, indent+'alterationApplier: new DeterministicAlterationApplier(),')
                      found=True; break
              if not found and name.endswith('ShowcaseMultiplayerSession.cs'):
                  for i,line in enumerate(lines):
                      if 'new Validation.DensityCap(1f, VoxelDimensions.BricksPerRegion),' in line:
                          indent=line[:len(line)-len(line.lstrip())]
                          lines.insert(i+1, indent+'new DeterministicAlterationApplier(),')
                          found=True; break
              if not found: raise SystemExit(f'could not inject session applier in {name}')
              p.write_text('\n'.join(lines)+'\n')

          # Replace the now-deleted server wrapper test use.
          p=Path('Assets/Tests/EditMode/DeterministicNetworkParityTests.cs')
          text=p.read_text().replace('new ServerDeterministicAlterationApplier()','new DeterministicAlterationApplier()')
          p.write_text(text)

          # Minimal server test doubles implement the domain capability and return an empty affected-block list.
          for name, cls in [
              ('Assets/Tests/EditMode/AuthoritativeSessionLoopbackTests.cs','AcceptingApplier'),
              ('Assets/Tests/EditMode/ServerCommandProcessorTests.cs','RecordingApplier')]:
              p=Path(name); text=p.read_text()
              text=text.replace(f'private sealed class {cls} : IAuthoritativeAlterationApplier', f'private sealed class {cls} : IAlterationApplier')
              text=text.replace('public bool TryApplyAlteration(IRegionMutationStore storage, in AlterationEvent evt)\n            {', 'public bool TryApply(IRegionMutationStore storage, in AlterationEvent evt, out NativeList<int3> affectedBlocks)\n            {\n                affectedBlocks = new NativeList<int3>(0, Allocator.Temp);')
              p.write_text(text)
          PY
          git rm Assets/VoxelEngine/Net/Server/ServerDeterministicAlterationApplier.cs Assets/VoxelEngine/Net/Server/ServerDeterministicAlterationApplier.cs.meta
          git rm .github/workflows/edits-applier-callsite-inventory.yml .github/workflows/edits-client-composition-inventory.yml .github/workflows/edits-server-applier-capability.yml
          git diff --check
          test ! -e Assets/VoxelEngine/Net/Server/ServerDeterministicAlterationApplier.cs
          grep -RIn 'IAuthoritativeAlterationApplier' Assets Packages --include='*.cs' && exit 1 || true
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Edits/Api/IAlterationApplier.cs Assets/VoxelEngine/Edits/Api/IAlterationApplier.cs.meta Assets/VoxelEngine/Edits/Api/VoxelEngine.Edits.Api.asmdef Assets/VoxelEngine/Core/Edits/DeterministicAlterationApplier.cs Assets/VoxelEngine/Net/Server Assets/Scenes/Showcase/ShowcaseMultiplayerSession.cs Assets/Tests/EditMode/AuthoritativeSessionLoopbackTests.cs Assets/Tests/EditMode/DeterministicNetworkParityTests.cs Assets/Tests/EditMode/RegionConvergenceTests.cs Assets/Tests/EditMode/RegionResyncFallbackTests.cs Assets/Tests/EditMode/RegionStateLoopbackTests.cs Assets/Tests/EditMode/TwoPlayerAuthoritativeLoopbackTests.cs Assets/Tests/EditMode/ServerCommandProcessorTests.cs
          git commit -m 'Inject Edits alteration capability into server'
          git push origin HEAD:${{ github.ref_name }}
