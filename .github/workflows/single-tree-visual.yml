name: Single Tree Visual

on:
  workflow_dispatch:
  push:
    branches:
      - fix/surface-rendering-recovery

jobs:
  capture-single-tree:
    name: Render one procedural tree
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Render deterministic tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/SingleTree"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.SingleTreeCapture.Run \
            -logFile "$GITHUB_WORKSPACE/Artifacts/SingleTree/unity.log" \
            -quit

          test -s "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.txt"

      - name: Show tree metadata
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.txt" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.txt"
          fi

      - name: Upload single-tree artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-tree-${{ github.sha }}
          path: Artifacts/SingleTree/
          if-no-files-found: warn
          retention-days: 14
