name: Tree Rendering Visual Isolation

# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
concurrency:
  group: tree-rendering-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree-visual-isolation:
    name: Isolate procedural tree rendering
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Render direct mesh-builder baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Artifacts/SingleTree"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/SingleTree"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.SingleTreeCapture.Run \
            -logFile "$GITHUB_WORKSPACE/Artifacts/SingleTree/unity.log" \
            -quit
          test -s "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.txt"

      - name: Run registry-to-runtime-renderer PlayMode test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Artifacts/RegistryTree"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/RegistryTree"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.CI.RegistryTreeVisualTests.RegistryRenderer_RendersExactlyOneUprightTree" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/RegistryTree/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/RegistryTree/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/RegistryTree/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/RegistryTree/registry-tree.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/RegistryTree/registry-tree.txt"

      - name: Run batched forest rendering contract
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.CI.TreeBatchRenderingTests.HealthyForest_BatchesVisibly_AndDamageReleasesOneTree" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/RegistryTree/batch-results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/RegistryTree/batch-unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/RegistryTree/batch-results.xml"

      - name: Run semantic destruction visual proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Artifacts/TreeDestruction"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/TreeDestruction"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.CI.TreeDestructionVisualTests.SemanticTree_BranchDetachesAndTrunkLeavesFallingCrown" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/tree-destruction.txt"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/01-before.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/02-after-branch-hit.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/03-after-trunk-hit.png"

      - name: Temporarily add Showcase scene to CI build settings
        shell: bash
        run: |
          set -euo pipefail
          SHOWCASE_GUID="$(awk '/^guid:/ { print $2 }' Assets/Scenes/VoxelShowcase.unity.meta)"
          cat > ProjectSettings/EditorBuildSettings.asset <<EOF
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!1045 &1
          EditorBuildSettings:
            m_ObjectHideFlags: 0
            serializedVersion: 2
            m_Scenes:
            - enabled: 1
              path: Assets/Scenes/VoxelShowcase.unity
              guid: ${SHOWCASE_GUID}
            m_configObjects: {}
          EOF

      - name: Run real Showcase startup integration test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.CI.ShowcaseTreeVisualTests.ShowcaseStartup_HasOneUprightUndamagedSemanticTreePresentation" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/showcase-tree.txt"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/showcase-tree.png"

      - name: Run real Showcase tornado destruction proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction"
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.CI.ShowcaseTreeDestructionVisualTests.ShowcaseTornado_BreaksBranchAndSeversTreeVisibly" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/showcase-tree-destruction.txt"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/01-showcase-before.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/02-showcase-branch-falling.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/03-showcase-branch-gone.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/04-showcase-crown-toppling.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/05-showcase-crown-gone.png"

      - name: Show visual metadata
        if: always()
        shell: bash
        run: |
          echo "--- Direct mesh-builder baseline ---"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.txt" || cat "$GITHUB_WORKSPACE/Artifacts/SingleTree/single-tree.txt"
          echo "--- Registry -> runtime renderer ---"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/RegistryTree/registry-tree.txt" || cat "$GITHUB_WORKSPACE/Artifacts/RegistryTree/registry-tree.txt"
          echo "--- Semantic destruction ---"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/tree-destruction.txt" || cat "$GITHUB_WORKSPACE/Artifacts/TreeDestruction/tree-destruction.txt"
          echo "--- Real Showcase startup ---"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/showcase-tree.txt" || cat "$GITHUB_WORKSPACE/Artifacts/ShowcaseTree/showcase-tree.txt"
          echo "--- Real Showcase tornado destruction ---"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/showcase-tree-destruction.txt" || cat "$GITHUB_WORKSPACE/Artifacts/ShowcaseTreeDestruction/showcase-tree-destruction.txt"

      - name: Upload direct-tree artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-tree-${{ github.sha }}
          path: Artifacts/SingleTree/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload registry-renderer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-tree-${{ github.sha }}
          path: Artifacts/RegistryTree/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tree-destruction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-destruction-${{ github.sha }}
          path: Artifacts/TreeDestruction/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Showcase startup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-tree-${{ github.sha }}
          path: Artifacts/ShowcaseTree/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Showcase tornado destruction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-tree-destruction-${{ github.sha }}
          path: Artifacts/ShowcaseTreeDestruction/
          if-no-files-found: warn
          retention-days: 14
