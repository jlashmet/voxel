name: Record CharacterMotor API acceptance
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/record-character-motor-api.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Record accepted CharacterMotor slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()
          old_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field Showcase is Storage.Api-only; empty Runtime-coupled Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          new_row = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field and CharacterMotor voxel reads are Storage.Api-only; empty Tools shells deleted; 386/373/13 baseline preserved | migrate remaining Showcase concrete Runtime wiring, remove residual Core guard literals/temporary exceptions, final dependency report |'
          if text.count(old_row) != 1:
              raise SystemExit('Cutover 13 status row did not match')
          text = text.replace(old_row, new_row, 1)

          old_gate = '- Latest accepted code gate: `a4f80c5d96397e6de64720c3b3608b6e81fb27a5` — 386 tests, 373 passed, exactly the same 13 known baseline failures. Tools shell removal run `31896191600` accepts deletion of the source-empty `VoxelEngine.Tools` / `VoxelEngine.Tools.Features` assemblies after proving no foreign asmdef references remained.'
          new_gate = '- Latest accepted code gate: `40007bc9e7ae074223bef71619c1e070a38a7d54` — 386 tests, 373 passed, exactly the same 13 known baseline failures. CharacterMotor API run `31896455076` accepts replacement of direct `VoxelAccess`/physical Storage reads with the existing Storage.Api `IVoxelSurfaceQuery` capability.'
          if text.count(old_gate) != 1:
              raise SystemExit('latest accepted gate line did not match')
          text = text.replace(old_gate, new_gate, 1)

          marker = '- [x] Empty `VoxelEngine.Tools` / `VoxelEngine.Tools.Features` assembly shells deleted at `a4f80c5d96397e6de64720c3b3608b6e81fb27a5`; hosted pre-delete inventory found no source and no foreign references, and gate `31896191600` preserved the 386/373/13 baseline.\n'
          addition = marker + '- [x] `CharacterMotor` no longer imports Storage.Runtime or calls `VoxelAccess`; character overlap reads use `IVoxelSurfaceQuery` exposed by ShowcaseWorld, accepted at source `40007bc9e7ae074223bef71619c1e070a38a7d54`, run `31896455076` (386/373/13, exact known failure set).\n'
          if text.count(marker) != 1:
              raise SystemExit('Cutover 13 progress marker did not match')
          text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: record accepted CharacterMotor API boundary'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
