name: Workflow Runner Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-update-guard:
    name: Detect targeted-test-only update
    runs-on: [self-hosted, macOS]
    timeout-minutes: 2
    outputs:
      run_pr_ci: ${{ steps.detect.outputs.run_pr_ci }}
    steps:
      - name: Detect request-only synchronize
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "run_pr_ci=true" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" != "pull_request" || "$EVENT_ACTION" != "synchronize" || -z "${BEFORE_SHA:-}" || -z "${AFTER_SHA:-}" ]]; then
            exit 0
          fi

          API="https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$AFTER_SHA"
          RESPONSE="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API" 2>/dev/null || true)"

          if [[ -z "$RESPONSE" ]]; then
            echo "::warning::Could not inspect synchronize range; running policy normally."
            exit 0
          fi

          ONLY_REQUEST="$(printf '%s' "$RESPONSE" | python3 -c '
import json
import sys
files = [item.get("filename") for item in json.load(sys.stdin).get("files", [])]
print("true" if files == [".github/test-request.json"] else "false")
')"

          if [[ "$ONLY_REQUEST" == "true" ]]; then
            echo "run_pr_ci=false" >> "$GITHUB_OUTPUT"
            echo "Targeted-test request-only update; skipping workflow policy checkout."
          fi

  policy:
    needs: request-update-guard
    if: needs.request-update-guard.outputs.run_pr_ci != 'false'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Reject GitHub-hosted runners
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'runs-on:[[:space:]]*(ubuntu|macos|windows)-latest|runs-on:[[:space:]]*\[[^]]*(ubuntu|macos|windows)-latest' .github/workflows; then
            echo 'GitHub-hosted runners are forbidden in this repository. Use runs-on: [self-hosted, macOS].' >&2
            exit 1
          fi
          echo 'All workflows use self-hosted runners.'
