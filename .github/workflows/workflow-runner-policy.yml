name: Workflow Runner Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Reject GitHub-hosted runners
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'runs-on:[[:space:]]*(ubuntu|macos|windows)-latest|runs-on:[[:space:]]*\[[^]]*(ubuntu|macos|windows)-latest' .github/workflows; then
            echo 'GitHub-hosted runners are forbidden in this repository. Use runs-on: [self-hosted, macOS].' >&2
            exit 1
          fi
          echo 'All workflows use self-hosted runners.'
      - name: Reject task-specific one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          if find .github/workflows -maxdepth 1 -type f -name 'one-shot*.yml' | grep -q .; then
            find .github/workflows -maxdepth 1 -type f -name 'one-shot*.yml' -print >&2
            echo 'Task-specific one-shot workflows are forbidden; use tests-single.yml.' >&2
            exit 1
          fi
          echo 'No task-specific one-shot workflows found.'
