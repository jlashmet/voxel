name: Rendering cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-cutover-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== CORE STORAGE SYMBOL USE IN RENDERING ==='
          grep -RInE '\b(MaterialPalette|SurfaceCatalogue|CoatingCatalogue|VoxelChangeJournal|VoxelDimensions|RegionTable|BrickPool|BrickRef|VoxelAccess|Region\b|Mat\.)\b' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
          echo '=== WORLD VIEW MEMBERS USED OUTSIDE BRIDGE ==='
          grep -RInE '\.(Palette|SurfaceCatalogue|CoatingCatalogue|Storage|ProfileBlocks)\b|VoxelRenderBridge\.Changes' Assets/VoxelEngine/Rendering Assets/Scenes/Showcase Assets/Tests Assets/VoxelEngine/CI --include='*.cs' | sort || true
          echo '=== CHANGE JOURNAL API USE ==='
          grep -RInE 'VoxelChangeJournal|\.Changes\b|TryDequeue|Consume|Read.*Change|Version' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
