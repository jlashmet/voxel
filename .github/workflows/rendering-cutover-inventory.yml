name: Rendering cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-cutover-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== RENDERING_FILES ==='
          find Assets/VoxelEngine/Rendering -type f \( -name '*.cs' -o -name '*.asmdef' \) | sort
          echo '=== CORE_REFS_INSIDE_RENDERING ==='
          grep -RInE 'VoxelEngine\.Core|Core/(Storage|Terrain|Features|Edits|Structure|Vegetation)' Assets/VoxelEngine/Rendering --include='*.cs' --include='*.asmdef' || true
          echo '=== NAMESPACES_INSIDE_RENDERING ==='
          grep -RInE '^[[:space:]]*namespace ' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
          echo '=== EXTERNAL_RENDERING_SOURCE_REFS ==='
          grep -RInE 'using VoxelEngine\.Rendering|VoxelEngine\.Rendering\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Rendering/' | sort || true
          echo '=== ASMDEF_RENDERING_REFS ==='
          grep -RIn 'VoxelEngine.Rendering' Assets Packages --include='*.asmdef' | sort || true
          echo '=== ENGINE_RUNTIME_REFS_TO_RENDERING ==='
          grep -RInE 'VoxelEngine\.Rendering' Assets/VoxelEngine --include='*.cs' --include='*.asmdef' | grep -v '^Assets/VoxelEngine/Rendering/' | sort || true
          echo '=== ROOT_PUBLIC_TYPES ==='
          grep -RInE '^[[:space:]]*public (sealed |static |readonly )?(class|struct|interface|enum)' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
