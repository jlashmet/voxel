name: Rendering cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-cutover-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Capture final Rendering cutover inventory
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/rendering-cutover-inventory.txt"
          {
            echo '=== RENDERING FILES ==='
            find Assets/VoxelEngine/Rendering -type f \( -name '*.cs' -o -name '*.asmdef' -o -name '*.shader' -o -name '*.compute' \) | sort
            echo '=== CORE STORAGE SYMBOL USE IN RENDERING ==='
            grep -RInE '\b(MaterialPalette|SurfaceCatalogue|CoatingCatalogue|VoxelChangeJournal|VoxelDimensions|RegionTable|BrickPool|BrickRef|VoxelAccess|Region\b|Mat\.)\b' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
            echo '=== OUTSIDE SOURCE REFERENCES TO RENDERING ==='
            grep -RInE 'using VoxelEngine\.Rendering|VoxelEngine\.Rendering\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Rendering/' | sort || true
            echo '=== OUTSIDE ASMDEF REFERENCES TO RENDERING ==='
            grep -RIn '"VoxelEngine.Rendering"' Assets Packages --include='*.asmdef' | grep -v '^Assets/VoxelEngine/Rendering/' | sort || true
            echo '=== PUBLIC TYPES IN RENDERING ==='
            grep -RInE '^\s*public\s+(static\s+)?(class|struct|interface|enum|sealed\s+class|readonly\s+struct)\s+' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
            echo '=== WORLD VIEW MEMBERS USED OUTSIDE BRIDGE ==='
            grep -RInE '\.(Palette|SurfaceCatalogue|CoatingCatalogue|Storage|ProfileBlocks)\b|VoxelRenderBridge\.Changes' Assets/VoxelEngine/Rendering Assets/Scenes/Showcase Assets/Tests Assets/VoxelEngine/CI --include='*.cs' | sort || true
          } | tee "$REPORT"
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: rendering-cutover-inventory
          path: ${{ runner.temp }}/rendering-cutover-inventory.txt
          retention-days: 2
