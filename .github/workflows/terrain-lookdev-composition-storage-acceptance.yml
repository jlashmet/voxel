name: TerrainLookdev Composition storage acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f7f410f370b085605367cd7d0683bb7639c717d
          fetch-depth: 1
      - name: Verify TerrainLookdev Composition storage boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('Assets/Scenes/Showcase')
          lookdev = (root / 'TerrainLookdev.cs').read_text()
          composition = Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          runtime_palette = Path('Assets/VoxelEngine/Storage/Runtime/MaterialPalette.cs').read_text()
          api_destruction = Path('Assets/VoxelEngine/Storage/Api/DestructionClass.cs').read_text()

          forbidden = [
              'using VoxelEngine.Storage.Runtime;',
              'RegionTable ', 'new RegionTable(', 'BrickPool ', 'new BrickPool(',
              'RegionReadSource ', 'new RegionReadSource(',
              'RegionMutationStore ', 'new RegionMutationStore(',
              'MaterialPalette ', '_palette',
              'SurfaceCatalogue.CreateBuiltIns', '_surfaces',
              'CoatingCatalogue.CreateBuiltIns', '_coatings',
              'VoxelChangeJournal ', 'new VoxelChangeJournal(', '_changes',
          ]
          bad = [token for token in forbidden if token in lookdev]
          if bad:
              raise SystemExit('TerrainLookdev retains concrete Storage.Runtime detail: ' + ', '.join(bad))

          required = [
              'using VoxelEngine.Composition;', 'IVoxelStorageRuntime',
              'VoxelEngineBootstrap.CreateStorage', '_storage.RegisterMaterial',
              '_storage.Reads', '_storage.Mutations', '_storage.MaterialAuthoring',
              '_storage.MaterialPresentation', '_storage.SurfacePresentation',
              '_storage.CoatingPresentation', '_storage.PublishAllResidentRegions',
              '_storage?.Dispose()',
          ]
          missing = [token for token in required if token not in lookdev]
          if missing:
              raise SystemExit('TerrainLookdev Composition seam incomplete: ' + ', '.join(missing))

          composition_required = [
              'private MaterialPalette _materials;',
              'private SurfaceCatalogue _surfaces;',
              'private CoatingCatalogue _coatings;',
              'IMaterialAuthoringCatalogue MaterialAuthoring',
              'MaterialPaletteView MaterialPresentation',
              'SurfaceCatalogueView SurfacePresentation',
              'CoatingCatalogueView CoatingPresentation',
              'void RegisterMaterial(', 'void PublishAllResidentRegions()',
          ]
          missing = [token for token in composition_required if token not in composition]
          if missing:
              raise SystemExit('Composition storage lifetime missing catalogue ownership: ' + ', '.join(missing))

          if 'public enum DestructionClass : byte' not in api_destruction:
              raise SystemExit('DestructionClass is not owned by Storage.Api')
          if 'enum DestructionClass' in runtime_palette:
              raise SystemExit('Storage.Runtime still defines DestructionClass')
          if 'using VoxelEngine.Storage.Api;' not in runtime_palette:
              raise SystemExit('MaterialPalette does not consume Api DestructionClass')

          storage_files=[]
          for path in sorted(root.rglob('*.cs')):
              if 'VoxelEngine.Storage.Runtime' in path.read_text():
                  storage_files.append(path)
          expected={root/'ArchLookdev.cs', root/'ShowcaseWorld.cs'}
          print('FILES_WITH_STORAGE_RUNTIME=', len(storage_files))
          for path in storage_files: print('STORAGE', path)
          if set(storage_files) != expected:
              raise SystemExit('Unexpected remaining Storage.Runtime scene owners: ' + ', '.join(map(str, storage_files)))
          print('TerrainLookdev Composition storage boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f7f410f370b085605367cd7d0683bb7639c717d
          clean: false
          fetch-depth: 1
      - name: Reset pinned TerrainLookdev candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 0f7f410f370b085605367cd7d0683bb7639c717d
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/TerrainLookdevCompositionStorage"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-lookdev-composition-storage-0f7f410f
          path: Artifacts/TerrainLookdevCompositionStorage/
          if-no-files-found: warn
          retention-days: 14
