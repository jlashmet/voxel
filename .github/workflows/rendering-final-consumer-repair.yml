name: Rendering final consumer repair
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-final-consumer-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Migrate remaining test and CI catalogue consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          play = Path('Assets/Tests/PlayMode/ShowcaseGpuSurfaceTests.cs')
          text = play.read_text()
          replacements = {
              'world.SurfaceCatalogue.CatalogueHash': 'world.SurfaceCatalogueView.CatalogueHash',
              'world.CoatingCatalogue.CatalogueHash': 'world.CoatingCatalogueView.CatalogueHash',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'{play}: expected one {old}')
              text = text.replace(old, new, 1)
          play.write_text(text)

          arch = Path('Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs')
          text = arch.read_text()
          for old, new in (
              ('SurfaceCatalogue = surfaces,', 'SurfaceCatalogueView = surfaces,'),
              ('CoatingCatalogue = coatings,', 'CoatingCatalogueView = coatings,'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'{arch}: expected one {old}')
              text = text.replace(old, new, 1)
          arch.write_text(text)

          material_palette_files = [
              Path('Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.Core.cs'),
              Path('Assets/VoxelEngine/CI/Editor/KentridgeCaptureImpl.cs'),
              Path('Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs'),
          ]
          for path in material_palette_files:
              text = path.read_text()
              marker = '                CoatingCatalogue coatings = CoatingCatalogue.CreateBuiltIns();\n'
              addition = marker + (
                  '                VoxelEngine.Storage.Api.MaterialPaletteView materialPaletteView = materialPalette;\n'
                  '                VoxelEngine.Storage.Api.SurfaceCatalogueView surfaceView = surfaces;\n'
                  '                VoxelEngine.Storage.Api.CoatingCatalogueView coatingView = coatings;\n'
              )
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one catalogue construction marker')
              if 'materialPaletteView = materialPalette;' in text:
                  raise SystemExit(f'{path}: view migration already present unexpectedly')
              text = text.replace(marker, addition, 1)
              old = 'in materialPalette,\n                        in surfaces, in coatings,'
              new = 'in materialPaletteView,\n                        in surfaceView, in coatingView,'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one Prepare material/catalogue argument seam')
              text = text.replace(old, new, 1)
              path.write_text(text)

          unified = Path('Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs')
          text = unified.read_text()
          marker = '                CoatingCatalogue coatings = CoatingCatalogue.CreateBuiltIns();\n'
          addition = marker + (
              '                VoxelEngine.Storage.Api.MaterialPaletteView materialPaletteView = materials;\n'
              '                VoxelEngine.Storage.Api.SurfaceCatalogueView surfaceView = surfaces;\n'
              '                VoxelEngine.Storage.Api.CoatingCatalogueView coatingView = coatings;\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f'{unified}: expected one catalogue construction marker')
          text = text.replace(marker, addition, 1)
          old = 'in materials,\n                        in surfaces, in coatings,'
          new = 'in materialPaletteView,\n                        in surfaceView, in coatingView,'
          if text.count(old) != 1:
              raise SystemExit(f'{unified}: expected one Prepare catalogue argument seam')
          text = text.replace(old, new, 1)
          unified.write_text(text)

          forbidden = [
              'world.SurfaceCatalogue.CatalogueHash',
              'world.CoatingCatalogue.CatalogueHash',
              'SurfaceCatalogue = surfaces,',
              'CoatingCatalogue = coatings,',
              'in materialPalette,\n                        in surfaces, in coatings,',
              'in materials,\n                        in surfaces, in coatings,',
          ]
          roots = [play, arch, *material_palette_files, unified]
          for path in roots:
              text = path.read_text()
              for value in forbidden:
                  if value in text:
                      raise SystemExit(f'{path}: stale Rendering catalogue consumer remains: {value}')
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/PlayMode/ShowcaseGpuSurfaceTests.cs \
            Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs \
            Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.Core.cs \
            Assets/VoxelEngine/CI/Editor/KentridgeCaptureImpl.cs \
            Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs \
            Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs
          git commit -m 'Migrate Rendering test and capture consumers to Storage API views'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
