name: Brick COW pinning foundation one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-brick-cow-foundation-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_brick_cow_foundation_patch.py
      - name: Static guards
        run: |
          grep -q 'public readonly struct PinToken' Assets/VoxelEngine/Storage/Runtime/BrickPool.cs
          grep -q 'public int EnsureWritable' Assets/VoxelEngine/Storage/Runtime/BrickPool.cs
          grep -q 'PinnedBrickUsesCopyOnWriteAndDefersRecycling' Assets/Tests/EditMode/StorageAllocationTests.cs
          grep -q 'BrickPoolSupportsGenerationStampedCowReaders' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit COW foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Storage/Runtime/BrickPool.cs \
                  Assets/Tests/EditMode/StorageAllocationTests.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Add generation-stamped COW brick read pins'
          git push origin HEAD:refactor/async-geometry-pipeline
