name: Madeline base-body build

on:
  push:
    branches:
      - feature/character-weapon-asset-pipeline
      - agent/madeline-projection-repair
    paths:
      - 'tools/character-factory/production/madeline/**'
      - 'tools/character-factory/runtime/blender_alignment.py'
      - 'tools/character-factory/runtime/blender_multiview_texture.py'
      - 'tools/character-factory/runtime/blender_texture_rigged_character.py'
      - 'tools/character-factory/runtime/blender_project_face_texture.py'
      - 'tools/character-factory/runtime/blender_prepare_character.py'
      - 'tools/character-factory/runtime/blender_gameplay_animation.py'
      - 'tools/character-factory/runtime/pipelines/character.py'
      - 'tools/character-factory/ci/verify_madeline_base_contract.py'
      - 'tools/character-factory/character_factory.py'
      - '.github/workflows/madeline-base-body-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: madeline-base-body-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-madeline-base:
    runs-on: [self-hosted, macOS]
    # The first successful run may need to resume/download the ~5 GB turbo
    # checkpoint into the runner's persistent cache. Subsequent runs reuse it.
    timeout-minutes: 180
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
      PYTHONUNBUFFERED: '1'
      OUT: Artifacts/MadelineProduction
      REVIEW_DIR: docs/lookdev/characters/madeline/base-body

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Compile character factory Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/character-factory

      - name: Build clothing-free Madeline base character
        shell: bash
        run: |
          set -euo pipefail
          bash tools/character-factory/production/madeline/build.sh "$GITHUB_WORKSPACE/$OUT"

      # Preserve expensive reconstruction/rigging intermediates when a later identity,
      # verification, render, or staging step fails. This is intentionally separate
      # from the successful production artifact so downstream composition never treats
      # a failed build as an approved Madeline base.
      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: madeline-base-body-failure-${{ github.run_number }}
          path: Artifacts/MadelineProduction/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify reusable Madeline base contract
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="${BLENDER_BIN:-/Applications/Blender.app/Contents/MacOS/Blender}"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_madeline_base_contract.py -- \
            --input "$GITHUB_WORKSPACE/$OUT/madeline_body_01.fbx"

      - name: Upload generated character
        uses: actions/upload-artifact@v4
        with:
          name: madeline-base-body
          path: Artifacts/MadelineProduction/
          if-no-files-found: error
          retention-days: 14

      - name: Publish lookdev proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          cp "$OUT/madeline_body_01.render.png" "$REVIEW_DIR/"
          cp "$OUT/madeline_body_01.idle.png" "$REVIEW_DIR/"
          cp "$OUT/body-only-reference-report.json" "$REVIEW_DIR/"
          cp "$OUT/reference/raw/front.jpg" "$REVIEW_DIR/reference-front.jpg"
          cp "$OUT/reference/body-only/front.jpg" "$REVIEW_DIR/body-only-front.jpg"
          cp "$OUT/reference/madeline_face_front.png" "$REVIEW_DIR/madeline-face-reference.png"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR"
          if git diff --cached --quiet; then
            echo 'Latest Madeline base-body review is already published.'
            exit 0
          fi
          git commit -m 'docs(characters): publish Madeline base-body proof [madeline-base-review]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

# CI trigger: run the fully repaired Madeline source/texture/face pipeline.
