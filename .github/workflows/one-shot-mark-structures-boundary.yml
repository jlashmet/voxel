name: One-shot Mark Structures Boundary

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-mark-structures-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Update checklist
        run: python .github/scripts/one_shot_mark_structures_boundary.py
      - name: Verify documentation-only diff
        run: |
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          test -n "$(git status --short docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md)"
      - name: Commit and remove one-shot tooling
        run: |
          rm .github/scripts/one_shot_mark_structures_boundary.py
          rm .github/workflows/one-shot-mark-structures-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/scripts/one_shot_mark_structures_boundary.py .github/workflows/one-shot-mark-structures-boundary.yml
          git commit -m "docs: mark structures storage boundary complete"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
