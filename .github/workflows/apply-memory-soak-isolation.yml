name: Apply per-tier memory soak isolation

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-memory-soak-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Split tier soak fixtures
        run: python3 .github/scripts/split-memory-soak-tiers.py
      - name: Validate patch
        run: |
          git diff --check
          git diff -- \
            Assets/Tests/PlayMode/MemoryStabilityTests.cs \
            .github/workflows/tests-pr.yml \
            .github/workflows/tests-master.yml
      - name: Commit clean isolation and retire transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Tests/PlayMode/MemoryStabilityTests.cs .github/workflows/tests-pr.yml .github/workflows/tests-master.yml
          git rm .github/scripts/split-memory-soak-tiers.py .github/workflows/apply-memory-soak-isolation.yml
          git commit -m 'ci: isolate memory soak tiers per Unity process'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
