name: Cutover 13 final Unity acceptance

on:
  workflow_dispatch:
  push:
    branches: [refactor/system-boundaries-finalization-clean]
    paths:
      - ".github/workflows/cutover13-final-acceptance.yml"
      - "Assets/VoxelEngine/**"
      - "Assets/Scenes/Showcase/**"
      - "Assets/Tests/EditMode/**"
      - "Packages/com.mountingforce.worldgen/**"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"

permissions:
  contents: read

concurrency:
  group: cutover13-final-unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final Composition ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          scene = Path('Assets/Scenes/Showcase')
          composition = Path('Assets/VoxelEngine/Composition')
          moved = (
              'ShowcaseWorld.cs',
              'ShowcaseWorld.StorageBridge.cs',
              'ShowcaseCatalogue.cs',
              'ShowcaseHeightJob.cs',
              'FarFieldStructureStore.cs',
          )
          missing = [name for name in moved if not (composition / name).is_file()]
          stale = [name for name in moved if (scene / name).exists()]
          if missing:
              raise SystemExit('Composition-owned Showcase files missing: ' + ', '.join(missing))
          if stale:
              raise SystemExit('Showcase still owns concrete runtime files: ' + ', '.join(stale))

          asmdef = json.loads((scene / 'VoxelEngine.Showcase.asmdef').read_text())
          runtime_refs = [
              ref for ref in asmdef.get('references', [])
              if ref.startswith('VoxelEngine.') and ref.endswith('.Runtime')
          ]
          if runtime_refs:
              raise SystemExit('Showcase asmdef Runtime references: ' + ', '.join(runtime_refs))

          source_violations = []
          for path in scene.rglob('*.cs'):
              text = path.read_text()
              if 'VoxelEngine.Storage.Runtime' in text or 'VoxelEngine.Structures.Runtime' in text or 'VoxelEngine.Rendering.Runtime' in text or 'VoxelEngine.Vegetation.Runtime' in text or 'VoxelEngine.Net.Runtime' in text:
                  source_violations.append(path.as_posix())
          if source_violations:
              raise SystemExit('Showcase concrete Runtime source references: ' + ', '.join(source_violations))

          print('Final Composition ownership accepted')
          PY

  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Reset exact candidate while preserving Unity cache
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        name: Locate Unity editor
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done
      - name: Run and verify exact EditMode baseline
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/Cutover13Final"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true

          test -s "$ROOT/results.xml"
          if grep -E 'error CS[0-9]+' "$ROOT/unity.log"; then
            echo 'Compiler errors detected' >&2
            exit 1
          fi

          python3 - "$ROOT/results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              'VoxelEngine.Tests.PlayMode.ChainCombatEnemyAIV8Tests.CurrentCascadeLabBootsWithEnemyAIStack',
              'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.BattleResetClearsSharedPlanHistoryAndGhostBackToStart',
              'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.PlannerBootsWithGhostBoardAndVisualLayer',
              'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.SharedPlanExecutionRequiresEveryLivingPlayerReady',
              'VoxelEngine.Tests.PlayMode.ChainCombatMechanicsV2Tests.CascadeLabControllerBootsFourPlayerBattle',
              'VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.CommittingApprovedPlanPreservesReadyForEnemyHandoff',
              'VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.EditingAnApprovedPlanRevokesEveryReadyApproval',
              'VoxelEngine.Tests.PlayMode.ChainCombatPrototypeTests.ControllerBootsPlayableBattlePresentation',
              'VoxelEngine.Tests.EditMode.KentridgeAnchorUndercroftTests.AnchorUndercroftsOccupyPubAndWarehouseSupportFacesWithoutAddingGameplayStructures',
              'VoxelEngine.Tests.EditMode.KentridgeGenerationTests.DistrictTerracesCreateNeighbourhoodScaleShelves',
              'VoxelEngine.Tests.EditMode.KentridgeInfrastructureTests.UrbanInfrastructureStaysSeparateFromStableGameplayStructures',
              'VoxelEngine.Tests.EditMode.KentridgeUrbanFabricTests.UrbanFabricCatalogueRealizesAllEightBlocksAsIndividualBuildings',
              'VoxelEngine.Tests.EditMode.SurfaceRingBandTests.RingsDoNotReachBeyondTheStreamingRadius',
          }

          root = ET.parse(sys.argv[1]).getroot()
          failed = {
              case.get('fullname') or case.get('name')
              for case in root.iter('test-case')
              if (case.get('result') or '').lower() in ('failed', 'failure')
          }
          if failed != expected:
              print('Unexpected failures:', sorted(failed - expected))
              print('Missing baseline failures:', sorted(expected - failed))
              raise SystemExit(1)

          totals = (root.get('total'), root.get('passed'), root.get('failed'))
          if totals != ('387', '374', '13'):
              raise SystemExit('Unexpected totals: total=%s passed=%s failed=%s' % totals)

          print('Exact accepted 387/374/13 baseline matched')
          PY
      - name: Upload final acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover13-final-${{ github.sha }}
          path: Artifacts/Cutover13Final/
          if-no-files-found: warn
          retention-days: 14
