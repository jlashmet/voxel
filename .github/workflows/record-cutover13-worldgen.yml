name: Record Cutover 13 WorldGen acceptance
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/record-cutover13-worldgen.yml]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Mark accepted WorldGen final dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()

          old = '- [ ] semantic WorldGen assemblies still have no VoxelEngine refs;'
          new = '- [x] semantic WorldGen assemblies still have no VoxelEngine refs; hosted Cutover 13 WorldGen gate `31894519041` verified Core/Architecture remain engine-free after source `4599efb83f1ccd95382711be4f229ae2bb344163`;'
          if text.count(old) != 1:
              raise SystemExit('semantic WorldGen gate marker did not match')
          text = text.replace(old, new, 1)

          marker = 'Only include an Api reference if current source uses it after refactor. No `VoxelEngine.*.Runtime` reference.\n'
          addition = marker + '\n### Implementation progress\n\n- [x] `MountingForce.WorldGen.Core` and `MountingForce.WorldGen.Architecture` remain engine-free.\n- [x] `MountingForce.WorldGen.Voxel` broad `VoxelEngine.Core` reference removed at `4599efb83f1ccd95382711be4f229ae2bb344163`; hosted gate `31894519041` verifies its engine references are exactly Storage.Api, Terrain.Api, Structures.Api and Vegetation.Api.\n'
          if text.count(marker) != 1:
              raise SystemExit('WorldGen final-state marker did not match')
          text = text.replace(marker, addition, 1)

          for old_box, new_box in (
              ('[ ] WorldGen.Core references no VoxelEngine assembly', '[x] WorldGen.Core references no VoxelEngine assembly'),
              ('[ ] WorldGen.Architecture references no VoxelEngine assembly', '[x] WorldGen.Architecture references no VoxelEngine assembly'),
              ('[ ] WorldGen.Voxel references only VoxelEngine Api assemblies', '[x] WorldGen.Voxel references only VoxelEngine Api assemblies'),
          ):
              if text.count(old_box) != 1:
                  raise SystemExit(f'final dependency checklist marker did not match: {old_box}')
              text = text.replace(old_box, new_box, 1)

          row = '| 13 — Composition/Core deletion | **In progress — current** | read-only final-cut inventory may proceed after Rendering acceptance | composition root, final wiring, delete Core |'
          row2 = '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; semantic WorldGen engine-free and Voxel adapter Api-only accepted | composition root, move remaining Storage/Terrain ownership out of Core, migrate app/tool consumers, delete Core |'
          if text.count(row) == 1:
              text = text.replace(row, row2, 1)

          p.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git rm .github/workflows/record-cutover13-worldgen.yml
          git commit -m 'docs: mark accepted Cutover 13 WorldGen boundary'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
