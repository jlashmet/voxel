name: Record Showcase multiplayer Storage Api acceptance
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/record-showcase-multiplayer-storage-api.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Record accepted multiplayer slice
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          old='far-field, CharacterMotor, network presentation, GpuDebris and VoxelShowcase storage seams are API-only;'
          new='far-field, CharacterMotor, network presentation, GpuDebris, VoxelShowcase and ShowcaseMultiplayerSession storage seams are API-only;'
          if old not in s: raise SystemExit('Cutover 13 row anchor missing')
          s=s.replace(old,new,1)
          gate='- Latest accepted code gate: `a0528159ada889c59190888840523e6fb8c05a10` — 387 tests, 374 passed, exactly the same 13 known baseline failures. Integrated Cutover 13 run `31899261112` accepts Composition-owned mixed-brick capacity sizing and render-environment wiring, Rendering.Api surface timing diagnostics for `CompactFpsOverlay`, the final `VoxelShowcase` Storage.Api surface read, and consolidation of repeated TerrainLookdev physical storage adapter construction into its owner.'
          repl='- Latest accepted code gate: `4a5b486ca0fb238bf59b7b4b8f65e636d57746e7` — 387 tests, 374 passed, exactly the same 13 known baseline failures. Showcase multiplayer Storage.Api run `31900276764` accepts replacement of physical `VoxelDimensions` constants with logical `VoxelReadGrid` / `VoxelGrid` API constants; `ShowcaseMultiplayerSession` no longer imports Storage.Runtime.\n- Prior integrated Cutover 13 gate: `a0528159ada889c59190888840523e6fb8c05a10`, run `31899261112` — 387/374/13, exact same known failure set.'
          if gate not in s: raise SystemExit('latest accepted gate anchor missing')
          s=s.replace(gate,repl,1)
          marker='- [x] `ShowcaseCatalogue` no longer imports Structures.Runtime; it consumes `Structures.Api.FeatureCatalogue` and the Kentridge catalogue builder only. Source `ab2d1ca4323cc9fd6bdbee814007b716de76c5cd`, run `31897445992` preserved 386/373/13 with the exact known failure set.'
          addition=marker+'\n- [x] `ShowcaseMultiplayerSession` no longer imports Storage.Runtime; logical block geometry and empty-material constants come from `VoxelReadGrid` / `VoxelGrid`. Source `4a5b486ca0fb238bf59b7b4b8f65e636d57746e7`, run `31900276764` preserved 387/374/13 with the exact known failure set.'
          if marker not in s: raise SystemExit('Cutover 13 progress anchor missing')
          s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git diff --cached --check
          git commit -m 'docs(architecture): record multiplayer Storage Api acceptance'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
