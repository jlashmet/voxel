name: Prune placeholder metadata runs

on:
  push:
    branches:
      - feature/temp-placeholder-humanoids

permissions:
  actions: write
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/temp-placeholder-humanoids

      - name: Cancel obsolete metadata runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          runs_url="$api/actions/workflows/generate-placeholder-unity-meta.yml/runs?branch=feature%2Ftemp-placeholder-humanoids&per_page=100"

          current_run=""
          for _ in $(seq 1 15); do
            payload="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$runs_url")"
            current_run="$(printf '%s' "$payload" | jq -r --arg keep "$KEEP_SHA" '.workflow_runs[] | select(.head_sha == $keep) | .id' | head -1)"
            [[ -n "$current_run" ]] && break
            sleep 2
          done

          if [[ -z "$current_run" ]]; then
            echo "Could not find the metadata run for $KEEP_SHA; refusing to cancel the queue." >&2
            exit 1
          fi

          printf '%s' "$payload" \
            | jq -r --arg keep "$KEEP_SHA" '.workflow_runs[] | select(.head_sha != $keep and .status != "completed") | .id' \
            | while read -r run_id; do
                [[ -z "$run_id" ]] && continue
                echo "Cancelling obsolete metadata run $run_id"
                curl -sS -o /dev/null -X POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$api/actions/runs/$run_id/cancel" || true
              done

          echo "Preserved current metadata run $current_run for $KEEP_SHA"

      - name: Remove one-shot workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/generate-placeholder-unity-meta.yml \
            .github/workflows/prune-placeholder-meta-runs.yml
          git commit -m "ci: remove placeholder asset one-shot workflows"
          git push origin HEAD:feature/temp-placeholder-humanoids
