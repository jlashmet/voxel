name: Async geometry acceptance sync one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-acceptance-sync.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded acceptance sync
        run: python3 .github/scripts/async_geometry_acceptance_source_sync.py
      - name: Static guards
        run: |
          grep -q 'MaxVoxelRingRadiusMetres = 409.6f' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs
          ! grep -q 'RegionReadView or BrickPool memory' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceBrickDiscoveryJob.cs
          grep -q 'RenderRingsUseExactStepEightAndMipsBeyondIt' Assets/Tests/EditMode/SurfaceRingBandTests.cs
          grep -q 'private void ProcessChangeFeed' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          grep -q 'Unused materialisation should roll back' Assets/Tests/EditMode/StorageRenderingReadContractTests.cs
      - name: Commit acceptance sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceBrickDiscoveryJob.cs \
                  Assets/Tests/EditMode/SurfaceBrickDiscoveryTests.cs \
                  Assets/Tests/EditMode/SurfaceRingBandTests.cs \
                  Assets/Tests/EditMode/StorageRenderingReadContractTests.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Align async geometry acceptance tests with current pipeline'
          git push origin HEAD:refactor/async-geometry-pipeline
