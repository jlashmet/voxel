name: Kentridge doorway contract one-shot patch

on:
  push:
    branches:
      - agent/actual-game-world-integration
    paths:
      - '.github/workflows/kentridge-doorway-contract-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/actual-game-world-integration

      - name: Bind generated entrance clearance to gameplay approach contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeGrammarVoxelCatalogue.cs')
          text = path.read_text()
          old = '''            // Public entrances own a short exterior air landing as well as the wall aperture. The
            // previous inward-only carve could leave the first terrain/infrastructure voxel directly
            // outside the facade at body height; a 0.3 m-radius character then stopped with its centre
            // about 0.2 m inside the doorway. Four decimetres clears that leading-edge volume while
            // starting at threshold height, so the walkable ground below remains intact.
            int doorExteriorClearance = 4 * s;
'''
          new = '''            // A public entrance owns the whole gameplay approach corridor, not just the wall
            // aperture. Keep this tied to the access resolver contract: if gameplay is asked to reach
            // ExteriorApproach, generation must guarantee body-height air all the way to that point.
            // The carve begins at threshold height so walkable ground below remains intact.
            int doorExteriorClearance =
                KentridgeGameplaySiteAccessResolver.ApproachDistanceDecimetres * s;
'''
          if old not in text:
              raise SystemExit('Expected Kentridge doorway clearance block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/kentridge-doorway-contract-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Packages/com.mountingforce.worldgen/Runtime/Voxel/KentridgeGrammarVoxelCatalogue.cs .github/workflows/kentridge-doorway-contract-patch.yml
          git commit -m 'Tie Kentridge entrance clearance to gameplay approach'
          git push origin HEAD:agent/actual-game-world-integration
