name: HLOD workspace trim one-shot patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-hlod-workspace-trim-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded HLOD workspace trim
        run: python3 .github/scripts/async_geometry_hlod_workspace_trim_patch.py
      - name: Static guards
        run: |
          grep -q 'int legacyMixedCapacity = usesBlockHlod ? 1 : 64 \* 1024' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs
          grep -q 'CompactedTopologyVertices = default' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs
          grep -q 'TransitionVertices = default' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs
          grep -q 'StepEightHlodWorkspaceDoesNotAllocateUnusedTransvoxelScratch' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit HLOD workspace trim
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Trim unused Transvoxel scratch from step-8 HLOD workers'
          git fetch origin refactor/async-geometry-pipeline
          git rebase origin/refactor/async-geometry-pipeline
          git push origin HEAD:refactor/async-geometry-pipeline
