name: Arch reference evidence (temporary)
run-name: Arch reference evidence · ${{ github.ref_name }}

# Temporary connector-only aid for the Arch reference-match work. The production
# visual acceptance still runs through tests-single.yml on the self-hosted Mac.
# This hosted job only makes the tracked binary reference downloadable while that
# runner is occupied; remove this workflow before the feature is finalized.
on:
  push:
    branches:
      - 'ci-test/agent/arch-reference-match'
    paths:
      - '.github/test-request.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: arch-reference-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Classify request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test_name="$(python3 - <<'PY'
          import json
          with open('.github/test-request.json', encoding='utf-8') as handle:
              print(json.load(handle).get('test', ''))
          PY
          )"
          if [[ "$test_name" == VoxelEngine.Tests.PlayMode.ArchLookdevSceneTests* ]]; then
            echo 'is_arch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_arch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish evidence status
        if: steps.request.outputs.is_arch == 'true'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/arch-reference-evidence',
              description: 'Packaging tracked Arch reference',
              target_url: process.env.RUN_URL,
            });

      - name: Verify tracked reference
        if: steps.request.outputs.is_arch == 'true'
        shell: bash
        run: test -s References/arch_reference.png

      - name: Upload tracked reference
        if: steps.request.outputs.is_arch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arch-reference-${{ github.sha }}
          path: References/arch_reference.png
          if-no-files-found: error
          retention-days: 1

      - name: Publish final evidence status
        if: always() && steps.request.outputs.is_arch == 'true'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'ci/arch-reference-evidence',
              description: ok ? 'Tracked Arch reference packaged' : 'Arch reference packaging failed',
              target_url: process.env.RUN_URL,
            });
