name: Castle API extraction inventory

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: read

jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - name: Inventory CastleBuilder member usage
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo '=== WorldGen broad Structures imports ==='
          grep -RInF 'using VoxelEngine.Structures;' Packages/com.mountingforce.worldgen/Runtime/Voxel --include='*.cs' | sort || true
          echo '=== CastleBuilder internal layout symbol usage ==='
          grep -nE '\b(TrapdoorHalfSize|ChapelBellTowerSize|ChapelBellTowerStairRadius|FrontGateWidth|FrontGateHeight|FrontGateDepth|LowerRiverDepth|TrapdoorCentre|FrontGateMinimum|WaterfallStreamX|LowerRiverZAt|WaterfallLipZ|ChapelBellTowerCentre)\b' Assets/VoxelEngine/Structures/CastleBuilder.cs || true
