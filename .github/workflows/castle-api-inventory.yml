name: Castle API extraction publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Apply and publish extraction
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 .github/castle_api_extract.py
          git rm .github/castle_api_extract.py .github/workflows/castle-api-inventory.yml
          git diff --check
          if grep -RInF 'using VoxelEngine.Structures;' Packages/com.mountingforce.worldgen/Runtime/Voxel --include='*.cs'; then
            echo 'Broad WorldGen Structures import remains' >&2
            exit 1
          fi
          if grep -F '"VoxelEngine.Structures"' Packages/com.mountingforce.worldgen/Runtime/Voxel/MountingForce.WorldGen.Voxel.asmdef; then
            echo 'Broad WorldGen Structures assembly reference remains' >&2
            exit 1
          fi
          git status --short
          git diff --stat
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets Packages
          git commit -m 'Extract castle layout and material semantics to Structures API'
          git push origin HEAD:${{ github.ref_name }}
