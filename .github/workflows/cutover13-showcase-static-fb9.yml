name: Cutover 13 Showcase static fb9
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-static-fb9.yml
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb9eee7fcc3448e7b2201791825591f1da1fdb89
          fetch-depth: 1
      - name: Verify current Showcase boundary progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('Assets/Scenes/Showcase')
          multiplayer = (root/'ShowcaseMultiplayerSession.cs').read_text()
          debris = (root/'GpuDebrisSystem.cs').read_text()
          if 'VoxelEngine.Storage.Runtime' in multiplayer or 'VoxelDimensions.' in multiplayer:
              raise SystemExit('Multiplayer still leaks Storage.Runtime')
          for token in ('VoxelReadGrid.BlocksPerRegion','VoxelReadGrid.BlockEdge','VoxelReadGrid.BlockEdgeLog2','VoxelReadGrid.BlocksPerRegionEdge','VoxelGrid.MaterialEmpty'):
              if token not in multiplayer: raise SystemExit('Missing multiplayer API token: '+token)
          if '.Runtime' in '\n'.join(line for line in debris.splitlines() if line.startswith('using VoxelEngine.')):
              raise SystemExit('GpuDebrisSystem retains engine Runtime import')
          runtime = re.compile(r'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*')
          files=[]; storage=[]
          for path in sorted(root.rglob('*.cs')):
              text=path.read_text()
              if runtime.search(text): files.append(path)
              if 'VoxelEngine.Storage.Runtime' in text: storage.append(path)
          print('FILES_WITH_RUNTIME=',len(files))
          print('FILES_WITH_STORAGE_RUNTIME=',len(storage))
          print('STORAGE=',*[str(p) for p in storage])
          if len(files) != 14:
              raise SystemExit(f'Expected 14 Runtime-coupled Showcase files, found {len(files)}')
          expected={root/'ArchLookdev.cs',root/'ShowcaseWorld.cs',root/'TerrainLookdev.cs'}
          if set(storage) != expected:
              raise SystemExit('Unexpected Storage.Runtime owners: '+', '.join(map(str,storage)))
          print('Current Showcase static boundary accepted')
          PY
