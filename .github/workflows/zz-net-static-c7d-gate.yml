name: Net static c7d gate
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/zz-net-static-c7d-gate.yml]
permissions:
  contents: read
jobs:
  static-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7d1a2f2bce959f931510297e6a6187e138f91c3
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          test -d Assets/VoxelEngine/Net/Api
          test -d Assets/VoxelEngine/Net/Runtime
          test ! -e Assets/VoxelEngine/Net/VoxelEngine.Net.asmdef
          for d in Client Interest Protocol Server Transport; do
            test ! -d "Assets/VoxelEngine/Net/$d"
            test -d "Assets/VoxelEngine/Net/Runtime/$d"
          done
          if grep -RInE 'namespace VoxelEngine\.Net\.(Client|Interest|Protocol|Server|Transport)|using VoxelEngine\.Net\.(Client|Interest|Protocol|Server|Transport)' Assets Packages --include='*.cs'; then
            echo 'stale broad Net namespace remains' >&2
            exit 1
          fi
          if grep -RIn 'VoxelEngine.Core' Assets/VoxelEngine/Net --include='*.cs' --include='*.asmdef'; then
            echo 'Net still imports Core' >&2
            exit 1
          fi
          if grep -RInE 'VoxelEngine\.(Storage|Streaming|Edits|StructuralIntegrity|Rendering|Terrain|Structures|Vegetation|Collision)\.Runtime' Assets/VoxelEngine/Net --include='*.cs' --include='*.asmdef'; then
            echo 'Net has foreign Runtime dependency' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Assets/VoxelEngine/Net/Runtime/VoxelEngine.Net.Runtime.asmdef')
          d=json.loads(p.read_text())
          allowed={
            'VoxelEngine.Net.Api','VoxelEngine.Foundation','VoxelEngine.Edits.Api',
            'VoxelEngine.Storage.Api','VoxelEngine.Streaming.Api',
            'Unity.Collections','Unity.Mathematics','Unity.Networking.Transport'
          }
          refs=set(d['references'])
          extra=refs-allowed
          if extra:
            raise SystemExit(f'unexpected Net.Runtime refs: {sorted(extra)}')
          required={'VoxelEngine.Net.Api','VoxelEngine.Edits.Api','VoxelEngine.Storage.Api','VoxelEngine.Streaming.Api'}
          missing=required-refs
          if missing:
            raise SystemExit(f'missing Net.Runtime refs: {sorted(missing)}')
          PY
          if grep -RInE '\.(DrainReady|ApplyReadyAuthoritativeEvents)\(\s*ref |\.ProcessAuthoritativeTick\([^\n]*ref ' Assets/Tests Assets/Scenes/Showcase --include='*.cs'; then
            echo 'legacy physical Net call shape remains' >&2
            exit 1
          fi
          echo 'Net static boundary gate passed for c7d1a2f2'
