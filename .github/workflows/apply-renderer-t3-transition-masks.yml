name: Apply renderer T3 transition masks

on:
  push:
    branches:
      - feature/renderer-lod-hole-regression
    paths:
      - tools/apply-renderer-t3-transition-masks.py
      - .github/workflows/apply-renderer-t3-transition-masks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply assertion-based transition patch
        run: python3 tools/apply-renderer-t3-transition-masks.py
      - name: Validate patch
        run: git diff --check
      - name: Commit active-LOD transition rendering
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SmoothSurfaceVertex.cs \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
            Assets/VoxelEngine/Rendering/Runtime/Shaders/SmoothSurface.shader
          git commit -m "Drive voxel transition seams from active LODs"
          git push origin HEAD:feature/renderer-lod-hole-regression
