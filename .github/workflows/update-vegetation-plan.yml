name: Update accepted Vegetation checklist
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/update-vegetation-plan.yml]
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          replacements = {
            '**Current focus:** Cutover 10 Vegetation — final Api/Runtime ownership cutover': '**Current focus:** Cutover 11 Net — final Api/Runtime decomposition and ownership cleanup',
            '| 10 — Vegetation | **In progress — current** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api; `Vegetation.Api` now owns stable tree species/instance/profile values with the original Unity GUID; WorldGen Voxel consumes Vegetation.Api only | isolate mutable tree state/skeleton/damage Runtime and cut Rendering to Api-only presentation reads |': '| 10 — Vegetation | **Complete** | `Vegetation.Api` owns stable tree placement/species/profile plus immutable skeleton/damage/read contracts; mutable state, skeleton generation and damage live in `Vegetation.Runtime`; Rendering and WorldGen consume Api only; broad/Core Vegetation ownership is gone | none |',
            '| 11 — Net | **Partial dependency cleanup** | authoritative edit application callers now consume Storage mutation capability | full Net.Api/Runtime decomposition, structural/residency/snapshot ownership cleanup |': '| 11 — Net | **In progress — current** | authoritative edit application callers consume Edits.Api/Storage mutation capabilities; StructuralGraph and the redundant edit wrapper are already gone | final Net.Api/Runtime decomposition, residency/store ownership cleanup, and semantic snapshot/repair boundary |',
            '- Latest accepted code gate: `73c81025ad313be78d47449ec6185d0dc0519361` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Vegetation.Api value slice: `ProceduralTreeTypes.cs` moved to `Vegetation/Api` with its Unity GUID preserved and now owns `TreeSpecies`, `TreeLeafStyle`, `TreeInstance`, `TreeSpeciesProfile`, and `TreeSpeciesProfiles`; WorldGen Voxel references Vegetation.Api rather than broad/Core Vegetation.': '- Latest accepted code gate: `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Accepted final Vegetation cutover: stable placement/presentation/read contracts live in Vegetation.Api; mutable tree state, skeleton generation and damage live in Vegetation.Runtime; Rendering and WorldGen consume Vegetation.Api only. The two additional passing tests are Vegetation boundary coverage; no existing failure changed.',
            '- [ ] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.': '- [x] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.',
            '- [ ] Rendering consumes Vegetation.Api-only read/presentation contracts.': '- [x] Rendering consumes Vegetation.Api-only read/presentation contracts.\n- [x] Final Vegetation Runtime/Rendering cutover accepted by CI at `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4`: 384 total / 371 passed / exact same 13 known baseline failures.',
            '- [ ] no `VoxelEngine.Core.Vegetation` namespace remains;': '- [x] no `VoxelEngine.Core.Vegetation` namespace remains;',
            '- [ ] Rendering references Vegetation.Api, not Runtime;': '- [x] Rendering references Vegetation.Api, not Runtime;',
            '- [ ] mutable `TreeWorldState` is internal Runtime state;': '- [x] mutable `TreeWorldState` is internal Runtime state;',
            '- [ ] tree damage/skeleton/render tests pass.': '- [x] tree damage/skeleton/render tests pass.',
            '- [ ] create Vegetation.Api/Runtime': '- [x] create Vegetation.Api/Runtime',
            '- [ ] remove `VoxelEngine.Core.Vegetation` namespace': '- [x] remove `VoxelEngine.Core.Vegetation` namespace',
            '- [ ] isolate tree state/build/damage implementation': '- [x] isolate tree state/build/damage implementation',
            '- [ ] expose stable placement/damage/render contracts': '- [x] expose stable placement/damage/render contracts',
            '- [ ] update Rendering to Vegetation.Api': '- [x] update Rendering to Vegetation.Api',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected plan text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/update-vegetation-plan.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: complete Vegetation cutover checklist'
          git push origin HEAD:${{ github.ref_name }}
