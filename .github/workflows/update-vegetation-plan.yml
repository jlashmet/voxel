name: Record accepted Vegetation cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/update-vegetation-plan.yml]
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          replacements = {
            '**Current focus:** Cutover 10 Vegetation — final Api/Runtime ownership cutover':
              '**Current focus:** Cutover 11 Net — final Api/Runtime decomposition and ownership correction',
            '| 10 — Vegetation | **In progress — current** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api; `Vegetation.Api` now owns stable tree species/instance/profile values with the original Unity GUID; WorldGen Voxel consumes Vegetation.Api only | isolate mutable tree state/skeleton/damage Runtime and cut Rendering to Api-only presentation reads |':
              '| 10 — Vegetation | **Complete** | Vegetation.Api owns stable tree placement/profile plus immutable skeleton/damage/read contracts; mutable tree state, skeleton generation and damage live in Vegetation.Runtime with preserved Unity GUIDs; Rendering and WorldGen consume Api only; broad/Core Vegetation ownership is gone | none |',
            '| 11 — Net | **Partial dependency cleanup** | authoritative edit application callers now consume Storage mutation capability | full Net.Api/Runtime decomposition, structural/residency/snapshot ownership cleanup |':
              '| 11 — Net | **In progress — current** | authoritative edit application callers consume Edits.Api/Storage mutation capabilities; structural graph ownership already removed during StructuralIntegrity cutover | full Net.Api/Runtime decomposition, residency/snapshot ownership cleanup, domain-Api-only references |',
            '- Latest accepted code gate: `73c81025ad313be78d47449ec6185d0dc0519361` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Vegetation.Api value slice: `ProceduralTreeTypes.cs` moved to `Vegetation/Api` with its Unity GUID preserved and now owns `TreeSpecies`, `TreeLeafStyle`, `TreeInstance`, `TreeSpeciesProfile`, and `TreeSpeciesProfiles`; WorldGen Voxel references Vegetation.Api rather than broad/Core Vegetation.':
              '- Latest accepted code gate: `23e4de379adec1c5afd8da70b2b4b83f4601e48a` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Vegetation cutover accepted: mutable state/skeleton/damage implementation lives in `Vegetation/Runtime`; `TreePresentation.cs` exposes immutable snapshots/events and `ITreeWorldReadSource` in Vegetation.Api; Rendering and WorldGen consume Vegetation.Api only; the broad Vegetation assembly and `VoxelEngine.Core.Vegetation` namespace are gone.',
            '- [ ] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.':
              '- [x] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.',
            '- [ ] Rendering consumes Vegetation.Api-only read/presentation contracts.':
              '- [x] Rendering consumes Vegetation.Api-only read/presentation contracts.\n- [x] Final Vegetation Api/Runtime cutover accepted by CI at `23e4de379adec1c5afd8da70b2b4b83f4601e48a`: 384 total / 371 passed / exact same 13 known baseline failures; the additional test is Vegetation boundary coverage.',
            '- [ ] no `VoxelEngine.Core.Vegetation` namespace remains;':
              '- [x] no `VoxelEngine.Core.Vegetation` namespace remains;',
            '- [ ] Rendering references Vegetation.Api, not Runtime;':
              '- [x] Rendering references Vegetation.Api, not Runtime;',
            '- [ ] mutable `TreeWorldState` is internal Runtime state;':
              '- [x] mutable `TreeWorldState` is internal Runtime state;',
            '- [ ] tree damage/skeleton/render tests pass.':
              '- [x] tree damage/skeleton/render tests pass.',
            '### 10. Vegetation\n\n- [ ] create Vegetation.Api/Runtime\n- [ ] remove `VoxelEngine.Core.Vegetation` namespace\n- [ ] isolate tree state/build/damage implementation\n- [ ] expose stable placement/damage/render contracts\n- [x] update Kentridge vegetation to Storage.Api + Vegetation.Api\n- [ ] update Rendering to Vegetation.Api':
              '### 10. Vegetation\n\n- [x] create Vegetation.Api/Runtime\n- [x] remove `VoxelEngine.Core.Vegetation` namespace\n- [x] isolate tree state/build/damage implementation\n- [x] expose stable placement/damage/render contracts\n- [x] update Kentridge vegetation to Storage.Api + Vegetation.Api\n- [x] update Rendering to Vegetation.Api',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected plan text: {old[:120]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/update-vegetation-plan.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: mark Vegetation cutover complete'
          git push origin HEAD:${{ github.ref_name }}
