name: Replace placeholder animation pack

on:
  push:
    branches:
      - feature/temp-placeholder-humanoids

permissions:
  contents: write

jobs:
  replace-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/temp-placeholder-humanoids

      - name: Replace monolithic animation bundle with curated Rocketbox clips
        shell: bash
        run: |
          set -euo pipefail

          root="Assets/ThirdParty/PlaceholderHumanoids"
          anim="$root/Animations"
          mkdir -p "$anim"

          rm -f "$anim/KayKit_Knight_AnimationLibrary.fbx"
          rm -f "$root/Licenses/KayKit-CC0-LICENSE.txt"

          base="https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Animations"

          curl -L --fail --retry 3 "$base/all_animations_max_motextr_static/m_idle_breathe_01.max.fbx" -o "$anim/Idle.fbx"
          curl -L --fail --retry 3 "$base/all_animations_max_motextr_xy/m_walk_neutral.max.fbx" -o "$anim/Walk.fbx"
          curl -L --fail --retry 3 "$base/all_animations_max_motextr_xy/m_run_neutral.max.fbx" -o "$anim/Run.fbx"
          curl -L --fail --retry 3 "$base/all_animations_max_motextr_static/m_crouch_idle.max.fbx" -o "$anim/CrouchIdle.fbx"
          curl -L --fail --retry 3 "$base/all_animations_max_motextr_static/m_wave_01.max.fbx" -o "$anim/Wave.fbx"
          curl -L --fail --retry 3 "$base/all_animations_max_motextr_static/m_gestic_shrug_01.max.fbx" -o "$anim/Shrug.fbx"

          (cd "$root" && sha256sum \
            Models/Male_Adult_01.fbx \
            Models/Female_Adult_01.fbx \
            Animations/Idle.fbx \
            Animations/Walk.fbx \
            Animations/Run.fbx \
            Animations/CrouchIdle.fbx \
            Animations/Wave.fbx \
            Animations/Shrug.fbx \
            > Licenses/SOURCE_SHA256SUMS.txt)

      - name: Commit curated animation set and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/replace-placeholder-animation-pack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "assets: use curated Rocketbox placeholder animations"
          git push origin HEAD:feature/temp-placeholder-humanoids
