name: Collision cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== Collision files ==='
          find Assets/VoxelEngine/Collision -maxdepth 2 -type f | sort
          echo '=== Collision declarations/usings ==='
          for f in Assets/VoxelEngine/Collision/*.cs; do
            echo "--- $f"
            grep -nE '^using |^namespace |^\s*(public|internal) (static )?(class|struct|enum|interface)|^\s*public static |^\s*public [A-Za-z].*\(' "$f" || true
          done
          echo '=== Collision type consumers ==='
          grep -RInE '\b(DdaTraversal|HullExport|SweptAabb|VoxelRaycast)\b' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Collision/' | sort || true
          echo '=== Collision public nested/value type consumers ==='
          grep -RInE '\b(RaycastHit|SweepHit|Hull|RaycastQuery|SweepQuery|VoxelHit|HullResult)\b' Assets Packages --include='*.cs' | sort || true
          echo '=== Collision namespace imports ==='
          grep -RInE 'using VoxelEngine\.Collision;|VoxelEngine\.Collision\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Collision/' | sort || true
          echo '=== Collision asmdef consumers ==='
          grep -RIn '"VoxelEngine.Collision"' Assets Packages --include='*.asmdef' | sort || true
          echo '=== Collision foreign dependencies ==='
          grep -RInE 'VoxelEngine\.(Core|Storage|Terrain|Structures|Net|Rendering|Vegetation|Streaming)|\b(BrickPool|BrickRef|RegionTable|VoxelAccess|OccupancyMask)\b' Assets/VoxelEngine/Collision --include='*.cs' --include='*.asmdef' | sort || true
          echo '=== Collision tests ==='
          find Assets/Tests -type f -name '*.cs' | grep -Ei 'collision|raycast|sweep|hull|dda' | sort || true
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git rm .github/workflows/collision-cutover-inventory.yml
          git commit -m 'Remove temporary Collision inventory workflow'
          git push origin HEAD:${{ github.ref_name }}
