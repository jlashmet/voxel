name: Cutover 13 publish far terrain API seam

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-publish-far-terrain-api.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Move far terrain presentation lookup behind Composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/Scenes/Showcase/VoxelFarTerrain.cs')
          text = path.read_text()

          old = '''using UnityEngine;\nusing TerrainSampler = VoxelEngine.Terrain.Api.TerrainQuery;\nusing VoxelEngine.Rendering.Runtime;\nusing VoxelEngine.Structures.Runtime;\nusing VoxelEngine.Structures.Api;'''
          new = '''using UnityEngine;\nusing VoxelEngine.Composition;\nusing TerrainSampler = VoxelEngine.Terrain.Api.TerrainQuery;\nusing VoxelEngine.Structures.Api;'''
          if old not in text:
              raise SystemExit('expected VoxelFarTerrain import block not found')
          text = text.replace(old, new, 1)

          old_lookup = 'Vector4 albedo = VoxelPresentationCatalogue.MaterialAlbedo[material];'
          new_lookup = 'Vector4 albedo = RenderingComposition.GetMaterialAlbedo(material);'
          if text.count(old_lookup) != 1:
              raise SystemExit(f'expected one presentation lookup, found {text.count(old_lookup)}')
          text = text.replace(old_lookup, new_lookup, 1)

          text = text.replace(
              '// what the surface voxel is, VoxelPresentationCatalogue decides what colour that\n'
              '// material is. Going through both is the point — a colour invented here would be',
              '// what the surface voxel is, while Composition projects the authoritative renderer\n'
              '// albedo. Going through both is the point — a colour invented here would be',
              1)

          path.write_text(text)
          PY

          ! grep -q 'VoxelEngine.Rendering.Runtime' Assets/Scenes/Showcase/VoxelFarTerrain.cs
          ! grep -q 'VoxelEngine.Structures.Runtime' Assets/Scenes/Showcase/VoxelFarTerrain.cs
          ! grep -q 'VoxelPresentationCatalogue' Assets/Scenes/Showcase/VoxelFarTerrain.cs
          grep -q 'RenderingComposition.GetMaterialAlbedo' Assets/Scenes/Showcase/VoxelFarTerrain.cs
          git diff --check

      - name: Commit source cut
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/VoxelFarTerrain.cs
          git commit -m 'refactor(showcase): route far terrain presentation through Composition'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
