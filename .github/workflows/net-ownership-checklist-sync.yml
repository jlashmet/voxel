name: Net ownership checklist sync
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-ownership-checklist-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          reps={
          '- [ ] Server residency delegates to Streaming.Api and semantic convergence/repair uses Storage.Api capabilities in the current code; acceptance is pending revalidation.': '- [x] Server residency delegates to Streaming.Api and semantic convergence/repair uses Storage.Api capabilities; the final ownership static gate passed at `0399f677828c6d53a5adc12f000739980bbe8ba9`.',
          '- [ ] network residency calls Streaming.Api;': '- [x] network residency calls Streaming.Api; final ownership static gate passed at `0399f677828c6d53a5adc12f000739980bbe8ba9`;',
          '- [ ] semantic repair/snapshot paths use Storage.Api logical data;': '- [x] semantic repair/snapshot paths use Storage.Api logical data; final ownership static gate passed at `0399f677828c6d53a5adc12f000739980bbe8ba9`;'
          }
          for old,new in reps.items():
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit('missing expected checklist text: '+old)
          p.write_text(s)
          PY
          git rm .github/workflows/net-ownership-checklist-sync.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark accepted Net ownership boundaries'
          git push origin HEAD:${GITHUB_REF_NAME}
