name: Edits client composition inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          for p in 'new ClientNetworkRuntime' 'AlterationBatchReceiver.TryApply' 'EventApplication.Apply(' 'EventApplication.ApplyWithArbitration'; do
            echo ===$p===
            grep -RInF "$p" Assets Packages --include='*.cs' | sort || true
          done
