name: Edits applier callsite inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo '=== remaining Core.Edits imports ==='
          grep -RIn 'using VoxelEngine.Core.Edits;' Assets Packages --include='*.cs' | sort || true
          for pattern in 'new ClientAuthoritativeEventQueue' 'EventApplication.Apply' 'EventApplication.ApplyWithArbitration' 'AuthoritativeAlterationValidator.Validate' 'new AuthoritativeServerSession' 'ProcessAuthoritativeTick(' 'new ServerCommandProcessor'; do
            echo "=== $pattern ==="
            grep -RInF "$pattern" Assets Packages --include='*.cs' | sort || true
          done
          echo '=== ServerCommandProcessor apply/validate context ==='
          grep -nE 'AuthoritativeAlterationValidator\.Validate|TryApplyAlteration|IAuthoritativeAlterationApplier|ProcessAlterations' Assets/VoxelEngine/Net/Server/ServerCommandProcessor.cs
          echo '=== client queue ownership context ==='
          grep -RInE 'ClientAuthoritativeEventQueue[ (]|\.DrainReady\(' Assets/VoxelEngine Assets/Scenes Assets/Tests --include='*.cs' | sort || true
