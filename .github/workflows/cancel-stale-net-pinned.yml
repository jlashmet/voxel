name: Cancel stale pinned Net validation
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/cancel-stale-net-pinned.yml]
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUN: '31891556628'
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            page=1
            while :; do
              json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs?branch=refactor/system-boundaries-foundation-storage&status=$status&per_page=100&page=$page")"
              count="$(jq '.workflow_runs | length' <<<"$json")"
              [[ "$count" -gt 0 ]] || break
              jq -r '.workflow_runs[].id' <<<"$json" | while read -r id; do
                if [[ "$id" == "$KEEP_RUN" || "$id" == "$GITHUB_RUN_ID" ]]; then
                  echo "preserving run $id"
                  continue
                fi
                echo "cancelling stale $status run $id"
                curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/runs/$id/cancel" >/dev/null || true
              done
              [[ "$count" -lt 100 ]] && break
              page=$((page + 1))
            done
          done
          git rm .github/workflows/cancel-stale-net-pinned.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git commit -m 'chore(ci): remove Net queue cleanup helper'
          git push origin HEAD:${GITHUB_REF_NAME}
