name: Vegetation snapshot parent fix
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          edits = [
              Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs'),
              Path('Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs'),
          ]
          for p in edits:
              s = p.read_text()
              old = 'int[] parents = skeleton.BranchParents;'
              if s.count(old) != 1:
                  raise SystemExit(f'{p}: expected exactly one parent-array declaration')
              s = s.replace(old, 'IReadOnlyList<int> parents = skeleton.BranchParents;', 1)
              s = s.replace('parents.Length', 'parents.Count')
              p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/vegetation-snapshot-parent-fix.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs
          git add -u .github/workflows
          git commit -m 'fix: consume vegetation parent snapshots as read-only lists'
          git push origin HEAD:${{ github.ref_name }}
