name: Vegetation parent list compile fix
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/vegetation-parent-list-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs')
          text = path.read_text()
          old = '(uint)parents.Length'
          if old not in text:
              raise SystemExit('remaining parents.Length use was not found')
          path.write_text(text.replace(old, '(uint)parents.Count', 1))
          PY
          git rm .github/workflows/vegetation-parent-list-fix.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs
          git add -u .github/workflows
          git commit -m 'fix: finish vegetation parent topology list migration'
          git push origin HEAD:${{ github.ref_name }}
