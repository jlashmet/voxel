name: Apply passive discovery contract repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-passive-discovery-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply validation contract repair
        run: python3 .github/scripts/apply_passive_discovery_contract_patch.py
      - name: Verify patch
        run: git diff --check
      - name: Commit repair and retire transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/Tests/EditMode/SurfaceBrickDiscoveryTests.cs \
            Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
            .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm \
            .github/workflows/apply-passive-discovery-contract-patch.yml \
            .github/scripts/apply_passive_discovery_contract_patch.py
          git commit -m "test(rendering): align passive discovery contracts"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
