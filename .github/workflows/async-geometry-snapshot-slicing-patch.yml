name: Resumable geometry snapshots one-shot patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-snapshot-slicing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_snapshot_slicing_patch.py
      - name: Static guards
        run: |
          grep -q 'StepDensitySnapshot(source, in palette, voxelSize, deadline)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'SnapshotBlocksPerDeadlineCheck' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          ! grep -q 'private void ScheduleDensityJob' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          ! grep -q 'private bool SnapshotCoreHasSolid' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'AuthoritativeSnapshotAssemblyIsResumable' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit renderer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Slice voxel snapshot assembly across frame budgets'
          git push origin HEAD:refactor/async-geometry-pipeline
