name: Cutover 13 integrated a6b acceptance
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-integrated-a6b-acceptance.yml
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6b84917019b98e306a3dc8b24b85bbd67a8a2a9
          fetch-depth: 1
      - name: Verify integrated Composition storage boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('Assets/Scenes/Showcase')
          arch=(root/'ArchLookdev.cs').read_text()
          terrain=(root/'TerrainLookdev.cs').read_text()
          debris=(root/'GpuDebrisSystem.cs').read_text()
          composition=Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          api_destruction=Path('Assets/VoxelEngine/Storage/Api/DestructionClass.cs').read_text()
          runtime_palette=Path('Assets/VoxelEngine/Storage/Runtime/MaterialPalette.cs').read_text()

          for name,text in [('ArchLookdev',arch),('TerrainLookdev',terrain)]:
              if 'using VoxelEngine.Storage.Runtime;' in text:
                  raise SystemExit(name+' still imports Storage.Runtime')
              for token in ('new RegionTable(', 'new BrickPool(', 'new RegionReadSource(',
                            'new RegionMutationStore(', 'new VoxelChangeJournal('):
                  if token in text:
                      raise SystemExit(name+' retains physical storage construction: '+token)
              if 'IVoxelStorageRuntime' not in text or 'VoxelEngineBootstrap.CreateStorage' not in text:
                  raise SystemExit(name+' is not Composition-owned')

          if 'VoxelEngine.Rendering.Runtime' in debris:
              raise SystemExit('GpuDebrisSystem retains stale Rendering.Runtime import')

          required=[
              'private RegionTable _table;', 'private BrickPool _pool;',
              'private MaterialPalette _materials;', 'private SurfaceCatalogue _surfaces;',
              'private CoatingCatalogue _coatings;',
              'IMaterialAuthoringCatalogue MaterialAuthoring',
              'MaterialPaletteView MaterialPresentation',
              'SurfaceCatalogueView SurfacePresentation',
              'CoatingCatalogueView CoatingPresentation',
              'void RegisterMaterial(', 'void ConfigureCoatingDecoration(',
              'void PublishAllResidentRegions()',
          ]
          missing=[t for t in required if t not in composition]
          if missing:
              raise SystemExit('Composition storage lifetime incomplete: '+', '.join(missing))

          if 'public enum DestructionClass : byte' not in api_destruction:
              raise SystemExit('DestructionClass not owned by Storage.Api')
          if 'enum DestructionClass' in runtime_palette:
              raise SystemExit('Storage.Runtime still defines DestructionClass')

          core=[]
          for root_name in ('Assets','Packages'):
              base=Path(root_name)
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if not p.is_file() or p.suffix not in ('.cs','.asmdef','.md','.json','.yml','.yaml'):
                      continue
                  if 'VoxelEngine.Core' in p.read_text(errors='ignore'):
                      core.append(p)
          if core:
              raise SystemExit('Residual VoxelEngine.Core literals: '+', '.join(map(str,core)))

          storage=[]
          for p in sorted(root.rglob('*.cs')):
              if 'using VoxelEngine.Storage.Runtime;' in p.read_text(errors='ignore'):
                  storage.append(p)
          expected=[root/'ShowcaseWorld.cs']
          print('SHOWCASE_STORAGE_RUNTIME_IMPORTS=',len(storage))
          for p in storage: print('STORAGE',p)
          if storage != expected:
              raise SystemExit('Expected only ShowcaseWorld Storage.Runtime owner')

          print('Integrated Cutover 13 Composition storage boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6b84917019b98e306a3dc8b24b85bbd67a8a2a9
          clean: false
          fetch-depth: 1
      - name: Reset pinned integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard a6b84917019b98e306a3dc8b24b85bbd67a8a2a9
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/Cutover13IntegratedA6b"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover13-integrated-a6b84917
          path: Artifacts/Cutover13IntegratedA6b/
          if-no-files-found: warn
          retention-days: 14
