name: Publish client snapshot Storage boundary
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-client-snapshot-publisher.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/VoxelEngine/Net/Client/ClientNetworkRuntime.cs')
          s=p.read_text()
          old='''            ThrowIfDisposed();\n\n            if (_fullState.TryDequeue(out var full))\n'''
          new='''            ThrowIfDisposed();\n            var snapshotMutations = new RegionSnapshotMutationStore(in table, in pool);\n\n            if (_fullState.TryDequeue(out var full))\n'''
          if s.count(old)!=1: raise SystemExit(f'snapshot mutator insertion seam count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''                if (!_events.FullSnapshotWaitPending ||\n                    !_events.FullSnapshotWaitRegion.Equals(full.RegionCoord) ||\n                    !SemanticRegionSnapshotCodec.TryComputeSemanticHash(\n                        full.RegionCoord,\n                        full.Snapshot,\n                        out uint encodedHash) ||\n                    encodedHash != full.SemanticHash)\n'''
          new='''                if (!_events.FullSnapshotWaitPending ||\n                    !_events.FullSnapshotWaitRegion.Equals(full.RegionCoord))\n'''
          if s.count(old)!=1: raise SystemExit(f'bulk preflight seam count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''                if (!table.TryGetRegion(full.RegionCoord, out _))\n                    table.LoadRegion(full.RegionCoord);\n\n                if (!SemanticRegionSnapshotCodec.TryApply(\n                        ref table,\n                        ref pool,\n                        full.RegionCoord,\n                        full.Snapshot) ||\n                    !table.TryGetRegion(full.RegionCoord, out Region fullRegion) ||\n                    SemanticRegionHasher.HashRegion(in fullRegion, in pool) != full.SemanticHash ||\n                    !_events.CompleteFullRegionSnapshot(\n                        full.TransferId,\n                        full.RegionCoord,\n                        full.SnapshotTick))\n'''
          new='''                if (!snapshotMutations.TryApplySemanticSnapshot(\n                        full.RegionCoord,\n                        full.Snapshot,\n                        full.SemanticHash,\n                        createIfMissing: true) ||\n                    !_events.CompleteFullRegionSnapshot(\n                        full.TransferId,\n                        full.RegionCoord,\n                        full.SnapshotTick))\n'''
          if s.count(old)!=1: raise SystemExit(f'bulk apply seam count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''                if (!_repair.TryApplyCompleted(ref table, ref pool, _events))\n'''
          new='''                if (!_repair.TryApplyCompleted(snapshotMutations, _events))\n'''
          if s.count(old)!=1: raise SystemExit(f'repair apply seam count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'RegionSnapshotMutationStore' Assets/VoxelEngine/Net/Client/ClientNetworkRuntime.cs
          ! grep -q 'SemanticRegionSnapshotCodec' Assets/VoxelEngine/Net/Client/ClientNetworkRuntime.cs
          ! grep -q 'SemanticRegionHasher' Assets/VoxelEngine/Net/Client/ClientNetworkRuntime.cs
          git rm .github/workflows/net-client-snapshot-publisher.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Net/Client/ClientNetworkRuntime.cs
          git add -u .github/workflows
          git commit -m 'net: apply semantic snapshots through Storage API'
          git push origin HEAD:${{ github.ref_name }}
