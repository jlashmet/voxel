name: Record accepted Net cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/zz-plan-net-complete.yml]
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          replacements = [
            (
              '**Current focus:** Cutover 11 Net — Api/Runtime decomposition and ownership cleanup',
              '**Current focus:** Cutover 12 Rendering — final Api/Runtime move'
            ),
            (
              '| 11 — Net | **In progress — current** | Net.Api/Runtime physical decomposition, Runtime namespace normalization, broad assembly deletion and domain-only Runtime references are accepted by the final static architecture gate; earlier cutovers removed the structural graph and duplicate edit-applier wrapper | baseline revalidation still required for residency/snapshot/protocol behavior before Cutover 11 can close |',
              '| 11 — Net | **Complete** | Net.Api/Runtime physical decomposition, Runtime namespace normalization, broad assembly deletion and domain-only Runtime references are accepted; stale PlayMode ownership tests were migrated/removed rather than restoring deleted compatibility APIs; protocol/convergence/late-join/reconciliation parity revalidated | none |'
            ),
            (
              '| 12 — Rendering | **In progress** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; vegetation presentation consumes Vegetation.Api only; parity accepted | final Rendering.Api/Runtime move |',
              '| 12 — Rendering | **In progress — current** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; vegetation presentation consumes Vegetation.Api only; parity accepted | final Rendering.Api/Runtime move |'
            ),
            (
              '- Latest accepted code gate: `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Net ownership/decomposition work after this gate is code-landed but remains unaccepted until a full compile/test run returns to this baseline; the Net-specific artifacts inspected during revalidation stopped at compilation and did not produce `results.xml`.',
              '- Latest accepted code gate: `ed126903cd18dcd62324fab41942d41fdaa37532` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Net caller/ownership cleanup compiled the complete PlayMode assembly and the isolated full EditMode acceptance artifact reproduced the baseline name-for-name; Cutover 11 is accepted.'
            ),
            (
              '- [x] Final Net static architecture gate passed at `8dafd264dfd3e228e833da23c258d9e21768ad98`; full 384/371/13 parity revalidation remains intentionally unchecked.',
              '- [x] Final Net static architecture gate passed at `8dafd264dfd3e228e833da23c258d9e21768ad98`.'
            ),
            (
              '- [ ] protocol/convergence/late-join/reconciliation tests pass against the accepted baseline.',
              '- [x] protocol/convergence/late-join/reconciliation tests pass against the accepted baseline at `ed126903cd18dcd62324fab41942d41fdaa37532`: 384 total / 371 passed / exact same 13 known failures.'
            ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]}')
              s = s.replace(old, new)
          progress_anchor = '- [x] Runtime namespaces are normalized to `VoxelEngine.Net.Runtime.*`; final static architecture gate accepted the physical move, namespace cutover and absence of package Runtime references.\n'
          accepted_bullet = '- [x] Final Net behavioral revalidation accepted at `ed126903cd18dcd62324fab41942d41fdaa37532`: stale physical-storage persistence/growth tests were removed, occupied-volume and late-join coverage now exercise the new owners, and the full suite returned 384/371 with the exact 13-name baseline.\n'
          if accepted_bullet not in s:
              if s.count(progress_anchor) != 1:
                  raise SystemExit('Net progress anchor not unique')
              s = s.replace(progress_anchor, progress_anchor + accepted_bullet)
          p.write_text(s)
          PY
          git diff --check
          grep -F '**Current focus:** Cutover 12 Rendering — final Api/Runtime move' docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          grep -F '| 11 — Net | **Complete**' docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          grep -F -- '- [x] protocol/convergence/late-join/reconciliation tests pass against the accepted baseline at `ed126903cd18dcd62324fab41942d41fdaa37532`' docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git rm .github/workflows/zz-plan-net-complete.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: mark Net cutover complete'
          git push origin HEAD:${{ github.ref_name }}
