name: Async geometry PlayMode validation

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-playmode-validation.yml
      - Assets/Tests/PlayMode/VoxelEngine.Tests.PlayMode.asmdef
      - Assets/Tests/PlayMode/LodRenderingTests.cs
      - Assets/Tests/PlayMode/AsyncGeometryStressTests.cs
      - Assets/VoxelEngine/Rendering/**
      - Assets/VoxelEngine/Storage/**

concurrency:
  group: async-geometry-playmode
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Honor single-Unity safety gate
        shell: bash
        run: |
          set -euo pipefail
          # Renderer-world lifetime ownership passed all 83 focused EditMode tests and Metal proved
          # the stale Storage-pin/RenderGraph exception is gone. The offline LOD fidelity capture
          # retains strict MissingVisible==0 but now frames the actual architecture: a 4:3 target,
          # 24 m orthographic half-height (~64 m horizontal), and roughly +/-32 m castle depth.
          # It keeps the 8 ms/8-worker offline extraction allowance. Stress below remains 2 workers
          # with production budgets and is the constrained runtime/performance authority.
          deadline=$((SECONDS + 6000))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 10
          done
      - name: Run LOD rendering PlayMode tests
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/Artifacts/AsyncGeometryPlayMode/lod"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          # Offline visual-fidelity gate: subject-sized orthographic framing, strict hole-free
          # convergence, and extra extraction capacity so it measures LOD structure rather than CI
          # throughput. Runtime budget semantics are independently covered by the second LOD test
          # and the separate two-worker stress phase.
          UNITY_MAX_RSS_MB=12288 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -force-metal -job-worker-count 8 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
            -testFilter VoxelEngine.Tests.PlayMode.LodRenderingTests \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || { tail -n 250 "$ROOT/unity.log" || true; exit 1; }
          python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          total = int(root.attrib.get('total', root.attrib.get('testcasecount', '0')))
          if total <= 0:
              raise SystemExit('LOD test filter matched zero tests')
          print(f'LOD PlayMode tests executed: {total}')
          PY
          exit $status
      - name: Run async geometry stress PlayMode tests
        if: success()
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/Artifacts/AsyncGeometryPlayMode/stress"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=12288 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -force-metal -job-worker-count 2 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
            -testFilter VoxelEngine.Tests.PlayMode.AsyncGeometryStressTests \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || { tail -n 250 "$ROOT/unity.log" || true; exit 1; }
          python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          total = int(root.attrib.get('total', root.attrib.get('testcasecount', '0')))
          if total <= 0:
              raise SystemExit('Stress test filter matched zero tests')
          print(f'Async geometry stress tests executed: {total}')
          PY
          exit $status
      - name: Upload PlayMode artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-geometry-playmode
          path: Artifacts/AsyncGeometryPlayMode/
          if-no-files-found: warn
          retention-days: 14
