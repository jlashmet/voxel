name: Modular character equipment tests

# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
concurrency:
  group: modular-character-equipment-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Verify modular equipment runtime
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run CharacterEquipment EditMode tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/CharacterEquipment"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testFilter "MountingForce.Game.Composition.CharacterEquipment.Tests.ModularCharacterAssemblerTests;MountingForce.Game.Composition.CharacterEquipment.Tests.CharacterEquipmentControllerTests;MountingForce.Game.Composition.CharacterEquipment.Tests.CharacterFactoryAssetImporterTests;MountingForce.Game.Composition.CharacterEquipment.Tests.CharacterFactoryCharacterPrefabCleanupTests" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/CharacterEquipment/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/CharacterEquipment/unity.log"
          status=$?
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/CharacterEquipment/unity.log" ]]; then
            cat "$GITHUB_WORKSPACE/Artifacts/CharacterEquipment/unity.log"
          fi
          exit $status

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-character-equipment-${{ github.sha }}
          path: Artifacts/CharacterEquipment/
          if-no-files-found: warn
          retention-days: 14
