name: Net ownership inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: true
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          echo '===OWNERSHIP SYMBOL CALLERS==='
          grep -RInE 'ServerRegionResidency|RegionStore|RegionHasher' Assets Packages --include='*.cs' | sort || true
          echo '===PHYSICAL STORAGE IMPORTS IN NET==='
          grep -RInE 'VoxelEngine\.Core\.(Storage|Occupancy)|\b(RegionTable|BrickPool|BrickRef|VoxelAccess|SemanticRegionHasher|SemanticRegionSnapshotCodec)\b' Assets/VoxelEngine/Net --include='*.cs' | sort || true
          echo '===STREAMING REFERENCES IN NET==='
          grep -RInE 'VoxelEngine\.Streaming|IRegionStreaming|RegionLoadRequest' Assets/VoxelEngine/Net --include='*.cs' --include='*.asmdef' | sort || true
          echo '===REGION STORE FILE==='
          sed -n '1,240p' Assets/VoxelEngine/Net/Server/Storage/RegionStore.cs
          echo '===REGION HASHER FILE==='
          sed -n '1,240p' Assets/VoxelEngine/Net/Server/RegionHasher.cs
