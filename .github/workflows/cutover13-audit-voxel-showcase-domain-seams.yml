name: Cutover 13 audit VoxelShowcase domain seams

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-audit-voxel-showcase-domain-seams.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd75d5f31519b0679a53ebe8baebd4523587dab2
      - name: Audit Collision and Vegetation consumers
        shell: bash
        run: |
          echo '--- DdaTraversal references ---'
          grep -RIn --include='*.cs' 'DdaTraversal' Assets Packages || true
          echo '--- ProceduralTreeDamageService references ---'
          grep -RIn --include='*.cs' 'ProceduralTreeDamageService' Assets Packages || true
          echo '--- tree damage API vocabulary ---'
          grep -RIn --include='*.cs' -E 'Tree.*Damage|Damage.*Tree|SweepImpact|ApplyBlast' Assets/VoxelEngine/Vegetation/Api || true
