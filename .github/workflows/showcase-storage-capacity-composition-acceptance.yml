name: Showcase storage capacity Composition acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac28c0f2609f150de9ee782fed013e1c3e25e780
          fetch-depth: 1
      - name: Verify physical capacity sizing is Composition-owned
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          bootstrap = Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          showcase = Path('Assets/Scenes/Showcase/VoxelShowcase.cs').read_text()
          tests = Path('Assets/Tests/EditMode/CompositionBootstrapTests.cs').read_text()
          asm = json.loads(Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef').read_text())
          if 'VoxelDimensions.BytesPerMixedBrick' not in bootstrap:
              raise SystemExit('Composition does not own physical mixed-brick sizing')
          if 'ClampMixedBrickCapacityToBudget' not in bootstrap:
              raise SystemExit('Composition capacity helper missing')
          forbidden = ['using VoxelEngine.Storage.Runtime;', 'VoxelDimensions.BytesPerMixedBrick', 'VoxelAccess.']
          for token in forbidden:
              if token in showcase:
                  raise SystemExit('VoxelShowcase retains physical Storage detail: ' + token)
          if 'VoxelEngineBootstrap.ClampMixedBrickCapacityToBudget' not in showcase:
              raise SystemExit('VoxelShowcase is not delegating capacity sizing to Composition')
          if '_world.SurfaceQuery.TryRead' not in showcase:
              raise SystemExit('VoxelShowcase tornado read is not routed through Storage.Api')
          if 'StorageCapacityBudgetingKeepsPhysicalLayoutInsideComposition' not in tests:
              raise SystemExit('Composition capacity test missing')
          if 'VoxelEngine.Composition' not in asm.get('references', []):
              raise SystemExit('Showcase asmdef does not reference Composition')
          print('Composition-owned storage capacity boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac28c0f2609f150de9ee782fed013e1c3e25e780
          clean: false
          fetch-depth: 1
      - name: Reset pinned capacity candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard ac28c0f2609f150de9ee782fed013e1c3e25e780
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ShowcaseStorageCapacityComposition"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-storage-capacity-composition-ac28c0f2
          path: Artifacts/ShowcaseStorageCapacityComposition/
          if-no-files-found: warn
          retention-days: 14
