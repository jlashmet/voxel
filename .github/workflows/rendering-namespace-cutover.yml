name: Rendering namespace cutover
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-namespace-cutover.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Normalize Rendering namespaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('Assets'), Path('Packages')]
          pattern = re.compile(r'\bVoxelEngine\.Rendering(?!\.(?:Runtime|Api)\b)')
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  text = path.read_text()
                  updated = pattern.sub('VoxelEngine.Rendering.Runtime', text)
                  if updated != text:
                      path.write_text(updated)
                      changed.append(path)

          if not changed:
              raise SystemExit('no Rendering namespace references changed')

          runtime_root = Path('Assets/VoxelEngine/Rendering/Runtime')
          bad_runtime_namespaces = []
          for path in runtime_root.rglob('*.cs'):
              for line_no, line in enumerate(path.read_text().splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith('namespace VoxelEngine.Rendering') and not stripped.startswith('namespace VoxelEngine.Rendering.Runtime'):
                      bad_runtime_namespaces.append(f'{path}:{line_no}:{stripped}')
          if bad_runtime_namespaces:
              raise SystemExit('old Rendering runtime namespaces remain:\n' + '\n'.join(bad_runtime_namespaces))

          stale = []
          stale_pattern = re.compile(r'\b(?:using|namespace)\s+VoxelEngine\.Rendering(?!\.(?:Runtime|Api)\b)')
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  for line_no, line in enumerate(path.read_text().splitlines(), 1):
                      if stale_pattern.search(line):
                          stale.append(f'{path}:{line_no}:{line.strip()}')
          if stale:
              raise SystemExit('stale Rendering namespace/imports remain:\n' + '\n'.join(stale))

          doubled = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  if 'VoxelEngine.Rendering.Runtime.Runtime' in path.read_text():
                      doubled.append(str(path))
          if doubled:
              raise SystemExit('doubled Runtime namespace prefix in: ' + ', '.join(doubled))

          print(f'updated {len(changed)} C# files')
          for path in changed:
              print(path)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets Packages
          git diff --cached --check
          git commit -m 'refactor(rendering): normalize Runtime namespaces'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
