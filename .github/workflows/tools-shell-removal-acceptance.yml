name: Tools shell removal acceptance
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4f80c5d96397e6de64720c3b3608b6e81fb27a5
          fetch-depth: 1
      - name: Verify dead Tools shells are gone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          if Path('Assets/VoxelEngine/Tools').exists() or Path('Assets/VoxelEngine/Tools.meta').exists():
              raise SystemExit('empty Tools shell still exists')
          bad = []
          retired = {'VoxelEngine.Tools', 'VoxelEngine.Tools.Features'}
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for asmdef in root.rglob('*.asmdef'):
                  data = json.loads(asmdef.read_text())
                  if data.get('name') in retired or retired.intersection(data.get('references', [])):
                      bad.append(str(asmdef))
          if bad:
              raise SystemExit('retired Tools assembly/name references remain:\n' + '\n'.join(bad))
          print('Tools shell removal static acceptance passed')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4f80c5d96397e6de64720c3b3608b6e81fb27a5
          clean: false
          fetch-depth: 1
      - name: Reset pinned Tools candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard a4f80c5d96397e6de64720c3b3608b6e81fb27a5
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ToolsRemoval"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-removal-a4f80c5d
          path: Artifacts/ToolsRemoval/
          if-no-files-found: warn
          retention-days: 14
