name: Repair Rendering split guards
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-split-guard-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: true
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs')
          s=p.read_text()
          old='''                foreach (string reference in asmdef.References)\n                {\n                    if (!reference.EndsWith(".Runtime", StringComparison.Ordinal))\n                        continue;\n\n                    if (!string.Equals(reference, asmdef.Name, StringComparison.Ordinal))\n                        violations.Add(asmdef.Name + " -> " + reference + " (" + asmdef.RelativePath + ")");\n                }'''
          new='''                foreach (string reference in asmdef.References)\n                {\n                    if (!reference.StartsWith("VoxelEngine.", StringComparison.Ordinal)\n                        || !reference.EndsWith(".Runtime", StringComparison.Ordinal))\n                        continue;\n\n                    if (!string.Equals(reference, asmdef.Name, StringComparison.Ordinal))\n                        violations.Add(asmdef.Name + " -> " + reference + " (" + asmdef.RelativePath + ")");\n                }'''
          if s.count(old)!=1: raise SystemExit('expected one Runtime foreign-reference block')
          s=s.replace(old,new,1)
          oldroot='string renderingRoot = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Rendering");'
          newroot='string renderingRoot = Path.Combine(RepoRoot, "Assets", "VoxelEngine", "Rendering", "Runtime");'
          if s.count(oldroot)!=1: raise SystemExit('expected one Rendering read root')
          p.write_text(s.replace(oldroot,newroot,1))

          p=Path('Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs')
          s=p.read_text()
          old='"Assets/VoxelEngine/Rendering/Shaders/SmoothSurface.shader"'
          new='"Assets/VoxelEngine/Rendering/Runtime/Shaders/SmoothSurface.shader"'
          if s.count(old)!=1: raise SystemExit('expected one shader path')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git rm .github/workflows/rendering-split-guard-repair.yml
          git add Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git commit -m 'test: follow Rendering Runtime physical split'
          git push origin HEAD:${{ github.ref_name }}
