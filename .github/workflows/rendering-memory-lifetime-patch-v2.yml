name: Renderer memory lifetime one-shot patch v2

on:
  push:
    branches: [agent/rendering-performance-lod]
    paths: [.github/workflows/rendering-memory-lifetime-patch-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rendering-performance-lod
          fetch-depth: 0

      - name: Patch renderer lifetime and watchdog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs')
          s = p.read_text()
          replacements = [
              (
                  '        private VoxelSurfaceScheduler _scheduler = new();\n',
                  '        private VoxelSurfaceScheduler _scheduler;\n'
              ),
              (
                  '''            if (!VoxelRenderBridge.SurfaceBuildEnabled)\n            {\n                VoxelRenderBridge.LastSurfacePassState = "waiting-for-atomic-world";\n                return;\n            }\n            VoxelRenderBridge.LastSurfacePassState = VoxelRenderBridge.VerboseSurfaceDiagnostics\n''',
                  '''            if (!VoxelRenderBridge.SurfaceBuildEnabled)\n            {\n                VoxelRenderBridge.LastSurfacePassState = "waiting-for-atomic-world";\n                return;\n            }\n\n            // World teardown deliberately leaves the large native/GPU scheduler fully released.\n            // Recreate it only once a valid world is actually ready to render, so Metal never has\n            // to retire one arena while teardown eagerly allocates the next world's replacement.\n            _scheduler ??= new VoxelSurfaceScheduler();\n\n            VoxelRenderBridge.LastSurfacePassState = VoxelRenderBridge.VerboseSurfaceDiagnostics\n'''
              ),
              (
                  '''        private void ReleaseWorldResources()\n        {\n            if (_scheduler == null) return;\n\n            // Dispose is deliberately synchronous here: world teardown is a lifecycle boundary,\n            // not the frame path. Completing ready/running jobs and releasing every Storage pin\n            // before the application disposes its Storage backing is the ownership contract. Recreate\n            // fixed renderer state immediately so the next world does not allocate on its first\n            // RenderGraph frame.\n            _scheduler.Dispose();\n            _scheduler = new VoxelSurfaceScheduler();\n            Array.Clear(_transvoxelDrawEntries, 0, _transvoxelDrawEntries.Length);\n            Array.Clear(_waterDrawEntries, 0, _waterDrawEntries.Length);\n        }\n''',
                  '''        private void ReleaseWorldResources()\n        {\n            if (_scheduler == null) return;\n\n            // Dispose is deliberately synchronous here: world teardown is a lifecycle boundary,\n            // not the frame path. Completing ready/running jobs and releasing every Storage pin\n            // before the application disposes its Storage backing is the ownership contract.\n            // Leave the scheduler null after disposal. Reallocating its persistent native buffers\n            // and shared ComputeBuffers here overlaps the old Metal resources' deferred retirement\n            // with the next arena and turns repeated scene loads into process-wide memory growth.\n            _scheduler.Dispose();\n            _scheduler = null;\n            Array.Clear(_transvoxelDrawEntries, 0, _transvoxelDrawEntries.Length);\n            Array.Clear(_waterDrawEntries, 0, _waterDrawEntries.Length);\n        }\n'''
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit('VoxelRenderPass patch anchor mismatch: ' + old.splitlines()[0].strip())
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tools/unity-run.sh')
          s = p.read_text()
          anchor = '\nstart=$(date +%s)\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'unity-run start anchor count={s.count(anchor)}')
          kill_tree = r'''
# Kill every descendant, deepest-first, before killing Unity itself. A direct pkill -P only
# reaches one generation; helpers can have their own children and may otherwise be reparented
# after Unity dies, continuing to consume memory after the safety guard fires.
kill_tree() {
  local root=$1
  local pids=("$root")
  local found=1

  while (( found )); do
    found=0
    for pid in "${pids[@]}"; do
      while read -r child; do
        [[ -z "$child" ]] && continue
        if [[ ! " ${pids[*]} " =~ " ${child} " ]]; then
          pids+=("$child")
          found=1
        fi
      done < <(pgrep -P "$pid" 2>/dev/null || true)
    done
  done

  for (( i=${#pids[@]}-1; i>0; i-- )); do
    kill -9 "${pids[$i]}" 2>/dev/null || true
  done
  kill -9 "$root" 2>/dev/null || true
}
'''
          s = s.replace(anchor, '\n' + kill_tree + '\nstart=$(date +%s)\n', 1)

          old = '''    pkill -9 -P "$unity_pid" 2>/dev/null\n    kill -9 "$unity_pid" 2>/dev/null\n    wait "$unity_pid" 2>/dev/null\n'''
          new = '''    kill_tree "$unity_pid"\n    wait "$unity_pid" 2>/dev/null\n'''
          if s.count(old) != 4:
              raise SystemExit(f'unity-run direct kill site count={s.count(old)}')
          p.write_text(s.replace(old, new))

          Path('Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs').write_text(r'''using System;\nusing System.IO;\nusing NUnit.Framework;\n\nnamespace VoxelEngine.Tests.EditMode\n{\n    public sealed class RendererWorldReleaseMemoryArchitectureTests\n    {\n        [Test]\n        public void WorldReleaseDoesNotEagerlyAllocateReplacementRendererArena()\n        {\n            string source = File.ReadAllText(\n                "Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs");\n\n            StringAssert.Contains("private VoxelSurfaceScheduler _scheduler;", source);\n            StringAssert.Contains("_scheduler ??= new VoxelSurfaceScheduler();", source);\n\n            int release = source.IndexOf(\n                "private void ReleaseWorldResources()", StringComparison.Ordinal);\n            int nextMethod = source.IndexOf(\n                "public void Dispose()", release, StringComparison.Ordinal);\n            Assert.GreaterOrEqual(release, 0);\n            Assert.Greater(nextMethod, release);\n\n            string releaseBody = source.Substring(release, nextMethod - release);\n            StringAssert.Contains("_scheduler.Dispose();", releaseBody);\n            StringAssert.Contains("_scheduler = null;", releaseBody);\n            StringAssert.DoesNotContain("new VoxelSurfaceScheduler()", releaseBody);\n        }\n    }\n}\n'''.replace('\\n', '\n'))
          Path('Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs.meta').write_text(
              'fileFormatVersion: 2\nguid: c6479c786a8e47fa93463017fd880220\n')
          PY

          bash -n tools/unity-run.sh
          test "$(grep -c 'kill_tree "$unity_pid"' tools/unity-run.sh)" -eq 4
          grep -q '_scheduler ??= new VoxelSurfaceScheduler();' \
            Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs

      - name: Commit and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/rendering-memory-lifetime-patch.yml \
            .github/workflows/rendering-memory-lifetime-patch-v2.yml
          git add \
            Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs \
            Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs \
            Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs.meta \
            tools/unity-run.sh
          git commit -m 'Release renderer arenas fully between worlds'
          git fetch origin agent/rendering-performance-lod
          git rebase origin/agent/rendering-performance-lod
          git push origin HEAD:agent/rendering-performance-lod
