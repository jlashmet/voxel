name: Apply step4 lifecycle diagnostics

on:
  push:
    branches: [feature/voxel-showcase-rendering-repair-v2]
    paths:
      - .github/workflows/apply-step4-lifecycle-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply exact lifecycle diagnostic patch
        run: python3 .github/scripts/apply-step4-lifecycle-diagnostics.py
      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs Assets/Tests/PlayMode/LodRenderingTests.cs
      - name: Commit patch and retire transport
        run: |
          set -euo pipefail
          rm .github/workflows/apply-step4-lifecycle-diagnostics.yml
          rm .github/scripts/apply-step4-lifecycle-diagnostics.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs Assets/Tests/PlayMode/LodRenderingTests.cs .github/workflows/apply-step4-lifecycle-diagnostics.yml .github/scripts/apply-step4-lifecycle-diagnostics.py
          git commit -m "diag(rendering): trace step4 ready-empty lifecycle"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
