name: Networking CI

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/networking-ci.yml"
      - "Assets/VoxelEngine/**"
      - "Assets/Scenes/Showcase/**"
      - "Assets/Tests/EditMode/**"
      - "Packages/com.mountingforce.worldgen/**"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"

permissions:
  contents: write

concurrency:
  group: networking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Publish ArchStudyCapture VoxelBrush fix
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch and push
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs')
          s = p.read_text()
          old = '                        var brush = new VoxelBrush(table, pool, in palette, 2_000_000);'
          new = '                        var brush = new VoxelBrush(reads, mutations, palette, 2_000_000);'
          if s.count(old) != 1:
              raise RuntimeError(f'expected one brush line, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check -- Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs
          git diff -- Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets/VoxelEngine/CI/Editor/ArchStudyCapture.cs
          git commit -m 'Update ArchStudyCapture for Storage API VoxelBrush'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
