name: Networking CI

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/networking-ci.yml"
      - "Assets/VoxelEngine/**"
      - "Assets/Scenes/Showcase/**"
      - "Assets/Tests/EditMode/**"
      - "Packages/com.mountingforce.worldgen/**"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"

permissions:
  contents: write

concurrency:
  group: networking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Record accepted VoxelBrush cutover
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update plan, restore workflow, and push
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()

          old_status = 'retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; canonical ramp direction bits'
          new_status = 'retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; canonical ramp direction bits'
          if s.count(old_status) != 1:
              raise RuntimeError(f'accepted-work status anchor: expected 1, found {s.count(old_status)}')
          s = s.replace(old_status, new_status, 1)

          old_remaining = 'finish WorldGen authoring import cleanup; migrate `VoxelBrush` off physical Storage; move `ProfileBlockStore` and CastleBuilder/top-level implementation; finish Runtime namespaces; remove broad Structures assembly'
          new_remaining = 'finish WorldGen authoring import cleanup; move `ProfileBlockStore` and CastleBuilder/top-level implementation; finish Runtime namespaces; remove broad Structures assembly'
          if s.count(old_remaining) != 1:
              raise RuntimeError(f'remaining status anchor: expected 1, found {s.count(old_remaining)}')
          s = s.replace(old_remaining, new_remaining, 1)

          lines = s.splitlines()
          latest = next(i for i, line in enumerate(lines) if line.startswith('- Latest accepted code gate:'))
          lines[latest] = ('- Latest accepted code gate: `dd7d5013c1409d4efe0dbfed3672cb9b5ab13ecd` — '
                           '382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts the '
                           '`VoxelBrush` Storage-boundary cutover: the brush now depends only on Storage.Api '
                           '`IRegionReadSource`, `IRegionMutationStore`, and `IMaterialAuthoringCatalogue`; block-granular '
                           'column writes still materialize/collapse once per logical block, whole authored blocks use '
                           '`SetWholeCellBlock`, and the old `RegionTable`/`BrickPool`/`VoxelAccess` ownership plus '
                           '`Table`/`Pool` escape hatch are gone. CastleBuilder, Showcase, tests, and editor capture callers '
                           'construct Storage capability adapters instead of passing physical storage into the brush. The '
                           'preceding accepted gate `e0cdc61099ab3a1ae18af06a0b50ffa2f36af90c` accepted the retained-profile '
                           'Rendering cutover at the same 382/369/13 baseline.')
          s = '\n'.join(lines) + '\n'

          anchor = '- [ ] Structures.Api/Runtime physical move and namespace cutover complete.'
          progress = ('- [x] `VoxelBrush` consumes Storage.Api read/mutation/authoring-catalogue capabilities only; its '
                      'block-granular column and whole-cell write paths preserve the prior bulk-write semantics without '
                      'owning `RegionTable`, `BrickPool`, `Region`, `BrickRef`, or `VoxelAccess`, and no `Table`/`Pool` '
                      'escape properties remain.\n'
                      '- [x] `VoxelBrush` Storage-boundary cutover accepted by CI at '
                      '`dd7d5013c1409d4efe0dbfed3672cb9b5ab13ecd`: 382 total / 369 passed / exact same 13 known baseline failures.\n'
                      + anchor)
          if s.count(anchor) != 1:
              raise RuntimeError(f'implementation progress anchor: expected 1, found {s.count(anchor)}')
          s = s.replace(anchor, progress, 1)

          todo = '- [ ] migrate `VoxelBrush` off physical Storage types'
          done = '- [x] migrate `VoxelBrush` off physical Storage types'
          if s.count(todo) != 1:
              raise RuntimeError(f'execution checklist anchor: expected 1, found {s.count(todo)}')
          s = s.replace(todo, done, 1)

          p.write_text(s)
          PY

          git show dd7d5013c1409d4efe0dbfed3672cb9b5ab13ecd:.github/workflows/networking-ci.yml > .github/workflows/networking-ci.yml
          git diff --check
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/workflows/networking-ci.yml
          git commit -m 'Mark VoxelBrush Storage boundary complete'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
