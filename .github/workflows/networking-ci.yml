name: Networking CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/minimal-voxel-networking
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/networking-ci.yml"
      - "Assets/VoxelEngine/**"
      - "Assets/Scenes/Showcase/**"
      - "Assets/Tests/EditMode/**"
      - "Packages/com.mountingforce.worldgen/**"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"

permissions:
  contents: write

concurrency:
  group: networking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Unity EditMode suite
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Publish surgical CastleBuilder storage-boundary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/Structures/CastleBuilder.cs')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'using VoxelEngine.Core.Storage;\n',
              'using VoxelEngine.Core.Storage;\nusing VoxelEngine.Storage.Api;\n',
              'Storage.Api import')

          replace_once(
              '            var brush = new VoxelBrush(table, pool, in palette);',
              '''            var reads = new RegionReadSource(in table, in pool);\n            var mutations = new RegionMutationStore(in table, in pool);\n            IMaterialAuthoringCatalogue materials = palette.IsCreated\n                ? (IMaterialAuthoringCatalogue)palette\n                : null;\n            var brush = new VoxelBrush(reads, mutations, materials);''',
              'VoxelBrush construction')

          early = '''                        RequireBudget(in build.Brush, stage);\n                        table = build.Brush.Table;\n                        pool = build.Brush.Pool;\n                        return false;'''
          if s.count(early) != 2:
              raise RuntimeError(f'early copy-back: expected two matches, found {s.count(early)}')
          s = s.replace(
              early,
              '''                        RequireBudget(in build.Brush, stage);\n                        return false;''')

          replace_once(
              '''            // RegionTable and BrickPool are handle-like structs, but their scalar bookkeeping\n            // (notably BrickPool's high-water mark) is copied by value. Publish the updated\n            // handles back to the owner or later allocations can reuse slots the castle owns.\n            table = build.Brush.Table;\n            pool = build.Brush.Pool;\n            build.Stage++;''',
              '''            // Storage capability objects share their backing state; allocator/table bookkeeping\n            // stays inside Storage instead of escaping through VoxelBrush.\n            build.Stage++;''',
              'final copy-back')

          p.write_text(s)
          PY

          if git diff --quiet -- Assets/VoxelEngine/Structures/CastleBuilder.cs; then
            echo 'CastleBuilder patch produced no diff' >&2
            exit 1
          fi
          git diff --check -- Assets/VoxelEngine/Structures/CastleBuilder.cs
          git diff --stat -- Assets/VoxelEngine/Structures/CastleBuilder.cs
          git diff -- Assets/VoxelEngine/Structures/CastleBuilder.cs

          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets/VoxelEngine/Structures/CastleBuilder.cs
          git commit -m 'Construct VoxelBrush through Storage API capabilities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            echo 'Another Unity editor is active; waiting 5 seconds...'
            sleep 5
          done

      - name: Run EditMode tests
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh

          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          status=$?

          if [[ $status -ne 0 ]]; then
            echo "Unity EditMode tests failed with exit code $status" >&2
            exit $status
          fi

          test -s "$ROOT/results.xml"

      - name: Show Unity log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/NetworkingCI/unity.log"
          if [[ -f "$LOG" ]]; then
            tail -n 250 "$LOG"
          fi

      - name: Upload networking CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networking-ci-${{ github.sha }}
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
