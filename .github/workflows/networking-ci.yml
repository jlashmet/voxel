name: Networking CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/minimal-voxel-networking
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/networking-ci.yml"
      - "Assets/VoxelEngine/**"
      - "Assets/Scenes/Showcase/**"
      - "Assets/Tests/EditMode/**"
      - "Packages/com.mountingforce.worldgen/**"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"

permissions:
  contents: read

concurrency:
  group: networking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Unity EditMode suite
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run EditMode tests
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          status=$?

          if [[ $status -ne 0 ]]; then
            echo "Unity EditMode tests failed with exit code $status" >&2
            exit $status
          fi

          test -s "$ROOT/results.xml"

      - name: Show Unity log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/NetworkingCI/unity.log"
          if [[ -f "$LOG" ]]; then
            tail -n 250 "$LOG"
          fi

      - name: Upload networking CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networking-ci-${{ github.sha }}
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
