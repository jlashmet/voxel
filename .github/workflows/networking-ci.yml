name: WorldGen import cleanup publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

concurrency:
  group: worldgen-import-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
      - name: Remove stale imports, restore normal workflow, and push
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          root = Path('Packages/com.mountingforce.worldgen/Runtime/Voxel')
          needle = 'using VoxelEngine.Core.Features;\n'
          changed = []
          removed = 0
          for path in sorted(root.rglob('*.cs')):
              text = path.read_text()
              count = text.count(needle)
              if count == 0:
                  continue
              text = text.replace(needle, '')
              path.write_text(text)
              changed.append(str(path))
              removed += count
          if removed < 20:
              raise RuntimeError(f'expected broad stale-import cleanup; removed only {removed}')
          leftovers = []
          for path in root.rglob('*.cs'):
              if 'using VoxelEngine.Core.Features;' in path.read_text():
                  leftovers.append(str(path))
          if leftovers:
              raise RuntimeError('stale Core.Features imports remain: ' + ', '.join(leftovers))
          print(f'removed {removed} stale imports from {len(changed)} files')
          for path in changed:
              print(path)
          PY
          git diff --check -- Packages/com.mountingforce.worldgen/Runtime/Voxel
          git diff --stat -- Packages/com.mountingforce.worldgen/Runtime/Voxel
          git show cdbbc49048dc2c04d7dd5391da558088d0a8c886:.github/workflows/networking-ci.yml > .github/workflows/networking-ci.yml
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Packages/com.mountingforce.worldgen/Runtime/Voxel .github/workflows/networking-ci.yml
          git commit -m 'Remove stale WorldGen Core.Features imports'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
