name: Structures prerequisite plan publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

concurrency:
  group: structures-prereq-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
      - name: Update plan, restore workflow, and push
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()

          old = 'retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; canonical ramp direction bits'
          new = 'retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; mutable `ProfileBlockStore` is physically under `Structures/Runtime`; stale `VoxelEngine.Core.Features` imports are removed from the WorldGen Voxel adapter; canonical ramp direction bits'
          if s.count(old) != 1:
              raise RuntimeError(f'accepted-work anchor: expected 1, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'finish WorldGen authoring import cleanup; move `ProfileBlockStore` and CastleBuilder/top-level implementation; finish Runtime namespaces; remove broad Structures assembly'
          new = 'cut CastleBuilder orchestration off physical Storage; move CastleBuilder/VoxelBrush/MasonryWeathering/StructureMaterials together under Runtime; finish Runtime namespaces; remove broad Structures assembly'
          if s.count(old) != 1:
              raise RuntimeError(f'remaining-work anchor: expected 1, found {s.count(old)}')
          s = s.replace(old, new, 1)

          lines = s.splitlines()
          latest = next(i for i, line in enumerate(lines) if line.startswith('- Latest accepted code gate:'))
          lines[latest] = ('- Latest accepted code gate: `00f1ddfc89af4fa52aa03c79c4b922bf5a9dd70d` — '
                           '382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts two '
                           'Structures Runtime prerequisites: mutable `ProfileBlockStore` moved from `Core/Features` to '
                           '`Structures/Runtime` with its Unity GUID preserved, and 28 stale `using VoxelEngine.Core.Features;` '
                           'imports were removed from the MountingForce WorldGen Voxel adapter after that move exposed them. '
                           'No compatibility namespace or Runtime dependency was introduced. The preceding accepted gate '
                           '`dd7d5013c1409d4efe0dbfed3672cb9b5ab13ecd` accepted the `VoxelBrush` Storage-boundary cutover '
                           'at the same 382/369/13 baseline.')
          s = '\n'.join(lines) + '\n'

          anchor = '- [ ] Structures.Api/Runtime physical move and namespace cutover complete.'
          progress = ('- [x] Mutable `ProfileBlockStore` is physically under `Structures/Runtime` with its original Unity GUID preserved.\n'
                      '- [x] WorldGen Voxel authoring cleanup removed all stale `using VoxelEngine.Core.Features;` imports exposed by the retained-profile owner move; no compatibility namespace was added.\n'
                      '- [x] Profile-store Runtime move + WorldGen import cleanup accepted by CI at '
                      '`00f1ddfc89af4fa52aa03c79c4b922bf5a9dd70d`: 382 total / 369 passed / exact same 13 known baseline failures.\n'
                      + anchor)
          if s.count(anchor) != 1:
              raise RuntimeError(f'progress anchor: expected 1, found {s.count(anchor)}')
          s = s.replace(anchor, progress, 1)

          checklist_anchor = '- [x] move feature VM/generation/rasterization to Runtime\n- [ ] move existing CastleBuilder/etc. under Runtime'
          checklist_new = ('- [x] move feature VM/generation/rasterization to Runtime\n'
                           '- [x] move retained-profile store into Runtime and remove stale WorldGen Core.Features imports\n'
                           '- [ ] move existing CastleBuilder/etc. under Runtime')
          if s.count(checklist_anchor) != 1:
              raise RuntimeError(f'checklist anchor: expected 1, found {s.count(checklist_anchor)}')
          s = s.replace(checklist_anchor, checklist_new, 1)

          p.write_text(s)
          PY
          git diff --check -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git show 00f1ddfc89af4fa52aa03c79c4b922bf5a9dd70d:.github/workflows/networking-ci.yml > .github/workflows/networking-ci.yml
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/workflows/networking-ci.yml
          git commit -m 'Record accepted Structures Runtime prerequisites'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
