name: Networking CI

# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: networking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Unity EditMode suite
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout without deleting Unity import cache
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            echo 'Another Unity editor is active; waiting 5 seconds...'
            sleep 5
          done

      - name: Run EditMode tests and enforce regression baseline
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh

          unity_status=0
          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log" \
            || unity_status=$?

          if [[ $unity_status -ne 0 && $unity_status -ne 2 ]]; then
            echo "Unity exited unexpectedly with status $unity_status" >&2
            exit $unity_status
          fi

          if [[ ! -s "$ROOT/results.xml" ]]; then
            echo "Unity did not produce test results." >&2
            exit 1
          fi

          python3 - "$ROOT/results.xml" "$ROOT/unity.log" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results_path = Path(sys.argv[1])
          log_path = Path(sys.argv[2])

          known_baseline = {
              "VoxelEngine.Tests.PlayMode.ChainCombatEnemyAIV8Tests.CurrentCascadeLabBootsWithEnemyAIStack",
              "VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.BattleResetClearsSharedPlanHistoryAndGhostBackToStart",
              "VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.PlannerBootsWithGhostBoardAndVisualLayer",
              "VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.SharedPlanExecutionRequiresEveryLivingPlayerReady",
              "VoxelEngine.Tests.PlayMode.ChainCombatMechanicsV2Tests.CascadeLabControllerBootsFourPlayerBattle",
              "VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.CommittingApprovedPlanPreservesReadyForEnemyHandoff",
              "VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.EditingAnApprovedPlanRevokesEveryReadyApproval",
              "VoxelEngine.Tests.PlayMode.ChainCombatPrototypeTests.ControllerBootsPlayableBattlePresentation",
              "VoxelEngine.Tests.EditMode.KentridgeAnchorUndercroftTests.AnchorUndercroftsOccupyPubAndWarehouseSupportFacesWithoutAddingGameplayStructures",
              "VoxelEngine.Tests.EditMode.KentridgeGenerationTests.DistrictTerracesCreateNeighbourhoodScaleShelves",
              "VoxelEngine.Tests.EditMode.KentridgeInfrastructureTests.UrbanInfrastructureStaysSeparateFromStableGameplayStructures",
              "VoxelEngine.Tests.EditMode.KentridgeUrbanFabricTests.UrbanFabricCatalogueRealizesAllEightBlocksAsIndividualBuildings",
              "VoxelEngine.Tests.EditMode.SurfaceRingBandTests.RingsDoNotReachBeyondTheStreamingRadius",
          }

          root = ET.parse(results_path).getroot()
          cases = root.findall(".//test-case")
          by_name = {
              case.attrib.get("fullname") or case.attrib.get("name"): case
              for case in cases
          }
          failed = {
              name for name, case in by_name.items()
              if case.attrib.get("result") in {"Failed", "Error"}
          }

          missing_baseline_tests = sorted(known_baseline - set(by_name))
          unexpected_failures = sorted(failed - known_baseline)
          fixed_baseline_tests = sorted(known_baseline - failed)

          log = log_path.read_text(errors="replace") if log_path.exists() else ""
          compiler_errors = sorted(set(re.findall(r"[^\n]*\berror CS\d+:[^\n]*", log)))

          print(f"Unity regression gate: {len(cases)} tests, {len(failed)} failures")
          if fixed_baseline_tests:
              print(f"Known baseline tests now passing: {len(fixed_baseline_tests)}")
              for name in fixed_baseline_tests:
                  print(f"  FIXED: {name}")

          problems = []
          if len(cases) < 403:
              problems.append(f"test count regressed below accepted floor: {len(cases)} < 403")
          if missing_baseline_tests:
              problems.append("known baseline tests disappeared from the suite:\n  " + "\n  ".join(missing_baseline_tests))
          if unexpected_failures:
              problems.append("new/unapproved failures:\n  " + "\n  ".join(unexpected_failures))
          if compiler_errors:
              problems.append("C# compiler errors:\n  " + "\n  ".join(compiler_errors[:50]))

          if problems:
              print("\nREGRESSION GATE FAILED", file=sys.stderr)
              for problem in problems:
                  print(f"\n{problem}", file=sys.stderr)
              raise SystemExit(1)

          print("Regression gate accepted: no new failures and no C# compiler errors.")
          PY

      - name: Show Unity log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/NetworkingCI/unity.log"
          if [[ -f "$LOG" ]]; then
            tail -n 250 "$LOG"
          fi

      - name: Upload networking CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networking-ci-${{ github.sha }}
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
