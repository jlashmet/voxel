name: Networking CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/minimal-voxel-networking
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/networking-ci.yml"
      - "Assets/VoxelEngine/**"
      - "Assets/Scenes/Showcase/**"
      - "Assets/Tests/EditMode/**"
      - "Packages/com.mountingforce.worldgen/**"
      - "Packages/manifest.json"
      - "Packages/packages-lock.json"
      - "ProjectSettings/ProjectVersion.txt"

permissions:
  contents: write

concurrency:
  group: networking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-editmode:
    name: Unity EditMode suite
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Publish VoxelBrush consumer cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new, expected, label in replacements:
                  count = s.count(old)
                  if count != expected:
                      raise RuntimeError(f'{path}: {label}: expected {expected}, found {count}')
                  s = s.replace(old, new)
              p.write_text(s)

          patch('Assets/Scenes/Showcase/ArchLookdev.cs', [
              ('var brush = new VoxelBrush(nextTable, nextPool, in nextPalette, 2_000_000);',
               'var brush = new VoxelBrush(reads, mutations, nextPalette, 2_000_000);',
               1, 'arch brush construction'),
          ])

          for path, budget in [
              ('Assets/Scenes/Showcase/TerrainLookdev.ForegroundContrast.cs', '1_050_000'),
              ('Assets/Scenes/Showcase/TerrainLookdev.ReferenceDetails.cs', '2_200_000'),
              ('Assets/Scenes/Showcase/TerrainLookdev.VegetatedCap.cs', '3_000_000'),
              ('Assets/Scenes/Showcase/TerrainLookdev.VisibleDetails.cs', '2_400_000'),
              ('Assets/Scenes/Showcase/TerrainLookdev.cs', '9_000_000'),
          ]:
              old = f'            var writer = new VoxelBrush(_table, _pool, in _palette, {budget});'
              new = (f'            var reads = new RegionReadSource(in _table, in _pool);\n'
                     f'            var mutations = new RegionMutationStore(in _table, in _pool);\n'
                     f'            var writer = new VoxelBrush(reads, mutations, _palette, {budget});')
              patch(path, [
                  (old, new, 1, 'writer construction'),
                  ('            _table = writer.Table;\n            _pool = writer.Pool;\n',
                   '', 1, 'obsolete handle copy-back'),
              ])

          patch('Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs', [
              ('                var brush = new VoxelBrush(table, pool, in palette);',
               '                var reads = new RegionReadSource(in table, in pool);\n'
               '                var mutations = new RegionMutationStore(in table, in pool);\n'
               '                var brush = new VoxelBrush(reads, mutations, palette);',
               2, 'architecture test brush construction'),
          ])
          PY

          git diff --check
          git diff --stat
          git diff -- Assets/Scenes/Showcase/ArchLookdev.cs \
                     Assets/Scenes/Showcase/TerrainLookdev.ForegroundContrast.cs \
                     Assets/Scenes/Showcase/TerrainLookdev.ReferenceDetails.cs \
                     Assets/Scenes/Showcase/TerrainLookdev.VegetatedCap.cs \
                     Assets/Scenes/Showcase/TerrainLookdev.VisibleDetails.cs \
                     Assets/Scenes/Showcase/TerrainLookdev.cs \
                     Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs

          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets/Scenes/Showcase/ArchLookdev.cs \
                  Assets/Scenes/Showcase/TerrainLookdev.ForegroundContrast.cs \
                  Assets/Scenes/Showcase/TerrainLookdev.ReferenceDetails.cs \
                  Assets/Scenes/Showcase/TerrainLookdev.VegetatedCap.cs \
                  Assets/Scenes/Showcase/TerrainLookdev.VisibleDetails.cs \
                  Assets/Scenes/Showcase/TerrainLookdev.cs \
                  Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git commit -m 'Update VoxelBrush consumers for Storage API capabilities'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            echo 'Another Unity editor is active; waiting 5 seconds...'
            sleep 5
          done

      - name: Run EditMode tests
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh

          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          status=$?

          if [[ $status -ne 0 ]]; then
            echo "Unity EditMode tests failed with exit code $status" >&2
            exit $status
          fi

          test -s "$ROOT/results.xml"

      - name: Show Unity log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/NetworkingCI/unity.log"
          if [[ -f "$LOG" ]]; then
            tail -n 250 "$LOG"
          fi

      - name: Upload networking CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networking-ci-${{ github.sha }}
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
