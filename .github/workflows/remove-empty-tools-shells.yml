name: Remove empty Tools assembly shells
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/remove-empty-tools-shells.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify and delete dead Tools shells
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          tools = Path('Assets/VoxelEngine/Tools')
          if not tools.is_dir():
              raise SystemExit('Tools directory is already absent')

          source = list(tools.rglob('*.cs'))
          if source:
              raise SystemExit('Tools still contains source and cannot be deleted:\n' + '\n'.join(map(str, source)))

          retired = {'VoxelEngine.Tools', 'VoxelEngine.Tools.Features'}
          refs = []
          for root in (Path('Assets'), Path('Packages')):
              if not root.exists():
                  continue
              for asmdef in root.rglob('*.asmdef'):
                  if tools in asmdef.parents:
                      continue
                  data = json.loads(asmdef.read_text())
                  hit = retired.intersection(data.get('references', []))
                  if hit:
                      refs.append(f'{asmdef}: {sorted(hit)}')
          if refs:
              raise SystemExit('other assemblies still reference empty Tools shells:\n' + '\n'.join(refs))

          print('Tools contains no source and no foreign asmdef references; deleting dead shells')
          PY
          git rm -r Assets/VoxelEngine/Tools
          if test -f Assets/VoxelEngine/Tools.meta; then git rm Assets/VoxelEngine/Tools.meta; fi
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git commit -m 'refactor(tools): delete empty runtime-coupled assembly shells'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
