name: Reconcile Vegetation implementation plan
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/reconcile-vegetation-plan.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          replacements = {
            '**Current focus:** Cutover 10 Vegetation — final Api/Runtime ownership cutover': '**Current focus:** Cutover 11 Net — Api/Runtime decomposition and ownership correction',
            '| 10 — Vegetation | **In progress — current** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api; `Vegetation.Api` now owns stable tree species/instance/profile values with the original Unity GUID; WorldGen Voxel consumes Vegetation.Api only | isolate mutable tree state/skeleton/damage Runtime and cut Rendering to Api-only presentation reads |': '| 10 — Vegetation | **Complete** | Vegetation.Api owns stable tree values and read-only presentation snapshots; mutable tree state/skeleton/damage implementation lives under Vegetation.Runtime with preserved Unity GUIDs; Kentridge is Storage.Api + Vegetation.Api only; Rendering consumes Vegetation.Api presentation reads only; parity accepted | none |',
            '| 11 — Net | **Partial dependency cleanup** | authoritative edit application callers now consume Storage mutation capability | full Net.Api/Runtime decomposition, structural/residency/snapshot ownership cleanup |': '| 11 — Net | **In progress — current** | authoritative edit application callers consume Edits.Api/Storage capabilities; StructuralGraph and duplicate edit wrapper are already gone from Net | Net.Api/Runtime decomposition plus residency/storage/snapshot ownership cleanup |',
            '- Latest accepted code gate: `73c81025ad313be78d47449ec6185d0dc0519361` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Vegetation.Api value slice: `ProceduralTreeTypes.cs` moved to `Vegetation/Api` with its Unity GUID preserved and now owns `TreeSpecies`, `TreeLeafStyle`, `TreeInstance`, `TreeSpeciesProfile`, and `TreeSpeciesProfiles`; WorldGen Voxel references Vegetation.Api rather than broad/Core Vegetation.': '- Latest accepted code gate: `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Vegetation cutover accepted: mutable tree state/skeleton/damage implementation lives in Vegetation.Runtime, Rendering consumes Vegetation.Api presentation reads only, WorldGen remains Api-only, and no live `VoxelEngine.Core.Vegetation` namespace remains.',
            '- [ ] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.': '- [x] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.',
            '- [ ] Rendering consumes Vegetation.Api-only read/presentation contracts.': '- [x] Rendering consumes Vegetation.Api-only read/presentation contracts.\n- [x] Final Vegetation cutover accepted by CI at `363ea1838c42d9d01e04fd0b74b6aa8f600c35f4`: 384 total / 371 passed / exact same 13 known baseline failures.',
            '- [ ] no `VoxelEngine.Core.Vegetation` namespace remains;': '- [x] no `VoxelEngine.Core.Vegetation` namespace remains;',
            '- [ ] Rendering references Vegetation.Api, not Runtime;': '- [x] Rendering references Vegetation.Api, not Runtime;',
            '- [ ] mutable `TreeWorldState` is internal Runtime state;': '- [x] mutable `TreeWorldState` is internal Runtime state;',
            '- [ ] tree damage/skeleton/render tests pass.': '- [x] tree damage/skeleton/render tests pass.',
            '- [ ] create Vegetation.Api/Runtime': '- [x] create Vegetation.Api/Runtime',
            '- [ ] remove `VoxelEngine.Core.Vegetation` namespace': '- [x] remove `VoxelEngine.Core.Vegetation` namespace',
            '- [ ] isolate tree state/build/damage implementation': '- [x] isolate tree state/build/damage implementation',
            '- [ ] expose stable placement/damage/render contracts': '- [x] expose stable placement/damage/render contracts',
            '- [ ] update Rendering to Vegetation.Api': '- [x] update Rendering to Vegetation.Api',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:90]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git rm .github/workflows/reconcile-vegetation-plan.yml
          git diff --check
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark Vegetation cutover complete'
          git push origin HEAD:${{ github.ref_name }}
