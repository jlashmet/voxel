name: Refresh BrickPool COW architecture guard

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-cow-guard-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Refresh guard to current writer exclusion implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs')
          s = p.read_text()
          replacements = [
              ('StringAssert.Contains("private NativeArray<uint> _slotGenerations", pool);',
               'StringAssert.Contains("private NativeArray<uint> _slotGenerations", pool);\n            StringAssert.Contains("private NativeArray<byte> _writeBorrowedSlots", pool);'),
              ('StringAssert.Contains("_writerCounts[token.Slot] == 0", pool);',
               'StringAssert.Contains("_writeBorrowedSlots[token.Slot] == 0", pool);'),
              ('StringAssert.Contains("RecycleRetiredSlot(token.Slot)", pool);',
               'StringAssert.Contains("_freeList.Add(token.Slot)", pool);'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one match for {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q '_writeBorrowedSlots\[token.Slot\] == 0' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git rm .github/workflows/async-geometry-cow-guard-fix.yml
      - name: Commit refreshed guard and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Refresh BrickPool COW architecture guard'
          git push origin HEAD:refactor/async-geometry-pipeline
