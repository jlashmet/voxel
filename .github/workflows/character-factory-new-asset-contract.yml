name: Character Factory new asset contract

on:
  push:
    branches:
      - agent/character-asset-generation-framework
    paths:
      - 'tools/character-factory/bootstrap_canonical.py'
      - 'tools/character-factory/init_asset.py'
      - 'tools/character-factory/new_asset_macos.sh'
      - 'tools/character-factory/runtime/scaffold.py'
      - '.github/workflows/character-factory-new-asset-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-factory-new-asset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  new-asset-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/character-factory/bootstrap_canonical.py \
            tools/character-factory/init_asset.py \
            tools/character-factory/runtime/scaffold.py
          bash -n tools/character-factory/new_asset_macos.sh

      - name: Create rigid asset through one-command wrapper
        shell: bash
        run: |
          set -euo pipefail
          LIB=/tmp/character-factory-one-command
          tools/character-factory/new_asset_macos.sh \
            weapon castle_sword_ci \
            --library-root "$LIB" \
            --tag castle --tag guard
          SPEC="$LIB/weapons/castle_sword_ci/asset.json"
          test -s "$SPEC"
          python3 - "$SPEC" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          assert payload['id'] == 'castle_sword_ci'
          assert payload['assetType'] == 'weapon'
          assert payload['tags'] == ['castle', 'guard']
          assert payload['runtimePart']['socketBoneName'] == 'RightHand'
          PY

      - name: Canonical bootstrap fails clearly without Blender
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/character-factory/bootstrap_canonical.py --blender /definitely/missing/blender; then
            echo 'canonical bootstrap unexpectedly succeeded without Blender' >&2
            exit 1
          fi
