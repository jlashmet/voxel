name: Character Factory compile

on:
  push:
    branches: [feature/character-factory-runtime-api]
    paths:
      - 'Assets/VoxelEngine/Characters/**'
      - 'tools/character-factory/**'
      - 'tools/check-compile.sh'
      - '.github/workflows/character-factory-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-factory-compile
  cancel-in-progress: true

jobs:
  compile-and-pipeline-smoke:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Resolve Unity installation
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_ROOT="/Applications/Unity/Hub/Editor/${UNITY_VERSION}"
          test -x "$UNITY_ROOT/Unity.app/Contents/MacOS/Unity"
          echo "UNITY_ROOT=$UNITY_ROOT" >> "$GITHUB_ENV"

      - name: Compile Characters Api and Runtime
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/check-compile.sh
          tools/check-compile.sh VoxelEngine.Characters

      - name: Run Character Factory unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/character-factory/tests -p 'test_*.py'

      - name: Resolve Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/Applications/Blender.app/Contents/MacOS/Blender"
          if [ ! -x "$BLENDER_BIN" ]; then
            if ! command -v brew >/dev/null 2>&1; then
              echo "Blender is not installed and Homebrew is unavailable" >&2
              exit 1
            fi
            brew install --cask blender
          fi
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Bootstrap fast TripoSR MPS smoke backend
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          TRIPOSR_REV="24e6763a8b20d07b4b9f796f44aed45e412f2dcd"
          CACHE_ROOT="${CHARACTER_FACTORY_CACHE_ROOT:-$HOME/Library/Caches/voxel-character-factory}"
          TRIPOSR_SOURCE="$CACHE_ROOT/TripoSR-$TRIPOSR_REV"
          TRIPOSR_PY="$CACHE_ROOT/triposr-$TRIPOSR_REV-py312-venv/bin/python"
          TRIPOSR_WEIGHTS="$CACHE_ROOT/models/triposr"

          chmod +x tools/character-factory/ci/bootstrap_triposr_macos.sh
          tools/character-factory/ci/bootstrap_triposr_macos.sh

          test -x "$TRIPOSR_PY"
          "$TRIPOSR_PY" -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          test -f "$TRIPOSR_WEIGHTS/model.ckpt"
          echo "TRIPOSR_SOURCE=$TRIPOSR_SOURCE" >> "$GITHUB_ENV"
          echo "TRIPOSR_PY=$TRIPOSR_PY" >> "$GITHUB_ENV"
          echo "TRIPOSR_WEIGHTS=$TRIPOSR_WEIGHTS" >> "$GITHUB_ENV"

      - name: Build and render isolated Sunlit Cleric staff
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/CharacterFactorySmoke"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          INPUT="$OUT/sunlit_cleric_staff_ci.input.png"
          "$TRIPOSR_PY" tools/character-factory/ci/prepare_staff_fixture.py \
            --input "$GITHUB_WORKSPACE/tools/character-factory/ci/fixtures/sunlit_cleric_staff.jpg" \
            --output "$INPUT"
          test -s "$INPUT"

          SPEC="$RUNNER_TEMP/sunlit-cleric-staff-ci.json"
          cat > "$SPEC" <<JSON
          {
            "id": "sunlit_cleric_staff_ci",
            "assetType": "weapon",
            "views": {
              "front": "$INPUT"
            },
            "outputDir": "$OUT",
            "generator": {
              "python": "$TRIPOSR_PY",
              "backend": "triposr-mps",
              "source": "$TRIPOSR_SOURCE",
              "weights": "$TRIPOSR_WEIGHTS",
              "preset": "smoke",
              "device": "auto",
              "mcResolution": 320,
              "chunkSize": 8192,
              "removeBackground": false
            },
            "rigid": {
              "blender": "$BLENDER_BIN"
            },
            "runtimePart": {
              "slot": "MainHand",
              "socketBoneName": "RightHand",
              "socketLocalPosition": [0, 0, 0],
              "socketLocalEulerAngles": [0, 0, 0],
              "socketLocalScale": [1, 1, 1]
            }
          }
          JSON

          python3 tools/character-factory/character_factory.py build "$SPEC"
          python3 tools/character-factory/ci/verify_pipeline_artifact.py "$OUT"
          test -s "$OUT/sunlit_cleric_staff_ci.raw.basecolor.png"

          RENDER="$OUT/sunlit_cleric_staff_ci.render.png"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$OUT/sunlit_cleric_staff_ci.fbx" \
            --output "$RENDER" \
            --preserve-materials
          test -s "$RENDER"

      - name: Reconstruct enlarged isolated staff head
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/CharacterFactorySmoke"
          FULL_INPUT="$OUT/sunlit_cleric_staff_ci.input.png"
          HEAD_INPUT="$OUT/sunlit_cleric_staff_head_ci.input.png"
          "$TRIPOSR_PY" tools/character-factory/ci/prepare_staff_head_crop.py \
            --input "$FULL_INPUT" \
            --output "$HEAD_INPUT"
          test -s "$HEAD_INPUT"

          HEAD_SPEC="$RUNNER_TEMP/sunlit-cleric-staff-head-ci.json"
          cat > "$HEAD_SPEC" <<JSON
          {
            "id": "sunlit_cleric_staff_head_ci",
            "assetType": "weapon",
            "views": {
              "front": "$HEAD_INPUT"
            },
            "outputDir": "$OUT",
            "generator": {
              "python": "$TRIPOSR_PY",
              "backend": "triposr-mps",
              "source": "$TRIPOSR_SOURCE",
              "weights": "$TRIPOSR_WEIGHTS",
              "preset": "smoke",
              "device": "auto",
              "mcResolution": 320,
              "chunkSize": 8192,
              "removeBackground": false
            },
            "rigid": {
              "blender": "$BLENDER_BIN"
            },
            "runtimePart": {
              "slot": "MainHand",
              "socketBoneName": "RightHand",
              "socketLocalPosition": [0, 0, 0],
              "socketLocalEulerAngles": [0, 0, 0],
              "socketLocalScale": [1, 1, 1]
            }
          }
          JSON

          python3 tools/character-factory/character_factory.py build "$HEAD_SPEC"
          test -s "$OUT/sunlit_cleric_staff_head_ci.raw.basecolor.png"
          HEAD_RENDER="$OUT/sunlit_cleric_staff_head_ci.render.png"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$OUT/sunlit_cleric_staff_head_ci.fbx" \
            --output "$HEAD_RENDER" \
            --preserve-materials
          test -s "$HEAD_RENDER"

      - name: Assemble detailed head with procedural staff shaft
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/CharacterFactorySmoke"
          COMPOSITE="$OUT/sunlit_cleric_staff_composite_ci.fbx"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/runtime/blender_assemble_ornamented_staff.py -- \
            --input-head "$OUT/sunlit_cleric_staff_head_ci.raw.glb" \
            --output "$COMPOSITE" \
            --total-length 1.8 \
            --head-length 0.38 \
            --shaft-radius 0.024 \
            --axis auto \
            --attachment-side min
          test -s "$COMPOSITE"

          COMPOSITE_RENDER="$OUT/sunlit_cleric_staff_composite_ci.render.png"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$COMPOSITE" \
            --output "$COMPOSITE_RENDER" \
            --preserve-materials
          test -s "$COMPOSITE_RENDER"

          "$BLENDER_BIN" --background --python-expr "import bpy,sys; bpy.ops.import_scene.fbx(filepath='$COMPOSITE'); meshes=[o for o in bpy.context.scene.objects if o.type=='MESH']; print('CI_COMPOSITE_MESH_COUNT',len(meshes)); sys.exit(0 if len(meshes)>=2 else 3)"
          ls -lh "$OUT"

      - name: Build and verify rigged character smoke
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/CharacterFactoryCharacterSmoke"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          CANONICAL="$OUT/canonical_mannequin_ci.glb"
          INPUT="$OUT/canonical_mannequin_ci.input.png"
          GARMENT_INPUT="$OUT/canonical_cleric_robe_ci.input.png"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/create_canonical_character_fixture.py -- \
            --canonical "$CANONICAL" \
            --input "$INPUT" \
            --garment-input "$GARMENT_INPUT"
          test -s "$CANONICAL"
          test -s "$INPUT"
          test -s "$GARMENT_INPUT"

          SPEC="$RUNNER_TEMP/canonical-mannequin-character-ci.json"
          cat > "$SPEC" <<JSON
          {
            "id": "canonical_mannequin_character_ci",
            "assetType": "character",
            "views": {
              "front": "$INPUT"
            },
            "outputDir": "$OUT",
            "generator": {
              "python": "$TRIPOSR_PY",
              "backend": "triposr-mps",
              "source": "$TRIPOSR_SOURCE",
              "weights": "$TRIPOSR_WEIGHTS",
              "preset": "smoke",
              "device": "auto",
              "mcResolution": 192,
              "chunkSize": 8192,
              "removeBackground": false
            },
            "rig": {
              "blender": "$BLENDER_BIN",
              "canonicalBody": "$CANONICAL",
              "bodyObject": "Body",
              "armatureObject": "Armature",
              "maxTransferDistance": 0.38
            }
          }
          JSON

          python3 tools/character-factory/character_factory.py build "$SPEC"
          test -s "$OUT/canonical_mannequin_character_ci.raw.glb"
          test -s "$OUT/canonical_mannequin_character_ci.fbx"

          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$OUT/canonical_mannequin_character_ci.fbx"

          RENDER="$OUT/canonical_mannequin_character_ci.render.png"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$OUT/canonical_mannequin_character_ci.fbx" \
            --output "$RENDER" \
            --preserve-materials
          test -s "$RENDER"
          ls -lh "$OUT"

      - name: Build and verify skinned clothing smoke
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          CHARACTER_OUT="$GITHUB_WORKSPACE/Artifacts/CharacterFactoryCharacterSmoke"
          OUT="$GITHUB_WORKSPACE/Artifacts/CharacterFactoryClothingSmoke"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          CANONICAL="$CHARACTER_OUT/canonical_mannequin_ci.glb"
          GARMENT_INPUT="$CHARACTER_OUT/canonical_cleric_robe_ci.input.png"
          cp "$GARMENT_INPUT" "$OUT/canonical_cleric_robe_ci.input.png"

          SPEC="$RUNNER_TEMP/canonical-cleric-robe-ci.json"
          cat > "$SPEC" <<JSON
          {
            "id": "canonical_cleric_robe_ci",
            "assetType": "clothing",
            "views": {
              "front": "$GARMENT_INPUT"
            },
            "outputDir": "$OUT",
            "generator": {
              "python": "$TRIPOSR_PY",
              "backend": "triposr-mps",
              "source": "$TRIPOSR_SOURCE",
              "weights": "$TRIPOSR_WEIGHTS",
              "preset": "smoke",
              "device": "auto",
              "mcResolution": 192,
              "chunkSize": 8192,
              "removeBackground": false
            },
            "rig": {
              "blender": "$BLENDER_BIN",
              "canonicalBody": "$CANONICAL",
              "bodyObject": "GarmentDonor",
              "armatureObject": "Armature",
              "maxTransferDistance": 0.38
            },
            "runtimePart": {
              "slot": "Torso",
              "socketBoneName": null,
              "socketLocalPosition": [0, 0, 0],
              "socketLocalEulerAngles": [0, 0, 0],
              "socketLocalScale": [1, 1, 1]
            }
          }
          JSON

          python3 tools/character-factory/character_factory.py build "$SPEC"
          test -s "$OUT/canonical_cleric_robe_ci.raw.glb"
          test -s "$OUT/canonical_cleric_robe_ci.fbx"

          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$OUT/canonical_cleric_robe_ci.fbx"

          RENDER="$OUT/canonical_cleric_robe_ci.render.png"
          "$BLENDER_BIN" --background \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$OUT/canonical_cleric_robe_ci.fbx" \
            --output "$RENDER" \
            --preserve-materials
          test -s "$RENDER"
          ls -lh "$OUT"

      - name: Upload generated pipeline smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-factory-smokes-${{ github.sha }}
          path: |
            Artifacts/CharacterFactorySmoke/
            Artifacts/CharacterFactoryCharacterSmoke/
            Artifacts/CharacterFactoryClothingSmoke/
          if-no-files-found: warn
          retention-days: 7
