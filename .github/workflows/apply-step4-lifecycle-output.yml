name: Apply step4 lifecycle output wiring

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-step4-lifecycle-output.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0

      - name: Fast-forward to current branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/voxel-showcase-rendering-repair-v2
          git reset --hard origin/feature/voxel-showcase-rendering-repair-v2

      - name: Wire focused lifecycle output
        shell: bash
        run: python3 .github/scripts/apply-step4-lifecycle-output.py

      - name: Verify exact diagnostic diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'if (band.step == 4)' Assets/Tests/PlayMode/LodRenderingTests.cs
          grep -q 'lifecycle:{Step4FalseEmptyDiagnostics.Current}' Assets/Tests/PlayMode/LodRenderingTests.cs
          grep -q 'known=110/inBand=23/frustum=8/ready=0/empty=8' .claude/plans/voxel-showcase-rendering-repair-v2.md
          git diff -- Assets/Tests/PlayMode/LodRenderingTests.cs .claude/plans/voxel-showcase-rendering-repair-v2.md

      - name: Commit clean diagnostic output and retire transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Tests/PlayMode/LodRenderingTests.cs .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm .github/scripts/apply-step4-lifecycle-output.py .github/workflows/apply-step4-lifecycle-output.yml
          git commit -m 'diag(rendering): expose step4 empty adjudication'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
