name: Faceted LOD stride correction patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-faceted-stride-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded faceted stride patch
        run: python3 .github/scripts/async_geometry_faceted_stride_fix.py
      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'ChunkOriginVoxel + local \* SourceStep' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/SnapshotFacetedMaskJob.cs
          grep -q 'side == 0 ? -SourceStep : SourceStep' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/SnapshotFacetedMaskJob.cs
          grep -q 'width \* SourceStep' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/FacetedMergeJob.cs
          grep -q 'StepEightFacetedMergeSpansEightVoxelsPerCell' Assets/Tests/EditMode/FacetedLodStrideTests.cs
          grep -q 'FacetedLodPathCarriesSourceStepThroughSnapshotAndMerge' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit faceted stride correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/SnapshotFacetedMaskJob.cs \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/Transvoxel/FacetedMergeJob.cs \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
            Assets/Tests/EditMode/FacetedLodStrideTests.cs \
            Assets/Tests/EditMode/FacetedLodStrideTests.cs.meta \
            Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
            docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Fix faceted LOD source-step scaling'
          git fetch origin refactor/async-geometry-pipeline
          git rebase origin/refactor/async-geometry-pipeline
          git push origin HEAD:refactor/async-geometry-pipeline
