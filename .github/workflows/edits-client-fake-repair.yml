name: Repair Edits capability test doubles
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          for name, cls in [
              ('Assets/Tests/EditMode/AuthoritativeSessionLoopbackTests.cs','AcceptingApplier'),
              ('Assets/Tests/EditMode/ServerCommandProcessorTests.cs','RecordingApplier')]:
              p=Path(name); text=p.read_text()
              marker=f'''        private sealed class {cls} : IAlterationApplier\n        {{\n'''
              if text.count(marker)!=1: raise SystemExit(f'{cls} marker mismatch')
              methods='''            public bool Supports(in AlterationEvent evt) => true;\n            public bool HasRequiredResidency(IRegionMutationStore storage, in AlterationEvent evt) => true;\n            public bool HasRequiredResidencyExcept(\n                IRegionMutationStore storage, in AlterationEvent evt, int3 excludedRegion) => true;\n            public bool TryApplyExceptRegion(\n                IRegionMutationStore storage,\n                in AlterationEvent evt,\n                int3 excludedRegion,\n                out NativeList<int3> affectedBlocks) =>\n                TryApply(storage, in evt, out affectedBlocks);\n\n'''
              p.write_text(text.replace(marker,marker+methods,1))
          PY
          git rm .github/workflows/edits-client-fake-repair.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode/AuthoritativeSessionLoopbackTests.cs Assets/Tests/EditMode/ServerCommandProcessorTests.cs
          git commit -m 'Complete Edits capability test doubles'
          git push origin HEAD:${{ github.ref_name }}
