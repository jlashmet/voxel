          start = text.index('        private void SendPredictedLocalInput()\n')
          end = text.index('        private void PumpEndpointsAndApply()\n', start)
          text = text[:start] + '''        private void SendPredictedLocalInput()
        {
            byte flags = 0;
            if (_sprint) flags |= InputFlagSprint;
            if (_jump) flags |= InputFlagJump;

            uint tick = _clientTick;
            _clientTick = unchecked(_clientTick + 1);
