          replace('''            var request = new C_AlterationRequest(
                _clientTick,
                originVoxel,
                AlterationEvent.KindExplosion,
                VoxelGrid.MaterialEmpty,
                AlterationEvent.KindExplosion,
                radiusBricks,
                seed: 0,
