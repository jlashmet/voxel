          replace('''            if (!NetworkEndpoint.TryParse(address, networkPort, out NetworkEndpoint endpoint, NetworkFamily.Ipv4) &&
                !NetworkEndpoint.TryParse(address, networkPort, out endpoint, NetworkFamily.Ipv6))''',
