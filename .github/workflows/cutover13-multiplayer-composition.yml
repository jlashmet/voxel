          path.write_text(text)

          showcase_asm = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          showcase = json.loads(showcase_asm.read_text())
          showcase['references'] = [
              r for r in showcase['references'] if r != 'Unity.Networking.Transport'
          ]
          showcase_asm.write_text(json.dumps(showcase, indent=2) + '\n')

          composition_asm = Path('Assets/VoxelEngine/Composition/VoxelEngine.Composition.asmdef')
          composition = json.loads(composition_asm.read_text())
          for ref in ('VoxelEngine.Net.Runtime', 'Unity.Networking.Transport'):
              if ref not in composition['references']:
                  composition['references'].append(ref)
          composition_asm.write_text(json.dumps(composition, indent=2) + '\n')

          # This slice must reduce Showcase's concrete Runtime namespace inventory from two files
          # to exactly one: ShowcaseWorld.cs. The final scene-runtime cutover owns that file.
          runtime_files = []
          for source in sorted(Path('Assets/Scenes/Showcase').rglob('*.cs')):
              source_text = source.read_text(errors='ignore')
              if '.Runtime' in source_text and 'VoxelEngine.' in source_text:
                  import re
                  if re.search(r'VoxelEngine\.[A-Za-z0-9_.]+\.Runtime(?:\.[A-Za-z0-9_.]+)*', source_text):
                      runtime_files.append(str(source))
          if runtime_files != ['Assets/Scenes/Showcase/ShowcaseWorld.cs']:
              raise SystemExit(f'Unexpected remaining Showcase Runtime files: {runtime_files}')
