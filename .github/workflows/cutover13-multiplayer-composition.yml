name: Cutover 13 multiplayer composition

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-multiplayer-composition.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Publish multiplayer composition cutover
        shell: bash
        run: python3 .github/scripts/publish_cutover13_multiplayer.py
