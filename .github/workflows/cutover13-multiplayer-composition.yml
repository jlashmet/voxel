          replace('using Unity.Networking.Transport;\n', '', 'remove UTP import')
          replace('using VoxelEngine.Edits.Api;\n', '', 'remove Edits import')
          replace('using VoxelEngine.Net.Runtime.Client;\nusing VoxelEngine.Net.Runtime.Protocol;\nusing VoxelEngine.Net.Runtime.Server;\n', '', 'remove Net.Runtime imports')
          replace('internal sealed class ShowcaseMultiplayerSession : IDisposable,\n        IAuthoritativePlayerInputSink, IClientPredictionAdapter',
                  'internal sealed class ShowcaseMultiplayerSession : IDisposable,\n        IAuthoritativeNetworkInputSink, IClientNetworkPredictionAdapter',
