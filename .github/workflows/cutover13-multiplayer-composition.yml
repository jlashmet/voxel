name: Cutover 13 multiplayer composition

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-multiplayer-composition.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Apply multiplayer composition cutover
        run: python3 .github/scripts/cutover13_multiplayer.py
      - name: Publish slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cutover13-multiplayer-composition.yml
          rm .github/scripts/cutover13_multiplayer.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: route showcase networking through composition'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
