name: Async geometry test compile fix

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-test-compile-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Qualify Unity Object in stress fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/Tests/PlayMode/AsyncGeometryStressTests.cs')
          s = p.read_text()
          anchor = 'using UnityEngine.TestTools;\n'
          alias = 'using Object = UnityEngine.Object;\n'
          if alias not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'expected one TestTools using, found {s.count(anchor)}')
              s = s.replace(anchor, anchor + alias, 1)
          p.write_text(s)
          PY
          grep -q '^using Object = UnityEngine.Object;' Assets/Tests/PlayMode/AsyncGeometryStressTests.cs
          git rm .github/workflows/async-geometry-test-compile-fix.yml
      - name: Commit compile fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Tests/PlayMode/AsyncGeometryStressTests.cs
          git commit -m 'Fix async geometry test assembly compilation'
          git push origin HEAD:refactor/async-geometry-pipeline
