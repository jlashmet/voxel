name: DestructionClass Api static
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/destruction-class-api-static.yml
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f7f410f370b085605367cd7d0683bb7639c717d
          fetch-depth: 1
      - name: Verify DestructionClass namespace ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          api = Path('Assets/VoxelEngine/Storage/Api/DestructionClass.cs')
          if 'namespace VoxelEngine.Storage.Api' not in api.read_text():
              raise SystemExit('DestructionClass is not in Storage.Api')
          definitions=[]
          offenders=[]
          for root_name in ('Assets','Packages'):
              root=Path(root_name)
              if not root.exists(): continue
              for path in root.rglob('*.cs'):
                  text=path.read_text(errors='ignore')
                  if 'enum DestructionClass' in text:
                      definitions.append(path)
                  if 'DestructionClass.' not in text or path == api:
                      continue
                  if 'namespace VoxelEngine.Storage.Api' in text:
                      continue
                  if 'using VoxelEngine.Storage.Api;' not in text and 'VoxelEngine.Storage.Api.DestructionClass' not in text:
                      offenders.append(path)
          print('DEFINITIONS', *map(str,definitions))
          print('OFFENDERS', *map(str,offenders))
          if definitions != [api]:
              raise SystemExit('DestructionClass has non-Api definition(s)')
          if offenders:
              raise SystemExit('DestructionClass consumers missing Storage.Api import: ' + ', '.join(map(str,offenders)))
          print('DestructionClass Api migration statically accepted')
          PY
