name: One-shot Trace Kentridge Program Builder

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-fix-direct-kentridge-emit-calls.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Print relevant builder source
        shell: bash
        run: |
          root='Packages/com.mountingforce.worldgen'
          echo '=== SingleProgramBuilder / BoxRelativeStage / foundation-skirt ==='
          grep -R -n -C 24 -E 'SingleProgramBuilder|BoxRelativeStage|foundation-skirt' "$root" --include='*.cs' || true
          echo '=== all EmitBox construction paths ==='
          grep -R -n -C 12 'ShapeOp.EmitBox' "$root" --include='*.cs' || true
      - name: Remove failed scanner tooling
        run: |
          rm .github/scripts/one_shot_fix_direct_kentridge_emit_calls.py
          rm .github/workflows/one-shot-fix-direct-kentridge-emit-calls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove kentridge emit diagnostic"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
