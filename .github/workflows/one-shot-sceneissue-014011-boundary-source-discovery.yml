name: One-shot SceneIssue 014011 boundary source discovery

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-boundary-source-discovery.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          fetch-depth: 0
      - name: Capture boundary semantic definitions
        shell: bash
        run: |
          set -euo pipefail
          OUT=.claude/plans/sceneissue-014011-boundary-source.txt
          mkdir -p "$(dirname "$OUT")"
          {
            echo '=== matching files ==='
            grep -RIlE 'VoxelBoundarySample|AppliesAlong\(|FromSignedQ4\(' Assets/VoxelEngine Assets/Tests || true
            echo
            echo '=== definitions/usages ==='
            grep -RInE -C 12 'struct VoxelBoundarySample|class VoxelBoundarySample|AppliesAlong\(|FromSignedQ4\(|SignedQ3|ExtrusionAxis' Assets/VoxelEngine Assets/Tests || true
          } > "$OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'SceneIssue 014011: record boundary semantics source'
            git push origin HEAD:fixes
          fi
