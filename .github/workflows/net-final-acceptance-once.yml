name: Net final acceptance once
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  unity-editmode:
    name: Net final pinned EditMode
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb0642b941b1280be1cbe61c7ae68ff38578c9d7
          clean: false
          fetch-depth: 1
      - name: Reset pinned tree
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard bb0642b941b1280be1cbe61c7ae68ff38578c9d7
          git clean -ffdx -e Library/
      - name: Locate Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode baseline gate
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetFinalAcceptance"
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          echo "Unity exit status: $status"
          test -s "$ROOT/results.xml"
          exit 0
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-final-bb0642b9
          path: Artifacts/NetFinalAcceptance/
          if-no-files-found: warn
          retention-days: 14
