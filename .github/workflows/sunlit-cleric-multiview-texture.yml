name: Sunlit Cleric multiview texture

on:
  push:
    branches: [feature/character-weapon-asset-pipeline]
    paths:
      - '.github/workflows/sunlit-cleric-multiview-texture.yml'
      - 'tools/character-factory/runtime/blender_multiview_texture.py'
      - 'tools/character-factory/runtime/blender_texture_rigged_character.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sunlit-cleric-multiview-texture
  cancel-in-progress: true

jobs:
  texture-latest-multiview-cleric:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      SOURCE_DIR: Artifacts/SunlitClericMultiviewSource
      OUTPUT_DIR: Artifacts/SunlitClericMultiviewTextured
      REVIEW_DIR: docs/lookdev/characters/sunlit-cleric/multiview-textured
      CLERIC_FRONT_BLOB: '755068074ad5e01b6dcab2df39a6e1cfadd9f536'
      CLERIC_BACK_BLOB: '9ede77dd90933f80f7c3ab705e1a1cc2794e0dfa'
      CLERIC_LEFT_BLOB: 'f196ff7aa5de344bdec79f4b4ec4739f33932f32'
      CLERIC_RIGHT_BLOB: 'bec2a8aa730e130fcb5486d7b3fff39922a0031d'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download latest successful multiview geometry artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR" "$OUTPUT_DIR"
          mkdir -p "$SOURCE_DIR" "$OUTPUT_DIR"
          python3 - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          source_dir = Path(os.environ['SOURCE_DIR'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url: str):
              request = Request(url, headers=headers)
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          params = urlencode({
              'branch': 'feature/character-weapon-asset-pipeline',
              'status': 'success',
              'per_page': 5,
          })
          runs_url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/'
              f'sunlit-cleric-multiview-build.yml/runs?{params}'
          )
          runs = get_json(runs_url).get('workflow_runs', [])
          if not runs:
              raise RuntimeError(
                  'no successful multiview geometry run found; build geometry first'
              )
          run = runs[0]

          run_id = int(run['id'])
          artifacts = get_json(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
          ).get('artifacts', [])
          artifact = next(
              (item for item in artifacts if item.get('name') == 'sunlit-cleric-multiview-prototype'),
              None,
          )
          if artifact is None:
              raise RuntimeError(f'geometry artifact missing on run {run_id}')

          request = Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact["id"]}/zip',
              headers=headers,
          )
          with urlopen(request, timeout=120) as response:
              archive = response.read()
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              zipped.extractall(source_dir)

          fbx = list(source_dir.rglob('sunlit_cleric_mv_01.fbx'))
          if len(fbx) != 1:
              raise RuntimeError(f'expected one source FBX, found {fbx}')

          metadata = {
              'geometry_workflow_run_id': run_id,
              'geometry_workflow_head_sha': run['head_sha'],
              'geometry_artifact_id': int(artifact['id']),
          }
          Path(os.environ['OUTPUT_DIR'], 'texture-source.json').write_text(
              json.dumps(metadata, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(metadata, indent=2))
          PY

      - name: Ensure clean four-view source exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VIEW_DIR="tools/character-factory/production/sunlit-cleric/views"
          mkdir -p "$VIEW_DIR"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          root = Path('tools/character-factory/production/sunlit-cleric/views')
          blobs = {
              'front': os.environ['CLERIC_FRONT_BLOB'],
              'back': os.environ['CLERIC_BACK_BLOB'],
              'left': os.environ['CLERIC_LEFT_BLOB'],
              'right': os.environ['CLERIC_RIGHT_BLOB'],
          }
          for name, sha in blobs.items():
              path = root / f'{name}.jpg'
              if path.is_file() and path.stat().st_size > 1000:
                  continue
              request = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urlopen(request, timeout=60) as response:
                  data = json.load(response)
              path.write_bytes(base64.b64decode(data['content']))
              print(f'materialized fallback {name}: {sha}')
          PY
          for view in front back left right; do
            test -s "$VIEW_DIR/$view.jpg"
          done

      - name: Resolve Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/Applications/Blender.app/Contents/MacOS/Blender"
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Project turnaround colors onto rigged geometry
        shell: bash
        run: |
          set -euo pipefail
          INPUT_FBX="$(find "$SOURCE_DIR" -name 'sunlit_cleric_mv_01.fbx' -type f -print -quit)"
          test -s "$INPUT_FBX"
          VIEW_DIR="$GITHUB_WORKSPACE/tools/character-factory/production/sunlit-cleric/views"
          OUT_FBX="$GITHUB_WORKSPACE/$OUTPUT_DIR/sunlit_cleric_mv_textured_01.fbx"
          ATLAS="$GITHUB_WORKSPACE/$OUTPUT_DIR/sunlit_cleric_mv_textured_01.multiview_basecolor.png"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/runtime/blender_texture_rigged_character.py -- \
            --input "$INPUT_FBX" \
            --output "$OUT_FBX" \
            --front "$VIEW_DIR/front.jpg" \
            --back "$VIEW_DIR/back.jpg" \
            --left "$VIEW_DIR/left.jpg" \
            --right "$VIEW_DIR/right.jpg" \
            --atlas "$ATLAS"

          test -s "$OUT_FBX"
          test -s "$ATLAS"

      - name: Verify textured rig and animations
        shell: bash
        run: |
          set -euo pipefail
          FBX="$GITHUB_WORKSPACE/$OUTPUT_DIR/sunlit_cleric_mv_textured_01.fbx"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$FBX"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_character_animations.py -- \
            --input "$FBX"

      - name: Render textured character previews
        shell: bash
        run: |
          set -euo pipefail
          FBX="$GITHUB_WORKSPACE/$OUTPUT_DIR/sunlit_cleric_mv_textured_01.fbx"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$FBX" \
            --output "$GITHUB_WORKSPACE/$OUTPUT_DIR/cleric_mv_textured_bind.png" \
            --preserve-materials
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" \
            --output "$GITHUB_WORKSPACE/$OUTPUT_DIR/cleric_mv_textured_idle.png" \
            --clip Idle --frame 30
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" \
            --output "$GITHUB_WORKSPACE/$OUTPUT_DIR/cleric_mv_textured_cast.png" \
            --clip Cast --frame 28

      - name: Upload textured animated Cleric
        uses: actions/upload-artifact@v4
        with:
          name: sunlit-cleric-multiview-textured-prototype
          path: Artifacts/SunlitClericMultiviewTextured/
          if-no-files-found: error
          retention-days: 14

      - name: Publish textured review renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          cp "$OUTPUT_DIR/cleric_mv_textured_bind.png" "$REVIEW_DIR/"
          cp "$OUTPUT_DIR/cleric_mv_textured_idle.png" "$REVIEW_DIR/"
          cp "$OUTPUT_DIR/cleric_mv_textured_cast.png" "$REVIEW_DIR/"
          cp "$OUTPUT_DIR/texture-source.json" "$REVIEW_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR"
          if git diff --cached --quiet; then
            echo 'Latest textured review is already published.'
            exit 0
          fi
          git commit -m 'docs(characters): publish textured cleric review [mv-texture-review]'
          git push origin HEAD:feature/character-weapon-asset-pipeline
