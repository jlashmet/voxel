name: Inventory finalization branch writers

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/finalization-writer-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Find workflows capable of mutating the finalization branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rows = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(errors='ignore')
              flags = []
              if 'contents: write' in text:
                  flags.append('contents-write')
              if 'git push' in text:
                  flags.append('git-push')
              if 'refactor/system-boundaries-finalization-stable' in text and ('git push' in text or 'contents: write' in text):
                  flags.append('stable-branch-writer')
              if flags:
                  rows.append(f"{path}\t{','.join(flags)}")
          Path('finalization-writers.tsv').write_text('\n'.join(rows) + ('\n' if rows else ''))
          print(Path('finalization-writers.tsv').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finalization-writers-${{ github.sha }}
          path: finalization-writers.tsv
          if-no-files-found: error
