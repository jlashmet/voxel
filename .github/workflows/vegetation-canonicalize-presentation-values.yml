name: Vegetation canonicalize presentation values
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path

          state = Path('Assets/VoxelEngine/Vegetation/TreeWorldState.cs')
          s = state.read_text()
          blocks = [
          '''    public readonly struct TreeBranchCutEvent
              {
                  public readonly int TreeIndex;
                  public readonly int BranchIndex;
                  public readonly float3 HitPointMetres;
                  public readonly float3 Impulse;
          
                  public TreeBranchCutEvent(int treeIndex, int branchIndex,
                                            float3 hitPointMetres, float3 impulse)
                  {
                      TreeIndex = treeIndex;
                      BranchIndex = branchIndex;
                      HitPointMetres = hitPointMetres;
                      Impulse = impulse;
                  }
              }
          
          ''',
          '''    public readonly struct TreeDamageChangedEvent
              {
                  public readonly int TreeIndex;
                  public readonly float FoliageHealth;
                  public readonly bool Severed;
          
                  public TreeDamageChangedEvent(int treeIndex, float foliageHealth, bool severed)
                  {
                      TreeIndex = treeIndex;
                      FoliageHealth = foliageHealth;
                      Severed = severed;
                  }
              }
          
          ''',
          '''    public readonly struct TreeSeveredEvent
              {
                  public readonly int TreeIndex;
                  public readonly int BreakBranchIndex;
                  public readonly float3 HitPointMetres;
                  public readonly float3 Impulse;
          
                  public TreeSeveredEvent(int treeIndex, int breakBranchIndex,
                                          float3 hitPointMetres, float3 impulse)
                  {
                      TreeIndex = treeIndex;
                      BreakBranchIndex = breakBranchIndex;
                      HitPointMetres = hitPointMetres;
                      Impulse = impulse;
                  }
              }
          
          ''',
          '''        public struct TreeDamageState
                  {
                      public float FoliageHealth;
                      public bool Severed;
                  }
          
          ''',
          ]
          for block in blocks:
              if s.count(block) != 1:
                  raise SystemExit('TreeWorldState canonical block drifted')
              s = s.replace(block, '')
          old = '''                    s_Damage.Add(new TreeDamageState
                              {
                                  FoliageHealth = 1f,
                                  Severed = false,
                              });'''
          if s.count(old) != 1:
              raise SystemExit('TreeWorldState initial damage construction drifted')
          s = s.replace(old, '                    s_Damage.Add(new TreeDamageState(1f, false));')
          old = '''            s_Damage[index] = new TreeDamageState
                      {
                          FoliageHealth = nextFoliageHealth,
                          Severed = nextSevered,
                      };'''
          if s.count(old) != 1:
              raise SystemExit('TreeWorldState damage assignment drifted')
          s = s.replace(old, '            s_Damage[index] = new TreeDamageState(nextFoliageHealth, nextSevered);')
          state.write_text(s)

          skeleton = Path('Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs')
          s = skeleton.read_text()
          blocks = [
          '''    public struct TreeBranchSegment
              {
                  public float3 Start;
                  public float3 End;
                  public float RadiusStart;
                  public float RadiusEnd;
                  public int Level;
              }
          
          ''',
          '''    public struct TreeLeafAnchor
              {
                  public float3 Position;
                  public float3 Direction;
                  public float Size;
                  public float Rotation;
                  public float4 Colour;
                  public TreeLeafStyle Style;
              }
          
          ''',
          ]
          for block in blocks:
              if s.count(block) != 1:
                  raise SystemExit('Skeleton presentation value block drifted')
              s = s.replace(block, '')
          skeleton.write_text(s)
          PY
          git diff --check
          git diff -- Assets/VoxelEngine/Vegetation/TreeWorldState.cs Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs
          git rm .github/workflows/vegetation-canonicalize-presentation-values.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/TreeWorldState.cs Assets/VoxelEngine/Vegetation/ProceduralTreeSkeletonBuilder.cs
          git commit -m 'Canonicalize Vegetation presentation values in Api'
          git push origin HEAD:${{ github.ref_name }}
