name: Mark accepted Cutover 13 slices

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/mark-cutover13-accepted.yml

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Patch checklist without replacing the document
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = p.read_text()
          anchor = '- [x] route `ArchLookdev` rendering/presentation access through `RenderingComposition`; accepted at `8780cffe66a0e3e4ba75b524957d00b481ace971`, run `31907252082` with exact 387/374/13 baseline and zero compiler errors\n'
          additions = (
              '- [x] route `ArchLookdev` structure authoring through `StructuresComposition`; accepted at `05de54c3`, run `31907948874` with exact 387/374/13 baseline and zero compiler errors\n'
              '- [x] route `ShowcaseMultiplayerSession` through Composition-owned network facades; accepted at `28a3fda2`, run `31908243915` with exact 387/374/13 baseline and zero compiler errors\n'
          )
          if additions.splitlines()[0] in s:
              raise SystemExit('accepted Cutover 13 checklist rows already present')
          if s.count(anchor) != 1:
              raise SystemExit('Cutover 13 checklist anchor changed')
          p.write_text(s.replace(anchor, anchor + additions, 1))
          PY
          rm .github/workflows/mark-cutover13-accepted.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/workflows/mark-cutover13-accepted.yml
          git commit -m 'docs(refactor): mark accepted Cutover 13 slices'
          for attempt in $(seq 1 20); do
            git fetch origin refactor/system-boundaries-foundation-storage
            git rebase origin/refactor/system-boundaries-foundation-storage
            if git push origin HEAD:refactor/system-boundaries-foundation-storage; then
              exit 0
            fi
            sleep 1
          done
          echo 'unable to publish checklist update after retries' >&2
          exit 1
