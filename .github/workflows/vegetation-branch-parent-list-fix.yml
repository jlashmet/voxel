name: Vegetation branch-parent list fix
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs': [
              ('int[] parents = skeleton.BranchParents;', 'IReadOnlyList<int> parents = skeleton.BranchParents;'),
              ('parents.Length != skeleton.Branches.Count', 'parents.Count != skeleton.Branches.Count'),
              ('(uint)current >= (uint)parents.Length', '(uint)current >= (uint)parents.Count'),
            ],
            'Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs': [
              ('int[] parents = skeleton.BranchParents;', 'IReadOnlyList<int> parents = skeleton.BranchParents;'),
              ('i < parents.Length', 'i < parents.Count'),
            ],
          }
          for path, pairs in replacements.items():
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if s.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {s.count(old)}')
                  s = s.replace(old, new)
              p.write_text(s)
          PY
          git diff --check
          git diff -- Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs
          git rm .github/workflows/vegetation-branch-parent-list-fix.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs Assets/VoxelEngine/Rendering/Vegetation/ProceduralTreeDetachedLimbPresenter.cs
          git commit -m 'fix: use Vegetation Api parent list contract'
          git push origin HEAD:${{ github.ref_name }}
