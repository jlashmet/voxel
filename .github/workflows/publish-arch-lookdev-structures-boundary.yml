name: Publish ArchLookdev Structures boundary cut
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/publish-arch-lookdev-structures-boundary.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Hide ArchLookdev structure implementation behind Composition
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs')
          runtime.write_text(r'''using System;
          using Unity.Collections;
          using Unity.Mathematics;
          using VoxelEngine.Storage.Api;
          using VoxelEngine.Structures.Api;

          namespace VoxelEngine.Structures.Runtime
          {
              /// <summary>
              /// Runtime-only orchestration for the interactive arch authoring path. Application
              /// code supplies stable values through Composition; concrete feature emitters,
              /// rasterisation, retained-profile mutation and weathering remain private here.
              /// </summary>
              public static class ArchBayAuthoringPipeline
              {
                  public static void Author(
                      IRegionReadSource reads,
                      IRegionMutationStore mutations,
                      IMaterialAuthoringCatalogue materials,
                      int clearSpan,
                      int pierHeight,
                      int ringThickness,
                      int depth,
                      int voussoirCount,
                      int shoulderWidth,
                      int topMargin,
                      int faceRecess,
                      int plinthHeight,
                      int impostHeight,
                      int damage,
                      int damageScale,
                      uint seed,
                      int profileJointHalfWidthQ4,
                      int profileBevelQ4,
                      int profileProjectionQ4,
                      int profileDepthQ4,
                      byte stoneMaterial,
                      ushort surfaceStyle,
                      byte weatheringCoating,
                      byte weatheringCoverage,
                      int writeBudget,
                      out IProfileBlockReadSource profiles,
                      out int width,
                      out int height)
                  {
                      if (reads == null) throw new ArgumentNullException(nameof(reads));
                      if (mutations == null) throw new ArgumentNullException(nameof(mutations));
                      if (materials == null) throw new ArgumentNullException(nameof(materials));
                      if (writeBudget <= 0) throw new ArgumentOutOfRangeException(nameof(writeBudget));

                      var profileStore = new ProfileBlockStore();
                      var arch = new ArchFeatureDefinition
                      {
                          ClearSpan = clearSpan,
                          PierHeight = pierHeight,
                          RingThickness = ringThickness,
                          Depth = depth,
                          VoussoirCount = voussoirCount,
                          JointRecessDepth = 1,
                          ProfileJointHalfWidthQ4 = (byte)profileJointHalfWidthQ4,
                          ProfileBevelQ4 = (byte)profileBevelQ4,
                          ProfileProjectionQ4 = (byte)profileProjectionQ4,
                          ProfileDepthQ4 = (byte)profileDepthQ4,
                          StoneMaterial = stoneMaterial,
                          PierStyle = surfaceStyle,
                          RingStyle = surfaceStyle,
                      };
                      var bay = new ArchBayFeatureDefinition
                      {
                          Arch = arch,
                          ShoulderWidth = shoulderWidth,
                          TopMargin = topMargin,
                          FaceRecess = faceRecess,
                          PlinthHeight = plinthHeight,
                          ImpostHeight = impostHeight,
                          Damage = (ArchRuinDamage)damage,
                          DamageSeed = seed,
                          DamageScale = (byte)damageScale,
                      };
                      int3 origin = new(-bay.Width / 2, 0, 0);
                      using (var primitives = new NativeList<Primitive>(
                                 bay.Metadata.MaxPrimitives, Allocator.Temp))
                      {
                          if (!bay.Emit(origin, primitives, profileStore))
                              throw new InvalidOperationException("Arch parameters did not emit.");
                          RasterResult result = PrimitiveRasteriser.Rasterise(
                              primitives.AsArray(), origin, origin + bay.Metadata.Footprint,
                              reads, mutations);
                          if (result.BudgetExceeded)
                              throw new InvalidOperationException("Arch exceeded the feature budget.");
                      }

                      var brush = new VoxelBrush(reads, mutations, materials, writeBudget);
                      MasonryWeathering.CoatExposedSurfaces(
                          ref brush,
                          origin - 2,
                          bay.Metadata.Footprint + 4,
                          weatheringCoating,
                          seed,
                          weatheringCoverage,
                          dripPasses: 0);

                      profiles = profileStore;
                      width = bay.Width;
                      height = bay.Height;
                  }
              }
          }
          '''.replace('          ', ''))

          Path('Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs.meta').write_text(
              'fileFormatVersion: 2\nguid: 6f1a4c5e8b0d4e219a7f32c6d9b1e405\n')

          composition = Path('Assets/VoxelEngine/Composition/StructuresComposition.cs')
          s = composition.read_text()
          if 'using VoxelEngine.Storage.Api;\n' not in s:
              s = s.replace('using Unity.Mathematics;\n',
                            'using Unity.Mathematics;\nusing VoxelEngine.Storage.Api;\n', 1)
          anchor = '''        public static CastlePlan PlanCastle(int3 centre, uint seed) =>\n            CastleBuilder.Plan(centre, seed);\n'''
          if anchor not in s:
              raise SystemExit('Missing StructuresComposition PlanCastle anchor')
          replacement = anchor + '''\n        /// <summary>\n        /// Authors one deterministic masonry arch bay while keeping all concrete Structures.Runtime\n        /// implementation types behind the Composition boundary. Retained profile output is exposed\n        /// only through the Storage.Api read capability consumed by Rendering.\n        /// </summary>\n        public static void AuthorArchBay(\n            IVoxelStorageRuntime storage,\n            int clearSpan,\n            int pierHeight,\n            int ringThickness,\n            int depth,\n            int voussoirCount,\n            int shoulderWidth,\n            int topMargin,\n            int faceRecess,\n            int plinthHeight,\n            int impostHeight,\n            int damage,\n            int damageScale,\n            uint seed,\n            int profileJointHalfWidthQ4,\n            int profileBevelQ4,\n            int profileProjectionQ4,\n            int profileDepthQ4,\n            byte stoneMaterial,\n            ushort surfaceStyle,\n            byte weatheringCoating,\n            byte weatheringCoverage,\n            int writeBudget,\n            out IProfileBlockReadSource profiles,\n            out int width,\n            out int height)\n        {\n            if (storage == null)\n                throw new System.ArgumentNullException(nameof(storage));\n\n            ArchBayAuthoringPipeline.Author(\n                storage.Reads,\n                storage.Mutations,\n                storage.MaterialAuthoring,\n                clearSpan,\n                pierHeight,\n                ringThickness,\n                depth,\n                voussoirCount,\n                shoulderWidth,\n                topMargin,\n                faceRecess,\n                plinthHeight,\n                impostHeight,\n                damage,\n                damageScale,\n                seed,\n                profileJointHalfWidthQ4,\n                profileBevelQ4,\n                profileProjectionQ4,\n                profileDepthQ4,\n                stoneMaterial,\n                surfaceStyle,\n                weatheringCoating,\n                weatheringCoverage,\n                writeBudget,\n                out profiles,\n                out width,\n                out height);\n        }\n'''
          s = s.replace(anchor, replacement, 1)
          composition.write_text(s)

          p = Path('Assets/Scenes/Showcase/ArchLookdev.cs')
          s = p.read_text()
          for import_line in (
              'using Unity.Collections;\n',
              'using Unity.Mathematics;\n',
              'using VoxelEngine.Structures.Runtime;\n',
          ):
              if import_line not in s:
                  raise SystemExit('Missing ArchLookdev import anchor: ' + import_line.strip())
              s = s.replace(import_line, '', 1)
          field_old = '        private ProfileBlockStore _profileBlocks;\n'
          field_new = '        private IProfileBlockReadSource _profileBlocks;\n'
          if field_old not in s:
              raise SystemExit('Missing ArchLookdev profile field anchor')
          s = s.replace(field_old, field_new, 1)

          old = '''            var nextProfiles = new ProfileBlockStore();\n            var arch = new ArchFeatureDefinition\n            {\n                ClearSpan = _clearSpan,\n                PierHeight = _pierHeight,\n                RingThickness = _ringThickness,\n                Depth = _depth,\n                VoussoirCount = _voussoirs,\n                JointRecessDepth = 1,\n                ProfileJointHalfWidthQ4 = (byte)_jointQ4,\n                ProfileBevelQ4 = (byte)_bevelQ4,\n                ProfileProjectionQ4 = (byte)_projectionQ4,\n                ProfileDepthQ4 = (byte)_faceDepthQ4,\n                StoneMaterial = StoneMaterial,\n                PierStyle = SurfaceStyles.MasonryJoint,\n                RingStyle = SurfaceStyles.MasonryJoint,\n            };\n            var bay = new ArchBayFeatureDefinition\n            {\n                Arch = arch, ShoulderWidth = _shoulder, TopMargin = _topMargin,\n                FaceRecess = _faceRecess, PlinthHeight = _plinthHeight,\n                ImpostHeight = _impostHeight,\n                Damage = (ArchRuinDamage)_damage,\n                DamageSeed = 0xA341u + (uint)_seedOffset,\n                DamageScale = (byte)_damageScale,\n            };\n            int3 origin = new(-bay.Width / 2, 0, 0);\n            using (var primitives = new NativeList<Primitive>(bay.Metadata.MaxPrimitives,\n                                                               Allocator.Temp))\n            {\n                if (!bay.Emit(origin, primitives, nextProfiles))\n                    throw new InvalidOperationException("Arch parameters did not emit.");\n                RasterResult result = PrimitiveRasteriser.Rasterise(\n                    primitives.AsArray(), origin, origin + bay.Metadata.Footprint,\n                    nextStorage.Reads, nextStorage.Mutations);\n                if (result.BudgetExceeded)\n                    throw new InvalidOperationException("Arch exceeded the feature budget.");\n            }\n\n            var brush = new VoxelBrush(\n                nextStorage.Reads, nextStorage.Mutations,\n                nextStorage.MaterialAuthoring, 2_000_000);\n            MasonryWeathering.CoatExposedSurfaces(ref brush, origin - 2,\n                bay.Metadata.Footprint + 4, Coatings.Moss,\n                0xA341u + (uint)_seedOffset,\n                (byte)_mossCoverage, dripPasses: 0);\n'''
          new = '''            StructuresComposition.AuthorArchBay(\n                nextStorage,\n                _clearSpan,\n                _pierHeight,\n                _ringThickness,\n                _depth,\n                _voussoirs,\n                _shoulder,\n                _topMargin,\n                _faceRecess,\n                _plinthHeight,\n                _impostHeight,\n                _damage,\n                _damageScale,\n                0xA341u + (uint)_seedOffset,\n                _jointQ4,\n                _bevelQ4,\n                _projectionQ4,\n                _faceDepthQ4,\n                StoneMaterial,\n                SurfaceStyles.MasonryJoint,\n                Coatings.Moss,\n                (byte)_mossCoverage,\n                2_000_000,\n                out IProfileBlockReadSource nextProfiles,\n                out int bayWidth,\n                out int bayHeight);\n'''
          if old not in s:
              raise SystemExit('Missing ArchLookdev concrete authoring block anchor')
          s = s.replace(old, new, 1)
          s = s.replace('            _lastBayWidth = bay.Width;\n            _lastBayHeight = bay.Height;\n            if (!_cameraInitialized) FrameCamera(bay.Width, bay.Height);\n',
                        '            _lastBayWidth = bayWidth;\n            _lastBayHeight = bayHeight;\n            if (!_cameraInitialized) FrameCamera(bayWidth, bayHeight);\n', 1)

          forbidden = [
              'using VoxelEngine.Structures.Runtime;',
              'ProfileBlockStore',
              'ArchFeatureDefinition',
              'ArchBayFeatureDefinition',
              'ArchRuinDamage',
              'PrimitiveRasteriser',
              'VoxelBrush',
              'MasonryWeathering',
              'NativeList<Primitive>',
          ]
          bad = [token for token in forbidden if token in s]
          if bad:
              raise SystemExit('ArchLookdev retains concrete Structures.Runtime concepts: ' + ', '.join(bad))
          required = [
              'IProfileBlockReadSource _profileBlocks',
              'StructuresComposition.AuthorArchBay(',
              'out IProfileBlockReadSource nextProfiles',
              'out int bayWidth',
              'out int bayHeight',
          ]
          missing = [token for token in required if token not in s]
          if missing:
              raise SystemExit('ArchLookdev Structures boundary incomplete: ' + ', '.join(missing))
          p.write_text(s)
          PY

          ! grep -q 'using VoxelEngine.Structures.Runtime;' Assets/Scenes/Showcase/ArchLookdev.cs
          grep -q 'StructuresComposition.AuthorArchBay' Assets/Scenes/Showcase/ArchLookdev.cs
          grep -q 'ArchBayAuthoringPipeline.Author' Assets/VoxelEngine/Composition/StructuresComposition.cs
          grep -q 'class ArchBayAuthoringPipeline' Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ArchLookdev.cs \
                  Assets/VoxelEngine/Composition/StructuresComposition.cs \
                  Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs \
                  Assets/VoxelEngine/Structures/Runtime/ArchBayAuthoringPipeline.cs.meta
          git diff --cached --check
          git commit -m 'refactor(showcase): hide arch authoring behind composition'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
