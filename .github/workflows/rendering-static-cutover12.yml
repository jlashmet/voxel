name: Rendering Cutover 12 static acceptance
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-static-cutover12.yml]
permissions:
  contents: read
jobs:
  static-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5e0b646102a50305424850a0508d190bae3e44d
          fetch-depth: 1
      - name: Verify Rendering physical, namespace and dependency cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('Assets/VoxelEngine/Rendering')
          api = root / 'Api' / 'VoxelEngine.Rendering.Api.asmdef'
          runtime = root / 'Runtime' / 'VoxelEngine.Rendering.Runtime.asmdef'
          old = root / 'VoxelEngine.Rendering.asmdef'
          if old.exists():
              raise SystemExit(f'legacy broad Rendering asmdef remains: {old}')
          if not api.is_file() or not runtime.is_file():
              raise SystemExit('Rendering Api/Runtime asmdefs are not both present')

          allowed_root = {'Api', 'Runtime', 'Api.meta', 'Runtime.meta'}
          unexpected = sorted(p.name for p in root.iterdir() if p.name not in allowed_root)
          if unexpected:
              raise SystemExit('unexpected legacy Rendering-root entries: ' + ', '.join(unexpected))

          api_json = json.loads(api.read_text())
          runtime_json = json.loads(runtime.read_text())
          if api_json.get('name') != 'VoxelEngine.Rendering.Api':
              raise SystemExit('Rendering.Api asmdef has wrong assembly name')
          if runtime_json.get('name') != 'VoxelEngine.Rendering.Runtime':
              raise SystemExit('Rendering.Runtime asmdef has wrong assembly name')
          if api_json.get('references', []):
              raise SystemExit('Rendering.Api is intentionally empty and must not gain dependencies')

          refs = set(runtime_json.get('references', []))
          required = {'VoxelEngine.Storage.Api', 'VoxelEngine.Tiering.Api', 'VoxelEngine.Vegetation.Api'}
          if not required.issubset(refs):
              raise SystemExit('Rendering.Runtime is missing required Api refs: ' + ', '.join(sorted(required - refs)))
          forbidden_prefixes = (
              'VoxelEngine.Storage.Runtime', 'VoxelEngine.Vegetation.Runtime',
              'VoxelEngine.Terrain', 'VoxelEngine.Structures', 'VoxelEngine.Edits',
              'VoxelEngine.Net', 'VoxelEngine.Core'
          )
          bad_refs = sorted(r for r in refs if r.startswith(forbidden_prefixes))
          if bad_refs:
              raise SystemExit('Rendering.Runtime has forbidden engine refs: ' + ', '.join(bad_refs))
          bad_foreign_runtime = sorted(
              r for r in refs
              if r.startswith('VoxelEngine.') and r.endswith('.Runtime') and r != 'VoxelEngine.Rendering.Runtime'
          )
          if bad_foreign_runtime:
              raise SystemExit('Rendering.Runtime references foreign Runtime assemblies: ' + ', '.join(bad_foreign_runtime))

          runtime_root = root / 'Runtime'
          namespace_re = re.compile(r'^\s*namespace\s+(VoxelEngine\.Rendering(?:\.[A-Za-z0-9_]+)*)', re.M)
          stale_namespaces = []
          for p in runtime_root.rglob('*.cs'):
              text = p.read_text()
              for match in namespace_re.finditer(text):
                  ns = match.group(1)
                  if ns != 'VoxelEngine.Rendering.Runtime' and not ns.startswith('VoxelEngine.Rendering.Runtime.'):
                      stale_namespaces.append(f'{p}: {ns}')
          if stale_namespaces:
              raise SystemExit('stale Rendering runtime namespaces remain:\n' + '\n'.join(stale_namespaces))

          # Every other engine Runtime must remain presentation-independent. This mirrors the
          # repository architecture guard but gives Cutover 12 a dedicated acceptance record.
          reverse = []
          for asmdef in Path('Assets/VoxelEngine').rglob('*.asmdef'):
              data = json.loads(asmdef.read_text())
              name = data.get('name', '')
              if not name.endswith('.Runtime') or name == 'VoxelEngine.Rendering.Runtime':
                  continue
              if 'VoxelEngine.Rendering.Runtime' in data.get('references', []):
                  reverse.append(f'{name} ({asmdef})')
          if reverse:
              raise SystemExit('simulation/engine Runtime assemblies reference Rendering.Runtime:\n' + '\n'.join(reverse))

          # The slow visual artifact test must stay opt-in/manual during this architecture cutover.
          artifact_test = Path('Assets/Tests/PlayMode/ShowcaseGpuSurfaceTests.cs').read_text()
          if 'Explicit(' not in artifact_test:
              raise SystemExit('Showcase GPU/lookdev artifact test is no longer explicitly opt-in')

          print('Rendering Cutover 12 static acceptance passed')
          print('Runtime engine refs:', ', '.join(sorted(r for r in refs if r.startswith('VoxelEngine.'))))
          PY
