name: One-shot fix owned-core architecture test

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/one-shot-fix-owned-core-architecture-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Replace stale halo residency architecture assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs')
          text = path.read_text()
          old = '''        [Test]\n        public void GeometryResidencyIncludesTheSnapshotHalo()\n        {\n            string cache = ReadRenderingSource(\n                Path.Combine("SurfaceExtraction", "CpuTransvoxelChunkCache.cs"));\n            int start = cache.IndexOf("private bool AnyOverlappedRegionResident",\n                                      StringComparison.Ordinal);\n            int end = cache.IndexOf("internal bool TryEvictOneForArenaPressure", start,\n                                    StringComparison.Ordinal);\n            Assert.GreaterOrEqual(start, 0);\n            Assert.Greater(end, start);\n            string residency = cache.Substring(start, end - start);\n            StringAssert.Contains("int halo = Padding * SourceStep;", residency);\n            StringAssert.Contains("chunk * VoxelsPerAxis - halo", residency);\n            StringAssert.Contains("(chunk + 1) * VoxelsPerAxis + halo - 1", residency);\n        }\n'''
          new = '''        [Test]\n        public void GeometryResidencyRequiresOwnedCoreRegions()\n        {\n            string cache = ReadRenderingSource(\n                Path.Combine("SurfaceExtraction", "CpuTransvoxelChunkCache.cs"));\n            int start = cache.IndexOf("private bool AllOwnedCoreRegionsResident",\n                                      StringComparison.Ordinal);\n            int end = cache.IndexOf("internal bool TryEvictOneForArenaPressure", start,\n                                    StringComparison.Ordinal);\n            Assert.GreaterOrEqual(start, 0);\n            Assert.Greater(end, start);\n            string residency = cache.Substring(start, end - start);\n            StringAssert.Contains("int3 minVoxel = chunk * VoxelsPerAxis;", residency);\n            StringAssert.Contains("int3 maxVoxel = (chunk + 1) * VoxelsPerAxis - 1;", residency);\n            StringAssert.Contains(\n                "if (!source.IsRegionResident(new int3(x, y, z))) return false;", residency);\n            StringAssert.DoesNotContain("int halo = Padding * SourceStep;", residency);\n        }\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale residency test block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Update geometry residency architecture guard'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
