name: BrickRef publication inventory

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-brickref-publication-inventory.yml]

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
      - name: Find production BrickRef writes and commits
        shell: bash
        run: |
          echo '=== BrickRefs writes ==='
          grep -R --line-number --include='*.cs' 'BrickRefs\[.*\][[:space:]]*=' Assets/VoxelEngine Packages || true
          echo '=== CommitRegion calls ==='
          grep -R --line-number --include='*.cs' 'CommitRegion' Assets/VoxelEngine Packages || true
