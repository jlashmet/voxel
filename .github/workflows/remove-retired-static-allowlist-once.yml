name: Remove retired static allowlist once

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths:
      - ".github/workflows/remove-retired-static-allowlist-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Remove retired workflow from permanent C# allowlist
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-stable
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs')
          text = path.read_text()
          line = '                ".github/workflows/final-architecture-static.yml",\n'
          if line in text:
              text = text.replace(line, '', 1)
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Tests/EditMode/ArchitectureBoundaryGuardTests.cs
          if git diff --cached --quiet; then
            echo "C# allowlist already reconciled"
            exit 0
          fi
          git commit -m "test(architecture): drop retired static allowlist path"
          git push origin HEAD:refactor/system-boundaries-finalization-stable
