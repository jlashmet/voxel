name: Mark master CI bake plan

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/mark-master-ci-bake-plan.yml

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 1
      - name: Update plan and retire transport
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/mark-master-ci-bake-plan.py
          git rm .github/scripts/mark-master-ci-bake-plan.py .github/workflows/mark-master-ci-bake-plan.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .claude/plans/voxel-showcase-rendering-repair-v2.md
          git commit -m "docs: mark master CI bake prerequisite"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
