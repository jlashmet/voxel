name: Bounded water maintenance one-shot patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-water-maintenance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_water_maintenance_patch.py
      - name: Static guards
        run: |
          ! grep -q 'foreach (int3 candidate in _dirty)' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          ! grep -q 'private readonly List<int3> _buildBricks' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          ! grep -q 'private void DropNoLongerResident' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          ! grep -q 'List<int3> gone' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs
          grep -q 'WaterMaintenanceAndBuildAdmissionAreIncremental' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit renderer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuWaterSurfaceChunkCache.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs \
                  docs/ASYNC_GEOMETRY_PIPELINE.md
          git commit -m 'Bound water build selection and maintenance'
          git push origin HEAD:refactor/async-geometry-pipeline
