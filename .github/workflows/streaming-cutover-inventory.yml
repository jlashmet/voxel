name: Streaming cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== Streaming declarations/usings ==='
          for f in Assets/VoxelEngine/Streaming/*.cs; do
            echo "--- $f"
            grep -nE '^using |^namespace |^\s*(public|internal) (static )?(class|struct|enum|interface)|^\s*public static |^\s*public [A-Za-z].*\(' "$f" || true
          done
          echo '=== Streaming type consumers ==='
          grep -RInE '\b(MipRefinement|Prefetch|RegionLoader|ResidencyManager)\b' Assets Packages --include='*.cs' | grep -vE 'Assets/VoxelEngine/Streaming/(MipRefinement|Prefetch|RegionLoader|ResidencyManager)\.cs' | sort || true
          echo '=== Streaming namespace imports ==='
          grep -RInE 'using VoxelEngine\.Streaming;|VoxelEngine\.Streaming\.' Assets Packages --include='*.cs' | grep -v '^Assets/VoxelEngine/Streaming/' | sort || true
          echo '=== Streaming asmdef consumers ==='
          grep -RIn '"VoxelEngine.Streaming"' Assets Packages --include='*.asmdef' | sort || true
          echo '=== Streaming physical/foreign dependencies ==='
          grep -RInE 'VoxelEngine\.(Core|Net|Terrain|Structures|Storage|Tiering)|\b(BrickPool|BrickRef|RegionTable|TerrainGenerator|FeatureGeneration|MipBuilder)\b' Assets/VoxelEngine/Streaming --include='*.cs' --include='*.asmdef' | sort || true
          echo '=== Existing streaming-related interfaces/requests/state ==='
          grep -RInE '\b(IRegionStreaming|RegionLoadRequest|RegionResidencyRequest|RegionResidencyState|RegionLoadPriority)\b' Assets Packages --include='*.cs' | sort || true
          echo '=== Streaming tests ==='
          find Assets/Tests -type f -name '*.cs' | grep -Ei 'stream|prefetch|residen|refin|regionload' | sort || true
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git rm .github/workflows/streaming-cutover-inventory.yml
          git commit -m 'Remove temporary Streaming inventory workflow'
          git push origin HEAD:${{ github.ref_name }}
