name: Tests (PR — affected only)

# A pull request runs the tests its changes can affect. Merges to master run
# everything (see tests-master.yml), so selection is a latency optimisation and
# never the only thing that ever runs.
#
# Selection is computed from the .asmdef reference graph, not from file paths.
# tools/select-tests.py walks the graph and falls back to running everything
# whenever a changed file is outside it.
#
# Selected EditMode and normal PlayMode suites share one Unity editor process.
# VoxelEngine.Tests.PlayMode remains split into fresh processes because that suite
# has demonstrated retained native scene/rendering memory across repeated loads.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-pr-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          # The selector diffs against the merge base, so it needs real history.
          fetch-depth: 0

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Select affected test assemblies
        id: select
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true

          tools/select-tests.py --base "$BASE" --format summary | tee selection.txt

          EDIT_ARGS="$(tools/select-tests.py --base "$BASE" --format unity-args --platform EditMode)"
          PLAY_ARGS="$(tools/select-tests.py --base "$BASE" --format unity-args --platform PlayMode)"
          EDIT_NAMES="${EDIT_ARGS#-assemblyNames }"
          PLAY_NAMES="${PLAY_ARGS#-assemblyNames }"

          heavy=false
          NORMAL_PLAY_NAMES=""
          if [[ -n "$PLAY_NAMES" ]]; then
            IFS=';' read -ra play_assemblies <<< "$PLAY_NAMES"
            for asm in "${play_assemblies[@]}"; do
              [[ -z "$asm" ]] && continue
              if [[ "$asm" == "VoxelEngine.Tests.PlayMode" ]]; then
                heavy=true
              elif [[ -z "$NORMAL_PLAY_NAMES" ]]; then
                NORMAL_PLAY_NAMES="$asm"
              else
                NORMAL_PLAY_NAMES="$NORMAL_PLAY_NAMES;$asm"
              fi
            done
          fi

          {
            echo "editmode_names=$EDIT_NAMES"
            echo "playmode_names=$NORMAL_PLAY_NAMES"
            echo "heavy_playmode=$heavy"
          } >> "$GITHUB_OUTPUT"

      - name: Affected tests in one Unity editor
        if: steps.select.outputs.editmode_names != '' || steps.select.outputs.playmode_names != '' || steps.select.outputs.heavy_playmode == 'true'
        shell: bash
        env:
          VOXEL_CI_EDITMODE_ASSEMBLIES: ${{ steps.select.outputs.editmode_names }}
          VOXEL_CI_PLAYMODE_ASSEMBLIES: ${{ steps.select.outputs.playmode_names }}
          VOXEL_CI_RESULTS_ROOT: ${{ github.workspace }}/Artifacts/PrTests
          VOXEL_CI_BAKE_SHOWCASE: ${{ steps.select.outputs.heavy_playmode }}
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          mkdir -p "$ROOT"
          status=0

          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=40 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelCiPersistentTestRunner.Run \
            -logFile "$ROOT/persistent.log" || status=$?

          # Preserve diagnostics when the guarded launcher fails before the requested
          # log file opens, just like the previous EditMode-only step did.
          if [[ ! -s "$ROOT/persistent.log" && -s "$HOME/Library/Logs/Unity/Editor.log" ]]; then
            cp "$HOME/Library/Logs/Unity/Editor.log" "$ROOT/persistent-global.log"
          fi
          if [[ -s "${TMPDIR:-/tmp}/unity-run-status" ]]; then
            cp "${TMPDIR:-/tmp}/unity-run-status" "$ROOT/unity-run-status.txt"
          fi

          if (( status != 0 )); then
            exit "$status"
          fi

          test -s "$ROOT/persistent-summary.txt"
          grep -q '^status=passed$' "$ROOT/persistent-summary.txt"

          if [[ "${{ steps.select.outputs.heavy_playmode }}" == "true" ]]; then
            test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"
          fi

      - name: VoxelEngine.Tests.PlayMode isolated shards
        if: steps.select.outputs.heavy_playmode == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          ASM="VoxelEngine.Tests.PlayMode"
          FILTERS=(
            '^VoxelEngine\.Tests\.PlayMode\.[A-F]'
            '^VoxelEngine\.Tests\.PlayMode\.[G-M]'
            '^VoxelEngine\.Tests\.PlayMode\.[N-S]'
            '!^VoxelEngine\.Tests\.PlayMode\.[A-S]'
          )
          LABELS=(a-f g-m n-s t-z-rest)
          status=0

          for i in "${!FILTERS[@]}"; do
            label="${LABELS[$i]}"
            echo "::group::PlayMode $ASM ($label)"
            UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
            UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
              -batchmode -job-worker-count 1 \
              -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
              -assemblyNames "$ASM" -testFilter "${FILTERS[$i]}" \
              -testResults "$ROOT/playmode-$ASM-$label.xml" \
              -logFile "$ROOT/playmode-$ASM-$label.log" || status=1
            echo "::endgroup::"
          done

          exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: |
            selection.txt
            Artifacts/PrTests/**
          if-no-files-found: ignore
