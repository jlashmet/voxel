name: Tests (PR — unit + full app)

# A behavior-changing pull request runs the EditMode/unit tests its changes can affect,
# then the canonical standalone Kentridge full-application test. The required `affected`
# job does not pass until both layers pass.
#
# Unit-test selection is computed from the .asmdef reference graph, not from file paths.
# tools/select-tests.py walks the graph and falls back to running every EditMode assembly
# whenever a changed file is outside it.
#
# General automatic PlayMode suites are intentionally disabled. The old suites were
# removed because they were stale. The standalone player-build path is the repository-wide
# high-level validation; ticket-specific PlayMode evidence remains available through
# targeted/manual validation when explicitly required.

on:
  pull_request:
    paths-ignore:
      - 'SceneIssues/pending/**'
      - 'SceneIssues/closed/**'

permissions:
  contents: read

concurrency:
  group: tests-pr-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          # The selector diffs against the merge base, so it needs real history.
          fetch-depth: 0

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Select affected EditMode test assemblies
        id: select
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true

          tools/select-tests.py --base "$BASE" --format summary | tee selection.txt

          EDIT_ARGS="$(tools/select-tests.py --base "$BASE" --format unity-args --platform EditMode)"
          EDIT_NAMES="${EDIT_ARGS#-assemblyNames }"
          echo "editmode_names=$EDIT_NAMES" >> "$GITHUB_OUTPUT"
          echo "Automatic PlayMode suites: disabled"

      - name: Affected EditMode tests in one Unity editor
        if: steps.select.outputs.editmode_names != ''
        shell: bash
        env:
          VOXEL_CI_EDITMODE_ASSEMBLIES: ${{ steps.select.outputs.editmode_names }}
          VOXEL_CI_PLAYMODE_ASSEMBLIES: ''
          VOXEL_CI_RESULTS_ROOT: ${{ github.workspace }}/Artifacts/PrTests
          VOXEL_CI_BAKE_SHOWCASE: 'false'
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          mkdir -p "$ROOT"
          status=0

          UNITY_MAX_RSS_MB=20480 UNITY_MAX_MINUTES=40 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelCiPersistentTestRunner.Run \
            -logFile "$ROOT/persistent.log" || status=$?

          # Preserve diagnostics when the guarded launcher fails before the requested
          # log file opens, just like the previous EditMode-only step did.
          if [[ ! -s "$ROOT/persistent.log" && -s "$HOME/Library/Logs/Unity/Editor.log" ]]; then
            cp "$HOME/Library/Logs/Unity/Editor.log" "$ROOT/persistent-global.log"
          fi
          if [[ -s "${TMPDIR:-/tmp}/unity-run-status" ]]; then
            cp "${TMPDIR:-/tmp}/unity-run-status" "$ROOT/unity-run-status.txt"
          fi

          if (( status != 0 )); then
            exit "$status"
          fi

          test -s "$ROOT/persistent-summary.txt"
          grep -q '^status=passed$' "$ROOT/persistent-summary.txt"

      - name: Canonical standalone full-application test
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.PlayMode.KentridgePlayableScenePlayTests.LaunchScene_NewGameCutscene_ReleasesControl_AndPlayerWalksOutIntoKentridge
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests/FullApp"
          mkdir -p "$ROOT"
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --test-filter "$TEST_FILTER"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: |
            selection.txt
            Artifacts/PrTests/**
          if-no-files-found: ignore
