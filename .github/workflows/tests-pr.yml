name: Tests (PR — affected only)

# A pull request runs the tests its changes can affect. Merges to master run
# everything (see tests-master.yml), so selection is a latency optimisation and
# never the only thing that ever runs.
#
# Selection is computed from the .asmdef reference graph, not from file paths.
# A one-line edit under Storage/Api touches only the Storage directory but
# twenty-one assemblies reference Storage.Api transitively; a path filter would
# test Storage alone and report green. tools/select-tests.py walks the graph and
# falls back to running everything whenever a changed file is outside it.

on:
  pull_request:

permissions:
  contents: read

# One self-hosted macOS runner, and two Unity editors on one machine is what
# tools/unity-run.sh exists to refuse. Serialise instead of queueing refusals.
concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          # The selector diffs against the merge base, so it needs real history.
          fetch-depth: 0

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Select affected test assemblies
        id: select
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true

          tools/select-tests.py --base "$BASE" --format summary | tee selection.txt

          EDIT="$(tools/select-tests.py --base "$BASE" --format unity-args --platform EditMode)"
          PLAY="$(tools/select-tests.py --base "$BASE" --format unity-args --platform PlayMode)"
          {
            echo "editmode=$EDIT"
            echo "playmode=$PLAY"
          } >> "$GITHUB_OUTPUT"

      - name: EditMode (affected)
        if: steps.select.outputs.editmode != ''
        shell: bash
        env:
          EDITMODE_ARGS: ${{ steps.select.outputs.editmode }}
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          mkdir -p "$ROOT"
          NAMES="${EDITMODE_ARGS#-assemblyNames }"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -assemblyNames "$NAMES" \
            -testResults "$ROOT/editmode.xml" -logFile "$ROOT/editmode.log" || status=$?

          # unity-run can fail before Unity opens the requested -logFile (for example a launcher
          # guard or an editor boot/import failure). Preserve the editor's global log and the
          # watchdog's last sample so a PR failure always has actionable diagnostics.
          if [[ ! -s "$ROOT/editmode.log" && -s "$HOME/Library/Logs/Unity/Editor.log" ]]; then
            cp "$HOME/Library/Logs/Unity/Editor.log" "$ROOT/editmode-global.log"
          fi
          if [[ -s "${TMPDIR:-/tmp}/unity-run-status" ]]; then
            cp "${TMPDIR:-/tmp}/unity-run-status" "$ROOT/unity-run-status.txt"
          fi

          if (( status != 0 )); then
            exit "$status"
          fi
          test -s "$ROOT/editmode.xml"

      # Diagnostic only: patch the disposable CI checkout to prove whether eager offscreen builds
      # and immediate re-dirty after eviction are the dominant cause of the renderer backlog.
      # Remove this step once the behavior is implemented in the renderer source itself.
      - name: Probe demand-driven surface residency
        if: contains(steps.select.outputs.playmode, 'VoxelEngine.Tests.PlayMode')
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/probe-renderer-demand.py
          git diff --check
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs

      # The Voxel Showcase deliberately has no Play-mode generation fallback. Its startup image is
      # a build/editor artifact, so a clean CI checkout must run the same bake step a developer or
      # release build runs before any suite opens VoxelShowcase.unity.
      - name: Bake Voxel Showcase startup world
        if: contains(steps.select.outputs.playmode, 'VoxelEngine.Tests.PlayMode')
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=20 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"

      # Renderer coverage is a correctness gate, not a broad-suite side effect. Run it before the
      # historical PlayMode shards so unrelated native-memory growth in another class range cannot
      # prevent us from learning whether the production LOD renderer has visible holes.
      - name: Renderer LOD coverage gate
        if: contains(steps.select.outputs.playmode, 'VoxelEngine.Tests.PlayMode')
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
            -assemblyNames "VoxelEngine.Tests.PlayMode" \
            -testFilter "^VoxelEngine\.Tests\.PlayMode\.RendererLodCoverageTests" \
            -testResults "$ROOT/playmode-renderer-lod-coverage.xml" \
            -logFile "$ROOT/playmode-renderer-lod-coverage.log"
          test -s "$ROOT/playmode-renderer-lod-coverage.xml"

      # PlayMode assemblies run one process each. VoxelEngine.Tests.PlayMode is large enough that
      # Unity retains native scene/rendering memory across its repeated scene loads and eventually
      # crosses the watchdog ceiling even though managed scene memory is released. Split that one
      # assembly into complementary name ranges so every test still runs, but each shard gets a
      # fresh Unity process and native allocator state.
      - name: PlayMode (affected)
        if: steps.select.outputs.playmode != ''
        shell: bash
        env:
          PLAYMODE_ARGS: ${{ steps.select.outputs.playmode }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/PrTests"
          mkdir -p "$ROOT"
          NAMES="${PLAYMODE_ARGS#-assemblyNames }"
          status=0
          IFS=';' read -ra ASSEMBLIES <<< "$NAMES"
          for asm in "${ASSEMBLIES[@]}"; do
            if [[ "$asm" == "VoxelEngine.Tests.PlayMode" ]]; then
              FILTERS=(
                '^VoxelEngine\.Tests\.PlayMode\.[A-F]'
                '^VoxelEngine\.Tests\.PlayMode\.[G-M]'
                '^VoxelEngine\.Tests\.PlayMode\.[N-S]'
                '!^VoxelEngine\.Tests\.PlayMode\.[A-S]'
              )
              LABELS=(a-f g-m n-s t-z-rest)
              for i in "${!FILTERS[@]}"; do
                label="${LABELS[$i]}"
                echo "::group::PlayMode $asm ($label)"
                UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
                UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
                  -batchmode -job-worker-count 1 \
                  -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
                  -assemblyNames "$asm" -testFilter "${FILTERS[$i]}" \
                  -testResults "$ROOT/playmode-$asm-$label.xml" \
                  -logFile "$ROOT/playmode-$asm-$label.log" || status=1
                echo "::endgroup::"
              done
            else
              echo "::group::PlayMode $asm"
              UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=30 \
              UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
                -batchmode -job-worker-count 1 \
                -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform PlayMode \
                -assemblyNames "$asm" \
                -testResults "$ROOT/playmode-$asm.xml" -logFile "$ROOT/playmode-$asm.log" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: |
            selection.txt
            Artifacts/PrTests/**
          if-no-files-found: ignore
