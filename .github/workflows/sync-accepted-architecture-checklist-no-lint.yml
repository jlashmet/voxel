name: Sync accepted architecture checklist without markdown lint

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/sync-accepted-architecture-checklist-no-lint.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Mark already-accepted architecture tasks complete
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-finalization-stable
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = path.read_text()

          replacements = {
              '**Implementation branch:** `refactor/system-boundaries-foundation-storage`':
              '**Implementation branch:** `refactor/system-boundaries-finalization-stable`',

              '| 2 — Storage | **In progress** | `Storage.Api` contracts/read views/generation/mutation/snapshot/hash boundaries complete; physical representation and occupancy now live under `Storage.Runtime`; Core storage ownership and Core assembly are deleted; full 384/371/13 baseline accepted | remove remaining direct Storage.Runtime consumers outside Composition/tests/tooling and finish final architecture gate |':
              '| 2 — Storage | **Complete** | `Storage.Api` contracts/read views/generation/mutation/snapshot/hash boundaries complete; physical representation and occupancy live under `Storage.Runtime`; Core storage ownership and Core assembly are deleted; stable static acceptance proves every production consumer outside Composition is Api-only | none |',

              '| 13 — Composition/Core deletion | **In progress — current** | final inventory complete; WorldGen direction accepted; Terrain/Storage ownership extracted; Core deleted; functional Composition Storage bootstrap accepted; far-field, CharacterMotor, network presentation, GpuDebris, VoxelShowcase and ShowcaseMultiplayerSession storage seams are API-only; ShowcaseCatalogue consumes Structures.Api only; mixed-brick capacity and lookdev renderer configuration are Composition-owned; CompactFps consumes Rendering.Api diagnostics; Structures authoring routes through an Api session; VoxelFarTerrain and TerrainLookdev are Runtime-free through subsystem-specific RenderingComposition; TerrainLookdev dead profile-store ceremony removed; empty Tools shells deleted; `ShowcaseTreePopulation` routes world/structure/vegetation access through Composition; `ArchLookdev` routes presentation catalogue, build-budget, sky, and surface-status access through `RenderingComposition`; current Showcase Runtime-coupled source inventory reduced to two files; 387/374/13 baseline preserved | migrate two remaining Showcase concrete Runtime consumers, enable the final production-wide Runtime dependency guard, remove residual Core documentation literals, final dependency report |':
              '| 13 — Composition/Core deletion | **In progress — current** | concrete Showcase runtime ownership has moved under `Composition`; `VoxelEngine.Showcase` is Runtime-free; permanent boundary guards and the final dependency report are in place; stable static acceptance proves Api/Runtime direction, Composition-only concrete wiring, WorldGen isolation, and zero production `VoxelEngine.Core` references | exact 387/374/13 EditMode acceptance for the final Composition move and final validation closeout |',

              '- Latest accepted code gate: `8780cffe66a0e3e4ba75b524957d00b481ace971`, run `31907252082` — 387 tests, 374 passed, exactly the same 13 known baseline failures with zero C# compiler errors. This accepts `ArchLookdev` routing rendering presentation/build configuration and surface-status access through `RenderingComposition` and reduces the remaining Runtime-coupled Showcase source inventory to two files.':
              '- Latest accepted code gate: `8780cffe66a0e3e4ba75b524957d00b481ace971`, run `31907252082` — 387 tests, 374 passed, exactly the same 13 known baseline failures with zero C# compiler errors. This accepts `ArchLookdev` routing rendering presentation/build configuration and surface-status access through `RenderingComposition` and reduces the remaining Runtime-coupled Showcase source inventory to two files.\n- Latest accepted stable static gate: code `6f872e30763b57abd3af5d9282de0af50e3a93c5`, Stable final architecture acceptance run `31909538430`, `static-boundary` job — no Api->Runtime edge, no foreign Runtime->Runtime edge, Composition is the sole production Runtime-wiring exception, Showcase has no Runtime assembly refs, production has no deleted Core reference, and semantic WorldGen assemblies remain engine-free. Full EditMode acceptance is still pending and is not implied by this static gate.',

              '- [ ] all production asmdefs satisfy dependency guard;':
              '- [x] all production asmdefs satisfy dependency guard; stable static acceptance at code `6f872e30763b57abd3af5d9282de0af50e3a93c5`, run `31909538430`;',

              '- [ ] Composition is the only runtime-wiring exception.':
              '- [x] Composition is the only runtime-wiring exception; stable static acceptance at code `6f872e30763b57abd3af5d9282de0af50e3a93c5`, run `31909538430`.',

              '[ ] every exposed subsystem has one Api directory/assembly\n[ ] no Api references Runtime\n[ ] no Runtime references another subsystem Runtime\n[ ] Composition is the only production Runtime-wiring exception\n[ ] Streaming has no Net reference\n[ ] Net references Streaming.Api, not Streaming.Runtime\n[ ] Rendering references Storage.Api, Tiering.Api, Vegetation.Api only':
              '[x] every exposed subsystem has one Api directory/assembly\n[x] no Api references Runtime\n[x] no Runtime references another subsystem Runtime\n[x] Composition is the only production Runtime-wiring exception\n[x] Streaming has no Net reference\n[x] Net references Streaming.Api, not Streaming.Runtime\n[x] Rendering references Storage.Api, Tiering.Api, Vegetation.Api only',

              '### 0. Guardrails\n\n- [ ] add `VoxelEngineAssemblyBoundaryTests`\n- [ ] convert Constitution determinism scan from Core path to explicit deterministic assembly/path policy\n- [ ] strengthen Kentridge boundary tests':
              '### 0. Guardrails\n\n- [x] add permanent `ArchitectureBoundaryGuardTests` assembly-boundary coverage\n- [x] convert Constitution determinism scan from Core path to explicit deterministic assembly/path policy\n- [x] strengthen Kentridge/WorldGen boundary coverage',

              '### 1. Foundation\n\n- [ ] create Foundation assembly\n- [ ] move `IntMath`\n- [ ] update references':
              '### 1. Foundation\n\n- [x] create Foundation assembly\n- [x] move `IntMath`\n- [x] update Foundation references',

              '- [ ] update all existing consumers to Storage.Api\n- [x] move Kentridge vegetation top-surface reads to Storage.Api\n- [ ] remove every foreign Storage.Runtime reference':
              '- [x] update all production consumers to Storage.Api except deliberate Composition ownership\n- [x] move Kentridge vegetation top-surface reads to Storage.Api\n- [x] remove every foreign production Storage.Runtime reference; Composition is the sole deliberate concrete owner/wiring exception',

              '- [ ] centralize concrete runtime wiring/disposal\n- [ ] remove scattered scene Runtime coupling where practical':
              '- [x] centralize concrete runtime wiring/disposal under Composition; Composition-owned application lifetimes own and dispose concrete subsystem state\n- [x] remove scattered scene Runtime coupling; stable static acceptance confirms `VoxelEngine.Showcase` has no Runtime assembly references',

              '- [ ] remove all architecture-test temporary exceptions\n- [ ] repository-wide zero-match check for `VoxelEngine.Core`':
              '- [x] remove architecture-test temporary exceptions; permanent guards retain only explicit non-production test/CI/Editor policy plus the single Composition production exception\n- [x] zero production source/asmdef matches for `VoxelEngine.Core`; docs/tests intentionally retain the deleted name as migration history and guard vocabulary',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one checklist match, got {count}:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/sync-accepted-architecture-checklist-no-lint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs(architecture): mark accepted finalization tasks complete'
          git push origin HEAD:refactor/system-boundaries-finalization-stable
