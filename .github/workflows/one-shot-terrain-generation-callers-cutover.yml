name: One-shot Terrain Generation Callers Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-terrain-generation-callers-cutover.yml'
      - 'Tools/Refactor/apply_terrain_generation_callers_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic Terrain caller cutover
        run: python Tools/Refactor/apply_terrain_generation_callers_cutover.py

      - name: Verify caller diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R -n --include='*.cs' -E 'TerrainGenerator\.Generate\([^\n]*(in pool|in _pool)' Assets/Tests/Parity Assets/VoxelEngine/CI/Editor || true
          grep -q 'StandaloneRegionGenerationStore' Assets/Tests/Parity/TerrainDeterminismTests.cs
          grep -q 'var generationA = new RegionGenerationStore' Assets/Tests/Parity/ReplayHarness.cs
          grep -q 'var generation = new RegionGenerationStore' Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs
          grep -q 'var generation = new RegionGenerationStore' Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs
          grep -q 'var generation = new RegionGenerationStore' Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.World.cs

      - name: Commit caller cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-terrain-generation-callers-cutover.yml
          git rm Tools/Refactor/apply_terrain_generation_callers_cutover.py
          git add Assets/Tests/Parity/GenerationOrderHarness.cs
          git add Assets/Tests/Parity/LossConvergenceTests.cs
          git add Assets/Tests/Parity/ReplayHarness.cs
          git add Assets/Tests/Parity/TenThousandEventParityTests.cs
          git add Assets/Tests/Parity/TerrainDeterminismTests.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.World.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.Core.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over terrain generation callers'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
