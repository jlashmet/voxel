name: Vegetation state facade publisher
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path('Assets/Scenes/Showcase'),
              Path('Assets/VoxelEngine/CI'),
              Path('Assets/Tests'),
          ]

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.cs'):
                  source = path.read_text()
                  if 'TreeWorldState.' not in source:
                      continue
                  source = source.replace('TreeWorldState.', 'TreeWorldRuntime.')
                  if 'TreeWorldRuntime.' in source and 'using VoxelEngine.Vegetation.Runtime;' not in source:
                      lines = source.splitlines(True)
                      insert = 0
                      for i, line in enumerate(lines):
                          if line.startswith('using '):
                              insert = i + 1
                      lines.insert(insert, 'using VoxelEngine.Vegetation.Runtime;\n')
                      source = ''.join(lines)
                  path.write_text(source)
          PY
          if grep -RIn 'TreeWorldState\.' Assets/Scenes/Showcase Assets/VoxelEngine/CI Assets/Tests --include='*.cs'; then
            echo 'External mutable TreeWorldState reference remains' >&2
            exit 1
          fi
          git rm .github/workflows/vegetation-state-facade-publisher.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase Assets/VoxelEngine/CI Assets/Tests
          git commit -m 'refactor: route Vegetation writers through Runtime facade'
          git push origin HEAD:${{ github.ref_name }}
