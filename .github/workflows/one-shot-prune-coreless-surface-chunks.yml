name: One-shot prune coreless surface chunks

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/one-shot-prune-coreless-surface-chunks.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require owned-core residency for surface-cache liveness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          workflow_path = Path('.github/workflows/one-shot-prune-coreless-surface-chunks.yml')
          text = source_path.read_text()

          old_call = 'if (WithinClipmapWindow(chunk) && AnyOverlappedRegionResident(source, chunk))'
          new_call = 'if (WithinClipmapWindow(chunk) && AllOwnedCoreRegionsResident(source, chunk))'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected exactly one old residency-prune call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          signature = '        private bool AnyOverlappedRegionResident(IRegionReadSource source, int3 chunk)'
          sig = text.find(signature)
          if sig < 0:
              raise SystemExit('old AnyOverlappedRegionResident helper not found')
          comment_start = text.rfind('        /// <summary>\n', 0, sig)
          if comment_start < 0:
              raise SystemExit('helper XML summary not found')
          brace_start = text.find('{', sig)
          if brace_start < 0:
              raise SystemExit('helper opening brace not found')
          depth = 0
          method_end = None
          for i in range(brace_start, len(text)):
              if text[i] == '{':
                  depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      method_end = i + 1
                      break
          if method_end is None:
              raise SystemExit('helper closing brace not found')

          replacement = '''        /// <summary>
          /// Whether every Storage region intersecting the chunk's unpadded owned core is
          /// currently resident. Exact extraction may optimistically treat an unavailable halo as
          /// empty, but a missing core region can never satisfy exact-snapshot completeness and
          /// must not remain active build demand merely because its halo touches resident Storage.
          /// A later residency publication re-runs surface discovery and readmits the chunk.
          /// </summary>
          private bool AllOwnedCoreRegionsResident(IRegionReadSource source, int3 chunk)
          {
              int3 minVoxel = chunk * VoxelsPerAxis;
              int3 maxVoxel = (chunk + 1) * VoxelsPerAxis - 1;
              int3 minRegion = new(FloorDiv(minVoxel.x, VoxelGrid.RegionVoxelEdge),
                                   FloorDiv(minVoxel.y, VoxelGrid.RegionVoxelEdge),
                                   FloorDiv(minVoxel.z, VoxelGrid.RegionVoxelEdge));
              int3 maxRegion = new(FloorDiv(maxVoxel.x, VoxelGrid.RegionVoxelEdge),
                                   FloorDiv(maxVoxel.y, VoxelGrid.RegionVoxelEdge),
                                   FloorDiv(maxVoxel.z, VoxelGrid.RegionVoxelEdge));

              for (int z = minRegion.z; z <= maxRegion.z; z++)
              for (int y = minRegion.y; y <= maxRegion.y; y++)
              for (int x = minRegion.x; x <= maxRegion.x; x++)
                  if (!source.IsRegionResident(new int3(x, y, z))) return false;
              return true;
          }'''

          text = text[:comment_start] + replacement + text[method_end:]
          if 'AnyOverlappedRegionResident' in text:
              raise SystemExit('old helper reference remains after patch')
          if text.count('AllOwnedCoreRegionsResident') != 2:
              raise SystemExit('new helper/call count is not exactly two')
          source_path.write_text(text)
          workflow_path.unlink()
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/one-shot-prune-coreless-surface-chunks.yml'
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prune coarse chunks without resident owned core'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
