name: Cutover 13 accept bd75d5f3

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-accept-bd75d5f3.yml

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd75d5f31519b0679a53ebe8baebd4523587dab2
      - name: Verify VoxelShowcase rendering boundary
        shell: bash
        run: |
          ! grep -q 'VoxelEngine.Rendering.Runtime' Assets/Scenes/Showcase/VoxelShowcase.cs
          ! grep -q 'VoxelRenderBridge\|VoxelWorldView' Assets/Scenes/Showcase/VoxelShowcase.cs
          grep -q 'RenderingComposition.ConfigureWorld' Assets/Scenes/Showcase/VoxelShowcase.cs
          grep -q 'RenderingComposition.SetFlashlight' Assets/Scenes/Showcase/VoxelShowcase.cs
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('Assets/Scenes/Showcase')
          rows=[]
          for p in sorted(root.glob('*.cs')):
              refs=sorted(set(re.findall(r'^using\s+(VoxelEngine\.[\w.]*Runtime(?:\.[\w.]+)?)\s*;',p.read_text(errors='ignore'),re.M)))
              if refs: rows.append((p.name,refs))
          print('RUNTIME_COUPLED_FILES='+str(len(rows)))
          for n,r in rows: print(n+': '+', '.join(r))
          if len(rows)!=5: raise SystemExit('unexpected Runtime-coupled file count')
          voxel=dict(rows).get('VoxelShowcase.cs',[])
          if voxel != ['VoxelEngine.Collision.Runtime','VoxelEngine.Vegetation.Runtime']:
              raise SystemExit('VoxelShowcase Runtime refs differ: '+repr(voxel))
          PY

  editmode:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bd75d5f31519b0679a53ebe8baebd4523587dab2
      - name: Run Unity EditMode suite
        shell: bash
        run: |
          mkdir -p Artifacts/Cutover13-bd75d5f3
          tools/unity-run.sh -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$GITHUB_WORKSPACE/Artifacts/Cutover13-bd75d5f3/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Cutover13-bd75d5f3/unity.log" || true
          test -s Artifacts/Cutover13-bd75d5f3/results.xml
      - name: Verify parity
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('Artifacts/Cutover13-bd75d5f3/results.xml').getroot()
          cases=root.findall('.//test-case')
          failed=sorted(c.get('fullname') or c.get('name') for c in cases if c.get('result')=='Failed')
          expected=sorted([
          'VoxelEngine.Tests.PlayMode.ChainCombatEnemyAIV8Tests.CurrentCascadeLabBootsWithEnemyAIStack',
          'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.BattleResetClearsSharedPlanHistoryAndGhostBackToStart',
          'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.PlannerBootsWithGhostBoardAndVisualLayer',
          'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.SharedPlanExecutionRequiresEveryLivingPlayerReady',
          'VoxelEngine.Tests.PlayMode.ChainCombatMechanicsV2Tests.CascadeLabControllerBootsFourPlayerBattle',
          'VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.CommittingApprovedPlanPreservesReadyForEnemyHandoff',
          'VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.EditingAnApprovedPlanRevokesEveryReadyApproval',
          'VoxelEngine.Tests.PlayMode.ChainCombatPrototypeTests.ControllerBootsPlayableBattlePresentation',
          'VoxelEngine.Tests.EditMode.KentridgeAnchorUndercroftTests.AnchorUndercroftsOccupyPubAndWarehouseSupportFacesWithoutAddingGameplayStructures',
          'VoxelEngine.Tests.EditMode.KentridgeGenerationTests.DistrictTerracesCreateNeighbourhoodScaleShelves',
          'VoxelEngine.Tests.EditMode.KentridgeInfrastructureTests.UrbanInfrastructureStaysSeparateFromStableGameplayStructures',
          'VoxelEngine.Tests.EditMode.KentridgeUrbanFabricTests.UrbanFabricCatalogueRealizesAllEightBlocksAsIndividualBuildings',
          'VoxelEngine.Tests.EditMode.SurfaceRingBandTests.RingsDoNotReachBeyondTheStreamingRadius'])
          passed=sum(c.get('result')=='Passed' for c in cases)
          print(f'TOTAL={len(cases)} PASSED={passed} FAILED={len(failed)}')
          if (len(cases),passed,len(failed))!=(387,374,13): raise SystemExit('unexpected counts')
          if failed!=expected: raise SystemExit('failure set changed')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover13-bd75d5f3-editmode
          path: Artifacts/Cutover13-bd75d5f3/
