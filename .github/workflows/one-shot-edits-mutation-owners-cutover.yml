name: One-shot Edits Mutation Owners Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-edits-mutation-owners-cutover.yml'
      - 'Tools/Refactor/apply_edits_mutation_owners_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic mutation-owner cutover
        run: python Tools/Refactor/apply_edits_mutation_owners_cutover.py

      - name: Verify owner diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'private RegionMutationStore _mutationStorage' Assets/VoxelEngine/Net/Server/ServerCommandProcessor.cs
          grep -q 'private RegionMutationStore _mutationStorage' Assets/VoxelEngine/Net/Client/ClientAuthoritativeEventQueue.cs
          grep -q 'IRegionMutationStore mutationStorage' Assets/VoxelEngine/Net/Server/AuthoritativeAlterationValidator.cs

      - name: Commit cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-edits-mutation-owners-cutover.yml
          git rm Tools/Refactor/apply_edits_mutation_owners_cutover.py
          git add Assets/VoxelEngine/Net/Server/ServerCommandProcessor.cs
          git add Assets/VoxelEngine/Net/Server/AuthoritativeAlterationValidator.cs
          git add Assets/VoxelEngine/Net/Client/ClientAuthoritativeEventQueue.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over edits mutation owners'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
