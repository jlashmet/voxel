name: Apply step4 guard diagnostics

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-step4-guard-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply anchored guard diagnostics and plan update
        run: python3 .github/scripts/apply-step4-guard-diagnostics.py
      - name: Validate patch
        run: |
          git diff --check
          git diff -- Assets/Tests/PlayMode/LodRenderingTests.cs .claude/plans/voxel-showcase-rendering-repair-v2.md
      - name: Commit diagnostics and retire transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Tests/PlayMode/LodRenderingTests.cs .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm .github/scripts/apply-step4-guard-diagnostics.py .github/workflows/apply-step4-guard-diagnostics.yml
          git commit -m 'test(rendering): expose step4 fallback guard diagnostics'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
