name: One-shot Transvoxel Caller Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-transvoxel-caller-cutover.yml'
      - 'Tools/Refactor/apply_transvoxel_caller_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic caller cutover
        run: python Tools/Refactor/apply_transvoxel_caller_cutover.py

      - name: Verify caller diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R -n --include='*.cs' 'Prepare(ref table, in pool' Assets
          grep -q 'new RegionReadSource(in table, in pool)' Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          grep -q 'smoothCache.Prepare(readSource' Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs
          grep -q 'cache.Prepare(readSource' Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.Core.cs
          grep -q 'cache.Prepare(readSource' Assets/VoxelEngine/CI/Editor/KentridgeCaptureImpl.cs
          grep -q 'cache.Prepare(readSource' Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs

      - name: Commit caller cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-transvoxel-caller-cutover.yml
          git rm Tools/Refactor/apply_transvoxel_caller_cutover.py
          git add Assets/Tests/EditMode/VoxelSurfaceArchitectureTests.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeRuntimeCapture.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCaptureV2.Core.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeCaptureImpl.cs
          git add Assets/VoxelEngine/CI/Editor/KentridgeUnifiedCapture.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over transvoxel callers'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
