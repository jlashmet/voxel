name: Showcase storage capacity Composition publisher
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-storage-capacity-composition.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Route Showcase capacity sizing through Composition
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('Assets/Scenes/Showcase/VoxelShowcase.cs'); s=p.read_text(); u='using VoxelEngine.Storage.Runtime;\\n'; old='            int tierBytes = DeviceTierBudget.GetForTier(DeviceTierBudget.Detect()).BrickPoolCapacity;\\n            int tierSlots = Mathf.Max(4096, tierBytes / VoxelDimensions.BytesPerMixedBrick);\\n            int capacity = Mathf.Clamp(m_BrickPoolCapacity, 4096, tierSlots);\\n'; new='            int tierBytes = DeviceTierBudget.GetForTier(DeviceTierBudget.Detect()).BrickPoolCapacity;\\n            int capacity = VoxelEngineBootstrap.ClampMixedBrickCapacityToBudget(\\n                m_BrickPoolCapacity, tierBytes);\\n'; assert s.count(u)==1; assert s.count(old)==1; s=s.replace(u,'using VoxelEngine.Composition;\\n',1).replace(old,new,1); assert 'VoxelDimensions.BytesPerMixedBrick' not in s; p.write_text(s)"
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/VoxelShowcase.cs
          git commit -m 'refactor(showcase): delegate storage capacity sizing to Composition'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
