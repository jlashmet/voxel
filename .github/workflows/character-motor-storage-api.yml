name: CharacterMotor surface query publisher
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/character-motor-storage-api.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Add Showcase surface query property
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('Assets/Scenes/Showcase/ShowcaseWorld.cs'); s=p.read_text(); marker='        public IRegionMutationStore MutationStorage\\n        {\\n'; prop='        public IVoxelSurfaceQuery SurfaceQuery\\n        {\\n            get\\n            {\\n                _readSource.Refresh(in _table, in _pool);\\n                return _readSource;\\n            }\\n        }\\n'; assert 'public IVoxelSurfaceQuery SurfaceQuery' not in s; assert s.count(marker)==1; p.write_text(s.replace(marker, prop+marker, 1))"
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git commit -m 'refactor(showcase): expose Storage API surface query'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
