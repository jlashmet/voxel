name: ShowcaseWorld partial publisher
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/character-motor-storage-api.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Make ShowcaseWorld partial
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('Assets/Scenes/Showcase/ShowcaseWorld.cs'); s=p.read_text(); old='    public sealed class ShowcaseWorld : IDisposable'; new='    public sealed partial class ShowcaseWorld : IDisposable'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git commit -m 'refactor(showcase): split application storage bridge partial'
          git fetch origin refactor/system-boundaries-foundation-storage
          git rebase origin/refactor/system-boundaries-foundation-storage
          git push origin HEAD:refactor/system-boundaries-foundation-storage
