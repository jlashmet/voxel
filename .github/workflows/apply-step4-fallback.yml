name: Apply step-4 false-empty fallback

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-step4-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source patch
        run: python .github/scripts/apply-step4-fallback.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/TransvoxelBuildWorkspace.cs
      - name: Commit production repair and remove transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-step4-fallback.yml .github/scripts/apply-step4-fallback.py
          git add -A
          git commit -m "fix(rendering): preserve false-empty step-4 features"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
