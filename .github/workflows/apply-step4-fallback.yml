name: Apply step4 false-empty repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-step4-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply measured renderer repair
        run: python .github/scripts/apply-step4-fallback.py
      - name: Verify patch
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Commit and push clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rendering): preserve false-empty step4 features"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
