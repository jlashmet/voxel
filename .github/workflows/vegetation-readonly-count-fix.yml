name: Vegetation readonly Count fix
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs')
          s = p.read_text()
          old = '(uint)parents.Length'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, '(uint)parents.Count'))
          PY
          git rm .github/workflows/vegetation-readonly-count-fix.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs
          git add -u .github/workflows
          git commit -m 'fix: finish readonly Vegetation parent topology migration'
          git push origin HEAD:${{ github.ref_name }}
