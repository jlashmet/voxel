name: Net PlayMode ownership cleanup
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-playmode-ownership-cleanup.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          python3 - <<'PY'
          from pathlib import Path

          late = Path('Assets/Tests/PlayMode/LateJoinTests.cs')
          text = late.read_text()
          old = '            SessionLifecycle.Create(12345u, ref _table, ref _pool);'
          new = '            SessionLifecycle.Create(12345u);'
          if text.count(old) != 1:
              raise SystemExit(f'LateJoin legacy session seam count changed: {text.count(old)}')
          late.write_text(text.replace(old, new, 1))

          occupied = Path('Assets/Tests/PlayMode/OccupiedVolumeTests.cs')
          occupied.write_text('''using NUnit.Framework;\nusing Unity.Mathematics;\nusing VoxelEngine.Net.Runtime.Server;\n\nnamespace VoxelEngine.Tests.PlayMode\n{\n    /// <summary>\n    /// SC-018: authoritative building must not intersect another player's collision volume.\n    ///\n    /// Player occupancy is session state owned by ServerPlayerRegistry; it is not inferred by\n    /// asking Net to inspect physical voxel storage. AuthoritativeAlterationValidator consumes\n    /// this predicate when validating constructive edits.\n    /// </summary>\n    public sealed class OccupiedVolumeTests\n    {\n        [Test]\n        [Category("SC_018")]\n        [Category("US3")]\n        public void PlacementAtPlayerPositionIsRejectedByPlayerVolumePredicate()\n        {\n            var players = new ServerPlayerRegistry();\n            Assert.That(players.TryRegisterAuthenticated(1, 7, new int3(5, 10, 5)), Is.True);\n\n            Assert.That(\n                players.IntersectsPlayerVolume(new int3(5, 10, 5), new int3(5, 10, 5)),\n                Is.True,\n                "A constructive edit at the player's authoritative position must intersect their volume.");\n        }\n\n        [Test]\n        [Category("SC_018")]\n        public void DistantPlacementDoesNotIntersectPlayerVolume()\n        {\n            var players = new ServerPlayerRegistry();\n            Assert.That(players.TryRegisterAuthenticated(1, 7, new int3(10, 5, 10)), Is.True);\n\n            Assert.That(\n                players.IntersectsPlayerVolume(new int3(40, 40, 40), new int3(42, 42, 42)),\n                Is.False);\n        }\n\n        [Test]\n        [Category("SC_018")]\n        public void ZeroHalfExtentsChecksOnlyAuthoritativePlayerVoxel()\n        {\n            var players = new ServerPlayerRegistry();\n            Assert.That(players.TryRegisterAuthenticated(1, 7, new int3(5, 10, 5)), Is.True);\n            Assert.That(players.SetCollisionHalfExtents(1, int3.zero), Is.True);\n\n            Assert.That(\n                players.IntersectsPlayerVolume(new int3(5, 10, 6), new int3(5, 10, 6)),\n                Is.False);\n            Assert.That(\n                players.IntersectsPlayerVolume(new int3(5, 10, 5), new int3(5, 10, 5)),\n                Is.True);\n        }\n    }\n}\n''')
          PY
          # These suites asserted the deleted Net-owned physical persistence/LogCompaction layer.
          # Semantic current-state snapshot capture/apply is now owned and tested by Storage.Api.
          git rm \
            Assets/Tests/PlayMode/PersistenceTests.cs \
            Assets/Tests/PlayMode/PersistenceTests.cs.meta \
            Assets/Tests/PlayMode/StorageGrowthTests.cs \
            Assets/Tests/PlayMode/StorageGrowthTests.cs.meta
          git diff --check
          ! grep -RInE 'LogCompaction|DiscardAllAlterations|SessionLifecycle\.Create\([^)]*,[[:space:]]*ref|Validation\.IsVolumeOccupied|\.ConfirmTick\([^,]+,[[:space:]]*ref' Assets/Tests/PlayMode --include='*.cs'
          git rm .github/workflows/net-playmode-ownership-cleanup.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/PlayMode
          git add -u .github/workflows
          git commit -m 'test(net): align PlayMode coverage with API ownership'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
