name: Patch async geometry mixed snapshot pin retry

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-mixed-pin-retry-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Reject optimistic snapshot when a mixed COW pin disappears
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          text = cache.read_text()
          text = text.replace('        private bool _snapshotPinUnavailable;\n', '', 1)
          old = '''                    _snapshotPinUnavailable = false;\n                    if (!source.TryPinWorldBlock(worldBlock, out PinnedVoxelReadBlock pinned))\n                    {\n                        _snapshotPinUnavailable = true;\n                        AccumulateSnapshotSlice(sliceStart, completed: false);\n                        return false;\n                    }'''
          new = '''                    if (!source.TryPinWorldBlock(worldBlock, out PinnedVoxelReadBlock pinned))\n                    {\n                        // Metadata said this block was mixed, but the coordinate can no longer\n                        // supply that immutable COW payload. The optimistic snapshot is no longer\n                        // coherent (for example, residency or a writer raced the metadata copy).\n                        // Do not spin forever on the same cursor: reject this generation and let\n                        // the existing bounded pin-release path retry from fresh metadata.\n                        ReleasePinnedRegionMetadataImmediate();\n                        _discardBuildAfterPinRelease = true;\n                        AccumulateSnapshotSlice(sliceStart, completed: false);\n                        return false;\n                    }'''
          if text.count(old) != 1:
              raise SystemExit('mixed pin failure block mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('            _snapshotPinUnavailable = false;\n', '', 1)
          if '_snapshotPinUnavailable' in text:
              raise SystemExit('snapshotPinUnavailable token still present')
          cache.write_text(text)

          tests = Path('Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs')
          text = tests.read_text()
          marker = '''        [Test]\n        public void WaterPublicationUsesFixedArenaAndBoundedSlices()'''
          test = '''        [Test]\n        public void MissingMixedSnapshotPinRejectsGenerationInsteadOfSpinning()\n        {\n            string cache = ReadRenderingSource(\n                Path.Combine("SurfaceExtraction", "CpuTransvoxelChunkCache.cs"));\n            StringAssert.Contains(\n                "if (!source.TryPinWorldBlock(worldBlock, out PinnedVoxelReadBlock pinned))", cache);\n            StringAssert.Contains("ReleasePinnedRegionMetadataImmediate();", cache);\n            StringAssert.Contains("_discardBuildAfterPinRelease = true;", cache);\n            StringAssert.DoesNotContain("_snapshotPinUnavailable", cache,\n                "A pin failure must reject/retry the snapshot, not park on an unused flag.");\n        }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('architecture test insertion point mismatch')
          tests.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Commit retry fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-mixed-pin-retry-fix.yml
          git add \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
            Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m "fix(rendering): retry vanished mixed snapshot pins"
          git push origin HEAD:refactor/async-geometry-pipeline
