name: Vegetation cutover publisher
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply Vegetation boundary cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vegetation_runtime_cutover.py
          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation Assets/VoxelEngine/Rendering Assets/Scenes/Showcase Assets/VoxelEngine/CI Assets/Tests Packages/com.mountingforce.worldgen/Runtime/Voxel
          git commit -m 'Split Vegetation Runtime from presentation reads'
          git push origin HEAD:${{ github.ref_name }}
