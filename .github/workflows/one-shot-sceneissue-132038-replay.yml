name: SceneIssue 132038 exact saved-camera replay

on:
  push:
    branches: [fixes/agent-5]
    paths:
      - .github/workflows/one-shot-sceneissue-132038-replay.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: sceneissue-132038-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes/agent-5
          clean: true
          fetch-depth: 0

      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/sceneissue-132038-replay',
              description: 'Exact saved-camera replay is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Bake Voxel Showcase startup world
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue132038Replay"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"

      - name: Wait for Unity between invocations
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Replay exact captured view
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue132038Replay/RealPlayer"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/showcase-player-capture.sh')
          text = path.read_text()
          old = '-screen-width 1600 -screen-height 900 -screen-fullscreen 0'
          new = '-screen-width 1928 -screen-height 836 -screen-fullscreen 0'
          if text.count(old) != 1:
              raise SystemExit(f'expected one capture-size target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$ROOT" \
            --scene Assets/Scenes/VoxelShowcase.unity \
            --scene-issue SceneIssues/open/20260826-132038-408-VoxelShowcase/issue.json \
            --run-seconds 60

      - name: Persist replay evidence and self-remove workflow
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue132038Replay/RealPlayer"
          ISSUE="SceneIssues/open/20260826-132038-408-VoxelShowcase"
          WORKFLOW=".github/workflows/one-shot-sceneissue-132038-replay.yml"
          final="$(find "$ROOT/Screenshots" -type f -name '*.png' -size +1k | sort | tail -1)"
          test -n "$final"
          cp "$final" "$ISSUE/verification-fixed-replay.png"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "fix_commit=506d4b37a42639bb1b9d48f1796e7794446d3c40"
            echo "camera_fixture=$ISSUE/issue.json captures[0].camera"
            echo "camera_position=(160.5474853515625,23.750001907348634,-1.9476444721221924)"
            echo "camera_rotation=(0.0712190493941307,-0.9039071798324585,0.38769620656967165,0.16604600846767426)"
            echo "field_of_view=70"
            echo "capture_resolution=1928x836"
            echo "selected_screenshot=$(basename "$final")"
            echo "reported_defect=far/right grass used a stretched second presentation path"
            echo
            echo "=== camera replay ==="
            grep 'SCENEISSUE camera' "$ROOT/player-run.log" || true
            echo
            echo "=== fps tail ==="
            tail -20 "$ROOT/fps.txt" 2>/dev/null || true
            echo
            echo "=== surface tail ==="
            grep 'SURFACE t=' "$ROOT/player-run.log" | tail -20 || true
            echo
            echo "=== rings tail ==="
            grep 'RINGS ' "$ROOT/player-run.log" | tail -20 || true
          } > "$ISSUE/verification-fixed-replay.txt"

          PREVIEW="$ROOT/verification-preview.png"
          sips -Z 720 "$final" --out "$PREVIEW" >/dev/null
          base64 < "$PREVIEW" > "$ISSUE/verification-fixed-preview.png.b64"

          cat "$ISSUE/verification-fixed-replay.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ISSUE/verification-fixed-replay.png" "$ISSUE/verification-fixed-replay.txt" "$ISSUE/verification-fixed-preview.png.b64"
          git rm "$WORKFLOW"
          git commit -m 'SceneIssue 132038: record exact saved-camera replay'
          git pull --rebase origin fixes/agent-5
          git push origin HEAD:fixes/agent-5
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: sceneissue-132038-replay-${{ github.run_id }}
          path: Artifacts/SceneIssue132038Replay/**
          if-no-files-found: error
          retention-days: 1

      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        env:
          EVIDENCE_SHA: ${{ steps.evidence.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'ci/sceneissue-132038-replay',
              description: `Replay evidence ${process.env.EVIDENCE_SHA.substring(0, 12)} captured`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failure status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'ci/sceneissue-132038-replay',
              description: 'Exact saved-camera replay failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
