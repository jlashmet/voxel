name: Inventory legacy Core literals

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/final-core-literal-inventory.yml]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Inventory exact legacy Core token
        shell: bash
        run: |
          set -euo pipefail
          token='VoxelEngine.'"Core"
          git grep -n -F "$token" -- ':!Library' ':!Temp' ':!Logs' > legacy-core-literals.txt || true
          cat legacy-core-literals.txt
          echo "count=$(wc -l < legacy-core-literals.txt | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-core-literal-inventory-${{ github.sha }}
          path: legacy-core-literals.txt
          if-no-files-found: error
