name: Update exact core halo checklist

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/update-exact-core-halo-plan.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Fast-forward to current branch
        run: |
          set -euo pipefail
          git fetch origin feature/voxel-showcase-rendering-repair-v2
          git reset --hard origin/feature/voxel-showcase-rendering-repair-v2
      - name: Update authoritative checklist
        run: python .github/scripts/update-exact-core-halo-plan.py
      - name: Validate plan diff
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Correct exact snapshot coverage so only regions intersecting the unpadded owned core are required' .claude/plans/voxel-showcase-rendering-repair-v2.md
          git diff -- .claude/plans/voxel-showcase-rendering-repair-v2.md
      - name: Commit checklist update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude/plans/voxel-showcase-rendering-repair-v2.md
          git commit -m 'docs: track exact core halo repair'
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
