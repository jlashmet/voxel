name: One-shot Extract Structures API

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-extract-structures-api.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Extract Structures API
        run: python .github/scripts/one_shot_extract_structures_api.py
      - name: Verify no temporary compatibility files
        run: |
          test ! -e Assets/VoxelEngine/Core/Features/CatalogueLoader.cs
          test -e Assets/VoxelEngine/Structures/Api/FeatureCatalogueBuilder.cs
          ! grep -R "class CatalogueLoader" -n Assets Packages --include='*.cs'
          git diff --stat
      - name: Commit and remove one-shot tooling
        run: |
          rm .github/scripts/one_shot_extract_structures_api.py
          rm .github/workflows/one-shot-extract-structures-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract structures api assembly"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
