name: ShowcaseWorld post Api inventory
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/showcase-world-post-api-inventory.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9e526548
          fetch-depth: 1
      - name: Report remaining physical storage calls
        shell: bash
        run: |
          set -euo pipefail
          f=Assets/Scenes/Showcase/ShowcaseWorld.cs
          echo '=== VoxelAccess remaining ==='
          grep -n 'VoxelAccess\.' "$f" || true
          echo 'VOXEL_ACCESS_COUNT='$(grep -c 'VoxelAccess\.' "$f" || true)
          echo '=== VoxelDimensions remaining ==='
          grep -n 'VoxelDimensions\.' "$f" || true
          echo 'VOXEL_DIMENSIONS_COUNT='$(grep -c 'VoxelDimensions\.' "$f" || true)
          echo '=== direct physical types ==='
          grep -n -E 'RegionTable|BrickPool|RegionReadSource|RegionMutationStore|RegionSnapshotMutationStore|RegionResidencyStore|VoxelChangeJournal|MaterialPalette|SurfaceCatalogue|CoatingCatalogue|MaterialAdjacencyCatalogue|OccupancyMask|MipBuilder' "$f" || true
