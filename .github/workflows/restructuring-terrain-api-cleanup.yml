name: Restructuring terrain API cleanup

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/restructuring-terrain-api-cleanup.yml

permissions:
  contents: write

jobs:
  migrate-terrain-callers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Migrate remaining TerrainSampler imports and asmdefs
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('.')
          old = 'using VoxelEngine.Core.Terrain;'
          new = 'using TerrainSampler = VoxelEngine.Terrain.Api.TerrainQuery;'
          changed_sources = []
          owning_asmdefs = set()

          def owning_asmdef(path: Path):
              directory = path.parent
              while directory != root.parent:
                  asmdefs = sorted(directory.glob('*.asmdef'))
                  if asmdefs:
                      if len(asmdefs) != 1:
                          raise SystemExit(f'ambiguous asmdef owner for {path}: {asmdefs}')
                      return asmdefs[0]
                  if directory == root:
                      break
                  directory = directory.parent
              raise SystemExit(f'no asmdef owner found for {path}')

          for path in sorted(root.rglob('*.cs')):
              text = path.read_text()
              if old not in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one legacy terrain import in {path}, found {count}')
              path.write_text(text.replace(old, new, 1))
              changed_sources.append(path)
              owning_asmdefs.add(owning_asmdef(path))

          if not changed_sources:
              raise SystemExit('no remaining legacy terrain imports found')

          for asmdef in sorted(owning_asmdefs):
              data = json.loads(asmdef.read_text())
              refs = data.setdefault('references', [])
              if 'VoxelEngine.Terrain.Api' not in refs:
                  refs.append('VoxelEngine.Terrain.Api')
                  asmdef.write_text(json.dumps(data, indent=2) + '\n')

          bridge = Path('Assets/VoxelEngine/Structures/CastleTerrainSamplerMigration.cs')
          if bridge.exists():
              bridge.unlink()
          bridge_meta = Path(str(bridge) + '.meta')
          if bridge_meta.exists():
              bridge_meta.unlink()

          leftovers = []
          for path in root.rglob('*.cs'):
              text = path.read_text()
              if old in text or 'VoxelEngine.Core.Terrain.TerrainSampler' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('legacy terrain sampler references remain: ' + ', '.join(leftovers))

          print('Migrated source files:')
          for path in changed_sources:
              print('  ', path)
          print('Owning asmdefs:')
          for path in sorted(owning_asmdefs):
              print('  ', path)

      - name: Commit terrain API cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: finish terrain query api migration"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
