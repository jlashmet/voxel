name: Rendering world-view consumer repair
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-worldview-consumer-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Migrate Showcase world-view initializers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('Assets/Scenes/Showcase/ArchLookdev.cs'),
              Path('Assets/Scenes/Showcase/VoxelShowcase.cs'),
              Path('Assets/Scenes/Showcase/TerrainLookdev.cs'),
          ]
          for path in paths:
              text = path.read_text()
              if text.count('SurfaceCatalogue =') != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy SurfaceCatalogue initializer')
              if text.count('CoatingCatalogue =') != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy CoatingCatalogue initializer')
              text = text.replace('SurfaceCatalogue =', 'SurfaceCatalogueView =', 1)
              text = text.replace('CoatingCatalogue =', 'CoatingCatalogueView =', 1)
              if 'SurfaceCatalogue =' in text or 'CoatingCatalogue =' in text:
                  raise SystemExit(f'{path}: legacy world-view catalogue initializer remains')
              path.write_text(text)
          PY
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Scenes/Showcase/ArchLookdev.cs Assets/Scenes/Showcase/VoxelShowcase.cs Assets/Scenes/Showcase/TerrainLookdev.cs
          git commit -m 'Migrate Showcase world views to Storage API catalogues'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
