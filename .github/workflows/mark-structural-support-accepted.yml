name: Record accepted StructuralIntegrity support slice
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          old="| 6 — StructuralIntegrity | **In progress — current** | final inventory found the Net-owned `StructuralGraph` placeholder had zero callers; dead graph removed with parity preserved | create Api/Runtime; move support/connectivity/collapse algorithms behind Storage.Api; expose only result/request values required by real consumers |"
          new="| 6 — StructuralIntegrity | **In progress — current** | dead Net `StructuralGraph` removed; StructuralIntegrity.Api/Runtime assemblies created; `SupportField` and `CollapseDetection` moved to Runtime with preserved Unity GUIDs and Storage.Api-only reads; parity preserved | move `Connectivity` behind Storage.Api; expose only result/request values required by real consumers; finish network-facing Api wiring if a real consumer exists |"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- Latest accepted code gate: `50df9bd2b0769905727dad63f167d5f604319b4c` — 382 tests, 369 passed, exactly the same 13 known baseline failures. Accepted first StructuralIntegrity slice: final caller inventory proved `Net/Server/StructuralGraph.cs` was unused; the unbounded placeholder graph was deleted rather than preserved in the new subsystem, with no behavioral regression."
          new="- Latest accepted code gate: `dbaa43648cb47008a55f27bbd692157e752cd8be` — 382 tests, 369 passed, exactly the same 13 known baseline failures. Accepted StructuralIntegrity support/collapse slice: StructuralIntegrity.Api/Runtime assemblies exist; `SupportField` and `CollapseDetection` are physically under Runtime with their Unity GUIDs preserved; both read through Storage.Api logical region views; the old Core copies are deleted; StructuralIntegrity.Runtime has no Net dependency."
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [ ] create Api/Runtime\n- [ ] move collapse/connectivity/support algorithms\n- [x] move StructuralGraph out of Net\n- [ ] expose structural result domain values"
          new="- [x] create Api/Runtime\n- [ ] move collapse/connectivity/support algorithms\n- [x] move StructuralGraph out of Net\n- [ ] expose structural result domain values"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [x] Dead StructuralGraph removal accepted by CI at `50df9bd2b0769905727dad63f167d5f604319b4c`: 382 total / 369 passed / exact same 13 known baseline failures.\n\n### Gate"
          new="- [x] Dead StructuralGraph removal accepted by CI at `50df9bd2b0769905727dad63f167d5f604319b4c`: 382 total / 369 passed / exact same 13 known baseline failures.\n- [x] StructuralIntegrity.Api/Runtime assemblies created; `SupportField` and `CollapseDetection` moved to Runtime with their original Unity GUIDs, rewritten to consume Storage.Api `IRegionReadSource`/`RegionReadView`, and old Core copies deleted.\n- [x] Structural support/collapse Runtime slice accepted by CI at `dbaa43648cb47008a55f27bbd692157e752cd8be`: 382 total / 369 passed / exact same 13 known baseline failures.\n- [ ] `Connectivity` still remains under `Core/Structure`; the combined algorithm-move task stays open until it is moved and gated.\n\n### Gate"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [ ] StructuralIntegrity.Runtime has no Net dependency;"
          new="- [x] StructuralIntegrity.Runtime has no Net dependency;"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/mark-structural-support-accepted.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted StructuralIntegrity support slice'
          git push origin HEAD:${{ github.ref_name }}
