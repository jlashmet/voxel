name: Edits Explosion Runtime publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Move ExplosionExpansion behind Storage.Api reads
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

          git mv Assets/VoxelEngine/Core/Edits/ExplosionExpansion.cs Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs
          git mv Assets/VoxelEngine/Core/Edits/ExplosionExpansion.cs.meta Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs.meta

          cat > Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs <<'CS'
          using Unity.Collections;
          using Unity.Mathematics;
          using VoxelEngine.Edits.Api;
          using VoxelEngine.Foundation;
          using VoxelEngine.Storage.Api;

          namespace VoxelEngine.Edits.Runtime
          {
              /// <summary>
              /// Deterministically expands explosion events into occupied logical block coordinates.
              /// Storage representation stays behind <see cref="IRegionReadSource"/>.
              /// </summary>
              public static class ExplosionExpansion
              {
                  public static NativeList<int3> Expand(IRegionReadSource storage, in AlterationEvent evt)
                  {
                      if (evt.kind != AlterationEvent.KindExplosion)
                          throw new System.ArgumentException("Expected explosion event kind.", nameof(evt));

                      var result = new NativeList<int3>(256, Allocator.Temp);
                      int radius = evt.Radius();
                      if (radius == 0) return result;
                      if (!storage.TryAcquireRegionContainingBlock(evt.origin, out RegionReadView region))
                          return result;

                      int3 localOrigin = WorldToBlockLocal(evt.origin, region.RegionCoord);
                      int radiusInt = radius;
                      int edge = VoxelReadGrid.BlocksPerRegionEdge;

                      for (int bx = -radiusInt; bx <= radiusInt; bx++)
                      for (int by = -radiusInt; by <= radiusInt; by++)
                      for (int bz = -radiusInt; bz <= radiusInt; bz++)
                      {
                          int distSq = bx * bx + by * by + bz * bz;
                          if (distSq > radiusInt * radiusInt) continue;

                          int rx = localOrigin.x + bx;
                          int ry = localOrigin.y + by;
                          int rz = localOrigin.z + bz;
                          if (rx < 0 || ry < 0 || rz < 0 || rx >= edge || ry >= edge || rz >= edge)
                              continue;

                          int3 worldBlock = evt.origin + new int3(bx, by, bz);
                          if (region.TryGetWorldBlock(worldBlock, out VoxelReadBlock block) && block.IsSolid)
                              result.Add(worldBlock);
                      }

                      return result;
                  }

                  public static NativeList<int3> ExpandChainReaction(
                      IRegionReadSource storage, in AlterationEvent evt)
                  {
                      var result = new NativeList<int3>(512, Allocator.Temp);
                      var rng = new DeterministicRandom(evt.seed);
                      var centers = new NativeList<int3>(4, Allocator.Temp);
                      centers.Add(evt.origin);

                      int secondaryCount = rng.NextRange(1, 3);
                      for (int i = 0; i < secondaryCount; i++)
                      {
                          int offset = evt.Radius() >> 2;
                          centers.Add(new int3(
                              evt.origin.x + rng.NextRange(-offset, offset),
                              evt.origin.y + rng.NextRange(-offset, offset),
                              evt.origin.z + rng.NextRange(-offset, offset)));
                      }

                      foreach (int3 center in centers)
                      {
                          using NativeList<int3> expanded = ExpandSingleCenter(storage, in evt, center);
                          for (int i = 0; i < expanded.Length; i++)
                              result.Add(expanded[i]);
                      }
                      centers.Dispose();
                      return result;
                  }

                  private static NativeList<int3> ExpandSingleCenter(
                      IRegionReadSource storage, in AlterationEvent evt, int3 center)
                  {
                      var result = new NativeList<int3>(128, Allocator.Temp);
                      int radius = evt.Radius();
                      if (radius == 0) return result;
                      if (!storage.TryAcquireRegionContainingBlock(center, out RegionReadView region))
                          return result;

                      int3 localOrigin = WorldToBlockLocal(center, region.RegionCoord);
                      int radiusInt = radius;
                      int edge = VoxelReadGrid.BlocksPerRegionEdge;

                      for (int bx = -radiusInt; bx <= radiusInt; bx++)
                      for (int by = -radiusInt; by <= radiusInt; by++)
                      {
                          int innerZ = radiusInt * radiusInt - bx * bx - by * by;
                          if (innerZ < 0) continue;
                          int maxBz = IntMath.Isqrt(innerZ);

                          for (int bz = -maxBz; bz <= maxBz; bz++)
                          {
                              int rx = localOrigin.x + bx;
                              int ry = localOrigin.y + by;
                              int rz = localOrigin.z + bz;
                              if (rx < 0 || ry < 0 || rz < 0 || rx >= edge || ry >= edge || rz >= edge)
                                  continue;

                              int3 worldBlock = center + new int3(bx, by, bz);
                              if (region.TryGetWorldBlock(worldBlock, out VoxelReadBlock block) && block.IsSolid)
                                  result.Add(worldBlock);
                          }
                      }
                      return result;
                  }

                  private static int3 WorldToBlockLocal(int3 worldBlock, int3 regionCoord)
                  {
                      int edge = VoxelReadGrid.BlocksPerRegionEdge;
                      return new int3(
                          (worldBlock.x - regionCoord.x * edge) & (edge - 1),
                          (worldBlock.y - regionCoord.y * edge) & (edge - 1),
                          (worldBlock.z - regionCoord.z * edge) & (edge - 1));
                  }
              }
          }
          CS

          python3 - <<'PY'
          from pathlib import Path

          p = Path('Assets/Tests/EditMode/ExpansionDeterminismTests.cs')
          text = p.read_text()
          replacements = {
              'ExplosionExpansion.Expand(in poolA, in tableA, in evt)': 'ExplosionExpansion.Expand(new RegionReadSource(in tableA, in poolA), in evt)',
              'ExplosionExpansion.Expand(in poolB, in tableB, in evt)': 'ExplosionExpansion.Expand(new RegionReadSource(in tableB, in poolB), in evt)',
              'ExplosionExpansion.Expand(in pool, in table, ExplosionEvent(1u))': 'ExplosionExpansion.Expand(new RegionReadSource(in table, in pool), ExplosionEvent(1u))',
              'ExplosionExpansion.Expand(in pool, in table, ExplosionEvent(99999u))': 'ExplosionExpansion.Expand(new RegionReadSource(in table, in pool), ExplosionEvent(99999u))',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing ExpansionDeterminism call: {old}')
              text = text.replace(old, new)
          p.write_text(text)

          p = Path('Assets/Tests/Parity/TenThousandEventParityTests.cs')
          text = p.read_text()
          replacements = {
              'ExplosionExpansion.Expand(in poolA, in tableA, in evt)': 'ExplosionExpansion.Expand(new RegionReadSource(in tableA, in poolA), in evt)',
              'ExplosionExpansion.Expand(in poolB, in tableB, in evt)': 'ExplosionExpansion.Expand(new RegionReadSource(in tableB, in poolB), in evt)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing parity call: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY

          git rm .github/workflows/edits-explosion-runtime.yml
          git diff --check
          test -f Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs
          test ! -e Assets/VoxelEngine/Core/Edits/ExplosionExpansion.cs
          if grep -nE 'VoxelEngine\.Core\.Storage|\b(RegionTable|BrickPool|BrickRef|VoxelAccess|VoxelDimensions|Region)\b' Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs; then
            echo 'ExplosionExpansion still leaks physical Storage' >&2
            exit 1
          fi
          git status --short
          git diff --stat
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs Assets/VoxelEngine/Edits/Runtime/ExplosionExpansion.cs.meta Assets/Tests/EditMode/ExpansionDeterminismTests.cs Assets/Tests/Parity/TenThousandEventParityTests.cs
          git commit -m 'Move explosion expansion behind Storage API reads'
          git push origin HEAD:${{ github.ref_name }}
