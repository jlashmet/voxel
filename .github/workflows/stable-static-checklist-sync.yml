name: Stable static checklist sync

on:
  push:
    branches: [refactor/system-boundaries-finalization-stable]
    paths: [.github/workflows/stable-static-checklist-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-stable
          fetch-depth: 0
      - name: Record accepted no-legacy static gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "stale checklist sync; current=$(git rev-parse HEAD) event=$GITHUB_SHA"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          plan = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s = plan.read_text()

          old = '[ ] no compatibility/legacy adapter was introduced to preserve the old architecture'
          new = '[x] no compatibility/legacy adapter was introduced to preserve the old architecture'
          if s.count(old) != 1:
              raise SystemExit(f'expected one unchecked compatibility item; found {s.count(old)}')
          s = s.replace(old, new, 1)

          # Correct the earlier documentation-only job-id typo everywhere in the plan.
          s = s.replace('static job `95072945213`', 'static job `95073061962`')

          old_focus = '**Current focus:** Cutover 13 Composition/Core deletion — final wiring and Core removal'
          new_focus = '**Current focus:** Cutover 13 — all static architecture tasks accepted; final Unity/EditMode parity pending'
          if old_focus in s:
              s = s.replace(old_focus, new_focus, 1)

          old_guard = '| 0 — Guardrails | **Complete** | asmdef boundary guard, split-safe determinism roots, WorldGen boundary guards | final no-Core assertions tighten automatically as final assemblies land |'
          new_guard = '| 0 — Guardrails | **Complete** | GUID-aware asmdef boundary guard, deterministic-root policy, WorldGen boundary guards, no-Core and no-legacy-adapter enforcement | none |'
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)

          old_cutover = '| 13 — Composition/Core deletion | **In progress — current** | all concrete Showcase runtime ownership is under `Composition`; `VoxelEngine.Showcase` is Runtime-free; the permanent dependency guard and final dependency report are in place; exact-head static acceptance proves Api/Runtime direction, Composition-only concrete wiring, WorldGen isolation, and zero production `VoxelEngine.Core` references | exact EditMode 387/374/13 acceptance for the final Composition move and final validation closeout |'
          new_cutover = '| 13 — Composition/Core deletion | **In progress — final Unity parity pending** | all concrete Showcase runtime ownership is under `Composition`; `VoxelEngine.Showcase` is Runtime-free; permanent GUID-aware dependency/Core/legacy-adapter guards and the final dependency report are in place; all static architecture closure is accepted | exact EditMode 387/374/13 acceptance for the final Composition move and final validation closeout |'
          if old_cutover in s:
              s = s.replace(old_cutover, new_cutover, 1)

          note = '- Latest accepted stable no-legacy static gate: source `68c872b805bcf49794355bc249af3bfcabaa1f75`, run `31910007277`, job `95073540254` — the final dependency scan rejects production `Legacy*` / `*Compatibility*` adapter source. All static architecture checklist items are accepted; final Unity/EditMode parity remains pending.\n'
          if note not in s:
              anchor = '- Prior integrated Cutover 13 gate:'
              idx = s.find(anchor)
              if idx < 0:
                  raise SystemExit('prior Cutover 13 gate anchor not found')
              s = s[:idx] + note + s[idx:]

          plan.write_text(s)

          report = Path('docs/ARCHITECTURE_DEPENDENCY_REPORT.md')
          r = report.read_text()
          r = r.replace('static job `95072945213`', 'static job `95073061962`')
          report.write_text(r)
          PY

          git rm .github/workflows/stable-static-checklist-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md docs/ARCHITECTURE_DEPENDENCY_REPORT.md
          git commit -m 'docs(architecture): mark final static guard accepted'
          git push origin HEAD:refactor/system-boundaries-finalization-stable
