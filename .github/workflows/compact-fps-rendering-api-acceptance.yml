name: Compact FPS Rendering API acceptance
# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6033f959967f6b6d38b8f73b071b5263a3adc425
          fetch-depth: 1
      - name: Verify CompactFps rendering API boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          overlay = Path('Assets/Scenes/Showcase/CompactFpsOverlay.cs').read_text()
          api = Path('Assets/VoxelEngine/Rendering/Api/SurfaceTimingDiagnostics.cs').read_text()
          bootstrap = Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs').read_text()
          comp = json.loads(Path('Assets/VoxelEngine/Composition/VoxelEngine.Composition.asmdef').read_text())
          showcase = json.loads(Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef').read_text())
          if 'VoxelEngine.Rendering.Runtime' in overlay or 'VoxelSurfaceMetrics' in overlay or 'VoxelRenderBridge' in overlay:
              raise SystemExit('CompactFpsOverlay still depends on renderer internals')
          if 'VoxelEngine.Rendering.Api' not in overlay or 'SurfaceTimingDiagnostics' not in overlay:
              raise SystemExit('CompactFpsOverlay does not consume Rendering.Api diagnostics')
          if 'public readonly struct SurfaceTimingDiagnostics' not in api:
              raise SystemExit('Rendering.Api diagnostics DTO missing')
          if 'GetSurfaceTimingDiagnostics' not in bootstrap or 'VoxelRenderBridge.SurfaceMetrics' not in bootstrap:
              raise SystemExit('Composition does not project concrete renderer metrics')
          if 'VoxelEngine.Rendering.Api' not in comp.get('references', []) or 'VoxelEngine.Rendering.Runtime' not in comp.get('references', []):
              raise SystemExit('Composition rendering dependencies are incomplete')
          if 'VoxelEngine.Rendering.Api' not in showcase.get('references', []):
              raise SystemExit('Showcase does not reference Rendering.Api')
          print('CompactFps Rendering API boundary accepted')
          PY
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6033f959967f6b6d38b8f73b071b5263a3adc425
          clean: false
          fetch-depth: 1
      - name: Reset pinned CompactFps candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 6033f959967f6b6d38b8f73b071b5263a3adc425
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/CompactFpsRenderingApi"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-fps-rendering-api-6033f959
          path: Artifacts/CompactFpsRenderingApi/
          if-no-files-found: warn
          retention-days: 14
