name: Publish ShowcaseWorld test API repair

on:
  push:
    paths:
      - .github/workflows/publish-showcase-world-test-api-repair.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Repair tests against public Storage API
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path

          # ShowcaseWorld: expose representation-independent allocator pressure for diagnostics.
          p = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          s = p.read_text()
          marker = '''        public IVoxelChangeSource Changes => _changes;\n\n        public uint Seed { get; }'''
          replacement = '''        public IVoxelChangeSource Changes => _changes;\n        public StoragePressure StoragePressure\n        {\n            get\n            {\n                _residencyStore.Refresh(in _table, in _pool);\n                return _residencyStore.Pressure;\n            }\n        }\n\n        public uint Seed { get; }'''
          if 'public StoragePressure StoragePressure' not in s:
              if marker not in s: raise SystemExit('ShowcaseWorld pressure insertion anchor missing')
              s = s.replace(marker, replacement, 1)
          p.write_text(s)

          # FallingVoxelPhysicsTests: full-cell authoring + simple reads/writes through Storage.Api.
          p = Path('Assets/Tests/PlayMode/FallingVoxelPhysicsTests.cs')
          s = p.read_text()
          old = '''                    VoxelAccess.SetCell(ref world.Table, ref world.Pool,\n                                        column + new int3(0, y, 0), in cell);'''
          new = '''                    SetCell(world, column + new int3(0, y, 0), in cell);'''
          if old in s: s = s.replace(old, new, 1)
          old_helpers = '''        private static void Set(ShowcaseWorld world, int3 voxel, byte material) =>\n            VoxelAccess.SetVoxel(ref world.Table, ref world.Pool, voxel, material);\n\n        private static byte Get(ShowcaseWorld world, int3 voxel) =>\n            VoxelAccess.GetVoxel(ref world.Table, in world.Pool, voxel);'''
          new_helpers = '''        private static bool SetCell(ShowcaseWorld world, int3 voxel, in VoxelCell cell)\n        {\n            IRegionMutationStore mutations = world.MutationStorage;\n            int3 worldBlock = voxel >> VoxelReadGrid.BlockEdgeLog2;\n            if (!mutations.TryBeginCellBlock(worldBlock, false, out VoxelBlockMutation mutation))\n                return false;\n\n            int3 inner = voxel & VoxelReadGrid.BlockEdgeMask;\n            int voxelIndex = inner.x\n                           | (inner.y << VoxelReadGrid.BlockEdgeLog2)\n                           | (inner.z << (VoxelReadGrid.BlockEdgeLog2 * 2));\n            bool changed = mutation.SetCell(voxelIndex, in cell);\n            return mutations.CompletePartialBlock(ref mutation, changed);\n        }\n\n        private static void Set(ShowcaseWorld world, int3 voxel, byte material)\n        {\n            var cell = new VoxelCell { BaseMaterialId = material };\n            SetCell(world, voxel, in cell);\n        }\n\n        private static byte Get(ShowcaseWorld world, int3 voxel) =>\n            world.SurfaceQuery.TryRead(voxel, out VoxelCell cell)\n                ? cell.BaseMaterialId\n                : VoxelGrid.MaterialEmpty;'''
          if old_helpers not in s: raise SystemExit('FallingVoxelPhysics helper anchor missing')
          s = s.replace(old_helpers, new_helpers, 1)
          s = s.replace('using VoxelEngine.Storage.Runtime;\n', '')
          s = s.replace('VoxelDimensions.MaterialEmpty', 'VoxelGrid.MaterialEmpty')
          if 'world.Table' in s or 'world.Pool' in s:
              raise SystemExit('FallingVoxelPhysics still uses Table/Pool')
          p.write_text(s)

          # ShowcaseSpawnTests: read through the public surface query.
          p = Path('Assets/Tests/PlayMode/ShowcaseSpawnTests.cs')
          s = p.read_text()
          s = s.replace('using VoxelEngine.Storage.Runtime;\n', 'using VoxelEngine.Storage.Api;\n')
          old = '''                byte material = VoxelAccess.GetVoxel(ref world.Table, in world.Pool,\n                                                     new int3(x, y, z));\n                Assert.AreEqual(VoxelDimensions.MaterialEmpty, material,'''
          new = '''                byte material = ReadMaterial(world, new int3(x, y, z));\n                Assert.AreEqual(VoxelGrid.MaterialEmpty, material,'''
          if old not in s: raise SystemExit('ShowcaseSpawn body anchor missing')
          s = s.replace(old, new, 1)
          old = '''            byte ground = VoxelAccess.GetVoxel(ref world.Table, in world.Pool,\n                                               new int3(centreX, surface, centreZ));\n            Assert.AreNotEqual(VoxelDimensions.MaterialEmpty, ground,'''
          new = '''            byte ground = ReadMaterial(world, new int3(centreX, surface, centreZ));\n            Assert.AreNotEqual(VoxelGrid.MaterialEmpty, ground,'''
          if old not in s: raise SystemExit('ShowcaseSpawn ground anchor missing')
          s = s.replace(old, new, 1)
          end = '''        }\n    }\n}'''
          helper = '''        }\n\n        private static byte ReadMaterial(ShowcaseWorld world, int3 voxel) =>\n            world.SurfaceQuery.TryRead(voxel, out VoxelCell cell)\n                ? cell.BaseMaterialId\n                : VoxelGrid.MaterialEmpty;\n    }\n}'''
          if 'private static byte ReadMaterial(' not in s:
              if not s.endswith(end): raise SystemExit('ShowcaseSpawn helper end anchor missing')
              s = s[:-len(end)] + helper
          if 'world.Table' in s or 'world.Pool' in s or 'VoxelAccess.' in s:
              raise SystemExit('ShowcaseSpawn still uses physical storage')
          p.write_text(s)

          # CastleAccessTests: central helper now reads through Storage.Api.
          p = Path('Assets/Tests/PlayMode/CastleAccessTests.cs')
          s = p.read_text()
          if 'using VoxelEngine.Storage.Api;\n' not in s:
              anchor = 'using VoxelEngine.Showcase;\n'
              if anchor not in s: raise SystemExit('CastleAccess using anchor missing')
              s = s.replace(anchor, 'using VoxelEngine.Storage.Api;\n' + anchor, 1)
          old = '''        private static byte Get(ShowcaseWorld world, int x, int y, int z) =>\n            VoxelAccess.GetVoxel(ref world.Table, in world.Pool, new int3(x, y, z));'''
          new = '''        private static byte Get(ShowcaseWorld world, int x, int y, int z) =>\n            world.SurfaceQuery.TryRead(new int3(x, y, z), out VoxelCell cell)\n                ? cell.BaseMaterialId\n                : VoxelGrid.MaterialEmpty;'''
          if old not in s: raise SystemExit('CastleAccess helper anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('using VoxelEngine.Storage.Runtime;\n', '')
          if 'world.Table' in s or 'world.Pool' in s or 'VoxelAccess.' in s:
              raise SystemExit('CastleAccess still uses physical storage')
          p.write_text(s)

          # CastleScreenshotTests: allocator assertions use representation-independent byte pressure.
          p = Path('Assets/Tests/PlayMode/CastleScreenshotTests.cs')
          s = p.read_text()
          old = '''            Debug.Log($"### CASTLE voxels={world.CastleVoxels:N0} bricks={world.Pool.AllocatedCount:N0}" +\n                      $" of {world.Pool.Capacity:N0}");'''
          new = '''            StoragePressure castlePressure = world.StoragePressure;\n            Debug.Log($"### CASTLE voxels={world.CastleVoxels:N0} storage={castlePressure.UsedBytes:N0}" +\n                      $" of {castlePressure.CapacityBytes:N0} bytes");'''
          if old not in s: raise SystemExit('CastleScreenshot log anchor missing')
          s = s.replace(old, new, 1)
          old = '''                int allocatedBeforeCapture = world.Pool.AllocatedCount;\n                Capture(cam, Path.Combine(OutputDirectory, view.name + ".png"));\n                if (cutaway)\n                {\n                    Assert.AreEqual(allocatedBeforeCapture, world.Pool.AllocatedCount,\n                        "Rendering a cutaway must not allocate, free, or carve authoritative bricks.");\n                }'''
          new = '''                long usedBytesBeforeCapture = world.StoragePressure.UsedBytes;\n                Capture(cam, Path.Combine(OutputDirectory, view.name + ".png"));\n                if (cutaway)\n                {\n                    Assert.AreEqual(usedBytesBeforeCapture, world.StoragePressure.UsedBytes,\n                        "Rendering a cutaway must not allocate, free, or carve authoritative storage.");\n                }'''
          if old not in s: raise SystemExit('CastleScreenshot allocation anchor missing')
          s = s.replace(old, new, 1)
          if 'using VoxelEngine.Storage.Api;\n' not in s:
              anchor = 'using VoxelEngine.Showcase;\n'
              if anchor not in s: raise SystemExit('CastleScreenshot using anchor missing')
              s = s.replace(anchor, 'using VoxelEngine.Storage.Api;\n' + anchor, 1)
          if 'world.Table' in s or 'world.Pool' in s:
              raise SystemExit('CastleScreenshot still uses Table/Pool')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Tests/PlayMode/FallingVoxelPhysicsTests.cs Assets/Tests/PlayMode/ShowcaseSpawnTests.cs Assets/Tests/PlayMode/CastleAccessTests.cs Assets/Tests/PlayMode/CastleScreenshotTests.cs
          git diff --cached --check
          git commit -m 'test(showcase): consume public storage capabilities'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
