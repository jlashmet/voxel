name: Terrain Lookdev Visual

on:
  workflow_dispatch:
  push:
    branches:
      - terrain

permissions:
  contents: write

concurrency:
  group: terrain-lookdev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain-lookdev:
    name: Render terrain lookdev
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          test -x "${UNITY_PATH}"
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build wired terrain scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/Terrain"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.ArchLookdevSceneBuilder.BuildTerrain \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Terrain/scene-build.log" \
            -quit
          test -s "$GITHUB_WORKSPACE/Assets/Scenes/TerrainLookdev.unity"

      - name: Persist generated scene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scenes/TerrainLookdev.unity Assets/Scenes/TerrainLookdev.unity.meta 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Generate wired terrain lookdev scene [skip ci]"
            git push
          fi

      - name: Render production-path terrain screenshot
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.Tests.PlayMode.TerrainLookdevScreenshotTests.CaptureTerrainLookdev" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/Terrain/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Terrain/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/Terrain/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.txt"

      - name: Materialize exact visual reference
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import re
          import struct
          import zlib

          source = pathlib.Path("Assets/Tests/PlayMode/TerrainLookdevScreenshotTests.cs").read_text()
          match = re.search(r'private const string ReferenceRgbBase64\s*=\s*(.*?);', source, re.S)
          if not match:
              raise SystemExit("ReferenceRgbBase64 not found")
          encoded = ''.join(re.findall(r'"([A-Za-z0-9+/=]+)"', match.group(1)))
          rgb = base64.b64decode(encoded)
          width, height = 32, 48
          expected = width * height * 3
          if len(rgb) != expected:
              raise SystemExit(f"reference byte count {len(rgb)} != {expected}")

          def chunk(kind, payload):
              return struct.pack(">I", len(payload)) + kind + payload + struct.pack(">I", zlib.crc32(kind + payload) & 0xffffffff)

          rows = b''.join(b'\x00' + rgb[y * width * 3:(y + 1) * width * 3] for y in range(height))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(rows, 9)) + chunk(b'IEND', b'')
          out = pathlib.Path("Artifacts/Terrain/terrain-reference.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(png)
          print(f"Wrote exact embedded reference to {out}")
          PY

      - name: Show terrain metadata
        if: always()
        shell: bash
        run: |
          test ! -f "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.txt" || cat "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.txt"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-similarity.txt" || cat "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-similarity.txt"

      - name: Upload terrain visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-${{ github.sha }}
          path: Artifacts/Terrain/
          if-no-files-found: warn
          retention-days: 14
