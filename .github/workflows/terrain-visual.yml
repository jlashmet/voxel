name: Terrain Lookdev Visual

# Automatic test runs are owned by tests-pr.yml (affected assemblies on a pull
# request) and tests-master.yml (the full suite on merge to master). Nothing else
# should trigger tests off a branch name or a path glob: which tests a change
# affects is a property of the .asmdef reference graph, not of where the work
# happens to live. Retained as manually dispatchable.
on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: terrain-lookdev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain-lookdev:
    name: Render terrain lookdev
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Materialize canonical full-resolution reference
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_DIR="$GITHUB_WORKSPACE/.github/reference/terrain-reference-full-q20.jpg.b64"
          REF="$GITHUB_WORKSPACE/.github/reference/terrain-reference-full.jpg"
          test -d "$PAYLOAD_DIR"
          cat "$PAYLOAD_DIR"/*.txt | tr -d '\n\r ' | base64 --decode > "$REF"
          test -s "$REF"
          WIDTH="$(sips -g pixelWidth "$REF" | awk '/pixelWidth:/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$REF" | awk '/pixelHeight:/ {print $2}')"
          echo "Canonical reference: ${WIDTH}x${HEIGHT}, $(wc -c < "$REF") bytes"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1536"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reference/terrain-reference-full.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Check in full-resolution terrain reference [skip ci]"
            git push
          fi

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          test -x "${UNITY_PATH}"
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build wired terrain scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/Terrain"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.CI.ArchLookdevSceneBuilder.BuildTerrain \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Terrain/scene-build.log" \
            -quit
          test -s "$GITHUB_WORKSPACE/Assets/Scenes/TerrainLookdev.unity"

      - name: Persist generated scene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scenes/TerrainLookdev.unity Assets/Scenes/TerrainLookdev.unity.meta 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Generate wired terrain lookdev scene [skip ci]"
            git push || echo "WARNING: generated-scene push raced another terrain update; continuing with local generated scene"
          fi

      - name: Render production-path terrain screenshot
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter "VoxelEngine.Tests.PlayMode.TerrainLookdevScreenshotTests.CaptureTerrainLookdev" \
            -testResults "$GITHUB_WORKSPACE/Artifacts/Terrain/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Terrain/unity.log"
          test -s "$GITHUB_WORKSPACE/Artifacts/Terrain/results.xml"
          test -s "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.png"
          test -s "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.txt"

      - name: Materialize visual references from canonical image
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_WORKSPACE/.github/reference/terrain-reference-full.jpg"
          OUT="$GITHUB_WORKSPACE/Artifacts/Terrain"
          test -s "$REF"
          cp "$REF" "$OUT/terrain-reference-full.jpg"
          sips -s format png -z 768 512 "$REF" --out "$OUT/terrain-reference-512.png" >/dev/null
          sips -s format png -z 192 128 "$REF" --out "$OUT/terrain-reference-128.png" >/dev/null
          sips -s format png -z 48 32 "$REF" --out "$OUT/terrain-reference.png" >/dev/null
          test -s "$OUT/terrain-reference-512.png"
          test -s "$OUT/terrain-reference-128.png"
          test -s "$OUT/terrain-reference.png"

      - name: Compute perceptual diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.png"
          REF512="$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-reference-512.png"
          REF128="$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-reference-128.png"
          REF32="$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-reference.png"
          if [[ -s "$ACTUAL" ]]; then
            if [[ -s "$REF512" ]]; then
              REF="$REF512"
            elif [[ -s "$REF128" ]]; then
              REF="$REF128"
            elif [[ -s "$REF32" ]]; then
              REF="$REF32"
            else
              exit 0
            fi
            python3 .github/scripts/terrain_metrics.py \
              "$ACTUAL" "$REF" \
              --json "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-metrics.json" \
              --text "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-metrics.txt"
            cat "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-metrics.txt"
          fi

      - name: Show terrain metadata
        if: always()
        shell: bash
        run: |
          test ! -f "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.txt" || cat "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain.txt"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-similarity.txt" || cat "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-similarity.txt"
          test ! -f "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-metrics.txt" || cat "$GITHUB_WORKSPACE/Artifacts/Terrain/terrain-metrics.txt"

      - name: Upload terrain visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-${{ github.sha }}
          path: Artifacts/Terrain/
          if-no-files-found: warn
          retention-days: 14
