name: Async geometry validation one-shot patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-validation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0

      - name: Patch upload observability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, found {n}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {n}')
              return out

          path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs')
          s = path.read_text()
          s = once(s,
              '        public readonly int RunningSolidJobs;\n        public readonly int SolidMeshesAwaitingUpload;\n        public readonly double LastSolidSnapshotMs;',
              '        public readonly int RunningSolidJobs;\n        public readonly int SolidMeshesAwaitingUpload;\n        public readonly long SolidPendingUploadBytes;\n        public readonly int SolidUploadBudgetBytes;\n        public readonly int LastFrameSolidUploadedBytes;\n        public readonly int LastFrameSolidUploadCompletions;\n        public readonly double LastSolidSnapshotMs;',
              'metric fields')
          s = once(s,
              '            RunningSolidJobs = solids.RunningJobCount;\n            SolidMeshesAwaitingUpload = solids.PendingUploadCount;\n            LastSolidSnapshotMs = solids.LastSnapshotMs;',
              '            RunningSolidJobs = solids.RunningJobCount;\n            SolidMeshesAwaitingUpload = solids.PendingUploadCount;\n            SolidPendingUploadBytes = solids.PendingUploadBytes;\n            SolidUploadBudgetBytes = int.MaxValue;\n            LastFrameSolidUploadedBytes = 0;\n            LastFrameSolidUploadCompletions = 0;\n            LastSolidSnapshotMs = solids.LastSnapshotMs;',
              'single-worker metrics')
          s = sub_once(s,
              r'(int visibleSolidChunks,\n\s*)(in VoxelTimingSummary schedulerPrepare,)',
              r'\1int solidUploadBudgetBytes,\n                                     int lastFrameSolidUploadedBytes,\n                                     int lastFrameSolidUploadCompletions,\n                                     \2',
              'aggregate signature')
          s = once(s,
              '            int known = 0, resident = 0, dirty = 0, missing = 0, running = 0, uploads = 0;\n            ulong completed = 0, stale = 0, uploadedBytes = water.UploadedGeometryBytes;',
              '            int known = 0, resident = 0, dirty = 0, missing = 0, running = 0, uploads = 0;\n            long pendingUploadBytes = 0;\n            ulong completed = 0, stale = 0, uploadedBytes = water.UploadedGeometryBytes;',
              'pending bytes local')
          s = once(s,
              '                running += worker.RunningJobCount;\n                uploads += worker.PendingUploadCount;\n                completed += worker.CompletedBuildCount;',
              '                running += worker.RunningJobCount;\n                uploads += worker.PendingUploadCount;\n                pendingUploadBytes += worker.PendingUploadBytes;\n                completed += worker.CompletedBuildCount;',
              'pending bytes sum')
          s = once(s,
              '            RunningSolidJobs = running;\n            SolidMeshesAwaitingUpload = uploads;\n            CompletedSolidBuilds = completed;',
              '            RunningSolidJobs = running;\n            SolidMeshesAwaitingUpload = uploads;\n            SolidPendingUploadBytes = pendingUploadBytes;\n            SolidUploadBudgetBytes = solidUploadBudgetBytes;\n            LastFrameSolidUploadedBytes = lastFrameSolidUploadedBytes;\n            LastFrameSolidUploadCompletions = lastFrameSolidUploadCompletions;\n            CompletedSolidBuilds = completed;',
              'aggregate assignments')
          s = sub_once(s,
              r'(_allWorkers, _water, _lastChangeRecords, _discoveredSurfaceBricks\.Count,\n\s*_visibleSolids\.Count, )(_prepareTiming\.Snapshot\(\),)',
              r'\1SolidUploadBudgetBytes, _lastFrameSolidUploadedBytes,\n            _lastFrameSolidUploadCompletions, \2',
              'metrics construction')
          path.write_text(s)

          path = Path('Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderBridge.cs')
          b = path.read_text()
          b = sub_once(b,
              r'\s*// Four asynchronous worker shards each receive this bounded admission/publication slice\.\n\s*// 0\.50 ms keeps worst-case render-thread orchestration near 2 ms while Burst topology\n\s*// proceeds off-thread; 0\.20 ms fell below useful post-job granularity on Apple silicon\.\n\s*public static double SolidBuildBudgetMs = 0\.50;\n\s*public static double WaterBuildBudgetMs = 0\.15;',
              '\n        // Renderer-wide admission/publication controls. These are shared across every\n        // LOD ring and worker; adding workers must never multiply the frame budget.\n        public static double SolidBuildBudgetMs = 0.50;\n        public static int SolidUploadBudgetBytes = 1024 * 1024;\n        public static int SolidUploadSliceBytes = 256 * 1024;\n        public static int SolidUploadWorkerBudget = 4;\n        public static double SolidUploadBudgetMs = 0.20;\n        public static double WaterBuildBudgetMs = 0.15;',
              'bridge controls')
          path.write_text(b)

          path = Path('Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs')
          p = path.read_text()
          p = once(p,
              '            _scheduler.SolidBuildBudgetMs = Math.Max(0.0, VoxelRenderBridge.SolidBuildBudgetMs);\n            _scheduler.WaterBuildBudgetMs = Math.Max(0.0, VoxelRenderBridge.WaterBuildBudgetMs);',
              '            _scheduler.SolidBuildBudgetMs = Math.Max(0.0, VoxelRenderBridge.SolidBuildBudgetMs);\n            _scheduler.SolidUploadBudgetBytes = Math.Max(0, VoxelRenderBridge.SolidUploadBudgetBytes);\n            _scheduler.SolidUploadSliceBytes = Math.Max(0, VoxelRenderBridge.SolidUploadSliceBytes);\n            _scheduler.SolidUploadWorkerBudget = Math.Max(0, VoxelRenderBridge.SolidUploadWorkerBudget);\n            _scheduler.SolidUploadBudgetMs = Math.Max(0.0, VoxelRenderBridge.SolidUploadBudgetMs);\n            _scheduler.WaterBuildBudgetMs = Math.Max(0.0, VoxelRenderBridge.WaterBuildBudgetMs);',
              'render-pass controls')
          path.write_text(p)
          PY

      - name: Static guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs').read_text()
          b = Path('Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderBridge.cs').read_text()
          p = Path('Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs').read_text()
          assert 'SolidPendingUploadBytes' in s
          assert 'SolidUploadBudgetBytes = solidUploadBudgetBytes;' in s
          assert '_lastFrameSolidUploadCompletions' in s
          assert 'public static int SolidUploadBudgetBytes = 1024 * 1024;' in b
          assert '_scheduler.SolidUploadBudgetBytes = Math.Max' in p
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderBridge.cs \
                  Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs
          git commit -m 'Expose renderer-wide geometry upload budgets'
          git push origin HEAD:refactor/async-geometry-pipeline
