name: Apply rendering admission repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-rendering-admission-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply ring admission repair
        run: python3 .github/scripts/apply_rendering_admission_patch.py
      - name: Verify patch
        run: git diff --check
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          git commit -m "fix(rendering): park out-of-band ring build work"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
