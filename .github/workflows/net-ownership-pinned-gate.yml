name: Net ownership pinned gate

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - ".github/workflows/net-ownership-pinned-gate.yml"

permissions:
  contents: read

jobs:
  unity-editmode:
    name: Pinned Net ownership EditMode gate
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Net ownership tree
        uses: actions/checkout@v4
        with:
          ref: ff0c574467fecc7b7f0e2d5d7c2385347add368a
          clean: false

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard ff0c574467fecc7b7f0e2d5d7c2385347add368a
          git clean -ffdx -e Library/

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "${UNITY_PATH}"
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run EditMode tests
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetOwnershipPinned"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml" || true
          exit $status

      - name: Upload pinned gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net-ownership-pinned-ff0c5744
          path: Artifacts/NetOwnershipPinned/
          if-no-files-found: warn
          retention-days: 14
