name: Publish Showcase streaming boundary cut
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-showcase-streaming-runtime.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Remove Showcase Streaming.Runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          import json
          from pathlib import Path

          world_path = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          world = world_path.read_text()

          replacements = [
              ('using VoxelEngine.Streaming.Runtime;\n', '', 1),
              ('using\n    /// <see cref="ResidencyManager"/> for the residency set and eviction policy.',
               'using\n    /// the world-local wanted set and Storage.Api residency mechanics for eviction.', 1),
              ('<see cref="ResidencyManager.LoadRadiusMetres_PC"/> (500 m)',
               'the shipping streaming load radius (500 m)', 1),
              ('var centre = ResidencyManager.PositionToRegion(cameraMetres);',
               'var centre = PositionToRegion(cameraMetres);', 2),
              ('if (_generated.Contains(rc)) { ResidencyManager.TouchRegion(rc); return; }',
               'if (_generated.Contains(rc)) return;', 1),
              ('            ResidencyManager.TouchRegion(coord);\n', '', 1),
              ('ResidencyManager.EvictWithoutWriteBack(rc, _residencyStore);',
               '_residencyStore.EvictRegion(rc);', 1),
          ]

          for old, new, expected in replacements:
              count = world.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {count}')
              world = world.replace(old, new)

          marker = '        // -- streaming -----------------------------------------------------------\n'
          if world.count(marker) != 1:
              raise SystemExit('Expected one streaming section marker')
          helper = '''        private static int3 PositionToRegion(float3 position)\n        {\n            return new int3(\n                (int)math.floor(position.x / RegionMetres),\n                (int)math.floor(position.y / RegionMetres),\n                (int)math.floor(position.z / RegionMetres));\n        }\n\n'''
          world = world.replace(marker, helper + marker, 1)
          world_path.write_text(world)

          asmdef_path = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          asmdef = json.loads(asmdef_path.read_text())
          refs = asmdef['references']
          if refs.count('VoxelEngine.Streaming.Runtime') != 1:
              raise SystemExit('Expected exactly one Streaming.Runtime asmdef reference')
          refs.remove('VoxelEngine.Streaming.Runtime')
          asmdef_path.write_text(json.dumps(asmdef, indent=2) + '\n')
          PY

          if grep -q 'VoxelEngine.Streaming.Runtime\|ResidencyManager' Assets/Scenes/Showcase/ShowcaseWorld.cs; then
            echo 'ShowcaseWorld still references Streaming.Runtime/ResidencyManager' >&2
            exit 1
          fi
          if grep -q 'VoxelEngine.Streaming.Runtime' Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef; then
            echo 'Showcase asmdef still references Streaming.Runtime' >&2
            exit 1
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef
          git commit -m 'refactor(showcase): remove Streaming runtime dependency'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
