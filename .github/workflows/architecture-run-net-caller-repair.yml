name: Architecture execute Net caller migration
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/architecture-run-net-caller-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          python3 .github/scripts/net-caller-repair.py
          git rm .github/scripts/net-caller-repair.py .github/workflows/architecture-run-net-caller-repair.yml
          git diff --check
          ! grep -RInE '\.(DrainReady|ApplyReadyAuthoritativeEvents)\(\s*ref ' Assets/Tests Assets/Scenes --include='*.cs'
          ! grep -RInE '\.ProcessAuthoritativeTick\(\s*[^,]+,\s*ref ' Assets/Tests Assets/Scenes --include='*.cs'
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode Assets/Scenes/Showcase
          git add -u .github
          git status --short
          git commit -m 'Migrate Net callers to Storage API capabilities'
          git push origin HEAD:${GITHUB_REF_NAME}
