name: Composition Storage slice acceptance
# Superseded by tests-pr.yml (affected tests on a PR) and tests-master.yml
# (full suite on merge). This ran the entire unfiltered EditMode suite on every
# push to every branch; eleven workflows doing that serialised on one runner.
# Retained as manually dispatchable rather than deleted, because each was written
# as the acceptance gate for a specific migration.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6dac3e29d171bf6a8fe7a5538717e4beabdbdaef
          fetch-depth: 1
      - name: Verify Composition Storage lifetime and far-field read boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          composition = Path('Assets/VoxelEngine/Composition/VoxelEngine.Composition.asmdef')
          bootstrap = Path('Assets/VoxelEngine/Composition/VoxelEngineBootstrap.cs')
          if not composition.is_file() or not bootstrap.is_file():
              raise SystemExit('Composition assembly/bootstrap is incomplete')
          data = json.loads(composition.read_text())
          refs = set(data.get('references', []))
          expected = {'VoxelEngine.Storage.Api', 'VoxelEngine.Storage.Runtime', 'Unity.Collections'}
          if refs != expected:
              raise SystemExit('Composition Storage slice refs differ from expected: ' + ', '.join(sorted(refs)))
          if data.get('name') != 'VoxelEngine.Composition':
              raise SystemExit('Composition assembly has wrong name')

          text = bootstrap.read_text()
          required = [
              'RegionTable', 'BrickPool', 'VoxelChangeJournal',
              'IRegionGenerationStore', 'IRegionReadSource', 'IRegionMutationStore',
              'IRegionResidencyStore', 'IRegionSnapshotSource',
              'IRegionSnapshotMutationStore', 'IVoxelSurfaceQuery', 'IVoxelChangeSource',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit('Composition bootstrap missing Storage wiring: ' + ', '.join(missing))

          far = Path('Assets/Scenes/Showcase/FarFieldStructureStore.cs').read_text()
          forbidden = ['VoxelEngine.Storage.Runtime', 'RegionTable', 'BrickPool', 'BrickRef', 'VoxelAccess']
          bad = [token for token in forbidden if token in far]
          if bad:
              raise SystemExit('FarFieldStructureStore still depends on physical Storage: ' + ', '.join(bad))
          if 'IRegionReadSource' not in far or 'RegionReadView' not in far:
              raise SystemExit('FarFieldStructureStore is not using Storage.Api read capability')

          world = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs').read_text()
          physical_calls = [line.strip() for line in world.splitlines()
                            if 'FarField.CaptureRegion' in line and ('_table' in line or '_pool' in line)]
          if physical_calls:
              raise SystemExit('ShowcaseWorld still calls far-field capture with physical Storage:\n' + '\n'.join(physical_calls))

          print('Composition Storage slice static acceptance passed')
          PY

  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6dac3e29d171bf6a8fe7a5538717e4beabdbdaef
          clean: false
          fetch-depth: 1
      - name: Reset pinned Composition candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 6dac3e29d171bf6a8fe7a5538717e4beabdbdaef
          git clean -ffdx -e Library/
          rm -rf Library/ScriptAssemblies Library/Bee
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then exit 1; fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/CompositionStorageSlice"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || true
          test -s "$ROOT/results.xml"
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-storage-slice-6dac3e29
          path: Artifacts/CompositionStorageSlice/
          if-no-files-found: warn
          retention-days: 14
