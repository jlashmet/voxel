name: Repair Vegetation checklist
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/mark-vegetation-doc.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          pairs=[
          ('**Current focus:** Cutover 10 Vegetation — final Api/Runtime ownership cutover','**Current focus:** Cutover 11 Net — decomposition and ownership correction'),
          ('| 10 — Vegetation | **In progress — current** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api; `Vegetation.Api` now owns stable tree species/instance/profile values with the original Unity GUID; WorldGen Voxel consumes Vegetation.Api only | isolate mutable tree state/skeleton/damage Runtime and cut Rendering to Api-only presentation reads |','| 10 — Vegetation | **Complete** | Vegetation.Api owns stable tree values and immutable read/presentation contracts; mutable state, skeleton generation and damage live in Vegetation.Runtime; Rendering and WorldGen consume Api-only boundaries | none |'),
          ('| 11 — Net | **Partial dependency cleanup** | authoritative edit application callers now consume Storage mutation capability | full Net.Api/Runtime decomposition, structural/residency/snapshot ownership cleanup |','| 11 — Net | **In progress — current** | edit application is Api-only and StructuralGraph ownership is already resolved | Net.Api/Runtime decomposition, residency/persistence/hash ownership cleanup, final Api-only dependency graph |'),
          ('| 12 — Rendering | **In progress** | render bridge, scheduler, solid Transvoxel and water extraction consume Storage.Api read views; physical table/pool view removed; retained-profile consumers take Storage.Api `IProfileBlockReadSource`; parity accepted | final Rendering.Api/Runtime move and Vegetation.Api-only dependency |','| 12 — Rendering | **In progress** | render bridge/scheduler/extraction use Storage.Api; retained profiles use Storage.Api; Vegetation presentation reads are Vegetation.Api-only; parity accepted | final Rendering.Api/Runtime physical move |'),
          ('- Latest accepted code gate: `73c81025ad313be78d47449ec6185d0dc0519361` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Vegetation.Api value slice: `ProceduralTreeTypes.cs` moved to `Vegetation/Api` with its Unity GUID preserved and now owns `TreeSpecies`, `TreeLeafStyle`, `TreeInstance`, `TreeSpeciesProfile`, and `TreeSpeciesProfiles`; WorldGen Voxel references Vegetation.Api rather than broad/Core Vegetation.','- Latest accepted code gate: `0aebbc56e14a4bfe1178b086a38419d1f0642b28` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Vegetation ownership cutover accepted: mutable state/skeleton/damage live in Vegetation.Runtime; Rendering and WorldGen consume Vegetation.Api-only boundaries.'),
          ('- [ ] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.','- [x] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime; `TreeWorldState` is internal Runtime state.'),
          ('- [ ] Rendering consumes Vegetation.Api-only read/presentation contracts.','- [x] Rendering consumes Vegetation.Api-only immutable read/presentation contracts.\n- [x] Final Vegetation Runtime/presentation cutover accepted by CI at `0aebbc56e14a4bfe1178b086a38419d1f0642b28`: 384 total / 371 passed / exact same 13 known failures.'),
          ('- [ ] no `VoxelEngine.Core.Vegetation` namespace remains;','- [x] no `VoxelEngine.Core.Vegetation` namespace remains;'),
          ('- [ ] Rendering references Vegetation.Api, not Runtime;','- [x] Rendering references Vegetation.Api, not Runtime;'),
          ('- [ ] mutable `TreeWorldState` is internal Runtime state;','- [x] mutable `TreeWorldState` is internal Runtime state;'),
          ('- [ ] tree damage/skeleton/render tests pass.','- [x] tree damage/skeleton/render tests pass.'),
          ('- [ ] create Vegetation.Api/Runtime','- [x] create Vegetation.Api/Runtime'),
          ('- [ ] remove `VoxelEngine.Core.Vegetation` namespace','- [x] remove `VoxelEngine.Core.Vegetation` namespace'),
          ('- [ ] isolate tree state/build/damage implementation','- [x] isolate tree state/build/damage implementation'),
          ('- [ ] expose stable placement/damage/render contracts','- [x] expose stable placement/damage/render contracts'),
          ('- [ ] update Rendering to Vegetation.Api','- [x] update Rendering to Vegetation.Api')]
          for old,new in pairs:
              n=s.count(old)
              if n!=1: raise SystemExit(f'{n} matches for {old[:80]}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git rm .github/workflows/mark-vegetation-doc.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git add -u .github/workflows
          git commit -m 'docs: mark Vegetation cutover complete'
          git push origin HEAD:${{ github.ref_name }}
