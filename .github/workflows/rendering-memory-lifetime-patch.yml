name: Renderer memory lifetime one-shot patch

on:
  push:
    branches: [agent/rendering-performance-lod]
    paths: [.github/workflows/rendering-memory-lifetime-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rendering-performance-lod
          fetch-depth: 0

      - name: Release renderer arenas fully between worlds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          render_pass = Path('Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs')
          text = render_pass.read_text()

          old = '        private VoxelSurfaceScheduler _scheduler = new();\n'
          new = '        private VoxelSurfaceScheduler _scheduler;\n'
          if text.count(old) != 1:
              raise SystemExit('VoxelRenderPass eager scheduler field mismatch')
          text = text.replace(old, new, 1)

          old = '''            if (!VoxelRenderBridge.SurfaceBuildEnabled)\n            {\n                VoxelRenderBridge.LastSurfacePassState = "waiting-for-atomic-world";\n                return;\n            }\n            VoxelRenderBridge.LastSurfacePassState = VoxelRenderBridge.VerboseSurfaceDiagnostics\n'''
          new = '''            if (!VoxelRenderBridge.SurfaceBuildEnabled)\n            {\n                VoxelRenderBridge.LastSurfacePassState = "waiting-for-atomic-world";\n                return;\n            }\n\n            // World teardown deliberately leaves the large native/GPU scheduler fully released.\n            // Recreate it only once a valid world is actually ready to render, so Metal never has\n            // to retire one arena while teardown eagerly allocates the next world's replacement.\n            _scheduler ??= new VoxelSurfaceScheduler();\n\n            VoxelRenderBridge.LastSurfacePassState = VoxelRenderBridge.VerboseSurfaceDiagnostics\n'''
          if text.count(old) != 1:
              raise SystemExit('VoxelRenderPass lazy scheduler insertion point mismatch')
          text = text.replace(old, new, 1)

          old = '''        private void ReleaseWorldResources()\n        {\n            if (_scheduler == null) return;\n\n            // Dispose is deliberately synchronous here: world teardown is a lifecycle boundary,\n            // not the frame path. Completing ready/running jobs and releasing every Storage pin\n            // before the application disposes its Storage backing is the ownership contract. Recreate\n            // fixed renderer state immediately so the next world does not allocate on its first\n            // RenderGraph frame.\n            _scheduler.Dispose();\n            _scheduler = new VoxelSurfaceScheduler();\n            Array.Clear(_transvoxelDrawEntries, 0, _transvoxelDrawEntries.Length);\n            Array.Clear(_waterDrawEntries, 0, _waterDrawEntries.Length);\n        }\n'''
          new = '''        private void ReleaseWorldResources()\n        {\n            if (_scheduler == null) return;\n\n            // Dispose is deliberately synchronous here: world teardown is a lifecycle boundary,\n            // not the frame path. Completing ready/running jobs and releasing every Storage pin\n            // before the application disposes its Storage backing is the ownership contract.\n            // Leave the scheduler null after disposal. Reallocating its persistent native buffers\n            // and shared ComputeBuffers here overlaps the old Metal resources' deferred retirement\n            // with the next arena and turns repeated scene loads into process-wide memory growth.\n            _scheduler.Dispose();\n            _scheduler = null;\n            Array.Clear(_transvoxelDrawEntries, 0, _transvoxelDrawEntries.Length);\n            Array.Clear(_waterDrawEntries, 0, _waterDrawEntries.Length);\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit('VoxelRenderPass release block mismatch')
          render_pass.write_text(text.replace(old, new, 1))

          watchdog = Path('tools/unity-run.sh')
          text = watchdog.read_text()
          marker = '''    echo $(( total / 1024 ))\n}\n\nstart=$(date +%s)\n'''
          replacement = '''    echo $(( total / 1024 ))\n}\n\n# Kill every descendant, deepest-first, before killing Unity itself. A direct pkill -P only\n# reaches one generation; shader/import/licensing helpers can have their own children and may\n# otherwise be reparented after Unity dies, continuing to consume memory after the safety guard.\nkill_tree() {\n  local root=$1\n  local pids=("$root")\n  local found=1\n\n  while (( found )); do\n    found=0\n    for pid in "${pids[@]}"; do\n      while read -r child; do\n        [[ -z "$child" ]] && continue\n        if [[ ! " ${pids[*]} " =~ " ${child} " ]]; then\n          pids+=("$child")\n          found=1\n        fi\n      done < <(pgrep -P "$pid" 2>/dev/null || true)\n    done\n  done\n\n  for (( i=${#pids[@]}-1; i>0; i-- )); do\n    kill -9 "${pids[$i]}" 2>/dev/null || true\n  done\n  kill -9 "$root" 2>/dev/null || true\n}\n\nstart=$(date +%s)\n'''
          if text.count(marker) != 1:
              raise SystemExit('unity-run kill_tree insertion point mismatch')
          text = text.replace(marker, replacement, 1)

          old_kill = '''    pkill -9 -P "$unity_pid" 2>/dev/null\n    kill -9 "$unity_pid" 2>/dev/null\n    wait "$unity_pid" 2>/dev/null\n'''
          new_kill = '''    kill_tree "$unity_pid"\n    wait "$unity_pid" 2>/dev/null\n'''
          if text.count(old_kill) != 4:
              raise SystemExit(f'unity-run expected 4 direct-child kill sites, found {text.count(old_kill)}')
          watchdog.write_text(text.replace(old_kill, new_kill))

          test = Path('Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs')
          test.write_text(r'''using System;\nusing System.IO;\nusing NUnit.Framework;\n\nnamespace VoxelEngine.Tests.EditMode\n{\n    public sealed class RendererWorldReleaseMemoryArchitectureTests\n    {\n        [Test]\n        public void WorldReleaseDoesNotEagerlyAllocateReplacementRendererArena()\n        {\n            string source = File.ReadAllText(\n                "Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs");\n\n            StringAssert.Contains("private VoxelSurfaceScheduler _scheduler;", source,\n                "the render pass must not allocate the scheduler with the persistent feature");\n            StringAssert.Contains("_scheduler ??= new VoxelSurfaceScheduler();", source,\n                "renderer state should be created only when a valid world actually renders");\n\n            int release = source.IndexOf(\n                "private void ReleaseWorldResources()", StringComparison.Ordinal);\n            int nextMethod = source.IndexOf(\n                "public void Dispose()", release, StringComparison.Ordinal);\n            Assert.GreaterOrEqual(release, 0);\n            Assert.Greater(nextMethod, release);\n\n            string releaseBody = source.Substring(release, nextMethod - release);\n            StringAssert.Contains("_scheduler.Dispose();", releaseBody,\n                "world teardown must still synchronously drain jobs and Storage pins");\n            StringAssert.Contains("_scheduler = null;", releaseBody,\n                "world teardown must end with no live renderer scheduler/arena");\n            StringAssert.DoesNotContain("new VoxelSurfaceScheduler()", releaseBody,\n                "teardown must not overlap old Metal resource retirement with a replacement arena");\n        }\n    }\n}\n'''.replace('\\n', '\n'))

          meta = Path('Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs.meta')
          meta.write_text('fileFormatVersion: 2\nguid: c6479c786a8e47fa93463017fd880220\n')
          PY

          bash -n tools/unity-run.sh
          grep -q 'private VoxelSurfaceScheduler _scheduler;' Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs
          grep -q '_scheduler ??= new VoxelSurfaceScheduler();' Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs
          grep -q 'kill_tree "$unity_pid"' tools/unity-run.sh
          test "$(grep -c 'kill_tree "$unity_pid"' tools/unity-run.sh)" -eq 4

      - name: Commit lifetime fix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rendering-memory-lifetime-patch.yml
          git add \
            Assets/VoxelEngine/Rendering/Runtime/RenderFeature/VoxelRenderPass.cs \
            Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs \
            Assets/Tests/EditMode/RendererWorldReleaseMemoryArchitectureTests.cs.meta \
            tools/unity-run.sh
          git commit -m 'Release renderer arenas fully between worlds'
          git fetch origin agent/rendering-performance-lod
          git rebase origin/agent/rendering-performance-lod
          git push origin HEAD:agent/rendering-performance-lod
