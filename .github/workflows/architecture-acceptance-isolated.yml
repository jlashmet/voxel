name: Architecture acceptance isolated
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/architecture-acceptance-isolated.yml]
permissions:
  contents: read
jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a6e161f09e95e2459ead088b4d3b6d531758b00
          clean: true
          fetch-depth: 1
      - name: Reset pinned Rendering source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 4a6e161f09e95e2459ead088b4d3b6d531758b00
          git clean -ffdx -e Library/
      - id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"
      - name: Wait for Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done
      - name: Run EditMode acceptance
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/Artifacts/RenderingAcceptance"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh
          UNITY_MAX_RSS_MB=8192 UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"
          status=$?
          test -s "$ROOT/results.xml"
          exit $status
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-acceptance-4a6e161f
          path: Artifacts/RenderingAcceptance/
          if-no-files-found: warn
          retention-days: 14
