name: SceneIssue 014011 finalize verified ownership fix

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-boundary-ownership-finalize.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: sceneissue-014011-boundary-ownership-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 0

      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/sceneissue-014011-finalize',
              description: 'Re-verifying proven GPU ownership fix',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Apply the already-verified ownership patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'RUN'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/one-shot-sceneissue-014011-boundary-ownership-commit.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<ownership-patch>', 'exec'), {})
          RUN
          git diff --check

      - name: Re-run complete GPU CPU oracle class
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue014011OwnershipFinalize"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=5 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter VoxelEngine.Tests.EditMode.GpuSurfaceExtractorOracleTests \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log"

      - name: Commit and push verified production fix
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Resources/VoxelBrickMesher.compute \
                  Assets/VoxelEngine/Rendering/Runtime/GpuVoxel/GpuSurfaceExtractor.cs
          git commit -m 'Fix scene issue 20260823-014011: match GPU boundary ownership'
          FIX_SHA="$(git rev-parse HEAD)"
          # Unity imports can dirty tracked project settings. They are unrelated to this fix and
          # must not block the rebase/push after the two verified source files are committed.
          git restore --worktree -- .
          git pull --rebase origin fixes
          git push origin HEAD:fixes
          echo "sha=$FIX_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        env:
          FIX_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'ci/sceneissue-014011-finalize',
              description: `Verified fix pushed as ${process.env.FIX_SHA.substring(0, 12)}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failure status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'ci/sceneissue-014011-finalize',
              description: 'Verified ownership fix could not be finalized',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
