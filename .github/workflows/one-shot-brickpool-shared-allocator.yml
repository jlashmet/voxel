name: One-shot BrickPool Shared Allocator State

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-brickpool-shared-allocator.yml'
      - 'Tools/Refactor/apply_brickpool_shared_allocator_state.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic allocator-state transform
        run: python Tools/Refactor/apply_brickpool_shared_allocator_state.py

      - name: Verify physical storage diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'NativeArray<int> _highWaterState' Assets/VoxelEngine/Core/Storage/BrickPool.cs
          ! grep -n -E 'private int _highWater|_highWater\+\+|_highWater -' Assets/VoxelEngine/Core/Storage/BrickPool.cs

      - name: Commit transform and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-brickpool-shared-allocator.yml
          git rm Tools/Refactor/apply_brickpool_shared_allocator_state.py
          git add Assets/VoxelEngine/Core/Storage/BrickPool.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: share brick pool allocator state across copies'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
