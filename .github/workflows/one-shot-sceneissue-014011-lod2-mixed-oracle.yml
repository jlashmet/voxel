name: One-shot SceneIssue 014011 LOD2 mixed-surface oracle

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-014011-lod2-mixed-oracle.yml

permissions:
  contents: write

jobs:
  oracle:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 0

      - name: Parameterize mixed-surface oracle for SourceStep1 and SourceStep2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/Tests/EditMode/GpuSurfaceExtractorOracleTests.cs')
          text = path.read_text()
          start_marker = '''        [Test]\n        public void MixedBricksWithAuthoredBoundariesAndCoatingsMatchTheCpu()\n        {\n'''
          next_marker = '''\n        /// <summary>\n        /// Fills the extractor's brick cache with a world that is solid below a plane of bricks,\n'''
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected one mixed oracle test, found {text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          block = text[start:end]

          block = block.replace(
              start_marker,
              '''        [TestCase(1)]\n        [TestCase(2)]\n        public void MixedBricksWithAuthoredBoundariesAndCoatingsMatchTheCpu(int sourceStep)\n        {\n''',
              1)

          old_gpu = '''                    mirror, tables, int3.zero, brickCacheOrigin, 1, voxelSize,\n'''
          new_gpu = '''                    mirror, tables, int3.zero, brickCacheOrigin, sourceStep, voxelSize,\n'''
          if block.count(old_gpu) != 1:
              raise SystemExit(f'expected one GPU mixed sourceStep literal, found {block.count(old_gpu)}')
          block = block.replace(old_gpu, new_gpu, 1)

          old_cpu = '''                    int3.zero, brickCacheOrigin, edge, CellsPerAxis, Padding, 1, voxelSize,\n'''
          new_cpu = '''                    int3.zero, brickCacheOrigin, edge, CellsPerAxis, Padding, sourceStep, voxelSize,\n'''
          if block.count(old_cpu) != 1:
              raise SystemExit(f'expected one CPU mixed sourceStep literal, found {block.count(old_cpu)}')
          block = block.replace(old_cpu, new_cpu, 1)

          path.write_text(text[:start] + block + text[end:])
          PY
          git diff --check
          git diff -- Assets/Tests/EditMode/GpuSurfaceExtractorOracleTests.cs
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Tests/EditMode/GpuSurfaceExtractorOracleTests.cs
          git commit -m 'SceneIssue 014011: exercise mixed GPU oracle at LOD2'
          git push origin HEAD:fixes

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run graphics-enabled SourceStep1/2 mixed-surface oracle
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.EditMode.GpuSurfaceExtractorOracleTests.MixedBricksWithAuthoredBoundariesAndCoatingsMatchTheCpu
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue014011MixedOracle"
          OUT="$GITHUB_WORKSPACE/SceneIssues/20260823-014011-920-VoxelShowcase/notes-lod2-mixed-oracle.txt"
          mkdir -p "$ROOT" "$(dirname "$OUT")"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || status=$?

          {
            echo "status=$status"
            echo "filter=$TEST_FILTER"
            echo
            if [[ -s "$ROOT/results.xml" ]]; then
              python3 - "$ROOT/results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//test-case')
          print(f'Executed {len(cases)} test case(s).')
          for case in cases:
              name = case.get('fullname') or case.get('name') or '<unknown>'
              result = case.get('result')
              print(f'{result}: {name}')
              if result not in ('Passed', 'Success'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = (failure.findtext('message') or '').strip()
                      stack = (failure.findtext('stack-trace') or '').strip()
                      if message:
                          print(message)
                      if stack:
                          print(stack)
          PY
            else
              echo "No results.xml produced."
            fi
            echo
            echo '=== UNITY LOG TAIL ==='
            tail -220 "$ROOT/unity.log" 2>/dev/null || true
          } | tee "$OUT"
          printf '%s\n' "$status" > "$ROOT/status.txt"

      - name: Commit oracle result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=SceneIssues/20260823-014011-920-VoxelShowcase/notes-lod2-mixed-oracle.txt
          test -s "$OUT"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo 'Oracle result unchanged.'
          else
            git commit -m 'SceneIssue 014011: record LOD2 mixed-surface oracle result'
            git push origin HEAD:fixes
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sceneissue-014011-lod2-mixed-oracle-${{ github.run_id }}
          path: Artifacts/SceneIssue014011MixedOracle/**
          if-no-files-found: ignore
          retention-days: 1

      - name: Preserve oracle status
        if: always()
        shell: bash
        run: |
          status="$(cat Artifacts/SceneIssue014011MixedOracle/status.txt 2>/dev/null || echo 1)"
          exit "$status"
