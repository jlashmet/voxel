name: Terrain Metrics

on:
  workflow_run:
    workflows: ["Terrain Lookdev Visual"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  metrics:
    if: github.event.workflow_run.head_branch == 'terrain'
    runs-on: self-hosted
    steps:
      - name: Checkout measured revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: true

      - name: Download terrain render artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: Artifacts/Terrain
          merge-multiple: true

      - name: Materialize 128x192 terrain reference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import struct
          import zlib

          width, height = 128, 192
          source = pathlib.Path('.github/scripts/terrain_reference_128x192.rgb.b64')
          rgb = base64.b64decode(source.read_text().strip())
          expected = width * height * 3
          if len(rgb) != expected:
              raise SystemExit(f'reference byte count {len(rgb)} != {expected}')

          def chunk(kind, payload):
              return (struct.pack('>I', len(payload)) + kind + payload
                      + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff))

          rows = b''.join(
              b'\x00' + rgb[y * width * 3:(y + 1) * width * 3]
              for y in range(height))
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(rows, 9))
                 + chunk(b'IEND', b''))
          out = pathlib.Path('Artifacts/Terrain/terrain-reference-128.png')
          out.write_bytes(png)
          print(f'Wrote {out}')
          PY

      - name: Compute multimetric diagnostics
        run: |
          set -euo pipefail
          test -s Artifacts/Terrain/terrain.png
          test -s Artifacts/Terrain/terrain-reference-128.png
          python3 .github/scripts/terrain_metrics.py \
            Artifacts/Terrain/terrain.png \
            Artifacts/Terrain/terrain-reference-128.png \
            --json Artifacts/Terrain/terrain-metrics.json \
            --text Artifacts/Terrain/terrain-metrics.txt

      - name: Upload terrain metrics
        uses: actions/upload-artifact@v4
        with:
          name: terrain-metrics-${{ github.event.workflow_run.head_sha }}
          path: |
            Artifacts/Terrain/terrain-metrics.json
            Artifacts/Terrain/terrain-metrics.txt
            Artifacts/Terrain/terrain-reference-128.png
          if-no-files-found: error
          retention-days: 14
