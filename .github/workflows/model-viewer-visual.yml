name: Model Viewer Visual

on:
  push:
    branches:
      - feature/sdf-dragon-statue
  workflow_dispatch:

concurrency:
  group: model-viewer-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-viewer-visual:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run Model Viewer production-surface acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/ModelViewer"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=3 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform PlayMode \
            -testFilter "VoxelEngine.Tests.PlayMode.ModelViewerSceneTests.DragonStatueConvergesThroughProductionSurfacePath" \
            -testResults "$ROOT/model-viewer.xml" \
            -logFile "$ROOT/model-viewer-test.log"

      - name: Wait for Unity before player build
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Capture Model Viewer from real player
        shell: bash
        run: |
          set -euo pipefail
          bash tools/showcase-player-capture.sh \
            --unity "${{ steps.unity.outputs.path }}" \
            --output "$GITHUB_WORKSPACE/Artifacts/ModelViewer/RealPlayer" \
            --scene "Assets/Scenes/ModelViewer.unity" \
            --run-seconds 30

      - name: Upload Model Viewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-viewer-${{ github.sha }}
          path: |
            Artifacts/ModelViewer/**
          if-no-files-found: warn
          retention-days: 7
