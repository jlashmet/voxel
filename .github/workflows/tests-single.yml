name: Tests (single)
run-name: Validation · ${{ github.ref_name }} · ${{ github.event_name }}

# Exact-SHA agent transport. On ci-test/* pushes the feature diff determines the owning
# module assemblies, optional module-local standalone scenes, and Kentridge integration.
# Compatible requested regressions share the same persistent Unity editor as automatic
# EditMode/PlayMode validation; known process-isolated suites still use a fresh editor.
on:
  workflow_dispatch:
    inputs:
      test:
        description: Fully qualified Unity test name (optional extra gate)
        required: false
        default: ''
        type: string
      platform:
        description: Unity test platform for optional extra gate
        required: true
        default: EditMode
        type: choice
        options: [EditMode, PlayMode]
      request_id:
        description: Correlation id
        required: false
        default: ''
        type: string
  push:
    branches: ['ci-test/**']
    paths: ['.github/test-request.json']

permissions:
  contents: read
  statuses: write

concurrency:
  group: single-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Resolve request and feature source
        id: request
        shell: bash
        env:
          DISPATCH_TEST: ${{ inputs.test }}
          DISPATCH_PLATFORM: ${{ inputs.platform }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test_name="${DISPATCH_TEST:-}"
            platform="$DISPATCH_PLATFORM"
            request_id="${DISPATCH_REQUEST_ID:-${GITHUB_SHA:0:12}}"
            source_sha="$GITHUB_SHA"
            scene_issue=""
            replay_seconds=""
          else
            eval "$(python3 - <<'PY'
          import json, shlex
          request=json.load(open('.github/test-request.json',encoding='utf-8'))
          values={
            'test_name':request.get('test') or '',
            'platform':request.get('platform','EditMode'),
            'request_id':request.get('request_id') or '',
            'scene_issue':request.get('scene_issue') or '',
            'replay_seconds':request.get('replay_seconds') or '',
          }
          if values['platform'] not in ('EditMode','PlayMode'):
              raise SystemExit('ERROR: platform must be EditMode or PlayMode')
          for key,value in values.items():
              if not isinstance(value,(str,int)) or '\n' in str(value) or '\r' in str(value):
                  raise SystemExit('ERROR: invalid request value: '+key)
              print(f'{key}={shlex.quote(str(value))}')
          PY
          )"
            request_id="${request_id:-${GITHUB_SHA:0:12}}"
            source_sha="$(git rev-parse HEAD^)"
          fi
          printf 'test=%s\nplatform=%s\nrequest_id=%s\nscene_issue=%s\nreplay_seconds=%s\nsource_sha=%s\n' \
            "$test_name" "$platform" "$request_id" "$scene_issue" "$replay_seconds" "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Publish pending commit status
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo,
              sha: process.env.SOURCE_SHA, state: 'pending', context: 'ci/single-test',
              description: 'Exact-SHA validation is running', target_url: process.env.RUN_URL});

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/m_EditorVersion:/ {print $2}' ProjectSettings/ProjectVersion.txt)"
          path="/Applications/Unity/Hub/Editor/${version}/Unity.app/Contents/MacOS/Unity"
          test -x "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS+60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            (( SECONDS < deadline )) || { pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true; exit 1; }
            sleep 5
          done

      # Manual dispatch has no diff-derived validation plan, so keep its direct focused gate.
      # ci-test/* pushes fold compatible focused tests into the persistent automatic runner below.
      - name: Run optional explicitly requested test (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.request.outputs.test != ''
        shell: bash
        env:
          UNITY_BIN: ${{ steps.unity.outputs.path }}
          TEST_FILTER: ${{ steps.request.outputs.test }}
          TEST_PLATFORM: ${{ steps.request.outputs.platform }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/Artifacts/SingleTest/Requested"
          mkdir -p "$root"
          extra=(-batchmode -job-worker-count 1)
          [[ "$TEST_PLATFORM" != EditMode ]] || extra+=(-nographics)
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 tools/unity-run.sh \
            "${extra[@]}" -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform "$TEST_PLATFORM" \
            -testFilter "$TEST_FILTER" -testResults "$root/results.xml" -logFile "$root/unity.log"
          python3 - "$root/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); cases=root.findall('.//test-case')
          if not cases: raise SystemExit('ERROR: requested filter matched zero tests')
          failed=[c for c in cases if c.get('result') not in ('Passed','Success')]
          if failed: raise SystemExit(f'ERROR: {len(failed)} requested test(s) failed')
          print(f'Executed {len(cases)} requested test(s).')
          PY

      - name: Derive automatic module validation plan
        if: github.event_name == 'push'
        id: plan
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin master --quiet
          base="$(git merge-base origin/master "$SOURCE_SHA")"
          mkdir -p Artifacts/SingleTest/ModuleValidation
          git diff --name-only "$base" "$SOURCE_SHA" > Artifacts/SingleTest/ModuleValidation/changed-files.txt
          python3 tools/module-validation-plan.py \
            --changed-file-list Artifacts/SingleTest/ModuleValidation/changed-files.txt \
            --output Artifacts/SingleTest/ModuleValidation/plan.json
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          p=json.load(open('Artifacts/SingleTest/ModuleValidation/plan.json',encoding='utf-8'))
          with open(sys.argv[1],'a',encoding='utf-8') as out:
              out.write('required='+('true' if p['hasValidationWork'] else 'false')+'\n')
              out.write('has_players='+('true' if p['playerValidations'] else 'false')+'\n')
          print('Automatic modules:', ', '.join(p['modules']) or '<none>')
          print('Fallback paths:', ', '.join(p['fallbackPaths']) or '<none>')
          PY

      - name: Run automatically required module validation
        if: github.event_name == 'push' && (steps.plan.outputs.required == 'true' || steps.request.outputs.test != '')
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run-module-validation.py \
            --unity "${{ steps.unity.outputs.path }}" \
            --plan Artifacts/SingleTest/ModuleValidation/plan.json \
            --output Artifacts/SingleTest/ModuleValidation/Results \
            --requested-test "${{ steps.request.outputs.test }}" \
            --requested-platform "${{ steps.request.outputs.platform }}" \
            --source-sha "${{ steps.request.outputs.source_sha }}"

      - name: Replay SceneIssue through standalone player
        if: always() && steps.request.outputs.scene_issue != ''
        shell: bash
        run: |
          set -euo pipefail
          args=(--unity "${{ steps.unity.outputs.path }}" --output "$GITHUB_WORKSPACE/Artifacts/SingleTest/SceneIssue" \
                --scene-issue "${{ steps.request.outputs.scene_issue }}")
          if [[ -n "${{ steps.request.outputs.replay_seconds }}" ]]; then
            args+=(--run-seconds "${{ steps.request.outputs.replay_seconds }}")
          fi
          bash tools/showcase-player-capture.sh "${args[@]}"

      - name: Emit screenshot previews
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find Artifacts/SingleTest -type f -name '*.png' -size +1k 2>/dev/null | sort | head -12 | while IFS= read -r shot; do
            preview="${shot%.png}.preview.jpg"
            sips -s format jpeg -s formatOptions 50 -Z 480 "$shot" --out "$preview" >/dev/null
            echo "VISUAL_PREVIEW_BEGIN $shot"; base64 < "$preview" | fold -w 120; echo "VISUAL_PREVIEW_END $shot"
          done

      - name: Upload result
        if: always()
        continue-on-error: ${{ steps.plan.outputs.has_players != 'true' && steps.request.outputs.scene_issue == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: single-test-${{ github.run_id }}
          path: Artifacts/SingleTest/**
          if-no-files-found: error
          retention-days: 1

      - name: Publish final commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success=process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo,
              sha: process.env.SOURCE_SHA, state: success ? 'success' : 'failure', context: 'ci/single-test',
              description: success ? 'Exact-SHA validation passed' : 'Exact-SHA validation failed', target_url: process.env.RUN_URL});
