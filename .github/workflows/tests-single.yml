name: Tests (single)
run-name: Single test · ${{ github.ref_name }} · ${{ github.event_name }}

# Fast, explicit validation path for coding agents. This does not replace the
# affected-test PR workflow or the full master suite; it runs only the requested
# Unity test against the selected git ref. Local developers can dispatch it via
# tools/ci-test. Agents without workflow-dispatch access use a dedicated ci-test/*
# branch based on the exact source commit, then update .github/test-request.json
# there. Keeping request commits off the PR branch prevents normal PR CI fanout.
# Push the final request commit directly: publishing an intermediate reset/template
# head creates a second event that can be admitted later and cancel the real request.
#
# Visual screenshot suites are still selected exactly like any other test. After
# the Unity assertion phase, the shared player-capture utility maps those known
# filters to their real scene, builds a standalone app, and captures presented
# frames every ten seconds under Artifacts/SingleTest/RealPlayer.
on:
  workflow_dispatch:
    inputs:
      test:
        description: Fully qualified Unity test name (or exact test filter)
        required: true
        type: string
      platform:
        description: Unity test platform
        required: true
        default: EditMode
        type: choice
        options:
          - EditMode
          - PlayMode
      request_id:
        description: Correlation id supplied by tools/ci-test
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'ci-test/**'
    paths:
      - '.github/test-request.json'

permissions:
  contents: read
  statuses: write

# A branch is a latest-request mailbox. A newer single-test request on the same
# branch cancels any older queued or running request instead of building a backlog.
concurrency:
  group: single-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single:
    runs-on: [self-hosted, macOS]
    # Single-test CI is intentionally a fast-feedback path. The complete job must
    # finish within five minutes; slow tests should be split or narrowed instead.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      # Push-triggered runs publish a classic commit status so connector-only
      # agents can monitor queued/running/pass/fail without workflow discovery.
      - name: Publish pending commit status
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/single-test',
              description: 'Requested Unity single test is running',
              target_url: process.env.RUN_URL,
            });

      - name: Resolve test request
        id: request
        shell: bash
        env:
          DISPATCH_TEST: ${{ inputs.test }}
          DISPATCH_PLATFORM: ${{ inputs.platform }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test_name="$DISPATCH_TEST"
            platform="$DISPATCH_PLATFORM"
            request_id="${DISPATCH_REQUEST_ID:-${GITHUB_SHA:0:12}}"

            [[ -n "$test_name" ]] || { echo "ERROR: test is required" >&2; exit 2; }
            case "$platform" in
              EditMode|PlayMode) ;;
              *) echo "ERROR: platform must be EditMode or PlayMode" >&2; exit 2 ;;
            esac
            [[ "$test_name" != *$'\n'* && "$request_id" != *$'\n'* ]] || {
              echo "ERROR: request values must be single-line strings" >&2
              exit 2
            }

            printf 'test=%s\nplatform=%s\nrequest_id=%s\n' \
              "$test_name" "$platform" "$request_id" >> "$GITHUB_OUTPUT"
          else
            python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          import sys

          path = '.github/test-request.json'
          with open(path, encoding='utf-8') as handle:
              request = json.load(handle)

          test = request.get('test')
          platform = request.get('platform', 'EditMode')
          request_id = request.get('request_id') or os.environ.get('GITHUB_SHA', '')[:12]
          scene_issue = request.get('scene_issue') or ''
          replay_seconds = request.get('replay_seconds')

          if not isinstance(test, str) or not test:
              raise SystemExit('ERROR: .github/test-request.json requires a non-empty string "test"')
          if platform not in ('EditMode', 'PlayMode'):
              raise SystemExit('ERROR: "platform" must be EditMode or PlayMode')
          if not isinstance(request_id, str):
              raise SystemExit('ERROR: "request_id" must be a string when supplied')
          if not isinstance(scene_issue, str):
              raise SystemExit('ERROR: "scene_issue" must be a string when supplied')
          if any('\n' in value or '\r' in value
                 for value in (test, platform, request_id, scene_issue)):
              raise SystemExit('ERROR: request values must be single-line strings')

          scene_path = ''
          if scene_issue:
              issue_path = PurePosixPath(scene_issue)
              parts = issue_path.parts
              if (issue_path.is_absolute() or '..' in parts or len(parts) != 4 or
                      parts[0] != 'SceneIssues' or parts[1] not in ('open', 'pending', 'closed') or
                      parts[3] != 'issue.json'):
                  raise SystemExit(
                      'ERROR: "scene_issue" must be SceneIssues/open|pending|closed/<id>/issue.json')
              issue_file = Path(scene_issue)
              if not issue_file.is_file():
                  raise SystemExit('ERROR: scene issue does not exist: ' + scene_issue)
              with issue_file.open(encoding='utf-8') as handle:
                  issue = json.load(handle)
              scene_path = issue.get('scenePath') or ''
              if not isinstance(scene_path, str) or not scene_path.startswith('Assets/Scenes/') \
                      or not scene_path.endswith('.unity') or not Path(scene_path).is_file():
                  raise SystemExit('ERROR: scene issue has no valid existing scenePath')
              if platform != 'PlayMode':
                  raise SystemExit('ERROR: scene-issue replay requires platform=PlayMode')
              if replay_seconds in (None, ''):
                  replay_seconds = 30
              if isinstance(replay_seconds, bool) or not isinstance(replay_seconds, int) \
                      or replay_seconds < 20 or replay_seconds > 60:
                  raise SystemExit('ERROR: "replay_seconds" must be an integer from 20 to 60')
          elif replay_seconds not in (None, ''):
              raise SystemExit('ERROR: "replay_seconds" requires "scene_issue"')

          with open(sys.argv[1], 'a', encoding='utf-8') as output:
              output.write(f'test={test}\n')
              output.write(f'platform={platform}\n')
              output.write(f'request_id={request_id}\n')
              output.write(f'scene_issue={scene_issue}\n')
              output.write(f'scene_path={scene_path}\n')
              output.write(f'replay_seconds={replay_seconds or ""}\n')
          PY
          fi

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      # A single-test run should only pay for the full startup bake when the selected test belongs
      # to a suite that exercises VoxelShowcase.unity. Keep this as a positive list so new unrelated
      # PlayMode suites stay fast by default. Renderer traversal validates the checked-in production
      # bake; the two SmallVoxelShowcase benchmark profiles compose their own smaller world directly.
      - name: Restore or bake Voxel Showcase startup world
        if: >-
          steps.request.outputs.platform == 'PlayMode' &&
          (
            steps.request.outputs.scene_path == 'Assets/Scenes/VoxelShowcase.unity' ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.Showcase') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.AsyncGeometryStressTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.CastleAccessTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.CastleExteriorLookdevTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.CastleScreenshotTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.FallingVoxelPhysicsTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.FarField') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.Lod') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.SilhouetteHoleRegressionTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.StationaryRenderBenchmarkTests') ||
            startsWith(steps.request.outputs.test, 'VoxelEngine.Tests.PlayMode.Step4')
          ) &&
          steps.request.outputs.test != 'VoxelEngine.Tests.PlayMode.ShowcaseTraversalPerformanceTests.ContinuousPlayerTraversalNeverStuttersOrOpensNearFarGap' &&
          steps.request.outputs.test != 'VoxelEngine.Tests.PlayMode.StationaryRenderBenchmarkTests.SmallVoxelShowcaseMovingBuild12' &&
          steps.request.outputs.test != 'VoxelEngine.Tests.PlayMode.StationaryRenderBenchmarkTests.SmallVoxelShowcaseMovingBuild8'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SingleTest"
          BAKE="$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"
          mkdir -p "$ROOT"
          if tools/showcase-bake-cache.sh restore "$BAKE"; then
            exit 0
          fi
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"
          test -s "$BAKE"
          if ! tools/showcase-bake-cache.sh store "$BAKE"; then
            echo 'WARNING: Showcase bake passed but its runner-local cache could not be updated.' >&2
          fi

      # tools/unity-run.sh deliberately refuses to start while another Unity editor is visible.
      # A successful bake can return a moment before its macOS process disappears, so serialize
      # adjacent Unity invocations instead of racing that shutdown.
      - name: Wait for Unity between invocations
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run requested test
        shell: bash
        env:
          TEST_FILTER: ${{ steps.request.outputs.test }}
          TEST_PLATFORM: ${{ steps.request.outputs.platform }}
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SingleTest"
          mkdir -p "$ROOT"

          # Keep the array non-empty under macOS's Bash 3.2. With set -u, expanding an empty
          # array is treated as an unbound variable and PlayMode never reaches Unity.
          # Kentridge production acceptances inspect composed world/camera state and movement,
          # not framebuffer pixels; null graphics keeps those paths within runner memory.
          EXTRA_ARGS=(-batchmode)
          WORKER_ARGS=(-job-worker-count 1)
          if [[ "$TEST_PLATFORM" == "PlayMode" &&
                "$TEST_FILTER" == VoxelEngine.Tests.PlayMode.ShowcaseTraversalPerformanceTests.* ]]; then
            WORKER_ARGS=(-job-worker-count 8)
          fi
          if [[ "$TEST_PLATFORM" == "EditMode" ||
                "$TEST_FILTER" == VoxelEngine.Tests.PlayMode.KentridgeStructureComparisonSceneTests.* ||
                "$TEST_FILTER" == VoxelEngine.Tests.PlayMode.KentridgePlayableScenePlayTests.* ||
                "$TEST_FILTER" == VoxelEngine.Tests.PlayMode.KentridgeOpeningProductionAcceptanceTests.* ||
                "$TEST_FILTER" == VoxelEngine.Tests.PlayMode.KentridgeOpeningCameraReadabilityTests.* ||
                "$TEST_FILTER" == VoxelEngine.Tests.PlayMode.KentridgeOpeningPresentationTests.* ]]; then
            EXTRA_ARGS+=(-nographics)
          fi

          echo "Running $TEST_PLATFORM test filter: $TEST_FILTER with ${WORKER_ARGS[*]}"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            "${EXTRA_ARGS[@]}" "${WORKER_ARGS[@]}" \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform "$TEST_PLATFORM" \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/single.xml" -logFile "$ROOT/single.log" || status=$?

          if [[ ! -s "$ROOT/single.log" && -s "$HOME/Library/Logs/Unity/Editor.log" ]]; then
            cp "$HOME/Library/Logs/Unity/Editor.log" "$ROOT/single-global.log"
          fi
          if [[ -s "${TMPDIR:-/tmp}/unity-run-status" ]]; then
            cp "${TMPDIR:-/tmp}/unity-run-status" "$ROOT/unity-run-status.txt"
          fi

          if (( status != 0 )); then
            if [[ -s "$ROOT/single.xml" ]]; then
              echo "=== UNITY TEST FAILURE DETAILS ==="
              python3 - "$ROOT/single.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//test-case')
          failed = [case for case in cases if case.get('result') not in ('Passed', 'Success')]
          print(f'Executed {len(cases)} test case(s); failed={len(failed)}.')
          for case in failed[:8]:
              print(f"FAILED: {case.get('fullname') or case.get('name') or '<unknown>'}")
              failure = case.find('failure')
              if failure is None:
                  continue
              message = failure.findtext('message') or ''
              stack = failure.findtext('stack-trace') or ''
              if message:
                  print(message.strip())
              if stack:
                  print(stack.strip())
          PY
            fi
            if [[ -s "$ROOT/single.log" ]]; then
              echo "=== UNITY TEST LOG TAIL ==="
              tail -120 "$ROOT/single.log"
            fi
            exit "$status"
          fi
          test -s "$ROOT/single.xml"

          # Unity can return successfully even when a bad filter matches no tests.
          # Treat that as a CI failure so an agent never validates a typo as green.
          python3 - "$ROOT/single.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          cases = root.findall('.//test-case')
          if not cases:
              print('ERROR: Unity completed but the requested filter matched zero tests.', file=sys.stderr)
              raise SystemExit(2)
          print(f'Executed {len(cases)} test case(s).')
          PY

      - name: Capture visual test from real player
        if: always() && steps.request.outputs.platform == 'PlayMode'
        shell: bash
        env:
          TEST_FILTER: ${{ steps.request.outputs.test }}
          SCENE_ISSUE: ${{ steps.request.outputs.scene_issue }}
          REPLAY_SECONDS: ${{ steps.request.outputs.replay_seconds }}
        run: |
          set -euo pipefail
          args=(
            --unity "${{ steps.unity.outputs.path }}"
            --output "$GITHUB_WORKSPACE/Artifacts/SingleTest/RealPlayer"
          )
          if [[ -n "$SCENE_ISSUE" ]]; then
            args+=(--scene-issue "$SCENE_ISSUE" --run-seconds "$REPLAY_SECONDS")
          else
            args+=(--test-filter "$TEST_FILTER" --if-configured)
          fi
          bash tools/showcase-player-capture.sh "${args[@]}"

      # Artifact quota exhaustion must not make a visual iteration opaque. These previews are
      # debugging evidence only: visual proof still requires the artifact upload below to succeed.
      - name: Emit real-player screenshot previews
        if: always() && steps.request.outputs.platform == 'PlayMode'
        shell: bash
        run: |
          set -euo pipefail
          SHOTS="$GITHUB_WORKSPACE/Artifacts/SingleTest/RealPlayer/Screenshots"
          [[ -d "$SHOTS" ]] || exit 0
          PREVIEWS="$GITHUB_WORKSPACE/Artifacts/SingleTest/RealPlayer/LogPreviews"
          mkdir -p "$PREVIEWS"

          count=0
          while IFS= read -r shot; do
            [[ -s "$shot" ]] || continue
            name="$(basename "$shot" .png)"
            preview="$PREVIEWS/${name}.jpg"
            sips -s format jpeg -s formatOptions 55 -Z 640 "$shot" --out "$preview" >/dev/null
            echo "VISUAL_PREVIEW_BEGIN $(basename "$shot")"
            base64 < "$preview" | fold -w 120
            echo "VISUAL_PREVIEW_END $(basename "$shot")"
            count=$((count + 1))
          done < <(find "$SHOTS" -type f -name '*.png' -size +1k | sort)
          echo "Emitted $count real-player preview(s) to the workflow log."

      # A successful non-visual single test must not be turned red just because the repository has
      # exhausted GitHub artifact storage. Visual requests are different: their screenshots are
      # part of the proof, so an upload failure must remain fatal for those filters.
      - name: Classify result artifact requirement
        if: always()
        id: artifact_policy
        shell: bash
        env:
          TEST_FILTER: ${{ steps.request.outputs.test }}
          SCENE_ISSUE: ${{ steps.request.outputs.scene_issue }}
        run: |
          set -euo pipefail
          if [[ -n "$SCENE_ISSUE" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TEST_FILTER" in
            VoxelEngine.Tests.PlayMode.ArchLookdevSceneTests|VoxelEngine.Tests.PlayMode.ArchLookdevSceneTests.*|\
            VoxelEngine.Tests.PlayMode.TerrainLookdevScreenshotTests|VoxelEngine.Tests.PlayMode.TerrainLookdevScreenshotTests.*|\
            VoxelEngine.Tests.PlayMode.KentridgePlayableScenePlayTests|VoxelEngine.Tests.PlayMode.KentridgePlayableScenePlayTests.*|\
            VoxelEngine.Tests.PlayMode.StationaryRenderBenchmarkTests|VoxelEngine.Tests.PlayMode.StationaryRenderBenchmarkTests.*|\
            VoxelEngine.Tests.PlayMode.CastleScreenshotTests|VoxelEngine.Tests.PlayMode.CastleScreenshotTests.*|\
            VoxelEngine.Tests.PlayMode.CastleExteriorLookdevTests|VoxelEngine.Tests.PlayMode.CastleExteriorLookdevTests.*)
              echo "required=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "required=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload result
        if: always()
        continue-on-error: ${{ steps.artifact_policy.outputs.required != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: single-test-${{ github.run_id }}
          path: Artifacts/SingleTest/**
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish final commit status
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/single-test',
              description: success
                ? 'Requested Unity single test passed'
                : 'Requested Unity single test failed',
              target_url: process.env.RUN_URL,
            });
