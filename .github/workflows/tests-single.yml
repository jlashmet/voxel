name: Tests (single)
run-name: Single test · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  push:
    branches:
      - 'ci-test/**'
    paths:
      - '.github/test-request.json'

permissions:
  contents: write
  statuses: write

concurrency:
  group: single-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2

      - name: Publish pending commit status
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ci/single-test',
              description: 'Refreshing checked-in VoxelShowcase bake',
              target_url: process.env.RUN_URL,
            });

      - name: Validate one-shot bake request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('.github/test-request.json', encoding='utf-8') as handle:
              request = json.load(handle)
          expected = 'VoxelEngine.Tests.PlayMode.ShowcaseBakeArtifactTests.FreshShowcaseBakeIsCapturedForCommit'
          if request.get('platform') != 'PlayMode' or request.get('test') != expected:
              raise SystemExit('This temporary workflow only permits the verified showcase-bake publication request.')
          PY

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for any running Unity editor
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Bake and publish verified VoxelShowcase world
        shell: bash
        env:
          FEATURE_BRANCH: agent/main-thread-render-jobs-v2
          EXPECTED_BYTES: '23096216'
          EXPECTED_SHA256: 080eaf82fc003cfa677f1efa933e46a9301e59141f4e343010b1ebdb05ed0e59
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SingleTest"
          mkdir -p "$ROOT"
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=4 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod VoxelEngine.Showcase.Editor.ShowcaseWorldBaker.BakeShowcaseWorld \
            -logFile "$ROOT/showcase-bake.log"

          baked="$GITHUB_WORKSPACE/Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes"
          test -s "$baked"
          actual_bytes="$(stat -f%z "$baked")"
          actual_sha="$(shasum -a 256 "$baked" | awk '{print $1}')"
          echo "SHOWCASE_BAKE_VERIFY bytes=$actual_bytes sha256=$actual_sha"
          [[ "$actual_bytes" == "$EXPECTED_BYTES" ]]
          [[ "$actual_sha" == "$EXPECTED_SHA256" ]]

          preserved="$RUNNER_TEMP/ShowcaseWorld.bytes"
          cp "$baked" "$preserved"

          feature_sha="$(git rev-parse HEAD^)"
          git fetch origin "+refs/heads/$FEATURE_BRANCH:refs/remotes/origin/$FEATURE_BRANCH"
          remote_feature_sha="$(git rev-parse "refs/remotes/origin/$FEATURE_BRANCH")"
          [[ "$feature_sha" == "$remote_feature_sha" ]] || {
            echo "Feature branch moved during bake: expected $feature_sha, found $remote_feature_sha" >&2
            exit 1
          }

          git reset --hard "$feature_sha"
          cp "$preserved" Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes
          git add Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes
          git diff --cached --quiet && {
            echo "Fresh bake is byte-identical to the checked-in world; nothing to publish."
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh VoxelShowcase bake for broad terrain relief'
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          echo "PUBLISHED_FEATURE_HEAD=$(git rev-parse HEAD)"

      - name: Publish final commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ci/single-test',
              description: success ? 'Verified VoxelShowcase bake published' : 'VoxelShowcase bake publication failed',
              target_url: process.env.RUN_URL,
            });
