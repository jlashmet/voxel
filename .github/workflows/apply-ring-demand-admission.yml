name: Apply ring-demand admission repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-ring-demand-admission.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply measured ring-demand repair
        run: python3 .github/scripts/apply_ring_demand_admission_patch.py
      - name: Verify patch
        run: git diff --check
      - name: Commit repair and retire transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
            Assets/Tests/EditMode/SurfaceRingBuildAdmissionTests.cs \
            .claude/plans/voxel-showcase-rendering-repair-v2.md
          git rm \
            .github/workflows/apply-ring-demand-admission.yml \
            .github/scripts/apply_ring_demand_admission_patch.py
          git commit -m "fix(rendering): admit only current-ring surface demand"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
