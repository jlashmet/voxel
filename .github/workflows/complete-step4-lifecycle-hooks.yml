name: Complete step4 lifecycle hooks

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/complete-step4-lifecycle-hooks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - run: python3 .github/scripts/complete-step4-lifecycle-hooks.py
      - run: |
          rm .github/scripts/complete-step4-lifecycle-hooks.py
          rm .github/workflows/complete-step4-lifecycle-hooks.yml
      - run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "diag(rendering): complete step4 lifecycle hooks"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
