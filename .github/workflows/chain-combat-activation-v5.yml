name: Chain Combat Activation V5 (legacy)

on:
  workflow_dispatch:

jobs:
  chain-combat-activation-v5:
    name: Exercise one-active-recruit player economy
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run V5 PlayMode tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/Artifacts/ChainCombatV5"
          "${{ steps.unity.outputs.path }}" \
            -batchmode \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform PlayMode \
            -testFilter VoxelEngine.Tests.PlayMode.ChainCombatActivationV5Tests \
            -testResults "$GITHUB_WORKSPACE/Artifacts/ChainCombatV5/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/ChainCombatV5/unity.log"
          status=$?
          if [[ -f "$GITHUB_WORKSPACE/Artifacts/ChainCombatV5/unity.log" ]]; then cat "$GITHUB_WORKSPACE/Artifacts/ChainCombatV5/unity.log"; fi
          exit $status

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-combat-v5-${{ github.sha }}
          path: Artifacts/ChainCombatV5/
          if-no-files-found: warn
          retention-days: 14
