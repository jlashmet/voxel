name: Patch global invalidation telemetry

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/patch-global-invalidation-telemetry.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Add source-specific invalidation telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          cache = cache_path.read_text()
          old = '''        public ulong ExactMetadataRevisionRejectCount { get; private set; }\n        public ulong ExactMetadataPinRejectCount { get; private set; }\n        public ulong UploadedGeometryBytes { get; private set; }\n'''
          new = '''        public ulong ExactMetadataRevisionRejectCount { get; private set; }\n        public ulong ExactMetadataPinRejectCount { get; private set; }\n        public ulong MaterialPaletteInvalidationCount { get; private set; }\n        public ulong SurfaceCatalogueInvalidationCount { get; private set; }\n        public ulong CoatingCatalogueInvalidationCount { get; private set; }\n        public ulong ProfileBlockInvalidationCount { get; private set; }\n        public ulong UploadedGeometryBytes { get; private set; }\n'''
          if cache.count(old) != 1:
              raise SystemExit(f'cache property anchor count={cache.count(old)}')
          cache = cache.replace(old, new)

          old = '''            // Catalogue data participates in geometry. Existing meshes may remain visible while\n            // every known chunk queues a replacement built from the new immutable snapshot.\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n\n        private void SetMaterialPaletteVersion(uint version)\n        {\n            if (_materialPaletteVersion == version) return;\n            _materialPaletteVersion = version;\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n\n        private void SetCoatingCatalogue(in CoatingCatalogueView catalogue)\n'''
          new = '''            // Catalogue data participates in geometry. Existing meshes may remain visible while\n            // every known chunk queues a replacement built from the new immutable snapshot.\n            SurfaceCatalogueInvalidationCount++;\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n\n        private void SetMaterialPaletteVersion(uint version)\n        {\n            if (_materialPaletteVersion == version) return;\n            _materialPaletteVersion = version;\n            MaterialPaletteInvalidationCount++;\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n\n        private void SetCoatingCatalogue(in CoatingCatalogueView catalogue)\n'''
          if cache.count(old) != 1:
              raise SystemExit(f'cache surface/material setter anchor count={cache.count(old)}')
          cache = cache.replace(old, new)

          old = '''            _coatingCatalogue = catalogue;\n            if (_coatingCatalogue.CatalogueHash == 0)\n                _coatingCatalogue.Seal(_coatingCatalogue.Version, hash);\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n\n        private void SetProfileBlocks(IProfileBlockReadSource store)\n'''
          new = '''            _coatingCatalogue = catalogue;\n            if (_coatingCatalogue.CatalogueHash == 0)\n                _coatingCatalogue.Seal(_coatingCatalogue.Version, hash);\n            CoatingCatalogueInvalidationCount++;\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n\n        private void SetProfileBlocks(IProfileBlockReadSource store)\n'''
          if cache.count(old) != 1:
              raise SystemExit(f'cache coating setter anchor count={cache.count(old)}')
          cache = cache.replace(old, new)

          old = '''            _profileBlockVersion = version;\n            _profileBlocks = store?.Snapshot() ?? Array.Empty<ProfileBlock>();\n            RebuildProfileBlockIndex();\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n'''
          new = '''            _profileBlockVersion = version;\n            _profileBlocks = store?.Snapshot() ?? Array.Empty<ProfileBlock>();\n            RebuildProfileBlockIndex();\n            ProfileBlockInvalidationCount++;\n            foreach (int3 chunk in _known) Invalidate(chunk);\n        }\n'''
          if cache.count(old) != 1:
              raise SystemExit(f'cache profile setter anchor count={cache.count(old)}')
          cache_path.write_text(cache.replace(old, new))

          metrics_path = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs')
          metrics = metrics_path.read_text()
          old = '''        public readonly ulong Step4ExactMetadataRevisionRejects;\n        public readonly ulong Step4ExactMetadataPinRejects;\n        public readonly int RunningGeometryJobs;\n'''
          new = '''        public readonly ulong Step4ExactMetadataRevisionRejects;\n        public readonly ulong Step4ExactMetadataPinRejects;\n        public readonly ulong MaterialPaletteInvalidations;\n        public readonly ulong SurfaceCatalogueInvalidations;\n        public readonly ulong CoatingCatalogueInvalidations;\n        public readonly ulong ProfileBlockInvalidations;\n        public readonly int RunningGeometryJobs;\n'''
          if metrics.count(old) != 1:
              raise SystemExit(f'metrics field anchor count={metrics.count(old)}')
          metrics = metrics.replace(old, new)

          old = '''            Step4ExactMetadataRevisionRejects = isStep4 ? solids.ExactMetadataRevisionRejectCount : 0UL;\n            Step4ExactMetadataPinRejects = isStep4 ? solids.ExactMetadataPinRejectCount : 0UL;\n            RunningGeometryJobs = solids.RunningJobCount + water.RunningJobCount;\n'''
          new = '''            Step4ExactMetadataRevisionRejects = isStep4 ? solids.ExactMetadataRevisionRejectCount : 0UL;\n            Step4ExactMetadataPinRejects = isStep4 ? solids.ExactMetadataPinRejectCount : 0UL;\n            MaterialPaletteInvalidations = solids.MaterialPaletteInvalidationCount;\n            SurfaceCatalogueInvalidations = solids.SurfaceCatalogueInvalidationCount;\n            CoatingCatalogueInvalidations = solids.CoatingCatalogueInvalidationCount;\n            ProfileBlockInvalidations = solids.ProfileBlockInvalidationCount;\n            RunningGeometryJobs = solids.RunningJobCount + water.RunningJobCount;\n'''
          if metrics.count(old) != 1:
              raise SystemExit(f'metrics single-worker anchor count={metrics.count(old)}')
          metrics = metrics.replace(old, new)

          old = '''            ulong step4MetadataScheduled = 0, step4MetadataCompleted = 0;\n            ulong step4MetadataRevisionRejects = 0, step4MetadataPinRejects = 0;\n            long pendingUploadBytes = 0;\n'''
          new = '''            ulong step4MetadataScheduled = 0, step4MetadataCompleted = 0;\n            ulong step4MetadataRevisionRejects = 0, step4MetadataPinRejects = 0;\n            ulong materialInvalidations = 0, surfaceInvalidations = 0;\n            ulong coatingInvalidations = 0, profileInvalidations = 0;\n            long pendingUploadBytes = 0;\n'''
          if metrics.count(old) != 1:
              raise SystemExit(f'metrics aggregate local anchor count={metrics.count(old)}')
          metrics = metrics.replace(old, new)

          old = '''                    step4MetadataRevisionRejects += worker.ExactMetadataRevisionRejectCount;\n                    step4MetadataPinRejects += worker.ExactMetadataPinRejectCount;\n                }\n                uploads += worker.PendingUploadCount;\n'''
          new = '''                    step4MetadataRevisionRejects += worker.ExactMetadataRevisionRejectCount;\n                    step4MetadataPinRejects += worker.ExactMetadataPinRejectCount;\n                }\n                materialInvalidations += worker.MaterialPaletteInvalidationCount;\n                surfaceInvalidations += worker.SurfaceCatalogueInvalidationCount;\n                coatingInvalidations += worker.CoatingCatalogueInvalidationCount;\n                profileInvalidations += worker.ProfileBlockInvalidationCount;\n                uploads += worker.PendingUploadCount;\n'''
          if metrics.count(old) != 1:
              raise SystemExit(f'metrics aggregate loop anchor count={metrics.count(old)}')
          metrics = metrics.replace(old, new)

          old = '''            Step4ExactMetadataRevisionRejects = step4MetadataRevisionRejects;\n            Step4ExactMetadataPinRejects = step4MetadataPinRejects;\n            RunningGeometryJobs = running + water.RunningJobCount + schedulerRunningJobs;\n'''
          new = '''            Step4ExactMetadataRevisionRejects = step4MetadataRevisionRejects;\n            Step4ExactMetadataPinRejects = step4MetadataPinRejects;\n            MaterialPaletteInvalidations = materialInvalidations;\n            SurfaceCatalogueInvalidations = surfaceInvalidations;\n            CoatingCatalogueInvalidations = coatingInvalidations;\n            ProfileBlockInvalidations = profileInvalidations;\n            RunningGeometryJobs = running + water.RunningJobCount + schedulerRunningJobs;\n'''
          if metrics.count(old) != 1:
              raise SystemExit(f'metrics aggregate assignment anchor count={metrics.count(old)}')
          metrics_path.write_text(metrics.replace(old, new))

          test_path = Path('Assets/Tests/PlayMode/LodRenderingTests.cs')
          test = test_path.read_text()
          old = '''                      + $"pinReject:{metrics.Step4ExactMetadataPinRejects} "\n                      + $"stale:{metrics.RejectedStaleSolidBuilds}."\);\n'''
          new = '''                      + $"pinReject:{metrics.Step4ExactMetadataPinRejects} "\n                      + $"globalInvalidations=palette:{metrics.MaterialPaletteInvalidations}/"\n                      + $"surface:{metrics.SurfaceCatalogueInvalidations}/"\n                      + $"coating:{metrics.CoatingCatalogueInvalidations}/"\n                      + $"profile:{metrics.ProfileBlockInvalidations} "\n                      + $"stale:{metrics.RejectedStaleSolidBuilds}."\);\n'''
          if test.count(old) != 1:
              raise SystemExit(f'LOD diagnostic anchor count={test.count(old)}')
          test_path.write_text(test.replace(old, new))
          PY

      - name: Commit telemetry and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-global-invalidation-telemetry.yml
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
                  Assets/Tests/PlayMode/LodRenderingTests.cs
          git commit -m "Add global invalidation diagnostics"
          git push origin HEAD:refactor/async-geometry-pipeline
