name: Vegetation cutover inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          echo '=== broad asmdef refs ==='
          grep -RIn 'VoxelEngine.Vegetation"' Assets Packages --include='*.asmdef' | sort || true
          echo '=== core vegetation namespace refs ==='
          grep -RIn 'VoxelEngine.Core.Vegetation' Assets Packages --include='*.cs' --include='*.asmdef' | sort || true
          echo '=== implementation symbol consumers ==='
          grep -RInE 'TreeWorldState|ProceduralTreeDamageService|ProceduralTreeSkeletonBuilder|ProceduralTreeSkeleton' Assets Packages --include='*.cs' | sort || true
