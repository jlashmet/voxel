name: Complete StructuralIntegrity cutover bookkeeping
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          old='**Current focus:** Cutover 6 StructuralIntegrity — full Api/Runtime ownership cutover'
          new='**Current focus:** Cutover 7 Tiering — Api-only ownership cutover'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="| 6 — StructuralIntegrity | **In progress — current** | dead Net `StructuralGraph` removed; StructuralIntegrity.Api/Runtime assemblies created; `SupportField`, `CollapseDetection`, and `Connectivity` all live in Runtime with preserved Unity GUIDs and Storage.Api-only reads; `Core/Structure` is gone; parity preserved | finish final real-consumer inventory; expose only structural Api result/request values actually required; confirm any network-facing structural behavior is Api-only |\n| 7 — Tiering | **Not started** | — | full cutover |"
          new="| 6 — StructuralIntegrity | **Complete** | dead Net `StructuralGraph` removed; StructuralIntegrity.Api/Runtime assemblies created; `SupportField`, `CollapseDetection`, and `Connectivity` all live in Runtime with preserved Unity GUIDs and Storage.Api-only reads; `Core/Structure` is gone; final inventory found no production/network structural consumer, so Api remains intentionally empty rather than inventing DTOs; parity accepted | none |\n| 7 — Tiering | **Not started — current** | — | full cutover |"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="Create API types based on actual callers:\n\n```text\nStructuralIntegrity/Api/StructuralEvaluationRequest.cs\nStructuralIntegrity/Api/CollapseResult.cs\nStructuralIntegrity/Api/DetachedComponent.cs\nStructuralIntegrity/Api/StructuralChange.cs\n```\n\nThe exact result fields should carry semantic component/voxel information needed by gameplay/networking, never networking packet types."
          new="API disposition is based on actual callers, not the earlier speculative type list. Final repository inventory found no production/gameplay/network consumer of StructuralIntegrity results, so `StructuralIntegrity.Api` intentionally contains no request/result DTOs today. Add semantic values such as `StructuralEvaluationRequest`, `CollapseResult`, `DetachedComponent`, or `StructuralChange` only when a real cross-system consumer requires them; never create networking-shaped payloads merely to populate the Api folder."
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="- [x] create Api/Runtime\n- [x] move collapse/connectivity/support algorithms\n- [x] move StructuralGraph out of Net\n- [ ] expose structural result domain values"
          new="- [x] create Api/Runtime\n- [x] move collapse/connectivity/support algorithms\n- [x] move StructuralGraph out of Net\n- [x] resolve structural result-domain Api from real consumers — none exist today, so do not invent DTOs"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          marker="- [x] Connectivity/final algorithm-move slice accepted by CI at `c07ef2f318a015f7e5dc1952eeeb82d16fd81612`: 382 total / 369 passed / exact same 13 known baseline failures; `Core/Structure` is gone."
          addition=marker+"\n- [x] Final production/network consumer inventory remains empty: the structural algorithms have no production callers, Net has no StructuralIntegrity reference, and no speculative Api request/result types were added. Cutover 6 is complete."
          assert s.count(marker)==1, s.count(marker)
          s=s.replace(marker,addition,1)
          old="- [ ] network structural behavior consumes StructuralIntegrity.Api only."
          new="- [x] no network structural behavior references StructuralIntegrity.Runtime; final inventory found no live Net structural consumer, so no speculative Api dependency was added."
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/complete-structural-integrity-cutover.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Mark StructuralIntegrity cutover complete'
          git push origin HEAD:${{ github.ref_name }}
