name: Apply visible build dedup repair

on:
  push:
    branches:
      - feature/voxel-showcase-rendering-repair-v2
    paths:
      - .github/workflows/apply-visible-build-dedup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voxel-showcase-rendering-repair-v2
          fetch-depth: 0
      - name: Apply current-generation admission repair
        run: python3 .github/scripts/apply_visible_build_dedup_patch.py
      - name: Verify patch
        run: git diff --check
      - name: Commit repair and retire transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
            Assets/Tests/EditMode/SurfaceRingBuildAdmissionTests.cs
          git rm \
            .github/workflows/apply-visible-build-dedup.yml \
            .github/scripts/apply_visible_build_dedup_patch.py
          git commit -m "fix(rendering): avoid duplicate visible rebuild admission"
          git push origin HEAD:feature/voxel-showcase-rendering-repair-v2
