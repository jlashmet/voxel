name: Cutover 13 arch owner migration

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-arch-owner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 1
      - name: Route ArchLookdev authoring through Composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json
          from pathlib import Path

          def d(value):
              return base64.b64decode(value).decode()

          path = Path('Assets/Scenes/Showcase/ArchLookdev.cs')
          text = path.read_text()
          replacements = [
              ('', 'dXNpbmcgVW5pdHlFbmdpbmU7CnVzaW5nIFVuaXR5RW5naW5lLlJlbmRlcmluZzsKdXNpbmcgVm94ZWxFbmdpbmUuQ29tcG9zaXRpb247CnVzaW5nIFZveGVsRW5naW5lLlN0b3JhZ2UuQXBpOwoKdXNpbmcgVm94ZWxFbmdpbmUuU3RydWN0dXJlcy5BcGk7Cg=='),
              ('ICAgICAgICBwcml2YXRlIElWb3hlbFN0b3JhZ2VSdW50aW1lIF9zdG9yYWdlOwogICAgICAgIHByaXZhdGUgUHJvZmlsZUJsb2NrU3RvcmUgX3Byb2ZpbGVCbG9ja3M7Cg==', 'ICAgICAgICBwcml2YXRlIEFyY2hMb29rZGV2V29ybGQgX3dvcmxkOwo='),
              ('', '')
          ]
          for old64, new64 in replacements:
              old, new = d(old64), d(new64)
              if old not in text:
                  raise SystemExit('expected ArchLookdev source block not found')
              text = text.replace(old, new, 1)
          path.write_text(text)

          asm_path = Path('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef')
          asm = json.loads(asm_path.read_text())
          asm['references'] = [
              'VoxelEngine.Storage.Runtime',
              'VoxelEngine.Storage.Api',
              'VoxelEngine.Composition',
              'VoxelEngine.Terrain.Api',
              'VoxelEngine.Net.Runtime',
              'VoxelEngine.Rendering.Api',
              'VoxelEngine.Rendering.Runtime',
              'VoxelEngine.Structures.Api',
              'VoxelEngine.Structures.Runtime',
              'VoxelEngine.Tiering.Api',
              'MountingForce.WorldGen.Voxel',
              'Unity.Burst',
              'Unity.Collections',
              'Unity.Mathematics',
              'Unity.Networking.Transport',
              'VoxelEngine.Edits.Api',
              'VoxelEngine.Edits.Runtime',
              'VoxelEngine.Streaming.Runtime',
              'VoxelEngine.Vegetation.Api',
              'VoxelEngine.Terrain.Runtime',
              'VoxelEngine.Collision.Api'
          ]
          asm_path.write_text(json.dumps(asm, indent=2) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ArchLookdev.cs Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef
          git commit -m 'refactor(showcase): route arch authoring through composition'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
