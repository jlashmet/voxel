name: Cutover 13 ArchLookdev composition cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-archlookdev-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 1
      - name: Move ArchLookdev Structures runtime wiring into Composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          branch = 'refactor/system-boundaries-foundation-storage'
          arch_path = Path('Assets/Scenes/Showcase/ArchLookdev.cs')
          comp_path = Path('Assets/VoxelEngine/Composition/StructuresComposition.cs')
          workflow_path = Path('.github/workflows/cutover13-archlookdev-cutover.yml')

          arch = arch_path.read_text()
          runtime_using = 'using VoxelEngine.Structures.Runtime;\n'
          if runtime_using not in arch:
              raise SystemExit('ArchLookdev Structures.Runtime using not found')
          arch = arch.replace(runtime_using, '', 1)

          old_field = '        private ProfileBlockStore _profileBlocks;'
          new_field = '        private IProfileBlockReadSource _profileBlocks;'
          if old_field not in arch:
              raise SystemExit('ArchLookdev profile store field not found')
          arch = arch.replace(old_field, new_field, 1)

          start_marker = '        private void Rebuild()\n        {'
          end_marker = '        private void DisposeWorld()'
          start = arch.find(start_marker)
          end = arch.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('ArchLookdev Rebuild method boundaries not found')

          replacement = '''        private void Rebuild()
        {
            var watch = Stopwatch.StartNew();
            IVoxelStorageRuntime nextStorage = VoxelEngineBootstrap.CreateStorage(8, 24_000);
            const uint coatings = (1u << Coatings.Moss) | (1u << Coatings.Snow)
                                | (1u << Coatings.Soot) | (1u << Coatings.Wet);
            nextStorage.RegisterMaterial(StoneMaterial, 210, DestructionClass.Crumble,
                                         SurfaceStyles.MasonryJoint, coatings);
            nextStorage.ConfigureCoatingDecoration(
                Coatings.Moss,
                (byte)_mossDensity,
                (byte)_mossRadiusQ4,
                (byte)_mossHeightQ4,
                (byte)_mossDropQ4,
                (byte)_mossSeparation);

            uint authoringSeed = 0xA341u + (uint)_seedOffset;
            ArchBayAuthoringResult build = StructuresComposition.AuthorArchBay(
                nextStorage,
                new ArchBayAuthoringRequest
                {
                    ClearSpan = _clearSpan,
                    PierHeight = _pierHeight,
                    RingThickness = _ringThickness,
                    Depth = _depth,
                    VoussoirCount = _voussoirs,
                    JointRecessDepth = 1,
                    ProfileJointHalfWidthQ4 = (byte)_jointQ4,
                    ProfileBevelQ4 = (byte)_bevelQ4,
                    ProfileProjectionQ4 = (byte)_projectionQ4,
                    ProfileDepthQ4 = (byte)_faceDepthQ4,
                    StoneMaterial = StoneMaterial,
                    PierStyle = SurfaceStyles.MasonryJoint,
                    RingStyle = SurfaceStyles.MasonryJoint,
                    ShoulderWidth = _shoulder,
                    TopMargin = _topMargin,
                    FaceRecess = _faceRecess,
                    PlinthHeight = _plinthHeight,
                    ImpostHeight = _impostHeight,
                    DamageMode = (byte)_damage,
                    DamageSeed = authoringSeed,
                    DamageScale = (byte)_damageScale,
                    WeatheringCoating = Coatings.Moss,
                    WeatheringSeed = authoringSeed,
                    WeatheringCoverage = (byte)_mossCoverage,
                    AuthoringVoxelBudget = 2_000_000,
                });

            nextStorage.PublishAllResidentRegions();

            IVoxelStorageRuntime oldStorage = _storage;
            _storage = nextStorage;
            _profileBlocks = build.ProfileBlocks;
            var world = new RenderingWorldBinding(
                _storage.Reads,
                _storage.MaterialPresentation,
                _storage.SurfacePresentation,
                _storage.CoatingPresentation,
                _profileBlocks);
            RenderingComposition.ConfigureWorld(
                in world, _storage.Changes, 0, _buildBudgetMs, 0, farFieldEnabled: false);
            oldStorage?.Dispose();

            watch.Stop();
            _lastBuildMs = watch.Elapsed.TotalMilliseconds;
            _pendingRebuild = false;
            _lastBayWidth = build.Width;
            _lastBayHeight = build.Height;
            if (!_cameraInitialized) FrameCamera(build.Width, build.Height);
            _stateDirty = true;
        }

'''
          arch = arch[:start] + replacement + arch[end:]
          if 'VoxelEngine.Structures.Runtime' in arch:
              raise SystemExit('ArchLookdev still contains Structures.Runtime after rewrite')
          arch_path.write_text(arch)

          comp_path.write_text('''using System;
using Unity.Collections;
using Unity.Mathematics;
using VoxelEngine.Storage.Api;
using VoxelEngine.Structures.Api;
using VoxelEngine.Structures.Runtime;

namespace VoxelEngine.Composition
{
    /// <summary>Application wiring for structure planning and authoring backed by Structures.Runtime.</summary>
    public static class StructuresComposition
    {
        /// <summary>
        /// Draws the deterministic castle plan while keeping the concrete runtime planner private
        /// to Composition. The returned plan is a Structures.Api value contract.
        /// </summary>
        public static CastlePlan PlanCastle(int3 centre, uint seed) =>
            CastleBuilder.Plan(centre, seed);

        /// <summary>
        /// Authors an arch bay through the concrete Structures.Runtime implementation while the
        /// scene owns only Composition and stable Api contracts.
        /// </summary>
        public static ArchBayAuthoringResult AuthorArchBay(
            IVoxelStorageRuntime storage,
            in ArchBayAuthoringRequest request)
        {
            if (storage == null) throw new ArgumentNullException(nameof(storage));

            var profiles = new ProfileBlockStore();
            var arch = new ArchFeatureDefinition
            {
                ClearSpan = request.ClearSpan,
                PierHeight = request.PierHeight,
                RingThickness = request.RingThickness,
                Depth = request.Depth,
                VoussoirCount = request.VoussoirCount,
                JointRecessDepth = request.JointRecessDepth,
                ProfileJointHalfWidthQ4 = request.ProfileJointHalfWidthQ4,
                ProfileBevelQ4 = request.ProfileBevelQ4,
                ProfileProjectionQ4 = request.ProfileProjectionQ4,
                ProfileDepthQ4 = request.ProfileDepthQ4,
                StoneMaterial = request.StoneMaterial,
                PierStyle = request.PierStyle,
                RingStyle = request.RingStyle,
            };
            var bay = new ArchBayFeatureDefinition
            {
                Arch = arch,
                ShoulderWidth = request.ShoulderWidth,
                TopMargin = request.TopMargin,
                FaceRecess = request.FaceRecess,
                PlinthHeight = request.PlinthHeight,
                ImpostHeight = request.ImpostHeight,
                Damage = (ArchRuinDamage)request.DamageMode,
                DamageSeed = request.DamageSeed,
                DamageScale = request.DamageScale,
            };
            int3 origin = new(-bay.Width / 2, 0, 0);
            using (var primitives = new NativeList<Primitive>(bay.Metadata.MaxPrimitives, Allocator.Temp))
            {
                if (!bay.Emit(origin, primitives, profiles))
                    throw new InvalidOperationException("Arch parameters did not emit.");
                var result = PrimitiveRasteriser.Rasterise(
                    primitives.AsArray(), origin, origin + bay.Metadata.Footprint,
                    storage.Reads, storage.Mutations);
                if (result.BudgetExceeded)
                    throw new InvalidOperationException("Arch exceeded the feature budget.");
            }

            var brush = new VoxelBrush(
                storage.Reads, storage.Mutations,
                storage.MaterialAuthoring, request.AuthoringVoxelBudget);
            MasonryWeathering.CoatExposedSurfaces(
                ref brush,
                origin - 2,
                bay.Metadata.Footprint + 4,
                request.WeatheringCoating,
                request.WeatheringSeed,
                request.WeatheringCoverage,
                dripPasses: 0);

            return new ArchBayAuthoringResult(profiles, bay.Width, bay.Height);
        }
    }

    /// <summary>Composition-level inputs for authoring a concrete arch bay.</summary>
    public struct ArchBayAuthoringRequest
    {
        public int ClearSpan;
        public int PierHeight;
        public int RingThickness;
        public int Depth;
        public int VoussoirCount;
        public int JointRecessDepth;
        public byte ProfileJointHalfWidthQ4;
        public byte ProfileBevelQ4;
        public byte ProfileProjectionQ4;
        public byte ProfileDepthQ4;
        public byte StoneMaterial;
        public ushort PierStyle;
        public ushort RingStyle;
        public int ShoulderWidth;
        public int TopMargin;
        public int FaceRecess;
        public int PlinthHeight;
        public int ImpostHeight;
        public byte DamageMode;
        public uint DamageSeed;
        public byte DamageScale;
        public byte WeatheringCoating;
        public uint WeatheringSeed;
        public byte WeatheringCoverage;
        public int AuthoringVoxelBudget;
    }

    /// <summary>Stable read-facing result of a Composition-owned arch authoring pass.</summary>
    public readonly struct ArchBayAuthoringResult
    {
        public readonly IProfileBlockReadSource ProfileBlocks;
        public readonly int Width;
        public readonly int Height;

        internal ArchBayAuthoringResult(
            IProfileBlockReadSource profileBlocks,
            int width,
            int height)
        {
            ProfileBlocks = profileBlocks;
            Width = width;
            Height = height;
        }
    }
}
''')

          workflow_path.unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ArchLookdev.cs Assets/VoxelEngine/Composition/StructuresComposition.cs .github/workflows/cutover13-archlookdev-cutover.yml
          git diff --cached --check
          git commit -m "refactor: route arch lookdev through composition"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
