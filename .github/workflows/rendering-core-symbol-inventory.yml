name: Rendering Core symbol inventory
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/rendering-core-symbol-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - shell: bash
        run: |
          set -euo pipefail
          echo '=== TYPE_USAGE ==='
          grep -RInE '\b(VoxelGpuBuffers|ProbeCache)\b' Assets Packages --include='*.cs' | sort || true
          echo '=== PALETTE_METHOD_USAGE_RENDERING ==='
          grep -RInE '(Palette|palette)\.(Version|GetDefaultSurfaceStyle|GetHardness|GetDestructionClass|IsRegistered|AllowsCoating)|Catalogue\.(Get|GetJoin)|Coatings\.Get' Assets/VoxelEngine/Rendering --include='*.cs' | sort || true
          echo '=== CHANGE_JOURNAL_USAGE ==='
          grep -RInE '(VoxelChangeJournal|VoxelChangeRecord|VoxelChangeKind|ReadSince|CurrentVersion|OldestRetainedVersion)' Assets/VoxelEngine/Rendering Assets/Scenes/Showcase Assets/VoxelEngine/CI Assets/Tests --include='*.cs' | sort || true
          echo '=== WORLDVIEW_CONSTRUCTION ==='
          grep -RInE 'new VoxelWorldView|VoxelWorldView[[:space:]]*\{' Assets Packages --include='*.cs' | sort || true
