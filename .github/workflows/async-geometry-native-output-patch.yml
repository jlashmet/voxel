name: Native geometry output one-shot patch

on:
  push:
    branches:
      - refactor/async-geometry-pipeline
    paths:
      - .github/workflows/async-geometry-native-output-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Correct temporary guard literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/async_geometry_native_output_patch.py')
          s = p.read_text()
          s = s.replace('StringAssert.DoesNotContain("List<SmoothSurfaceVertex> _vertices", cache);',
                        'StringAssert.DoesNotContain("private readonly List<SmoothSurfaceVertex> _vertices", cache);')
          s = s.replace('StringAssert.DoesNotContain("List<uint> _indices", cache);',
                        'StringAssert.DoesNotContain("private readonly List<uint> _indices", cache);')
          s = s.replace("assert 'List<SmoothSurfaceVertex> _vertices' not in cache_path.read_text()",
                        "assert 'private readonly List<SmoothSurfaceVertex> _vertices' not in cache_path.read_text()")
          s = s.replace("assert 'List<uint> _indices' not in cache_path.read_text()",
                        "assert 'private readonly List<uint> _indices' not in cache_path.read_text()")
          p.write_text(s)
          PY
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_native_output_patch.py
      - name: Static guards
        run: |
          ! grep -q 'private readonly List<SmoothSurfaceVertex> _vertices' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          ! grep -q 'private readonly List<uint> _indices' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs
          grep -q 'UploadVertices(NativeArray<SmoothSurfaceVertex>' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceGeometryArena.cs
      - name: Commit renderer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/SurfaceGeometryArena.cs \
                  Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
                  Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
          git commit -m 'Keep solid geometry output native through GPU publication'
          git push origin HEAD:refactor/async-geometry-pipeline
