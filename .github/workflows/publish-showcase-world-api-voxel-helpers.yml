name: Publish ShowcaseWorld API voxel helpers
on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/publish-showcase-world-api-voxel-helpers.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Route simple ShowcaseWorld voxel calls through Storage.Api
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          s=p.read_text()

          replacements=[
          ('''                if (VoxelAccess.SetVoxel(ref _table, ref _pool, voxel,\n                                         VoxelDimensions.MaterialEmpty))\n                    MarkDirty(voxel);''',
           '''                if (SetMaterialApi(voxel, VoxelGrid.MaterialEmpty))\n                    MarkDirty(voxel);'''),
          ('''            var voxels = BuildBrushes.PlaceSphere(centre, radius, VoxelDimensions.MaterialEmpty, Seed);''',
           '''            var voxels = BuildBrushes.PlaceSphere(centre, radius, VoxelGrid.MaterialEmpty, Seed);'''),
          ('''                var existing = VoxelAccess.GetVoxel(ref _table, in _pool, v);\n                if (existing == VoxelDimensions.MaterialEmpty) continue;\n                if (!_materialSimulation.IsDestructible(existing)) continue;\n\n                var d = v - centre;''',
           '''                if (!TryReadCellApi(v, out VoxelCell cell)) continue;\n                byte existing = cell.BaseMaterialId;\n                if (existing == VoxelGrid.MaterialEmpty) continue;\n                if (!_materialSimulation.IsDestructible(existing)) continue;\n\n                var d = v - centre;'''),
          ('''                VoxelCell cell = VoxelAccess.GetCell(ref _table, in _pool, v);\n                removed.Add(new FallingVoxel''',
           '''                removed.Add(new FallingVoxel'''),
          ('''            byte material = VoxelAccess.GetVoxel(ref _table, in _pool, voxel);\n            if (material == VoxelDimensions.MaterialEmpty || !_materialSimulation.IsDestructible(material))\n                return 0;\n            VoxelCell cell = VoxelAccess.GetCell(ref _table, in _pool, voxel);''',
           '''            if (!TryReadCellApi(voxel, out VoxelCell cell)) return 0;\n            byte material = cell.BaseMaterialId;\n            if (material == VoxelGrid.MaterialEmpty || !_materialSimulation.IsDestructible(material))\n                return 0;'''),
          ('''                if (VoxelAccess.IsSolid(ref _table, in _pool, new int3(x, y, z)))\n                    return (y + 1) * VoxelSize + halfHeightMetres;''',
           '''                if (IsSolidApi(new int3(x, y, z)))\n                    return (y + 1) * VoxelSize + halfHeightMetres;'''),
          ('''                if (VoxelAccess.SetVoxel(ref _table, ref _pool, voxels[i], material))\n                {''',
           '''                if (SetMaterialApi(voxels[i], material))\n                {'''),
          ('''            var rc = new int3(voxel.x >> VoxelDimensions.RegionVoxelEdgeLog2,\n                              voxel.y >> VoxelDimensions.RegionVoxelEdgeLog2,\n                              voxel.z >> VoxelDimensions.RegionVoxelEdgeLog2);''',
           '''            var rc = new int3(voxel.x >> VoxelGrid.RegionVoxelEdgeLog2,\n                              voxel.y >> VoxelGrid.RegionVoxelEdgeLog2,\n                              voxel.z >> VoxelGrid.RegionVoxelEdgeLog2);'''),
          ('''                if (VoxelAccess.SetVoxel(ref _table, ref _pool, v, material)) MarkDirty(v);''',
           '''                if (SetMaterialApi(v, material)) MarkDirty(v);'''),
          ('''                if (VoxelAccess.SetVoxel(ref _table, ref _pool, voxels[i], material)) MarkDirty(voxels[i]);''',
           '''                if (SetMaterialApi(voxels[i], material)) MarkDirty(voxels[i]);'''),
          ('''                byte material = VoxelAccess.GetVoxel(ref _table, in _pool, new int3(wx, y, wz));\n                if (material != VoxelDimensions.MaterialEmpty) return y;''',
           '''                if (ReadMaterialApi(new int3(wx, y, wz)) != VoxelGrid.MaterialEmpty) return y;'''),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Missing ShowcaseWorld API migration anchor:\n'+old[:220])
              s=s.replace(old,new,1)

          marker='''        /// <summary>\n        /// Publishes the exact changed cell. The scheduler expands the extraction halo.\n        /// </summary>\n        private void MarkDirty(int3 voxel)\n'''
          helpers='''        private bool TryReadCellApi(int3 voxel, out VoxelCell cell) =>\n            _readSource.TryRead(voxel, out cell);\n\n        private byte ReadMaterialApi(int3 voxel) =>\n            TryReadCellApi(voxel, out VoxelCell cell)\n                ? cell.BaseMaterialId\n                : VoxelGrid.MaterialEmpty;\n\n        private bool IsSolidApi(int3 voxel) =>\n            TryReadCellApi(voxel, out VoxelCell cell) && cell.IsSolid;\n\n        /// <summary>\n        /// Voxel-level compatibility helper implemented entirely through Storage.Api. Using the\n        /// cell-authoring block path preserves the legacy first-write region creation behavior,\n        /// while Storage still owns mixed materialisation, occupancy, metadata and collapse.\n        /// </summary>\n        private bool SetMaterialApi(int3 voxel, byte material)\n        {\n            int3 worldBlock = voxel >> VoxelReadGrid.BlockEdgeLog2;\n            if (!_mutationStore.TryBeginCellBlock(worldBlock, false, out VoxelBlockMutation mutation))\n                return false;\n\n            int3 inner = voxel & VoxelReadGrid.BlockEdgeMask;\n            int voxelIndex = inner.x\n                           | (inner.y << VoxelReadGrid.BlockEdgeLog2)\n                           | (inner.z << (VoxelReadGrid.BlockEdgeLog2 * 2));\n            bool payloadChanged = mutation.SetMaterial(voxelIndex, material);\n            return _mutationStore.CompletePartialBlock(ref mutation, payloadChanged);\n        }\n\n'''
          if 'private bool SetMaterialApi(' not in s:
              if marker not in s: raise SystemExit('MarkDirty helper insertion marker missing')
              s=s.replace(marker,helpers+marker,1)

          required=['SetMaterialApi(voxel, VoxelGrid.MaterialEmpty)',
                    'TryReadCellApi(v, out VoxelCell cell)',
                    'IsSolidApi(new int3(x, y, z))',
                    'SetMaterialApi(voxels[i], material)',
                    'ReadMaterialApi(new int3(wx, y, wz))',
                    'VoxelGrid.RegionVoxelEdgeLog2']
          missing=[t for t in required if t not in s]
          if missing: raise SystemExit('API helper migration incomplete: '+', '.join(missing))
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs
          git diff --cached --check
          git commit -m 'refactor(showcase): route simple voxel access through Storage Api'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
