name: One-shot Trace Neighbourhood Court Program

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/one-shot-trace-neighbourhood-court.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Trace court definition and raw bytecode construction
        shell: bash
        run: |
          root='Packages/com.mountingforce.worldgen/Runtime/Voxel'
          echo '=== neighbourhood/court/forecourt/plaza matches ==='
          grep -R -n -i -C 18 -E 'neighbourhood|court|forecourt|plaza' "$root" --include='*.cs' || true
          echo '=== manual ShapeOp arrays in matching files ==='
          files=$(grep -R -l -i -E 'neighbourhood|court|forecourt|plaza' "$root" --include='*.cs' || true)
          for f in $files; do
            echo "--- $f ---"
            grep -n -C 14 -E 'ShapeOp\.Emit|programLength|ProgramLength|new\[\]|new\[|Program\[' "$f" || true
          done
      - name: Self-clean
        run: |
          rm .github/workflows/one-shot-trace-neighbourhood-court.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-trace-neighbourhood-court.yml
          git commit -m "chore: remove neighbourhood court diagnostic"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
