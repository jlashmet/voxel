name: Fix Vegetation parents count
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs')
          text = p.read_text()
          old = 'if ((uint)current >= (uint)parents.Length) break;'
          new = 'if ((uint)current >= (uint)parents.Count) break;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale parents.Length, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/fix-vegetation-parents-count.yml
          git diff --check
          git diff -- Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs
          git commit -m 'fix: use read-only branch parent count'
          git push origin HEAD:${{ github.ref_name }}
