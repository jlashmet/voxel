name: Publish ShowcaseWorld test API repair v2

on:
  push:
    paths:
      - .github/workflows/publish-showcase-world-test-api-repair-v2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0
      - name: Repair tests against public Storage API
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin refactor/system-boundaries-foundation-storage
          python3 - <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text)

          # Public, representation-independent storage pressure for diagnostic assertions.
          p='Assets/Scenes/Showcase/ShowcaseWorld.cs'; s=Path(p).read_text()
          if 'public StoragePressure StoragePressure' not in s:
              anchor='        public IVoxelChangeSource Changes => _changes;\n'
              if anchor not in s: raise SystemExit('ShowcaseWorld Changes anchor missing')
              prop='''        public IVoxelChangeSource Changes => _changes;\n        public StoragePressure StoragePressure\n        {\n            get\n            {\n                _residencyStore.Refresh(in _table, in _pool);\n                return _residencyStore.Pressure;\n            }\n        }\n'''
              s=s.replace(anchor,prop,1)
          write(p,s)

          # Falling physics: API full-cell mutation + API reads.
          p='Assets/Tests/PlayMode/FallingVoxelPhysicsTests.cs'; s=Path(p).read_text()
          s=s.replace('using VoxelEngine.Storage.Runtime;\n','')
          s=s.replace('VoxelDimensions.MaterialEmpty','VoxelGrid.MaterialEmpty')
          s=re.sub(r'\s*VoxelAccess\.SetCell\(ref world\.Table, ref world\.Pool,\s*column \+ new int3\(0, y, 0\), in cell\);',
                   '\n                    SetCell(world, column + new int3(0, y, 0), in cell);',s,count=1)
          s=re.sub(r'        private static void Set\(ShowcaseWorld world, int3 voxel, byte material\) =>\s*VoxelAccess\.SetVoxel\(ref world\.Table, ref world\.Pool, voxel, material\);\s*\n\s*private static byte Get\(ShowcaseWorld world, int3 voxel\) =>\s*VoxelAccess\.GetVoxel\(ref world\.Table, in world\.Pool, voxel\);',
          '''        private static bool SetCell(ShowcaseWorld world, int3 voxel, in VoxelCell cell)\n        {\n            IRegionMutationStore mutations = world.MutationStorage;\n            int3 worldBlock = voxel >> VoxelReadGrid.BlockEdgeLog2;\n            if (!mutations.TryBeginCellBlock(worldBlock, false, out VoxelBlockMutation mutation))\n                return false;\n            int3 inner = voxel & VoxelReadGrid.BlockEdgeMask;\n            int voxelIndex = inner.x | (inner.y << VoxelReadGrid.BlockEdgeLog2)\n                           | (inner.z << (VoxelReadGrid.BlockEdgeLog2 * 2));\n            bool changed = mutation.SetCell(voxelIndex, in cell);\n            return mutations.CompletePartialBlock(ref mutation, changed);\n        }\n\n        private static void Set(ShowcaseWorld world, int3 voxel, byte material)\n        {\n            var cell = new VoxelCell { BaseMaterialId = material };\n            SetCell(world, voxel, in cell);\n        }\n\n        private static byte Get(ShowcaseWorld world, int3 voxel) =>\n            world.SurfaceQuery.TryRead(voxel, out VoxelCell cell)\n                ? cell.BaseMaterialId : VoxelGrid.MaterialEmpty;''',s,count=1)
          if 'world.Table' in s or 'world.Pool' in s: raise SystemExit('Falling test physical refs remain')
          write(p,s)

          # Spawn reads via public surface query.
          p='Assets/Tests/PlayMode/ShowcaseSpawnTests.cs'; s=Path(p).read_text()
          s=s.replace('using VoxelEngine.Storage.Runtime;\n','using VoxelEngine.Storage.Api;\n')
          s=re.sub(r'byte material = VoxelAccess\.GetVoxel\(ref world\.Table, in world\.Pool,\s*new int3\(x, y, z\)\);',
                   'byte material = ReadMaterial(world, new int3(x, y, z));',s,count=1)
          s=s.replace('VoxelDimensions.MaterialEmpty','VoxelGrid.MaterialEmpty')
          s=re.sub(r'byte ground = VoxelAccess\.GetVoxel\(ref world\.Table, in world\.Pool,\s*new int3\(centreX, surface, centreZ\)\);',
                   'byte ground = ReadMaterial(world, new int3(centreX, surface, centreZ));',s,count=1)
          if 'private static byte ReadMaterial(' not in s:
              idx=s.rfind('\n    }\n}')
              if idx < 0: raise SystemExit('ShowcaseSpawn class-end anchor missing')
              helper='''\n\n        private static byte ReadMaterial(ShowcaseWorld world, int3 voxel) =>\n            world.SurfaceQuery.TryRead(voxel, out VoxelCell cell)\n                ? cell.BaseMaterialId : VoxelGrid.MaterialEmpty;'''
              s=s[:idx]+helper+s[idx:]
          if 'world.Table' in s or 'world.Pool' in s or 'VoxelAccess.' in s: raise SystemExit('Spawn physical refs remain')
          write(p,s)

          # Castle access helper reads via public surface query.
          p='Assets/Tests/PlayMode/CastleAccessTests.cs'; s=Path(p).read_text()
          s=s.replace('using VoxelEngine.Storage.Runtime;\n','')
          if 'using VoxelEngine.Storage.Api;\n' not in s:
              s=s.replace('using VoxelEngine.Showcase;\n','using VoxelEngine.Storage.Api;\nusing VoxelEngine.Showcase;\n',1)
          s=re.sub(r'private static byte Get\(ShowcaseWorld world, int x, int y, int z\) =>\s*VoxelAccess\.GetVoxel\(ref world\.Table, in world\.Pool, new int3\(x, y, z\)\);',
                   '''private static byte Get(ShowcaseWorld world, int x, int y, int z) =>\n            world.SurfaceQuery.TryRead(new int3(x, y, z), out VoxelCell cell)\n                ? cell.BaseMaterialId : VoxelGrid.MaterialEmpty;''',s,count=1)
          if 'world.Table' in s or 'world.Pool' in s or 'VoxelAccess.' in s: raise SystemExit('CastleAccess physical refs remain')
          write(p,s)

          # Screenshot allocator invariant uses bytes, not private pool slots.
          p='Assets/Tests/PlayMode/CastleScreenshotTests.cs'; s=Path(p).read_text()
          if 'using VoxelEngine.Storage.Api;\n' not in s:
              s=s.replace('using VoxelEngine.Showcase;\n','using VoxelEngine.Storage.Api;\nusing VoxelEngine.Showcase;\n',1)
          s=re.sub(r'Debug\.Log\(\$"### CASTLE voxels=\{world\.CastleVoxels:N0\} bricks=\{world\.Pool\.AllocatedCount:N0\}" \+\s*\$" of \{world\.Pool\.Capacity:N0\}"\);',
                   '''StoragePressure castlePressure = world.StoragePressure;\n            Debug.Log($"### CASTLE voxels={world.CastleVoxels:N0} storage={castlePressure.UsedBytes:N0}" +\n                      $" of {castlePressure.CapacityBytes:N0} bytes");''',s,count=1)
          s=s.replace('int allocatedBeforeCapture = world.Pool.AllocatedCount;',
                      'long usedBytesBeforeCapture = world.StoragePressure.UsedBytes;')
          s=s.replace('Assert.AreEqual(allocatedBeforeCapture, world.Pool.AllocatedCount,\n                        "Rendering a cutaway must not allocate, free, or carve authoritative bricks.");',
                      'Assert.AreEqual(usedBytesBeforeCapture, world.StoragePressure.UsedBytes,\n                        "Rendering a cutaway must not allocate, free, or carve authoritative storage.");')
          if 'world.Table' in s or 'world.Pool' in s: raise SystemExit('CastleScreenshot physical refs remain')
          write(p,s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/Scenes/Showcase/ShowcaseWorld.cs Assets/Tests/PlayMode/FallingVoxelPhysicsTests.cs Assets/Tests/PlayMode/ShowcaseSpawnTests.cs Assets/Tests/PlayMode/CastleAccessTests.cs Assets/Tests/PlayMode/CastleScreenshotTests.cs
          git diff --cached --check
          git commit -m 'test(showcase): consume public storage capabilities'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
