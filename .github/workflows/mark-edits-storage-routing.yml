name: Mark accepted Edits Storage routing

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Mark accepted checklist item
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text=p.read_text()
          old='- [ ] route mutations through Storage.Api'
          new='- [x] route mutations through Storage.Api'
          if text.count(old)!=1:
              raise SystemExit(f'expected one unchecked Storage routing item, found {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
          git rm .github/workflows/mark-edits-storage-routing.yml
          git diff --check
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Mark Edits Storage API routing complete'
          git push origin HEAD:${{ github.ref_name }}
