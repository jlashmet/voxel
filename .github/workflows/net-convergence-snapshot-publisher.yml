name: Net convergence snapshot publisher
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          conv = 'Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs'
          replace_once(conv, 'using VoxelEngine.Core.Storage;\n', 'using VoxelEngine.Storage.Api;\n')
          replace_once(conv,
          '''        public int EmitHashes(\n            uint serverTick,\n            ref RegionTable table,\n            in BrickPool pool,\n            RegionSubscriptionIndex subscriptions,\n            ServerNetworkRuntime network)\n        {\n            if (subscriptions == null) throw new ArgumentNullException(nameof(subscriptions));\n            if (network == null) throw new ArgumentNullException(nameof(network));\n            if (serverTick == 0) return 0;\n\n            PruneCheckpoints(serverTick);\n            NativeArray<int3> regions = table.GetResidentCoords(Allocator.Temp);\n''',
          '''        public int EmitHashes(\n            uint serverTick,\n            IRegionReadSource regionSource,\n            IRegionSnapshotSource snapshotSource,\n            RegionSubscriptionIndex subscriptions,\n            ServerNetworkRuntime network)\n        {\n            if (regionSource == null) throw new ArgumentNullException(nameof(regionSource));\n            if (snapshotSource == null) throw new ArgumentNullException(nameof(snapshotSource));\n            if (subscriptions == null) throw new ArgumentNullException(nameof(subscriptions));\n            if (network == null) throw new ArgumentNullException(nameof(network));\n            if (serverTick == 0) return 0;\n\n            PruneCheckpoints(serverTick);\n            NativeArray<int3> regions = regionSource.GetResidentRegionCoords(Allocator.Temp);\n''')
          replace_once(conv,
          '''                    _subscriberScratch.Clear();\n                    subscriptions.AddSubscribers(coord, _subscriberScratch);\n                    if (_subscriberScratch.Count == 0) continue;\n                    if (!table.TryGetRegion(coord, out Region region) || !region.BrickRefs.IsCreated) continue;\n\n                    if (!SemanticRegionSnapshotCodec.TryEncode(\n                            in region,\n                            in pool,\n                            SemanticRegionSnapshotCodec.DefaultMaxSnapshotBytes,\n                            out byte[] snapshot) ||\n                        _retainedSnapshotBytes + snapshot.Length > MaxRetainedSnapshotBytes)\n                    {\n                        HashesSkippedNoSnapshot++;\n                        continue;\n                    }\n\n                    uint semanticHash = SemanticRegionHasher.HashRegion(in region, in pool);\n''',
          '''                    _subscriberScratch.Clear();\n                    subscriptions.AddSubscribers(coord, _subscriberScratch);\n                    if (_subscriberScratch.Count == 0) continue;\n\n                    RegionSnapshotCaptureResult capture = snapshotSource.CaptureSemanticSnapshot(\n                        coord,\n                        RegionSemanticSnapshotLimits.DefaultMaxSnapshotBytes,\n                        out RegionSemanticSnapshot semanticSnapshot);\n                    if (capture == RegionSnapshotCaptureResult.NotResident)\n                        continue;\n                    if (capture != RegionSnapshotCaptureResult.Ok ||\n                        _retainedSnapshotBytes + semanticSnapshot.Bytes.Length > MaxRetainedSnapshotBytes)\n                    {\n                        HashesSkippedNoSnapshot++;\n                        continue;\n                    }\n\n                    byte[] snapshot = semanticSnapshot.Bytes;\n                    uint semanticHash = semanticSnapshot.SemanticHash;\n''')

          session = 'Assets/VoxelEngine/Net/Server/AuthoritativeServerSession.cs'
          replace_once(session,
          '''            _network.FlushReplication();\n            _convergence.EmitHashes(\n                serverTick,\n                ref table,\n                in pool,\n                _network.Replication.Subscriptions,\n                _network);\n\n            var storageReadSource = new RegionReadSource(in table, in pool);\n''',
          '''            _network.FlushReplication();\n            var storageReadSource = new RegionReadSource(in table, in pool);\n            _convergence.EmitHashes(\n                serverTick,\n                storageReadSource,\n                storageReadSource,\n                _network.Replication.Subscriptions,\n                _network);\n\n''')
          PY
          git diff --check
          grep -q 'IRegionSnapshotSource' Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs
          ! grep -q 'VoxelEngine.Core.Storage' Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs
          git rm .github/workflows/net-convergence-snapshot-publisher.yml
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Net/Server/ServerConvergenceManager.cs Assets/VoxelEngine/Net/Server/AuthoritativeServerSession.cs
          git add -u .github/workflows
          git commit -m 'net: consume Storage snapshots for convergence'
          git push origin HEAD:${{ github.ref_name }}
