name: Restructuring terrain generator imports

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/restructuring-terrain-generator-imports.yml

permissions:
  contents: write

jobs:
  restore-generator-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Restore Core Terrain namespace only for generator consumers
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in sorted(Path('.').rglob('*.cs')):
              text = path.read_text()
              if not re.search(r'\bTerrainGenerator\.', text):
                  continue
              if 'namespace VoxelEngine.Core.Terrain' in text:
                  continue
              if 'using VoxelEngine.Core.Terrain;' in text:
                  continue

              lines = text.splitlines(keepends=True)
              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith('using '):
                      insert_at = i + 1
                  elif insert_at:
                      break
              lines.insert(insert_at, 'using VoxelEngine.Core.Terrain;\n')
              path.write_text(''.join(lines))
              changed.append(path)

          if not changed:
              raise SystemExit('no TerrainGenerator consumers needed Core.Terrain restored')

          print('Restored generator namespace in:')
          for path in changed:
              print('  ', path)

      - name: Commit generator import repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: retain terrain generator imports during api cutover"
          git push origin HEAD:refactor/system-boundaries-foundation-storage
