name: Add async geometry step-4 phase diagnostics

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths:
      - .github/workflows/async-geometry-step4-phase-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 1
      - name: Add allocation-free coarse worker phase telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs')
          text = cache.read_text()
          old = '''        public int RunningJobCount => _exactMetadataJobScheduled || _exactClassificationJobScheduled\n                                   || _hlodJobScheduled || _densityJobScheduled\n                                   || _topologyJobScheduled || _facetedMaskJobScheduled\n                                   || _transitionJobScheduled\n                                    ? 1 : 0;\n        public int PendingUploadCount => _pendingUpload ? 1 : 0;'''
          new = '''        public int RunningJobCount => _exactMetadataJobScheduled || _exactClassificationJobScheduled\n                                   || _hlodJobScheduled || _densityJobScheduled\n                                   || _topologyJobScheduled || _facetedMaskJobScheduled\n                                   || _transitionJobScheduled\n                                    ? 1 : 0;\n        // Allocation-free diagnostics used by renderer telemetry/tests to distinguish a genuinely\n        // active coarse build from a known chunk that fell out of the work lifecycle. Bits are\n        // deliberately stable and local to this cache; they do not influence scheduling.\n        public int ActiveBuildPhase => _build.Active ? _build.Phase : -1;\n        public uint ActiveJobMask =>\n            (_exactMetadataJobScheduled ? 1u << 0 : 0u)\n          | (_exactClassificationJobScheduled ? 1u << 1 : 0u)\n          | (_hlodJobScheduled ? 1u << 2 : 0u)\n          | (_densityJobScheduled ? 1u << 3 : 0u)\n          | (_topologyJobScheduled || _topologyCompactJobScheduled ? 1u << 4 : 0u)\n          | (_facetedMaskJobScheduled || _facetedMergeJobScheduled ? 1u << 5 : 0u)\n          | (_transitionJobScheduled ? 1u << 6 : 0u);\n        public int PendingUploadCount => _pendingUpload ? 1 : 0;'''
          if text.count(old) != 1:
              raise SystemExit('RunningJobCount property block mismatch')
          cache.write_text(text.replace(old, new, 1))

          scheduler = Path('Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs')
          text = scheduler.read_text()
          old = '''        public readonly int RunningSolidJobs;\n        public readonly int RunningGeometryJobs;'''
          new = '''        public readonly int RunningSolidJobs;\n        public readonly int Step4KnownChunks;\n        public readonly int Step4ResidentChunks;\n        public readonly int Step4DirtyChunks;\n        public readonly int Step4MissingVisibleChunks;\n        public readonly int Step4RunningJobs;\n        public readonly uint Step4BuildPhaseMask;\n        public readonly uint Step4ActiveJobMask;\n        public readonly int RunningGeometryJobs;'''
          if text.count(old) != 1:
              raise SystemExit('metrics field insertion mismatch')
          text = text.replace(old, new, 1)

          old = '''            RunningSolidJobs = solids.RunningJobCount;\n            RunningGeometryJobs = solids.RunningJobCount + water.RunningJobCount;'''
          new = '''            RunningSolidJobs = solids.RunningJobCount;\n            bool isStep4 = solids.SourceStep == 4;\n            Step4KnownChunks = isStep4 ? solids.KnownCount : 0;\n            Step4ResidentChunks = isStep4 ? solids.ResidentCount : 0;\n            Step4DirtyChunks = isStep4 ? solids.DirtyCount : 0;\n            Step4MissingVisibleChunks = isStep4 ? solids.MissingVisibleCount : 0;\n            Step4RunningJobs = isStep4 ? solids.RunningJobCount : 0;\n            Step4BuildPhaseMask = isStep4 && solids.ActiveBuildPhase >= 0\n                ? 1u << solids.ActiveBuildPhase : 0u;\n            Step4ActiveJobMask = isStep4 ? solids.ActiveJobMask : 0u;\n            RunningGeometryJobs = solids.RunningJobCount + water.RunningJobCount;'''
          if text.count(old) != 1:
              raise SystemExit('single-worker metrics assignment mismatch')
          text = text.replace(old, new, 1)

          old = '''            int known = 0, resident = 0, dirty = 0, missing = 0, running = 0, uploads = 0;\n            long pendingUploadBytes = 0;'''
          new = '''            int known = 0, resident = 0, dirty = 0, missing = 0, running = 0, uploads = 0;\n            int step4Known = 0, step4Resident = 0, step4Dirty = 0, step4Missing = 0, step4Running = 0;\n            uint step4BuildPhaseMask = 0, step4ActiveJobMask = 0;\n            long pendingUploadBytes = 0;'''
          if text.count(old) != 1:
              raise SystemExit('aggregate metric locals mismatch')
          text = text.replace(old, new, 1)

          old = '''                running += worker.RunningJobCount;\n                uploads += worker.PendingUploadCount;'''
          new = '''                running += worker.RunningJobCount;\n                if (worker.SourceStep == 4)\n                {\n                    step4Known += worker.KnownCount;\n                    step4Resident += worker.ResidentCount;\n                    step4Dirty += worker.DirtyCount;\n                    step4Missing += worker.MissingVisibleCount;\n                    step4Running += worker.RunningJobCount;\n                    if (worker.ActiveBuildPhase >= 0)\n                        step4BuildPhaseMask |= 1u << worker.ActiveBuildPhase;\n                    step4ActiveJobMask |= worker.ActiveJobMask;\n                }\n                uploads += worker.PendingUploadCount;'''
          if text.count(old) != 1:
              raise SystemExit('aggregate worker loop mismatch')
          text = text.replace(old, new, 1)

          old = '''            RunningSolidJobs = running;\n            RunningGeometryJobs = running + water.RunningJobCount + schedulerRunningJobs;'''
          new = '''            RunningSolidJobs = running;\n            Step4KnownChunks = step4Known;\n            Step4ResidentChunks = step4Resident;\n            Step4DirtyChunks = step4Dirty;\n            Step4MissingVisibleChunks = step4Missing;\n            Step4RunningJobs = step4Running;\n            Step4BuildPhaseMask = step4BuildPhaseMask;\n            Step4ActiveJobMask = step4ActiveJobMask;\n            RunningGeometryJobs = running + water.RunningJobCount + schedulerRunningJobs;'''
          if text.count(old) != 1:
              raise SystemExit('aggregate metrics assignment mismatch')
          scheduler.write_text(text.replace(old, new, 1))

          lod = Path('Assets/Tests/PlayMode/LodRenderingTests.cs')
          text = lod.read_text()
          old = '''                      + $\"pressureEvictions={metrics.SolidArenaPressureEvictions} \"\n                      + $\"capacityEvents={metrics.SolidCapacityPressureEvents}.\");'''
          new = '''                      + $\"pressureEvictions={metrics.SolidArenaPressureEvictions} \"\n                      + $\"capacityEvents={metrics.SolidCapacityPressureEvents} \"\n                      + $\"step4=known:{metrics.Step4KnownChunks}/resident:{metrics.Step4ResidentChunks}/\"\n                      + $\"dirty:{metrics.Step4DirtyChunks}/missing:{metrics.Step4MissingVisibleChunks}/\"\n                      + $\"jobs:{metrics.Step4RunningJobs}/phaseMask:0x{metrics.Step4BuildPhaseMask:X}/\"\n                      + $\"jobMask:0x{metrics.Step4ActiveJobMask:X}.\");'''
          if text.count(old) != 1:
              raise SystemExit('visual convergence failure diagnostics mismatch')
          lod.write_text(text.replace(old, new, 1))
          PY
      - name: Commit diagnostics and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jlashmet"
          git config user.email "jlashmet@gmail.com"
          git rm .github/workflows/async-geometry-step4-phase-diagnostics.yml
          git add \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/CpuTransvoxelChunkCache.cs \
            Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs \
            Assets/Tests/PlayMode/LodRenderingTests.cs
          git commit -m "diag(rendering): expose coarse build phase state"
          git push origin HEAD:refactor/async-geometry-pipeline
