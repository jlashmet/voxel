name: Vegetation TreeInstance alias fix
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in ('Assets/VoxelEngine/Vegetation/TreeWorldState.cs','Assets/VoxelEngine/Vegetation/ProceduralTreeDamageService.cs'):
              p=Path(path); s=p.read_text()
              marker='using VoxelEngine.Vegetation.Api;\n'
              alias='using TreeInstance = VoxelEngine.Vegetation.Api.TreeInstance;\n'
              if marker not in s: raise SystemExit(f'missing Api using in {path}')
              if alias not in s: s=s.replace(marker,marker+alias,1)
              p.write_text(s)
          PY
          git rm .github/workflows/vegetation-treeinstance-alias-fix.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation/TreeWorldState.cs Assets/VoxelEngine/Vegetation/ProceduralTreeDamageService.cs
          git commit -m 'Fix Vegetation Api TreeInstance aliases'
          git push origin HEAD:${{ github.ref_name }}
