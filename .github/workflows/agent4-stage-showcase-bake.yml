name: Agent 4 Stage Reconciled Showcase Bake

on:
  push:
    branches: ['fixes/agent-4']
    paths: ['.github/workflows/agent4-stage-showcase-bake.yml']

permissions:
  actions: read
  contents: write

jobs:
  stage:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Download exact accepted bake artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/agent4-reconciled-bake"
          rm -rf "$work"
          mkdir -p "$work"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10040812696/zip" \
            -o "$work/artifact.zip"
          unzip -p "$work/artifact.zip" AcceptedShowcaseBake/ShowcaseWorld.bytes > "$work/ShowcaseWorld.bytes"
          unzip -p "$work/artifact.zip" AcceptedShowcaseBake/ShowcaseWorld.manifest.txt > "$work/ShowcaseWorld.manifest.txt"
          test "$(wc -c < "$work/ShowcaseWorld.bytes" | tr -d ' ')" = "13310800"
          actual="$(shasum -a 256 "$work/ShowcaseWorld.bytes" | awk '{print $1}')"
          test "$actual" = "c0f6f5bb0651bac0088b1e12d3a16956816fc62f5fe2dcb83461f9ba7c60cf3b"
          grep -Fx 'version=1' "$work/ShowcaseWorld.manifest.txt"
          grep -Fx 'contentSignature=BE8FDFF3' "$work/ShowcaseWorld.manifest.txt"
          grep -Fx 'payloadSha256=c0f6f5bb0651bac0088b1e12d3a16956816fc62f5fe2dcb83461f9ba7c60cf3b' "$work/ShowcaseWorld.manifest.txt"
          cp "$work/ShowcaseWorld.manifest.txt" Assets/Resources/VoxelShowcase/ShowcaseWorld.manifest.txt
          python3 tools/binary_transport/stage_binary.py \
            --input "$work/ShowcaseWorld.bytes" \
            --target Assets/Resources/VoxelShowcase/ShowcaseWorld.bytes \
            --job-id agent4-mountain-bake-c0f6f5bb0651 \
            --overwrite \
            --commit-message 'Update reconciled Mountain Dragon showcase bake'

      - name: Commit transport payload and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent4-stage-showcase-bake.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .binary-transport/agent4-mountain-bake-c0f6f5bb0651 \
            Assets/Resources/VoxelShowcase/ShowcaseWorld.manifest.txt \
            .github/workflows/agent4-stage-showcase-bake.yml
          git commit -m 'Stage reconciled Mountain Dragon showcase bake'
          git push origin "HEAD:fixes/agent-4"
