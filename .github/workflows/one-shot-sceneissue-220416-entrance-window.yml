name: One-shot SceneIssue 220416 entrance window validation

on:
  push:
    branches: [fixes]
    paths:
      - .github/workflows/one-shot-sceneissue-220416-entrance-window.yml

jobs:
  editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixes
          clean: true
          fetch-depth: 1

      - name: Resolve Unity
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          test -x "$UNITY_PATH"
          echo "path=$UNITY_PATH" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 120))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            sleep 5
          done

      - name: Run entrance-window regression
        shell: bash
        env:
          TEST_FILTER: VoxelEngine.Tests.EditMode.KentridgeGeneratedEntranceAlignmentTests.MedrareHouseKeepsBothFrontageWindowsClearOfEntranceCanopy
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/SceneIssue220416"
          mkdir -p "$ROOT"
          status=0
          UNITY_MAX_RSS_MB=14336 UNITY_MAX_MINUTES=6 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" tools/unity-run.sh \
            -batchmode -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" -runTests -testPlatform EditMode \
            -testFilter "$TEST_FILTER" \
            -testResults "$ROOT/results.xml" -logFile "$ROOT/unity.log" || status=$?

          if [[ -s "$ROOT/results.xml" ]]; then
            python3 - "$ROOT/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for case in root.findall('.//test-case'):
              print(f"{case.get('result')}: {case.get('fullname') or case.get('name')}")
              failure = case.find('failure')
              if failure is not None:
                  print((failure.findtext('message') or '').strip())
          PY
          else
            tail -120 "$ROOT/unity.log" || true
          fi
          exit "$status"
