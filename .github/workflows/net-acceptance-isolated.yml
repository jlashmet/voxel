name: Net acceptance isolated
# final behavioral acceptance against stable Net source tree 871fd663
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-acceptance-isolated.yml]
permissions:
  contents: read
jobs:
  unity-editmode:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Net source without deleting Unity import cache
        uses: actions/checkout@v4
        with:
          ref: 871fd663ac9c57d8e001ce2ff11f5ac30df242f0
          clean: false
          fetch-depth: 1

      - name: Reset tracked and non-cache files
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/

      - name: Locate Unity editor
        id: unity
        shell: bash
        run: |
          set -euo pipefail
          UNITY_VERSION="$(awk '/m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)"
          UNITY_PATH="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          echo "Unity version: ${UNITY_VERSION}"
          echo "Unity path: ${UNITY_PATH}"
          if [[ ! -x "${UNITY_PATH}" ]]; then
            echo "Unity executable was not found at ${UNITY_PATH}" >&2
            exit 1
          fi
          echo "path=${UNITY_PATH}" >> "$GITHUB_OUTPUT"

      - name: Wait for Unity editor to become available
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while pgrep -f '/Unity.app/Contents/MacOS/Unity' >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for another Unity editor to exit.' >&2
              pgrep -alf '/Unity.app/Contents/MacOS/Unity' || true
              exit 1
            fi
            echo 'Another Unity editor is active; waiting 5 seconds...'
            sleep 5
          done

      - name: Run EditMode suite
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$GITHUB_WORKSPACE/Artifacts/NetworkingCI"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          chmod +x tools/unity-run.sh

          UNITY_MAX_RSS_MB=8192 \
          UNITY_BIN="${{ steps.unity.outputs.path }}" \
          tools/unity-run.sh \
            -batchmode \
            -nographics \
            -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests \
            -testPlatform EditMode \
            -testResults "$ROOT/results.xml" \
            -logFile "$ROOT/unity.log"
          status=$?

          if [[ $status -ne 0 ]]; then
            echo "Unity EditMode tests exited with status $status; preserving results for baseline comparison." >&2
          fi

          test -s "$ROOT/results.xml"

      - name: Show Unity log tail
        if: always()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/Artifacts/NetworkingCI/unity.log"
          if [[ -f "$LOG" ]]; then
            tail -n 250 "$LOG"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkingCI
          path: Artifacts/NetworkingCI/
          if-no-files-found: warn
          retention-days: 14
