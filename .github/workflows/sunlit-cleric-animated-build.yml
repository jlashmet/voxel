name: Sunlit Cleric animated build

on:
  push:
    branches: [feature/character-weapon-asset-pipeline]
    paths:
      - 'tools/character-factory/**'
      - 'Assets/VoxelEngine/Characters/**'
      - 'tools/check-compile.sh'
      - '.github/workflows/sunlit-cleric-animated-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunlit-cleric-animated-build
  cancel-in-progress: true

jobs:
  build-animated-cleric:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 75
    env:
      PYTORCH_ENABLE_MPS_FALLBACK: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Compile character subsystem
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/check-compile.sh
          tools/check-compile.sh VoxelEngine.Characters

      - name: Run Character Factory unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/character-factory/tests -p 'test_*.py' -v

      - name: Resolve Blender
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="/Applications/Blender.app/Contents/MacOS/Blender"
          if [ ! -x "$BLENDER_BIN" ]; then
            if ! command -v brew >/dev/null 2>&1; then
              echo "Blender is not installed and Homebrew is unavailable" >&2
              exit 1
            fi
            brew install --cask blender
          fi
          test -x "$BLENDER_BIN"
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Bootstrap TripoSR MPS backend
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          TRIPOSR_REV="24e6763a8b20d07b4b9f796f44aed45e412f2dcd"
          CACHE_ROOT="${CHARACTER_FACTORY_CACHE_ROOT:-$HOME/Library/Caches/voxel-character-factory}"
          TRIPOSR_SOURCE="$CACHE_ROOT/TripoSR-$TRIPOSR_REV"
          TRIPOSR_PY="$CACHE_ROOT/triposr-$TRIPOSR_REV-py312-venv/bin/python"
          TRIPOSR_WEIGHTS="$CACHE_ROOT/models/triposr"

          chmod +x tools/character-factory/ci/bootstrap_triposr_macos.sh
          tools/character-factory/ci/bootstrap_triposr_macos.sh

          test -x "$TRIPOSR_PY"
          test -f "$TRIPOSR_WEIGHTS/model.ckpt"
          echo "TRIPOSR_SOURCE=$TRIPOSR_SOURCE" >> "$GITHUB_ENV"
          echo "TRIPOSR_PY=$TRIPOSR_PY" >> "$GITHUB_ENV"
          echo "TRIPOSR_WEIGHTS=$TRIPOSR_WEIGHTS" >> "$GITHUB_ENV"

      - name: Decode Sunlit Cleric reference
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericAnimated"
          mkdir -p "$OUT"
          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path('tools/character-factory/production/sunlit-cleric/front.jpg.b64')
          chunks = sorted(root.glob('*.txt'))
          if len(chunks) != 6:
              raise SystemExit(f'expected 6 cleric reference chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          payload = base64.b64decode(encoded, validate=True)
          output = Path('Artifacts/SunlitClericAnimated/cleric_front.jpg')
          output.write_bytes(payload)
          if payload[:2] != b'\xff\xd8' or payload[-2:] != b'\xff\xd9':
              raise SystemExit('decoded cleric reference is not a complete JPEG')
          if len(payload) != 17225:
              raise SystemExit(f'unexpected cleric reference size: {len(payload)}')
          print(f'decoded {output}: {len(payload)} bytes')
          PY
          test -s "$OUT/cleric_front.jpg"

      - name: Create canonical animation skeleton
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericAnimated"
          CANONICAL="$OUT/canonical_female.glb"
          DONOR_RENDER="$OUT/canonical_female.input.png"
          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/create_canonical_character_fixture.py -- \
            --canonical "$CANONICAL" \
            --input "$DONOR_RENDER"
          test -s "$CANONICAL"
          echo "CLERIC_CANONICAL=$CANONICAL" >> "$GITHUB_ENV"

      - name: Build textured rigged animated Cleric
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericAnimated"
          SPEC="$RUNNER_TEMP/sunlit-cleric-animated.json"
          cat > "$SPEC" <<JSON
          {
            "id": "sunlit_cleric_animated_01",
            "assetType": "character",
            "views": {
              "front": "$OUT/cleric_front.jpg"
            },
            "outputDir": "$OUT",
            "generator": {
              "python": "$TRIPOSR_PY",
              "backend": "triposr-mps",
              "source": "$TRIPOSR_SOURCE",
              "weights": "$TRIPOSR_WEIGHTS",
              "preset": "smoke",
              "device": "auto",
              "mcResolution": 384,
              "chunkSize": 8192,
              "removeBackground": true
            },
            "rig": {
              "blender": "$BLENDER_BIN",
              "canonicalBody": "$CLERIC_CANONICAL",
              "bodyObject": "Body",
              "armatureObject": "Armature",
              "maxTransferDistance": 0.45
            }
          }
          JSON

          python3 tools/character-factory/character_factory.py build "$SPEC"
          test -s "$OUT/sunlit_cleric_animated_01.raw.glb"
          test -s "$OUT/sunlit_cleric_animated_01.fbx"
          test -s "$OUT/manifest.json"

      - name: Verify rig and embedded animations
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericAnimated"
          FBX="$OUT/sunlit_cleric_animated_01.fbx"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_skinned_character.py -- \
            --input "$FBX"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/verify_character_animations.py -- \
            --input "$FBX"

      - name: Render animated Cleric previews
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Artifacts/SunlitClericAnimated"
          FBX="$OUT/sunlit_cleric_animated_01.fbx"

          "$BLENDER_BIN" --background --python-exit-code 1 \
            --python tools/character-factory/ci/render_pipeline_artifact.py -- \
            --input "$FBX" \
            --output "$OUT/cleric_bind_preview.png" \
            --preserve-materials

          "$BLENDER_BIN" --background --python-exit-code 1 --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" --output "$OUT/cleric_idle.png" --clip Idle --frame 30
          "$BLENDER_BIN" --background --python-exit-code 1 --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" --output "$OUT/cleric_walk.png" --clip Walk --frame 7
          "$BLENDER_BIN" --background --python-exit-code 1 --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" --output "$OUT/cleric_run.png" --clip Run --frame 5
          "$BLENDER_BIN" --background --python-exit-code 1 --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" --output "$OUT/cleric_cast.png" --clip Cast --frame 28
          "$BLENDER_BIN" --background --python-exit-code 1 --python tools/character-factory/ci/render_character_clip.py -- \
            --input "$FBX" --output "$OUT/cleric_staff_attack.png" --clip StaffAttack --frame 22

          ls -lh "$OUT"

      - name: Upload animated Cleric prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunlit-cleric-animated-prototype
          path: Artifacts/SunlitClericAnimated/
          if-no-files-found: warn
          retention-days: 14
