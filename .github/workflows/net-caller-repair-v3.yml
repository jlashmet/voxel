name: Net caller migration v3
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/net-caller-repair-v3.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/net-caller-repair.py
          git rm .github/workflows/net-caller-repair-v3.yml .github/scripts/net-caller-repair.py
          git diff --check
          git status --short
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/Tests/EditMode Assets/Scenes/Showcase
          git commit -m 'Migrate Net callers to Storage API capabilities'
          git push origin HEAD:${{ github.ref_name }}
