name: CastleBuilder Storage API seam publisher

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Patch CastleBuilder seam and Showcase caller
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          castle_path = Path('Assets/VoxelEngine/Structures/CastleBuilder.cs')
          castle = castle_path.read_text()

          replacements = [
              ('using VoxelEngine.Core.Storage;\n', ''),
              (
                  '''        public static VoxelBrush Build(ref RegionTable table, ref BrickPool pool,\n                                       in CastlePlan plan, uint terrainSeed,\n                                       in MaterialPalette palette)\n        {\n            IncrementalBuild build = BeginBuild(table, pool, in plan, terrainSeed, in palette);\n            while (!build.IsComplete) StepBuild(ref build, ref table, ref pool);\n            return build.Brush;\n        }\n''',
                  '''        public static VoxelBrush Build(IRegionReadSource reads,\n                                       IRegionMutationStore mutations,\n                                       in CastlePlan plan, uint terrainSeed,\n                                       IMaterialAuthoringCatalogue materials)\n        {\n            IncrementalBuild build = BeginBuild(\n                reads, mutations, in plan, terrainSeed, materials);\n            while (!build.IsComplete) StepBuild(ref build);\n            return build.Brush;\n        }\n'''
              ),
              (
                  '''        public static IncrementalBuild BeginBuild(RegionTable table, BrickPool pool,\n                                                  in CastlePlan plan, uint terrainSeed,\n                                                  in MaterialPalette palette)\n        {\n            var reads = new RegionReadSource(in table, in pool);\n            var mutations = new RegionMutationStore(in table, in pool);\n            IMaterialAuthoringCatalogue materials = palette.IsCreated\n                ? (IMaterialAuthoringCatalogue)palette\n                : null;\n            var brush = new VoxelBrush(reads, mutations, materials);\n''',
                  '''        public static IncrementalBuild BeginBuild(IRegionReadSource reads,\n                                                  IRegionMutationStore mutations,\n                                                  in CastlePlan plan, uint terrainSeed,\n                                                  IMaterialAuthoringCatalogue materials)\n        {\n            var brush = new VoxelBrush(reads, mutations, materials);\n'''
              ),
              (
                  '''        /// <summary>Executes one bounded semantic stage and publishes allocator bookkeeping.</summary>\n        public static bool StepBuild(ref IncrementalBuild build,\n                                     ref RegionTable table, ref BrickPool pool)\n''',
                  '''        /// <summary>Executes one bounded semantic stage.</summary>\n        public static bool StepBuild(ref IncrementalBuild build)\n'''
              ),
          ]

          for old, new in replacements:
              count = castle.count(old)
              if count != 1:
                  raise SystemExit(f'CastleBuilder exact-match count was {count}, expected 1 for:\n{old[:120]}')
              castle = castle.replace(old, new, 1)
          castle_path.write_text(castle)

          showcase_path = Path('Assets/Scenes/Showcase/ShowcaseWorld.cs')
          showcase = showcase_path.read_text()
          old = '''            if (!_castleBuild.IsCreated)\n            {\n                _castleBuild = CastleBuilder.BeginBuild(\n                    _table, _pool, in _pendingCastlePlan, Seed, in _palette);\n            }\n            bool castleComplete;\n            using (s_CastleMarker.Auto())\n                castleComplete = CastleBuilder.StepBuild(ref _castleBuild, ref _table, ref _pool);\n'''
          new = '''            if (!_castleBuild.IsCreated)\n            {\n                var reads = new RegionReadSource(in _table, in _pool);\n                var mutations = new RegionMutationStore(in _table, in _pool);\n                IMaterialAuthoringCatalogue materials = _palette.IsCreated\n                    ? (IMaterialAuthoringCatalogue)_palette\n                    : null;\n                _castleBuild = CastleBuilder.BeginBuild(\n                    reads, mutations, in _pendingCastlePlan, Seed, materials);\n            }\n            bool castleComplete;\n            using (s_CastleMarker.Auto())\n                castleComplete = CastleBuilder.StepBuild(ref _castleBuild);\n'''
          count = showcase.count(old)
          if count != 1:
              raise SystemExit(f'ShowcaseWorld exact-match count was {count}, expected 1')
          showcase_path.write_text(showcase.replace(old, new, 1))
          PY

          git rm .github/workflows/structures-inventory.yml
          git diff --check
          git diff -- Assets/VoxelEngine/Structures/CastleBuilder.cs Assets/Scenes/Showcase/ShowcaseWorld.cs .github/workflows/structures-inventory.yml
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add -A
          git commit -m 'Cut CastleBuilder over to Storage API capabilities'
          git push origin HEAD:${{ github.ref_name }}
