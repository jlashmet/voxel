name: One-shot Streaming Test Callers Cutover

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - '.github/workflows/one-shot-streaming-test-callers-cutover.yml'
      - 'Tools/Refactor/apply_streaming_test_callers_cutover.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-foundation-storage
          fetch-depth: 0

      - name: Apply deterministic test caller cutover
        run: python Tools/Refactor/apply_streaming_test_callers_cutover.py

      - name: Verify caller diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R -n --include='*.cs' 'PublishLoaded(ref table, ref pool' Assets/Tests
          ! grep -R -n --include='*.cs' 'EvictWithoutWriteBack(regionCoord, ref table, ref pool)' Assets/Tests
          grep -q 'RegionLoader.PublishLoaded(residency' Assets/Tests/PlayMode/MemoryStabilityTests.cs
          grep -q 'RegionLoader.PublishLoaded(residency' Assets/Tests/PlayMode/TraversalStreamingTests.cs

      - name: Commit caller cutover and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-streaming-test-callers-cutover.yml
          git rm Tools/Refactor/apply_streaming_test_callers_cutover.py
          git add Assets/Tests/PlayMode/DistantAlterationTests.cs
          git add Assets/Tests/PlayMode/MemoryStabilityTests.cs
          git add Assets/Tests/PlayMode/TraversalStreamingTests.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: cut over streaming test callers'
          git push origin HEAD:refactor/system-boundaries-foundation-storage
