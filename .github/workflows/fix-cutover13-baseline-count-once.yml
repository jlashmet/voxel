name: Fix Cutover 13 final baseline count once

on:
  push:
    branches: [refactor/system-boundaries-finalization-clean]
    paths: [.github/workflows/fix-cutover13-baseline-count-once.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/system-boundaries-finalization-clean
          fetch-depth: 2
      - name: Account for the new permanent profile-boundary test
        shell: bash
        run: |
          set -euo pipefail
          branch='refactor/system-boundaries-finalization-clean'
          git pull --ff-only origin "$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '017a33b17e1691d91a85e2e6abefa3effdff1736'

          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('Assets/Tests/EditMode/ShowcaseProfileBoundaryTests.cs')
          test_text = test_path.read_text()
          if test_text.count('[Test]') != 1:
              raise SystemExit('Expected exactly one new permanent Showcase profile boundary test')

          path = Path('.github/workflows/cutover13-final-acceptance.yml')
          text = path.read_text()
          replacements = {
              "if totals != ('387', '374', '13'):": "if totals != ('388', '375', '13'):",
              "print('Exact accepted 387/374/13 baseline matched')": "print('Exact accepted 388/375/13 baseline matched')",
              "with 387/374/13 and zero compiler errors | none |": "with 388/375/13 and zero compiler errors | none |",
              "— 387 tests, 374 passed, ": "— 388 tests, 375 passed, ",
              "387 total / 374 passed / exact 13 known baseline failures / zero C# compiler errors": "388 total / 375 passed / exact 13 known baseline failures / zero C# compiler errors",
              "with 387/374/13 and zero compiler errors.')": "with 388/375/13 and zero compiler errors.')",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          if "('387', '374', '13')" in text:
              raise SystemExit('Stale 387/374 test tuple remains in final acceptance workflow')
          path.write_text(text)
          PY

          git diff --check
          git rm .github/workflows/fix-cutover13-baseline-count-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cutover13-final-acceptance.yml
          git commit -m 'ci(architecture): account for profile boundary test in final gate'

          remote_head="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:"$branch"
