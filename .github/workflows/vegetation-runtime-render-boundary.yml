name: Vegetation Runtime Rendering boundary
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx
          mkdir -p Assets/VoxelEngine/Vegetation/Runtime
          for f in ProceduralTreeDamageService ProceduralTreeSkeletonBuilder TreeWorldState; do
            git mv "Assets/VoxelEngine/Vegetation/$f.cs" "Assets/VoxelEngine/Vegetation/Runtime/$f.cs"
            git mv "Assets/VoxelEngine/Vegetation/$f.cs.meta" "Assets/VoxelEngine/Vegetation/Runtime/$f.cs.meta"
          done
          git mv Assets/VoxelEngine/Vegetation/VoxelEngine.Vegetation.asmdef Assets/VoxelEngine/Vegetation/Runtime/VoxelEngine.Vegetation.Runtime.asmdef
          git mv Assets/VoxelEngine/Vegetation/VoxelEngine.Vegetation.asmdef.meta Assets/VoxelEngine/Vegetation/Runtime/VoxelEngine.Vegetation.Runtime.asmdef.meta
          python3 - <<'PY'
          from pathlib import Path
          import json, re, uuid

          def simple_meta(path): Path(path).write_text(f"fileFormatVersion: 2\nguid: {uuid.uuid4().hex}\n")
          def folder_meta(path): Path(path).write_text(f"fileFormatVersion: 2\nguid: {uuid.uuid4().hex}\nfolderAsset: yes\nDefaultImporter:\n  externalObjects: {{}}\n  userData: \n  assetBundleName: \n  assetBundleVariant: \n")
          if not Path('Assets/VoxelEngine/Vegetation/Runtime.meta').exists(): folder_meta('Assets/VoxelEngine/Vegetation/Runtime.meta')

          api = Path('Assets/VoxelEngine/Vegetation/Api/TreePresentation.cs')
          api.write_text(r'''using System;
using System.Collections.Generic;
using Unity.Mathematics;

namespace VoxelEngine.Vegetation.Api
{
    public struct TreeBranchSegment
    {
        public float3 Start;
        public float3 End;
        public float RadiusStart;
        public float RadiusEnd;
        public int Level;
    }

    public struct TreeLeafAnchor
    {
        public float3 Position;
        public float3 Direction;
        public float Size;
        public float Rotation;
        public float4 Colour;
        public TreeLeafStyle Style;
    }

    public sealed class TreeSkeletonSnapshot
    {
        private readonly TreeBranchSegment[] _branches;
        private readonly TreeLeafAnchor[] _leaves;
        private readonly int[] _branchParents;
        private readonly int[] _leafParents;

        public IReadOnlyList<TreeBranchSegment> Branches => _branches;
        public IReadOnlyList<TreeLeafAnchor> Leaves => _leaves;
        public IReadOnlyList<int> BranchParents => _branchParents;
        public IReadOnlyList<int> LeafParents => _leafParents;
        public TreeSpeciesProfile Profile { get; }
        public float Height { get; }

        public TreeSkeletonSnapshot(TreeBranchSegment[] branches, TreeLeafAnchor[] leaves,
                                    TreeSpeciesProfile profile, float height,
                                    int[] branchParents, int[] leafParents)
        {
            _branches = branches == null ? Array.Empty<TreeBranchSegment>() : (TreeBranchSegment[])branches.Clone();
            _leaves = leaves == null ? Array.Empty<TreeLeafAnchor>() : (TreeLeafAnchor[])leaves.Clone();
            _branchParents = branchParents == null ? Array.Empty<int>() : (int[])branchParents.Clone();
            _leafParents = leafParents == null ? Array.Empty<int>() : (int[])leafParents.Clone();
            Profile = profile;
            Height = height;
        }
    }

    public readonly struct TreeDamageState
    {
        public readonly float FoliageHealth;
        public readonly bool Severed;

        public TreeDamageState(float foliageHealth, bool severed)
        {
            FoliageHealth = foliageHealth;
            Severed = severed;
        }
    }

    public readonly struct TreeBranchCutEvent
    {
        public readonly int TreeIndex;
        public readonly int BranchIndex;
        public readonly float3 HitPointMetres;
        public readonly float3 Impulse;

        public TreeBranchCutEvent(int treeIndex, int branchIndex, float3 hitPointMetres, float3 impulse)
        {
            TreeIndex = treeIndex;
            BranchIndex = branchIndex;
            HitPointMetres = hitPointMetres;
            Impulse = impulse;
        }
    }

    public readonly struct TreeDamageChangedEvent
    {
        public readonly int TreeIndex;
        public readonly float FoliageHealth;
        public readonly bool Severed;

        public TreeDamageChangedEvent(int treeIndex, float foliageHealth, bool severed)
        {
            TreeIndex = treeIndex;
            FoliageHealth = foliageHealth;
            Severed = severed;
        }
    }

    public readonly struct TreeSeveredEvent
    {
        public readonly int TreeIndex;
        public readonly int BreakBranchIndex;
        public readonly float3 HitPointMetres;
        public readonly float3 Impulse;

        public TreeSeveredEvent(int treeIndex, int breakBranchIndex, float3 hitPointMetres, float3 impulse)
        {
            TreeIndex = treeIndex;
            BreakBranchIndex = breakBranchIndex;
            HitPointMetres = hitPointMetres;
            Impulse = impulse;
        }
    }

    public interface ITreeWorldReadSource
    {
        IReadOnlyList<TreeInstance> Instances { get; }
        IReadOnlyList<TreeDamageState> Damage { get; }
        int Version { get; }
        int DamageVersion { get; }
        event Action SnapshotChanged;
        event Action<TreeBranchCutEvent> BranchCut;
        event Action<TreeDamageChangedEvent> DamageChanged;
        event Action<TreeSeveredEvent> TreeSevered;
        IReadOnlyCollection<int> RemovedBranches(int treeIndex);
        TreeSkeletonSnapshot SkeletonFor(int treeIndex);
        TreeSkeletonSnapshot SkeletonFor(in TreeInstance instance);
    }

    public static class TreeWorldReadRegistry
    {
        private static ITreeWorldReadSource s_Current = EmptyTreeWorldReadSource.Instance;
        public static ITreeWorldReadSource Current => s_Current;
        public static void Register(ITreeWorldReadSource source) =>
            s_Current = source ?? EmptyTreeWorldReadSource.Instance;

        private sealed class EmptyTreeWorldReadSource : ITreeWorldReadSource
        {
            public static readonly EmptyTreeWorldReadSource Instance = new();
            public IReadOnlyList<TreeInstance> Instances => Array.Empty<TreeInstance>();
            public IReadOnlyList<TreeDamageState> Damage => Array.Empty<TreeDamageState>();
            public int Version => 0;
            public int DamageVersion => 0;
            public event Action SnapshotChanged { add { } remove { } }
            public event Action<TreeBranchCutEvent> BranchCut { add { } remove { } }
            public event Action<TreeDamageChangedEvent> DamageChanged { add { } remove { } }
            public event Action<TreeSeveredEvent> TreeSevered { add { } remove { } }
            public IReadOnlyCollection<int> RemovedBranches(int treeIndex) => Array.Empty<int>();
            public TreeSkeletonSnapshot SkeletonFor(int treeIndex) => null;
            public TreeSkeletonSnapshot SkeletonFor(in TreeInstance instance) => null;
        }
    }

    public static class TreeSkeletonTopology
    {
        public static void ResolveRemovedBranches(TreeSkeletonSnapshot skeleton,
                                                  IReadOnlyCollection<int> directCuts,
                                                  HashSet<int> resolved)
        {
            resolved.Clear();
            if (skeleton == null || directCuts == null || directCuts.Count == 0) return;
            foreach (int cut in directCuts)
                if ((uint)cut < (uint)skeleton.Branches.Count) resolved.Add(cut);
            for (int i = 0; i < skeleton.BranchParents.Count; i++)
            {
                int parent = skeleton.BranchParents[i];
                if (parent >= 0 && resolved.Contains(parent)) resolved.Add(i);
            }
        }

        public static bool IsBranchRemoved(TreeSkeletonSnapshot skeleton,
                                           IReadOnlyCollection<int> directCuts,
                                           int branchIndex)
        {
            if (skeleton == null || directCuts == null || directCuts.Count == 0) return false;
            int current = branchIndex;
            while (current >= 0)
            {
                foreach (int cut in directCuts) if (cut == current) return true;
                if (current >= skeleton.BranchParents.Count) break;
                int parent = skeleton.BranchParents[current];
                if (parent == current) break;
                current = parent;
            }
            return false;
        }
    }
}
''')
          simple_meta('Assets/VoxelEngine/Vegetation/Api/TreePresentation.cs.meta')

          # Runtime assembly and namespaces.
          asm=Path('Assets/VoxelEngine/Vegetation/Runtime/VoxelEngine.Vegetation.Runtime.asmdef')
          data=json.loads(asm.read_text())
          data['name']='VoxelEngine.Vegetation.Runtime'; data['rootNamespace']='VoxelEngine.Vegetation.Runtime'
          data['references']=['VoxelEngine.Vegetation.Api','Unity.Mathematics']
          data['autoReferenced']=False
          asm.write_text(json.dumps(data,indent=2)+'\n')
          for name in ('ProceduralTreeDamageService','ProceduralTreeSkeletonBuilder','TreeWorldState'):
              p=Path(f'Assets/VoxelEngine/Vegetation/Runtime/{name}.cs'); s=p.read_text()
              s=s.replace('namespace VoxelEngine.Core.Vegetation\n','namespace VoxelEngine.Vegetation.Runtime\n',1)
              p.write_text(s)

          # Skeleton builder now builds an immutable Api snapshot through a private mutable build state.
          p=Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeSkeletonBuilder.cs'); s=p.read_text()
          start=s.index('    public struct TreeBranchSegment')
          end=s.index('    public static class ProceduralTreeSkeletonBuilder')
          build_state='''    internal sealed class TreeSkeletonBuildState\n    {\n        public readonly List<TreeBranchSegment> Branches = new(256);\n        public readonly List<TreeLeafAnchor> Leaves = new(768);\n        public TreeSpeciesProfile Profile;\n        public float Height;\n        public int[] BranchParents;\n        public int[] LeafParents;\n    }\n\n'''
          s=s[:start]+build_state+s[end:]
          s=re.sub(r'\bProceduralTreeSkeleton\b','TreeSkeletonBuildState',s)
          s=s.replace('public static TreeSkeletonBuildState Generate(in TreeInstance instance)','public static TreeSkeletonSnapshot Generate(in TreeInstance instance)')
          marker='            ResolveTopology(skeleton);\n            return skeleton;'
          replacement='''            ResolveTopology(skeleton);\n            return new TreeSkeletonSnapshot(\n                skeleton.Branches.ToArray(), skeleton.Leaves.ToArray(), skeleton.Profile,\n                skeleton.Height, skeleton.BranchParents, skeleton.LeafParents);'''
          if marker not in s: raise SystemExit('missing skeleton return marker')
          s=s.replace(marker,replacement,1)
          # Remove topology methods now owned by Api (from public ResolveRemovedBranches through before GrowBranch).
          a=s.index('        public static void ResolveRemovedBranches(')
          b=s.index('        private static void GrowBranch(',a)
          s=s[:a]+s[b:]
          p.write_text(s)

          # Runtime world state uses Api event/damage values and registers a read-only source.
          p=Path('Assets/VoxelEngine/Vegetation/Runtime/TreeWorldState.cs'); s=p.read_text()
          a=s.index('    public readonly struct TreeBranchCutEvent')
          b=s.index('    /// <summary>\n    /// Authoritative semantic state',a)
          s=s[:a]+s[b:]
          a=s.index('        public struct TreeDamageState')
          b=s.index('        private const float RootQuantizationMetres',a)
          s=s[:a]+s[b:]
          s=s.replace('new TreeDamageState\n                    {\n                        FoliageHealth = 1f,\n                        Severed = false,\n                    }','new TreeDamageState(1f, false)')
          s=s.replace('new TreeDamageState\n            {\n                FoliageHealth = nextFoliageHealth,\n                Severed = nextSevered,\n            }','new TreeDamageState(nextFoliageHealth, nextSevered)')
          reset='''            TreeWorldReadRegistry.Register(TreeWorldReadSource.Instance);\n'''
          marker='''            unchecked\n            {\n                s_Version++;\n                s_DamageVersion++;\n            }\n        }'''
          if marker not in s: raise SystemExit('missing world reset marker')
          s=s.replace(marker,marker[:-10]+reset+'        }',1)
          p.write_text(s)

          Path('Assets/VoxelEngine/Vegetation/Runtime/TreeWorldReadSource.cs').write_text(r'''using System;
using System.Collections.Generic;
using VoxelEngine.Vegetation.Api;

namespace VoxelEngine.Vegetation.Runtime
{
    internal sealed class TreeWorldReadSource : ITreeWorldReadSource
    {
        internal static readonly TreeWorldReadSource Instance = new();
        private TreeWorldReadSource() { }
        public IReadOnlyList<TreeInstance> Instances => TreeWorldState.Instances;
        public IReadOnlyList<TreeDamageState> Damage => TreeWorldState.Damage;
        public int Version => TreeWorldState.Version;
        public int DamageVersion => TreeWorldState.DamageVersion;
        public event Action SnapshotChanged { add => TreeWorldState.SnapshotChanged += value; remove => TreeWorldState.SnapshotChanged -= value; }
        public event Action<TreeBranchCutEvent> BranchCut { add => TreeWorldState.BranchCut += value; remove => TreeWorldState.BranchCut -= value; }
        public event Action<TreeDamageChangedEvent> DamageChanged { add => TreeWorldState.DamageChanged += value; remove => TreeWorldState.DamageChanged -= value; }
        public event Action<TreeSeveredEvent> TreeSevered { add => TreeWorldState.TreeSevered += value; remove => TreeWorldState.TreeSevered -= value; }
        public IReadOnlyCollection<int> RemovedBranches(int treeIndex) => TreeWorldState.RemovedBranches(treeIndex);
        public TreeSkeletonSnapshot SkeletonFor(int treeIndex) => ProceduralTreeDamageService.SkeletonFor(treeIndex);
        public TreeSkeletonSnapshot SkeletonFor(in TreeInstance instance) => ProceduralTreeSkeletonBuilder.Generate(in instance);
    }
}
''')
          simple_meta('Assets/VoxelEngine/Vegetation/Runtime/TreeWorldReadSource.cs.meta')

          # Runtime damage service consumes snapshot/topology Api.
          p=Path('Assets/VoxelEngine/Vegetation/Runtime/ProceduralTreeDamageService.cs'); s=p.read_text()
          s=re.sub(r'\bProceduralTreeSkeleton\b','TreeSkeletonSnapshot',s)
          s=s.replace('ProceduralTreeSkeletonBuilder.IsBranchRemoved','TreeSkeletonTopology.IsBranchRemoved')
          s=s.replace('TreeWorldState.TreeDamageState','TreeDamageState')
          s=s.replace('.BranchParents.Length','.BranchParents.Count').replace('.LeafParents.Length','.LeafParents.Count')
          p.write_text(s)

          # Rendering consumes Api only.
          rendering_files=list(Path('Assets/VoxelEngine/Rendering/Vegetation').glob('*.cs'))
          for p in rendering_files:
              s=p.read_text()
              s=s.replace('using VoxelEngine.Core.Vegetation;\n','')
              s=re.sub(r'\bProceduralTreeSkeleton\b','TreeSkeletonSnapshot',s)
              s=s.replace('TreeWorldState.TreeDamageState','TreeDamageState')
              s=s.replace('TreeWorldState.','TreeWorldReadRegistry.Current.')
              s=s.replace('ProceduralTreeSkeletonBuilder.ResolveRemovedBranches','TreeSkeletonTopology.ResolveRemovedBranches')
              s=s.replace('ProceduralTreeSkeletonBuilder.IsBranchRemoved','TreeSkeletonTopology.IsBranchRemoved')
              s=s.replace('ProceduralTreeDamageService.SkeletonFor','TreeWorldReadRegistry.Current.SkeletonFor')
              s=s.replace('ProceduralTreeSkeletonBuilder.Generate','TreeWorldReadRegistry.Current.SkeletonFor')
              s=s.replace('.BranchParents.Length','.BranchParents.Count').replace('.LeafParents.Length','.LeafParents.Count')
              p.write_text(s)

          # Runtime/CI/Showcase consumers use Runtime implementation namespace; Api values remain separate.
          implementation_roots=[Path('Assets/Scenes/Showcase'),Path('Assets/VoxelEngine/CI')]
          for root in implementation_roots:
              for p in root.rglob('*.cs'):
                  s=p.read_text()
                  s=s.replace('using VoxelEngine.Core.Vegetation;','using VoxelEngine.Vegetation.Runtime;')
                  s=re.sub(r'\bProceduralTreeSkeleton\b','TreeSkeletonSnapshot',s)
                  s=s.replace('ProceduralTreeSkeletonBuilder.ResolveRemovedBranches','TreeSkeletonTopology.ResolveRemovedBranches')
                  s=s.replace('ProceduralTreeSkeletonBuilder.IsBranchRemoved','TreeSkeletonTopology.IsBranchRemoved')
                  s=s.replace('TreeWorldState.TreeDamageState','TreeDamageState')
                  s=s.replace('.BranchParents.Length','.BranchParents.Count').replace('.LeafParents.Length','.LeafParents.Count')
                  p.write_text(s)

          def refs(path, remove=(), add=()):
              p=Path(path); data=json.loads(p.read_text()); rs=[x for x in data.get('references',[]) if x not in remove]
              for x in add:
                  if x not in rs: rs.append(x)
              data['references']=rs; p.write_text(json.dumps(data,indent=2)+'\n')
          refs('Assets/VoxelEngine/Rendering/VoxelEngine.Rendering.asmdef',remove=('VoxelEngine.Vegetation',),add=('VoxelEngine.Vegetation.Api',))
          refs('Assets/Scenes/Showcase/VoxelEngine.Showcase.asmdef',remove=('VoxelEngine.Vegetation',),add=('VoxelEngine.Vegetation.Api','VoxelEngine.Vegetation.Runtime'))
          refs('Assets/VoxelEngine/CI/Editor/VoxelEngine.CI.Editor.asmdef',remove=('VoxelEngine.Vegetation',),add=('VoxelEngine.Vegetation.Api','VoxelEngine.Vegetation.Runtime'))
          refs('Assets/VoxelEngine/CI/PlayMode/VoxelEngine.CI.PlayMode.asmdef',remove=('VoxelEngine.Vegetation',),add=('VoxelEngine.Vegetation.Api','VoxelEngine.Vegetation.Runtime'))

          # Architecture guard for the Vegetation boundary.
          Path('Assets/Tests/EditMode/VegetationAssemblyBoundaryTests.cs').write_text(r'''using System;
using System.IO;
using NUnit.Framework;

namespace VoxelEngine.Tests.EditMode
{
    public sealed class VegetationAssemblyBoundaryTests
    {
        [Test]
        public void RenderingAndWorldGenUseVegetationApiOnly()
        {
            string root = FindRepoRoot();
            AssertApiOnly(Path.Combine(root, "Assets", "VoxelEngine", "Rendering", "VoxelEngine.Rendering.asmdef"));
            AssertApiOnly(Path.Combine(root, "Packages", "com.mountingforce.worldgen", "Runtime", "Voxel", "MountingForce.WorldGen.Voxel.asmdef"));

            string rendering = Path.Combine(root, "Assets", "VoxelEngine", "Rendering");
            foreach (string path in Directory.EnumerateFiles(rendering, "*.cs", SearchOption.AllDirectories))
            {
                string source = File.ReadAllText(path);
                Assert.That(source.Contains("VoxelEngine.Vegetation.Runtime"), Is.False, Path.GetFileName(path));
                Assert.That(source.Contains("VoxelEngine.Core.Vegetation"), Is.False, Path.GetFileName(path));
            }
        }

        private static void AssertApiOnly(string asmdefPath)
        {
            string text = File.ReadAllText(asmdefPath);
            Assert.That(text.Contains("\"VoxelEngine.Vegetation.Api\""), Is.True, asmdefPath);
            Assert.That(text.Contains("\"VoxelEngine.Vegetation.Runtime\""), Is.False, asmdefPath);
            Assert.That(text.Contains("\"VoxelEngine.Vegetation\""), Is.False, asmdefPath);
        }

        private static string FindRepoRoot()
        {
            string directory = Directory.GetCurrentDirectory();
            while (!string.IsNullOrEmpty(directory))
            {
                if (Directory.Exists(Path.Combine(directory, "Assets"))) return directory;
                directory = Directory.GetParent(directory)?.FullName;
            }
            throw new InvalidOperationException("Could not locate repository root.");
        }
    }
}
''')
          simple_meta('Assets/Tests/EditMode/VegetationAssemblyBoundaryTests.cs.meta')
          PY
          git rm .github/workflows/vegetation-runtime-render-boundary.yml
          git diff --check
          if grep -RIn 'VoxelEngine.Core.Vegetation' Assets/VoxelEngine/Vegetation Assets/VoxelEngine/Rendering Packages/com.mountingforce.worldgen/Runtime/Voxel --include='*.cs' --include='*.asmdef'; then echo stale Core Vegetation reference >&2; exit 1; fi
          if grep -RIn '"VoxelEngine.Vegetation"' Assets Packages --include='*.asmdef'; then echo stale broad Vegetation asmdef reference >&2; exit 1; fi
          if grep -RIn 'VoxelEngine.Vegetation.Runtime' Assets/VoxelEngine/Rendering Packages/com.mountingforce.worldgen/Runtime/Voxel --include='*.cs' --include='*.asmdef'; then echo Rendering/WorldGen references Vegetation.Runtime >&2; exit 1; fi
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add Assets/VoxelEngine/Vegetation Assets/VoxelEngine/Rendering Assets/Scenes/Showcase Assets/VoxelEngine/CI Packages/com.mountingforce.worldgen/Runtime/Voxel Assets/Tests/EditMode/VegetationAssemblyBoundaryTests.cs Assets/Tests/EditMode/VegetationAssemblyBoundaryTests.cs.meta
          git commit -m 'Split Vegetation Runtime from rendering reads'
          git push origin HEAD:${{ github.ref_name }}
