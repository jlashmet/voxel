name: Async geometry explicit job flush patch

on:
  push:
    branches: [refactor/async-geometry-pipeline]
    paths: [.github/workflows/async-geometry-job-flush-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/async-geometry-pipeline
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 .github/scripts/async_geometry_job_flush_patch.py
      - name: Static guards
        shell: bash
        run: |
          test "$(grep -R -F 'JobHandle.ScheduleBatchedJobs();' Assets/VoxelEngine/Rendering/Runtime/SurfaceExtraction/VoxelSurfaceScheduler.cs | wc -l | tr -d ' ')" = "1"
          grep -q 'GeometryJobsAreFlushedOnceWithoutWaiting' Assets/Tests/EditMode/GeometryPipelineArchitectureTests.cs
      - name: Commit fix
        shell: bash
        run: |
          rm .github/scripts/async_geometry_job_flush_patch.py
          rm .github/workflows/async-geometry-job-flush-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Flush async geometry jobs once per world frame'
          git push origin HEAD:refactor/async-geometry-pipeline
