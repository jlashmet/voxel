name: Record castle Structures API extraction

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          clean: false
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -ffdx -e Library/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          text = p.read_text()
          old_row = '''| 4 — Structures | **In progress — current** | Storage authoring boundary + `Structures.Api` extraction accepted; canonical authoring/encoding contracts live in `VoxelEngine.Structures.Api`; `Structures.Runtime` assembly created with the allowed dependency set; feature VM/generation/rasterizer/Arch/Bonded/emitters physically moved under `Structures/Runtime` with GUIDs preserved; feature-runtime Storage validation dependencies route through Storage.Api; retained-profile writes route through `Structures.Api.IProfileBlockWriter`; retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; mutable `ProfileBlockStore` is physically under `Structures/Runtime`; stale `VoxelEngine.Core.Features` imports are removed from the WorldGen Voxel adapter; CastleBuilder orchestration consumes Storage.Api read/mutation/material-authoring capabilities and no longer accepts physical Storage handles; canonical ramp direction bits and first directional Kentridge consumers use Structures.Api; retained-profile logical value/read contract extracted to Storage.Api; Kentridge compatibility seam deleted | move CastleBuilder/VoxelBrush/MasonryWeathering/StructureMaterials together under Runtime; finish Runtime namespaces; remove broad Structures assembly |'''
          new_row = '''| 4 — Structures | **In progress — current** | Storage authoring boundary + `Structures.Api` extraction accepted; canonical authoring/encoding contracts live in `VoxelEngine.Structures.Api`; `Structures.Runtime` assembly created with the allowed dependency set; feature VM/generation/rasterizer/Arch/Bonded/emitters physically moved under `Structures/Runtime` with GUIDs preserved; feature-runtime Storage validation dependencies route through Storage.Api; retained-profile writes route through `Structures.Api.IProfileBlockWriter`; retained-profile reads exposed through Storage.Api `IProfileBlockReadSource` and Rendering consumes that read-only boundary; `VoxelBrush` consumes Storage.Api read/mutation/catalogue capabilities with no physical Storage handle escape; mutable `ProfileBlockStore` is physically under `Structures/Runtime`; stale `VoxelEngine.Core.Features` imports are removed from the WorldGen Voxel adapter; CastleBuilder orchestration consumes Storage.Api read/mutation/material-authoring capabilities and no longer accepts physical Storage handles; semantic `Mat` IDs plus `CastlePlan`/`CastleLayout` landmark geometry live in Structures.Api and WorldGen Voxel no longer references the broad Structures assembly; canonical ramp direction bits and first directional Kentridge consumers use Structures.Api; retained-profile logical value/read contract extracted to Storage.Api; Kentridge compatibility seam deleted | move CastleBuilder/VoxelBrush/MasonryWeathering under Runtime; finish Runtime namespaces; remove broad Structures assembly |'''
          old_gate = '''- Latest accepted code gate: `87f5f5d1033edf31acde14d60b58bea830f203d1` — 382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts the CastleBuilder orchestration boundary cut: `Build`/`BeginBuild` now take Storage.Api `IRegionReadSource`, `IRegionMutationStore`, and `IMaterialAuthoringCatalogue`, `StepBuild` no longer accepts unused `RegionTable`/`BrickPool` handles, and Showcase owns construction of the concrete Storage adapters. CastleBuilder no longer imports `VoxelEngine.Core.Storage`. The preceding accepted gate `00f1ddfc89af4fa52aa03c79c4b922bf5a9dd70d` accepted the `ProfileBlockStore` Runtime move and 28-file WorldGen Core.Features import cleanup at the same 382/369/13 baseline.'''
          new_gate = '''- Latest accepted code gate: `e2945f5e4d18e2d3ccb97bb069cfa24254dfdf1f` — 382 tests, 369 passed, exactly the same 13 known baseline failures. This gate accepts the castle semantic API extraction: `StructureMaterials`/`Mat` moved into `Structures.Api` with its Unity GUID preserved; `CastlePlan` and deterministic shared landmark geometry are exposed as `CastleLayout`; WorldGen Voxel consumes those API contracts and no longer references the broad `VoxelEngine.Structures` assembly. The PlayMode test assembly explicitly references `VoxelEngine.Structures.Api`. The preceding accepted gate `87f5f5d1033edf31acde14d60b58bea830f203d1` accepted the CastleBuilder Storage.Api orchestration boundary at the same 382/369/13 baseline.'''
          old_check = '''- [x] cut CastleBuilder orchestration over to Storage.Api capabilities\n- [ ] move existing CastleBuilder/etc. under Runtime'''
          new_check = '''- [x] cut CastleBuilder orchestration over to Storage.Api capabilities\n- [x] extract castle layout/material semantics to Structures.Api and remove WorldGen Voxel broad Structures dependency\n- [ ] move existing CastleBuilder/etc. under Runtime'''
          for old, new, label in ((old_row,new_row,'status row'),(old_gate,new_gate,'gate'),(old_check,new_check,'checklist')):
              if text.count(old) != 1:
                  raise SystemExit(f'{label} exact-match count was {text.count(old)}, expected 1')
              text = text.replace(old,new,1)
          p.write_text(text)
          PY
          git rm .github/workflows/structures-plan-api-extraction.yml
          git diff --check
          git diff -- docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md .github/workflows/structures-plan-api-extraction.yml
          git config user.name 'architecture-refactor-ci'
          git config user.email 'architecture-refactor-ci@users.noreply.github.com'
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'Record accepted castle Structures API extraction'
          git push origin HEAD:${{ github.ref_name }}
