name: Apply accepted Vegetation checklist
on:
  push:
    branches: [refactor/system-boundaries-foundation-storage]
    paths: [.github/workflows/update-vegetation-plan-final.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          reps={
          '**Current focus:** Cutover 10 Vegetation — final Api/Runtime ownership cutover':'**Current focus:** Cutover 11 Net — final Api/Runtime ownership decomposition',
          '| 10 — Vegetation | **In progress — current** | Kentridge top-surface reads use Storage.Api and terrain sampling uses Terrain.Api; `Vegetation.Api` now owns stable tree species/instance/profile values with the original Unity GUID; WorldGen Voxel consumes Vegetation.Api only | isolate mutable tree state/skeleton/damage Runtime and cut Rendering to Api-only presentation reads |':'| 10 — Vegetation | **Complete** | `Vegetation.Api` owns stable placement/profile/damage/presentation values; mutable tree state, skeleton generation and damage live in `Vegetation.Runtime`; WorldGen and Rendering consume Api only; legacy Core/broad Vegetation ownership is gone; parity accepted | none |',
          '| 11 — Net | **Partial dependency cleanup** | authoritative edit application callers now consume Storage mutation capability | full Net.Api/Runtime decomposition, structural/residency/snapshot ownership cleanup |':'| 11 — Net | **In progress — current** | authoritative edit application callers consume Edits.Api/Storage capabilities; structural graph and duplicate edit wrapper are already gone | final Net.Api/Runtime decomposition, residency/snapshot ownership cleanup, Api-only dependency cut |',
          '- Latest accepted code gate: `73c81025ad313be78d47449ec6185d0dc0519361` — 383 tests, 370 passed, exactly the same 13 known baseline failures. Accepted Vegetation.Api value slice: `ProceduralTreeTypes.cs` moved to `Vegetation/Api` with its Unity GUID preserved and now owns `TreeSpecies`, `TreeLeafStyle`, `TreeInstance`, `TreeSpeciesProfile`, and `TreeSpeciesProfiles`; WorldGen Voxel references Vegetation.Api rather than broad/Core Vegetation.':'- Latest accepted code gate: `0aebbc56e14a4bfe1178b086a38419d1f0642b28` — 384 tests, 371 passed, exactly the same 13 known baseline failures. Final Vegetation Runtime/presentation cutover: mutable tree state, skeleton generation and damage are Runtime-owned; Rendering consumes Vegetation.Api-only snapshots/read contracts; the additional test is passing and no failure names changed.',
          '- [ ] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.':'- [x] mutable tree state, skeleton generation and damage implementation moved to Vegetation.Runtime.',
          '- [ ] Rendering consumes Vegetation.Api-only read/presentation contracts.':'- [x] Rendering consumes Vegetation.Api-only read/presentation contracts.\n- [x] Final Vegetation Runtime/presentation cutover accepted at `0aebbc56e14a4bfe1178b086a38419d1f0642b28`: 384 total / 371 passed / exact same 13 known baseline failures.',
          '- [ ] no `VoxelEngine.Core.Vegetation` namespace remains;':'- [x] no `VoxelEngine.Core.Vegetation` namespace remains;',
          '- [ ] Rendering references Vegetation.Api, not Runtime;':'- [x] Rendering references Vegetation.Api, not Runtime;',
          '- [ ] mutable `TreeWorldState` is internal Runtime state;':'- [x] mutable `TreeWorldState` is internal Runtime state;',
          '- [ ] tree damage/skeleton/render tests pass.':'- [x] tree damage/skeleton/render tests pass.',
          '### 10. Vegetation\n\n- [ ] create Vegetation.Api/Runtime\n- [ ] remove `VoxelEngine.Core.Vegetation` namespace\n- [ ] isolate tree state/build/damage implementation\n- [ ] expose stable placement/damage/render contracts\n- [x] update Kentridge vegetation to Storage.Api + Vegetation.Api\n- [ ] update Rendering to Vegetation.Api':'### 10. Vegetation\n\n- [x] create Vegetation.Api/Runtime\n- [x] remove `VoxelEngine.Core.Vegetation` namespace\n- [x] isolate tree state/build/damage implementation\n- [x] expose stable placement/damage/render contracts\n- [x] update Kentridge vegetation to Storage.Api + Vegetation.Api\n- [x] update Rendering to Vegetation.Api',
          }
          for old,new in reps.items():
              n=s.count(old)
              if n!=1: raise SystemExit(f'expected one match, found {n}: {old[:90]}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git rm .github/workflows/update-vegetation-plan-final.yml
          git diff --check
          git config user.name architecture-refactor-ci
          git config user.email architecture-refactor-ci@users.noreply.github.com
          git add docs/ARCHITECTURE_IMPLEMENTATION_PLAN.md
          git commit -m 'docs: mark Vegetation cutover complete'
          git push origin HEAD:${{ github.ref_name }}
