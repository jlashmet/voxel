name: Cutover 13 accept 8f7fc088

on:
  push:
    branches:
      - refactor/system-boundaries-foundation-storage
    paths:
      - .github/workflows/cutover13-accept-8f7fc088.yml

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f7fc088445388059864615d6d5c31a72dcfa722

      - name: Verify current architecture inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('Assets/Scenes/Showcase')
          rows = []
          for p in sorted(root.glob('*.cs')):
              text = p.read_text(errors='ignore')
              refs = sorted(set(re.findall(r'^using\s+(VoxelEngine\.[\w.]*Runtime(?:\.[\w.]+)?)\s*;', text, re.M)))
              if refs:
                  rows.append((p.name, refs))
          print(f'RUNTIME_COUPLED_FILES={len(rows)}')
          for name, refs in rows:
              print(name + ': ' + ', '.join(refs))
          if len(rows) != 5:
              raise SystemExit(f'expected 5 Runtime-coupled Showcase files, got {len(rows)}')

          asmdef = (root / 'VoxelEngine.Showcase.asmdef').read_text()
          runtime_refs = sorted(set(re.findall(r'"(VoxelEngine\.[^"]+\.Runtime)"', asmdef)))
          print(f'RUNTIME_ASMDEF_REFS={len(runtime_refs)}')
          for ref in runtime_refs:
              print('ASMDEF ' + ref)

          terrain = (root / 'TerrainLookdev.cs').read_text()
          if re.search(r'^using\s+VoxelEngine\..*Runtime', terrain, re.M):
              raise SystemExit('TerrainLookdev still imports Runtime')
          if 'VoxelRenderBridge' in terrain or 'ProfileBlockStore' in terrain:
              raise SystemExit('TerrainLookdev still leaks concrete renderer/profile runtime')

          far = (root / 'VoxelFarTerrain.cs').read_text()
          if 'VoxelEngine.Rendering.Runtime' in far or 'VoxelEngine.Structures.Runtime' in far:
              raise SystemExit('VoxelFarTerrain still imports Runtime')

          stale = []
          for p in sorted(root.glob('TerrainLookdev*.cs')):
              for i, line in enumerate(p.read_text(errors='ignore').splitlines(), 1):
                  if 'ref writer' in line:
                      stale.append(f'{p}:{i}:{line.strip()}')
          if stale:
              print('\n'.join(stale))
              raise SystemExit('stale ref writer calls remain')
          PY

  editmode:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f7fc088445388059864615d6d5c31a72dcfa722

      - name: Run Unity EditMode suite
        shell: bash
        run: |
          mkdir -p Artifacts/Cutover13-8f7fc088
          tools/unity-run.sh \
            -batchmode -nographics -job-worker-count 1 \
            -projectPath "$GITHUB_WORKSPACE" \
            -runTests -testPlatform EditMode \
            -testResults "$GITHUB_WORKSPACE/Artifacts/Cutover13-8f7fc088/results.xml" \
            -logFile "$GITHUB_WORKSPACE/Artifacts/Cutover13-8f7fc088/unity.log" || true
          test -s Artifacts/Cutover13-8f7fc088/results.xml

      - name: Verify accepted parity
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('Artifacts/Cutover13-8f7fc088/results.xml')
          root = ET.parse(path).getroot()
          cases = root.findall('.//test-case')
          failed = sorted(c.get('fullname') or c.get('name') for c in cases if c.get('result') == 'Failed')
          passed = sum(1 for c in cases if c.get('result') == 'Passed')
          total = len(cases)
          expected = sorted([
            'VoxelEngine.Tests.PlayMode.ChainCombatEnemyAIV8Tests.CurrentCascadeLabBootsWithEnemyAIStack',
            'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.BattleResetClearsSharedPlanHistoryAndGhostBackToStart',
            'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.PlannerBootsWithGhostBoardAndVisualLayer',
            'VoxelEngine.Tests.PlayMode.ChainCombatExecutionPlanV9Tests.SharedPlanExecutionRequiresEveryLivingPlayerReady',
            'VoxelEngine.Tests.PlayMode.ChainCombatMechanicsV2Tests.CascadeLabControllerBootsFourPlayerBattle',
            'VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.CommittingApprovedPlanPreservesReadyForEnemyHandoff',
            'VoxelEngine.Tests.PlayMode.ChainCombatPlanApprovalV9Tests.EditingAnApprovedPlanRevokesEveryReadyApproval',
            'VoxelEngine.Tests.PlayMode.ChainCombatPrototypeTests.ControllerBootsPlayableBattlePresentation',
            'VoxelEngine.Tests.EditMode.KentridgeAnchorUndercroftTests.AnchorUndercroftsOccupyPubAndWarehouseSupportFacesWithoutAddingGameplayStructures',
            'VoxelEngine.Tests.EditMode.KentridgeGenerationTests.DistrictTerracesCreateNeighbourhoodScaleShelves',
            'VoxelEngine.Tests.EditMode.KentridgeInfrastructureTests.UrbanInfrastructureStaysSeparateFromStableGameplayStructures',
            'VoxelEngine.Tests.EditMode.KentridgeUrbanFabricTests.UrbanFabricCatalogueRealizesAllEightBlocksAsIndividualBuildings',
            'VoxelEngine.Tests.EditMode.SurfaceRingBandTests.RingsDoNotReachBeyondTheStreamingRadius',
          ])
          print(f'TOTAL={total} PASSED={passed} FAILED={len(failed)}')
          for name in failed:
              print('FAILED ' + name)
          if (total, passed, len(failed)) != (387, 374, 13):
              raise SystemExit('Unexpected test counts')
          if failed != expected:
              raise SystemExit('Failed-test set changed')
          PY

      - name: Upload EditMode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutover13-8f7fc088-editmode
          path: Artifacts/Cutover13-8f7fc088/
